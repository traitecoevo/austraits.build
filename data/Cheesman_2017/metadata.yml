contexts:
- context_property: fire history
  category: plot_context
  var_in: fire_history
  values:
  - find: recent burning event
    value: last burnt less than 1 year ago
    description: savannah with evidence of a recent (less than 1 year) burning event
      at sampling in April 2015
  - value: fire history not known
    description: fire history not known
- context_property: topography
  category: plot_context
  var_in: topography
  values:
  - value: preferential flow path or creek
    description: eucalypts associated with obvious preferential flow paths or creeks,
      although no surficial water was present at sampling
  - value: not associated with preferential flow path or creek
    description: eucalypts not reported as associated with preferential flow paths
      or creeks
traits:
- var_in: leaf_area
  unit_in: cm2
  trait_name: leaf_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Thawed leaf samples were scanned (Cannon LiDE 120, Cannon Australia) and
    then dried at 60 °C until constant mass to determine leaf mass per area (LMA).
    ^p All values are reported as average of three replicate trees at each station
    ±1 SD. ^p Mean area of individual leaves, from 12 leaves per tree, averaged across
    three trees.
- var_in: stem_water_delta18O
  unit_in: '{delta}[ppth]'
  trait_name: stem_water_delta18O
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Source water held within thawed branch tissue was allowed to equilibrate
    within vials for 24 h before being split into three subsections and repeatedly
    analysed for δ18OH2O and δ2HH2O using Microwave Extraction-Isotope Ratio Infrared
    Spectroscopy described by Munksgaard et al. (2014). Calibration of δ18O and δ2H
    values to the Vienna Standard Mean Ocean Water scale was carried out by analysis
    of secondary water standards presented on cellulose filters. ^p All values are
    reported as average of three replicate trees at each station ±1 SD. ^p Water extracted
    from bark-stripped branch sections.
- var_in: leaf_cellulose_delta18O
  unit_in: '{delta}[ppth]'
  trait_name: leaf_cellulose_delta18O
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Leaf tissue was then ground (FOSS Cyclotec 1093, Foss North America, USA)
    before extraction of cellulose for δ18O analysis. ^p All dried leaf and branch
    sections (i.e., 33 of each) were subjected to cellulose extraction using the standard
    Brendel method modified for small samples (Brendel et al. 2000). [...] δ18O values
    of cellulose were measured using a ThermoScientific High Temperature Conversion
    Elemental Analyser coupled via a ConFloIV to a ThermoScientific Delta V PLUS IRMS
    at James Cook University. Repeat extractions and analyses of a laboratory standard
    (Chemwipe cellulose) between batches were within ±0.4‰ (1SD) for δ18Ocellulose.
    ^p All values are reported as average of three replicate trees at each station
    ±1 SD.
- var_in: stem_water_delta2H
  unit_in: '{delta}[ppth]'
  trait_name: stem_water_delta2H
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Source water held within thawed branch tissue was allowed to equilibrate
    within vials for 24 h before being split into three subsections and repeatedly
    analysed for δ18OH2O and δ2HH2O using Microwave Extraction-Isotope Ratio Infrared
    Spectroscopy described by Munksgaard et al. (2014). Calibration of δ18O and δ2H
    values to the Vienna Standard Mean Ocean Water scale was carried out by analysis
    of secondary water standards presented on cellulose filters. ^p All values are
    reported as average of three replicate trees at each station ±1 SD. ^p Water extracted
    from bark-stripped branch sections.
- var_in: wood_cellulose_delta18O
  unit_in: '{delta}[ppth]'
  trait_name: wood_cellulose_delta18O
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: All dried leaf and branch sections (i.e., 33 of each) were subjected to
    cellulose extraction using the standard Brendel method modified for small samples
    (Brendel et al. 2000). [...] δ18O values of cellulose were measured using a ThermoScientific
    High Temperature Conversion Elemental Analyser coupled via a ConFloIV to a ThermoScientific
    Delta V PLUS IRMS at James Cook University. Repeat extractions and analyses of
    a laboratory standard (Chemwipe cellulose) between batches were within ±0.4‰ (1SD)
    for δ18Ocellulose. ^p All values are reported as average of three replicate trees
    at each station ±1 SD. ^p Cellulose extracted from bark-stripped branch sections.
- var_in: stem_water_content_per_fresh_mass
  unit_in: '%'
  trait_name: stem_water_content_per_fresh_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Source water held within thawed branch tissue was allowed to equilibrate
    within vials for 24 h before being split into three subsections and repeatedly
    analysed for δ18OH2O and δ2HH2O using Microwave Extraction-Isotope Ratio Infrared
    Spectroscopy described by Munksgaard et al. (2014). ^p All values are reported
    as average of three replicate trees at each station ±1 SD. ^p Water extracted
    from bark-stripped branch sections, as % of wet mass.
- var_in: stem_dry_matter_content
  unit_in: mg/g
  trait_name: stem_dry_matter_content
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Source water held within thawed branch tissue was allowed to equilibrate
    within vials for 24 h before being split into three subsections and repeatedly
    analysed for δ18OH2O and δ2HH2O using Microwave Extraction-Isotope Ratio Infrared
    Spectroscopy described by Munksgaard et al. (2014). ^p All values are reported
    as average of three replicate trees at each station ±1 SD. ^p Calculated as 1000
    - 10 x branch water content (% of wet mass), where branch water content is the
    water extracted from bark-stripped branch sections.
