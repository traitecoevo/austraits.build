source:
  primary:
    key: Cheesman_2017
    bibtype: Article
    year: '2017'
    author: Alexander W. Cheesman and Lucas A. Cernusak
    title: 'Infidelity in the outback: climate signal recorded in Δ18O of leaf but
      not branch cellulose of eucalypts across an Australian aridity gradient'
    journal: Tree Physiology
    volume: '37'
    number: '5'
    pages: 554--564
    doi: 10.1093/treephys/tpw121
contributors:
  data_collectors:
  - last_name: Cheesman
    given_name: Alexander W.
    ORCID: 0000-0003-3931-5766
    affiliation: College of Science and Engineering, James Cook University, Cairns,
      QLD, Australia
    additional_role: contact
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(trait != "leaf_mass_per_area") |>
      dplyr::bind_rows(
        data |>
          dplyr::filter(trait == "stem_water_content_per_fresh_mass") |>
          dplyr::mutate(
            trait = "stem_dry_matter_content",
            trait_value = 1000 - 10 * trait_value
          )
      )
    '
  collection_date: 2015-04
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: To test the relative roles of leaf-water enrichment and source water
    in setting the oxygen isotope composition of leaf and branch wood cellulose of
    eucalypts across an aridity gradient, and so whether wood cellulose records a
    climate signal.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: In April 2015, 11 sampling sites were selected within the state
    of Queensland along a 900 km transect from the edge of the Australian wet tropics
    bioregion towards the Simpson desert (Figure 1, Table 1). On a 30-year time-scale
    these sites experienced an average annual rainfall of between 235 and 1400 mm
    and average RH at 9 a.m. of between 42 and 82% and at 3 p.m. of between 24 and
    60% (based on extraction from gridded 1976–2005 data; Australian Bureau of Meteorology
    www.bom.gov.au). During the sampling month (tail end of the local dry season)
    monthly precipitation ranged from 0 to 38 mm, with an average daytime RH, calculated
    from mean maximum temperature and vapour pressure at 3 p.m., of 17.8–53.4%. There
    was a strong and significant correlation between annual precipitation and annual
    mean RH (Pearson''s correlation = 0.97, df = 9, P < 0.001) as well as between
    multi-decadal RH and RH calculated for the sampling period (Pearson''s correlation
    = 0.97, df = 9, P < 0.001). These correlations highlight the existence of a substantial
    and dependable aridity gradient across the 11 sampling sites. ^p At each sampling
    station, 12 leaves and an associated branch section (1 cm diameter, 5 cm length)
    were collected from an exposed branch of three representative trees of the same
    eucalypt species (Table 2). Leaves were placed in paper bags and then into ziplock
    bags, while branch sections were immediately stripped of bark and placed into
    50 ml centrifuge tubes. All samples were double sealed and frozen for transportation
    back to the laboratory.
  original_file: Tables 1-3 of Cheesman & Cernusak (2017), transcribed into raw/trait_data.csv
    and raw/location_data.csv
  notes: data.csv is transcribed from Tables 2 and 3 (station means ± SD of three
    trees), plus raw/location_data.csv from Table 1. Leaf mass per area (Table 2)
    is not mapped into AusTraits, because the individual-tree values for the same
    trees are in Alam_2026. Table 1 also gives 9 a.m. and 3 p.m. relative humidity
    and April 2015 precipitation, relative humidity and NDVI per station, which are
    not mapped.
