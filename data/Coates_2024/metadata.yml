traits:
- var_in: PollinationVectorSourceTerm
  unit_in: .na.character
  trait_name: pollination_vector_known
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: Individuals
  methods: We observed pollinators at each study site while plants were flowering.
    We sampled several times per week at each plot across the sample period and ensured
    that each plot was sampled during different times of day. Each of our sampling
    periods consisted of 30 min of observation, whereupon we walked through each plot
    and recorded which pollinator species were visiting which plant species and the
    frequency of each interaction. We only recorded a visit if an insect appeared
    to contact the reproductive parts of a flower. We counted all insect taxa that
    visited flowers (Diptera, Hymenoptera, Lepidoptera, Orthoptera, Coleoptera) and
    took efforts to ensure that sampling was conducted so that observers' shadows
    did not land on flower-visiting insects. We identified insect species on the wing
    (i.e. without collection) collecting voucher specimens for later identification
    when necessary. We identified plants in the field using field guides and advice
    from locally expert botanists. At the beginning and end of each sampling period,
    we recorded air temperature, windspeed and humidity using a Kestrel 3000 Weather
    Meter (Kestrel Australia, Victoria, Australia), averaging these values for each
    sampling period. We sampled between 09:00 and 05:00 h from October 2021 to February
    2022. Because the flowering season was shorter at the higher sites, our sampling
    effort was unevenly spread across sites (Supporting information), with a higher
    sampling effort at lower sites. Whereas we had expertise in identification of
    Hymenoptera and Diptera, we sought identification assistance from Hermes Escalona
    for Coleoptera and Michael Braby for Lepidoptera at The Australian National Insect
    Collection, CSIRO, and Michael Batley for cryptic Hymenoptera at The Australian
    Museum. Using reference material at the Australian National Insect Collection,
    we identified insects to the highest taxonomic resolution, in most case species,
    with morphospecies identifiers assigned when necessary. We deposited all 1422
    insect specimens into the Australian National Insect Collection.
