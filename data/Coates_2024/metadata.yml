questions:
  question1: When matching taxonomy to our list of allowed values (at various ranks),
    we noted 3 possible errors in your data. You listed Colletidae as in the order
    Hymenptera and Scarabaeidae as in the order Diptera, but I believe these should
    both be Coleoptera. Also, `Chrysadidae sp.` is listed for 126 rows of data, but
    this name is not turning up in my searches. Is this possibly meant to be `Chrysididae`,
    the cuckoo wasps? (https://www.inaturalist.org/taxa/126149-Chrysididae). As a
    starting point, I've made the three corrected alignments proposed here.
