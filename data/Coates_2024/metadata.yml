  taxon_name: Plant
  location_name: site
  description: We examined pollination interaction networks across an elevational
    gradient from 9300-2000 m a.s.l. in southern Australia, to determine the underlying
    patterns of pollinator activity and their interactions with flowers.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Study area ^p We conducted flower visitor surveys in Kosciuszko
    National Park, New South Wales, Australia from October 2021 to March 2022. This
    period captured the onset of flowering at montane and subalpine sites following
    snowmelt, as well as the subsequent peak alpine flowering period (Costin et al.
    2000). Being a whole of season study, our survey accommodated the peak of flowering
    for almost all the plant species present across each of the elevation bands. ^p
    To capture an elevational gradient, we selected six study sites, with two plots
    per site, starting from ~ 930 m to above the tree line at ~ 2000 m, with sites
    approximately every 200 m of elevation gain (930, 1200, 1460, 1640, 1840, 2000
    m), with approximately 25 km of horizontal extent. This design emphasised repeated
    sampling throughout the season within each study site, rather than replication
    of sites at each elevation, at the expense of repeated sampling at each site.
    All study sites were located along the northeast side of the mountain range, within
    the Perisher Valley area (Fig. 1) ^p Sampling protocol ^p We conducted sampling
    sessions during a wide range of weather conditions. While flower visitor surveys
    are often only conducted during fine weather (Brittain et al. 2013), Goodwin et
    al. (2021) showed that in Australian alpine ecosystems, pollinators remain active
    in other weather conditions, with different taxa responding distinctly to conditions.
    To capture this range of responses, our study primarily sampled visitors in warmer
    weather (> 10°C), but we also regularly conducted samplings in cooler conditions
    (5-10°C) to include species tolerant of lower temperatures (Supporting information).
    Temperature during sampling sessions ranged from 5 to 28°C, windspeed ranged from
    0 to 23 kmh, and humidity ranged from 27 to 93%. Due to a strong La Niña event,
    temperatures during the sample period were below long-term averages, while rainfall
    was above average (Bureau of Meterology 2023). ^p At each of the six elevation
    bands, we established two 50 x 50 m plots nearby (50-100 m) to one another. We
    chose plots in order to maximise the diversity and abundance of flowering plants
    at each site. We observed pollinators at each study site while plants were flowering.
    We sampled several times per week at each plot across the sample period and ensured
    that each plot was sampled during different times of day. Each of our sampling
    periods consisted of 30 min of observation, whereupon we walked through each plot
    and recorded which pollinator species were visiting which plant species and the
    frequency of each interaction.
