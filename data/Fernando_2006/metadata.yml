  collection_date: 2006
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  description: To determine whether leaf manganese in Mn-hyperaccumulating and strongly
    Mn-accumulating tree species is sequestered primarily in the photosynthetic (palisade
    mesophyll) tissues, as previously found in Gossia bidwillii.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Leaves of Gossia bidwillii (Benth.) N. Snow & Guymer, Macadamia
    integrifolia Maiden and Betche and Macadamia tetraphylla L. A. S. Johnson were
    collected from subtropical rainforest locations in the Mt Glorious area near Brisbane,
    Australia (27°18′07″S, 152°41′04″E), while Virotia neurophylla (Guillaumin) Virot
    leaves were collected from tropical rainforest near Nouméa, New Caledonia (22°5′45″S,
    166°40′8″E). Both habitats occur on Mn-available substrates (Jaffré, 1979; Fernando
    et al., 2006). Branchlets were collected and immediately wrapped in humid packaging
    to preserve field freshness. Intact, mature leaves were selected for light microscopy,
    PIXE/EDAX and total leaf analyses. ^p The mid-transverse areas of fresh mature leaves
    were sampled for PIXE localization. ^p At least two leaves each from six G. bidwillii
    trees were examined in this way, while at least two leaves from a single plant of
    each of the other three species were examined.
  original_file: data extracted from the source PDF (Table 1 and text)
  notes: Data for additional traits leaf_Mn_sequestration_tissue (primary site of
    leaf Mn sequestration from PIXE/EDAX mapping) in raw/trait_data.csv.
