traits:
- var_in: leaf_Mn_per_dry_mass
  unit_in: ug/g
  trait_name: leaf_Mn_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: For G. bidwillii, M. integrifolia and M. tetraphylla, approx. 0.3 g of
    washed, dried and ground leaf material was digested in 5 ml of 70% nitric acid
    at 125°C for 2 h. Digests were treated with 3 ml of 30% hydrogen peroxide and
    diluted to 75 ml with water. Analyses were performed by inductively coupled plasma-optical
    emission spectroscopy (ICP-OES; Varian Vista AX; Varian Inc., Melbourne, Australia)
    against blanks which were also digested and diluted as per the samples. A series
    of acidified aqueous standards (0.5-40 mg l-1) was used for quantification. ^p
    Approximately 50-mg samples of washed, dried and ground V. neurophylla leaf material
    were mineralized in a Teflon bomb using microwave digestion (Prolabo, A301, VWR
    Fontenay-sous-Bois, France) with successive additions of HNO3, H2O2 and HF. Blanks
    and reference material (Lichen-336; International Atomic Energy Agency, Vienna,
    Austria) were prepared under the same conditions. Total Mn concentrations in digested
    samples were determined by inductively coupled plasma-mass spectrometry (ICP-MS)
    (X7 series; Thermo Electron Corporation, Courtaboeuf, France) using 1 ug 89Y l-1
    as an internal standard. Linear calibration curves were obtained by analysis of
    a range (0.5-25 mg Mn l-1) of SPEX certiPrep standards (Metuchen, NJ, USA).
