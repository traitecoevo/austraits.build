  '
  collection_date: date
  taxon_name: Plant_name
  trait_name: Poll_evidence
  value: Pollinator_to_use
  location_name: location_txt
  description: Documents the plant food resources (nectar, flower parts, leaves, exudates,
    seeds, elaiosomes and fruits) used by birds in coastal dune communities along
    the New South Wales coastline, based on opportunistic observation of feeding birds
    and pellet analysis between March 1995 and July 1997.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: METHODS ^p Information on plant food types was obtained through
    opportunistic, direct observation of feeding birds and analysis of pellets over
    the period March 1995 to July 1997. Pellet records were confined to those species
    whose pellets could be readily recognized, namely Pied Currawongs Strepera graculina
    and Ravens Corvus spp. Particular attention was placed on birds feeding at flowers
    to determine if insects, nectar, or both, were taken. ^p As a consequence of the
    non-systematic sampling, the observations may be biased towards easily-observed
    bird species, common plant species, plant species that flowered or fruited regularly
    over the study period, and to situations in which I suspected particular birds
    to be foraging for particular plant foods. Also, greater attention was allocated
    to Bitou Bush Chrysanthemoides monilifera subsp. rotundata and Monotoca Monotoca
    elliptica, species in which I had a particular research interest. ^p STUDY SITES
    ^p Data on birds' diets were collected from widely separated locations along the
    New South Wales coastline, from Lennox Head in the north to Eurobodalla National
    Park (Moruya Heads) in the south. The bulk of the observations originate from
    four sites at which extensive surveys were completed, namely Myall Lakes National
    Park (NP) (32°32'S, 152°18'E), Perkins Beach Recreation Reserve, Primbee (34°31'S,
    150°53'E), Eurobodalla NP (35°56'S, 150°10'E) and Yuraygir NP/Bundjalung Nature
    Reserve (29°24'S, 153°21'E). The remaining sites (Killalea State Recreation Area/Bass
    Point 34°36'S, 150°52'E; Botany Bay NP, Kurnell 34°02'S, 151°13'E; Seven-mile
    Beach NP 34°49'S, 150°45'E; Stuart Park, North Wollongong 34°25'S, 150°55'E; Dunbogan
    31°39'S, 152°49'E; and Flat Rock, Lennox Head 28°50'S, 153°36'E) were visited
    sporadically and on few occasions. ^p Bitou Bush infestation of dune communities
    characterized all sites, although each area also had sections of the coastline
    free from this weed species. The natural vegetation consisted of Hairy Spinifex
    Spinifex sericeus grassland on the foredune, coastal scrub (usually a mix of Coastal
    Wattle Acacia sophorae, Coastal Beard-heath Leucopogon parviflorus and Coastal
    Tea-tree Leptospermum laevigatum) grading into either sclerophyll forest (dominated
    by either Swamp Mahogany Eucalyptus robusta, Bangalay E. botryoides or Blackbutt
    E. pilularis), littoral rainforest, heath or Banksia/Leptospermum scrub. Carolin
    and Clarke (1991) provide a more detailed description of typical coastal dune
    vegetation in eastern Australia. New South Wales Agriculture conducted Bitou Bush
    control works at the main study sites (see Toth et al. 1993 for a description
    of New South Wales Agriculture Bitou Bush control techniques).
  original_file: in raw data folder
  notes: none
