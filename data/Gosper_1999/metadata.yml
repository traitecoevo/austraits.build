  flower_visitor_type: assumed pollinator
  methods: All records were from observation with binoculars. Evidence for allocation
    of pollination trait, assumed_pollinator = bird fed at flowers in a manner consistent
    with pollination, seeking nectar and touching anthers/stigma; nectar_thief = obtained
    nectar from flowers in a way that did not involve touching anthers/stigma; flower_predator
    = consumed parts of or whole  flowers
