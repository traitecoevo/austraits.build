    especially as bark traits within a single species may vary between locations (Nolan
    et al. 2020). A detailed description of the main bark types is provided by Horsey
    and Watson (2012). Species observations are summarised in Supporting Information
    (Tables S1 and S2).
- var_in: Ribboning category
  unit_in: .na
  trait_name: bark_ribbon_type
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We created a classification of bark traits for each species using three
    main sources, PlantNET (2004), EUCLID (Slee et al. 2006) and Boland et al. (2006).
    They were compared and categorised into 12 broad bark types based on the bark
