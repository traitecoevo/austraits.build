- var_in: Growth form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Expert knowledge and literature, including PlantNET (2004), EUCLID (Slee
    et al. 2006) and Boland et al. (2006).
