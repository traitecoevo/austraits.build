dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(
        location_name = "NSW",
        bark_type_by_growth_form = `Growth form`,
        `Species name` = str_remove_all(`Species name`, fixed("?")) |> str_squish()
      )
  '
  collection_date: '2025'
  taxon_name: Species name
  location_name: location_name
  description: In this study, we examined the fire regime (fire frequency and intensity)
    and bioclimatic distributions of 12 contrasting eucalypt bark types, and provided
    maps of eucalypt bark type distributions for use in fire behaviour modelling.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 2.1 Study Area ^p Observations in this study covered all major
    vegetation types of New South Wales, including rainforests, wet and dry sclerophyll
    forests, grassy woodlands, heathlands, alpine ecosystems, semi-arid woodlands,
    arid shrublands, wetlands and grasslands (Keith 2004; Figure S1). Roughly 79%
    of woodland and forest areas in the state are dominated by eucalypts (MIG 2008).
    The climate exhibits a strong aridity gradient from the coastal areas inland,
    as well as strong north–south rainfall seasonality. Summer-dominant rainfall occurs
    in the subtropical northern regions, transitioning to evenly distributed rainfall
    in the mid-latitudes to winter-dominant rainfall in the temperate southern regions
    (Bureau of Meteorology 2023; Figure S2). The region has a mean annual air temperature
    ranging from 3.9°C to 21.0°C, mean annual precipitation (MAP) from 183 to 2443
    mm year,−1 and elevation of −11 to 2080 m.a.s.l. (Figure S3). ^p 2.2 Species Occurrence
    Records ^p Data available from the BioNet Atlas Systematic Flora Surveys (formerly
    the NSW Office of Environment and Heritage, now the NSW Department of Climate
    Change, Energy, the Environment and Water; DCCEEW 2020) were used to generate
    species presence and absence data for 5949 locations across New South Wales. The
    flora surveys employ the biodiversity assessment method (NSW Department of Planning,
    Industry and Environment 2020), which involves recording all plant species found
    within a 20 m by 20 m plot. Surveys were filtered to include only systematic surveys
    from 1990 onward with location accuracy recorded as being equal to, or less than,
    10 m to ensure only sites with the most up-to-date and accurate geolocation were
    included (see Supporting Information for addition details). Species records were
    processed in R version 4.1.3 (R Core Team 2022). In total 176 eucalypt species
    were categorised by bark type (Tables S1 and S2), and 16,568 presences and 54,820
    absences were generated for 5949 sites (Figure S1). ^p We created a classification
    of bark traits for each species using three main sources, PlantNET (2004), EUCLID
    (Slee et al. 2006) and Boland et al. (2006). They were compared and categorised
    into 12 broad bark types based on the bark classification conventions of Horsey
    and Watson (2012; Figure 1). Care was taken in researching possible conflicts
    and inconsistencies, and any observations with suspect bark type assignments were
    removed from the dataset. The bark types examined in this study apply to species
    in a broad sense and are not always sharply defined, especially as bark traits
    within a single species may vary between locations (Nolan et al. 2020). A detailed
    description of the main bark types is provided by Horsey and Watson (2012). Species
    observations are summarised in Supporting Information (Tables S1 and S2).
  original_file: data downloaded from doi.org/10.6084/m9.figshare.22335757.v5
  notes: Some species had names formatted as `genus ?species` indicating naming uncertainty in Nicolle (2019). The `?` is removed from these taxon names as the dataset is read in; the uncertainty tag is retained in the data.csv file.
identifiers: .na
locations:
  NSW:
    latitude (deg): .na
    longitude (deg): .na
    description: variable Eucalypt vegetation types
    state: NSW
contexts:
- context_property: bark type by growth form
  category: entity_context
  var_in: bark_type_by_growth_form
  values:
  - find: mallee and tree
    value: mallee and tree forms
    description: Bark type and ribboning category apply to the species when growing
      in either mallee or tree form.
  - find: mallee only
    value: mallee form
    description: Bark type and ribboning category apply to the species when growing
      in mallee form.
  - find: mallee form bark type
    value: mallee form
    description: Bark type and ribboning category apply to the species when growing
      in mallee form.
  - find: tree only
    value: tree form
    description: Bark type and ribboning category apply to the species when growing
      in tree form.
  - find: tree form bark type
    value: tree form
    description: Bark type and ribboning category apply to the species when growing
      in tree form.
