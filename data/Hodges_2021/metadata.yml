dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(
        location_name = "south-eastern Australia",
        photosynthetic_pathway = lifeform
        ) |>
      group_by(species) %>%
        mutate(
          across(c(lifeform, photosynthetic_pathway, dormancytype),
                replace_duplicates_with_NA)
        ) |>
      ungroup()
  '
  collection_date: 2021
  taxon_name: species
  location_name: location_name
  description: Study to explore how native forbs and grasses in critically endangered
    grasslands and grassy woodlands respond to fire-related germination cues, such
    as smoke and heat, can benefit our understanding of both how species respond to
    fire and identify treatments which can be used to increase germination.
  basis_of_record: lab
  life_stage: adult
  sampling_strategy: We conducted a germination experiment to investigate the effects
    of smoke and heat both singly and in combination on germination speed and percent
    germination. There were four treatments, untreated control (no smoke, no heat),
    smoke alone, heat alone and a combination of smoke and heat. Smoke was applied
    by placing each replicate in glass vials and submerging the seeds for 24 h in
    20 ml of 10% smoke water solution made using smoke water concentrate diluted 1:10
    (sourced from Kings Park and Botanic Garden and prepared using methods described
    in Erickson et al. 2016). For the heat treatment, each replicate was placed in
    a nylon mesh bag and heated at 80°C for 90 min in a convection oven. The temperature
    and duration of the heat treatment was chosen based on soil temperature monitoring
    after a planned burn conducted in a natural temperate grassland in March 2018
    (data available in Hodges et al. 2021, table S3). For the combination treatment,
    heat was applied first followed by smoke using the above methods. Following application
    of smoke and heat, 3 replicates of 25 seeds per treatment were sown evenly spaced
    on 90mm Petri dishes with 1% water agar. Seeds of 16 species were collected by
    the lead author in 2018-2019, 19 species were purchased from nurseries or contracted
    seed collectors (collections from 2014 to 2019) and 20 were sourced from the National
    Seed Bank in Canberra, Australia (2010-2019). Seeds were collected from multiple
    adult plants to ensure some within-population genetic diversity was captured.
    Where possible, seeds were also collected from multiple sites and pooled to create
    a regional mix consisting of seeds collected across the study range. ^p Replicates
    were progressed through a series of incubation temperatures designed to simulate
    seasonal changes in temperature experienced across a calendar year in situ. Temperatures
    were chosen based on the 10-year average maximum and minimum temperatures for
    36 weather stations located across south-eastern Australia (Victoria, New South
    Wales and the Australian Capital Territory, weather data sourced from the Australian
    Bureau of Meteorology). First, seeds were placed within a Thermoline growth cabinet
    (Thermoline Model TRIL-120-1-VW/ BMS, Serial 30455, Thermoline Scientific, NSW,
    Australia) set to average autumn temperatures for the study range, that is 20/10°C
    alternating light/dark (12 h/12 h) for 42 days. The incubator was then set to
    average winter temperatures (12/5°C alternating light/dark) for a further 42 days
    and so on through spring (25/15°C alternating light/dark), summer (35/20°C alternating
    light/dark) and a second autumn (20/10°C alternating light/dark). The light/dark
    cycle was maintained at 12 h/12 h for all regimes. The experiment ran for a total
    of 210 days (5 incubation temperatures x 42 days each).
  original_file: data sourced from https://doi.org/10.6084/m9.figshare.16680322.
  notes: none
