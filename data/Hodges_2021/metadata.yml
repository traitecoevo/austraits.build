questions:
  question1: Do you have seed mass data for these species? Or other seed traits?
  question2: For Brunonia australis, the replicate data give mean germination of 40%
    for heat (32, 52, 36) and 24% for smoke (12, 28, 32), whereas Table 1 of Hodges
    et al. (2021, Ecological Management & Restoration) reports 24% for heat and 40%
    (significant increase) for smoke. Germination speeds match the replicate data's
    treatment labels. Which is correct?
  question3: For Wahlenbergia stricta, the replicate data give 4% germination for
    the control (4, 4, 4) and 0% for smoke, whereas Table 1 of Hodges et al. (2021,
    Ecological Management & Restoration) reports 0% for the control and 4% for smoke;
    germination speed values are also swapped between the two. Which is correct?
  question4: For Rytidosperma pallidum heat, the replicate data give mean germination
    of 59.3% (48, 80, 50), whereas Table 1 of Hodges et al. (2021, Ecological Management
    & Restoration) reports 99.3%. Germination speed matches (2.42). Which germination
    value is correct?
  question5: The species recorded in the data as Microseris lancelota is reported
    as Microseris walteri in Hodges et al. (2021, Ecological Management & Restoration).
    Which name is correct for this seed collection?
  question6: For the dormancy classes, what does "ys" stand for?
