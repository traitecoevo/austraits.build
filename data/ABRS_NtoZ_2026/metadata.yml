questions:
  question1: Elizabeth Wenk is listed as the data collector (she ran the extraction);
    the Flora of Australia profile authors are recorded per taxon in the profile_author
    column. Confirm this is the preferred attribution.
  question2: Parenthetical extremes (measurement_range = extreme rows) are not mapped.
    Should they be added as separate minimum / maximum records with a context (e.g.
    commonness_qualifier = rarely)?
  question3: Typical values that sources state only when atypical are recorded on trait_scoring_method
    = inferred rows (plant_growth_substrate terrestrial, plant_photosynthetic_organ leaf, parasitic
    not_parasitic, leaf_type broadleaf; rules in each trait's methods). Should woodiness also be
    inferred from growth form (tree, shrub -> woody; herb -> herbaceous)?
  question4: 'Nymphaea vaporalis petals are given as "mostly to (10-) 22-25 cm long, 1.8-2.5 cm wide"; 22-25 cm is about twice the length of its sepals (to 12 cm) and of the petals of any other Nymphaea (to c. 11.5 cm). Kept as given (flower_petal_length); check against the printed Flora.'
  question5: 'Acianthus borealis leaf is given as "15-15 x 15-35 mm" in the source (probably a typo in the length range). Kept as given (leaf_length 15 mm).'
  question6: 'Orchid substrates are mostly read from the Habitat text ("growing on trees, boulders and cliff faces" -> epiphyte lithophyte; "in freely draining sands" -> terrestrial), with the habitat sentence in plant_growth_substrate_description. Confirm.'
  question7: '5 values fall outside the allowed ranges in traits.yml and are excluded at build: flower_petal_length 115 mm (Nymphaea jacobsii subsp. jacobsii, genuine) and 220-250 mm (Nymphaea vaporalis, see question4) above the 100 mm maximum, flower_bract_length 0.5 mm (Cansjera leptostachya) below 1 mm, and a zero lower bound of peduncle_length (Nepenthes mirabilis "peduncle 0-20 cm long"). Consider widening the trait ranges.'
  question8: 'Terrestrial orchid genera (Caladenia, Caleana, Calochilus, Chiloglottis, Cheirostylis, Calanthe, Acianthus, Arthrochilus ...): plants "on granite outcrops", "on rocks", "in moss and lichen on rock surfaces" are scored terrestrial (term flagged "(terrestrial orchid genus)"), and "on rotting logs", "stumps", "tree roots" give no substrate; explicit "lithophytic" / "epiphytic" wording and living trees still count. Confirm, or should rock-surface species such as Caleana granitica be lithophyte?'
  question9: 'Chiloglottis genus Ecology: "Most species of Chiloglottis use this system of deception (male thynnine wasps) ..., but one species, C. cornuta, is self-pollinating" was copied (wasp, thynnine_wasp, deceit, scent_produced; inferred_from_genus) to every species except C. cornuta. Confirm this reading of "most".'
  question10: 'Caladenia genus Ecology "Species of Caladenia are deciduous and die back to a dormant, fleshy tuber" was copied as leaf_phenology deciduous to all Caladenia (inferred_from_genus); taxa whose own description says the leaf is withered at flowering keep only withered_at_flowering. Should both values be recorded?'
  question11: 'Pollination rewards are recorded in flower_pollinator_reward (deceit for sexual / food deception, nectar for labellum nectar). Earlier orchid genera (e.g. Arthrochilus "scents mimicking sexual pheromones") were vetted before this trait was used; backfill them?'
  question12: 'Caladenia fuscata petals are "6-1 x 2 mm" in the source (a reversed range; probably 6-10 or 6-11 mm); petal length and width were dropped. Caladenia viridescens labellum "17-22 x 0-14 mm": the zero width was dropped (length kept). Check against the printed Flora.'
  question13: '"Flowers freely after fire" is scored post_fire_flowering = fire_enhanced_flowering, and "Flowers freely only in wet years" / "poorly in dry years" as flowering_cues = rain. Confirm.'
  question14: 'Candidate traits new in this batch: sepal_club_length / _colour / _shape / _surface (Caladenia osmophores), basal_gland_* ("basal glands": on the column in Caladenia, on the labellum callus in Acianthus) and column_gland_* (explicitly "column glands"). Keep separate or merge?'
