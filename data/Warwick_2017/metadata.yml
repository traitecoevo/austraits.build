    "stem_vessel_perforation_plate_type", "wood_ray_cell_type", "wood_growth_ring_distinctiveness",
    "stem_intervessel_pit_arrangement", "stem_intervessel_pit_vesturing", "wood_fibre_wall_thickness_categorical",
    "wood_axial_parenchyma_arrangement", "stem_vessel_diameter",
    "stem_vessel_density", "stem_xylem_vulnerability_index",
    "wood_ray_cell_longitudinal_count", "wood_ray_cell_tangential_count"))
    '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  source_id: source_id
  description: To test whether climate and taxonomic section influence the wood anatomy
    of Acacia sensu stricto, by comparing qualitative and quantitative xylem characters
    of species from four taxonomic sections across a 1200 km aridity gradient in New
    South Wales.
  basis_of_record: field
  life_stage: life_stage
  sampling_strategy: New South Wales, Australia, holds the majority of the eastern
    centre of Acacia species richness, surpassed only by Western Australia (Maslin,
    1997). A wide spectrum of climates exists in the state owing to continental, orographic
    and coastal effects, making the region suitable for the sampling requirements
    of this study. Samples were collected from trees and shrubs in their natural habitats,
    across five different climate regions (Fig. 1). These regions range from xeric
    to mesic, and were grouped (with corresponding modified Köppen-Geiger classification)
    as - arid [desert - hot (persistently dry)]; semi-arid I [grassland - warm (persistently
    dry)]; semi-arid II ([grassland - hot (summer drought)]; temperate [temperate
    - no dry season (warm-hot summer)]; and sub-tropical (sub-tropical - no dry season)
    (Stern et al., 2000) (Table 1). Sample discs from usually three mature individuals
    of each species (two discs for six species) were taken close to the ground from
    either the single main stem or one of several vertical branches where basal branching
    was a feature, and were placed in 70 % ethanol. ^p Where possible, the species
    sampled were evenly selected from the four taxonomic sections of Acacia, the Botrycephalae,
    Juliflorae, Phyllodineae and Plurinerves (Table 2). Full and even coverage of
    each taxonomic section within each climate region was not achieved, mainly because
    the more mesic Botrycephalae is scarce in the semi-arid I region, and absent from
    the arid region, where there are also fewer species from the other three sections
    (Maslin and Pedley, 1988). ^p Mean annual precipitation (MAP) ranged from 237
    mm in the arid region to 1436 mm in the sub-tropical region (Table 1). The five
    climate regions ranged in monthly mean minimum temperature from 2 °C in the temperate
    region to 8 °C in the sub-tropical region and in monthly mean maximum temperature
    from 28 °C in the temperate region to 35 °C in the arid region. The altitude of
    collection ranged from 44-94 m above sea level (a.s.l.) in the sub-tropical region,
    78-191 m a.s.l. in the arid region, 162-221 m a.s.l. in the semi-arid I region,
    261-654 m a.s.l. in the semi-arid II region and from 17 to a maximum of 1290 m
    a.s.l. in the temperate region (Table 2). A total of 165 specimens from 54 species
    were collected from five contiguous climate regions. ^p Climate data for MAP and
    maximum and minimum temperatures for each collection site were determined using
    DIVA-GIS (Hijmans et al., 2012). ^p Stem material from 12 species, with three
    from each of the four major sections, and with three replicates from the same
    population of each species, was collected in the field during March–May 2010 and
    stored in 70% ethanol. The samples were collected from mature shrubs and trees,
    depending on growth form, across grassy sclerophyll woodlands to open layered
    forests at eight localities on the Northern Tablelands and the southern edge of
    the North Coast of New South Wales, Australia. The climate is warm–temperate,
    with warm summers and cool winters and a summer-dominant rainfall, and the area
    lies within the dry cool-temperate climate region of Thackway and Cresswell (1995)
    (Table 1). The wood samples will be incorporated in the Economic Botany collections
    at Kew (Kw; Lynch and Gasson 2010) and the herbarium vouchers are held in the
    NCW Beadle Herbarium at the University of New England. ^p The diameter of each
    specimen (branch) at its widest point was measured to the nearest millimetre.
  original_file: raw/trait_data.csv (Warwick_2017) and raw/trait_data_Whinder_2013.csv
    (Whinder_2013), extracted from the source PDFs.
  notes: The vulnerability index is given numerically only for the two extreme species
    in Whinder_2013 (Discussion); the other ten are shown only in its Fig. 5. Additional
    traits, wood_ray_width (categorical) and wood_crystal_location (Table 3 qualitative
    wood characters in both papers), and from Whinder_2013 only wood_apotracheal_parenchyma
    and wood_ray_frequency (count). Codes are decoded to space-delimited terms in
    trait_value. Warwick_2017 ray width codes 0 and 1 are decoded swapped relative
    to its printed legend (0 = uniseriate to biseriate, 1 = exclusively uniseriate),
    because Whinder_2013 gives identical codes for the same 12 temperate specimens
    with 1-3 cells (0) and uniseriate (1), and the Warwick_2017 figure captions and
    text agree. Warwick_2017 vessel diameter, vessel frequency, vulnerability index,
    ray height, ray width and ray frequency were measured per specimen but are published
    only as climate-region and section means (Figs 9, 10) and unlabelled species points
    (Figs 11, 12), so only the Whinder_2013 values for the 12 temperate species are
    in this dataset. Warwick_2017 locations are the distinct Table 2 coordinate and
    altitude combinations, named by climate region in table order. Whinder_2013 locations
    are its Table 1 localities; two species were sampled at each of The Glen NR and
    Uralla–Bundarra road with differing climate values or coordinates, so these are
    separate locations named by species.
  measurement_remarks: measurement_remarks
