- var_in: stem_vessel_diameter
  unit_in: um
  trait_name: stem_vessel_diameter
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: 3
  methods: Mean vessel diameter at widest point (µm), 25 measurements per specimen
    (TS). ^p Quantitative characters were measured using a Leitz DMRB light microscope
    (Leica, Wetzlar, Germany) with an Olympus (Olympus, Southend-on-Sea, UK) digital
    camera attached, and the associated AnalySIS software (Olympus Soft Imaging Solutions,
    Münster, Germany). Wherever possible, quantitative measurements were made between
    the third and fourth growth rings, to standardise comparisons between specimens.
    ^p Vessels were observed using TS at ×40 or ×100 magnifications, whereas rays
    were viewed using TLS at ×100 magnification. Maximum and minimum values are the
    single highest or lowest measurement recorded within a species and statistical
    analyses were carried out using Minitab 16 (Minitab, State College, PA, USA).
