questions:
  question1: Are you able to share the species means for vessel diameter, vessel frequency,
    ray height, ray width and ray frequency for the 42 arid, semi-arid and sub-tropical
    species - these were measured but are not tabulated anywhere (Warwick_2017 shows
    them only as climate-region and section means in Figs 9 and 10, and as unlabelled
    species points in Figs 11 and 12), whereas the 12 temperate species already have
    per-specimen values in Whinder_2013 Table 4
  question2: Are you able to share the NCW Beadle Herbarium voucher numbers and Kew
    Economic Botany (Kw) accession numbers? We can link in specimen identifiers.
  question3: life_stage is sapling for the 12 Warwick_2017 rows whose Table 2 plant
    form is Sapling, although its Methods say discs were taken from mature individuals.
    Seven of the 12 temperate species are listed as saplings in Warwick_2017, but
    Whinder_2013 says the same specimens were collected from mature shrubs and trees;
    here they are keyed as adults, since the trait values from Whinder were used.
  question4: For the qualitative characters scored in Table 3, when an entry lists
    several codes (e.g. vessel grouping "0, 1, 3") does that mean every specimen showed
    all of them or that different specimens had different values?
