contexts:
- context_property: fire severity
  category: plot_context
  var_in: fire_severity
  values:
  - value: extreme
    description: Burnt at extreme severity in the 2019-20 fires, assessed in the field.
  - find: high-extreme
    value: high to extreme
    description: Burnt at high to extreme severity in the 2019-20 fires, assessed
      in the field.
  - value: high
    description: Burnt at high severity in the 2019-20 fires, assessed in the field.
  - value: moderate
    description: Burnt at moderate severity in the 2019-20 fires, assessed in the
      field.
  - value: low
    description: Burnt at low severity in the 2019-20 fires, assessed in the field.
  - find: unburnt-low
    value: unburnt to low
    description: Partially burnt in the 2019-20 fires, unburnt to low severity, assessed
      in the field.
- context_property: fire interval before 2019-20 fire (years)
  category: plot_context
  var_in: fire_interval_before_2019
traits:
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Species descriptions in the Methods (Study species).
- var_in: plant_height
  unit_in: unit
  trait_name: plant_height
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: Species descriptions in the Methods (Study species).
- var_in: stem_growth_habit
  unit_in: .na
  trait_name: stem_growth_habit
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Species descriptions in the Methods (Study species).
- var_in: clonal_spread_mechanism
  unit_in: .na
  trait_name: clonal_spread_mechanism
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Species descriptions in the Methods (Study species).
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The rapid form included prompts for an estimate of the area over which
    the species occurred, the number of mature, immature, live and dead individuals,
    and noting evidence of any threats. ^p Summary of population changes and evidence
    for fire-driven effects, where T1 is Time 1 (pre-fire for burnt sites) and T2
    is Time 2 (the surveys conducted for this project, post-fire for burnt sites).
    ^p Supplementary Table S1 - Post-fire survey results. Fire response is of adult
    plants. ^p Response type observed after the 2019-20 fires, for each species (Table
    3) and at each burnt site (Table S1).
- var_in: resprouting_capacity_proportion_individuals
  unit_in: unit
  trait_name: resprouting_capacity_proportion_individuals
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: 100-200
  methods: O. rugosa subsp. distalilobata responded entirely by resprouting. However,
    even with the imprecise pre-fire population estimate of ~250 of McDougall et al.
    (2023), Table 2, or the one made after the fires of 100-200, a substantial proportion
    of the plants (15-55%) were killed by the fire. ^p Supplementary Table S1 - Post-fire
    survey results. Fire response is of adult plants.
- var_in: bud_bank_location
  unit_in: .na
  trait_name: bud_bank_location
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The rapid form included prompts for an estimate of the area over which
    the species occurred, the number of mature, immature, live and dead individuals,
    and noting evidence of any threats. ^p Response type observed after the 2019-20
    fires (Table 3), 'Facultative resprouter (basal)'.
- var_in: post_fire_recruitment
  unit_in: .na
  trait_name: post_fire_recruitment
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The rapid form included prompts for an estimate of the area over which
    the species occurred, the number of mature, immature, live and dead individuals,
    and noting evidence of any threats. ^p Summary of population changes and evidence
    for fire-driven effects, where T1 is Time 1 (pre-fire for burnt sites) and T2
    is Time 2 (the surveys conducted for this project, post-fire for burnt sites).
    ^p Supplementary Table S1 - Post-fire survey results. ^p Presence or absence of
    seedlings after the 2019-20 fires, for each species (Table 3) and at each burnt
    site (post-fire recruits, Table S1).
- var_in: seedbank_location
  unit_in: .na
  trait_name: seedbank_location
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Geosporous, seeds released into and stored in a soil seedbank; serotinous,
    seeds held in the plant canopy, and in this context, released after fire. ^p Seedbank
    type of the obligate seeders, from the response type observed after the 2019-20
    fires (Table 3).
- var_in: serotiny
  unit_in: .na
  trait_name: serotiny
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Geosporous, seeds released into and stored in a soil seedbank; serotinous,
    seeds held in the plant canopy, and in this context, released after fire. ^p H.
    constablei was the only species with a serotinous (canopy-stored) seedbank, and
    it had universally poor regeneration.
- var_in: fire_exposure_level
  unit_in: .na
  trait_name: fire_exposure_level
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: In this context, it is worth noting that predicted fire severity (from
    remote-sensed imagery, NSW DCCEEW 2020) was correct at the site only 52% of the
    time. For 34% of sites, it was lower than predicted, and for two species, B. milesiae
    and Rhodanthe sp. Point Lookout, the rocky habitats in which they grow protected
    plants from being burnt even when the site was. ^p The fire response was unable
    to be determined for Rhodanthe sp. Point Lookout, because most of the site was
    a precipitous cliff, too dangerous to access, and in the areas that were accessible,
    all plants appeared to have escaped the fire as a result of growing among rocks
    and on the cliff face.
- var_in: reproductive_maturity
  unit_in: unit
  trait_name: reproductive_maturity
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: unknown
  methods: Two species, namely, B. imlayensis and C. scabrella, had mass germination
    from a soil seedbank following the fires, with almost all individuals of the latter
    mature (flowering and producing fruit) when surveyed 2 years post-fire. Subsequent
    surveys of B. imlayensis in 2022 and 2024 (G. Wright, pers. comm. to L. Tasker,
    November 2025) have shown that the recruits are now mature adults (70-80% flowering
    and setting fruit in November 2025). ^p Yes, immediate post-fire mass germination
    of seedlings. Approximately 20% survived, and approximatley 70-80% of these reproductive
    by 2024. ^p The value is the time from post-fire germination to the survey at
    which plants were flowering and fruiting.
