source:
  primary:
    key: Tasker_2026
    bibtype: Article
    year: 2026
    author: Elizabeth M. Tasker and Meena S. Sritharan and Andrew J. Denham and Katy
      Wilkins and Berin D. E. Mackenzie
    title: 'Assessing impacts of the 2019-20 fires on nine rare plants: challenges
      and solutions for improved conservation responses'
    journal: Australian Journal of Botany
    volume: '74'
    pages: BT26004
    doi: 10.1071/BT26004
contributors:
  data_collectors:
  - last_name: Tasker
    given_name: Elizabeth
    ORCID: 0000-0002-2607-7183
    affiliation: Science and Insights Division, NSW Department of Climate Change,
      Energy, the Environment and Water, Parramatta, NSW, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait %in% c(
          "plant_growth_form", "plant_height", "stem_growth_habit", "clonal_spread_mechanism",
          "resprouting_capacity", "resprouting_capacity_proportion_individuals",
          "bud_bank_location", "post_fire_recruitment", "seedbank_location", "serotiny",
          "fire_exposure_level", "reproductive_maturity"
        )
      ) |>
      dplyr::filter(
        !(trait == "plant_height" &
          !taxon_name %in% c("Prostanthera sp. Rowleys Creek", "Rhodanthe sp. Point Lookout", "Bossiaea milesiae"))
      )
  '
  collection_date: 2021-06/2022-04
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: To test whether the 2019-20 fires caused declines in nine rare, but
    not threatened, endemic NSW plant taxa judged at high risk, and whether the threats
    to natural post-fire recovery predicted by desktop analyses actually occurred.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: We selected nine taxa (Table 1) as a representative sample of
    families, predicted threats and botanical subdivisions from a larger study of
    100 species (authors', unpubl. data), for which standardised post-fire data were
    collected. ^p The nine species were surveyed between June 2021 and April 2022
    (1.6-2.6 years post-fire) by the authors, DCCEEW or SoS staff, or by contracted
    botanists using a standard data collection template. This comprised a rapid assessment
    form and a quadrat/transect subsample form. The rapid form included prompts for
    an estimate of the area over which the species occurred, the number of mature,
    immature, live and dead individuals, and noting evidence of any threats. ^p For
    each species we surveyed both burnt and unburnt ('control') sites, wherever possible,
    in a ratio of 2:1. This was undertaken to facilitate an assessment of the contribution
    of factors other than the 2019-20 fires to population changes between the pre-
    and post-fire surveys. ^p Where possible, we surveyed all known locations of extemely
    restricted or uncommon species, or at least six to eight sites if the species
    was more widely distributed. We selected the sites with the most recent and spatially
    precise pre-fire records wherever possible, to maximise the chances of relocating
    the species and minimise the change likely to have occurred in the populations
    prior to the fire.
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: data.csv is a copy of raw/trait_data.csv. Its sites_included column gives
    whether a Table 3 percentage of post-fire recruits covers all sites or burnt sites
    only; fire_severity is the field-assessed 2019-20 fire severity at each site (Table
    S1); fire_interval_before_2019 is the years between the 2019-20 fire and the previous
    mapped fire at each site, from the Table S1 mapped fire years (mapped fire history
    is reliable from the early 1980s). Plant heights from the Study species descriptions
    are kept only for the three taxa without a flora height elsewhere in AusTraits
    (Prostanthera sp. Rowleys Creek, Rhodanthe sp. Point Lookout, Bossiaea milesiae);
    the rest are filtered out in custom_R_code. Additional traits in raw data file,
    post_fire_recruit_percentage (Table 3, percentage of each population that were
    post-fire recruits, all sites and burnt sites only), post_fire_recruit_survival_percentage
    (Boronia imlayensis, 21% of recruits surviving 2022-2024), post_fire_recruit_reproductive_percentage
    (Boronia imlayensis, 70-80% of recruits flowering and fruiting by November 2025),
    herbivory_observation (possum browsing of Olearia rugosa subsp. distalilobata),
    pathogen_susceptibility (Phytophthora on Boronia imlayensis seedlings). The paper
    publishes no site coordinates for these sensitive species. Coordinates are generic
    gazetteer points for the named locality. The five Hakea constablei sites are given
    the Blue Mountains National Park centroid.
identifiers: .na
