source:
  primary:
    key: Davis_2026
    bibtype: Unpublished
    year: 2026
    author: Belinda Davis
    title: 'Unpublished dataset: Pollinators of orchids in Western Australia.'
contributors:
  data_collectors:
  - last_name: Davis
    given_name: Belinda
    ORCID: 0009-0009-0128-0028
    affiliation: Biodiversity and Conservation Science, Department of Biodiversity,
      Conservation and Attractions, WA, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      pivot_longer(
      cols = c(`pollination type1`,`pollination type2`), 
      names_to = "column_original", 
      values_to = "trait_name", 
      values_drop_na = TRUE) |>
      generate_observation_numbers(`plant species`, trait_name)
  '
  collection_date: 2026
  source_id: source_ID
  taxon_name: plant species
  trait_name: trait_name
  value: pollinator_species_AusTraits
  location_name: unknown
  description: unknown
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Dataset is an informal database merging data from disparate published
    and unpublished studies.
  original_file: in raw data folder
  notes: none
identifiers: .na
locations: .na
contexts:
- context_property: method_details
  category: method_context
  var_in: method_details
- context_property: replicate observations
  category: temporal_context
  var_in: observation_number
