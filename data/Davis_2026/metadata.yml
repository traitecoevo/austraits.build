substitutions:
- trait_name: pollination_vector_known
  find: flower_wasp
  replace: wasp
- trait_name: flower_visitor
  find: flower_wasp
  replace: wasp
- trait_name: pollination_syndrome
  find: flower_wasp
  replace: wasp
- trait_name: pollination_vector_possible
  find: flower_wasp
  replace: wasp
- trait_name: pollination_syndrome
  find: bee_fly
  replace: bee
taxonomic_updates:
- find: Caladenia flava subsp flava
  replace: Caladenia flava subsp. flava
  reason: Exact match of taxon name to an APC-accepted canonical name once punctuation
    and filler words are removed (2026-08-12)
  taxonomic_resolution: subspecies
- find: Caladenia flava subsp maculata
  replace: Caladenia flava subsp. maculata
  reason: Exact match of taxon name to an APC-accepted canonical name once punctuation
    and filler words are removed (2026-08-12)
  taxonomic_resolution: subspecies
- find: Caladenia longicauda subsp eminens
  replace: Caladenia longicauda subsp. eminens
  reason: Exact match of taxon name to an APC-accepted canonical name once punctuation
    and filler words are removed (2026-08-12)
  taxonomic_resolution: subspecies
- find: Caladenia longicauda subsp longicauda
  replace: Caladenia longicauda subsp. longicauda
  reason: Exact match of taxon name to an APC-accepted canonical name once punctuation
    and filler words are removed (2026-08-12)
  taxonomic_resolution: subspecies
- find: Caladenia thinnicola
  replace: Caladenia thinicola
  reason: Fuzzy match of taxon name to an APC-accepted canonical name once punctuation
    and filler words are removed (2026-08-27)
  taxonomic_resolution: species
- find: Stylidium amoena
  replace: Stylidium amoenum
  reason: Fuzzy match of taxon name to an APC-accepted canonical name once punctuation
    and filler words are removed (2026-08-27)
  taxonomic_resolution: species
exclude_observations: .na
questions:
  question1: Do you have a range of dates across when these data were collected? This
    can be at the scale of the year, month, or day.
  question2: Can you provide a 1-sentence description of the motivation for this study
    (for the `description` field)?
  question3: If any of these data are linked to specific locations, can you specify
    where the data were collected? This can be a specific latitude/longitude or a
    place name that I can match to coordinates. If they apply generically across the
    species range, then no location is required. (That is how I've mapped the information
    for now.)
  question4: Are their any publications you would like to link to this dataset - or
    let me know if you'd like to give the dataset a different title.
  question5: Also, just letting you know that while the official trait values for
    the pollinator/floral visitor traits are relatively broad, we are also retaining
    the actual pollinator name as an `entity_context`, so future data users have access
    to this information.
