  collection_date: 2011-10/2011-11
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  entity_type: entity_type
  description: To test whether habitat heterogeneity on granite inselbergs drives intraspecific
    variation in leaf, wood and architectural traits of three Proteaceae shrubs, and
    whether inselbergs act as fire refugia.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'The study sites are located between 50 and 120 km SE of the city
    of Perth, in the Darling Range, south western Australia. The region is characterized
    by a mediterranean-type climate (Cowling et al. 1996), having hot and dry summers
    and mild and wet winters (800-1,000 mm of rainfall per year). The dominating vegetation
    types are Jarrah (Eucalyptus marginata, Myrtaceae) woodlands and forests. This relatively
    flat landscape (highest point is only 582 m a.s.l.) is punctuated with numerous
    isolated granite inselbergs. The inselbergs may be smoothly rounded domes or steep
    and exposed rocky slopes, peaking a few tens to hundreds of metres above the surroundings
    (Fig. 1). In the study region, we assessed fourteen inselbergs that included populations
    of at least one of the target species on the outcrops (shallow-soil, highly irradiated
    habitats on the inselberg) as well as in the aprons (deep-soil, sheltered habitats
    immediately fringing the base of an inselberg and usually supporting woodlands;
    Schut et al. 2014; Table 1). ^p We selected three proteaceous shrub species; Hakea
    petiolaris Meisn., Grevillea bipinnatifida R.Br. and Banksia armata (R.Br.) A.R.Mast
    & K.R.Thiele (Fig. 2). These are common species in the region, occurring both on
    outcrops and in aprons. We chose these shrubs because their relatively shallow
    root systems do not enable these plants to reach groundwater. This makes them highly
    dependent on habitat characteristics such as soil depth, water availability, local
    temperature and humidity (related to sun irradiance). All three species are resprouters
    and are endemic to south-western Australia. ^p We sampled ten individuals per population
    (no more than a few tens of metres from each other) of each target species from
    ten inselbergs (Table 1) both on the outcrops and in the aprons. This sampling yielded
    100 plants measured in outcrop habitats and 100 plants measured in apron habitats
    per species across all study sites. For each species, we measured 19 leaf, wood
    and architectural plant functional traits related to water and nutrient availability,
    and to fire disturbance (Pérez-Harguindeguy et al. 2013). We collected these traits
    from randomly chosen, healthy, adult individuals (Pérez-Harguindeguy et al. 2013;
    see Table S1 in the Electronic Supplementary Material for details). ^p Ten of the
    investigated traits relate to leaves and they are key in plant performance, as
    identified by the LHS scheme (Westoby 1998; Laughlin et al. 2010) and LES (Wright
    et al. 2004). We focused on specific leaf area (SLA), leaf thickness, leaf surface,
    leaf surface to volume ratio, leaf water content, total ash content, N-, P- and
    C-content, and leaf calorific value. We collected two leaves per individual plant,
    resulting in 1,200 sampled leaves (2 leaves × 10 individuals × 2 habitats × 10
    inselbergs × 3 shrub species). All leaves were collected during October and November
    2011 between 9 a.m. and 4 p.m. The harvested leaves originated from a plant height
    between 0.5 and 1.5 m. ^p We investigated three traits related to wood characteristics:
    wood density, bark thickness and relative bark thickness (bark to stem ratio).
    Wood density is correlated with water availability and can potentially enhance
    plant resistance to fire (Midgley et al. 2011; Pausas 2015). Since wood density
    can substantially vary between trunk wood and branch wood (Sarmiento et al. 2011),
    we consistently took samples from second-year branches. Bark thickness and bark-to-stem
    ratio are positively correlated with storage of carbohydrates and water and with
    plant survival after fire (Midgley et al. 2011; Rosell 2016). Bark is defined here
    as the woody tissues external to the xylem. We collected data on bark and stem thickness
    at a height of 20 cm from five individual plants of each species in each habitat
    on each inselberg. These measurements were taken from the same individual shrubs
    as the leaf traits. ^p We measured six architectural, morphological traits to define
    the physical complexity of each shrub. These traits inform on plant allocation
    strategies, on their ability to capture light, to retain humidity and to cope with
    fire (Kennedy and Potgieter 2003; Schwilk 2003; Midgley et al. 2011). These traits
    were: plant height (with higher plants having a competitive advantage for light
    capture), stem diameter (with larger stems indicative of older individuals), maximum
    canopy diameter (with plants having larger canopy more suited to maintain humidity),
    canopy-to-height ratio (with plants showing high values of this ratio more suited
    to the maintenance of humidity and the spread of fire), distance of first living
    branch (whereby the closer the branch is to the ground, the better the plant is
    able to maintain humidity and to spread fire) and degree of ramification (number
    of orders of branching, one order is achieved when a branch splits in two branches
    of equal size - with more branched plants better able to maintain humidity and
    spread fire). We measured architectural traits on the same plants as those used
    for the measurement of bark thickness, i.e. from five individuals per habitat/species/inselberg.
    Measurements of distance of the first branch from the ground were only possible
    in B. armata, because most H. petiolaris and G. bipinnatifida are multi-stemmed
    shrubs, with ramification starting from the base. ^p The 19 functional traits were
    also averaged at habitat scale and per species.'
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: Data for additional traits, leaf_surface_to_volume_ratio, leaf_calorific_value, plant_canopy_width_to_height_ratio,
    stem_branching_order_number (degree of
    ramification) and root_depth_category.
identifiers: .na
locations:
  Darling Range granite inselbergs:
    latitude (deg): -32.463
    longitude (deg): 116.43
    description: Granite inselbergs within Jarrah (Eucalyptus marginata) woodland and
      forest.
    locality: Darling Range, 50-120 km SE of Perth
    geology (parent material): granite
    precipitation, MAP (mm): 800-1000
    climate description: mediterranean-type climate, with hot and dry summers and mild
      and wet winters
    georeference remarks: Sampling across multiple populations on 14 inselbergs (Boulder
      Rock, Boonering Rock, Canning Rock, Metro Rock 1 and 2, Mount Vincent, North-East
      Rock, Pikes Rock 1, 2 and 3, Ricks Road, Ricks Rock, Sullivan's Rock, Watershed
      Rock); coordinates given as those of Pikes Rock 1, the sampled inselberg nearest
      the centroid of the 14 inselbergs (-32.407, 116.392).
    state: WA
contexts:
- context_property: inselberg habitat
  category: plot_context
  var_in: habitat
  values:
  - value: outcrop
    description: shallow-soil, highly irradiated habitat on the inselberg
  - value: apron
    description: deep-soil, sheltered habitat immediately fringing the base of the
      inselberg, usually supporting woodland
- context_property: plant height (habitat mean, m)
  category: entity_context
  var_in: plant_height_m
- context_property: stem diameter 20 cm above ground (habitat mean, cm)
  category: entity_context
  var_in: stem_diameter_20cm_cm
- context_property: maximum canopy diameter (habitat mean, m)
  category: entity_context
  var_in: canopy_diameter_m
traits:
- var_in: leaf_area
  unit_in: cm2
  trait_name: leaf_area
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Processing of fresh scanned individual leaves using Image J software
    (Abrámoff et al. 2004).
- var_in: leaf_mass_per_area
  unit_in: cm2/g
  trait_name: leaf_mass_per_area
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: The leaf area of a one side the leaf lamina, divided by its oven-dry mass (m2
    kg-1); Dry mass was determined after drying at 80° C for 48 hrs.
- var_in: leaf_thickness
  unit_in: mm
  trait_name: leaf_thickness
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Measured along the leaf lamina, parallel with the primary leaf nerve, using a
    pair of vernier callipers.
- var_in: leaf_water_content_per_fresh_mass
  unit_in: g/g
  trait_name: leaf_water_content_per_fresh_mass
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Determined by the difference between the fresh mass and dry mass (absolute
    water content), and afterwards divided by its fresh mass.
- var_in: leaf_ash_per_dry_mass
  unit_in: '%'
  trait_name: leaf_ash_per_dry_mass
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All chemical traits were measured using a composite leaf sample of dried,
    finely ground leaf material, and determined using AOAC method 930.05 (AOAC 2000).
- var_in: leaf_P_per_dry_mass
  unit_in: mg/100g
  trait_name: leaf_P_per_dry_mass
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All chemical traits were measured using a composite leaf sample of dried,
    finely ground leaf material, and determined using AOAC method 930.05 (AOAC 2000). ^p
    Determined using a continuous segmented flow auto analyser (SFA); measured
    calorimetrically after digestion with sulphuric acid and hydrogen peroxide.
- var_in: leaf_C_per_dry_mass
  unit_in: '%'
  trait_name: leaf_C_per_dry_mass
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All chemical traits were measured using a composite leaf sample of dried,
    finely ground leaf material, and determined using AOAC method 930.05 (AOAC 2000). ^p
    Determined using a continuous segmented flow auto analyser (SFA); measured
    calorimetrically after digestion with sulphuric acid and hydrogen peroxide.
- var_in: leaf_N_per_dry_mass
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All chemical traits were measured using a composite leaf sample of dried,
    finely ground leaf material, and determined using AOAC method 930.05 (AOAC 2000). ^p
    Determined by combustion in pure oxygen at 850° C, conversion of nitrogen oxides to
    nitrogen, removal of the water, oxygen and carbon dioxide and measurement of
    nitrogen by thermal conductivity.
- var_in: wood_density
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Since wood density can substantially vary between trunk wood and branch wood
    (Sarmiento et al. 2011), we consistently took samples from second-year branches. ^p
    A piece of 5 cm long stick taken just after the scar of the second year node and
    measured In the lab using the water displacement method (Archimedes’ principle);
    Volume was determined by the water displacement and the mass was calculated as the
    difference between, after and before, emergence of the branch (without bark) in
    deionised water; The mass divided by the xylem volume provides the xylem density.
- var_in: bark_thickness
  unit_in: cm
  trait_name: bark_thickness
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Bark is defined here as the woody tissues external to the xylem. We collected
    data on bark and stem thickness at a height of 20 cm from five individual plants of
    each species in each habitat on each inselberg. These measurements were taken from
    the same individual shrubs as the leaf traits. ^p At the base of the stem at ± 10 cm
    height, a slice was sawn out of the stem with the underside being horizontal; We
    measured bark thickness using vernier callipers on the horizontal underside of the
    bark sample.
- var_in: bark_thickness_index
  unit_in: mm/mm
  trait_name: bark_thickness_index
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Bark is defined here as the woody tissues external to the xylem. We collected
    data on bark and stem thickness at a height of 20 cm from five individual plants of
    each species in each habitat on each inselberg. These measurements were taken from
    the same individual shrubs as the leaf traits. ^p At the base of the stem at ± 10 cm
    height, a slice was sawn out of the stem with the underside being horizontal; We
    measured bark thickness using vernier callipers on the horizontal underside of the
    bark sample. ^p Bark thickness divided by stem diameter (see architecture traits).
    ^p Stem diameter measured using vernier callipers at 10 cm height; In case of a
    multi-stemmed individual, the largest diameter was taken.
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: All three species are resprouters and are endemic to south-western Australia.
    ^p Fire response of the species as stated in the study species description.
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We selected three proteaceous shrub species; Hakea petiolaris Meisn., Grevillea
    bipinnatifida R.Br. and Banksia armata (R.Br.) A.R.Mast & K.R.Thiele (Fig. 2).
- var_in: stem_branching_form
  unit_in: .na
  trait_name: stem_branching_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Measurements of distance of the first branch from the ground were only
    possible in B. armata, because most H. petiolaris and G. bipinnatifida are multi-stemmed
    shrubs, with ramification starting from the base.
substitutions:
- trait_name: resprouting_capacity
  find: resprouter
  replace: resprouts
- trait_name: stem_branching_form
  find: ramification_from_base
  replace: multiple_basal_stems
  match: word
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: Do you have individual-level or inselberg-level trait values we can incorporate instead?
