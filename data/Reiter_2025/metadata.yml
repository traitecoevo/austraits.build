    cm with a flower spike of up to 25 cm containing up to 12 dark red purplish flowers,
    which flower between July and February (Fig. 1a) (Towle et al. 2022). ^p Corunastylis
    branwhiteorum has a single leaf up to 19.5 cm with a scape up to 20 cm long, with
    2-15 flowers that are green to cream with deep maroon markings (Copeland and Backhouse
    2022) (Fig. 1b).
