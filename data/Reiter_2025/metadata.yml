  methods: The following seven isolates were tested for symbiotic germination on modified
    oats medium without sucrose (MOM) by using the above methods ... All seven isolates
    trialled (including from both OTUs) supported germination, confirming their mycorrhizal
    associations with C. insignis and C. branwhiteorum.
- var_in: seed_germination
  unit_in: '%'
  trait_name: seed_germination
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: The seed accession 220559 was sown across 10 Petri dishes (each containing
    50-100 seeds) for each of the three media MOM, MOB, and MOB + Coco. Each Petri
    dish was inoculated with a 1 cm2 cube of mycorrhiza isolate Cocha3.2W-21, from OTU
    U. Due to the inability to further reduce contamination without killing the seeds
    (File S2, Fig. S1), between five and nine of each of these replicates could be scored
    for germination (those dishes that did not have seed contamination) (MOM (N = 9),
    MOB (N = 6) and MOB + Coco (N = 5). ^p Seeds were considered to have germinated
    if protocorms developed a leaf primordium (Stage 5 in Warcup 1981) within 4 months.
    The percentage of seed germination was scored per Petri dish at the end of 4 months
    under a light microscope by using a 2 cm grid, divided into 0.5 cm2 squares.
