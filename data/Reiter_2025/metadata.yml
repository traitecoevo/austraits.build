    |> dplyr::filter(!grepl("as stated", medium)) '
  collection_date: 2018/2025-03
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  source_id: source_id
  description: To identify the mycorrhizal fungi of two endangered midge orchids,
    Corunastylis insignis and C. branwhiteorum, and to determine whether they can be
    symbiotically germinated and grown to adult plants for ex situ conservation and
    translocation.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: Six plants of C. insignis from two sites had lateral root samples
    excised in winter for mycorrhizal isolations. These samples included three plants
    from site LM in 2018, two plants from Site LM in 2019, and a single plant from Site
    BW in 2019 (Fig. 2). Roots were kept cool and processed within 24 h of collection.
    Eight plants of C. branwhiteorum had lateral roots excised by NSW Department of
    Climate Change, Energy, the Environment and Water (DCCEEW) staff, including five
    plants from Site WA and three plants from Site BW on 17-24 November 2021 (Fig. 2).
    For C. branwhiteorum, plant roots were sent by overnight courier to our laboratory
    in Melbourne for mycorrhizal isolations. ^p Seeds were collected by DCCEEW staff,
    from naturally pollinated plants. Each individual had seed capsules placed in a
    dry paper bag and seeds were sent to our laboratory by overnight courier for processing.
    Seeds were removed from each capsule over white paper with tweezers and placed in
    laminar packets. Seeds were dried at 15°C and 15% relative humidity for 10 days,
    before packets were sealed and stored in the freezer at -20°C until use. A seed
    accession refers to the seed of an individual plant (entire inflorescence, including
    multiple seed pods of an individual) unless specified otherwise. ^p Once seedling
    leaves had reached approximately 3 cm, they were transferred to flasks as per the
    methods of Reiter et al. (2016). Flasks contained a 3 cm layer of the same media
    as the carbon source from the Petri dishes (MOM, or MOB), with a 3 cm layer of sterilised
    vermiculite over the top, which comprised a liquid version of the base medium (without
    agar) of MOM or MOB respectively, mixed throughout at approximately 120 mL/1 L vermiculite.
    After approximately 12 weeks in flasks, seedlings were transferred to 12-inch pots
    containing Royal Botanic Gardens Victoria terrestrial orchid BioGro potting mix
    in a shade house and watered as required. Plants were exposed to normal seasonal
    temperature fluctuations at the site of the experiment in Cranbourne, Vic, Australia.
    The number of seedlings transferred to each pot was recorded. As we had previously
    observed that species in the related genus Prasophyllum benefitted from being watered
    through their first dormancy, we kept pots damp throughout their first year in the
    nursery. Plants were monitored every 3-4 months. Emergence was scored in the 1st
    and 2nd year in the nursery. The number of seedlings that emerged and/or flowered
    was recorded for each pot. The flowering season of cultivated plants in the shade
    house was also recorded, as the nursery was situated at the Royal Botanic Gardens
    Victoria, Cranbourne site, over 750 km from the extant distribution for both species.
    To confirm that plants were not reproducing clonally in pots, plants were removed
    from the pots and had their root structures examined. In addition, we scored whether
    each plant was spontaneously pollinated in the absence of pollinators in the shade
    house or whether the flowers wilted without forming seed. Plants were kept in an
    insect-proof cage.
  original_file: raw/trait_data.csv (extracted from the source PDF and supplementary
    material)
  notes: Data for an additional trait, leaf_emergence_time (peak leaf emergence of
    cultivated plants), is in data.csv. The paper also reports the proportion of potted
    seedlings that re-emerged at each nursery census, the number of plants flowering
    at each census, and overall survival from seedling to adult (raw/trait_data.csv
    only).
