dataset:
  data_is_long_format: yes
  custom_R_code: ' data |> dplyr::filter(trait %in% c("leaf_count", "leaf_shape", "leaf_surface_colour",
    "leaf_length", "inflorescence_length", "flowers_per_inflorescence", "flower_colour",
    "flowering_time", "pollination_vector_possible", "root_structure",
    "mycorrhizal_association_type", "seed_germination_treatment", "seed_germination",
    "plant_height_reproductive", "leaf_phenology", "bud_bank_location", "storage_organ",
