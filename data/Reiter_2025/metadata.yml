    without forming seed. Plants were kept in an insect-proof cage. ^p Monitoring
    of plants in a pollinator-excluded shade house found that all flowering individuals
    of C. branwhiteorum produced seed pods with seed containing embryos, whereas those
    of C. insignis did not. This suggests that C. branwhiteorum is capable of autogamous
    self-pollination, whereas C. insignis requires a pollinator vector for seed set,
    therefore exhibiting (to some degree) an outcrossing mating system, as suggested
