- var_in: root_structure
  unit_in: .na
  trait_name: root_structure
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Roots were gently rubbed by hand and rinsed over a fine sieve under running
    water for 15 min to remove soil debris. Each root section was surface sterilised
    for 3 min in 0.05% NaOCl (10% Domestos, Australia; Unilever Australia Group Pty
    Limited) and rinsed twice in sterile water. Under a laminar flow, root sections
    were longitudinally dissected in a small pool of sterile water by using a glass
    knife to release fungal pelotons. Pelotons were rinsed by sequentially transferring
    them through five sterile water droplets (Warcup and Talbot 1967; Rasmussen 1995).
    Individual pelotons were then plated onto fungal isolation medium (FIM) (Warcup
    1950; Clements and Ellyard 1979), with 0.05 g/L filter-sterilised streptomycin sulfate
    added post-autoclaving. ^p A random selection of 25 isolates from both species and
    the three sites (Fig. 2, Supplementary Table S1) were selected for molecular identification.
