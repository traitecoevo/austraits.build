questions:
  question1: Field sites WA, BW and LM are given only as codes on a map (Fig. 2, sites
    at least 5 km apart); coordinates are withheld for these Critically Endangered species.
    All three are geocoded to Wyong. Precise coordinates could be requested from the
    authors or NSW DCCEEW.
  question2: The Results give mean germination of 26.64 ± 5.18% for CochaBB2.3-21 and
    37.16 ± 6.86% for CochaBA1.2-21 on seed accession 220559 (MOM), but that trial compared
    Cocha3.2W-21 with CochaBA1.2-21 (Methods; Table 2, CochaBA1.2-21 lower), and Fig.
    6a shows about 27% for Cocha3.2W-21 and 15% for CochaBA1.2-21. These two rows are
    filtered out until the authors clarify the isolate/medium assignment.
  question3: Both root_structure and mycorrhizal_association_type are mapped with orchid_mycorrhizal;
    drop one if they are redundant.
  question4: The C. branwhiteorum statement "generally flower in January to April"
    has no citation of its own (it follows the Copeland and Backhouse 2022 citation),
    so it is attributed to the primary source as a field observation.
  question5: leaf_phenology is deciduous (plants die back to an annually replaced
    tuber), but the paper does not say in which season the plants are dormant in the
    wild, so summer_dormancy is not assigned.
  question6: Secondary references (Towle_2022, Copeland_2022) are taken from the
    primary paper's reference list only; check them against the published sources.
