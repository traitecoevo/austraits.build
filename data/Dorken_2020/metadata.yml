dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(trait %in% c("leaf_stomatal_distribution", "stomatal_position"))
  '
  collection_date: 2018/2019
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: To determine whether trees and shrubs with reduced leaves or photosynthetic
    stems from arid and semiarid Australia share patterns of tissue formation associated
    with xeromorphy, and whether they differ anatomically from close relatives from
    more mesic areas.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: As previous studies of xerophytic species have examined their
    leaves, we elected to examine species with very reduced leaves (Callitris) and
    species where the main photosynthetic tissue is restricted to the stems. Samples
    for anatomical examination were from one individual and as listed in Table 2 some
    were from the species' native range while others were from what was essentially
    a common garden location not in their natural range. Details of the collection
    sites for foliage from mature plants of Callitris drummondii (Parl.) Benth. & Hook.
    f. ex F. Muell., Callitris roei (Endl.) F.Muell., Callitris verrucosa (A. Cunn.
    ex Endl.) R.Br ex Mirb. (collected by I R K Sluiter), Glischrocaryon flavescens
    (J.Drumm. ex Hook.) Orchard, Tetratheca erubescens J.P. Bull, Tetratheca nuda Lindl.
    and Tetratheca paynterae Alford ssp. paynterae are given in Table 2. For the tetrathecas,
    the mesic species T. nuda was selected for contrast with the two semiarid ones.
    Each species occupies a broad range of soil and topography except that T. erubescens
    and T. paynterae are species from rock crevices. The total ranges of all species
    studied occur in southern Australia below latitude 26°S. Vouchers of all species
    are stored in the Murdoch University Herbarium (MUR) except for C. verrucosa in
    the LaTrobe University herbarium (LTB). ^p Plant material for microscopical examination
    was prepared in several ways to enable light microscope and scanning election
    microscope (SEM) examination. Material was first fixed to preserve the structure
    of the tissues, then embedded in paraffin wax to enable sectioning for light microscopy
    or critical point dried and coated in a thin layer of gold-palladium using a sputter
    coater for SEM examination. ^p Freshly collected material was photographed and
    then fixed in FAA (100 mL FAA = 90 mL ethanol 70% + 5 mL acetic acid 96% + 5 mL
    formaldehyde solution 37%) before being stored in 70% ethanol.
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: Additional anatomical descriptions documented in the raw data file, but this
    information does not map cleanly into traits. Callitris verrucosa coordinates are printed as 34°76'S, 142°28'E, which
    is not valid as degrees-minutes. They were read as decimal degrees (-34.76, 142.28),
    ~35 km north of Ouyen, which fits the stated collection 'near Ouyen, Victoria'.
