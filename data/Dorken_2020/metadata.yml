contexts:
- context_property: plant part
  category: entity_context
  var_in: plant_part
  values:
  - value: leaf
    description: Stomata on the leaves.
  - value: photosynthetic stem
    description: Stomata on the green, photosynthetic shoot axis of a leafless or near-leafless
      species.
traits:
- var_in: leaf_stomatal_distribution
  unit_in: .na
  trait_name: leaf_stomatal_distribution
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The leaf and stem anatomy were studied from serial sections using the paraffin
    technique and subsequent astrablue and safranin staining (Gerlach 1984). ^p The
    FAA-material was dehydrated in formaldehyde dimethyl acetal (FDA) for 24 h (Gerstberger
    and Leins 1978) and later critical point dried. Sputter coating was done with a
    Sputter Coater SCD 50 Bal-tec (Balzers Union Ltd.). The specimens were examined
    with an Auriga Zeiss TM. ^p Stomatal distribution records whether stomata occur
    on one or both leaf surfaces.
- var_in: stomatal_position
  unit_in: .na
  trait_name: stomatal_position
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The leaf and stem anatomy were studied from serial sections using the paraffin
    technique and subsequent astrablue and safranin staining (Gerlach 1984). ^p The
    FAA-material was dehydrated in formaldehyde dimethyl acetal (FDA) for 24 h (Gerstberger
    and Leins 1978) and later critical point dried. Sputter coating was done with a
    Sputter Coater SCD 50 Bal-tec (Balzers Union Ltd.). The specimens were examined
    with an Auriga Zeiss TM. ^p Table 3. Leaf and tissue traits associated with xeromorphy
    and sclerophylly and their occurrence in the species examined in this study. ^p
    Stomatal position records whether the stomata of the leaves or photosynthetic stems
    are encrypted, sunken or neither (Table 3, 'Sunken or encrypted stomata').
substitutions:
- trait_name: leaf_stomatal_distribution
  find: amphistomatic_majority_abaxial
  replace: amphistomatic_uneven
- trait_name: leaf_stomatal_distribution
  find: stomata_on_leaf_tip_and_furrow
  replace: amphistomatic
- trait_name: stomatal_position
  find: weakly_sunken
  replace: superficial
taxonomic_updates: .na
exclude_observations: .na
questions: .na
