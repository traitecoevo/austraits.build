dataset:
  data_is_long_format: no
  custom_R_code: ' 
    data |> 
      dplyr::mutate( 
        `CTupper(um)` = dplyr::if_else(omit_CTupper %in% "x", NA, `CTupper(um)`), 
        `CTlower(um)` = dplyr::if_else(omit_CTlower %in% "x", NA, `CTlower(um)`), 
        `Leaf_thickness (um)` = dplyr::if_else(omit_leaf_thickness %in% "x", NA, `Leaf_thickness (um)`), 
        leaf_type = dplyr::case_when(ID == "751" ~ "terete", ID == "752" ~ "broad")
      ) |>
      generate_observation_numbers(Species, location_name, source_id)
  '
  collection_date: collection_date
  taxon_name: Species
  location_name: location_name
  source_id: source_id
  description: Compilation of field-measured leaf cuticle thickness data from the
    literature and unpublished sources, to determine whether there are robust latitudinal,
    taxonomic and climatic patterns in leaf cuticle thickness at a global scale and
    how cuticle thickness relates to other leaf morphological traits.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Only field-measured data were selected for inclusion; data from
    glasshouse, shade-house, common garden, manipulative experiments and any other
    clearly non-natural situations or treatments were excluded. Where data for multiple
    leaves or individual plants were reported for a species at a site, we included
    only the mean value in our dataset. Where data were reported separately for adult
    and juvenile plants, we included adult data only. Where data were reported separately
    for leaves sampled at high and low light, we used the mean value. Our final dataset
    consisted of species-mean trait values at each site, with species names standardised
    according to The Plant List (www.theplantlist.org; accessed on 18 January 2021),
    which also provided taxonomic information at higher levels. ^p Accordingly, there
    was substantial variation among studies in sample preparation, including histochemical
    staining procedures used for identifying the cuticle region of leaves, and in
    the optical resolution used for measuring leaf cuticle thickness via light microscopy
    (the rationale of excluding the small number of transmission electron microscopy
    (TEM)-based studies will be discussed later). Most studies reported anatomical
    data measured on freshly collected leaves; for three studies, the data were measured
    on rehydrated leaves sampled from herbarium specimens (Pyykko, 1966, 1979; Johnson,
    1980). Most studies reported thickness data for both upper and lower cuticles,
    others for upper cuticle only and others still for combined cuticle thickness
    only (i.e. the sum of upper and lower, 'CTsum', um). ^p All studies included location,
    but in some cases, this was a geographic descriptor (e.g. nearest town) rather
    than a precise latitude and longitude. In such cases, a point location was estimated
    using Google Earth.
  original_file: raw/nph70397-sup-0002-TableS1-S1@Supporting Information Table S1.xlsx,
    sheet 'CT dataset Li et al', subset to Australian coordinates by raw/extra_R_code_Li_2025.R
  notes: Only the Australian rows of the global GlobCute database (Table S1) are in
    data.csv. Values already in AusTraits under the
    dataset of the original source (species x trait) are marked "x" in the matching
    omit_ column and removed as data file is read in. All cuticle and leaf thickness values
    from Cunningham_1999, Duncan_1998 (Duncan & Westoby unpublished), Johnson_1980,
    Jordan_2007 (Jordan unpublished) and Peeters_2002 are already in AusTraits, as
    are the leaf thickness values from Burrows_2001 and Edwards_2000 (Edwards_2000_2),
    apart from two species missing from those datasets. The single Medina et al. (1990)
    row (Banksia aemula "near Perth", outside the species' range, from a study of
    Venezuelan rain forests) is also excluded. Burrows_2001 and Edwards_2000
    rows use the site names and locations of those datasets when mapping in data not previously in AusTraits as part of those studies. Leaf size and LMA are
    not mapped, as Li et al. added species
    means from Wright et al. (2017) and TRY v5 database, many of which may already be in AusTraits. CTsum (the sum of the upper
    and lower cuticle thicknesses), CTsum% and leaf density (LMA/leaf thickness) are
    derived values and are not mapped. Banksia marginata (Edwards_2000_2) is assigned to the Edwards_2000 forest (ID
    1752) and heath (ID 1753) sites by matching leaf size to the Edwards_2000 means
    (1.68 and 1.06 cm2)
