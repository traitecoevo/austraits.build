dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2007-06/2007-11
  taxon_name: Plant species
  location_name: location_name
  description: To test how well a flower-visitor network reflects pollen transport,
    by comparing the structure of bee visitation and bee pollen-transport networks
    in a spinifex-dominated arid grassland.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The study was conducted in the north-eastern Simpson Desert,
    south-western Queensland, Australia, on two nature reserves, Cravens Peak and
    Ethabuka which were formerly cattle stations, and Carlo cattle station (23°45′S,
    138°28′E). The dominant landforms are long parallel sand dunes, 8–10 m in height,
    divided by interdune valleys (swales). The hummock grass, Triodia basedowii (Poaceae;
    spinifex) is dominant across the dunes but less so on dune crests where scattered
    Grevillea stenobotrya (Proteaceae), and other shrub species (e.g. several Acacia
    and many in the Fabaceae), are common along with a suite of ephemeral forbs and
    herbs that appear after rain. Acacia georginae (Mimosaceae) forms patchy low open
    woodlands on the clay soils in the swales along with chenopods. The biota is diverse;
    over 150 plant species, seven native small mammal species, 42 reptile species
    and an unknown number of invertebrate species exist in the area (Desert Ecology
    Research Group, The University of Sydney, unpubl. data 2011) and the study sites
    lack weedy plants. This is the first quantitative survey of flying invertebrates
    for this vast dune system and, notably, the introduced honeybee Apis mellifera
    (Apidae), is absent (T. Popic, pers. obs. 2007). ^p The Simpson Desert is classified
    as a hot, dry desert with highly variable rainfall by world standards. Large,
    unpredictable rain events structure the environment and sustain unexpectedly high
    levels of biomass, creating relatively short ‘boom’ periods, immediately followed
    by relatively long ‘bust’ periods (Morton et al. 2011). The study sites experienced
    a widespread rain event of 300 mm in January 2007, stimulating mass flowering
    (‘boom’) during the study period in 2007. This was followed by an abrupt return
    to ‘bust’ conditions by December 2007 with relatively low levels of flowering.
    ^p Sampling occurred over three periods in 2007 (28 June to 5 July, 9 to 23 September
    and 3 to 13 November) that spanned the post-rain flowering period. To ensure we
    recorded the maximum diversity of interactions for the area, six sites within
    the study area were sampled. One site was sampled during all three sampling periods
    (MC, 23°45′S, 138°28′E) and another five sites were sampled during the following
    periods (CS, 23°29′S, 138°30′E, September and November; KSE, 23°21′S, 138°15′E,
    September and November; KSW, 23°20′S, 138°13′E, September and November; FR, 23°47′S,
    138°03′E, June and September; BB, 23°21′S, 138°30′E, September). All sites were
    spinifex dominated dune fields and all were floristically similar. Under ideal
    conditions, each period and location would be treated as a separate network. However,
    low capture rates meant that separating data by time and place would result in
    small networks which introduces its own bias (Dormann et al. 2009). For our aim,
    pooling data is unlikely to bias the comparison of networks, as the effect on
    the visitation and pollen-transport networks would be similar, and because the
    bee specimens were collected from all sites and during all periods. ^p Visitation
    interactions were sampled by observing and collecting bees visiting flowers. A
    visitation was defined as any physical contact between the insect and a flower,
    and no a priori decisions were made about probable pollinators. To ensure an adequate
    sample of bee visitors was obtained, a stratified approach was used to select
    areas to sample, groups of plants within a 1 m square, or individual plants, with
    abundant flowering and additional samples were collected using transects in areas
    of sparse flowering. We used this combination of sampling methods in a stratified
    way to overcome the shortfalls and biases associated with each method (Gibson
    et al. 2011). In an effort to obtain a complete record of interactions, the more
    abundantly flowering plant species were sampled until no new species were encountered.
    Effort was made to catch all visitors, and sampling included plants from each
    species. Observations were made for 10 min periods and any invertebrate floral
    visitors were caught using nets and plastic containers, and transferred into 5
    mL vials for transportation. The containers used for catching were cleaned before
    reuse to minimize pollen contamination. A total of 156.5 h was spent observing
    flower–visitor interactions (mean observation time per plant species 2.52 ± 0.29
    h) on 62 plant species during which 298 bee specimens were caught. ^p Bees were
    identified by taxonomist Michael Batley at the Australia Museum, Sydney. Plant
    species identifications were checked with our reference sets for the study sites
    and vouchers specimens collected. Nomenclature follows Alexander (2005) and Urban
    (2001).
  original_file: Popic, Wardle, Davila 2013 interaction dataset.xlsx (sheets flower_visitor
    and pollination_vector_possible; study details in sheet Information), supplied
    by the data contributors.
  notes: The contributors' xlsx holds two plant x bee species matrices, the visitation
    network (number of visits by each bee species to each plant species) and the pollen-transport
    network (pollen of each plant species transported by each bee species). These
    were reshaped by raw/extra_R_code_Popic_2013.R into one data.csv row per plant
    x bee species pair with a visit and/or pollen transport, with the visit count
    in `visits` and the pollen-transport value in `pollen_transport`. Data are pooled
    across the six sites and three sampling periods.
