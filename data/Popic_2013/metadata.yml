    locality: Cravens Peak and Ethabuka nature reserves and Carlo cattle station,
      north-eastern Simpson Desert, south-western Queensland
    landform: long parallel sand dunes, 8–10 m in height, divided by interdune valleys
      (swales)
    vegetation type: Triodia basedowii hummock grassland, with scattered Grevillea
      stenobotrya and other shrubs on dune crests and Acacia georginae low open woodland
      with chenopods on clay soils in the swales
    georeference remarks: Sampling across six sites; coordinates given as the centroid
      of the six sites, MC (23°45′S, 138°28′E), CS (23°29′S, 138°30′E), KSE (23°21′S,
      138°15′E), KSW (23°20′S, 138°13′E), FR (23°47′S, 138°03′E) and BB (23°21′S,
      138°30′E).
    state: Qld
contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: visitor_taxon_name
- context_property: pollinator count
  category: entity_context
  var_in: visits
- context_property: pollen grains transported
  category: entity_context
  var_in: pollen_transport
traits:
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Visitation interactions were sampled by observing and collecting bees visiting
    flowers. A visitation was defined as any physical contact between the insect and
    a flower, and no a priori decisions were made about probable pollinators. ^p Observed
    flower–visitor interactions were used to create a quantitative visitation network
    in the form of a matrix (Memmott 1999). In this matrix, individual plant species
    ‘p’ occupied columns and bee species ‘a’ occupied rows. The cell where these intersect
    indicate the number of times individual bees from species ‘a’ were observed on
    flowers of plant species ‘p’. ^p Records are bee species observed visiting each
    plant species, pooled across the six sites and three sampling periods.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: All individual bees were viewed under the dissecting microscope to determine
    if pollen was present. If an individual bee carried pollen, it was dabbed repeatedly
    with a 2 mm cube of fuchsin gel (Kearns & Inouye 1993) to remove as much pollen
    as possible and to facilitate identification of the pollen to plant species. The
    cube was placed on a clean microscope slide, melted, and then covered with a microscope
    cover slip. Removing pollen from corbiculae (pollen baskets) was avoided, because
    pollen within corbiculae is unlikely to be deposited on stigmas, making it unavailable
    for pollination (Horskins & Turner 1999). [...] Pollen grains on each slide were
    identified to species and counted using a pollen reference set compiled from the
    flowering plants collected in the study area. The pollen derived from a few closely
    related plant species could not be differentiated, and were grouped. Scaveola
    depauperata, Scaevola parvibarbata and Scaevola parviflora (Goodeniaceae) were
    grouped, and Grevillea juncifolia, Grevillea stenobotyra, Grevillea striata and
    Hakea eyreana (Proteaceae) were grouped. ^p The pollen-transport network was constructed
    by first determining the mean number of pollen grains of a given plant species
    on individuals of a given bee species. This number was then multiplied by the
    number of visits between species ‘a’ and ‘p’ as seen in the visitation network
    to give an indication of pollinator performance. Instances where individual bees
    carried pollen of a plant species it was not observed to visit were taken into
    account and recorded as one visit when the pollen-transport network was being
    constructed; that is, the number of ‘visits’ used to determine the total amount
    of pollen transported included those that must have happened but were not observed.
    ^p Records are bee species carrying pollen of each plant species, pooled across
    the six sites and three sampling periods.
substitutions: .na
