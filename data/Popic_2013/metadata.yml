questions:
  question1: The Information sheet describes the pollen-transport values as the total
    number of pollen grains carried by all bees caught, but they sum to 9,312, not
    the 34,855 grains counted, and two are fractions (436.33, 592.5). Are they instead
    the paper's pollen-transport network values (mean grains per bee x number of visits).
  question2: There is no species (or synonym) `Scaevola parviflora`. This name has
    been mapped to Scaevola parvifolia. Is this appropriate?
  question3: I manually mapped `Calotis plumothera` to `Calotis plumulifera`; APCalign
    did not find an automatic match. Is this appropriate?
