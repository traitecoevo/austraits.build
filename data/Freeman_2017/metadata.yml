questions:
  question1: Chapter 2 Appendix S2.2 gives relative bark thickness
    as AvgBark/Ht (mm cm-1), while Chapter 5 gives relative bark
    thickness as bark thickness divided by stem diameter. Which units and definitions
    apply to the sapling trait dataset?
  question2: The thesis gives one coordinate for the Tiwi Carbon Study (11.70° S, 130.88°
    E), and the treatment sites are shown only on maps. Could you provide coordinates
    (and datum) for the annual and unburnt treatment sites at Imalu, Shark Bay, Taracumbi
    and Pikertaramoor?
  question3: The sapling trait dataset (Chapter
    5; height to diameter ratio, relative crown width, leaf area to stem mass ratio,
    leaf area, specific leaf area, trunk and branch wood density, bark thickness, relative
    bark thickness and leaf area to sapwood area ratio for 16 species) is presented
    only as figures (Chapter 5 Appendix S5 boxplots). Can you provide this data?
