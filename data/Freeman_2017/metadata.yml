  location_name: location_name
  description: To understand how fire, competition and species growth strategies
    determine whether suppressed tree resprouts in Australian mesic savannas escape
    the fire trap, and how fire frequency shapes savanna structure and composition.
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: In 2008 CSIRO established 200 m-long permanent transects at four
    locations in western Melville Island (Fig. 1, Table 1, Appendix S1). There were
    18 transects across three fire frequency treatments, annually burnt in the early
    dry season (annual), burnt every three years in the early dry season (triennial)
    and fire exclusion (unburnt). These transects were in natural vegetation within
    and adjacent to Acacia mangium plantations and within 200 m of existing tracks.
    This allowed ease of access, ease of protection from unplanned fires in plantation
    buffer zones and access to Tiwi Plantations Corporation staff and resources to
    implement the fire treatments. The fire experiment began in 2009 (Fig. 4). Annual
    and unburnt fire treatments were informally imposed through plantation asset protection
    plans from plantation establishment in 2005/06. These treatment sites were selected
    specifically to take advantage of this pre-existing fire management program. Between
    2005/06 and 2009 the triennial fire treatment sites remained unburnt. Prior to
    2005/06, fire experiment sites were subject to ambient, frequent, but unquantified,
    fire regimes. [...] ^p I chose to study 12 tree species that were prevalent across
    the Tiwi fire experiment sites (Table 4). These species are also common in mesic
    savannas within their range across northern Australia. Despite many persisting
    as shrubs under frequent fire, all have the potential to become trees (single
    stemmed >6 m tall) and nearly all are capable of basal resprouting either from
    lignotuber or rhizome, except for Acacia leptocarpa which is a post-fire re-seeder.
    The 12 species represented a range of families that include Australasian, pantropical
    and endemic genera, lending them to classification by eco-taxonomic group. [...]
    ^p I did not collect data from triennial fire treatment sites for the growth response
    dataset, mainly due to time constraints, but also because the timeframe for burning
    these sites (July 2016) was not conducive to PhD completion timelines for collecting
    data and analysing results. At each of the annual and unburnt sites, individuals
    of the 12 study species were permanently marked with numbered steel tags near
    Tiwi fire experiment transects. Sampling effort was one day per plot. I avoided
    tagging trees within 20 m of the established transects to minimise disturbance
    and compaction to that area, which is heavily used in other parts of the Tiwi
    fire experiment. ^p Three nominal size classes were defined to ensure a range of
    initial tree sizes were measured per species. This was not always possible due
    to the absence of some size classes at some sites. For example, except for eucalypts,
    it was relatively difficult to find trees <1.5 m tall in unburnt treatment sites.
    Regardless of size class, I aimed to tag a minimum of 10 trees per species at
    each site (Table 5). Size classes aligned with those used by Werner and Prior (2013),
    small resprout (<0.5 m), advanced resprout (0.5≥<1.5 m tall), and sapling (≥1.5
    m tall but less than 5 cm diameter at 50 cm above ground). The total number of
    trees tagged at each site and fire treatment ranged between 84 and 130 (Table 6).
    The three eucalypts and Planchonia careya were the only species present at every
    site. It is not possible to infer species abundances or size class distributions
    from this dataset given I subjectively selected individuals, however the data
    does give some indication of the presence or absence of certain species and sizes,
    given my attempts to sample evenly across these. ^p Size of each tagged tree was
    measured at the start and end of the dry season (May and November respectively)
    between May 2014 and May 2016 (Fig. 8). Size measurements were height, diameter
    at 50 cm above ground and a binary variable of whether the tree had a clearly
    dominant stem, as opposed to multiple stems of similar size. Measurement of diameter
    at 50 cm above ground (henceforth ‘diameter’) was consistent with Lawes et al.
    (2011b) for small trees. If a tree was shorter than 50 cm or stems were less than
    1 cm diameter, only height was recorded. ^p Resprouting response of all trees was
    recorded at the end of the dry season (November). Resprouting traits included,
    number of stems, type of resprout (basal, epicormic, both or none), total number
    of sprouts, and maximum height of resprouting. For species that only basally resprouted,
    resprout height was recorded as zero. Seasonal leaf flush on deciduous species
    was not counted as resprouting, unless associated with new stem emergence. I also
    recorded the number of dead stems. Although initially intended as a post-fire
    response measure in the annual treatment, resprouting response was also relevant
    to the unburnt treatment. Occasional dry season die-back occurred in the unburnt
    treatment causing trees to invest in new sprouts from the start of the wet season
    in November. ^p In the annual treatment, individual fire effects were assessed
    in July 2014 and August 2015, as soon as possible after sites were burnt in June-July
    2014 and July 2015 (Fig. 2). At each tree, I recorded the presence of live foliage
    (‘green’) and measured scorch height as the height to which leaves were killed
    by radiant heat. Scorch height was measured either directly from the individual,
    or if completely scorched, from the nearest detectable limit of leaf scorch on
    a neighbouring tree. I determined whether a tree was topkilled via a decision
    framework that considered the burn environment and resprouting response of each
    tree (Fig. 3). If a tree was completely scorched (green = no) and either did not
    resprout (resprout type = none) or resprouted basally (resprout type = basal)
    it was considered topkilled. Occasionally, topkill was the result of cambial damage
    despite green foliage persisting post-burn. In this case, topkill was inferred
    by whether the individual decreased in height after the fire (green = yes, resprout
    type = basal and heightNext < height). In any other scenario, I assumed that the
    tree was not topkilled. Of 826 cases of topkill, 46 were in trees where the crown
    was not completely scorched but the cambium was killed (5.6%). There were 456
    cases of trees not-topkilled in the annual treatment over the two census years.
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: Additional traits, fire_escape_height (the model-predicted height at which a stem has a 95% chance of avoiding topkill by an early dry season). The flowering and fruiting observations of Chapter 6 are included in Freeman_2018.
identifiers: .na
locations:
  Tiwi Carbon Study fire experiment, western Melville Island:
    latitude (deg): -11.70
    longitude (deg): 130.88
    description: eucalypt open forest (mesic savanna)
    vegetation: Eucalypt open forest co-dominated by Eucalyptus miniata, Eucalyptus
      tetrodonta and Corymbia nesophila, with a C4 grass understorey (Chrysopogon, Sorghum,
      Eriachne) and multi-stemmed woody resprouts.
    precipitation, MAP (mm): 1190-1545
    soil type: clayey sands, sandy loams and loamy sands; nutrient-poor kandosols
    fire history: annual early dry season burning, or fire exclusion, since plantation
      establishment in 2005/06; frequently burnt before 2005/06
    locality: Imalu, Shark Bay, Taracumbi and Pikertaramoor, western Melville
      Island, Tiwi Islands
    state: NT
contexts:
- context_property: fire treatment
  category: treatment_context
  var_in: fire_treatment
  values:
  - value: annual
    description: burnt annually in the early dry season
traits:
- var_in: leaf_phenology
  unit_in: .na
  trait_name: leaf_phenology
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: They are evergreen, although occasionally dry-season deciduous as juveniles
    (Werner et al. 2006). In contrast to Werner et al. (2006) who suggest this deciduousness
    is ubiquitous, I observed that most juvenile eucalypts maintained leaves throughout
    the dry season. ^p Records the leaf phenology of the tagged eucalypt resprouts
    and saplings through the dry season.
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Despite many persisting as shrubs under frequent fire, all have the potential
    to become trees (single stemmed >6 m tall) and nearly all are capable of basal
    resprouting either from lignotuber or rhizome, except for Acacia leptocarpa which
    is a post-fire re-seeder. ^p Acacias are generally relatively weak resprouters,
    often regenerating from seed after fire. Although Acacia latescens is a capable
    resprouter, Acacia leptocarpa is not.
- var_in: bud_bank_location
  unit_in: .na
  trait_name: bud_bank_location
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Despite many persisting as shrubs under frequent fire, all have the potential
    to become trees (single stemmed >6 m tall) and nearly all are capable of basal
    resprouting either from lignotuber or rhizome, except for Acacia leptocarpa which
    is a post-fire re-seeder. ^p In this study, Acacia latescens is a facultative
    basal resprouter. The Proteaceae, Grevillea heliosperma, is a basal and epicormic
    resprouter.
- var_in: resprouting_capacity_juvenile
  unit_in: .na
  trait_name: resprouting_capacity_juvenile
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: In the annual treatment, individual fire effects were assessed in July
    2014 and August 2015, as soon as possible after sites were burnt in June-July 2014
    and July 2015 (Fig. 2). At each tree, I recorded the presence of live foliage (‘green’)
    and measured scorch height as the height to which leaves were killed by radiant
    heat. [...] I determined whether a tree was topkilled via a decision framework
    that considered the burn environment and resprouting response of each tree (Fig.
    3). If a tree was completely scorched (green = no) and either did not resprout
    (resprout type = none) or resprouted basally (resprout type = basal) it was considered
    topkilled. [...] ^p Whole-plant mortality rate over the two years of data collection
    was very low, 0.2% in year 1 and 0.8% in year 2. Seven individuals died in the
    unburnt treatment, six in the annual treatment and most deaths occurred in the
    dry season (Table 3). Acacia latescens accounted for half the total mortality.
    ^p Records whether tagged resprouts and saplings survived and resprouted after
    topkill by annual early dry season fires. ^p All 11 tagged resprouting species are scored as juvenile_resprout
     because only 13 of 1,250 tagged trees died over
    two years of annual burning (826 topkill events)
- var_in: post_fire_recruitment
  unit_in: .na
  trait_name: post_fire_recruitment
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Despite many persisting as shrubs under frequent fire, all have the potential
    to become trees (single stemmed >6 m tall) and nearly all are capable of basal
    resprouting either from lignotuber or rhizome, except for Acacia leptocarpa which
    is a post-fire re-seeder.
