contexts:
- context_property: fire history
  category: plot_context
  var_in: fire_history
  values:
  - find: last burnt 2 years 8 months before sampling
    value: last burnt 2 years 8 months ago
    description: burnt in the January 2005 wildfire, sampled in September 2007.
  - find: last burnt 11 months before sampling
    value: last burnt 11 months ago
    description: burnt in the January 2005 wildfire, flowering observed in December 2005.
  - find: unburnt in the January 2005 wildfire
    value: unburnt
    description: not burnt in the January 2005 wildfire.
  - find: sampled before the January 2005 wildfire
    value: pre-fire
    description: sampled in September 2004, before the January 2005 wildfire.
  - find: severe wildfire, regeneration observed over 20 years
    value: last burnt about 20 years ago
    description: regeneration followed for about 20 years after a severe wildfire.
- context_property: fire season
  category: plot_context
  var_in: fire_season
  values:
  - value: summer
    description: fire occurred in summer
- context_property: fire severity
  category: plot_context
  var_in: fire_severity
  values:
  - value: high
    description: burnt at high severity, with all readily flammable biomass, including the litter layer, removed.
  - value: severe
    description: burnt at high severity.
  - value: unburnt
    description: not burnt in the January 2005 wildfire.
- context_property: fire intensity
  category: plot_context
  var_in: fire_intensity
  values:
  - value: extreme
    description: extreme intensity wildfire.
  - value: unburnt
    description: not burnt in the January 2005 wildfire.
- context_property: fire response type
  category: entity_context
  var_in: regeneration_type
  values:
  - find: seedlings
    value: from seed
    description: plants that germinated after the fire.
  - find: resprouts
    value: from resprouting
    description: plants resprouting after the fire.
- context_property: microhabitat
  category: plot_context
  var_in: habitat
  values:
  - value: roadside vegetation
    description: roadside vegetation, receiving water run-off from the road surface and verges.
traits:
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: entity_type
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Observations on plant regeneration noted during the survey are compiled in
    Appendix 2. All plant species occurrences in quadrats burnt by the 2005 fire were
    assessed to determine their mode of regeneration. The following five categories were
    used, R = by regrowth; S = from seed; U = undetermined; R?= probably by regrowth; S? =
    probably by seed. In a number of cases a species exhibited both seedling and regrowth
    regeneration modes and this was recorded. Additional regeneration comments were often
    noted against each species occurrence, these have been entered in the Survey database
    and are also incorporated in Appendix 2. ^p Non-basal regrowth (ie re-sprouting from
    stems well above ground level) was only recorded for Eucalypts (Sugar Gum, Eucalyptus
    cladocalyx and Eyre Peninsula Blue Gum, E. petiolaris) regrowing from epicormic shoots
    and for Yacca (Xanthorrhoea semiplana), re-shooting from the tops of burnt trunks. ^p
    Basal regrowth was readily deduced for shrubs with blackened dead woody stems emergent
    from the base of their new foliage (Figure 9, Figure 11), but smaller plants often had
    to be dug up to look for evidence of fire-scarring on their basal parts (Figures 37 to
    40, pp. 57 to 59). In many cases smaller perennial species growing from underground
    rhizomes were assigned to the undetermined category, as it was it was impossible to rule
    out the possibility that at least some of these had re-established from seed even though
    it seemed likely that they could have survived the fire from organs below the soil
    surface. ^p Seedling status was readily determined in a few instances where cotyledons
    persisted at the base of stems, or where plants had germinated from persistent woody
    fruit (Figure 11), but for most perennials it was based on the presence of a determinate
    root system, typically with a long tap root or a central major root with diminishing
    lateral branching (Figure 25, p. 49). All annual plants were presumed to have
    regenerated by seed, but for renascent tuberous geophytes (such as orchids and many
    lilies) the regeneration mode was generally scored as undetermined. ^p Records whether
    burnt plants resprouted or were killed, from the regeneration mode of each species in
    each burnt quadrat, and from the species accounts.
