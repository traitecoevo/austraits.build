- var_in: life_history
  unit_in: .na
  trait_name: life_history
  entity_type: entity_type
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Appendix 2, KEY, LS, Life span, A = annual/biennial; P = perennial; R =
    renascent perennial (regrowing annually above the ground) ^p Life span class of each
    taxon in Appendix 2, and statements in the species accounts.
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: entity_type
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: To investigate the fire response more closely in terms of differential changes
    in life form types, species were assigned to life form classes that were modified from
    the adapted Muir-based classes used by the standard biological survey process (Muir,
    1977; Forward & Robinson, 1996). The new classes were designed to represent more
    ecologically based categories. Their definitions and relationships with Muir codes are
    set out in Table 18. The recorded life form class is listed against each species
    occurrence in Appendix 2. ^p Life form classes recorded for each taxon in the quadrats.
- var_in: leaf_phenology
  unit_in: .na
  trait_name: leaf_phenology
  entity_type: entity_type
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Appendix 2, KEY, LS, Life span, A = annual/biennial; P = perennial; R =
    renascent perennial (regrowing annually above the ground) ^p Taxa classed as renascent
    perennials, regrowing annually above the ground.
- var_in: storage_organ
  unit_in: .na
  trait_name: storage_organ
  entity_type: entity_type
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Table 18, TB, tuberous / bulbous geophytes, Bulbous or tuberous herbaceous
    geophytes (all SA Orchidaceae, many Liliaceae, Iridaceae, and Droseraceae with bulbs)
    which behave as renascent perennials. ^p Taxa classed as tuberous or bulbous geophytes,
    and storage organs described in the species accounts and figure captions.
- var_in: fire_time_from_fire_to_flowering
  unit_in: mo
  trait_name: fire_time_from_fire_to_flowering
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: There were 28 obligate seeder native shrub species that were found in post-fire
    quadrats only as seed- established plants and these are listed in Table 19. The Legumes
    with 17 species are the best represented family in this list, all five Bush-pea
    (Pultenaea) species and 10 of the 12 Acacia species were recorded as regenerating solely
    by seed. The two exceptional Acacias that were also observed re-sprouting as well as
    regenerating by seedlings were Thorn Wattle (Acacia continua) and Spiny Wattle (A.
    spinescens). In addition the table includes all three Spyridium species and both
    Riceflower (Pimelea) species recorded in the survey quadrats, as well as , Twiggy
    Daisy-bush (Olearia ramulosa), Ruddy Beard-heath (Leucopogon rufus) and Totem-poles
    (Melaleuca decussata. It is also notable that Totem-poles, a moderately large shrub,
    showed no re-sprouting at any of its six post-fire sites. ^p For species that depend on
    seedling recruitment, the time taken for replenishment of the seed bank is important in
    relation to the timing of the next fire or other disturbance event that may impact
    seedling survival. The majority of these species (20 of the 28) had already achieved
    reproductive maturity within three years post-fire (life stage columns B, F and I)
    despite, in most cases, being below their mature height. Table 19 shows that most were
    under 1 m in height (Life form classes SD and SC), and a few (predominantly Acacia
    species) had exceeded 1.0 or 1.5 m (Life form classes SB and SA). ^p Eight shrub species
    recorded as regenerating solely by seed were only scored as having life stages V
    (sterile/vegetative phase established plants) and/or S (small seedlings). These species
    are marked with an asterisk in Table 19. Whilst evidence of earlier reproductive phases
    may be easily lost for annual species, this is unlikely to happen for these perennial
    shrubs. It is reasonable to conclude that the absence of any reproductive life stages
    recorded in September 2007 (including no remains of fruit shed in the last year or very
    young flowering buds) indicates that regrowth of these species had not yet reached
    reproductive maturity. ^p Two of the non-reproductive species, Twiggy Daisy-bush
    (Olearia ramulosa) and Ruddy Beard-heath (Leucopogon rufus), flower in autumn and summer
    respectively, and may have been close to initiating their first flower buds when the
    survey was conducted in September. The other six species are legumes of which four are
    Acacias, and as these are spring flowering, they would require at least another year of
    growth to reach reproductive maturity. This gives a minimum period of four years for the
    six legume species to achieve their first seed set. ^p Two species, Cranberry Heath
    (Astroloma humifusum) and Slender Cherry (Exocarpos sparteus), were excluded from the
    table because they were recorded as regenerating from basal regrowth, although for each
    this was a rare occurrence at a single site. However both also occurred in another five
    sites where only seedling regrowth was recorded, and therefore appear to be largely
    dependent on this regeneration mode. It was significant that both of these species had
    not yet reached reproductive maturity. Also notable was the ^p Time from the January
    2005 fire to the September 2007 survey for plants that had or had not yet flowered.
