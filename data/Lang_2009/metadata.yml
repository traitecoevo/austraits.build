questions:
  question1: In Appendix 2, the comment for Chamaescilla corymbosa var. corymbosa at
    KOP00201 reads '1.0 - 1.2 m tall. Heavy fruit set on most.' Does this comment belong to
    another species in that quadrat?
  question2: Appendix 2 lists Gyrostemon ramulosus at MUR00201, but Appendix 1 lists only
    Gyrostemon australasicus (quadrats) and G. thesioides (opportunistic collections). Which
    Gyrostemon species was recorded at MUR00201?
  question3: In Appendix 2, the comment for Hakea cycloptera at KOP00901 reads 'Leaves
    show characters of D. humilis.' Does this comment belong to one of the Dodonaea records
    at that quadrat?
  question4: Could you provide the full reference for Ecological Associates (2006), cited
    for the prolific flowering of Ptilotus beckerianus in December 2005? It is not in the
    reference list.
  question5: Do you have locality details or coordinates for the two opportunistic
    collections of Haeckeria cassiniiformis (BS128-4661 and BS128-4890) in Wanilla
    Conservation Park and Tucknott Scrub Conservation Park?
