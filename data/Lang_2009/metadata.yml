  description: To document the impact of the January 2005 wildfire on the flora and fauna
    of fragmented, restricted habitats on southern Eyre Peninsula, and to test whether
    revisiting standard Biological Survey of South Australia quadrats can describe major
    changes in vegetation over time.
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: During 2004, 36 sites on southern Eyre Peninsula were sampled as part
    of an ongoing biological survey of remnant habitats across the whole Eyre Peninsula
    (BS128) conducted by the Department for Environment and Heritage. The 36 sites had been
    chosen to represent the range of major native habitat types present in the area and were
    surveyed using standard Biological Survey methods. The vegetation survey component was
    conducted during September 2004, and selected quadrats were followed up with vertebrate
    surveys during December 2004. All sites had been permanently marked with star droppers
    as reference points for repeatable photographs and the location of a 30m x 30m
    vegetation quadrat. ^p In January 2005 a wild fire which started near Wangary south of
    the Marble Range swept across southern Eyre Peninsula and burnt through nine of the
    sites that had been surveyed during the previous year (Figure 1). Seven of the nine
    sites had been surveyed for fauna as well as vegetation. ^p The nine burnt sites were
    revisited during 2007, three growing seasons after the fire, and re-surveyed using the
    same biological survey methods to assess the recovery and loss of plant and animal
    species, and the appearance of previously unrecorded species. Three of the burnt sites
    were on the plains in between the Marble Range and Koppio Hills with the remaining six
    in the Koppio Hills. An additional five new burnt sites were also sampled in 2007 to
    provide extra data on regeneration responses. ^p Four unburnt original survey sites from
    the northern half of the Koppio Hills were also re-surveyed as controls. These match the
    majority of burnt sites in being located in the main range system of the Koppio Hills
    and district rainfall records indicate that they experienced a similar pattern of a
    decrease in growing season rainfall from 2004 to 2007. ^p The methods used in this study
    were consistent with those used for the Biological Survey of South Australia detailed by
    Heard and Shannon (1997) for vegetation, and Owens (2000) for fauna. Sites were
    originally selected to sample the range of landforms and vegetation types represented in
    the region and spread as far as practical to cover geographic variation. All nine burnt
    sites (ULE01001-ULE01201 and KOP00201- ^p ULE01201 and KOP00201-KOP00601). The location
    of sites and their history is summarised in Table 1. ^p For flora records,
    between-observer biases were eliminated by using the same two botanists for all
    quadrats, and seasonal differences were minimised (although not eliminated) by timing
    both surveys in September. ^p On the first visit in 2004 sites were marked with two
    galvanised star droppers spaced 10m apart to mark the centre of one edge of a 30m x 30m
    vegetation quadrat and provide a camera position and sighting post for the photograph.
    During September 2004 each plant species detected within the quadrat was recorded and
    assigned a cover abundance class. The dominant life form category, and one or more
    phenological life stages (flowering, fruiting etc) with significant representation were
    also recorded. For the post fire visit in September 2007, datasheets were produced for
    each quadrat with a pre-printed list of species found in 2004 sorted by cover/abundance
    scores. These species were checked and if still present their new cover/abundance,
    dominant life form and life stage information was recorded, while species not previously
    recorded at the quadrat were added to the bottom of the list. The datasheet also
    contained a column for regeneration comments. These comments included the type of
    regeneration that was observed, viz. basal, epicormic, or seedling). In addition to the
    sites surveyed, more extensive opportunistic searching for rare and previously
    unrecorded species was done in some of the conservation reserves once all sites had been
    surveyed. ^p Observations on plant regeneration noted during the survey are compiled in
    Appendix 2. All plant species occurrences in quadrats burnt by the 2005 fire were
    assessed to determine their mode of regeneration. The following five categories were
    used, R = by regrowth; S = from seed; U = undetermined; R?= probably by regrowth; S? =
    probably by seed. In a number of cases a species exhibited both seedling and regrowth
    regeneration modes and this was recorded. Additional regeneration comments were often
    noted against each species occurrence, these have been entered in the Survey database
    and are also incorporated in Appendix 2. ^p Non-basal regrowth (ie re-sprouting from
    stems well above ground level) was only recorded for Eucalypts (Sugar Gum, Eucalyptus
    cladocalyx and Eyre Peninsula Blue Gum, E. petiolaris) regrowing from epicormic shoots
    and for Yacca (Xanthorrhoea semiplana), re-shooting from the tops of burnt trunks. ^p
    Basal regrowth was readily deduced for shrubs with blackened dead woody stems emergent
    from the base of their new foliage (Figure 9, Figure 11), but smaller plants often had
    to be dug up to look for evidence of fire-scarring on their basal parts (Figures 37 to
    40, pp. 57 to 59). In many cases smaller perennial species growing from underground
    rhizomes were assigned to the undetermined category, as it was it was impossible to rule
    out the possibility that at least some of these had re-established from seed even though
    it seemed likely that they could have survived the fire from organs below the soil
    surface. ^p Seedling status was readily determined in a few instances where cotyledons
    persisted at the base of stems, or where plants had germinated from persistent woody
    fruit (Figure 11), but for most perennials it was based on the presence of a determinate
    root system, typically with a long tap root or a central major root with diminishing
    lateral branching (Figure 25, p. 49). All annual plants were presumed to have
    regenerated by seed, but for renascent tuberous geophytes (such as orchids and many
    lilies) the regeneration mode was generally scored as undetermined.
  original_file: Lang_2009 Eyre-Peninsula-2005-Fire-Impacts-BioSurvey.pdf (report PDF)
  notes: Appendix 2 (regeneration records) and Appendix 1 (vouchers) are also kept
    verbatim in raw/. ^p resprouting_capacity, post_fire_recruitment and bud_bank_location
    are scored for every perennial record at a burnt quadrat whose regeneration mode was
    determined. Records of annuals (presumed by the authors to regenerate from seed),
    records with an undetermined (U) mode and records at unburnt quadrats are not scored for
    fire response. Regrowth of woody plants other than Eucalyptus cladocalyx, E. petiolaris
    and Xanthorrhoea semiplana is scored as basal_buds, following the Methods statement that
    non-basal regrowth was recorded only for those species. Where comments state that most
    plants were killed, resprouting_capacity is scored partial_resprouting or fire_killed.
    ^p life_history, plant_growth_form, leaf_phenology (renascent perennials) and
    storage_organ and bud_bank_location (tuberous/bulbous geophytes) come from the life span
    and life form classes in Appendix 2 and are scored once per taxon, at the first site
    listed. Growth form uses all life form classes recorded for the taxon; shrub height
    classes recorded only for regenerating trees at burnt sites are not scored as shrub. ^p
    Time from fire to flowering and reproductive maturity are the time from the fire
    (January 2005) to the survey (September 2007), as maxima for plants with flowers or
    fruit and minima for plants that had not yet flowered. ^p Candidate trait not yet in
    traits.yml, plant_flammability (Acacia rupicola). ^p data.csv also holds the
    cover/abundance score, life form class and regeneration comments for each record
    (including seedling and regrowth heights), and the quadrat counts by life form and life
    stage from Table 19.
