traits:
- var_in: avg leaf area
  unit_in: cm2
  trait_name: leaf_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 5-20
  methods: From each provenance, five trees were sampled for the measurement of specific
    leaf area (SLA, n = 105), and five to twenty leaves per tree were collected, depending
    on leaf quality. We selected fully expanded and hardened leaves. Leaves were scanned
    digitally, and the area of scanned leaves was subsequently measured using the image
    analysis software 'ImageJ' v1.54i [48]. Leaf dry weights were recorded after the
    samples had been oven-dried at 80 °C for 48 h (until they reached a constant weight).
    All measurements were averaged to give a single value per sample tree.
- var_in: avg dry wt
  unit_in: g
  trait_name: leaf_dry_mass
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 5-20
  methods: From each provenance, five trees were sampled for the measurement of specific
    leaf area (SLA, n = 105), and five to twenty leaves per tree were collected, depending
    on leaf quality. We selected fully expanded and hardened leaves. Leaves were scanned
    digitally, and the area of scanned leaves was subsequently measured using the image
    analysis software 'ImageJ' v1.54i [48]. Leaf dry weights were recorded after the
    samples had been oven-dried at 80 °C for 48 h (until they reached a constant weight).
    All measurements were averaged to give a single value per sample tree.
- var_in: avg_SLA
  unit_in: cm2/g
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 5-20
  methods: From each provenance, five trees were sampled for the measurement of specific
    leaf area (SLA, n = 105), and five to twenty leaves per tree were collected, depending
    on leaf quality. We selected fully expanded and hardened leaves. Leaves were scanned
    digitally, and the area of scanned leaves was subsequently measured using the image
    analysis software 'ImageJ' v1.54i [48]. Leaf dry weights were recorded after the
    samples had been oven-dried at 80 °C for 48 h (until they reached a constant weight).
    All measurements were averaged to give a single value per sample tree.
- var_in: density
  unit_in: '{count}/mm2'
  trait_name: leaf_stomatal_density_abaxial
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 2
  methods: For the measurement of stomatal density (SD), nail polish imprints were
    taken in the middle of the abaxial (lower) surface of leaves, avoiding major veins
    and edges, which were then observed by light microscope [49]. This part of the
    leaf region was used because it represents the average value SD across the entire
    leaf and provides a good proxy for the leaf as a whole [50]. Transparent nail polish
    was used for the impressions, and imprints were mounted on the microscope slide.
    The camera field view of the microscope was approximately 0.074825 mm2 under a
    400x magnification. This specific area of the camera view allows for accurate
    counting of stomata within a defined space, ensuring consistency across all measurements.
    Thus, to calculate the density, the total number of stomata that fell within the
    field view was counted and divided by the area of the field view. Three images
    were taken from each nail polish peel, one peel was taken from each leaf, and two
    leaves were sampled from each tree. This process was repeated across five trees
    per provenance (n = 210). Measurements were averaged to give a single value for
    each sample tree. Stomatal density is the mean of the six images per tree.
- var_in: osmotic_potential
  unit_in: MPa
  trait_name: osmotic_potential_at_full_turgor
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Osmotic potential at full turgor of leaves was measured by osmometry of
    expressed sap [51]. Five trees from each provenance were measured (n = 105), and
    three leaves were taken from each tree. Collected leaves were rehydrated for at
    least one hour to compare individuals at full hydration, also known as full turgor
    (pi(100)). The water potential of each leaf was assessed using a pressure chamber
    following hydration. A leaf was considered to be at full turgor if the water potential
    reached greater than -0.1 MPa. Leaf material was then extracted with a cork borer,
    avoiding the mid-veins, and then placed into a 0.6 mL micro-tube and immediately
    stored in a freezer. The plant material was kept frozen for a day, thawed and
    sap extracted by centrifugation. The osmolality of expressed sap was determined
    using a freezing point osmometer (Osmomat 030, Gonotec, Berlin, Germany) that
    was calibrated using solutions provided by the manufacturer. ^p Osmolality values
    (osmol/kg) were converted to osmotic potential (MPa) as -2.3958 x osmolality,
    following the van't Hoff relation used by Bartlett et al. (2012, Methods in Ecology
    and Evolution 3:880-888).
- var_in: gminvalue
  unit_in: mmol{H2O}/m2/s
  trait_name: leaf_conductance_minimum
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Minimum stomatal conductance (gmin) was measured by the bench drying method
    [52,53], with minor modifications. Fully expanded, sun-exposed leaves without
    visible damage were collected early in the morning. We measured one leaf per tree
    and five trees per provenance (n = 105). Measurements were conducted for five
    days, with 21 leaves from 21 provenances measured for each day. Collected leaves
    were kept in zip-lock bags with a moist tissue paper and then transported to the
    lab within one hour. Leaves were labelled and then rehydrated with distilled water
    for one hour before starting the procedure. After fully rehydrating the leaves,
    petioles were cut and sealed with melted candle wax to prevent moisture loss.
    The prepared leaves were placed on a drying rack with weather station sensors
    positioned next to the rack to record climate conditions (temperature, relative
    humidity and atmospheric pressure). The leaves were weighed at 30 min intervals
    over a period of 5 h and 30 min, resulting in a total of 12 data points for each
    leaf sample. At the end of the measurement, leaves were scanned, and the leaf
    area was calculated using ImageJ software. The recorded data--weighing times,
    values of leaf mass (g), leaf area (cm2), temperature (°C), relative humidity
    (%) and atmospheric pressure (kPa)--were entered into a spreadsheet. Saturated
    vapour pressure (VPsat in kPa) and mole fraction vapour pressure deficit (mfVPD
    in mol x mol-1) were calculated based on the temperature and relative humidity
    values. gmin was computed using the last four data points. Since gmin can be sensitive
    to fluctuations in temperature and relative humidity [54], particularly under
    extreme conditions, care was taken to ensure stable environmental conditions throughout
    the measurement.
substitutions: .na
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: The data file (op.csv) indicates that the values are still raw osmolality values (0.52-0.98 osmol/kg), but appear to have been
    reported in the paper as osmotic potential at full turgor in MPa (-0.52
    to -0.72 MPa); the authors' script only multiplies osmolality by -1. Converting
    osmolality to osmotic potential uses the modified Van't Hoff equation (effectively multiplying by about 2.4 MPa kg/osmol),
    giving -1.2 to -2.4 MPa, which is also more typical for eucalypts. Can you confirm
    the values in op.csv are osmolality (osmol/kg) as read from the osmometer?
  question2: gmin.csv identifies leaves by provenance and measurement day (1-5) but
    not by tree. Do the measurement day numbers correspond to tree numbers in the other files (sla.csv,
    sd.csv, op.csv)?
  question3: The irrigation period is described as "late spring to early autumn (May-October)";
    should this read November-April?
