dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      dplyr::mutate(
        osmotic_potential = as.character(round(-2.3958 * as.numeric(osmolality), 3))
      )
  '
  collection_date: 2024
  taxon_name: taxon_name
  location_name: location_name
  individual_id: individual_id
  description: To determine whether provenances of alpine ash (Eucalyptus delegatensis),
    a montane obligate seeder threatened by drought and altered fire regimes, have
    adapted to the climate in which they grow, and to identify provenances that could
    improve forest resilience through climate-adjusted seed sourcing.
  basis_of_record: field_experiment
  life_stage: sapling
  sampling_strategy: The study was conducted at a common garden provenance trial site
    located at the Burnley Campus of the University of Melbourne, Victoria, Australia
    (-37.829, 145.024, Figure 1). A common garden is a traditional experimental approach
    where populations sourced from various locations of a species are planted together
    in the same environment to observe the differences in the functional traits among
    provenances [41]. Such experiments are used to test and differentiate the adaptive
    capacity of populations from different environments [42]. The mean annual rainfall
    and mean annual temperature of the site are 648 mm and 15 °C, respectively [43].
    ^p Seeds were collected from 21 provenances across the geographic distribution
    of alpine ash in southeastern Australia (Figure 1). Among them, 15 provenances
    were from the state of Victoria (VIC), three from Tasmania (TAS) and three from
    New South Wales (NSW; Appendix A, Table A1). Seeds were germinated at a nursery
    and planted in the common garden in November 2022 when the seedlings were six
    months of age. After planting, plants were irrigated every second day for half
    an hour from late spring to early autumn (May-October) with approximately 2 litres
    of water per plant. By the time the leaf samples were collected for this study,
    the plants were about two years old, corresponding to 1.5 years after planting.
    ^p The four climatic variables used in this study to investigate climatic adaptation
    were mean annual temperature (MAT), mean annual precipitation (MAP), elevation
    and the annual heat moisture index (AHMI). Climate data were sourced from WorldClim
    [44]. AHMI was subsequently calculated from MAT and MAP (AHMI = [MAT + 10]/[MAP/1000]),
    which is a measure of the climatic aridity of each provenance location [45,46].
    AHMI was chosen for this study because it integrates the interactive impacts of
    temperature and precipitation, distinguishes warm-dry from cool-wet areas of the
    landscape, and, therefore, better quantifies the effects of local climates on
    plant communities. We further considered elevation, which was sourced from the
    Shuttle Radar Topography Mission data [47]. All variables were extracted for the
    location of provenance origin (Appendix A, Table A1).
    ^p Alpine ash seedlings were planted in three replicate plots that each had a
    uniform spacing of 2.5 m between each plant. The plots were rectangular, measured
    35 m x 25 m, and had a total of 165 plants per plot. A specific planting pattern
    with a matrix of three rows and three columns forming a 3 x 3 grid was created
    so that the provenances did not neighbour themselves but neighbour the same set
    of other provenances in a consistent manner (Appendix A, Figure A1).
  original_file: sla.csv, sd.csv, op.csv, gmin.csv and climate_origin.csv downloaded from the
    authors' GitHub repository (https://github.com/BennyWag/ashtraits), combined into
    data.csv by raw/extra_R_code_Gurung_2025.R.
  notes: gmin.csv identifies leaves
    by provenance and measurement day rather than by tree, so gmin values are given
    separate individual_ids from the trees used for the other traits. Osmotic potential
    at full turgor was calculated from the raw osmolality values with the van't Hoff
    relation (see question1).
