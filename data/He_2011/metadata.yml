traits:
- var_in: clonal_spread_mechanism
  unit_in: .na
  trait_name: clonal_spread_mechanism
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Clonality may be viewed as the ultimate whole-plant adaptation to fire
    [most vulnerable to being burnt (ground-hugging), best protected budbank (soil),
    least seed production, survives the most fire-cycles]. Consequently, growth form
    was partitioned into clonal (vegetative reproduction via rhizomes or root suckers
    after fire, minimal seed production) and nonclonal (no vegetative reproduction,
    recovery via epicormic and/or lignotuberous buds and/or seeds after fire) taxa.
    Traits for all Banksia taxa, five Dryandra species and the outgroup were collated
    from the literature (Taylor & Hopper, 1988; George, 1996; Collins et al., 2008;
    Western Australian Herbarium, 2009) and our own fieldwork (dead leaf retention
    has not been recognized previously). Traits for individual species are provided
    in the accompanying figures. ^p Fig. 1 legend, NC, Non-clonal; C, Clonal; C(RH),
    Resprouting from rhizomes; C(RS), Resprouting from root suckers. ^p Values are
    the growth form and clonal organ given in each taxon's Fig. 1 tip label.
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Study species were first categorized according to their whole-plant response
    to fire, that is, resprouting or its opposing state, fire-killed. Traits for all
    Banksia taxa, five Dryandra species and the outgroup were collated from the literature
    (Taylor & Hopper, 1988; George, 1996; Collins et al., 2008; Western Australian
    Herbarium, 2009) and our own fieldwork (dead leaf retention has not been recognized
    previously). Traits for individual species are provided in the accompanying figures.
    ^p Fig. 1 legend, NC(K), Fire-killed; NC(E), Resprouting from epicormic buds;
    NC(L), Resprouting lignotuber; NC(E,L), Resprouting from epicormic buds or lignotuber;
    C(RH), Resprouting from rhizomes; C(RS), Resprouting from root suckers. ^p Values
    are the fire response given in each taxon's Fig. 1 tip label.
- var_in: bud_bank_location
  unit_in: .na
  trait_name: bud_bank_location
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Study species were first categorized according to their whole-plant response
    to fire, that is, resprouting or its opposing state, fire-killed. [...] growth
    form was partitioned into clonal (vegetative reproduction via rhizomes or root
    suckers after fire, minimal seed production) and nonclonal (no vegetative reproduction,
    recovery via epicormic and/or lignotuberous buds and/or seeds after fire) taxa.
    Traits for individual species are provided in the accompanying figures. ^p Fig.
    1 legend, NC(K), Fire-killed; NC(E), Resprouting from epicormic buds; NC(L), Resprouting
    lignotuber; NC(E,L), Resprouting from epicormic buds or lignotuber; C(RH), Resprouting
    from rhizomes; C(RS), Resprouting from root suckers. ^p Values are the resprouting
    bud location given in each taxon's Fig. 1 tip label.
- var_in: storage_organ
  unit_in: .na
  trait_name: storage_organ
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Consequently, growth form was partitioned into clonal (vegetative reproduction
    via rhizomes or root suckers after fire, minimal seed production) and nonclonal
    (no vegetative reproduction, recovery via epicormic and/or lignotuberous buds
    and/or seeds after fire) taxa. Traits for individual species are provided in the
    accompanying figures. ^p Fig. 1 legend, NC(L), Resprouting lignotuber; NC(E,L),
    Resprouting from epicormic buds or lignotuber. ^p Records the taxa whose Fig.
    1 tip label includes a lignotuber.
- var_in: serotiny
  unit_in: .na
  trait_name: serotiny
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Taxa were then classified as either retaining at least some of their seeds
    in the cones for several years or more (serotinous; Lamont et al., 1991) or releasing
    all of their seeds at maturity (nonserotinous). Traits for all Banksia taxa, five
    Dryandra species and the outgroup were collated from the literature (Taylor &
    Hopper, 1988; George, 1996; Collins et al., 2008; Western Australian Herbarium,
    2009) and our own fieldwork (dead leaf retention has not been recognized previously).
    Traits for individual species are provided in the accompanying figures. ^p Values
    are the serotiny state shown by each taxon's tip branch colour in Fig. 2.
- var_in: post_fire_recruitment
  unit_in: .na
  trait_name: post_fire_recruitment
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  basis_of_record: field
  methods: In this regard, we observed 15% of follicles open 2 yr after severe drought
    in 2006-07 in a population of Banksia hookeriana (serotinous, and retaining its
    dead leaves and florets) with 120 plants (97% dead), and the six seedlings had
    all died by 2009. By contrast, a nearby population that was burnt in 2007, and
    thus experienced the same drought, had 100% follicles open among 117 plants (100%
    dead) with 117 seedlings (3% dead). [...] leaving fire by far the more effective
    cue in seed release and seedling recruitment. ^p Seedling recruitment after the
    2007 fire in the burnt population.
- var_in: lifespan
  unit_in: a
  trait_name: lifespan
  entity_type: population
  value_type: mean
  basis_of_value: unknown
  replicates: unknown
  methods: The extreme longevity of clonal banksias (e.g. 1000 yr for B. candolleana,
    T. He and B. Lamont, unpublished data; 500 yr for B. goodii, Drechsler et al.,
    1999) attests to their success in surviving recurrent fire and drought. ^p Values
    are the estimated longevity of clones.
