traits:
- var_in: LMA_gm2
  unit_in: g/m2
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Five young, healthy, fully expanded leaves were selected from each branch
    for LMA, LDMC and leaf size measurements. The leaves, including petioles, were
    scanned and their total area determined for LMA and leaf size via IMAGEJ (Abramoff
    et al., 2004). Leaves were rehydrated in the fridge for > 24 h, with the petiole
    cut-end submerged in water-filled zip-lock bags, after which leaf fresh mass was
    determined, followed by oven-drying at 70°C for 48 h to obtain dry mass (mg).
    LMA was calculated by dividing dry mass by total area (g m-2).
- var_in: LDMC_mgg1
  unit_in: mg/g
  trait_name: leaf_dry_matter_content
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Five young, healthy, fully expanded leaves were selected from each branch
    for LMA, LDMC and leaf size measurements. The leaves, including petioles, were
    scanned and their total area determined for LMA and leaf size via IMAGEJ (Abramoff
    et al., 2004). Leaves were rehydrated in the fridge for > 24 h, with the petiole
    cut-end submerged in water-filled zip-lock bags, after which leaf fresh mass was
    determined, followed by oven-drying at 70°C for 48 h to obtain dry mass (mg).
    LDMC by dividing fresh mass by dry mass (mg g-1).
- var_in: leaf_area_mm2
  unit_in: mm2
  trait_name: leaf_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 5
  methods: Five young, healthy, fully expanded leaves were selected from each branch
    for LMA, LDMC and leaf size measurements. The leaves, including petioles, were
    scanned and their total area determined for LMA and leaf size via IMAGEJ (Abramoff
    et al., 2004). Leaves were rehydrated in the fridge for > 24 h, with the petiole
    cut-end submerged in water-filled zip-lock bags, after which leaf fresh mass was
    determined, followed by oven-drying at 70°C for 48 h to obtain dry mass (mg).
    Leaf size was the average area of the five leaves (mm2).
- var_in: leaf_thickness_um
  unit_in: um
  trait_name: leaf_thickness
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 2
  methods: Five young, healthy, fully expanded leaves were selected from each branch
    for LMA, LDMC and leaf size measurements. The leaves, including petioles, were
    scanned and their total area determined for LMA and leaf size via IMAGEJ (Abramoff
    et al., 2004). Leaves were rehydrated in the fridge for > 24 h, with the petiole
    cut-end submerged in water-filled zip-lock bags, after which leaf fresh mass was
    determined, followed by oven-drying at 70°C for 48 h to obtain dry mass (mg).
    Leaf thickness was measured as the mean thickness (µm) of two fresh leaves using
    a micrometer (accuracy of 0.001 mm).
- var_in: Huber_val_cm2m2
  unit_in: cm2{sapwood}/m2{leaf}
  trait_name: huber_value
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: SA to LA was measured on a 20 cm branch per individual. Leaves were removed
    and scanned to determine total leaf area (LA), while sapwood area (SA) was measured
    from a hand-sectioned sample taken from the base of the branch and stored in 70%
    ethanol. For 110 taxa, the section was imaged at 4x magnification and sapwood
    area, excluding the pith, was measured in IMAGE J (Abramoff et al., 2004). For
    92 taxa, sapwood area was determined using callipers and assuming minimal pith
    in all but two species (Eucalyptus tetraptera and E. brandiana), where pith was
    also measured and subtracted from total sapwood area. Eight taxa were measured
    using both approaches. SA to LA was calculated as sapwood area divided by leaf
    area (cm2 m-2).
- var_in: wd_gcm3
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Wood density was assessed by removing a c. 5 cm stem section, 50 cm from
    the branch tip, which was then stored in a zip-lock bag with a moist paper towel
    in a refrigerator for at least 72 h. Bark was removed, and the stem section was
    either left at 5 cm in length (109 species) or trimmed to 2 cm (93 species). The
    same eight taxa were measured using both protocols. The volume of the wood was
    determined by the water displacement method, that is, the section was completely
    submerged, and the weight of displaced water was recorded. The section was then
    oven-dried for a minimum of 72 h at 105°C, and wood density was calculated by
    dividing the dry mass by fresh volume (g cm-3).
- var_in: N_percent
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: 2-3
  methods: To measure leaf foliar nutrient and isotope traits, a minimum of five young,
    sunlit, fully expanded leaves were dried per individual and ground into a homogeneous
    powder, then combined into a single bulk sample for each taxon. Leaf N concentration
    on a mass basis (N mass , %) and δ13C were calculated using an elemental analyser
    coupled with an isotope ratio mass spectrometer (Washington State Stable Isotope
    Laboratory).
- var_in: dC13
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: 2-3
  methods: To measure leaf foliar nutrient and isotope traits, a minimum of five young,
    sunlit, fully expanded leaves were dried per individual and ground into a homogeneous
    powder, then combined into a single bulk sample for each taxon. Leaf N concentration
    on a mass basis (N mass , %) and δ13C were calculated using an elemental analyser
    coupled with an isotope ratio mass spectrometer (Washington State Stable Isotope
    Laboratory).
- var_in: cica
  unit_in: umol{CO2_internal}/umol{CO2_ambient}
  trait_name: leaf_intercellular_CO2_concentration_to_atmospheric_CO2_concentration_ratio
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: 2-3
  methods: To measure leaf foliar nutrient and isotope traits, a minimum of five young,
    sunlit, fully expanded leaves were dried per individual and ground into a homogeneous
    powder, then combined into a single bulk sample for each taxon. Leaf N concentration
    on a mass basis (N mass, %) and δ13C were calculated using an elemental analyser
    coupled with an isotope ratio mass spectrometer (Washington State Stable Isotope
    Laboratory).
- var_in: Narea
  unit_in: g/m2
  trait_name: leaf_N_per_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 2-3
  methods: To measure leaf foliar nutrient and isotope traits, a minimum of five young,
    sunlit, fully expanded leaves were dried per individual and ground into a homogeneous
    powder, then combined into a single bulk sample for each taxon. Leaf N concentration
    on a mass basis (N mass, %) and δ13C were calculated using an elemental analyser
    coupled with an isotope ratio mass spectrometer (Washington State Stable Isotope
    Laboratory).
