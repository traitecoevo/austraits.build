dataset:
  data_is_long_format: no
  custom_R_code: '
   data %>%
    mutate(
      site_name = "Currency Creek Arboretum"
    )
  '
  collection_date: 2019/2022
  taxon_name: Taxon_ALA
  location_name: site_name
  description: A study to mechanistic hypotheses for trait climate relationships for
    mature eucalypt trees grown in common garden and in situ field conditions, quantifying
    joint and individual effects of mean annual precipitation (MAP) and temperature
    (MAT) on eight functionally important traits
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: Common garden study site ^p Plants were sampled at Currency Creek
    Arboretum (CCA), a private common garden on the Fleurieu Peninsula, South Australia
    (-35.4288, 138.7611). The CCA site experiences a Mediterranean climate of cool
    wet winters and hot dry summers with a MAP and MAT of 467 mm (Table S1) and 15.3°C,
    respectively (W ORLD C LIM 2; Fick & Hijmans, 2017). The soil is sand or sandy
    loam over Middleton Sandstone. The site was used for livestock grazing before
    the establishment of the arboretum. CCA covers an area of c. 30 ha, consisting
    of 21 blocks of individual trees planted in 5 m wide rows, c. 4 m apart within
    each row. Four individuals per accession (mother tree) were planted in the same
    row as tube stock, with all seed sourced from the same mother tree. Seedlings
    were watered through the first summer after planting and subsequently received
    only ambient rainfall. Planting dates of each block were staggered as new seeds
    were sourced; hence, CCA contains plants ranging in age from 1 to 30 yr. ^p Species
    selection and sampling ^p At CCA, 212 taxa were selected for sampling, representing
    a large portion of the geographical and climatic distribution of eucalypts (Fig.
    2). This list of taxa included both species and subspecies; we avoided sampling
    multiple subspecies of the same species, with this occurring in only two cases.
    All individuals were reproductively mature at the time of sampling, with a minimum
    age of at least 5 yr, and no systematic trends were observed between plant traits
    and tree age (Fig. S2). The 212 taxa were sampled over two field campaigns in
    the winter and spring of 2022. A total of 101 and 119 taxa were sampled in the
    two campaigns; however, eight taxa were sampled in both, and their data were pooled.
    For each taxon, sun-exposed canopy branches c. 1 m long were removed from three
    individuals of the same accession (i.e. from the same mother tree) using pole
    pruners to measure all traits. For 41 taxa, only two individuals were sampled,
    usually due to the death or insufficient material of one or more replicate individuals
    since planting. All branches were sealed in large plastic bags with a moist paper
    towel before being transported off-site for processing. All eight traits (Table
    1) were measured for each of the 212 taxa sampled across the two campaigns with
    two exceptions, LDMC was measured in the second campaign only (n = 112), and wood
    density was measured in the first campaign (n = 101) and compiled for the remaining
    taxa from a separate study at CCA undertaken in summer 2019 (n = 119, overlap
    of eight taxa), which used the same sampling methods as the 2022 campaigns. Including
    sampling date as a covariate did not change our findings (Table S2). Sample sizes
    for traits are presented in Table 2.
  original_file: NPH-MS-2025-52475_DATA_CCA_only.csv, sourced from Dryad
  notes: none
