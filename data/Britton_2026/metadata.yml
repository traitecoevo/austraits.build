dataset:
  data_is_long_format: no
  custom_R_code: ' data |> dplyr::mutate( location_name = "Currency Creek Arboretum",
    collection_date = dplyr::case_when( data_level == "tree" & !is.na(wd_gcm3) ~ "2022-06/2022-08",
    data_level == "tree" & !is.na(LDMC_mgg1) ~ "2022-09/2022-11", TRUE ~ "2022-06/2022-11"
    ), accession_number = dplyr::if_else( grepl("^[0-9]+$", CCA_unique_ID), paste0("Dean
    Nicolle tree number ", CCA_unique_ID), NA_character_ ), tree_number = dplyr::if_else(
    !is.na(CCA_row), paste0("Currency Creek Arboretum row ", CCA_row, " tree ", Tree_ID),
    NA_character_ ), individual_id = dplyr::case_when( data_level == "taxon" ~ NA_character_,
    !is.na(tree_number) ~ tree_number, TRUE ~ paste(species, CCA_ID, Tree_ID, dplyr::row_number(),
    sep = "_") ) ) '
  collection_date: collection_date
  taxon_name: species
  location_name: location_name
  individual_id: individual_id
  description: A study to test mechanistic hypotheses for trait climate relationships
    for mature eucalypt trees grown in common garden and in situ field conditions,
    quantifying joint and individual effects of mean annual precipitation (MAP) and
    temperature (MAT) on eight functionally important traits
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: Common garden study site ^p Plants were sampled at Currency Creek
    Arboretum (CCA), a private common garden on the Fleurieu Peninsula, South Australia
    (-35.4288, 138.7611). The CCA site experiences a Mediterranean climate of cool
    wet winters and hot dry summers with a MAP and MAT of 467 mm (Table S1) and 15.3°C,
    respectively (W ORLD C LIM 2; Fick & Hijmans, 2017). The soil is sand or sandy
    loam over Middleton Sandstone. The site was used for livestock grazing before
    the establishment of the arboretum. CCA covers an area of c. 30 ha, consisting
    of 21 blocks of individual trees planted in 5 m wide rows, c. 4 m apart within
    each row. Four individuals per accession (mother tree) were planted in the same
    row as tube stock, with all seed sourced from the same mother tree. Seedlings
    were watered through the first summer after planting and subsequently received
    only ambient rainfall. Planting dates of each block were staggered as new seeds
    were sourced; hence, CCA contains plants ranging in age from 1 to 30 yr. ^p Species
    selection and sampling ^p At CCA, 212 taxa were selected for sampling, representing
    a large portion of the geographical and climatic distribution of eucalypts (Fig.
    2). This list of taxa included both species and subspecies; we avoided sampling
    multiple subspecies of the same species, with this occurring in only two cases.
    All individuals were reproductively mature at the time of sampling, with a minimum
    age of at least 5 yr, and no systematic trends were observed between plant traits
    and tree age (Fig. S2). The 212 taxa were sampled over two field campaigns in
    the winter and spring of 2022. A total of 101 and 119 taxa were sampled in the
    two campaigns; however, eight taxa were sampled in both, and their data were pooled.
    For each taxon, sun-exposed canopy branches c. 1 m long were removed from three
    individuals of the same accession (i.e. from the same mother tree) using pole
    pruners to measure all traits. For 41 taxa, only two individuals were sampled,
    usually due to the death or insufficient material of one or more replicate individuals
    since planting. All branches were sealed in large plastic bags with a moist paper
    towel before being transported off-site for processing. All eight traits (Table
    1) were measured for each of the 212 taxa sampled across the two campaigns with
    two exceptions, LDMC was measured in the second campaign only (n = 112), and wood
    density was measured in the first campaign (n = 101) and compiled for the remaining
    taxa from a separate study at CCA undertaken in summer 2019 (n = 119, overlap
    of eight taxa), which used the same sampling methods as the 2022 campaigns. Including
    sampling date as a covariate did not change our findings (Table S2). Sample sizes
    for traits are presented in Table 2.
  original_file: CurrencyCreekArboretum_euc_traits_tree-level_AusTraits_v2.csv, supplied
    by the contributor; NPH-MS-2025-52475_DATA_CCA_only.csv, sourced from Dryad
  notes: data.csv is built by raw/extra_R_code_Britton_2026.R from two files. The
    wood density values the Dryad file compiled from PerezMartinez_2025 are mapped
    in PerezMartinez_2025. 365 of the trees were sampled for PerezMartinez_2025 in
    December 2020, about 18 months before this study, and share identifiers with it;
    the values in the two datasets are separate measurements of the same trees. Arboretum
    row number, seed collector and seed provenance locality were looked up in the
    Currency Creek Arboretum planting records (supplied with PerezMartinez_2025).
    There are some trees that cannot be mapped to a seedlot or tree, because of mismatches
    between the recorded data and Currency Creek Arboretum accession records. These
    include CCA_ID 1315 trees 1-3, recorded as Eucalyptus sp., where the accession
    records list seedlot 1315 as Eucalyptus chlorophylla in row 93, trees 13-15; CCA_ID
    825 tree 1 (Eucalyptus albopurpurea), where the accession records list seedlot
    825 in row 75, trees 2-5; CCA_ID 2524 tree 23 (Eucalyptus grandis), where seedlot
    2524 is planted in rows 165 and 349, each with a tree 23; two Eucalyptus yarraensis
    and three Eucalyptus lockyeri exuta trees, recorded without a CCA_ID or Tree_ID;
    and Corymbia gummifera trees 35-37 and Eucalyptus flindersii trees 6, 7 and 9,
    recorded without a CCA_ID, which match row 58 (seedlot Cgummi_1) and row 29 (seedlot
    Eflinder_1) by taxon and tree number, where the accession records give placeholder
    seedlot IDs. Seedlots 230 and 4635 are each planted in two rows; their trees are
    mapped to the rows holding the seedlot's other sampled trees (row 171) or the
    tree alive in 2016 (row 209). 365 of the trees were previously sampled by PerezMartinez_2025
    in 2020, about 18 months earlier, and share identifiers with it; the values in
    the two datasets are separate measurements of the same trees.
