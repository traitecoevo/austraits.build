questions:
  question1: Do you have tree numbers from CCA? We have several other datasets in
    AusTraits and have recently added in these identifiers, allowing measurements
    made on the same tree to be linked.
  question2: Do you have the data values for each individual we could map in instead?
  question3: Your leaf thickness values seem very low - I've confirmed the input units are um (per the Readme) and the values plotted in the report are a little below 0.1 mm (100 um), which matches the values in the data file, but this is at the far low end of all leaf thickness values. Could these be off by 10x somehow? I'm also confused because in figure 4d/e you have AusTraits other leaf thicknesses much higher than the values shown in the report.
