exclude_observations:
- variable: taxon_name
  find: Leptospermum javanicum, Leptospermum recurvum
  reason: Non-Australian taxa (South East Asia; Mt Kinabalu, Borneo)
questions:
  question1: 'The build reads trait_value_clean (the AusTraits value worked out in the
    extraction scripts), not trait_value with substitutions as in Bean_1992: most
    trait_value entries are source phrases (white or pink, broadly obovate to cuneate)
    rather than single terms. Say if you want them recast as terms plus substitutions.'
  question2: 'L. subtenue: the Latin diagnosis gives leaves 1--1.5 cm long, narrowly
    elliptic to oblanceolate; the English description 3--4 mm long, elliptical. The
    description is transcribed.'
  question3: 'L. incanum height: the text layer reads usually 12 m tall; the page image
    shows 1--2 m, which is what is recorded.'
  question4: 'L. argenteum leaves are about 1/2 as wide as long (5--15 mm); no width is
    recorded.'
  question5: 'Fruit persistence (candidate fruit_persistence: long-persistent, tending to
    persist -> persistent; readily shed, not persisting, tardily deciduous -> deciduous)
    is not mapped to serotiny, because Thompson calls it a myth that all species hold
    their seed until fire and gives no serotiny per species. Say if persistent should be
    scored serotinous.'
  question6: 'Resprouting of L. myrsinoides and the seed viability of L. scoparium (in
    notes) are Thompson citing Burrell (1981, 1965); consider Burrell as a source_id or
    secondary reference.'
  question7: 'Several names are not current APC names: L. parviflorum (APC: L. madidum
    subsp. sativum), L. petersonii subsp. lanceolatum (APC: L. amboinense), L. petersonii
    subsp. petersonii. L. javanicum and L. recurvum are excluded as non-Australian.'
  question8: 'Leaf shapes with no level and left unmapped: very narrowly clavate and almost
    triquetrous (L. confertum); seed shape oblong.'
