source:
  primary:
    key: Thompson_1989
    bibtype: Article
    year: 1989
    author: J. Thompson
    title: A revision of the genus Leptospermum (Myrtaceae)
    journal: Telopea
    volume: 3
    number: 3
    pages: 301--449
    doi: 10.7751/telopea19894902
contributors:
  data_collectors:
  - last_name: Thompson
    given_name: Joy
    ORCID: .na.character
    affiliation: National Herbarium of New South Wales, Royal Botanic Gardens Sydney, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait %in% c(
          "bark_texture", "bud_bank_location", "flower_colour", "flower_diameter",
          "flower_filament_length", "flower_hypanthium_length",
          "flower_nectar_production", "flower_ovules_per_functional_carpel_count",
          "flower_petal_length", "flower_sepal_length", "flower_stamen_length",
          "flowering_time", "flowers_per_inflorescence", "fruit_width", "leaf_length",
          "leaf_shape", "leaf_width", "plant_growth_form", "plant_growth_substrate",
          "plant_height", "resprouting_capacity", "seed_length", "seed_shape",
          "seed_viability", "stem_branching_form", "stem_constitution",
          "stem_growth_habit"
        ),
        is.na(commonness_qualifier) | commonness_qualifier != "extreme_range"
      )
    '
  collection_date: '1989'
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  description: 'To give an accurate account of the genus Leptospermum as a whole once its
    generic limits had been redefined: a new generic description, a key to and formal
    treatment of its 79 species, and a discussion of its putative natural groups, their
    relationships and likely history.'
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'Verbatim from the Introduction and Acknowledgements (the paper has no
    Methods section): It is the younger stems that are to be found in herbarium specimens,
    and characters from these can be useful for distinguishing species. ^p Estimations of
    flowering time given here are based on herbarium material and are not necessarily
    exact. ^p Length was measured from herbarium specimens in order to relate all species
    but this reduces considerably the measurements that would be found in fresh specimens.
    ^p I would like to thank the Directors of the following herbaria for kindly lending or
    allowing me access to their collections: AD, BRI, CANB, CBG, HO, L, MEL, NSW, PERTH.
    Many of my colleagues at NSW and elsewhere have been most helpful, especially with
    regard to collection of material.'
  original_file: 'Myrtaceae Leptospermum revision Thompson_1989 Telopea telopea19894902.pdf
    (Telopea 3(3): 301--449)'
  notes: 'data.csv is raw/trait_data.csv with trait_scoring_method added from
    rank_scored_from (inferred_from_species for subspecies silent on a character, which
    take the species value; inferred_from_species_group for a statement about a group of
    species; inferred for plant_growth_substrate read from the habitat). Growth form,
    habit, branching, height and leaf shape and size are a hand transcription of each
    habit and leaf sentence (raw/scripts/spec.txt); the other characters are read by
    raw/scripts/extra.py from the regular sentences of the descriptions (Flowers,
    Hypanthium, Sepals, Petals, Stamens, Ovary, Fruit, Mature seeds, Main flowering
    period, Distribution), and were reviewed taxon by taxon. Each value keeps its source
    clause (trait_value_raw) and source words (trait_value); trait_value_clean is the
    AusTraits value and is what the build reads. A commonness word splits a character onto
    rows (commonness_qualifier); parenthetical extremes are on extreme_range rows, in
    data.csv but not mapped. Ecology from the Introduction and the discussion of groups is
    scored only where stated without hedging; hedged remarks (fire survival, ant
    dispersal) are in the notes of the nearest character. Candidate traits not yet in
    traits.yml (unmapped, dropped in custom_R_code): bark_description,
    distribution_description, fruit_persistence, geology_terms, habitat_description,
    habitat_terms, leaf_scent, ovary_locule_count, sepal_persistence, soil_terms,
    stamens_per_bundle, stem_branching_angle.'
identifiers: .na
locations: .na
