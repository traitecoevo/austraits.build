  trait_name: leaf_essential_oil_per_dry_mass
  entity_type: species
  value_type: value_type
  basis_of_value: measurement
  replicates: .na
  methods: Leaf essential oil yield as given in the species account's Oil yield paragraph, as a percentage of dry leaf weight
    (w/w) (verbatim in value_description; raw/oil_yield.R). Each yield is recorded under the trait for the basis the book
    states (dry or fresh weight). Where a statement gives yields for several chemotypes, forms or collections, the range over
    them is recorded; "<0.1%" is recorded as a maximum, as is a range whose lower figure is "<" or "trace"; "nil" is recorded
    as 0. The two yields the book describes as unreliable (very small samples) are not recorded.
- var_in: leaf_essential_oil_per_fresh_mass
