dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        across(c(leaf_dry_matter_d13C, leaf_cellulose_d13C, leaf_dry_matter_d18O,
          leaf_cellulose_d18O, leaf_water_d18O), ~ stringr::str_replace(.x, "\\±.+", ""))
      )
  '
  collection_date: 2001-12/2002-02
  taxon_name: species_name
  location_name: site
  description: Study that uses carbon and oxygen stable isotope signatures to explore
    resource acquisition strategies, between different functional types of parasitic
    plants (mistletoes, holoparasites, and root hemiparasites).
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The locations of sampling sites, names of species sampled at
    each site and their authorities, and the functional type of the parasite are given
    in Table 1. Of the root hemiparasite species, three were perennial (E. odoratus,
    E. sparteus, and O. phyllanthi), and two were annual (B. trixago, and P. viscosa).
    William Bay National Park, Ocean Beach, and Lights Beach are coastal heath sites
    in close proximity to the township of Denmark, Western Australia. The Pate Property
    is located on Mount Shadforth near Denmark and is an open woodland dominated by
    a mixture of marri and karri, Corymbia calophylla (Lindl.) K.D. Hill & L.A.S.
    Johnson and Eucalyptus diversicolor F.Muell., respectively. The Tunney site is
    an open woodland dominated by Eucalyptus wandoo Blakely and the Williams site
    is native shrubland bordering farmland. The root hemiparasites and mistletoes
    were chosen such that the individuals sampled were growing in close proximity
    to only a single putative host. Several of the parasitic plant species have been
    studied previously in these same habitats with regard to various aspects of their
    biology and strategies of resource acquisition and use (Pate et al. 1990a, 1990b,
    1990c, 1991; Tennakoon and Pate 1996a; Pate and Bell 2000; Pate 2001). Sampling
    took place between 7 and 13 December 2001, and again between 19 and 25 February
    2002. During the December sampling, a representative sample of 10-20 leaves was
    collected from both parasite and host and oven dried at 80 deg C. In the case
    of the annual root hemiparasites and their hosts, the whole aboveground biomass
    was sampled. The whole biomass was sampled for the Cuscuta and Cassytha holoparasites,
    and whole aboveground biomass for the Orobanche holoparasite. For the mistletoes,
    leaves were collected from the same branch that the mistletoe was parasitizing.
    In the February sampling, leaves of parasites and their hosts were immediately
    placed into gas-tight glass vials and frozen at -20 deg C. Leaf water sampling
    took place between 1100 and 1600 hours local time. Samples remained frozen until
    tissue water was extracted by cryogenic vacuum distillation.
  original_file: transcriptions of tables from manuscript in raw data folder
  notes: none
