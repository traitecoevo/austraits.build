contexts:
- context_property: host plant
  category: entity_context
  var_in: host_name
- context_property: parasitised by
  category: entity_context
  var_in: parasitised_by
traits:
- var_in: leaf_dry_matter_d13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count_leaf_dry_matter_d13C
  methods: The dry matter was retained for carbon and oxygen isotope analyses. Dry
    matter samples were ground to a fine powder and analyzed for carbon isotope ratio
    in an Isochrom mass spectrometer (Micromass, Manchester, UK) following combustion
    in a Carlo Erba elemental analyzer (CE Instruments, Milan, Italy). Oxygen isotope
    analyses of both dry matter and water took place in an Isochrom mass spectrometer
    following pyrolysis (Farquhar et al. 1997). Isotope ratios have been expressed
    in delta notation using PeeDee Belemnite as the standard for carbon and Vienna
    Standard Mean Ocean Water as the standard for oxygen. Analytical precision was
    +/-0.1 permille for delta13C and +/-0.3 permille for delta18O.
- var_in: leaf_cellulose_d13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_cellulose_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count_leaf_cellulose_d13C
  methods: The dry matter was retained for carbon and oxygen isotope analyses. Dry
    matter samples were ground to a fine powder and analyzed for carbon isotope ratio
    in an Isochrom mass spectrometer (Micromass, Manchester, UK) following combustion
    in a Carlo Erba elemental analyzer (CE Instruments, Milan, Italy). Isotope ratios
    have been expressed in delta notation using PeeDee Belemnite as the standard for
    carbon. Analytical precision was +/-0.1 permille for delta13C. We extracted cellulose
    for isotopic analysis from the leaf samples collected during the December sampling,
    except the annual root hemiparasites and their hosts. Cellulose extractions were
    performed as described by Barbour and Farquhar (2000), based on the modified technique
    of Loader et al. (1997).
- var_in: leaf_dry_matter_d18O
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta18O
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count_leaf_dry_matter_d18O
  methods: The dry matter was retained for carbon and oxygen isotope analyses. Oxygen
    isotope analyses of both dry matter and water took place in an Isochrom mass spectrometer
    following pyrolysis (Farquhar et al. 1997). Isotope ratios have been expressed
    in delta notation using Vienna Standard Mean Ocean Water as the standard for oxygen.
    Analytical precision was +/-0.3 permille for delta18O.
- var_in: leaf_cellulose_d18O
  unit_in: '{delta}[ppth]'
  trait_name: leaf_cellulose_delta18O
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count_leaf_cellulose_d18O
  methods: The dry matter was retained for carbon and oxygen isotope analyses. Oxygen
    isotope analyses of both dry matter and water took place in an Isochrom mass spectrometer
    following pyrolysis (Farquhar et al. 1997). Isotope ratios have been expressed
    in delta notation using Vienna Standard Mean Ocean Water as the standard for oxygen.
    Analytical precision was +/-0.3 permille for delta18O. We extracted cellulose
    for isotopic analysis from the leaf samples collected during the December sampling,
    except the annual root hemiparasites and their hosts. Cellulose extractions were
    performed as described by Barbour and Farquhar (2000), based on the modified technique
    of Loader et al. (1997). The term epsilon_cp, describing the difference in delta18O
    between total dry matter and cellulose, was calculated as epsilon_cp = delta18O_dry_matter
    - delta18O_cellulose.
- var_in: leaf_water_d18O
  unit_in: '{delta}[ppth]'
  trait_name: leaf_water_delta18O
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count_leaf_water_d18O
  methods: Leaf water sampling took place between 1100 and 1600 hours local time.
    Samples remained frozen until tissue water was extracted by cryogenic vacuum distillation.
    Oxygen isotope analyses of both dry matter and water took place in an Isochrom
    mass spectrometer following pyrolysis (Farquhar et al. 1997). Isotope ratios have
    been expressed in delta notation using Vienna Standard Mean Ocean Water as the
    standard for oxygen. Analytical precision was +/-0.3 permille for delta18O.
- var_in: parasite_type
  unit_in: .na
  trait_name: parasitic
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Parasite functional type (mistletoe, holoparasite, or root hemiparasite),
    as classified in the source publication's Table 1.
