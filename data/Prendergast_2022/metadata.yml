  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
    filter(N >0) |>
      mutate(location_name = "Zanthorrea Nursery")
  '
  collection_date: Date
  taxon_name: Plant species
  location_name: location_name
  description: Systematic surveys were conducted to identify what plants are most
    attractive to pollinating insects at a garden nursery (Zanthorrea Nursery) located
    in Western Australia.
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: Zanthorrea Nursery is one of the leading and largest of native
    plant nurseries in Western Australia providing native and exotic flora to the
    public. It is an accredited grower and is the first nursery to be certified by
    Sustainable Gardening Australia (Zanthorrea Nursery 2021). It is located in Maida
    Vale, an outer suburb of Perth, Western Australia, Australia (-31.944°S, 116.033°E).
    ^p Surveys were undertaken by the author and, therefore, results are both free
    from inter-observer error and reliable, given the author's knowledge of native
    bee taxonomy and the bee fauna in this biogeographic region (Prendergast 2020b).
    Plants surveyed were those in the area where garden plants were available to the
    public to view and purchase. Surveys were undertaken on warm (>25°C), sunny days
    with minimal cloud cover and low wind speeds during peak bee activity periods
    (1100 to 1400 h) over four months in the austral spring and summer (October, November
    2020, and January, February 2021). During each survey, each plant species in bloom
    were observed for 200 sec from a distance of approximately 1 m, and the number
    and taxonomic identity of insect visitors were observed. Since each individual
    plant was arranged at the nursery in clumps together based on plant species, as
    is typical for garden centers and nurseries, all plant individuals for each species
    could be observed simultaneously. An interaction between an insect with a flowering
    plant was considered a visit when an insect landed on a flower to collect nectar
    or pollen. Number of visits were based on number of insect visitors, e.g., an
    individual bee that visited ten flowers during a 200-sec observation period was
    counted as one insect visit, not ten visits. Due to the impossibility of identifying
    insects to species-level in most instances from observation alone, visitors were
    categorized as honeybees (A. mellifera), native bees, wasps, syrphid flies, and
    other flies. Native bees were also recorded to lower taxonomic categories that
    could be determined by expert visual observation in the field (see Prendergast
    & Ollerton 2021). More detailed information on the insect visitors is provided
    in the online dataset “Flowering plant species at Zanthorrea Nursery and their
    visitation by insect taxa” (Prendergast 2022a). Although sweep-netting would allow
    for species-level identification (Prendergast & Hogendoorn 2021), this was impractical
    in a public nursery as it could have damaged the flowers on sale and perturbed
    customers. ^p For each plant species, their flower petal color was noted by the
    author. Whilst this provides a level of subjectivity and precludes UV-coloration
    from being assessed, funding and equipment for more sophisticated quantification
    of color were unavailable. For each plant species, their level of floral resources
    was quantified as number of flowering heads across all plant individuals of this
    species present in the nursery. As flowers are the resource insects are attracted
    to, and plant individuals were aggregated as is typical in a nursery setting,
    this was the unit at which analyses were conducted. Whilst flowers can have different
    floral display sizes, quantities and qualities of nectar and pollen, time and
    equipment to quantify these aspects of floral resources were unavailable and so
    number of flowering heads was chosen for the purposes of this analysis. The origin
    of the plant species, in terms of whether it was native to Australia or exotic
    in origin [checked against the Australian Plant Name Index database (ANGB 2015)],
    was also recorded, and whether it was a wild-type or horticulturally modified
    variety.
  original_file: in raw data folder
  notes: none
