    author: Kit S. Prendergast
    journal: Journal of Agricultural and Urban Entomology
    title: The Influence of Plant Species, Origin and Color of Garden Nursery Flowers
      on the Number and Composition of Pollinating Insect Visitors
    volume: '38'
    number: '1'
    doi: 10.3954/jaue22-07
    issn: 1523-5475
