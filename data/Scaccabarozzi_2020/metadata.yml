dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        !(trait == "fruit_set_proportion" & dplyr::coalesce(pollination_treatment, "") != "")
      ) |>
      dplyr::mutate(
        trait_value = dplyr::if_else(
          trait %in% c("flower_visitor", "pollination_vector_possible", "pollination_vector_known"),
          trait_value_clean,
          trait_value
        )
      )
    '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  source_id: source_id
  description: To test whether the rewardless orchid Diuris magnifica mimics co-flowering
    Fabaceae, and whether the abundance of model and non-model Fabaceae, the density of
    conspecifics and the size of habitat remnants influence its pollination success.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: We surveyed populations of D. magnifica for pollination success
    during 2015 and 2017, and we carried out pollinator observations in 2015 and 2016.
    The orchid populations were distributed across ten bushland remnants within the
    metropolitan area of the city of Perth (Supporting Information, Table S1A, B).
    Diuris magnifica was the only Diuris sp. observed in flower at the study sites
    during the study period. All the study species were vouchered and identified at the
    Herbarium of Western Australia in Perth (Supporting Information, Table S2). ^p To
    identify the pollinators of D. magnifica and quantify their behaviour, observation
    periods of insects visiting flowers were performed at two sites in remnant A,
    Koondoola bushland (S 31°50’06.8’’ E 115°51’83.4’’) and at one site in remnant E,
    Kings Park (S 31°57’25.9’’ E 115°49’89.9’’) between the 26 August and 28 September
    2015 and 24 August and 13 September 2016. These sites were selected as they are two
    of the largest woodland remnants in the study region and have relatively intact
    vegetation communities, and D. magnifica was common. We conducted 248 15-min
    observation periods (a total of 3720 min of observation), recording insect behaviour
    with an EOS M video camera (Canon, Tokyo, Japan) for subsequent examination in slow
    motion. Observations were conducted between 9.00 a.m. and 5.30 p.m., with air
    temperatures ranging between 14 °C and 30 °C, as measured with a Smartsensor AR827
    set at 20 cm above the ground. Observations were made by using arrays of picked
    orchid flowers (two inflorescences per vial, each inflorescence with four to six
    flowers, three vials per trial, 10–20 cm apart; Scaccabarozzi et al., 2018; 2020b)
    placed 1–2 m from flowering individuals of Daviesia divaricata, B. eriocarpa, J.
    sternbergiana and I. cuneifolia. For each insect visiting a flower of Diuris and/or
    Fabaceae, the behaviour was recorded in eight categories following Scaccabarozzi et
    al., 2018 (Supporting Information, Table S3). Due to the rapid approaches of
    pollinators, behaviour was only recorded for the first flower visited, as tracking
    accurately the subsequent visit was often impossible. Insects bearing the visible
    white pollinaria of D. magnifica (Fig. 3) were collected for identification while
    visiting D. magnifica or foraging on surrounding Fabaceae. All collected specimens
    were submitted to the Western Australian Museum as voucher specimens (Supporting
    Information, Table S4). ^p Observations of Trichocolletes visiting Fabaceae were
    conducted in Koondola bushland and Kings Park between 26 August and 28 September
    2015 and between 24 August and 14 October 2016 from 9.00 a.m. to 5.30 p.m. We
    estimated the frequency of Trichocolletes (number of visits per trial) on the
    co-flowering Fabaceae to test whether D. magnifica share pollinators with
    co-occurring Fabaceae and make comparisons of the bee behaviour when visiting D.
    magnifica and Fabaceae. These observations were made during 20-min observation
    periods (between 16 and 19 trials per species of Fabaceae); pollinator visits were
    recorded with the same video camera as described above (see Scaccabarozzi et al.,
    2018 for details). [...] ^p To test if bees were likely to be able to distinguish
    the colour of D. magnifica flowers from the co-flowering Fabaceae (B. eriocarpa,
    Daviesia divaricata, H. comptoniana, I. cuneifolia and J. sternbergiana), we
    measured and analysed floral spectral reflectance by using the colour hexagon model,
    based on the sensitivities of photoreceptors of the bee Apis mellifera (Chittka,
    1992; Chittka & Kevan, 2005). Additionally, spectral reflectance was also measured
    for other common rewarding species occurring at all sites, i.e. the yellow-flowered
    Hibbertia hypericoides (DC.) Benth. (Dilleniaceae), Acacia pulchella R.Br.
    (Fabaceae), Conostylis aculeata R.Br. (Haemodoraceae) and the pink-flowered
    Hypocalymma robustum Schauer (Myrtaceae). Two flowers per plant from six randomly
    chosen individuals of each species were selected for measuring spectral reflectance
    using a spectrometer (Ocean Optics Jaz, DH-2000 UV-VIS-NIR Light source) with an
    integration time of 50 ms. In D. magnifica, spectral reflectance measurements were
    undertaken from the lateral outer petal (LOP), the centre of the dorsal sepal (DS),
    the labellum (L), and the internal (LLI) and external (LLE) parts of the lateral
    labellum lobe. For Fabaceae, the spectral reflectance measurements were taken from
    the standard (SP) and wing (W) petals (Fig. 3A, B). For the other co-occurring
    species measurements were taken from the corolla or stamens (for A. pulchella only).
    [...] ^p In 2015 and 2017, at the end of the flowering period, the proportion of D.
    magnifica flowers with pollinarium removal and the proportion of flowers forming
    fruits was quantified at 15 sites (populations) in a single 30 × 30 m quadrat. These
    15 sites were split between five large remnants. We focused on these large remnants
    to minimize the effect of habitat fragmentation when attempting to understand the
    role of food plants on pollination success of D. magnifica. At the flowering peak of
    D. magnifica we recorded, (1) the estimated number of flowers for each species of
    Fabaceae; and (2) the number of D. magnifica plants and flowers. For Fabaceae,
    variable (1) was estimated by averaging the number of flowers per stem for ten stems
    and multiplying it by the number of stems (Scaccabarozzi et al., 2018). [...] ^p To
    test whether the habitat remnant size and the presence of Trichocolletes affected
    the pollination success of D. magnifica, in 2017 we quantified plant-pollination
    success (pollinarium removal, fruit set) for an additional five sites (in addition
    to the 15 previously studied), located in five small habitat remnants (Supporting
    Information, Table S1B). We carried out two observation transects (100 m in length)
    for all 20 sites, from 5 to 15 September 2017, by recording the occurrence of
    Trichocolletes along transects centred on the same quadrats used to quantify
    pollination success of D. magnifica. Each transect took 40 min to complete, with an
    average of approximately 3 min of observations per flowering plant. Transects were
    repeated 1 week after the initial survey, following the same route. For the
    analyses, Trichocolletes occurrence was expressed as presence/absence, to reflect
    that the survey may not have provided accurate quantification of their abundance.
    Sizes of habitat remnants were taken from those reported in Bush Forever (Government
    of Western Australia, 2000). [...] ^p Nectar production was tested in D. magnifica,
    and quantified in the co-flowering pea plants (B. eriocarpa, D. divaricata, H.
    comptoniana, I. cuneifolia, J. sternbergiana) in August-September 2016. One
    inflorescence per individual was bagged for 10 randomly selected individuals of each
    species at three sites (Shenton Park, Trigg bushland and Koondoola bushland).
    Inflorescences were bagged in the afternoon, with nectar collected the following day
    during the warmest hours (from 11.00 to 14.00) to ensure maximum nectar production
    (Corbet et al., 1995). Nectar was collected from two flowers on each inflorescence
    using a 2 µl microcapillary tube (Drummond Microcaps, Broomall; Pa., USA), with
    nectar volume calculated by measuring capillary length of the column of liquid
    (Corbet, 1995; Corbet, 2003) using a digital calliper. ^p To test for autogamy, in
    August 2016, inflorescences with newly-opened flowers and no pollinia deposited on
    stigma were covered with a fine, insect proof nylon bag until floral senescence (ca.
    four weeks). To test for self-compatibility, one flower on each inflorescence was
    manually pollinated with pollinia from a different flower on the same inflorescence
    before the pollinated flower was covered with a fine, insect proof nylon bag until
    senescence or fruit formation (ca. four weeks). Six individuals were randomly
    selected at each of the three largest populations (Shenton Park, Trigg bushland and
    Koondoola bushland) for each test, with one inflorescence selected per individual
    for a total of eighteen inflorescences tested.
  original_file: raw/trait_data.csv, compiled from the paper
    and its Supporting Information (Appendix S1, Tables S1, S3, S4 and S5).
  notes: The proportion of flowers with pollinaria removed, and the counts of flowers with
    pollinaria removed and flowers pollinated, describe pollinator activity rather than
    a plant trait; they are kept in data.csv for each quadrat population but not mapped.
    Flower colour hue and chroma in the honeybee colour hexagon are calculated from the
    mean colour loci in Table S5. Scaccabarozzi et al. (2024) Datafile S1 reuses the
    2017 quadrat data, adding the numbers of Trichocolletes, honeybees and
    Neophyllotocus beetles counted on transects in each bushland reserve and three
    populations not in Table S1B (Scaccabarozzi 2024 populations 9, 14 and 15). The
    colour loci of Acacia pulchella and Hibbertia hypericoides are the same measurements
    as in Scaccabarozzi et al. (2018) and are in that dataset. Fruit set of bagged and
    hand self-pollinated flowers is kept in data.csv but not mapped, and is used to
    score breeding_system. Pollinator counts and occurrence on transects, Trichocolletes
    visits per trial, and plant and pea-flower counts per quadrat are kept in data.csv
    but not mapped.
