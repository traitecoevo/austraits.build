contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: entity_context
- context_property: floral visitor individuals recorded (count)
  category: entity_context
  var_in: visitor_count
traits:
- var_in: fruit_set_proportion
  unit_in: '{count}/{count}'
  trait_name: fruit_set_proportion
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: In 2015 and 2017, at the end of the flowering period, the proportion of D.
    magnifica flowers with pollinarium removal and the proportion of flowers forming
    fruits was quantified at 15 sites (populations) in a single 30 × 30 m quadrat. ^p
    Each record is the proportion of flowers forming fruits in a quadrat population.
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To test for autogamy, in August 2016, inflorescences with newly-opened flowers
    and no pollinia deposited on stigma were covered with a fine, insect proof nylon bag
    until floral senescence (ca. four weeks). To test for self-compatibility, one flower
    on each inflorescence was manually pollinated with pollinia from a different flower
    on the same inflorescence before the pollinated flower was covered with a fine,
    insect proof nylon bag until senescence or fruit formation (ca. four weeks). Six
    individuals were randomly selected at each of the three largest populations (Shenton
    Park, Trigg bushland and Koondoola bushland) for each test, with one inflorescence
    selected per individual for a total of eighteen inflorescences tested. ^p Diuris
    magnifica was shown to require a vector for pollination, and to be self-compatible.
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Nectar production was tested in D. magnifica, and quantified in the
    co-flowering pea plants (B. eriocarpa, D. divaricata, H. comptoniana, I. cuneifolia,
    J. sternbergiana) in August-September 2016. One inflorescence per individual was
    bagged for 10 randomly selected individuals of each species at three sites (Shenton
    Park, Trigg bushland and Koondoola bushland). Inflorescences were bagged in the
    afternoon, with nectar collected the following day during the warmest hours (from
    11.00 to 14.00) to ensure maximum nectar production (Corbet et al., 1995). Nectar
    was collected from two flowers on each inflorescence using a 2 µl microcapillary
    tube (Drummond Microcaps, Broomall; Pa., USA), with nectar volume calculated by
    measuring capillary length of the column of liquid (Corbet, 1995; Corbet, 2003)
    using a digital calliper.
- var_in: flower_nectar_volume
  unit_in: uL
  trait_name: flower_nectar_volume
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 10
  methods: Nectar production was tested in D. magnifica, and quantified in the
    co-flowering pea plants (B. eriocarpa, D. divaricata, H. comptoniana, I. cuneifolia,
    J. sternbergiana) in August-September 2016. One inflorescence per individual was
    bagged for 10 randomly selected individuals of each species at three sites (Shenton
    Park, Trigg bushland and Koondoola bushland). Inflorescences were bagged in the
    afternoon, with nectar collected the following day during the warmest hours (from
    11.00 to 14.00) to ensure maximum nectar production (Corbet et al., 1995). Nectar
    was collected from two flowers on each inflorescence using a 2 µl microcapillary
    tube (Drummond Microcaps, Broomall; Pa., USA), with nectar volume calculated by
    measuring capillary length of the column of liquid (Corbet, 1995; Corbet, 2003)
    using a digital calliper.
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Here, we tested for mimicry of co-occurring Fabaceae by the rewardless Diuris
    magnifica (Orchidaceae). ^p Diuris magnifica has no visible nectar while the
    co-occurring pea plants (Faboideae) produce a nectar reward.
- var_in: flower_scent_production
  unit_in: .na
  trait_name: flower_scent_production
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Flowering occurs from late winter to early spring, with between three and nine
    yellow-purple flowers per inflorescence (Brown et al., 2013), which are odourless to
    the human nose.
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Flowering occurs from late winter to early spring, with between three and nine
    yellow-purple flowers per inflorescence (Brown et al., 2013), which are odourless to
    the human nose. ^p Except for H. comptoniana, which is violet, all the other species
    of Fabaceae in this study have broadly similar coloration to D. magnifica to the
    human eye (yellow-orange-purple; Fig. 2). These Fabaceae produce floral nectar
    (Supporting Information, Appendix S1), whereas D. magnifica does not (Newman et al.,
    2013).
- var_in: flowers_per_inflorescence
  unit_in: '{count}/{count}'
  trait_name: flowers_per_inflorescence
  entity_type: species
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Flowering occurs from late winter to early spring, with between three and nine
    yellow-purple flowers per inflorescence (Brown et al., 2013), which are odourless to
    the human nose.
- var_in: flower_colour_bee_hue
  unit_in: deg
  trait_name: flower_colour_bee_hue
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: To test if bees were likely to be able to distinguish the colour of D.
    magnifica flowers from the co-flowering Fabaceae (B. eriocarpa, Daviesia divaricata,
    H. comptoniana, I. cuneifolia and J. sternbergiana), we measured and analysed floral
    spectral reflectance by using the colour hexagon model, based on the sensitivities
    of photoreceptors of the bee Apis mellifera (Chittka, 1992; Chittka & Kevan, 2005).
    Additionally, spectral reflectance was also measured for other common rewarding
    species occurring at all sites, i.e. the yellow-flowered Hibbertia hypericoides
    (DC.) Benth. (Dilleniaceae), Acacia pulchella R.Br. (Fabaceae), Conostylis aculeata
    R.Br. (Haemodoraceae) and the pink-flowered Hypocalymma robustum Schauer
    (Myrtaceae). Two flowers per plant from six randomly chosen individuals of each
    species were selected for measuring spectral reflectance using a spectrometer (Ocean
    Optics Jaz, DH-2000 UV-VIS-NIR Light source) with an integration time of 50 ms. In
    D. magnifica, spectral reflectance measurements were undertaken from the lateral
    outer petal (LOP), the centre of the dorsal sepal (DS), the labellum (L), and the
    internal (LLI) and external (LLE) parts of the lateral labellum lobe. For Fabaceae,
    the spectral reflectance measurements were taken from the standard (SP) and wing (W)
    petals (Fig. 3A, B). For the other co-occurring species measurements were taken from
    the corolla or stamens (for A. pulchella only). ^p Each record is the hue angle of
    the mean colour locus across floral parts, measured clockwise from the top of the
    colour hexagon.
- var_in: flower_colour_bee_chroma
  unit_in: '{dimensionless}'
  trait_name: flower_colour_bee_chroma
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: To test if bees were likely to be able to distinguish the colour of D.
    magnifica flowers from the co-flowering Fabaceae (B. eriocarpa, Daviesia divaricata,
    H. comptoniana, I. cuneifolia and J. sternbergiana), we measured and analysed floral
    spectral reflectance by using the colour hexagon model, based on the sensitivities
    of photoreceptors of the bee Apis mellifera (Chittka, 1992; Chittka & Kevan, 2005).
    Additionally, spectral reflectance was also measured for other common rewarding
    species occurring at all sites, i.e. the yellow-flowered Hibbertia hypericoides
    (DC.) Benth. (Dilleniaceae), Acacia pulchella R.Br. (Fabaceae), Conostylis aculeata
    R.Br. (Haemodoraceae) and the pink-flowered Hypocalymma robustum Schauer
    (Myrtaceae). Two flowers per plant from six randomly chosen individuals of each
    species were selected for measuring spectral reflectance using a spectrometer (Ocean
    Optics Jaz, DH-2000 UV-VIS-NIR Light source) with an integration time of 50 ms. In
    D. magnifica, spectral reflectance measurements were undertaken from the lateral
    outer petal (LOP), the centre of the dorsal sepal (DS), the labellum (L), and the
    internal (LLI) and external (LLE) parts of the lateral labellum lobe. For Fabaceae,
    the spectral reflectance measurements were taken from the standard (SP) and wing (W)
    petals (Fig. 3A, B). For the other co-occurring species measurements were taken from
    the corolla or stamens (for A. pulchella only). ^p Each record is the distance of
    the mean colour locus across floral parts from the centre of the colour hexagon.
- var_in: flower_colour_bee_type
  unit_in: .na
  trait_name: flower_colour_bee_type
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To test if bees were likely to be able to distinguish the colour of D.
    magnifica flowers from the co-flowering Fabaceae (B. eriocarpa, Daviesia divaricata,
    H. comptoniana, I. cuneifolia and J. sternbergiana), we measured and analysed floral
    spectral reflectance by using the colour hexagon model, based on the sensitivities
    of photoreceptors of the bee Apis mellifera (Chittka, 1992; Chittka & Kevan, 2005).
    Additionally, spectral reflectance was also measured for other common rewarding
    species occurring at all sites, i.e. the yellow-flowered Hibbertia hypericoides
    (DC.) Benth. (Dilleniaceae), Acacia pulchella R.Br. (Fabaceae), Conostylis aculeata
    R.Br. (Haemodoraceae) and the pink-flowered Hypocalymma robustum Schauer
    (Myrtaceae). Two flowers per plant from six randomly chosen individuals of each
    species were selected for measuring spectral reflectance using a spectrometer (Ocean
    Optics Jaz, DH-2000 UV-VIS-NIR Light source) with an integration time of 50 ms. In
    D. magnifica, spectral reflectance measurements were undertaken from the lateral
    outer petal (LOP), the centre of the dorsal sepal (DS), the labellum (L), and the
    internal (LLI) and external (LLE) parts of the lateral labellum lobe. For Fabaceae,
    the spectral reflectance measurements were taken from the standard (SP) and wing (W)
    petals (Fig. 3A, B). For the other co-occurring species measurements were taken from
    the corolla or stamens (for A. pulchella only). ^p Each record is the region of the
    colour hexagon in which the mean colour locus of the species lies.
