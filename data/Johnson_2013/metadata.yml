contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: scientific_name
traits:
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: entity_type_derived
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: A flower visitor was considered a pollinator only when it was described
    in the source (published literature or original field observation) as "foraging
    at flowers, brushing anthers and stigma" and/or "carrying epacrid pollen"; pollination
    itself was not experimentally confirmed (e.g. via pollinator exclusion or seed-set
    recorded from a specific visit). Records came from the published literature (collated
    via Google Scholar searches for "Pollinat* Epacridaceae"/"Pollinat* Styphelioideae"
    and by searching journals that routinely publish on pollination ecology) and from
    original field observations by the author (source = "KAJ", followed by month/year).
  measurement_remarks: source
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: entity_type_derived
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Ant visitation records for Acrotriche species, from Schneemilch, Williams
    & Kokkinn (2011). The source paper excluded Acrotriche from its own pollination-syndrome
    analysis "due to uncertainty regarding their pollinators", i.e. ant visits to
    Acrotriche flowers are documented here as floral visitation without the stronger
    evidence of reproductive-structure contact used to include a record under pollination_vector_possible.
  measurement_remarks: source
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Information on four floral traits for all 87 epacrid species for which
    pollinators were known was obtained from the literature (Allen, 1961; Curtis,
    1963; Laing and Blackwell, 1964; Van Royen, 1982; Jessop and Toelken, 1986; Mark
    and Adams, 1986; Corrick et al., 1996; Walsh and Entwisle, 1996; Harden, 1992;
    Packowska and Chapman, 2000; Wheeler et al., 2002; FloraBase). Only attributes
    for which data were accessible for all 87 plant species were included. Traits
    were scored as 1 present and 0 if not. Display colour was categorized as blue/purple,
    red, pink, yellow, green and white; a species could be scored positive for more
    than one colour.
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Presence or absence of nectar was scored (1 present, 0 absent) from the
    same literature sources used for the other floral trait profiles (see flower_colour
    methods).
- var_in: flower_corolla_tube_opening
  unit_in: .na
  trait_name: flower_corolla_tube_opening
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Corolla mouth was recorded as "constricted" (generally <1 mm) where the
    corolla was nearly closed at the top such as in Astroloma species, "narrow" (generally
    1 to <2.5 mm) where it tapered in near the top, and "wide" (generally >2.5 mm)
    where it tended to be at least as wide as the rest of the floral tube, from the
    same literature sources used for the other floral trait profiles (see flower_colour
    methods). Not scored for the brush-flowered Richea species, whose corollas abscise
    to present a brush-like cluster of stamens rather than a tube with a mouth.
substitutions: .na
