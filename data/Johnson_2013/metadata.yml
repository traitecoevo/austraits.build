dataset:
  data_is_long_format: yes
  custom_R_code: '
    data %>%
      filter(is.na(source_id) | source_id != "Houston_2002") %>%
      mutate(
        common_name_fixed = ifelse(common_name %in% c("Unknown", "Na"), potential_pollinator, common_name),
        common_name_fixed = dplyr::recode(common_name_fixed,
          "Bees" = "bee", "Flies" = "fly", "Blowfly" = "carrion_fly", "Hover Fly" = "hoverfly",
          "Tipulid" = "fly", "Bug" = "hemiptera", "Grasshopper" = "orthoptera", "Snow skink" = "skink",
          "Antechinus" = "marsupial", "Black Rat" = "rodent", "Common brushtail possum" = "marsupial",
          "Adelaide rosella" = "parrot", "Purple crowned lorikeet" = "parrot", "Striated thornbill" = "bird",
          "New Holland honeyeater" = "honeyeater", "New Holland Honeyeater" = "honeyeater", "New-Holland Honeyeater" = "honeyeater",
          "Eastern spinebill" = "honeyeater", "Eastern Spinebill" = "honeyeater",
          "Brown headed honeyeater" = "honeyeater", "Brown-Headed Honeyeater" = "honeyeater",
          "Crescent honeyeater" = "honeyeater", "Crescent Honeyeater" = "honeyeater",
          "Western spinebill" = "honeyeater",
          "Tawny crowned honeyeater" = "honeyeater", "Tawny-Crowned Honeyeater" = "honeyeater",
          "Red wattlebird" = "honeyeater", "Yellow-throated honeyeater" = "honeyeater",
          "White naped honeyeater" = "honeyeater", "White plumed honeyeater" = "honeyeater", "White-plumed honeyeater" = "honeyeater",
          "Yellow faced honeyeater" = "honeyeater", "White-Cheeked Honeyeater" = "honeyeater", "White cheeked honeyeater" = "honeyeater",
          "Yellow wattlebird" = "honeyeater", "Black chinned honeyeater" = "honeyeater", "Little wattlebird" = "honeyeater",
          "Purple gaped Honeyeater" = "honeyeater", "Yellow throated minor" = "honeyeater", "Black-Headed Honeyeater" = "honeyeater",
          "Strong billed honeyeater" = "honeyeater"
        ),
        has_s3_trait = !is.na(s3_trait_name) & s3_trait_name != "",
        trait_name_derived = ifelse(has_s3_trait, s3_trait_name, ifelse(common_name_fixed == "Ant", "flower_visitor", "pollination_vector_possible")),
        pollinator_vocab_match = ifelse(has_s3_trait, s3_trait_value, common_name_fixed),
        is_original = !is.na(original_contribution) & original_contribution,
        location_name_derived = dplyr::case_when(
          !is_original ~ NA_character_,
          plant_species %in% c("Dracophyllum minimum", "Epacris serpyllifolia", "Trochocarpa thymifolia", "Monotoca empetrifolia", "Richea acerosa", "Richea milliganii", "Richea pandanifolia", "Richea scoparia", "Richea sprengelioides") ~ "Mt. Field National Park",
          plant_species == "Richea procera" ~ "Wellington Range Park",
          plant_species == "Richea dracophylla" ~ "Snug Tiers",
          plant_species == "Trochocarpa gunnii" ~ "Tasmanian Wilderness World Heritage Area",
          plant_species == "Lissanthe strigosa" ~ "Echo Sugarloaf State Reserve",
          plant_species == "Leucopogon ericoides" ~ "Randalls Bay Conservation Area",
          plant_species == "Epacris lanuginosa" ~ "Egg and Bacon Bay Road",
          plant_species %in% c("Leucopogon virgatus", "Leucopogon collinus") ~ "Ridgeway Park",
          plant_species %in% c("Epacris marginata", "Leucopogon parviflorus") ~ "Remarkable Cave State Reserve",
          plant_species == "Leptecophylla juniperina subsp. juniperina" ~ "Cape Raoul State Reserve",
          plant_species == "Epacris impressa" ~ "Huon Road",
          TRUE ~ NA_character_
        ),
        entity_type_derived = ifelse(!is.na(location_name_derived), "population", "species"),
        year_text = ifelse(is.na(source_id) | source_id == "Johnson_2013", source, source_id),
        year_matches = regmatches(year_text, gregexpr("(19|20)[0-9]{2}", year_text)),
        row_year_min = as.numeric(sapply(year_matches, function(x) if (length(x) == 0) 2013 else min(as.numeric(x)))),
        row_year_max = as.numeric(sapply(year_matches, function(x) if (length(x) == 0) 2013 else max(as.numeric(x))))
      ) %>%
      dplyr::group_by(plant_species, trait_name_derived, location_name_derived, entity_type_derived, source_id) %>%
      dplyr::summarise(
        pollinator_vocab_match = paste(unique(pollinator_vocab_match), collapse = " "),
        scientific_name = paste(unique(scientific_name), collapse = " "),
        source = paste(unique(source), collapse = " "),
        code = dplyr::first(code),
        tribe = dplyr::first(tribe),
        common_name = dplyr::first(common_name),
        potential_pollinator = dplyr::first(potential_pollinator),
        rf_classification = dplyr::first(rf_classification),
        original_contribution = dplyr::first(original_contribution),
        collection_year_min = min(row_year_min),
        collection_year_max = max(row_year_max),
        collection_date_derived = ifelse(collection_year_min == collection_year_max,
          as.character(collection_year_min),
          paste0(collection_year_min, "/", collection_year_max)),
        .groups = "drop"
      )
    '
  collection_date: collection_date_derived
  taxon_name: plant_species
  trait_name: trait_name_derived
  value: pollinator_vocab_match
  location_name: location_name_derived
  source_id: source_id
  individual_id: .na
  description: To compile published and original field records of floral visitors
    to Australian epacrid (Ericaceae, Styphelioideae) species, together with floral
    trait data, in order to test whether epacrids exhibit statistically identifiable
    pollination syndromes.
  basis_of_record: field literature
  life_stage: adult
  sampling_strategy: Information on floral visitors to 87 epacrid species came from
    the published literature and field observations (Supplementary Data Tables S1,
    S2). Acrotriche species were excluded from analyses due to uncertainty regarding
    their pollinators (Johnson et al., 2011; Schneemilch et al., 2011). To standardize
    data from different sources, the term "potential pollinator" (hereafter synonymous
    with "pollinator") was used to describe an animal observed to interact with epacrid
    flowers. Thus, a flower visitor was considered a pollinator only when it was described
    in the literature as "foraging at flowers, brushing anthers and stigma" and/or
    "carrying epacrid pollen". Where generalized pollination systems are reported,
    there is often no or limited information on the effectiveness of each pollinator
    type. Thus, for the purpose of the current work, all pollinators have been treated
    as equally effective. To analyse and interpret plant and animal relationships,
    species-level identification was required for plants. For animals, the requirement
    was data making it possible to categorize them into functional groups based on
    Fenster et al. (2004) - bee (Hymenoptera), fly (Diptera), beetle (Coleoptera),
    butterfly (Lepidoptera), moth (Lepidoptera), wasp (Hymenoptera) and bird (Aves)
    (Supplementary Data Table S2). Pollinator information was collated using Google
    Scholar (most recently 28 March 2012) searches for the key words "Pollinat* Epacridaceae"
    or "Pollinat* Styphelioideae". The words "Pollination", "Epacridaceae" and "Styphelioideae"
    were also used to search for journals that routinely publish on pollination ecology.
    Each study had its own agenda; completeness of pollinator profiles may be variable
    and may not cover all pollination scenarios in epacrids (e.g. there are few nocturnal
    pollination studies). Thus, the data set should be considered non-random. Only
    native pollinators were included in the analyses. The two introduced species,
    honeybee Apis mellifera and bumblebee Bombus terrestris, were excluded. Lizards
    were excluded due to uncertainty about their role as either pollinators or nectar-robbers
    of Richea scoparia (Olsson et al., 2000; Johnson, 2012).
  original_file: raw/table_s2.csv, manually transcribed from the source paper's Supplementary
    Data Table S2 (see raw/Johnson_2013.pdf and raw/Johnson_2013_tables.pdf)
  notes: Ant-visitation records (Acrotriche spp., sourced from Schneemilch et al.
    2011) are mapped to flower_visitor rather than pollination_vector_possible, matching
    the source paper's statement that these ant visits are not documented as involving
    contact with the flower's reproductive structures. Additional data not currently
    mappable to AusTraits traits, floral types/shapes don't match AusTraits vocabulary.
    Table S1 (site summary for the 21 species with original field observations) is
    transcribed to raw/table_s1.csv and is now incorporated - each species'' site
    is linked as location_name to that species'' original-observation records in Table
    S2 (original_contribution == TRUE, i.e. source starting "KAJ"); those records''
    entity_type becomes population, while literature-based values have entity_type
    species. Epacris impressa is listed against both Randalls Bay Conservation Area
    and Huon Road in Table S1, and is arbitrarily linked to Huon Road; Richea scoparia
    is listed twice at Mt. Field National Park and linked to its representative coordinates.
  measurement_remarks: source
identifiers: .na
