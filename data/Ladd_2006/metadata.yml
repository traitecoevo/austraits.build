dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: 2006
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  description: To evaluate whether particular Richea species have evolved wind pollination,
    by comparing their floral, pollen and stigma morphology and pollen:ovule ratios
    against two Erica species representing contrasting (animal vs wind) pollination
    syndromes.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: Flowering material was obtained in the field or from herbaria
    (MEL) and was examined either fresh, pickled or was rehydrated in detergent solution.
    Ovules were counted in ovaries from at least six flowers. Pollen content of anthers
    was determined by digesting the anthers in concentrated sulphuric acid for about
    24 hours, adding an aliquot of Lycopodium spore suspension, centrifuging the fluid
    and rinsing in several changes of water. The concentrated product was suspended
    in a small drop of glycerol and pollen and spores counted using a transmission
    light microscope. Mean pollen per flower was calculated from a mean of six counts.
    Pollen in anthers = (Pollen counted x Spores in aliquot) / (Spores counted).
  original_file: raw/trait_data.csv (extracted from the source PDF by Claude AI, Anthropic)
  notes: Additional trait data (pollen_aggregation_type, pollen_tackiness, stigma_shape,
    style_filament_length_ratio_category, ovary_locule_number, corolla_dehiscence_type,
    pollen_release_mechanism) not yet mapped to AusTraits; trait data are available in
    raw/trait_data.csv.
