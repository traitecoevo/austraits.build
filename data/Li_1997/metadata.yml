contexts:
- context_property: preferred habitat
  category: entity_context
  var_in: preferred habitat
traits:
- var_in: hexane soluble yields (% dry weight, mean)
  unit_in: '%'
  trait_name: leaf_wax_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 15--20
  methods: Mature leaves (excluding the previous year's) from each sample were removed
    from branches and the lamina (petiole was excluded) cut into 2 cm2 pieces and well
    mixed. A 25 g sample of leaf pieces was collected for wax extraction, and a separate
    100 g sample prepared and dried to constant weight at 50°C for moisture content determination.
    Each 25 g sample of fresh leaf material was placed in a glass flask, 30 ml of pure
    hexane added and the flask shaken at room temperature for 15 min, a process repeated
    three times for each sample with the three solutions combined and filtered. The hexane
    extract of each sample was then concentrated using a rotary evaporator, transferred
    into a pre-weighed, labelled glass vial, and evaporated at room temperature until
    dry. The individual vials containing dried waxes were weighed and the weight of dried
    waxes obtained by subtraction. The wax yield for each sample was calculated on a
    dry weight basis.
- var_in: glaucousness juvenile leaves
  unit_in: .na
  trait_name: leaf_glaucousness_juvenile_leaves
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Species-level glaucousness of juvenile foliage (glaucous, subglaucous or green)
    as scored by the authors.
substitutions:
- trait_name: leaf_glaucousness_juvenile_leaves
  find: green
  replace: not_glaucous
- trait_name: leaf_glaucousness_juvenile_leaves
  find: subglaucous green
  replace: subglaucous not_glaucous
