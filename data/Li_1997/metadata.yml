traits:
- var_in: oil_yield
  unit_in: '%'
  trait_name: leaf_essential_oil_per_dry_mass
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: oil_yield_n
  methods: Individual leaves were plucked from the upper 30-40 cm of the sample branches
    (last year's old leaves were excluded), cut into 1-2 cm2 pieces and 100g lots
    taken for oil extraction. Another 100 g lot of chopped leaves was prepared for
    each sample, and dried to constant weight at 50°C for moisture content determination.
    The fresh weight (FW) vs dry weight (DW) parameter was obtained from the latter.
    Fresh leaf samples were steam distilled, using a glass distillation unit, for
    6 hours. The oils were collected and weighed. Oil yield for each sample was calculated
    on a dry weight of leaf basis, calculated using the FW/DW rates.
- var_in: oil_yield_internal_standard
  unit_in: '%'
  trait_name: leaf_essential_oil_per_dry_mass
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: oil_yield_internal_standard_n
  methods: Individual leaf samples were weighed and then cut into 2-3 cm pieces. Approximately
    3-4 g of cut leaves were used for oil and wax extraction. Another 1-2g lot was
    used for moisture determination. The fresh leaf sample was placed in a small flask
    and approximately 7-10 ml hexane added. The flask was then shaken at room temperature
    for 5 minutes. This extraction process was repeated twice. After washing off the
    surface waxes, the leaf samples were steam distilled for six hours, using a small
    glass steam-distillation unit in which 1ml hexane had been added. The oils were
    collected in the hexane. The yield determination of these leaf oils was made possible
    by the use of n-tetradecane as an internal standard.
- var_in: cineole_percent
  unit_in: '%'
  trait_name: leaf_1_8_cineole_mass_per_essential_oil_mass
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: cineole_percent_n
  methods: The leaf oils were analysed by combined GC-MS using a HP-5890 GC directly
    coupled to a VG 707F mass spectrometer with 2035 data system. The GC column was
    a 50 m x 0.3 mm BP20 (SGE Pty Ltd), and temperature was programmed from 50 to
    220°C at 6°C per minute after a one minute hold, using helium as carrier gas.
    Identification of individual compounds was based on reference mass spectra and
    an in-house library of reference spectra built up from standard compounds and
    oils of known composition. The essential oils were run under identical conditions
    using a Flame Ionization Detector on a HP5890 Gas Chromatograph to give relative
    peak areas for individual compounds.
- var_in: cineole_absolute
  unit_in: g/10kg
  trait_name: leaf_1_8_cineole_per_dry_mass
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: cineole_absolute_n
  methods: Absolute content of individual oil compounds in foliage (g/10kg DW) = Oil
    yield (g/100g DW) x percentage content of compound in oil (%), where DW is oven
    dry weight.
- var_in: wax_yield
  unit_in: '%'
  trait_name: leaf_wax_per_dry_mass
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: wax_yield_n
  methods: Individual leaf samples (25g) were placed in a glass flask, then 30 ml
    of pure hexane added and shaken at room temperature for 15 min. This extracting
    process was repeated 3 times. The hexane extract solutions were filtered, the
    solvent removed in a rotary evaporator at 25°C and reduced to dryness in pre-weighed
    and labelled vials. Wax yield was expressed as a percentage of dry leaf weight
    as for leaf oils. Only the hexane soluble wax is considered.
- var_in: wax_crystal_form
  unit_in: .na
  trait_name: leaf_epicuticular_wax_crystal_form
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Wax morphology of the fresh leaves used for chemical analysis was examined.
    Leaf pieces were fixed to 1 cm diameter aluminium stubs using double-sided adhesive
    tape, sputter-coated with 25-30 nm of gold in an argon atmosphere and examined
    in a Philips 505 scanning electron microscope at 80 KV. Wherever possible, newly
    mature leaves were chosen for examination. Wax distribution and densities are
    those of abaxial surfaces unless otherwise indicated. Approximately one-third
    of the populations sampled were examined.
- var_in: wax_density
  unit_in: .na
  trait_name: leaf_epicuticular_wax_density
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Wax morphology of the fresh leaves used for chemical analysis was examined.
    Leaf pieces were fixed to 1 cm diameter aluminium stubs using double-sided adhesive
    tape, sputter-coated with 25-30 nm of gold in an argon atmosphere and examined
    in a Philips 505 scanning electron microscope at 80 KV. Wherever possible, newly
    mature leaves were chosen for examination. Wax distribution and densities are
    those of abaxial surfaces unless otherwise indicated. Approximately one-third
    of the populations sampled were examined.
- var_in: glaucousness_juvenile_leaves
  unit_in: .na
  trait_name: leaf_glaucousness_juvenile_leaves
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Species-level glaucousness phenotype of juvenile foliage following Barber
    (1955), and population-level glaucousness noted for populations examined by scanning
    electron microscopy.
