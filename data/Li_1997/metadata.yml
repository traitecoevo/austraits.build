dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        locality = str_replace(locality, "Mr. Arrowsmith", "Mt. Arrowsmith"),
        locality = str_replace(locality, "Government H ills", "Government Hills"),
        `glaucousness juvenile leaves` = if_else(`leaf age class` == "juvenile", `glaucousness type`, NA_character_)
      )'
  collection_date: 1989-05/1989-11
  taxon_name: species
  location_name: locality
  description: Analysis of leaf waxes from juvenile and adult leaves from natural populations
    of all Eucalyptus species from the informal subgenus Symphyomyrtus native to the
    island of Tasmania.
  basis_of_record: field
  life_stage: leaf age class
  sampling_strategy: Sample collection. Leaf samples were collected from natural forests
    throughout the island of Tasmania (40°40' to 43°40'S, and 144°40' to 148°20'E) between
    May and November, 1989 (Table 2 and Fig. 1), when seasonal variation was minimal
    (Li, 1993). At each locality, a species collection comprised a pooled sample of
    morphologically adult leaves collected from 15 to 20 reproductively mature trees
    and a pooled juvenile leaf sample collected from 15 to 20 juvenile plants from the
    same area. Fresh leaf samples were sealed in plastic bags and kept cool until returned
    to the laboratory. The samples were stored at 4°C and processed within two weeks
    of collection.
  original_file: transcribed from manuscript
  notes: Site elevations are from Appendix 4.1 of the author's PhD thesis (Li 1993).
