  location_name: location_name
  source_id: source_id
  description: Leaf essential oil yield and 1,8-cineole content, leaf epicuticular
    wax yield, and epicuticular wax crystal form and density of juvenile and adult
    leaves of the 29 Eucalyptus species native to Tasmania, sampled from natural populations,
    together with leaf oil and wax data from species/provenance, family and F1 hybrid
    trials of E. regnans, E. delegatensis, E. globulus, E. nitens and E. ovata.
  basis_of_record: basis_of_record
  life_stage: life_stage
  measurement_remarks: measurement_remarks
  sampling_strategy: Foliage from 29 species of eucalypt was collected throughout
    the island of Tasmania (40°40' to 43°40' S, and 144°40' to 148°20' E) between
    May and December 1989. Sampling was conducted from sea level to the tree-line,
    across an altitude range of approximately 1,100 m. Access was mainly gained by
    the general public road network, and the only area not covered was the south-west
    region where there are few roads. Since this region supports only three species
    of eucalypt, E. nitida, E. vernicosa and E. ovata (Jackson 1965), and these species
    and their characteristic associations are well represented in other regions, the
    region was not considered a major omission. The number of localities of each species
    sampled was mainly determined by their geographical distribution and the degree
    of morphological variation within species. ^p At each locality, a species collection
    comprised a pooled sample of adult leaves collected from 15-20 reproductively
    mature trees and a pooled juvenile leaf sample collected from 15-20 seedlings
    from the same area. Fresh leaf samples were sealed in plastic bags, labelled and
    transported to the University of Tasmania as soon as possible. The samples were
    then stored at 4°C until processed within two weeks of collection. ^p The study
    sites were located at altitudes 60, 240, 440, and 650 m (sites 1 to 4) in the
    Esperance Valley, southeastern Tasmania. All sites were of similar topography
    and selected to average or exceed the average Site Index classification for the
    Southern Forests of Tasmania. Sites 1 to 4 had similar soil type. Each of the
    four study sites was 1.0 hectare in area and received uniform treatments of fertilizer,
    weed and pest control. Planting stock of two provenances of each of the four Eucalyptus
    species was raised from seed collected from different localities (Table 3.1) and
    seedlings planted at 2x2 m spacings in August 1983. ^p Samples of adult foliage
    of ten randomly selected trees from each provenance of 6 year old E. globulus,
    E. nitens, E. delegatensis and E. regnans were collected at the end of April 1989
    from CSIRO Esperance site 1 when leaf expansion had ceased (the end of March).
    ^p In May 1991, adult leaves from 5 trees of each provenance of each species (tree
    age eight years) were collected at Sites 1, 2, 3 and 4. Fresh leaf samples of
    each provenance were mixed and sealed in plastic bags and then treated in the
    same manner as in experiment 1. Thus a single sample was obtained for each provenance
    at each site. ^p It should be noted that the leaf samples for study of seasonal
    variation in this section consisted of new leaves which expanded during the study
    period (November 1987 to November 1988) and did not include the old leaves of
    the previous year. ^p Progenies from interspecific pollinations of these families
    were planted on a single quality site of APPM Forest Products at West Ridgley
    in October 1988 by Dr. B. M. Potts. From the successful hybrids and out crosses,
    adult leaf samples of three trees of each family were sampled in December 1990.
    ^p The E. nitens provenance trial is located in the Esperance Valley, SE Tasmania
    (c. lat. 43°18' S; long. 146°54'; alt. 150m). Planting stock was raised from seed
    collected from mainland Australia and seedlings were planted in August 1982 by
    the Tasmanian Forest Commission. This trial contained materials from 20 provenances,
    each provenance represented by 5 randomised blocks. In each randomised block each
    provenance was represented by 9 trees in 3 x 3 randomized plots with 3 x 3m spacing
    between trees.
  original_file: Transcribed from the thesis (scanned PDF) by Claude AI (Anthropic);
    the full transcription of all data tables is in raw/trait_data.csv and raw/location_data.csv,
    Li et al. (1997) Table 3 wax yields are in raw/Li_1997_table3_wax_yield.csv, and
    data.csv is assembled from these by raw/build_data_csv.py.
  notes: Li et al. (1997) publishes the wax yields of the 17 Symphyomyrtus species
    from the thesis natural-population survey; these values are taken from the paper
    (source_id Li_1997) and all other values from the thesis (source_id Li_1993).
    The paper reports E. ovata separately for east-coast (4 populations) and west-coast
    (2 populations) populations, where the thesis gives a combined 6-population mean
    (0.4%), and gives E. cordata as 1.1% from 4 populations, where the thesis gives
    1.0% from 5 populations (the thesis includes Chimney Pot Hill); E. viminalis in
    the paper includes two E. viminalis/E. dalrympleana intermediate populations (8
    populations; thesis 6). Natural-survey values are means across the populations
    sampled for each species and are recorded as metapopulation values located at
    Tasmania's centroid, with the survey sites listed in measurement_remarks; E. radiata
    and E. perriniana were each sampled at a single site and are recorded as population
    values at that site. Leaf type (adult or juvenile foliage) is recorded as a context;
    Two provenances treated as E. nitens in the thesis (Bendoc and Gunmark Range)
    were later classified as E. denticulata (Cook and Ladiges 1991). Candidate traits
    in raw/trait_data.csv not yet in AusTraits - (1) leaf essential oil composition,
    percent of oil (leaf_oil_<compound>_percent), 70 specific compounds; chippendale_series,
    jackson_species_group, leaf_wax_dominant_compounds, leaf_wax_tube_length, leaf_wax_type,
    pryor_johnson_classification. Additional notes from Claude AI, Appendix 10.1 prints
    the oil yields of the two F1 hybrids swapped relative to Table 10.1 and the text;
    oil yield means for Chapter 10 are taken from Table 10.1 and the two F1 oil yield
    SDs are omitted.; In Table 2.4 (preferred habitat), the text 'replaces E. vernicosa
    on less exposed sites and on waterlogged sites towards the south-east' is printed
    against E. vernicosa, and E. subcrenulata has no row; it is assigned here to E.
    subcrenulata.; The replicates for Table 11.7 E. nitens provenance wax yields are
    not printed; they are assumed to be the same bulked samples as the Table 11.3
    oil analyses (10 adult-leaf trees, 5 juvenile-leaf trees). The number of trees
    contributing to family mean DBH (Appendix 11.1) is not stated.
