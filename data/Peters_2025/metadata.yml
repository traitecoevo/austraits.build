dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        `leaf safety (MPa)` = as.character(round(as.numeric(`psiTLP (MPa)`) - as.numeric(`Leaf P50 (MPa)`), 2))
      )'
  collection_date: collection_date
  taxon_name: Species
  location_name: Site
  description: To test the hydraulic vulnerability segmentation hypothesis, which
    predicts that leaves are more vulnerable to xylem embolism than stems, and whether
    segmentation is more pronounced in tree species from arid environments.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'We sampled dominant canopy species from five Terrestrial Ecosystem
    Research Network (TERN) SuperSites (additional information at www.supersites.tern.org.au).
    Sites represent iconic Australian ecosystems that are geographically dispersed
    and have contrasting climates: lowland wet tropical rainforest (Daintree, QLD);
    temperate wet forest (Warra, TAS); temperate woodland (Cumberland Plain, NSW);
    eastern semi-arid woodland (Calperum, SA) and western semi-arid woodland (Great
    Western Woodland, WA). Canopy tree species were selected based on dominance and
    practicality for leaf imaging: large leaf size could not be accommodated in all
    camera types and thick or protruding leaf veins made camera focus difficult. In
    all, we sampled 12 species across the five sites (Table 1); all species are evergreen
    angiosperms. ^p Branch sampling occurred in the early morning (between 6:00 and
    8:00 am). One well-hydrated branch at least 1 m in length (up to 3 m for Eucalyptus
    species, which have long xylem vessels) was collected from 3 to 5 trees of each
    species. Branches were recut underwater and transported to the field laboratory
    wrapped in humid plastic bags. Cut ends were kept moist and sealed during transport.'
  original_file: Tables 1 and 2 of manuscript, transcribed to raw/trait_data.csv (long
    format, with source section for every value) and pivoted to data.csv
  notes: Stem P50, psiTLP, psipd and psileaf columns in data.csv are reproduced from
    Peters_2021 and are already in dataset Peters_2021, so are 
    not mapped here; psiTLP is used only to calculate leaf safety in custom_R_code.
