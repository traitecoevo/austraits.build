questions:
  question1: The manuscript gives no sampling dates. collection_date uses the Peters
    et al. (2021) site visit ranges for the same five sites, as the manuscript says
    the Peters et al. (2021) data were collected from the same trees during the same
    field visits. Is this appropriate?
