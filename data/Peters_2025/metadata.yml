traits:
- var_in: Leaf P50 (MPa)
  unit_in: MPa
  trait_name: leaf_water_potential_50percent_lost_conductivity
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: leaves per curve
  methods: 'A single leaf was selected from each branch for imaging, using the optical
    visualization method (Brodribb, Skelton, McAdam, Bienaimé, Lucani and Marmottant,
    2016). Branches and all associated leaves were kept humid with damp paper towels
    during setup to prevent premature dehydration. Leaf selection was based on condition,
    absence of damage and maturity; immature leaves were avoided as the vulnerability
    of immature leaves may differ from mature leaves (Rodriguez-Dominguez et al. 2018).
    Measurement leaf remained connected to the branch for the entire measurement.
    ^p Imaging in this experiment was achieved using three different camera setups:
    a digital microscope camera (DigiRetina 16MP camera; Aunet) mounted on a stereo
    microscope with base illumination; a flatbed scanner with transmitted light (Epson
    Perfection V550 Photo; Epson America); and custom-built leaf clamp with an integrated
    light base, x10 lens and 5MP digital camera operated by a Raspberry pi 3 single-board
    computer (Rpi clamp; parts list, leaf clamp blueprints, ''cavicapture'' Python
    script and instructions available at http://www.opensourceov.org - clamp version
    1; see Lucani et al. (2019)). Leaves were fixed to the microscope stage and scanner
    bed using a microscope slide, stage clips and transparent adhesive tape. A microscope
    slide was also used in the Rpi clamp to keep the leaf flat. Tape was particularly
    useful to prevent the movement of leaves and branches during dehydration. Images
    were captured with ISCapture 4.1 software with the microscope camera with an acquisition
    rate of 1 min. For the scanner, a third-party software (VusScan, Hamrick Software)
    was used for time-laps programming. With both the scanner and Rpi clamps, the
    image acquisition rate was 5 min. ^p Light and temperature fluctuations were minimized
    during measurements. Branch dehydration with leaf imaging lasted between 2 and
    7 days depending on species and vulnerability. Imaging was run until the leaves
    were completely desiccated. When possible, images were examined during the dehydration
    to confirm that embolism events were visible. We aimed to continue imaging for
    roughly 6 h after the last embolism event to ensure the full curve was captured.
    ^p Simultaneously, water potential was measured with a stem psychrometer (ICT
    International, Armidale AU) installed on each branch approximately 30 cm from
    the imaged leaf. Psychrometers measured water potential at 10 min intervals. Additionally,
    leaf water potential was measured on neighbouring leaves periodically (usually
    once or twice a day) using a PMS Scholander pressure chamber (PMS Instruments,
    Albany OR) to confirm psychrometer readings. ^p Image analysis was conducted in
    Image J (NIH). Scanner images needed to be cropped and aligned using ImageJ plugin
    ''Linear Stack Alignment with SIFT'' before image analysis. A time series of embolism
    events was constructed using image subtraction as per (Brodribb, Skelton, McAdam,
    Bienaimé, Lucani and Marmottant 2016) with processing instructions available at
    https://www.opensourceov.org (Figure 1) and time-series of cumulative area embolized
    was generated using ''analyse particles''. ^p Vulnerability curves were constructed
    in R (v.3.2.0; R Core Team, 2015). A Loess function (scale = 0.1) was fitted to
    psychrometer data to model water potential for each cumulative embolism curve.
    In cases where psychrometer data did not extend for the full duration of the dehydration,
    the model was extrapolated using pressure chamber-derived leaf water potential
    measurements using a spline function. The ''FitPLC'' package (Duursma and Choat
    2017) was used to fit leaf vulnerability curves, using tree replicates as a random
    effect. From the curve, we calculated the water potential at which 12%, 50% and
    88% of the area embolized (P12, P50 and P88, respectively) and 95% confidence intervals
    (CIs) (Table 2).'
