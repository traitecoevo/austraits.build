- var_in: leaf safety (MPa)
  unit_in: MPa
  trait_name: hydraulic_safety_margin_50
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: leaves per curve
  methods: 'We used stem hydraulic vulnerability (Stem P50), leaf turgor loss point
    (psiTLP) and seasonal minimum leaf water potential (psipredawn and psileaf at predawn
    and midday, respectively) for our study species previously reported in Peters
    et al. (2021). These data were collected from the same trees used in the current
    study during the same field visits. Stem P50 was measured hydraulically, using
    benchtop dehydration method (Sperry, Donnelly and Tyree 1988); psiTLP was derived
    following (Tyree and Hammel 1972); and leaf water potential values were measured
    in the hottest and driest season between 2016 and 2018 using the Scholander pressure
    chamber. ^p Leaf safety was calculated as follows: Leaf safety = psiTLP - Leaf P50
    where psiTLP is the leaf turgor loss point.'
  organ_measured: leaf
  safety_margin_definition: leaf turgor loss point minus leaf P50
- var_in: slope
  unit_in: .na
  trait_name: .na
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: leaves per curve
  methods: 'The ''FitPLC'' package (Duursma and Choat 2017) was used to fit leaf vulnerability
    curves, using tree replicates as a random effect.'
