dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(trait %in% c("leaf_Mn_per_dry_mass", "leaf_Ni_per_dry_mass", "leaf_Al_per_dry_mass")) |>
      dplyr::filter(!grepl("^(above|>|<|approx)", trait_value_raw)) |>
      dplyr::filter(context != "sampling: first" | is.na(context))
    '
  collection_date: 2008
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  individual_id: individual_id
  description: To screen herbarium specimens of eastern Australian Gossia, Austromyrtus,
    Lenwebbia, Macadamia, Maytenus and Denhamia for previously unrecognised Mn hyperaccumulators,
    and to assess whether leaf Mn concentrations could be used as a taxonomic tool.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: Leaf fragments weighing 0.01-0.1 g d. wt were sampled from Queensland
    Herbarium specimens, and all species sampled are listed in Table 1. They are divided
    here into seven major groups labelled A-G for ease of reference. Replicates of
    each species were taken randomly from the collection, depending on availability
    of material. 'Replicates' represented different trees, and three to seven were
    initially collected. However, the seven species identified in the Results section
    as being of interest were subsequently re-sampled as different replicates, and
    their first and second datasets combined. ^p On the basis of data obtained from
    the initial sampling, and also on the availability of replicates not previously
    taken, the herbarium collection was re-sampled as before. ^p Secondly, the age
    of leaves sampled is relevant to Mn accumulation. It is well known that Mn taken
    up in the xylem does not re-enter the phloem, leading to an increasing concentration
    gradient with leaf age (Lonergan, 1988). Best endeavours were made in this study
    to select tissue fragments from oldest available leaves. Thirdly, certain practices
    of tissue preservation for permanent herbarium storage, such as immersion in alcohol,
    etc. could be detrimental to Mn retention in the tissues. When selecting samples
    for this study, samples incorporating such preparations were avoided where possible.
  original_file: data extracted from the source PDF (Tables 1-2 and text)
  notes: Species means are from Table 2. Single-specimen values and ranges stated
    in the Results text are included as individual records and minimum/maximum values.
    Sample sizes are inconsistent in places. The text says all nine G. bamagensis
    samples exceeded 10 000 ug/g Mn, but Table 2 gives n = 8. Table 3 gives 26 Maytenus
    samples in total, but Table 2 gives 43 for M. cunninghamii alone. Table 2 values
    of n are used as replicates. Fe and Ti were measured only to screen for soil contamination
    and are not included.
identifiers: .na
locations: .na
contexts:
- context_property: specimen group
  category: entity_context
  var_in: specimen_group
traits:
- var_in: leaf_Mn_per_dry_mass
  unit_in: ug/g
  trait_name: leaf_Mn_per_dry_mass
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: For each sample, approx. 0.03 g of leaf material was weighed into a Pyrex
    test-tube and ashed at 450 °C for 2.5 h. The resulting ash was dissolved in 6
    mL 2 M HCl, and the solution centrifuged (5000 g, 20 min), and the supernatant
    analysed by ICP-OES for Mn, Ni, iron (Fe), aluminium (Al) and titanium (Ti). Quantification
    was carried out against standards prepared in 2 M HCl. It is unlikely that the
    herbarium specimens were soil-contaminated when collected in the field, since
    these species are foliated well above soil surfaces. However, foliar concentrations
    of Fe and Ti were used here to monitor for possible contamination on the basis
    that soils commonly contain Fe, and that, although Ti is present in soils, its
    accumulation in leaf tissues is unusual. Foliar Fe concentrations >500 ug g-1
    d. wt can be considered toxic (Marschner, 2002), while according to unpublished
    data (R. D. Reeves, pers. comm.) foliar Ti concentrations exceeding 100 ug g-1
    d. wt are likely to be due to soil contamination. Hence in this study, foliar
    threshold concentrations of 600 ug g-1 Fe and 100 ug g-1 Ti were taken as being
    indicative of soil contamination, thus necessitating exclusion of data collected
    from four of the approx. 350 samples that were analysed.
