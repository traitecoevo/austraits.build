- context_property: cultivar or flower colour form
  category: entity_context
  var_in: cultivar
- context_property: pre-coppice plant height (population median, mm)
  category: entity_context
  var_in: pre_coppice_height_mm
- context_property: pre-coppice basal area at 100 mm above ground (population median,
    mm2)
