traits:
- var_in: pre_coppice_specific_leaf_area_mm2_per_mg
  unit_in: mm2/mg
  trait_name: leaf_mass_per_area
  entity_type: population
  value_type: median
  basis_of_value: measurement
  replicates: 5
  methods: Traits were measured on plants in the pre-coppiced treatment (five replicates)
    two weeks before plants in the coppiced treatment were coppiced (five replicates).
    Plant height was measured, and five youngest fully expanded leaves were taken
    from each plant to measure specific leaf area (Perez-Harguindeguy et al., 2016).
    The average one-sided leaf area (including petiole if present) was scanned with
    a LA2400 scanner at 600 dpi (Regent Instruments Inc.) and calculated using ImageJ
    software (version 1.53n) through the LeafArea package in RStudio (Katabuchi, 2015).
    Leaves were then oven-dried at 80 °C until constant mass and the average specific
    leaf area was calculated. ^p Raw values are the median values of each species
    across five replicates.
- var_in: pre_coppice_leaf_area_ratio_cm2_per_g
  unit_in: cm2/g
  trait_name: leaf_area_ratio
  entity_type: population
  value_type: median
  basis_of_value: measurement
  replicates: 5
  methods: Traits were measured on plants in the pre-coppiced treatment (five replicates)
    two weeks before plants in the coppiced treatment were coppiced (five replicates).
    [...] Plants were harvested and shoots were separated into leaves and stems. [...]
    Total leaf area was measured by scanning fresh leaves with LI-3100C Area Meter
    (LICOR, Lincoln, NE, USA). Leaves were then oven-dried at 80 °C to constant mass
    to calculate the leaf area ratio for each plant. Roots were harvested by digging
    a 0.5 m x 0.5 m hole around each plant and lateral roots that extended beyond
    the hole were included. Roots were washed free of soil and immediately microwaved
    for one minute to cease enzyme activities before oven-dried at 80 °C to constant
    mass for starch analysis. Oven-dried mass of leaves, stems, and roots were used
    to calculate total biomass and root:shoot. ^p Raw values are the median values
    of each species across five replicates.
- var_in: pre_coppice_root_shoot_g_per_g
  unit_in: mg{root}/mg{shoot}
  trait_name: root_shoot_ratio
  entity_type: population
  value_type: median
  basis_of_value: measurement
  replicates: 5
  methods: Traits were measured on plants in the pre-coppiced treatment (five replicates)
    two weeks before plants in the coppiced treatment were coppiced (five replicates).
    [...] Plants were harvested and shoots were separated into leaves and stems. Stems
    were immediately microwaved for one minute to cease enzyme activities before oven-dried
    at 80 °C to constant mass for starch analysis. [...] Roots were harvested by digging
    a 0.5 m x 0.5 m hole around each plant and lateral roots that extended beyond
    the hole were included. Roots were washed free of soil and immediately microwaved
    for one minute to cease enzyme activities before oven-dried at 80 °C to constant
    mass for starch analysis. Oven-dried mass of leaves, stems, and roots were used
    to calculate total biomass and root:shoot. ^p Raw values are the median values
    of each species across five replicates.
- var_in: pre_coppice_root_starch_percent
  unit_in: '%'
  trait_name: root_starch_per_mass
  entity_type: population
  value_type: median
  basis_of_value: measurement
  replicates: 5
  methods: Roots were harvested by digging a 0.5 m x 0.5 m hole around each plant
    and lateral roots that extended beyond the hole were included. Roots were washed
    free of soil and immediately microwaved for one minute to cease enzyme activities
    before oven-dried at 80 °C to constant mass for starch analysis. ^p Oven-dried
    stem and root samples were ground using a laboratory cutting mill (8 mm sieve;
    Pulverisette 15 Type 302, Fritsch Gmbh, Idar-Oberstein, Germany) followed by a
    Cyclotec mill (0.5 mm sieve; 1093 Sample Mill, FOSS Tecator, Hoganas, Sweden).
    We followed a modified method of starch extraction from Arndt et al. (2008) described
    in Smith et al. (2018) and Fischer et al. (2022). To determine starch concentration,
    40 mg dry weight of ground samples were homogenised and rinsed three times with
    ethanol:water (8:2 v/v) to remove soluble sugars. The remaining pellet was dried
    at 40 °C overnight, and starch in the pellet was converted into glucose when incubated
    with thermostable alpha-amylase (Sigma-Aldrich A4551) at 80 °C for 30 min followed
    by amyloglucosidase (Sigma-Aldrich A10115) at 60 °C for 30 min. ^p Sample solutions
    were transferred to a 96-wells plates (Greiner) in 20 ul duplicates, along with
    five duplicates of internal starch standard (Myoporum viscosum) to ensure enzymatic
    activities were consistent across analyses. Each plate also contained eight duplicates
    of glucose standards, with glucose concentrations ranging from 0 to 1 mg ml−1.
    All wells were filled with 200 ul of glucose assay reagent (Sigma-Aldrich G3293)
    and the plate was incubated at 25 °C for twenty minutes in a microplate spectrophotometer
    (Multiskan GO, Thermo Fisher Scientific, Melbourne, Australia). The reaction during
    incubation induced a change in absorbance at 340 nm that was measured by the spectrophotometer.
    Glucose concentrations (% dry mass) were determined colourimetrically from the
    mean absorbance reading of each sample duplicate using a standard curve constructed
    with the glucose standards in each plate. Duplicates with more than 10 % difference
    in absorbance readings were re-measured. ^p Raw values are the median values of
    each species across five replicates.
- var_in: survival_after_coppicing_percent
  unit_in: .na
  trait_name: resprouting_capacity_non_fire_disturbance
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Plants in the coppiced treatment were coppiced to 100 mm above ground-level
    using secateurs in December 2021 (early summer). Ground cover and prostrate plants
    were pulled to vertical and cut at the coppiced height. ^p Coppiced plants (five
    replicates) were destructively harvested six months after coppicing. Resprouting
    success of each plant was recorded as a binary response (1 = yes and 0 = no),
    which was totalled across five replicates and recorded as a percentage for each
    species to represent as a continuum from weak to strong resprouting (0 to 100
    %). ^p Taxa in which at least one of the five coppiced plants resprouted are recorded
    as resprouting after stem removal; taxa in which none resprouted are recorded
    as killed.
