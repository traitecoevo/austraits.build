dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2021-11/2022-06
  taxon_name: species
  location_name: location_name
  description: A common garden experiment testing whether pre-disturbance plant traits,
    root starch reserves and the water availability of species' natural habitats predict
    how well Australian shrubs and small trees resprout after coppicing, to guide
    species selection for low-maintenance, coppiced "Woody Meadow" urban plantings.
  basis_of_record: captive_cultivated
  life_stage: sapling
  sampling_strategy: We selected 77 species of Australian shrubs (<2 m mature height)
    and small trees (<4 m mature height) to investigate resprouting response after
    coppicing in a common garden experiment. As there is no data on how Australian
    woody species respond to coppicing, we selected most species with known fire resprouting
    strategies with the assumption that coppicing response could be similar to fire
    response, as both are severe disturbances to plants. Of these, 75 species had
    known fire resprouting strategies based on 26 datasets and published studies (Table
    S1). Selection also focused on commonly used shrubs and small trees in urban plantings
    to help design future Woody Meadows using readily available species. There were
    52 resprouters, however, 35 of these resprouters were also identified as non-resprouters
    by different sources. Ten plants of each species were obtained as six-month-old
    plants from local commercial nurseries (Goldfields, Mansfields and Wildtech nurseries).
    ^p We set up a 13-month common garden experiment in the field station at the Burnley
    Campus, University of Melbourne, Victoria, Australia (37° 49′48″ S, 145° 1′24″
    E) (Fig. S1). Mean temperature and rainfall over the experiment were comparable
    to historic data (Australian Government Bureau of Meteorology; http://www.bom.gov.au),
    though rainfall was more variable (Fig. S2). The sandy loam soil had the following
    chemical properties, 6.0 ± 0.4 mg kg−1 ammonium nitrogen, 11.0 ± 1.7 mg kg−1 nitrate
    nitrogen, 162.0 ± 7.0 mg kg−1 phosphorous Colwell, 161.0 ± 7.2 mg kg−1 potassium
    Colwell, 5.1 ± 0.8 mg kg−1 sulfur (KCL 40), 2.61 ± 0.14 % organic carbon, 0.086
    ± 0.008 dS m−1 conductivity, 5.8 ± 0.1 pH (CaCl2), 6.6 ± 0.1 pH (H2O) (tested
    by CSBP soil and plant analysis laboratory, Australia). ^p The experiment site
    (32.8 × 9.5 m) was covered in black polythene weed mat to exclude weed competition
    from the surrounding area during the experiment and the site was divided into
    ten plots (2.5 × 8.5 m) spaced 0.75 m apart for access, with a 0.5 m border. In
    June 2021 (early winter), each plot was planted with 77 plants (one plant per
    species) in randomly assigned planting spots, 0.5 m apart. Plants that failed
    to establish were replaced within the first two months. Plants were occasionally
    irrigated to prevent summer drought from affecting plant performance. Plants grew
    for 24 weeks before the coppicing experiment commenced. ^p The ten plots were
    randomly assigned to five replicates of pre-coppiced and coppiced treatments (i.e.,
    for every two plots, one was randomly assigned to pre-coppiced treatment and the
    other to coppiced treatments). Two weeks before coppicing, plants in the pre-coppiced
    treatment were destructively harvested to capture pre-coppiced traits (i.e., basal
    area, height, leaf area ratio, specific leaf area, root starch concentration,
    starch pool in roots, and root:shoot) (late November 2021; late Spring). Plants
    in the coppiced treatment were coppiced to 100 mm above ground-level using secateurs
    in December 2021 (early summer). Ground cover and prostrate plants were pulled
    to vertical and cut at the coppiced height.
  original_file: data downloaded from figshare (doi.org/10.26188/28723466)
  notes: The figshare file gives pre-coppice trait values for the 9 taxa that did
    not resprout only as standardised values, so these taxa have resprouting data
    only.
