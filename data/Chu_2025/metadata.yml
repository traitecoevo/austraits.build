questions:  
  question1: The figshare file gives pre-coppiced trait values (basal area, number
    of stems, height, total biomass, leaf area ratio, specific leaf area, root starch
    concentration, starch pool in roots and root:shoot) only for the 68 species that
    resprouted. Could you share these values for the nine species that did not resprout
    (Chamelaucium uncinatum, Eucalyptus albida, E. tetraptera, Grevillea rosmarinifolia,
    Hakea laurina, Myoporum viscosum, Olearia teretifolia, Pultenaea pedunculata and
    Westringia longifolia)?
  question2: Section 2.3 says stems were also oven-dried for starch analysis, but only
    root starch is reported. Do you have the stem starch concentrations, and could they
    be shared?
