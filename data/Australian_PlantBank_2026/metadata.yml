source:
  primary:
    key: Australian_PlantBank_2026
    bibtype: Online
    author: Australian PlantBank
    year: 2025
    title: Australian PlantBank dataset from Australian Virtual Seed Bank
    publisher: Australian Virtual Seed Bank
    url: https://seedbank.ala.org.au
contributors:
  data_collectors:
  - last_name: unknown
    given_name: unknown
    ORCID: unknown
    affiliation: Australian PlantBank, The Royal Botanic Gardens & Domain Trust, Mount
      Annan, NSW
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        location_name = ifelse(
          !is.na(`Decimal Latitude`),
          paste0("seeds_collected_at_", `Decimal Latitude`, "_lat_and_", `Decimal Longitude`, "_long"),
          NA
        ),
        collection_date = dplyr::coalesce(as.character(`Collection Date`), "2026"),
        measurement_remarks = ifelse(!is.na(Collector), paste0("Collector: ", Collector), NA),
        germination_unadjusted = ifelse(
          is.na(`Adjusted Germination %`) & as.numeric(`Number Tested`) > 0,
          100 * as.numeric(`Number Germinated`) / as.numeric(`Number Tested`),
          NA
        )
      ) %>%
      filter(!is.na(`Scientific Name`))
    '
  collection_date: collection_date
  taxon_name: Scientific Name
  location_name: location_name
  description: Seed trait data from the Australian PlantBank, The Royal Botanic Gardens
    & Domain Trust, Mount Annan, NSW, including seed mass of collected seeds and data
    on germination trials.
  basis_of_record: lab
  life_stage: adult
  measurement_remarks: measurement_remarks
  sampling_strategy: The Australian PlantBank was built in NSW in 2013. It is an international centre for plant research and learning, incorporating the largest native plant conservation seedbank in Australia. Like the National Herbarium of NSW, the Australian PlantBank forms a living reference collection for identification, research and restoration. Visitors can immerse themselves in the workings of our scientists by seeing into the laboratories aided by award-winning interpretation. As well as storing millions of seeds, PlantBank staff contribute to the conservation, research and restoration of threatened species and plant communities through our partnerships in Australia and overseas.
  original_file: Data downloaded from the Australian Virtual Seed Bank (https://seedbank.ala.org.au)
    GraphQL API (https://events-databox.ala.org.au/graphql) on 10 Nov 2026, all records
    for the Australian PlantBank; see data/ANBG_2026/raw/AVSB_download.R and
    data/ANBG_2026/raw/AVSB_split_by_seedbank.R. The Feb 2025 website download is
    data/Australian_PlantBank_2025/data.csv in commit 245b581a.
  notes: data.csv has one row per seed accession and one row per germination trial (with
    its treatment and the accession's taxon, locality and dates), distinguished by `Event
    Type`. Accessions without a collection date have collection_date 2026 (download year).
    Rows with `Data Version` = "2025 download" are values from the Feb 2025 download that
    are no longer in the Australian Virtual Seed Bank; they are listed, with the reason,
    in raw/2025_missing_values.csv.
identifiers:
- var_in: Accession Number
  identifier_type: catalogNumber
  institution_code: Australian PlantBank
