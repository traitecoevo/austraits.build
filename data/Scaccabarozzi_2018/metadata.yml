contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: entity_context
- context_property: floral visitor individuals recorded (count)
  category: entity_context
  var_in: visitor_count
- context_property: model plants in population
  category: plot_context
  var_in: model_plants
  values:
  - value: present
    description: putative model plants (Daviesia spp.) flowering in the 30 x 30 m quadrat
  - value: absent
    description: no putative model plants (Daviesia spp.) flowering in the 30 x 30 m quadrat
traits:
- var_in: fruit_set_proportion
  unit_in: '{count}/{count}'
  trait_name: fruit_set_proportion
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: To test if the fitness of Di. brumalis (Table S7) increased with the number of
    flowers of the putative model species, the proportion of flowers with pollen removal
    and the proportion of flowers with fruit formation was quantified at 18 populations.
    In 2016 (15 sites) and 2017 (18 sites), we delimited a single 30 × 30-m quadrat per
    site, and at the peak flowering period for Di. brumalis we recorded, (1) the number
    of pea plants of each species within the quadrat; (2) the estimated number of
    flowers for each pea plant species; and (3) how many Di. brumalis plants and flowers
    were present (counted at the end of the flowering season in August). Variable (2)
    was estimated by counting the number of flowers on ten stems per pea plant to enable
    calculation of a mean, then multiplying this value by the total number of stems on
    the plant. Following evidence that the pollinators of Di. brumalis fed almost
    entirely on Daviesia, this variable was modified to be the estimated number of
    flowers of Daviesia. In both years, at the end of the flowering period of Di.
    brumalis we collected data on the number of flowers without pollinia and the number
    of fruits produced. The proportion of flowers with pollinia removal was used as a
    proxy for male fitness, while the proportion of flowers setting fruit was used as a
    proxy for female fitness. ^p Each record is the proportion of flowers setting fruit
    in a quadrat population.
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To test for autogamy, in July 2017, inflorescences with newly-opened flowers
    and no observed pollinia deposited on stigma were covered with a fine, insect proof
    nylon bag until floral senescence (ca. four weeks). To test for self-compatibility,
    one flower on each inflorescence was manually pollinated with pollinia from a
    different flower on the same inflorescence before the pollinated flower was covered
    with a fine, insect proof nylon bag until senescence or fruit formation (ca. four
    weeks). Six individuals were randomly selected at each of the three largest
    populations (F4, F5 and F6) for each test, with one inflorescence selected per
    individual for a total of eighteen inflorescences tested. ^p Diuris brumalis was
    shown to require a vector for pollination, and to be self-compatible.
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To test for nectar production in D. brumalis, and quantify nectar production in
    the proposed models (D. decurrens, D. horrida, D. rhombifolia, H. chorizemifolia, H.
    pungens and B. aquifolium), nectar content in flowers of each species was determined
    in July-August 2016. One inflorescence per individual was bagged for 10 randomly
    selected individuals of each species at three sites (F1, F2, O3). Inflorescences
    were bagged in the afternoon, with nectar collected the following day during the
    warmest hours (from 11.00 to 14.00) to ensure maximum nectar production (Corbet et
    al., 1995). Nectar was collected from two flowers on each inflorescence using a 2 µl
    microcapillary tube (Drummond Microcaps, Broomall; Pa., USA), with nectar volume
    calculated by measuring capillary length of the column of liquid (Corbet, 2003)
    using a digital calliper.
