    hexagon model, which is based on the sensitivities of photoreceptors of the bee Apis
    mellifera (Chittka, 1992; Chittka and Kevan, 2005). ^p Each record is the distance
    of the mean colour locus across floral parts from the centre of the colour hexagon.
