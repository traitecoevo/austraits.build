- var_in: pollination_vector_known
  unit_in: .na
  trait_name: pollination_vector_known
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To identify the pollinators of Di. brumalis and quantify their behaviour,
    observations of pollinator visitation to orchid flowers were undertaken at three
    sites (F1, F2 and O3) between 13 July to 15 August 2016 and 12 July to 13 August
    2017. A total of 191, 15-min observation periods were conducted (for a total of 2865
    min of observation), with insect behaviour recorded using an EOS M video camera
    (Canon, Tokyo, Japan) for subsequent viewing in slow motion. Observations were
    conducted between 1000 and 1530 h when temperatures were above 17 °C (temperature
    ranged between 8 and 19 °C, as measured with a Smartsensor AR827, set 20 cm above
    the ground). ^p Table S3. Observations of floral visitors to Diuris brumalis. Eight
    behavioural categories were distinguished to reflect the pollination process. ^p
    Each record is a bee that arrived at Diuris brumalis flowers already carrying
    pollinia and deposited pollinia on the stigma.
