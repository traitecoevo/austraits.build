- var_in: flower_colour_bee_hue
  unit_in: deg
  trait_name: flower_colour_bee_hue
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: To test if the floral colour of Di. brumalis flowers is likely to be
    distinguishable by bees from the co-flowering pea plants species (Da. decurrens, Da.
    horrida, Da. rhombifolia, H. chorizemifolia, H. pungens and B. aquifolium), we took
    spectral reflectance measurements and analysed them using the Chittka (1992) model
    of bee vision. In addition, spectral reflectance was also measured for two
    yellow-flowered species that occurred at all sites, Hibbertia hypericoides
    (Dilleniaceae) and Acacia pulchella (Fabaceae), to test if other yellow-flowered
    species could also be part of the same guild as the pea plants. Spectral reflectance
    was measured on two flowers per plant for six randomly selected individuals of each
    species using a spectrometer (Jaz, DH-2000 UV-VIS-NIR Light source) with an
    integration time of 50 milliseconds. For Di. brumalis, measurements of spectral
    reflectance were taken from the outer lateral petals, the central dorsal sepal, the
    labellum and labellum lateral lobes; for pea plant species measurements were taken
    from the standard and wing petals (Fig. 2G) and for Hibbertia hypericoides and
    Acacia pulchella from the most conspicuous part of the floral display (the corolla
    and stamens, respectively). Spectral reflectance was analysed using the colour
    hexagon model, which is based on the sensitivities of photoreceptors of the bee Apis
    mellifera (Chittka, 1992; Chittka and Kevan, 2005). ^p Each record is the hue angle
    of the mean colour locus across floral parts, measured clockwise from the top of the
    colour hexagon.
