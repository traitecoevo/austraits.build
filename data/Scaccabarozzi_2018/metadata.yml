dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        !(trait == "fruit_set_proportion" & dplyr::coalesce(pollination_treatment, "") != "")
      ) |>
      dplyr::mutate(
        trait_value = dplyr::if_else(
          trait %in% c("flower_visitor", "pollination_vector_possible", "pollination_vector_known"),
          trait_value_clean,
          trait_value
        )
      )
    '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  source_id: source_id
  description: To test whether the orchid Diuris brumalis is pollinated by mimicry of
    co-flowering pea plants (Faboideae), and whether its pollination success increases
    with the abundance of the model species.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Data were collected from Di. brumalis populations in the Darling
    Range, near Perth, Western Australia, during 2016 and 2017 (Fig. 1). The populations
    were selected across two different habitat types (Fig. 1; Table S1), Jarrah forest
    (hereafter referred to as ‘forest’; 15 sites) and heathland surrounding granite
    outcrops (hereafter ‘outcrop’; three sites). No other species of Diuris was observed
    flowering at any site during the study period. ^p Diuris brumalis frequently
    co-occurs with several species of Faboideae (Fabaceae; Marshall, 1995). Six species
    of flowering Faboideae, commonly referred to as pea plants, were identified at the
    study sites (Fig. 2A–F), namely Daviesia decurrens, Da. horrida, Da. rhombifolia,
    Hovea chorizemifolia, H. pungens and Bossiaea aquifolium (Table S1). While Da.
    decurrens, Da. rhombifolia, H. chorizemifolia, H. pungens and B. aquifolium were
    present at forest sites and only Da. horrida and H. pungens were present at outcrop
    sites. Voucher specimens of all studied species were collected and accessioned at
    Herbarium of Western Australia in Perth (Table S2). ^p To identify the pollinators
    of Di. brumalis and quantify their behaviour, observations of pollinator visitation
    to orchid flowers were undertaken at three sites (F1, F2 and O3) between 13 July to
    15 August 2016 and 12 July to 13 August 2017. A total of 191, 15-min observation
    periods were conducted (for a total of 2865 min of observation), with insect
    behaviour recorded using an EOS M video camera (Canon, Tokyo, Japan) for subsequent
    viewing in slow motion. Observations were conducted between 1000 and 1530 h when
    temperatures were above 17 °C (temperature ranged between 8 and 19 °C, as measured
    with a Smartsensor AR827, set 20 cm above the ground). Arrays of orchid flowers were
    designed to replicate the colony-forming habit of Di. brumalis and comprised
    multiple inflorescences that had been cut and placed in glass vials (two
    inflorescences per vial, each with 4–6 flowers). For each observation period, three
    vials were spaced 10–20 cm apart to create a conspicuous floral display, with vials
    placed 1–2 m from flowering individuals of Da. decurrens, Da. rhombifolia or Da.
    horrida. While artificial arrays of flowers were used as the basis for pollinator
    observations, naturally occurring Di. brumalis were common at each of these three
    sites where observations were undertaken. For each individual insect visiting a
    flower of Diuris and pea plants, the behaviour was recorded and categorized as
    follows, (1) the insect approached the flower, (2) the type of behaviour exhibited
    upon approaching the flower [...], (3) the insect was carrying pollinia of Di.
    brumalis, (4) if the insect landed on the flower, (5) the length of time spent on
    the flower (if >1 s), (6) if the insect attempted to forage on the flower, either
    attempting to manipulate the labellum/keel by opening the wings, or attempting to
    feed on nectar (Fig. 2G), (7) if the insect removed or deposited pollen of Di.
    brumalis or of pea plants (based on filament contact with the insect) and (8) if the
    insect visited additional Di. brumalis or pea plant flowers (Tables S3, S4).
    Behaviour was only recorded for the first flower visited, as due to the very rapid
    movement of pollinators, it was often impossible to accurately quantify visits to
    subsequent flowers. ^p To determine if Di. brumalis shares pollinators with
    co-flowering pea plants, pollinator observations were undertaken at two forest sites
    (F1, F2) and one outcrop site from 13 July to 6 September in 2016 and from 11 July
    to 9 September 2017. Observations were made between 1100 and 1500 h daily, with the
    same video camera set up as described above. A total of 32 observation periods were
    undertaken for B. aquifolium, Da. decurrens, Da. horrida, Da. rhombifolia, H.
    chorizemifolia and H. pungens individuals, each of 15 min, yielding a total of 480
    min of observation for each plant species. The pollinator behaviours recorded
    corresponded to those used for visitors to the Diuris (see above), to enable a
    formal behavioural comparison. ^p Pollinators observed on Di. brumalis and pea plant
    flowers (particularly individuals carrying the distinctive white pollinia of Di.
    brumalis) were collected for identification. All collected insect pollinators were
    sent to the Western Australian Museum as voucher specimens (Table S5). ^p To test if
    Di. brumalis shows greater overlap in floral morphology with the candidate model
    species than the remainder of the plant community, a morphological evaluation of the
    floral traits of the dominant co-flowering plant species, including functional
    pollinators traits, was conducted at three forest sites (F1, F2 and F3).
    Morphological evaluation was conducted on Di. brumalis and 20 co-flowering species
    from 11 families in accordance with the descriptions in Marchant et al. (1987). The
    traits included were corolla symmetry (zygomorphic, actinomorphic), corolla shape
    (rotate, papillionaceous, bilabiate, ligulate), flower width and length (in mm),
    flower orientation (pendant, upright, horizontal), plant height (in cm), petal
    projections as a platform for pollinators (presence or absence), anther position
    (exposed or not exposed) and inflorescence type (umbel, raceme, spike, panicle,
    solitary) (Table S6). [...] ^p To test if the floral colour of Di. brumalis flowers
    is likely to be distinguishable by bees from the co-flowering pea plants species
    (Da. decurrens, Da. horrida, Da. rhombifolia, H. chorizemifolia, H. pungens and B.
    aquifolium), we took spectral reflectance measurements and analysed them using the
    Chittka (1992) model of bee vision. In addition, spectral reflectance was also
    measured for two yellow-flowered species that occurred at all sites, Hibbertia
    hypericoides (Dilleniaceae) and Acacia pulchella (Fabaceae), to test if other
    yellow-flowered species could also be part of the same guild as the pea plants.
    Spectral reflectance was measured on two flowers per plant for six randomly selected
    individuals of each species using a spectrometer (Jaz, DH-2000 UV-VIS-NIR Light
    source) with an integration time of 50 milliseconds. For Di. brumalis, measurements
    of spectral reflectance were taken from the outer lateral petals, the central dorsal
    sepal, the labellum and labellum lateral lobes; for pea plant species measurements
    were taken from the standard and wing petals (Fig. 2G) and for Hibbertia
    hypericoides and Acacia pulchella from the most conspicuous part of the floral
    display (the corolla and stamens, respectively). Spectral reflectance was analysed
    using the colour hexagon model, which is based on the sensitivities of
    photoreceptors of the bee Apis mellifera (Chittka, 1992; Chittka and Kevan, 2005).
    [...] ^p To test if the fitness of Di. brumalis (Table S7) increased with the number
    of flowers of the putative model species, the proportion of flowers with pollen
    removal and the proportion of flowers with fruit formation was quantified at 18
    populations. In 2016 (15 sites) and 2017 (18 sites), we delimited a single 30 × 30-m
    quadrat per site, and at the peak flowering period for Di. brumalis we recorded, (1)
    the number of pea plants of each species within the quadrat; (2) the estimated
    number of flowers for each pea plant species; and (3) how many Di. brumalis plants
    and flowers were present (counted at the end of the flowering season in August).
    Variable (2) was estimated by counting the number of flowers on ten stems per pea
    plant to enable calculation of a mean, then multiplying this value by the total
    number of stems on the plant. Following evidence that the pollinators of Di.
    brumalis fed almost entirely on Daviesia, this variable was modified to be the
    estimated number of flowers of Daviesia. In both years, at the end of the flowering
    period of Di. brumalis we collected data on the number of flowers without pollinia
    and the number of fruits produced. The proportion of flowers with pollinia removal
    was used as a proxy for male fitness, while the proportion of flowers setting fruit
    was used as a proxy for female fitness. [...] ^p To test for nectar production in D.
    brumalis, and quantify nectar production in the proposed models (D. decurrens, D.
    horrida, D. rhombifolia, H. chorizemifolia, H. pungens and B. aquifolium), nectar
    content in flowers of each species was determined in July-August 2016. One
    inflorescence per individual was bagged for 10 randomly selected individuals of each
    species at three sites (F1, F2, O3). Inflorescences were bagged in the afternoon,
    with nectar collected the following day during the warmest hours (from 11.00 to
    14.00) to ensure maximum nectar production (Corbet et al., 1995). Nectar was
    collected from two flowers on each inflorescence using a 2 µl microcapillary tube
    (Drummond Microcaps, Broomall; Pa., USA), with nectar volume calculated by measuring
    capillary length of the column of liquid (Corbet, 2003) using a digital calliper. ^p
    To test for autogamy, in July 2017, inflorescences with newly-opened flowers and no
    observed pollinia deposited on stigma were covered with a fine, insect proof nylon
    bag until floral senescence (ca. four weeks). To test for self-compatibility, one
    flower on each inflorescence was manually pollinated with pollinia from a different
    flower on the same inflorescence before the pollinated flower was covered with a
    fine, insect proof nylon bag until senescence or fruit formation (ca. four weeks).
    Six individuals were randomly selected at each of the three largest populations (F4,
    F5 and F6) for each test, with one inflorescence selected per individual for a total
    of eighteen inflorescences tested. ^p We carried out observations along transects of
    100 m length for 10 sites (populations) in September 2016 and 14 sites in September
    2017 during D. brumalis flowering period. We recorded the occurrence of the native
    pollinator, Trichocolletes spp. (Colletidae) bees, and the introduced honeybee by
    observing all the flowering species of the understory vegetation along the transect
    and habitat type. Transects were centred on the same quadrats used to quantify
    pollination success of D. brumalis (see former paragraph). Observations along
    transects lasted 40 min for both species, spending approximately 3 min per flowering
    plant. Transects were repeated one week after the initial survey, following the same
    route.
  original_file: raw/trait_data.csv, compiled from
    Scaccabarozzi et al. (2018) and its Supplementary Data (Appendix S1, Tables S1-S9),
    and from Scaccabarozzi et al. (2024) Datafile S1 and Table 1.
  notes: Records of introduced honeybees on other Australian orchids
    compiled in Scaccabarozzi et al. (2024, Table 1) are included, with the study it
    cites as source, or Scaccabarozzi et al. (2024) for records first published there
    (photographs and personal observations). 
    Flower colour hue and chroma in the honeybee colour hexagon are calculated from the
    mean colour loci in Table S9. Table S6 also records petal projections as a platform
    for pollinators, the prominent part of the flower and anther exposure, which are not
    mapped to traits. Fruit set of bagged and hand self-pollinated flowers is kept in
    data.csv but not mapped, and is used to score breeding_system. The model plants
    context records whether Daviesia flowered in the quadrat (Daviesia flower count
    above zero).
