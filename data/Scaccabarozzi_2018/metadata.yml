- var_in: flower_perianth_symmetry
  unit_in: .na
  trait_name: flower_perianth_symmetry
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To test if Di. brumalis shows greater overlap in floral morphology with the
    candidate model species than the remainder of the plant community, a morphological
    evaluation of the floral traits of the dominant co-flowering plant species,
    including functional pollinators traits, was conducted at three forest sites (F1, F2
    and F3). Morphological evaluation was conducted on Di. brumalis and 20 co-flowering
    species from 11 families in accordance with the descriptions in Marchant et al.
    (1987). The traits included were corolla symmetry (zygomorphic, actinomorphic),
    corolla shape (rotate, papillionaceous, bilabiate, ligulate), flower width and
    length (in mm), flower orientation (pendant, upright, horizontal), plant height (in
    cm), petal projections as a platform for pollinators (presence or absence), anther
    position (exposed or not exposed) and inflorescence type (umbel, raceme, spike,
    panicle, solitary) (Table S6).
