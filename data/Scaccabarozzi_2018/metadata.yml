taxonomic_updates:
- find: Spiranthes sinensis
  replace: Spiranthes australis
  reason: Manual match. Coleman (1933) used Spiranthes sinensis for Victorian plants
    now treated as Spiranthes australis (2026-11-03)
  taxonomic_resolution: species
exclude_observations: .na
questions:
  question1: Table S6 codes flower orientation as pendant (p), upright (u) or horizontal
    (h), but several species (e.g. Acacia pulchella, Bossiaea aquifolium, Diuris brumalis)
    are coded "o". What orientation does "o" mean?
  question2: In Table S7 "Female Fitness" is the proportion of flowers setting fruit,
    while Scaccabarozzi et al. (2024) describe the same values as the proportion of
    flowers with at least one pollen massula on the stigma. Which is it?
  question3: You'll notice that I've also extracted "traits" you've sourced from the literature (references to other taxa where honeybees are a flower_visitor or possible pollinator). These are each linked to their original source and in the future I'll remove them if I add those studies as their own datasets.
