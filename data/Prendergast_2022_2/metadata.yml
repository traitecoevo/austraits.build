dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: date
  taxon_name: flower_species
  location_name: site
  description: Monthly surveys (Nov 2016-Feb 2017 and Oct 2017-Mar 2018) of native
    bee and honeybee visits to flowering plants across seven urban bushland remnants
    and seven residential gardens in southwest Western Australian to better understand
    plant-pollinator networks.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: Flower visitation was surveyed at fourteen sites in the region
    of Perth, Western Australia, in the southwest Western Australian (SWWA) biodiversity
    hotspot. Seven of these were bushland remnants - fragments of the original native
    vegetation that persisted on the Swan Coastal Plain; the other seven sites were
    residential gardens, chosen blindly from a pool of citizens offering to allow
    their property to be surveyed, on a first-to-offer basis. Each site was at least
    2 km from the closest other site to ensure independence, beyond the flight range
    of most bee species. ^p Sites were surveyed once a month between 1045-1345 h over
    the austral spring/summer, from November to February 2016/2017 and October to
    March 2017/2018 (140 individual surveys in total). Surveys were conducted over
    an approximately 100 x 100 m area of greenspace; for bushland remnants this encompassed
    part of the remnant native vegetation, while for residential gardens it comprised
    the front and back yard of the single property surveyed, and often road verges.
    For the entire three-hour duration, a single researcher (K. S. Prendergast) walked
    haphazardly between flowering patches, with a minimum of 5 min spent at each patch,
    recording the visitation of all native bees and honeybees to flowers. Patterns
    of visitation were constructed from visual observations, supplemented by specimens
    collected by targeted sweep-net collection to confirm taxonomic identity; due
    to the difficulty of identifying bees to species level from observation alone,
    individuals were assigned into functional taxonomic groups reflecting both field-identifiable
    characters and similarities in body size, flight behaviour, nesting and flower
    preferences (honeybees, Amegilla, Coelioxys, Euryglossinae, Exoneura, Homalictus,
    Hylaeinae, Lasioglossum, Leioproctus, Lipotriches, Megachile, Trichocolletes,
    Thyreus).
  original_file: raw/raw_format_as_single_csv.csv (bee taxon x flower species visitation
    matrices manually compiled from raw/Bee taxa-flowering plant visitation matrices.xlsx),
    filled/pivoted into data.csv by raw/Prendergast_2022_2_extra_R_code.R
  notes: Coordinates for residential garden sites are rounded to 2 decimal places
    (~1 km precision) to avoid identifying the private residential address; bushland
    remnant sites are given at full precision.
identifiers: .na
