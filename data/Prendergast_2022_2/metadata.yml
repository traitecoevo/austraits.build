traits:
- var_in: bee_taxon
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Native bees and the introduced honeybee (Apis mellifera) visiting flowers
    were recorded during monthly, three-hour surveys at each site. Due to the difficulty
    of species-level identification of bees on the wing, individuals were assigned
    to functional taxonomic groups reflecting field-identifiable body size, flight
    behaviour and taxonomy (honeybees, Amegilla, Coelioxys, Euryglossinae, Exoneura,
    Homalictus, Hylaeinae, Lasioglossum, Leioproctus, Lipotriches, Megachile, Trichocolletes,
    Thyreus), verified by targeted sweep-net collection of specimens.
