  collection_date: Date_combined
  taxon_name: Plant species
  trait_name: Trait definition
  value: PollinationVectorKnown
  location_name: Place
  description: The study investigated the pollination ecology of Aluta quadrata and other Pilbara plant species through pollinator observations and insect trapping to identify floral visitors, assess pollen transport, and better understand plant-pollinator interactions and mating systems.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Pollinator observations were conducted to document floral visitors and their potential role in the mating system of Aluta quadrata. Insects were also collected using blue and yellow vane traps. Pollen was subsequently removed from captured insects using glycerol jelly cubes, identified microscopically, and matched to local plant species where possible.
  original_file: in raw data folder
  notes: Two edits were made to the data file, to correct a plant name (Scaevola acacioides to Scaevola spinescens) and an insect name (Hyleoides sp. to Hylaeus sp.) after the data contributor's review. Also, the study site is on private land and the exact location cannot be disclosed; the closest town, Paraburdoo, is therefore given as the location.
