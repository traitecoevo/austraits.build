contexts:
- context_property: measurement temperature
  category: method_context
  var_in: leaf_temp
traits:
- var_in: Am_sat
  unit_in: nmol{CO2}/g/s
  trait_name: leaf_photosynthetic_rate_per_dry_mass_saturated
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Gas exchange measurements were made in situ on mature and fully expanded
    leaves of wild plants. Leaf gas exchange was typically measured between 09:00
    h and 13:00 h on attached and sun-facing leaves in the upper canopy. We measured
    steady-state light-saturated net CO2 assimilation rates (Asat) using portable
    photosynthesis systems (Li-6400; Licor, Lincoln, NE, USA). Cuvette conditions
    were 1000-2000 umol photons m-2 s-1 of photosynthetically active radiation (as
    needed to achieve light saturation, depending on the species and site), a reference
    line [CO2] of 400 ppm, relative humidity of 60-70%, and block temperature set
    at the prevailing ambient daytime temperature of each site (6-34 deg C, depending
    on site location). Asat was measured at the prevailing ambient temperature at
    each site.
- var_in: Rdarkm
  unit_in: nmol{CO2}/g/s
  trait_name: leaf_dark_respiration_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  leaf_temp: LfT_Rdark
  methods: Gas exchange measurements were made in situ on mature and fully expanded
    leaves of wild plants. Leaf gas exchange was typically measured between 09:00
    h and 13:00 h on attached and sun-facing leaves in the upper canopy. We measured
    steady-state light-saturated net CO2 assimilation rates (Asat) using portable
    photosynthesis systems (Li-6400; Licor, Lincoln, NE, USA). Cuvette conditions
    were 1000-2000 umol photons m-2 s-1 of photosynthetically active radiation (as
    needed to achieve light saturation, depending on the species and site), a reference
    line [CO2] of 400 ppm, relative humidity of 60-70%, and block temperature set
    at the prevailing ambient daytime temperature of each site (6-34 deg C, depending
    on site location). Asat was measured at the prevailing ambient temperature at
    each site. Immediately after measuring Asat, the cuvette light was turned off
    and dark respiration rates (Rdark) were taken after a 30-45 min dark acclimation
    period. Rdark was measured at the prevailing ambient temperature at each site
    to reflect the rate of respiration that controlled sampled leaf NSC concentrations.
- var_in: LMA
  unit_in: g/m2
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag, and stored in a cool dark location until the measurement of leaf area. Leaves
    were scanned on a 600 dots/inch flatbed top-illumination optical scanner to quantify
    leaf area using ImageJ software. Scanned leaves were dried at 70 deg C for a minimum
    of 72 h and weighed for dry mass. Leaf mass per area was calculated as the ratio
    of leaf dry mass to leaf area.
- var_in: LeafNm
  unit_in: mg/g
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. For a majority of sites, leaf N concentration was determined using Kjeldahl
    acid digests (Allen et al., 1974) analyzed on a LaChat QuikChem 8500 Series 2
    Flow Injection Analysis System (Lachat Instruments, Milwaukee, WI, USA). Where
    only leaf [N] was determined (15 of 382 samples), ground samples were combusted
    using a Carlo-Erba elemental analyzer NA1500 (Thermo Fisher Scientific, Milan,
    Italy); these samples were excluded from analyses requiring both N and P.
- var_in: LeafPm
  unit_in: mg/g
  trait_name: leaf_P_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. For a majority of sites, leaf P concentration was determined using Kjeldahl
    acid digests (Allen et al., 1974) analyzed on a LaChat QuikChem 8500 Series 2
    Flow Injection Analysis System (Lachat Instruments, Milwaukee, WI, USA).
- var_in: Totalsugars_m
  unit_in: mg/g
  trait_name: leaf_soluble_sugars_per_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. Dried samples of whole leaves were ground in a mill and analyzed for concentrations
    of soluble sugars (glucose + sucrose + fructose). Soluble sugars were extracted
    in hot ethanol - 5 mg of ground plant material and 500 ul of 80% (v/v) ethanol
    were mixed by vortex in an Eppendorf tube, incubated at 80 deg C for 20 min while
    vortex mixing every 10 min, then centrifuged at 20000 g for 5 min to separate
    and collect the supernatant; this process was repeated twice more using 500 ul
    of 80% (v/v) ethanol and the collected supernatant combined. The supernatant was
    used to quantify soluble sugar concentrations (glucose, sucrose, fructose) with
    a Fructose Assay Kit (Sigma-Aldrich, Darmstadt, Germany) - for glucose, extracts
    were incubated with hexokinase and glucose-6-phosphate dehydrogenase and the reduction
    of NADP to NADPH followed spectrophotometrically at 340 nm; for fructose, extracts
    were incubated with hexokinase, phosphoglucose isomerase and glucose-6-phosphate
    dehydrogenase and the glucose concentration subtracted; for sucrose, extracts
    were incubated with invertase to quantify sucrose plus glucose and the glucose
    concentration subtracted. Measurements were collected using a micro-titer plate
    reader (Infinite M1000 Pro; Tecan, Zurich, Switzerland).
- var_in: Starch_m
  unit_in: mg/g
  trait_name: leaf_soluble_starch_per_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. Dried, ground leaf samples were extracted in hot ethanol (as for soluble
    sugars) and the resultant pellet was used to quantify starch concentration with
    a Total Starch Assay Kit (Megazyme, Bray, Ireland).
- var_in: TNC_m
  unit_in: mg/g
  trait_name: leaf_total_non-structural_carbohydrates_per_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. Total non-structural carbohydrate (NSC) concentration was calculated as the
    sum of soluble sugars (glucose + sucrose + fructose) and starch concentrations,
    expressed as glucose equivalent. All samples were prepared and analyzed within
    the same laboratory (Quentin et al., 2015; Landhausser et al., 2018).
- var_in: Glucose_m
  unit_in: mg/g
  trait_name: leaf_glucose_per_leaf_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. Dried samples of whole leaves were ground in a mill and analyzed for glucose
    concentration (see leaf_soluble_sugars_per_mass methods) - extracts were incubated
    with hexokinase and glucose-6-phosphate dehydrogenase to enable the reduction
    of NADP to NADPH, which was then followed spectrophotometrically at 340 nm (Dynatech
    Laboratories MRX, Guernsey, UK).
- var_in: Fructose_m
  unit_in: mg/g
  trait_name: leaf_fructose_per_leaf_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. Dried samples of whole leaves were ground in a mill and analyzed for fructose
    concentration (see leaf_soluble_sugars_per_mass methods) - extracts were incubated
    with hexokinase, phosphoglucose isomerase and glucose-6-phosphate dehydrogenase,
    the resultant reduction of NADP to NADPH was followed (Scholes et al., 1994) and
    the glucose concentration was subtracted.
- var_in: Sucrose_m
  unit_in: mg/g
  trait_name: leaf_sucrose_per_leaf_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. Dried samples of whole leaves were ground in a mill and analyzed for sucrose
    concentration (see leaf_soluble_sugars_per_mass methods) - extracts were incubated
    with invertase (Sigma, St Louis, MO, USA) to quantify the concentration of sucrose
    plus glucose, and the glucose concentration was subtracted.
- var_in: Vcmax_a_LfT
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_photosynthesis_Vcmax_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Gas exchange measurements were made in situ on mature and fully expanded
    leaves of wild plants. Leaf gas exchange was typically measured between 09:00
    h and 13:00 h on attached and sun-facing leaves in the upper canopy. Vcmax (maximum
    carboxylation rate) was estimated from the light-saturated net CO2 assimilation
    rate at a standardised intercellular CO2 concentration of 250 ppm, calculated
    at the prevailing leaf temperature at which Asat and Rdark were measured (see
    leaf_photosynthetic_rate_per_dry_mass_saturated methods).
- var_in: Vcmax_a_25
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_photosynthesis_Vcmax_per_area_25C
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Gas exchange measurements were made in situ on mature and fully expanded
    leaves of wild plants. Leaf gas exchange was typically measured between 09:00
    h and 13:00 h on attached and sun-facing leaves in the upper canopy. Vcmax (maximum
    carboxylation rate) was estimated from the light-saturated net CO2 assimilation
    rate at a standardised intercellular CO2 concentration of 250 ppm, then temperature-standardised
    to 25 deg C using a fixed Q10 relationship.
- var_in: Vcmax_m_LfT
  unit_in: nmol{CO2}/g/s
  trait_name: leaf_photosynthesis_Vcmax_per_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Gas exchange measurements were made in situ on mature and fully expanded
    leaves of wild plants. Leaf gas exchange was typically measured between 09:00
    h and 13:00 h on attached and sun-facing leaves in the upper canopy. Vcmax (maximum
    carboxylation rate) was estimated from the light-saturated net CO2 assimilation
    rate at a standardised intercellular CO2 concentration of 250 ppm, calculated
    at the prevailing leaf temperature at which Asat and Rdark were measured (see
    leaf_photosynthetic_rate_per_dry_mass_saturated methods).
- var_in: Aa_sat
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_photosynthetic_rate_per_area_saturated
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Gas exchange measurements were made in situ on mature and fully expanded
    leaves of wild plants. Leaf gas exchange was typically measured between 09:00
    h and 13:00 h on attached and sun-facing leaves in the upper canopy. We measured
    steady-state light-saturated net CO2 assimilation rates (Asat) using portable
    photosynthesis systems (Li-6400; Licor, Lincoln, NE, USA). Cuvette conditions
    were 1000-2000 umol photons m-2 s-1 of photosynthetically active radiation (as
    needed to achieve light saturation, depending on the species and site), a reference
    line [CO2] of 400 ppm, relative humidity of 60-70%, and block temperature set
    at the prevailing ambient daytime temperature of each site (6-34 deg C, depending
    on site location). Asat was measured at the prevailing ambient temperature at
    each site.
- var_in: Rdarka
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_dark_respiration_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  leaf_temp: LfT_Rdark
  methods: Immediately after measuring Asat, the cuvette light was turned off and
    dark respiration rates (Rdark) were taken after a 30-45 min dark acclimation period.
    Rdark was measured at the prevailing ambient temperature at each site to reflect
    the rate of respiration that controlled sampled leaf NSC concentrations.
- var_in: Ci_sat
  unit_in: umol{CO2}/mol
  trait_name: leaf_intercellular_CO2_concentration_at_Asat
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Internal (intercellular) CO2 concentration was recorded concurrently with
    the steady-state light-saturated net CO2 assimilation rate (Asat) measurement,
    using the same portable photosynthesis system (Li-6400; Licor, Lincoln, NE, USA)
    under the same cuvette conditions (see leaf_photosynthetic_rate_per_area_saturated
    methods).
- var_in: AN_sat
  unit_in: umol{CO2}/g{N}/s
  trait_name: leaf_photosynthetic_nitrogen_use_efficiency_saturated
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Photosynthetic nitrogen use efficiency was calculated as the ratio of the
    steady-state light-saturated net CO2 assimilation rate (Asat) to leaf nitrogen
    concentration on a leaf dry mass basis (see leaf_photosynthetic_rate_per_area_saturated
    and leaf_N_per_dry_mass methods).
- var_in: AP_sat
  unit_in: umol{CO2}/g{P}/s
  trait_name: leaf_photosynthetic_phosphorus_use_efficiency_saturated
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Photosynthetic phosphorus use efficiency was calculated as the ratio of
    the steady-state light-saturated net CO2 assimilation rate (Asat) to leaf phosphorus
    concentration on a leaf dry mass basis (see leaf_photosynthetic_rate_per_area_saturated
    and leaf_P_per_dry_mass methods).
- var_in: gs_sat
  unit_in: mol{H2O}/m2/s
  trait_name: leaf_stomatal_conductance_per_area_at_Asat
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Stomatal conductance was recorded concurrently with the steady-state light-saturated
    net CO2 assimilation rate (Asat) measurement, using the same portable photosynthesis
    system (Li-6400; Licor, Lincoln, NE, USA) under the same cuvette conditions (see
    leaf_photosynthetic_rate_per_area_saturated methods).
- var_in: LeafNa
  unit_in: g/m2
  trait_name: leaf_N_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. For a majority of sites, leaf N concentration was determined using Kjeldahl
    acid digests (Allen et al., 1974) analyzed on a LaChat QuikChem 8500 Series 2
    Flow Injection Analysis System (Lachat Instruments, Milwaukee, WI, USA). Where
    only leaf [N] was determined (15 of 382 samples), ground samples were combusted
    using a Carlo-Erba elemental analyzer NA1500 (Thermo Fisher Scientific, Milan,
    Italy); these samples were excluded from analyses requiring both N and P.
- var_in: LeafPa
  unit_in: g/m2
  trait_name: leaf_P_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaves used for gas exchange measurements and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag. For a majority of sites, leaf P concentration was determined using Kjeldahl
    acid digests (Allen et al., 1974) analyzed on a LaChat QuikChem 8500 Series 2
    Flow Injection Analysis System (Lachat Instruments, Milwaukee, WI, USA).
- var_in: N:P
  unit_in: g/g
  trait_name: leaf_NP_ratio
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Calculated as the ratio of leaf N to leaf P concentration, both on a leaf
    dry mass basis (see leaf_N_per_dry_mass and leaf_P_per_dry_mass methods).
