dataset:
  data_is_long_format: no
  custom_R_code: '
     data %>% 
      filter(stringr::str_starts(Country, "Australia")) %>%
      mutate(
        Date = util_parse_collection_date(Date),
        across(c(LeafPm, Fructose_m, Sucrose_m, AP_sat, LeafPa, `N:P`), ~ifelse(is.nan(.x), NA, .x)),
        duplicate_site = Site %in% c("CTC1"), 
        partial_duplicate_site = Site %in% c("RobCk-TERN", "Warra-TERN-AW", "Warra-TERN-SV", "Warra-TERN_FT"), 
        across(c(Am_sat, Aa_sat, gs_sat, Rdarkm, Rdarka, Ci_sat, AN_sat, AP_sat, LMA, LeafNm, LeafNa, LeafPm, LeafPa, `N:P`, Vcmax_a_LfT, Vcmax_a_25, Vcmax_m_LfT),
            ~ifelse(duplicate_site | partial_duplicate_site, NA, .x)),
        across(c(Totalsugars_m, Starch_m, TNC_m),
            ~ifelse(duplicate_site, NA, .x))
      ) %>% 
      select(-duplicate_site, -partial_duplicate_site)
    '
  collection_date: Date
  taxon_name: Species_1
  location_name: Site
  individual_id: .na
  description: To test whether leaf nonstructural carbohydrate (NSC) concentrations
    and/or NSC residence time correlate with leaf economic spectrum traits (specific
    leaf area, leaf N and P concentration, light-saturated photosynthesis and dark
    respiration) across woody plant species spanning a broad range of biomes.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'Sites and sampling ^p Data were collected from 19 sites across
    five biomes (Table S1) spanning 68.63 deg to -43.42 deg in latitude, and included
    382 mature leaf samples belonging to 114 species (Table S2). Sample sites varied
    in climate, with mean annual temperatures (MAT) ranging from -11.3 deg C to +25.2
    deg C and mean annual precipitation (MAP) ranging from 225 to 4330 mm (Fig. S1).
    Site climate was characterized by 24 bioclimatic variables taken from WorldClim
    (Fick & Hijmans, 2017), aridity index (AI; annual potential evapotranspiration
    divided by annual precipitation), longitude, and latitude (Notes S2). Climatic
    variation among the sites was represented by two principal components that explained
    78% of the total variance. The first component included variables including annual
    temperature range, precipitation of wettest quarter, and MAT, while the second
    component represented maximum temperature of warmest month, mean annual potential
    evaporation, and precipitation of the coldest quarter. ^p Measurements were made
    during the summer at each site, or during generally optimal periods (recent rainfall)
    in seasonal sites. At most sites (13 of the 19), measurements were made on a single
    mature leaf from multiple replicate plants per species (n = 3-4) (see Table S1
    for details). Each replicate was analyzed for NSC concentrations, along with other
    LES traits such as SLA, [N], and gas exchange variables. In the remaining six
    sites (DR, FJG-3, TFL, SP-A, SP-M, and AT-M), we pooled the replicate plants from
    each species for analysis of leaf N, P, and NSC concentrations because the leaves
    were too small to analyze individually. For these six sites, leaf-level values
    of the measured parameters were therefore averaged into species means (in a total
    of 43 species). ^p Physiological measurements ^p Gas exchange measurements were
    made in situ on mature and fully expanded leaves of wild plants. Leaf gas exchange
    was typically measured between 09:00 h and 13:00 h on attached and sun-facing
    leaves in the upper canopy. We measured steady-state light-saturated net CO2 assimilation
    rates (Asat) using portable photosynthesis systems (Li-6400; Licor, Lincoln, NE,
    USA). Cuvette conditions were 1000-2000 umol photons m-2 s-1 of photosynthetically
    active radiation (as needed to achieve light saturation, depending on the species
    and site), a reference line [CO2] of 400 ppm, relative humidity of 60-70%, and
    block temperature set at the prevailing ambient daytime temperature of each site
    (6-34 deg C, depending on site location). Immediately after measuring Asat, the
    cuvette light was turned off and dark respiration rates (Rdark) were taken after
    a 30-45 min dark acclimation period. Both Asat and Rdark were measured at the
    prevailing ambient temperature at each site to reflect the rates of photosynthesis
    and respiration that controlled sampled leaf NSC concentrations. ^p On completion
    of each set of Asat and Rdark measurements, these and adjacent leaves were harvested
    typically between mid-morning to mid-afternoon, placed in a moistened plastic
    bag, and stored in a cool dark location until the measurement of leaf area. Scanned
    leaves were scanned on a 600 dots/inch flatbed top-illumination optical scanner
    to quantify leaf area using IMAGEJ software (http://imagej.nih.gov/ij/). Scanned
    leaves were dried at 70 deg C for a minimum of 72 h and dried for mass. Specific
    leaf area (SLA, m2 kg-1) was then calculated. Most leaves were stored in darkness
    for 1-5 h between gas exchange measurements and commencement of oven drying for
    subsequent analysis. For a majority of sites, both leaf N and P concentrations
    were determined using Kjeldahl acid digests (Allen et al., 1974) that were analyzed
    using a LaChat QuikChem 8500 Series 2 Flow Injection Analysis System (Lachat Instruments,
    Milwaukee, WI, USA). Where only leaf [N] was determined (15 out of 382 samples),
    ground samples (31-700 Hammer Mill; Glen Creston, Stanmore, UK) were combusted
    using a Carlo-Erba elemental analyzer NA1500 (Thermo Fisher Scientific, Milan,
    Italy). These leaves were excluded from data analysis that required both N and
    P concentrations. ^p Dried samples of whole leaves were ground in a mill and analyzed
    for concentrations of soluble sugars (glucose + sucrose + fructose), starch, and
    total NSCs (soluble + starch, in mg glucose equivalent). Soluble sugars were extracted
    in hot ethanol: 5 mg of ground plant material and 500 ul of 80% (v/v) ethanol
    were mixed by vortex in an Eppendorf tube, incubated at 80 deg C for 20 min while
    vortex mixing every 10 min, then centrifuged at 20000 g for 5 min to separate
    and collect the supernatant. This process was repeated twice more using 500 ul
    of 80% (v/v) ethanol, and the collected supernatant was combined. The resultant
    pellet was used to quantify starch concentration with a Total Starch Assay Kit
    (Megazyme, Bray, Ireland). The supernatant was used to quantify soluble sugar
    concentrations (glucose, sucrose, fructose) with a Fructose Assay Kit (Sigma-Aldrich,
    Darmstadt, Germany). For glucose, extracts were incubated with hexokinase and
    glucose-6-phosphate dehydrogenase to enable the reduction of NADP to NADPH, which
    was then followed spectrophotometrically at 340 nm (Dynatech Laboratories MRX,
    Guernsey, UK). For fructose, extracts were incubated with hexokinase, phosphoglucose
    isomerase, and glucose-6-phosphate dehydrogenase, the resultant reduction of NADP
    to NADPH was followed (Scholes et al., 1994) and the glucose concentration was
    subtracted. For sucrose, extracts were incubated with invertase (Sigma, St Louis,
    MO, USA) to quantify the concentration of sucrose plus glucose, and glucose concentration
    was subtracted. Measurements were collected using a micro-titer plate reader (Infinite
    M1000 Pro; Tecan, Zurich, Switzerland). Total NSC concentrations represent the
    combined concentrations of soluble sugars and starch. All samples were prepared
    and analyzed within the same laboratory (Quentin et al., 2015; Landhausser et
    al., 2018).'
  original_file: data file download from link in manuscript, https://datacommons.anu.edu.au/DataCommons/item/anudc:6352
  notes: custom_R_code restricts the dataset to the Australian sites only (Country
    starting with "Australia") and blanks out specific trait columns that are already
    published in AusTraits under a different dataset_id; overlap identified by Claude
    AI is documented in a file in the raw data folder (Asao_2024_identifying_duplicate_data.csv).
    The site CTC1 (Daintree Rainforest Observatory) duplicates Weerasinghe_2014, including
    its NSC traits, so all trait columns are set to NA there. The sites RobCk-TERN
    (Robson Creek) and the three Warra-TERN plots duplicate Bloomfield_2018's "FNQ,
    Robson" and "Warra" sites, but Bloomfield_2018 has no sugar/starch/NSC data, so
    the NSC columns (Totalsugars_m, Starch_m, TNC_m) are incorporated as part of this
    dataset. The sites KBL3, KCR and ANBG are not represented in any other AusTraits
    dataset and are kept in full. Am_sat and Rdarkm are reported "at prevailing temperature"
    (i.e. not standardized to a common reference temperature). Raw columns not mapped
    in but with a plausible future AusTraits trait - Totalsugars_a, Starch_a, TNC_a,
    Glucose_a, Fructose_a, Sucrose_a (currently only mass-based versions of these
    metrics mapped).
