- var_in: root/shoot.mas
  unit_in: mg{root}/mg{shoot}
  trait_name: root_shoot_ratio
  entity_type: population
  value_type: mean
  basis_of_value: model_derived
  replicates: replicates
  methods: In the preliminary planting, we harvested roots at Toolangi and Hattah
    61-62 weeks after planting. We excavated roots as completely as possible, cut
    them at branching points, measured proximal and distal diameters, dried and weighed
    them. When root segments had distal diameters larger than proximal diameters of
    other segments, we assumed breakage and estimated the missing mass from the allometry
    of mass vs proximal diameter in other segments, working from smallest to largest
    until all roots were complete. For the main planting we harvested roots of all
    focal individuals. We measured all distal diameters and used the preliminary allometry
    to predict missing masses. We used the Hattah allometry for Hattah and Bealiba
    plants, and the Toolangi allometry for Mt. Disappointment and Toolangi plants.
- var_in: lvs/shoot.mass
  unit_in: g/g
  trait_name: leaf_mass_to_stem_mass_ratio
  entity_type: population
  value_type: mean
  basis_of_value: model_derived
  replicates: replicates
  methods: After measuring other traits on the focal plants (see below), we harvested
    them, cutting below the lignotuber if present. For the first harvest, we bagged
    entire plant tops, transported these to the lab to separate leaf, stem, and lignotuber
    tissue, collected a trunk tissue sample to determine wood density, and weighed
    all material after drying at 70 degrees C. For the remaining harvests, we used
    an allometric approach, estimating branch masses from their basal diameters and
    measuring bole mass and stem, bark, and wood densities of branches and trunks.
- var_in: basal.area
  unit_in: mm2
  trait_name: .na
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: We censused and harvested plants from each garden three times, at 37–117
    weeks after planting. We conducted each harvest as synchronously as possible (5–15
    weeks) across gardens. We tallied all plants as alive or dead, and measured heights
    of the live plants. For the first harvest, we studied plants in the first ennead
    rows; the second ennead rows in the second harvest, and so on. We selected 7–8
    focal plants per species stratified by height across the range in that species
    and recorded the number and basal diameter(s) of their basal shoots. After the
    first and second harvests, all unselected plants in the study rows were culled
    to provide more space for the remaining plants. Survival was also tallied on 3–5
    additional dates outside the harvest campaigns (Fig. S12). ^p After measuring
    other traits on the focal plants, we harvested them, cutting below the lignotuber
    if present. For the first harvest, we bagged entire plant tops, transported these
    to the lab to separate leaf, stem, and lignotuber tissue, collected a trunk tissue
    sample to determine wood density, and weighed all material after drying at 70
    °C. For the remaining harvests, we used an allometric approach, estimating branch
    masses from their basal diameters and measuring bole mass and stem, bark, and
    wood densities of branches and trunks. We also estimated root mass at the time
    of the first harvest using excavation and allometry.
