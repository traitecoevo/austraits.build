- var_in: conduit.dens
  unit_in: '{count}/mm2'
  trait_name: stem_vessel_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Kstem and xylem anatomy ^p During October-December 2019 (68-73 weeks after
    planting), we placed one branch from each of five individuals per species per
    site in a moistened plastic bag and transported them to the lab. From each branch
    we excised an 11-cm segment, infiltrated this under partial vacuum in distilled
    water overnight to remove emboli, trimmed the ends with a razor blade and connected
    to a flow meter filled with 20 mM KCl solution filtered to 0.2 um to measure at
    least three steady-state flow rates at two or more pressures between ca. 0.4 and
    4.9 kPa. Stem hydraulic conductivity (Kstem) is the slope of the regression of
    flow rate (g s-1) vs pressure gradient (MPa mm-1), which we then standardized
    to 20 degrees C and divided by cross-sectional xylem area (XA) or leaf area. Kstem
    is not completely standardized by XA, so variation in xylem area can bias results.
    To avoid this, we scaled Kstem to the median xylem area using the regression ln(Kstem/XA)
    ~ ln(XA) + site for each species where site is a factor. We dried stems and then
    later rehydrated them and obtained sections with a sliding microtome. We stained
    the sections with toluidine blue to measure conduit density and hydraulically
    weighted conduit diameter, Dh = (1/n * sum(Di^4))^(1/4), where Di is the individual
    vessel diameter. From these measurements, we calculated the stem theoretical conductivity,
    Kstem,theo, using Poiseuille''s Law and assuming no embolisms.
- var_in: conduit.HWD
  unit_in: um
  trait_name: stem_vessel_diameter_hydraulic
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Kstem and xylem anatomy ^p During October-December 2019 (68-73 weeks after
    planting), we placed one branch from each of five individuals per species per
    site in a moistened plastic bag and transported them to the lab. From each branch
