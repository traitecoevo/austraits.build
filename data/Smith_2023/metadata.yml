- var_in: Kstem/lvs.a
  unit_in: g/mm/MPa/s
  trait_name: leaf_specific_hydraulic_conductivity
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: During October–December 2019 (68–73 weeks after planting), we placed one
    branch from each of five individuals per species per site in a moistened plastic
    bag and transported them to the lab. From each branch we excised an 11-cm segment,
    infiltrated this under partial vacuum in distilled water overnight to remove emboli,
    trimmed the ends with a razor blade and connected to a flow meter73 filled with
    20 mM KCl solution filtered to 0.2 µm to measure at least three steady-state flow
    rates at two or more pressures between ca. 0.4 and 4.9 kPa. Stem hydraulic conductivity
    (Kstem) is the slope of the regression of flow rate (g s−1) vs pressure gradient
    (MPa mm−1), which we then standardized to 20 °C and divided by cross-sectional
    xylem area (XA) or leaf area. Kstem is not completely standardized by XA74, so
    variation in xylem area can bias results. To avoid this, we scaled Kstem to the
    median xylem area using the regression ln (Kstem/XA) ∼ ln (XA) + site for each
    species where site is a factor. ^p We dried stems and then later rehydrated them
    and obtained sections with a sliding microtome. We stained the sections with toluidine
    blue to measure conduit density and hydraulically weighted conduit diameter, where
    Di is the individual vessel diameter. From these measurements, we calculated the
    stem theoretical conductivity, Kstem,theo, using Poiseuille’s Law and assuming
    no embolisms.
