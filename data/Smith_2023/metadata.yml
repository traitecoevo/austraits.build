- var_in: cuticle.thick
  unit_in: um
  trait_name: leaf_cuticle_thickness
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf area, thickness, SLA, stomatal size and pore length, epidermal cell
    sizes, VLA, and spectral properties were measured on the youngest mature leaf
    from each focal individual. We cleared dried leaves and then determined VLA in
    2 mm2 areas, and stomatal and epidermal dimensions from 4 to 5 cells or cell pairs.
    We determined cuticle thickness and the ratio of intervein distance to vein distance
    to epidermis (dx/dy) from leaf punches fixed in alcohol, embedded in LR White,
    sectioned to 5 µm thickness with a rotary microtome, and stained with Safranin
    O for microscopic measurement. All image analyses were performed in ImageJ v1.53k.
