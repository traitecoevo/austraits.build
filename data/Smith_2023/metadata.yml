traits:
- var_in: leaf.A/area
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_photosynthetic_rate_per_area_saturated
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: During the first two harvests, we measured Aarea, Amass, and gs until they
    stabilized on one fully expanded leaf on each focal plant using an LI-6400XT system
    (LI-COR, Lincoln, NE). Most data were gathered between 09:00 and 13:00 when conditions
    were conducive to photosynthesis. Measurements were made at 400 ppm CO2, 1700
    umol m-2 s-1 PAR, and ambient humidity except when scrubbing was needed to avoid
    high-humidity problems. We set the block temperature to 25 degrees C if leaf temperature
    exceeded this.
