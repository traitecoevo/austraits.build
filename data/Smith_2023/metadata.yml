- var_in: TLP
  unit_in: MPa
  trait_name: leaf_turgor_loss_point
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: We collected leaves from seven plants per species x site combination during
    the third harvest (July-November 2020) and March-April 2021. We used the osmometry
    method, employing 12 chamber psychrometers (75-3VC, JRD Merrill, Logan UT). We
    calibrated chambers before the experiment using two salt-solution standards and
    temperature-corrected water potential calculations.
- var_in: leaf.P.pd
  unit_in: MPa
  trait_name: water_potential_predawn
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: During the first harvest (March-April 2019) we used a pressure chamber
    to measure predawn water potential on five of the focal plants per species. For
    midday water potential, we measured psi_leaf during kleaf measurements (see above).
    COVID-19 lockdowns, equipment theft, and the time and expense of making repeated
    visits along a 430-km study transect made it difficult to characterize psi_leaf
    more frequently.
- var_in: leaf.P.md2
  unit_in: MPa
  trait_name: water_potential_midday
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: During the first harvest (March-April 2019) we used a pressure chamber
    to measure predawn water potential on five of the focal plants per species. For
    midday water potential, we measured psi_leaf during kleaf measurements (see above).
    COVID-19 lockdowns, equipment theft, and the time and expense of making repeated
    visits along a 430-km study transect made it difficult to characterize psi_leaf
    more frequently. Midday psi_leaf was measured on the unbagged leaf during the
    kleaf measurement.
- var_in: kleaf
  unit_in: mmol/m2/MPa/s
  trait_name: leaf_specific_hydraulic_conductance
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: We measured leaf hydraulic conductance on one leaf per plant from five
    focal plants during the first harvest (March-April 2019), using the in vivo method.
    We calculated kleaf as T/(psi_stem - psi_leaf), where T is transpiration determined
    with an LI-6400XT system and psi_stem - psi_leaf is the xylem pressure difference
    between adjacent bagged and unbagged leaves, determined using a pressure chamber
    (PMS, Albany OR). We excluded kleaf measurements when the pressure difference
    was small (<ca. 0.3 MPa) as this likely reflected continued transpiration by the
    bagged leaf or a low unbagged transpiration rate.
- var_in: gmin
  unit_in: mmol{H2O}/m2/s
  trait_name: leaf_cuticular_conductance
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: To measure minimum leaf conductance (gmin), we bagged five shoots per site
    x species and transported them under refrigeration to the lab during the third
    harvest. We rehydrated one excised leaf per shoot in distilled water overnight,
    measured its area, and hung it in a dark chamber over a saturated NaCl + sucrose
    solution used to control humidity, using fans to reduce boundary-layer resistance.
    We weighed leaves every ca. 2 h and measured the fluorescence ratio Fv/Fm with
    a Mini PAM II (Walz, Effeltrich, Germany) every other weighing. Leaf mass typically
    declined rapidly and then more slowly and quasi-linearly as conductance reached
    or approached its minimum. We calculated conductance between each weighing using
    masses, humidity, temperature recorded in the chamber, and elevation-corrected
    barometric pressure from a nearby weather station. We recorded gmin as the average
    of sequential points in the quasi-linear phase with the lowest conductance and
    Fv/Fm above 0.7. Chamber darkness was not well controlled when measuring samples
    from Hattah so measurements were repeated one year later using the same cohort
    of plants and the same sample size.
