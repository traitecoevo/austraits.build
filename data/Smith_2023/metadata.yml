questions:
  question1: Can you confirm that I have correctly mapped the following traits, 1)
    ci.adax to the AusTraits trait leaf_chlorophyll_index_modified_ND705, measured
    on the adaxial leaf surface; 2) ndvi.adax to modified_NDVI, measured on the adaxial
    leaf surface; 3) sPRI to leaf_photochemical_reflectance_index (your values are much higher than others in AusTraits)
  question2: Do your gas exchange measurements map better to "saturated" or "maximum" conditions?
  question3: I've mapped your trait Kstem/lvs.a maps to the AusTraits trait `leaf_specific_hydraulic_conductivity`. The unit conversion I've applied is
    g/mm/MPa/s [your units]-> 0.1 * 10^4.kg/m/MPa/s [AusTraits units]. Does this look appropriate? The numbers make sense, looking at all the data for your plots, but as units for the various conductance measurements can be difficult to align and I want to make sure I've interpreted your accurately.
