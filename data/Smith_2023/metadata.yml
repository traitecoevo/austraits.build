  unit_in: cm
  trait_name: .na
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: plant_height, not mapped because not a population maximum; We censused
    and harvested plants from each garden three times, at 37-117 weeks after planting.
    We conducted each harvest as synchronously as possible (5-15 weeks) across gardens.
    We tallied all plants as alive or dead, and measured heights of the live plants.
