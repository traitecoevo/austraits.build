- var_in: refl.adax
  unit_in: umol/umol
  trait_name: leaf_reflectance
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf area, thickness, SLA, stomatal size and pore length, epidermal cell
    sizes, VLA, and spectral properties were measured on the youngest mature leaf
    from each focal individual. We measured spectral reflectances in the field using
    a UniSpec spectral analysis system (PP Systems, Amesbury MA) and then used these
    to calculate the normalized difference vegetation index (NDVI), water band index
    (WBI, a measure of water content), photochemical reflectance index (sPRI, a measure
    of plant stress reflected in the xanthophyll-zeaxanthin cycle), chlorophyll index
    (CI), and total reflectance across the visible spectrum.
