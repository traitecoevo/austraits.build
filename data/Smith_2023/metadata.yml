- var_in: den.xyl.trnk
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: After measuring other traits on the focal plants, we harvested them, cutting
    below the lignotuber if present. For the first harvest, we bagged entire plant
    tops, transported these to the lab to separate leaf, stem, and lignotuber tissue,
    collected a trunk tissue sample to determine wood density, and weighed all material
    after drying at 70 degrees C. For the remaining harvests, we used an allometric
    approach, estimating branch masses from their basal diameters and measuring bole
    mass and stem, bark, and wood densities of branches and trunks.
- var_in: den.brk.trunk
  unit_in: g/cm3
  trait_name: bark_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: After measuring other traits on the focal plants, we harvested them, cutting
    below the lignotuber if present. For the first harvest, we bagged entire plant
    tops, transported these to the lab to separate leaf, stem, and lignotuber tissue,
    collected a trunk tissue sample to determine wood density, and weighed all material
