dataset:
  data_is_long_format: yes
  custom_R_code: '
   data %>%
    filter(!trait %in% c("lvs/root.mass", "shoot.m/height", "brk/stm.a.tk", "lvs/basal.area", "lvs.a/stem.m", "rgr.height.plntg", "rgr.shoot.plntg", "survival"))|>
    mutate(
      taxon_name = paste(genus, species),
      raw = suppressWarnings(dplyr::case_when(
        trans == "log" ~ mult * exp(umean),
        trans == "sqrt" ~ mult * umean^2, 
        trans == "exp" ~ mult * log(umean), 
        TRUE ~ umean )),
      value = raw
      )
    '
  collection_date: 2018/2021
  taxon_name: taxon_name
  trait_name: trait
  value: value
  location_name: site
  description: To test optimality-model predictions for how photosynthetic, hydraulic
    and allocational trait-environment relationships, and adaptive cross-over in
    growth, shape the distributions of closely related Eucalyptus species along
    a climatic moisture gradient.
  basis_of_record: captive_cultivated
  life_stage: unknown
  sampling_strategy: Species selection and climatic distribution ^p We selected five
    species each from Eucalyptus subg. Eucalyptus and subg. Symphyomyrtus, stratified
    by the portions of the Victorian P/Ep gradient they dominate, from mallee to eucalypt
    woodland, eucalypt forest, tall wet sclerophyll forest, and temperate rainforest.
    Eucalyptus dominates most of this region, where its species are evergreen and
    shade-intolerant, rainfall is essentially aseasonal, and latitude spans only 3
    degrees. ^p Common gardens ^p We established common gardens in Victorian state
    forests at Hattah, Bealiba, Mt. Disappointment, and Toolangi, spanning an eightfold
    range in P/Ep from 0.16 to 1.25 (Fig. 1, Table S2). Gardens were 0.25-ha upland
    plots in recently logged or previously cleared land, unshaded by surrounding vegetation,
    and fenced to exclude herbivores such as kangaroos, wallabies, wombats, and rabbits.
    The ground was covered with landscaping cloth (Permathene, Campbelltown NSW) to
    control weeds. At each site, we installed a GWRS100 weather station (Campbell
    Scientific, Logan UT) with sensors to log temperature, humidity, windspeed, rainfall,
    and volumetric water content. Seeds for each species from 1 to 3 collections within
    native ranges were mixed, germinated, raised in soilless medium by Australian
    Native Farm Forestry (Cobram East, VIC), and planted in June 2018. We planted
    81-254 individuals per species at each garden, based on variation in germination
    and survival. We divided seedlings for each species into enneads (3 x 3 arrays,
    with plants 50 cm apart), and planted these arrays randomly across three blocks,
    each 702-756 seedlings in all. ^p Survival, height, biomass ^p We censused and
    harvested plants from each garden three times, at 37-117 weeks after planting.
    We conducted each harvest as synchronously as possible (5-15 weeks) across gardens.
    We tallied all plants as alive or dead, and measured heights of the live plants.
    For the first harvest, we studied plants in the first ennead rows; the second
    ennead rows in the second harvest, and so on. We selected 7-8 focal plants per
    species stratified by height across the range in that species and recorded the
    number and basal diameter(s) of their basal shoots.
  original_file: downloaded data_trait means.csv; data_Fig 2,3,4,S2,S3,S4.csv
  notes: trait data were reverse transformed to raw values after referencing Zenodo
    analysis scripts (doi.org/10.5281/zenodo.8277056, raw/8277056/Fig 3,S2,S4.R).
    Additional trait data not yet in AusTraits, including survival and the two relative-growth-rate
    traits (rgr.height.plntg, rgr.shoot.plntg); 5 of 7 "standardized ratio" traits
    (brk/stm.a.tk, lvs.a/stem.m, lvs/basal.area, lvs/root.mass, shoot.m/height) where
    the values are residuals from a cross-species common allometric slope (a = exp(log(y)
    - b*log(x)), not a simple physical ratio).
identifiers: .na
