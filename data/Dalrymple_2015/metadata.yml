dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::mutate(
        plant_sex = dplyr::if_else(form_or_sex %in% c("female", "male"), form_or_sex, NA_character_),
        colour_form = dplyr::if_else(grepl("form", form_or_sex), form_or_sex, NA_character_),
        collection_date = as.character(collection_date),
        collection_date = dplyr::if_else(
          is.na(collection_date) | collection_date == "",
          dplyr::case_when(
            location_name == "Dinden and Kuranda NPs, woodland" ~ "2012-10-28",
            location_name == "Davies Creek NP, grassland" ~ "2012-10-25/2012-10-26",
            location_name == "Barron Gorge NP and Lake Barrine (Crater Lakes NP), rainforest" ~ "2012-10-21/2012-10-28",
            location_name == "Noosa NP, heath" ~ "2012-10-03/2012-10-04",
            location_name == "Lamington NP, rainforest" ~ "2012-09-30",
            location_name == "Girraween NP, woodland" ~ "2012-09-27/2012-09-28",
            location_name == "Ku-ring-gai Chase NP, woodland" ~ "2012-10-16/2012-10-18",
            location_name == "Royal NP, heath" ~ "2012-10-09/2012-10-11",
            location_name == "Royal NP, rainforest" ~ "2012-10-13/2012-10-14",
            location_name == "Brisbane Ranges NP, grassland" ~ "2012-11-21/2012-11-22",
            location_name == "Great Otway NP, woodland" ~ "2012-11-21/2012-11-26",
            location_name == "Great Otway NP, heath" ~ "2012-11-27/2012-11-28",
            location_name == "Great Otway NP, rainforest" ~ "2012-11-24",
            location_name == "Mt William NP, grassland" ~ "2012-11-12/2012-11-13",
            location_name == "Mt William NP, heath" ~ "2012-11-12/2012-11-14",
            location_name == "Mt Field NP and Southwest NP, rainforest" ~ "2012-11-08/2012-11-09",
            location_name == "Mt Field NP, woodland" ~ "2012-11-08/2012-11-10"
          ),
          collection_date
        )
      )
    '
  collection_date: collection_date
  taxon_name: taxon_name
  location_name: location_name
  individual_id: individual_id
  description: To test whether species are more colourful at tropical latitudes than
    at higher latitudes, using objective measures of colour that include ultraviolet
    wavelengths, across birds, butterflies and flowers in eastern Australia.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: We studied 1333 species native to the eastern states of Australia,
    a geographic cline spanning more than 30° of latitude (a species list is given
    in Appendix S1 in Supporting Information). We used reflectance spectrometry to
    quantify the colour patches of 570 bird species or subspecies held in museums
    and national collections (details in Appendix S2). Reflectance spectra of flowers
    of 339 angiosperm species or subspecies were measured during the spring of 2012
    at 17 sites between Cairns, Queensland and southern Tasmania, Australia (details
    in Appendices S2 & S5). Wave-band-limited photography was used to assess colour
    patches of 424 butterfly species or subspecies held in national collections (details
    in Appendix S2). Our dataset had a broad taxonomic spread, including 76 families
    of birds, 74 families of plants and all 6 butterfly families present in Australia
    (some species shown in Fig. 2; a full list is in Appendix S1). ^p The major aim
    of the sampling was to capture all of the colours displayed on three representative
    individuals. [...] Flower sampling targeted the dominant colours of the adaxial
    surface of a perianth or showy bract, or large display stamens, and excluded endangered
    species, species known to possess strong ontogenic colour variation and species
    with flowers so small they could not be accurately measured (full details of the
    methodology are presented in Appendix S2). ^p At each site, five transects (~100
    m; ~200 m in rainforest) were walked through rainforest, grassland, woodland and
    heath. At each site, one flower was taken from each of three plants of every flowering
    native species within reach, with plants at least 1 m apart. Endangered species,
    species with strong ontogenetic colour change and flowers too small to measure
    were excluded. Non-native species were also meant to be excluded, but 16 introduced
    or naturalised taxa were sampled and are flagged in origin. Voucher specimens
    were identified by F.A. Hemmings following the APG III taxonomy of the Australian
    Plant Census.
  original_file: raw/data.csv and raw/metadata.docx, supplied by the data contributors
  notes: Additional traits, hue_lambda_Rmid (wavelength halfway between minimum and
    maximum reflectance, nm), segment_hue and segment_chroma (Endler 1990 segment
    analysis), bee_green_contrast (honeybee green-receptor contrast), uv_share (proportion
    of 300-700 nm reflectance at 300-400 nm), cie_L, cie_a, cie_b, cie_chroma and
    cie_hue (CIELAB human-vision colour), bird_chromatic_contrast and bird_achromatic_contrast
    (VS-type avian eye, receptor-noise-limited model, in JNDs against a green leaf).
