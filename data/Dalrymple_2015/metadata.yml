traits:
- var_in: brightness
  unit_in: '%'
  trait_name: flower_colour_brightness
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Flowers were kept cool and moist and measured within 6 h of collection.
    Spectra were recorded with an Ocean Optics USB2000+ spectrometer and PX-2 pulsed
    xenon lamp. The probe was held at 45° to the petal surface, with 100 ms integration
    and 10 spectra averaged. The instrument was calibrated against a Spectralon white
    standard and a black-felt dark standard. Petals were first scanned to find UV
    patterns invisible to humans. Each distinct colour patch on the adaxial surface
    of the perianth (or showy bracts) was then measured. Small petals were tiled onto
    black tape to give a measurable area. ^p Spectra were bin-averaged to 1 nm, restricted
    to 300-700 nm, and negative values set to zero. Traits were calculated per spectrum
    in R with pavo 2.11 (Maia et al. 2019, Methods Ecol Evol 10:1097-1107). ^p Brightness
    is the mean reflectance, 300-700 nm (B2; Montgomerie 2006).
- var_in: chroma
  unit_in: '{dimensionless}'
  trait_name: flower_colour_chroma
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Flowers were kept cool and moist and measured within 6 h of collection.
    Spectra were recorded with an Ocean Optics USB2000+ spectrometer and PX-2 pulsed
    xenon lamp. The probe was held at 45° to the petal surface, with 100 ms integration
    and 10 spectra averaged. The instrument was calibrated against a Spectralon white
    standard and a black-felt dark standard. Petals were first scanned to find UV
    patterns invisible to humans. Each distinct colour patch on the adaxial surface
    of the perianth (or showy bracts) was then measured. Small petals were tiled onto
    black tape to give a measurable area. ^p Spectra were bin-averaged to 1 nm, restricted
    to 300-700 nm, and negative values set to zero. Traits were calculated per spectrum
    in R with pavo 2.11 (Maia et al. 2019, Methods Ecol Evol 10:1097-1107). ^p Chroma
    is (Rmax - Rmin) / mean reflectance (S8; Montgomerie 2006).
- var_in: bee_hue
  unit_in: deg
  trait_name: flower_colour_bee_hue
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Flowers were kept cool and moist and measured within 6 h of collection.
    Spectra were recorded with an Ocean Optics USB2000+ spectrometer and PX-2 pulsed
    xenon lamp. The probe was held at 45° to the petal surface, with 100 ms integration
    and 10 spectra averaged. The instrument was calibrated against a Spectralon white
    standard and a black-felt dark standard. Petals were first scanned to find UV
    patterns invisible to humans. Each distinct colour patch on the adaxial surface
    of the perianth (or showy bracts) was then measured. Small petals were tiled onto
    black tape to give a measurable area. ^p Spectra were bin-averaged to 1 nm, restricted
    to 300-700 nm, and negative values set to zero. Traits were calculated per spectrum
    in R with pavo 2.11 (Maia et al. 2019, Methods Ecol Evol 10:1097-1107). Bee-vision
    traits use the honeybee (Apis mellifera) photoreceptor sensitivities and the colour
    hexagon (Chittka 1992). Quantum catches assume D65 illumination and von Kries
    adaptation to a green-leaf background. ^p Bee hue is the hue angle in the honeybee
    colour hexagon.
- var_in: bee_chroma
  unit_in: '{dimensionless}'
  trait_name: flower_colour_bee_chroma
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Flowers were kept cool and moist and measured within 6 h of collection.
    Spectra were recorded with an Ocean Optics USB2000+ spectrometer and PX-2 pulsed
    xenon lamp. The probe was held at 45° to the petal surface, with 100 ms integration
    and 10 spectra averaged. The instrument was calibrated against a Spectralon white
    standard and a black-felt dark standard. Petals were first scanned to find UV
    patterns invisible to humans. Each distinct colour patch on the adaxial surface
    of the perianth (or showy bracts) was then measured. Small petals were tiled onto
    black tape to give a measurable area. ^p Spectra were bin-averaged to 1 nm, restricted
    to 300-700 nm, and negative values set to zero. Traits were calculated per spectrum
    in R with pavo 2.11 (Maia et al. 2019, Methods Ecol Evol 10:1097-1107). Bee-vision
    traits use the honeybee (Apis mellifera) photoreceptor sensitivities and the colour
    hexagon (Chittka 1992). Quantum catches assume D65 illumination and von Kries
    adaptation to a green-leaf background. ^p Bee chroma is the distance from the
    achromatic centre of the colour hexagon (hexagon radius = 1).
- var_in: bee_colour_category
  unit_in: .na
  trait_name: flower_colour_bee_type
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Flowers were kept cool and moist and measured within 6 h of collection.
    Spectra were recorded with an Ocean Optics USB2000+ spectrometer and PX-2 pulsed
    xenon lamp. The probe was held at 45° to the petal surface, with 100 ms integration
    and 10 spectra averaged. The instrument was calibrated against a Spectralon white
    standard and a black-felt dark standard. Petals were first scanned to find UV
    patterns invisible to humans. Each distinct colour patch on the adaxial surface
    of the perianth (or showy bracts) was then measured. Small petals were tiled onto
    black tape to give a measurable area. ^p Spectra were bin-averaged to 1 nm, restricted
    to 300-700 nm, and negative values set to zero. Traits were calculated per spectrum
    in R with pavo 2.11 (Maia et al. 2019, Methods Ecol Evol 10:1097-1107). Bee-vision
    traits use the honeybee (Apis mellifera) photoreceptor sensitivities and the colour
    hexagon (Chittka 1992). Quantum catches assume D65 illumination and von Kries
    adaptation to a green-leaf background. ^p Bee colour category is assigned from
    the hexagon's 60° sectors (UV, UV-blue, blue, blue-green, green, UV-green; Chittka
    et al. 1994).
