dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2016-10/2017-01
  taxon_name: species
  location_name: location_name
  description: Study to test whether perennial forbs common in grassy ecosystems of
    south-eastern Australia germinate in direct response to fire-cues (smoke and heat),
    either inherently or only once seed dormancy has been alleviated by stratification
    or dry-after-ripening.
  basis_of_record: lab
  life_stage: adult
  sampling_strategy: Seven perennial forbs that are common components of endangered
    grasslands and grassy woodlands were selected for this study. Arthropodium strictum
    (Asparagaceae), B. umbellata (Colchicaceae), C. cyanea (Pittosporaceae), D. revoluta
    (Asphodelaceae), E. ovinum (Apiaceae) and S. glauca (Asphodelaceae) are widely
    distributed across southern Australia, whilst B. australis (Goodeniaceae) is distributed
    across both southern and central Australia (Fig. 1). Brunonia australis, C. cyanea
    and E. ovinum are asterid dicots, whilst A. strictum, B. umbellata, D. revoluta
    and S. glauca are liliod monocots (Table 2). These species are targets for grassy
    ecosystem restoration and require further research into germination requirements.
    ^p Seed of the study species were hand collected from nine grassy woodland and
    derived grassland sites in north-eastern Victoria between October 2016 and January
    2017 (Table 1). Mature seed or fruits were harvested directly from mother plants.
    Summers in this region are warm, and peak rainfall occurs during late autumn and
    winter months (Bureau of Meteorology, n.d). ^p Following collection, samples were
    stored in a drying facility (~15°C, 15% RH) in paper envelopes until experiments
    commenced (2-4 months). Seed from each site were pooled to create larger sample
    sizes and better represent genetic diversity across the study region. ^p The dormancy
    and germination experiments were conducted in two parts using the same seed collections
    for all experiments. The first part tested the effect of three fire-cues (smoke,
    heat and heat + smoke) on fresh seed (<4 months from collection) at three temperature
    regimes (25/15°C, 30/20°C and 35/25°), to determine whether fire-cues promote
    germination of fresh seed. Temperature regimes were chosen to simulate the range
    of conditions seed would be exposed to at the study sites during late summer to
    autumn, the time from dispersal to germination (Bureau of Meteorology, n.d). Five
    degree increments were chosen based on recommendations in Baskin and Baskin (2014)
    on dealing with seed of unknown germination requirements. The second part tested
    the effect of fire-cues on seed that had undergone three treatments used to alleviate
    dormancy (dry-after-ripening, warm or cold stratification), to determine whether
    responses to fire-cues may be induced with the removal of physiological or morphophysiological
    dormancy (Fig. 2).
  original_file: Data transcribed from Tables 1-3 of the manuscript; transcribed tables
    archived in the raw data folder.
  notes: data.csv merges Tables 1-3 of the primary source. Seed from all collection
    sites (Table 1) was pooled into a single regional mix per species, so all records
    are assigned to a single location, with the contributing collection sites recorded
    as the seed provenance context. Trait data available but not yet included in AusTraits
    include embryo type (linear/dwarf), embryo to seed length ratio (>50% / <50%)
    and seed mass increase following 28 h of imbibition (%).
