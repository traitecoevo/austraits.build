    state: Vic
contexts:
- context_property: seed provenance
  category: entity_context
  var_in: seed_provenance
- context_property: dormancy alleviation treatment
  category: treatment_context
  var_in: dormancy_alleviation_treatment
  values:
  - value: fresh seed
    description: Fresh seed (<4 months from collection), with no dormancy alleviation
      treatment.
  - value: stored seed
    description: Seed was stored in the National Seed Bank drying room (~15°C, 15%
      RH) in open glass vials prior to the commencement of germination testing (~6
      months), to determine whether storage had any effect on germination.
  - value: dry-after-ripening
    description: Seed was placed in open glass vials within sealed 270 x 190 x 100
      mm polycarbonate electrical boxes containing unsaturated lithium chloride solution
      to create dry conditions 36% (2%) relative humidity at ~35°C, with the aim of
      rapidly after-ripening seed, for 10 weeks.
  - value: cold stratification
    description: Seed was imbibed on 1% water agar and placed evenly on 90-mm-diameter
      Petri dishes in a constant ~4°C chamber. Dishes were wrapped in aluminium foil
      to exclude light. After 5 weeks, seed was transferred to fresh dishes to prevent
      mould build up. After 10 weeks, seed was placed overnight on a laboratory bench
      (~23°C) to equilibrate with ambient temperature.
  - value: warm stratification
    description: Seed was imbibed on 1% water agar and placed evenly on 90-mm-diameter
      Petri dishes in a convection oven at ~35°C. Dishes were wrapped in aluminium
      foil to exclude light. After 5 weeks, seed was transferred to fresh dishes to
      prevent mould build up. After 10 weeks, seed was placed overnight on a laboratory
      bench (~23°C) to equilibrate with ambient temperature.
- context_property: fire-cue treatment
  category: treatment_context
  var_in: fire_cue_treatment
  values:
  - value: Control
    description: Seed was placed evenly on 90-mm-diameter Petri dishes with 1% water
      agar germination medium.
  - value: Smoke
    description: Seed was placed in nylon bags and submerged for 24 h in a 10% smoke
      water solution made using smoke water concentrate diluted 1:10.
  - value: Heat
    description: Seed was placed in nylon mesh bags and buried in 1 cm of pre-heated,
      autoclaved coarse sand and heated at 80°C for 1 h in a convection oven.
  - value: Heat + smoke
    description: Heat was applied first followed by application of smoke, following
      the methods for the individual treatments.
traits:
- var_in: seed_dormancy_class
  unit_in: .na
  trait_name: seed_dormancy_class
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'First, imbibition tests were conducted to detect whether seed was water-impermeable
    and therefore physically dormant (Martyn et al. 2009). For each species, three
    replicates of 25 seed was weighed and placed on moist filter paper. Seed was periodically
    removed from the filter paper, surface water removed using paper towel and weighed.
    After the first 6 h, replicates were left overnight and weighed again at 24 and
    28 h. Per cent change in seed weight was calculated to determine whether seed
    mass increased over time, in which case seed was unlikely to be physically dormant
    (Martyn et al. 2009). Second, preliminary assessments of embryo morphology were
    made to determine whether the embryo was underdeveloped and therefore likely to
    be morphologically dormant (Baskin & Baskin 2007). Seed was imbibed for 24 h and
    then cut longitudinally using a scalpel blade to expose the embryo. Embryo morphology
    was classified as per Martin (1946), and assessments of embryo: seed ratio were
    made. The presence of large, developed embryos (embryo: seed > 0.5) indicated
    that species were unlikely to possess morphological dormancy, whilst a small embryo
    (embryo: seed < 0.5) suggested that species were likely to possess morphological
    dormancy (Baskin & Baskin 2007). The presence of morphological dormancy was not
    confirmed with an embryo growth study to determine whether the embryo grows prior
    to the emergence of the radicle (a key defining characteristic of morphologically
    dormant species; Baskin & Baskin 2007).'
- var_in: seed_length_min (mm)
  unit_in: mm
  trait_name: seed_length
  entity_type: population
  value_type: minimum
  basis_of_value: measurement
  replicates: unknown
  methods: Minimum seed length within each seed collection.
- var_in: seed_length_max (mm)
  unit_in: mm
  trait_name: seed_length
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: unknown
  methods: Maximum seed length within each seed collection.
- var_in: seed_viability (%)
  unit_in: '%'
  trait_name: seed_viability
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 25
  methods: Prior to the commencement of germination testing, a sub-sample of 25 seed
    from each regional mix was tested for viability, to determine whether seed was
    viable for use in experiments. This was conducted by cutting seed longitudinally
    to expose the embryo and endosperm and examining the embryo under a dissecting
    microscope. Seed was considered likely to be viable if the embryo was white, turgid
    and filled the seed coat, whilst seed with shrivelled or absent embryos were classified
    as nonviable.
- var_in: seed_germination (%)
  unit_in: '%'
  trait_name: seed_germination
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 4
  methods: Four replicates of 25 seed were used for each treatment (Fig. 2). Seed
    were placed evenly on 90-mm-diameter Petri dishes on a 1% water agar medium to
    ensure consistent moisture availability and sealed with parafilm to prevent desiccation.
    Replicates for each treatment were grouped into blocks of four (control, smoke,
    heat and heat + smoke) and arranged randomly on shelves within Thermoline growth
    cabinets (Thermoline Model TRIL-120-1-VW/BMS, Serial 30455; Thermoline Scientific,
    Sydney, NSW, Australia). Replicate blocks were rotated regularly to counteract
    potential effects of temperature and light variations within the incubators. Germination
    testing ran for 56 days (8 weeks), and germination (defined as emergence of the
    radicle) was checked weekly. Cut tests were performed on remaining un-germinated
    seed to ascertain the cause of non-germination. The presence of a white, turgid
    embryo indicated that seed remained viable and failed to germinate due to the
    presence of dormancy or lack of a stimulatory cue (Martyn et al. 2009). Using
    this information, nonviable seed was subtracted from the sample and viability
    adjusted germination was calculated to give the number of viable seed which germinated
    and the number of viable seed which failed to germinate for each replicate (Sweedman
    & Merritt 2006). ^p Following return to ambient conditions, seed was removed from
    Petri dishes and glass vials and placed back into the drying room (~15°C, 15%
    RH) in nylon bags for 1 week prior to the application of fire-cues. The drying
    was conducted prior to application of fire-cues to avoid potentially detrimental
    effects of heat treatments on imbibed seed (Tangney et al. 2018). Drying was applied
    across all treatments to avoid any confounding effects. After 1 week of drying,
    seed was then treated with fire-cues and placed into incubators with the temperature
    regime that promoted the highest germination for each species from the first part
    (25°C/15°C), with stored and dormancy treated controls (Fig. 2).
substitutions:
- trait_name: seed_dormancy_class
  find: PD
  replace: physiological_dormancy
- trait_name: seed_dormancy_class
  find: MPD
  replace: morphophysiological_dormancy
