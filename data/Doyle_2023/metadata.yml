  location_name: Location
  description: We examined the mating system and used molecular genetics to measure
    pairwise kinship and the potential for inbreeding in Hibbertia spanantha, a critically
    endangered long-lived shrub endemic to the Sydney Basin, Australia.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 2.1 Study species and distribution ^p The genus Hibbertia is
    restricted to Australia and Papua New Guinea and divided into four subgenera (Horn,
    2009). The largest subgenus Hemistemma, contains H. spanantha and can be split
    further into multiple groups, from which H. spanantha is closest to the H. strigosa
    group (Toelken & Robinson, 2015). ^p Hibbertia spanantha is a decumbent to sprawling
    subshrub to approximately 30 cm high with wiry/woody branches, sessile terminal
    flower, and fruit as a dehiscent capsule producing 2-4 seeds with an attached
    aril (PlantNET, 2020; Figure S1). The epithet spanantha refers to a paucity of
    flowers and seed production is assumed to be low, based on collections of the
    Australian Botanic Gardens (ABG) Mt Annan. Like many other Hibbertia, seeds probably
    rely on myrmecochory for dispersal (Berg, 1975), and H. spanantha seeds were observed
    during collection to possess an elaiosome, suggesting ants were likely dispersal
    mechanism for the species. The mating systems of Hibbertia are not well understood
    (Allen & Hiscock, 2008) although inferences based on pollination syndrome found
    the genus exhibits varied self-compatibility (Bernhardt & Thien, 1987) and is
    best described as having a mixed mating system. Although Bernhardt and Thien (1987)
    do not record dichogomy (ripening of stamens and pistils at different times to
    prevent autogomous selfing), Keighery (1975) observed stamens ripening “several
    hours” before anther dehiscence during which time only cross-pollination is effective.
    ^p Flowering of Hibbertia spanantha occurs from August-December, with peak in
    October/November (AMBS, 2020). All Hibbertia flowers are without nectar, with
    pollen serving as the reward (Horn, 2005). Flower longevity and pollinators are
    unknown, although other species in the genus are most visited by Lasioglossum
    (Chilalictus; Bernhardt, 1986, 1996; Tucker & Bernhardt, 2000). Hibbertia are
    described as requiring buzz pollination due to a poricidal anther structure (Bernhardt,
    1996; Tucker & Bernhardt, 2000). However, examination of Hibbertia spanantha anther
    structure (i.e., where and how the anther releases pollen) using a A Leica M125
    microscope indicated the species is “apical dehiscent”, the anthers possessing
    observable longitudinal slits. (Pers. Comm Andrew Orme, Royal Botanic Gardens
    Sydney, Kevin Thiele, University of Western Australia, December 2019). A video
    of pollen release is included in www.plant-heroes.com/species/julianshibbertia.
    ^p Described as growing in Sydney Coastal Dry Sclerophyll Forest (Keith, 2004),
    H. spanantha is usually associated with shale sandstone transition soils and is
    restricted to the Sydney Basin Bioregion (DPIE, 2020). Populations received an
    average annual rainfall of 1079 mm (BOM, 2019), distributed relatively evenly
    across the year. Hibbertia spanantha generally grows in clumps with multiple stems
    appearing in close vicinity to one another. Based on this growth habitat and observations
    of clonality in Hibbertia puberula subsp. glabrescens (Bragg et al., 2020), which
    is connected through subsurface layering, some of the populations were assumed
    composed of ramets. Population numbers are consequently referred to as stems (as
    opposed to plants).^p The species was originally known from two populations in
    2013, expanding to a total of four populations by 2019. The largest population
    is in Turramurra with 86 stems (AMBS, 2021a, 2021b), the majority of which were
    recruited after a 2014 planned fire (Toelken & Robinson, 2015). The second largest
    population is in Maroota, with 15 stems, followed by smaller populations in Cheltenham
    with nine stems, and Ryde with one confirmed stem (AMBS, 2021a). Each population
    is highly fragmented, with an area of occupancy (AOO) no greater than 100m2. The
    Maroota population is geographically isolated, being 40 km from all other populations,
    which are in the Sydney Basin within 8 km of one another (Figure 1). The species'
    restricted range, small population size, low area of occupancy, and the low observed
    recruitment in most populations, compounded by threats from urbanization in the
    Sydney Basin, have resulted in a listing of critically endangered (Commonwealth
    EPBC Act 1999), based on IUCN criteria (IUCN, 2019). ^p 2.3 Pollination vectors
    ^p Data on pollinator visitation were drawn from field observations and camera
    trap images in three populations, Cheltenham, Turramurra, and Nursery (translocated
    population of H. spanantha located in the Nursery grounds; Figure 1). ^p Visitation
    observations were collected between 6.30 am and 3 pm over the course of the pollination
    period (September-November), with the bulk of collections occurring between 7
    am and 11 am. Camera traps were two mobile phones installed with the motion sensor
    application Salient Eye, producing footage totaling 18 h and 47 min of single
    shot still images. Cameras remained in situ until the battery was depleted (between
    1 and 3 h). Images with clear flower visitation were extracted. Family and genera
    were confirmed from camera trap images by taxonomist Dr Michael Batley (insect
    taxonomist at Australian Museum, Sydney). ^p No analysis was undertaken on observations
    of pollinators; this component was only conducted to (a) confirm the presence
    of potential pollinators and (b) identify genera visiting flowers and the likely
    pollination mechanism for the species
  original_file: Pollinator records sorted images_Hibbertia spanantha.xlsx
  notes: Testing after AusTraits pollination workshop. Uncertain how precisely to identify floral visitors; uncertain how to deal with "non floral" plant visitors.
