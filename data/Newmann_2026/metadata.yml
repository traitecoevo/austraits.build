source:
  primary:
    key: Newmann_2026
    bibtype: Online
    author: Ramón Newmann and Andrew Brown
    year: '2026'
    title: Key to the Native Orchids of Western Australia
    publisher: Western Australian Native Orchid Study and Conservation Group (WANOSCG), Perth
    url: https://keys.lucidcentral.org/keys/v4/wa-orchids/
    note: Orchid Fact Sheets, version Jan 2026; accessed 1 October 2026
contributors:
  data_collectors:
  - last_name: Wenk
    given_name: Elizabeth
    ORCID: 0000-0001-5640-5910
    affiliation: Evolution & Ecology Research Centre, School of Biological, Earth,
      and Environmental Sciences, UNSW Sydney, Australia
    notes: Extracted the trait data from the WA Orchid Fact Sheets
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::filter(taxon_rank != "genus")
    '
  collection_date: '2026'
  taxon_name: taxon_name
  description: 'To compile plant trait values from the Orchid Fact Sheets of the Key to the Native Orchids of Western
    Australia, written by Ramón Newmann and Andrew Brown for the Western Australian Native Orchid Study and Conservation
    Group, which describe each orchid species, subspecies and named hybrid in Western Australia.'
  basis_of_record: literature
  life_stage: adult
  sampling_strategy: 'Every fact sheet in the WA Orchid Fact Sheets index (keys.lucidcentral.org/keys/v4/wa-orchids) was
    downloaded on 1 October 2026, including genus fact sheets. Trait values were extracted with a scripted parser
    (raw/build_data_csv.R) from the Flowering Months, Description, Distribution and Habitat, and Notes fields. The
    Description follows a set pattern ("A ... species 100--350 mm high with a hairy leaf 100--200 mm long by 2--5 mm wide
    and up to three flowers 20--30 mm across"), from which the height of the flowering plant, leaf and flower counts and
    dimensions, and leaf hairiness and shape are read. Categorical terms are mapped to AusTraits trait values, with the
    source phrase kept verbatim in a matching *_description column; several values are listed in the order they appear in
    the text. Measurements are in mm, and a range is recorded as minimum and maximum values. Values that carry a context are
    written on their own rows: northern and southern flowering calendars (population_region), rosette width and separate
    basal and cauline leaf counts (entity_measured). Statements in a genus fact sheet that apply to every species without
    hedging are copied to member species whose own sheet is silent on that trait (trait_scoring_method =
    inferred_from_genus). Source typographical errors were corrected in the script.'
  original_file: wa_orchids_fact_sheets.csv (WA Orchid Fact Sheets, downloaded 1 October 2026)
  notes: 'Genus fact sheet rows (taxon_rank = genus) are in data.csv but filtered out in custom_R_code, as their values
    summarise variation across the genus; genus statements that hold for every species are already copied to the species
    rows. Unmapped columns: the verbatim *_description columns, fact_sheet_url, common_name, wa_conservation_code, and the
    habitat, distribution, soil and habitat-term columns.'
identifiers: .na
locations: .na
contexts:
- context_property: population region
  category: entity_context
  var_in: population_region
- context_property: entity measured
  category: method_context
  var_in: entity_measured
- context_property: trait scoring method
  category: method_context
  var_in: trait_scoring_method
traits:
- var_in: flowering_time
  unit_in: .na
  trait_name: flowering_time
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'Months of flowering from the Flowering Months field of the fact sheet (verbatim in
    flowering_months_description), as a 12-character y/n string starting in January; where a sheet gives separate calendars
    for northern and southern populations, each is recorded on its own population_region row.'
- var_in: plant_height_reproductive_min
  unit_in: mm
  trait_name: plant_height_reproductive
  entity_type: species
  value_type: minimum
  basis_of_value: measurement
  replicates: .na
  methods: 'Height of the flowering plant from the opening sentence of the fact sheet Description ("A ... species 100--350
    mm high ..."; verbatim in plant_height_reproductive_description): a range is recorded as minimum and maximum values.'
- var_in: plant_height_reproductive_max
  unit_in: mm
  trait_name: plant_height_reproductive
  entity_type: species
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: 'Height of the flowering plant from the opening sentence of the fact sheet Description ("A ... species 100--350
    mm high ..."; verbatim in plant_height_reproductive_description): a range is recorded as minimum and maximum values.'
