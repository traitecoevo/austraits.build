contributors:
  data_collectors:
  - last_name: Cornwell
    given_name: William
    ORCID: 0000-0003-4080-4073
    affiliation: Evolution & Ecology Research Centre, School of Biological, Earth,
      and Environmental Sciences, UNSW Sydney, Australia
    additional_role: contact
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      generate_observation_numbers(species, location_name)
  '
  collection_date: collection.year
  taxon_name: species
  location_name: location_name
  source_id: source_id
  description: A global compilation of leaf carbon isotope discrimination measurements,
    assembled to test whether climate and soil properties together regulate photosynthetic
    carbon isotope discrimination in C3 plants worldwide.
  basis_of_record: literature
  life_stage: adult
  sampling_strategy: Literature comilation from multiple sources. Only sources with
    1-2 data points and unpublished data values included here; other data sources
    are mapped in individually.
  original_file: Australia_d13C_Cornwell.csv, a geographic subset of the leaf13C R
    package's global compilation (raw/leaf13C.csv), in raw data folder
  notes: none
identifiers: .na
locations: locations.csv
contexts:
- context_property: replicate observations
  category: temporal_context
  var_in: observation_number
traits:
- var_in: little.d13.org
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Leaf dry matter delta13C, compiled from multiple original studies (see
    source_id) and previously unpublished data contributed directly to this global
    database; see Cornwell et al. (2018) for full compilation methodology and the
    original studies for their individual analytical methods.
- var_in: ps.type
  unit_in: .na
  trait_name: photosynthetic_pathway
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Photosynthetic pathway (C3 or C4) as recorded in the compilation, compiled
    from multiple original studies (see source_id) and previously unpublished data;
    see Cornwell et al. (2018) for full compilation methodology.
substitutions:
- trait_name: photosynthetic_pathway
  find: C3
  replace: c3
- trait_name: photosynthetic_pathway
  find: C4
  replace: c4
taxonomic_updates:
- find: Eucalyptus beyeri
  replace: Eucalyptus x beyeri
  reason: Exact match of the first two words of the taxon name to an APC-accepted
    canonical name (2026-09-15)
  taxonomic_resolution: species
exclude_observations: .na
questions: .na
