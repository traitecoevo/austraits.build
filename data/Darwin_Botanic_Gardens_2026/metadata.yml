source:
  primary:
    key: Darwin_Botanic_Gardens_2026
    bibtype: Online
    author: George Brown Darwin Botanic Gardens Seed Bank
    year: 2026
    title: George Brown Darwin Botanic Gardens Seed Bank data from Australian Virtual Seed Bank
    publisher: Australian Virtual Seed Bank
    url: https://seedbank.ala.org.au
contributors:
  data_collectors:
  - last_name: unknown
    given_name: unknown
    ORCID: unknown
    affiliation: unknown
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        location_name = ifelse(
          !is.na(`Decimal Latitude`),
          paste0("seeds_collected_at_", `Decimal Latitude`, "_lat_and_", `Decimal Longitude`, "_long"),
          NA
        ),
        measurement_remarks = ifelse(!is.na(Collector), paste0("Collector: ", Collector), NA)
      ) %>%
      filter(!is.na(`Scientific Name`))
    '
  collection_date: Collection Date
  taxon_name: Scientific Name
  location_name: location_name
  description: Seed trait data from the George Brown Darwin Botanic Gardens Seed Bank,
    including data on germination trials.
  basis_of_record: lab
  life_stage: adult
  measurement_remarks: measurement_remarks
  sampling_strategy: The George Brown Darwin Botanic Gardens is located 2km from the
    Darwin CBD. The gardens contain vibrant displays of native plants from northern
    Australia as well as other exotic tropical plants from around the world. The various
    plantings throughout the gardens present a rich tapestry of tropical orchids, heliconias,
    bromeliads and gingers. With the recent addition of a new Visitor and Event Centre,
    visitors have the opportunity to learn about the Gardens natural and cultural history
    as well as the diverse plant collections and the many uses Aboriginal people have
    for Australia's native tropical plants.
  original_file: Data downloaded from the Australian Virtual Seed Bank (https://seedbank.ala.org.au)
    GraphQL API (https://events-databox.ala.org.au/graphql) on 10 Nov 2026, all records
    for the George Brown Darwin Botanic Gardens Seed Bank (data resource dr21625); see
    data/ANBG_2026/raw/AVSB_download.R and data/ANBG_2026/raw/AVSB_split_by_seedbank.R.
  notes: data.csv has one row per seed accession and one row per germination trial (with
    its treatment and the accession's taxon, locality and dates), distinguished by `Event
    Type`. Accession rows carry no mapped traits; the weekly germination counts (`7 Days`
    to `98 Days`), plant form and the collection site descriptions (sampled-plant height,
    population size, plants sampled and seeding) are in data.csv.
identifiers:
- var_in: Accession Number
  identifier_type: catalogNumber
  institution_code: George Brown Darwin Botanic Gardens Seed Bank
- var_in: Herbarium Voucher
  identifier_type: catalogNumber
  institution_code: Northern Territory Herbarium (DNA)
