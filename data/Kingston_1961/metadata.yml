- var_in: shrinkage_12MC_BR_tangential
  unit_in: '%'
  trait_name: wood_tangential_air_dry_shrinkage
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: shrinkage_12MC_BR_tangential_n
  method_context: before reconditioning
  methods: In the early studies of shrinkage and density in this laboratory, the methods
    specified by the British Standards Institution (1957 et prec.) were used except
    that no determination was made of the volumetric shrinkage (Kelsey and Kingston
    1953) and the density was determined using linear shrinkage specimens. Thus two
    4 by 1 by 1 in. specimens were used, the 4 in. dimension being tangential to the
    growth rings in one specimen and in the radial direction in the other. ^p In more
    recent tests, a single 4 by 1 by 1 in. specimen, with the 4 in. dimension parallel
    to the grain has been used for all linear shrinkage determinations. Kelsey and
    Kingston (1953, 1957) found that the shrinkages of such a specimen do not differ
    appreciably from those of the specimens previously used, except that a truer value
    is obtained for tangential shrinkage because any error due to the curvature of
    the growth rings is minimized. ^p As collapse is common in many Australian species
    (Greenhill 1936), dimensions have been measured both after drying to 12 per cent.
    moisture content and again after reconditioning by immersing in steam at 100 C
    for 2 hr (Greenhill 1938) and redrying to the same moisture content. ^p Shrinkage
    values are expressed as a percentage of green dimensions, both before and after
    reconditioning. ^p The mean value (mean of tree means) is given together with
    the number of trees tested, the standard error of the species mean, and the 95
    per cent. probability range for individual specimens.
