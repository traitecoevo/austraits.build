- var_in: unit_shrinkage_tangential
  unit_in: mm.g{wood}/mm/g{H2O}
  trait_name: wood_tangential_unit_shrinkage
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unit_shrinkage_tangential_n
  method_context: after reconditioning
  methods: In more recent tests, a single 4 by 1 by 1 in. specimen, with the 4 in.
    dimension parallel to the grain has been used for all linear shrinkage determinations.
    Kelsey and Kingston (1953, 1957) found that the shrinkages of such a specimen
    do not differ appreciably from those of the specimens previously used, except
    that a truer value is obtained for tangential shrinkage because any error due
    to the curvature of the growth rings is minimized. ^p In all recent work, measurements
    have also been made at 5 per cent. moisture content. This was found to be necessary
    to obtain an accurate estimate of the unit shrinkage or shrinkage per 1 per cent.
    change in moisture content, as the shrinkage-moisture content relationship for
    some species was found to depart from linearity at low moisture contents (Kelsey
    1956). ^p Shrinkage values are expressed as a percentage of green dimensions,
    both before and after reconditioning. Unit shrinkages are also given, these being
    obtained by dividing the shrinkage between two moisture contents after reconditioning
    (in recent work 12 and 5 per cent.) by the moisture content change.
- var_in: unit_shrinkage_radial
  unit_in: mm.g{wood}/mm/g{H2O}
  trait_name: wood_radial_unit_shrinkage
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unit_shrinkage_radial_n
  method_context: after reconditioning
  methods: In more recent tests, a single 4 by 1 by 1 in. specimen, with the 4 in.
    dimension parallel to the grain has been used for all linear shrinkage determinations.
