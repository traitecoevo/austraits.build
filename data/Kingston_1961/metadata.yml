contexts:
- context_property: tree age
  category: entity_context
  var_in: tree_age
- context_property: wood density method notes
  category: method_context
  var_in: density_method
  values:
  - find: earlier methods
    value: non-standard methods
    description: density determined only by methods other than the standard specimen
      method, such as those of Greenhill and Dadswell (1940)
  - find: partly earlier methods
    value: partly non-standard methods
    description: density based partly on tests by methods other than the standard
      specimen method, such as those of Greenhill and Dadswell (1940), because other
      data were inadequate
- context_property: wood reconditioning status
  category: method_context
  var_in: method_context
  values:
  - value: before reconditioning
    description: wood air-dried to 12 % moisture content, without reconditioning,
      so any collapse is included
  - value: after reconditioning
    description: wood air-dried to 12 % moisture content, reconditioned in steam at
      100 C for 2 hours to recover collapse, and redried to 12 % moisture content
traits:
- var_in: basic_density
  unit_in: kg/m3
  trait_name: wood_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: basic_density_n
  methods: Density values tabulated are basic density, which is defined as the mass
    of the oven-dry specimen divided by the volume when green. ^p The following is
    a summary of the method used at present. A single specimen, 1 by 1 by 4 in., parallel
    to the grain and having truly radial and tangential faces is used for all measurements.
    It is measured and weighed in the following conditions; (i) green; (ii) after
    open-stack air-drying in an air-conditioned space (at about 65 per cent. relative
    humidity and 25 C) to a uniform moisture content of about 12 per cent.; (iii)
    after reconditioning, and redrying to 12 per cent. moisture content; (iv) after
    conditioning to about 5 per cent. moisture content. It is finally dried at a temperature
    of 103 C +/- 2 until a constant dry weight is obtained. Weighings are made to
    an accuracy of +/- 0.02 g and measurements to +/- 0.001 in. ^p For certain species,
    where no density data have been obtained by the methods described here, basic
    density data obtained by different methods (e.g. Greenhill and Dadswell 1940)
    have been included. ^p The mean value (mean of tree means) is given together with
    the number of trees tested, the standard error of the species mean, and the 95
    per cent. probability range for individual specimens.
- var_in: basic_density_earlier
  unit_in: kg/m3
  trait_name: wood_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: basic_density_n
  density_method: earlier methods
  methods: Density values tabulated are basic density, which is defined as the mass
    of the oven-dry specimen divided by the volume when green. ^p The following is
