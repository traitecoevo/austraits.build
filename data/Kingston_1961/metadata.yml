source:
  primary:
    key: Kingston_1961
    bibtype: Report
    year: 1961
    author: R. S. T. Kingston and C. J. E. Risdon
    title: Shrinkage and density of Australian and other South-west Pacific woods
    institution: Commonwealth Scientific and Industrial Research Organization, Australia,
      Melbourne
    type: Division of Forest Products Technological Paper No. 13
contributors:
  data_collectors:
  - last_name: Kingston
    given_name: R. S. T.
    ORCID: .na.character
    affiliation: Division of Forest Products, Commonwealth Scientific and Industrial
      Research Organization, Melbourne, Victoria, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: ' data |> dplyr::filter(australian_material == "TRUE") |> dplyr::mutate(
    dplyr::across( c(basic_density, air_dry_density_BR, air_dry_density_AR), ~ dplyr::if_else(
    as.numeric(.x) < 5, as.character(as.numeric(.x) * 1000), as.character(.x) ) ),
    air_dry_density_BR = dplyr::if_else( air_dry_calculated == "TRUE", NA_character_,
    as.character(air_dry_density_BR) ), air_dry_density_AR = dplyr::if_else( air_dry_calculated
    == "TRUE", NA_character_, as.character(air_dry_density_AR) ), basic_density_earlier
    = dplyr::if_else( basic_density_method %in% "earlier methods", basic_density,
    NA_character_ ), basic_density_partly_earlier = dplyr::if_else( basic_density_method
    %in% "partly earlier methods", basic_density, NA_character_ ), basic_density =
    dplyr::if_else( is.na(basic_density_method), basic_density, NA_character_ ), air_dry_density_BR_earlier
    = dplyr::if_else( air_dry_density_BR_method %in% "earlier methods", air_dry_density_BR,
    NA_character_ ), air_dry_density_BR = dplyr::if_else( is.na(air_dry_density_BR_method),
    air_dry_density_BR, NA_character_ ) ) '
  collection_date: '1960'
  taxon_name: taxon_name
  location_name: location_name
  description: To provide updated reference values for the basic density, air-dry
    density and shrinkage of the timbers of over 300 species from Australia and other
    parts of the South-west Pacific, by combining earlier and recent test results
    and reanalysing them as means of tree means.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: In the past two decades a large amount of further material has
    been tested, including additional trees of important Australian species, trees
    of less important Australian species not previously examined, immature Australian
    woods, a number of New Guinea and Pacific Island species, and plantation-grown
    exotic species. The methods of selection and test have been changed somewhat in
    recent times, but it has been shown that these changes do not appreciably affect
    the results. The recent results have therefore been added to those previously
    obtained by Dadswell and Greenhill and by the New South Wales Forestry Commission,
    and a complete reanalysis of the data has been made. ^p The number of trees tested
    in obtaining the present data varied very much from species to species, many more
    trees being sampled to increase the precision for important species, especially
    those growing in a number of states or widely separated localities. In some cases,
    the sampling is still incomplete. ^p It has been found that, for most properties,
    the variation from tree to tree is more important than that within a tree, and
    consequently the method of sampling has been modified during recent years to include
    fewer specimens from each of a much larger number of trees. For this reason the
    means have been calculated as means of tree means. This results in less weight
    being given to earlier work where many specimens were taken from a few trees,
    and there are consequently considerable changes in some of the mean values from
    those given in previous publications. ^p Much of the more recent material has
    been taken from butt logs but the resulting bias will be small as shrinkage does
    not appear to vary very much (e.g. Greenhill 1936) and density not consistently
    (Greenhill and Dadswell 1940) with height in tree. For much of the recent work
    on the eucalypts, only two specimens have been taken from each tree, these being
    from heartwood at different distances from the centre but avoiding material near
    the pith. In conifers, compression wood, whose density is generally high and shrinkage
    abnormal, has been avoided. ^p The states from which material was obtained are
    also given. Immature material and mature plantation-grown material have been listed
    separately, and, where justified, immature material has been separated into age
    groups.
  original_file: Kingston and Risdon.xls (spreadsheet transcription of Table 1), supplemented
    from the PDF of Table 1 via raw/table1_symbols.csv
  notes: The data file provided is supplemented by additional information extracted
    from the pdf, including specifying plantation-grown material as basis_of_record
    captive_cultivated, tree ages, the Table 1 footnote symbols for density measured
    by earlier methods (basic_density_method, air_dry_density_BR_method). Air-dry
    densities shown in brackets in Table 1 were calculated from basic density using
    formulae of Greenhill and Dadswell (1940) rather than measured, and are set to
    NA in custom_R_code. Rows for material only from outside Australia (New Guinea,
    New Zealand, Borneo, Malaya, Solomon Islands, Fiji) and for Cocos nucifera (no
    source region given) are filtered out, including Cryptocarya alleniana, which is
    New Guinea material in Table 1 although the spreadsheet marks it as Queensland;
    species means that combine Queensland and
    New Guinea material are retained. Locations are the state(s) material came from;
    the report gives no site details. Values from earlier methods are moved by custom_R_code
    into separate columns (basic_density_earlier, basic_density_partly_earlier, air_dry_density_BR_earlier)
    so the density method context attaches only to those values. Immature and aged
    trees (tree age context) are given life_stage adult; the 6-16-year-old plantation
    pines and the 7-8-year-old hoop pine may be better treated as saplings.
