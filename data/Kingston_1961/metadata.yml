- var_in: shrinkage_12MC_AR_radial
  unit_in: '%'
  trait_name: wood_radial_air_dry_shrinkage
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: shrinkage_12MC_AR_radial_n
