- var_in: air_dry_density_BR
  unit_in: kg/m3
  trait_name: wood_density_air_dry
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: air_dry_density_BR_n
  method_context: before reconditioning
  methods: Density values tabulated are ... actual air-dry densities at 12 per cent.
    moisture content both before and after reconditioning. ^p As collapse is common
    in many Australian species (Greenhill 1936), dimensions have been measured both
    after drying to 12 per cent. moisture content and again after reconditioning by
    immersing in steam at 100 C for 2 hr (Greenhill 1938) and redrying to the same
    moisture content. ^p The following is a summary of the method used at present.
    A single specimen, 1 by 1 by 4 in., parallel to the grain and having truly radial
    and tangential faces is used for all measurements. It is measured and weighed
    in the following conditions; (i) green; (ii) after open-stack air-drying in an
    air-conditioned space (at about 65 per cent. relative humidity and 25 C) to a
    uniform moisture content of about 12 per cent.; (iii) after reconditioning, and
    redrying to 12 per cent. moisture content; (iv) after conditioning to about 5
    per cent. moisture content. ^p The mean value (mean of tree means) is given together
    with the number of trees tested, the standard error of the species mean, and the
    95 per cent. probability range for individual specimens.
