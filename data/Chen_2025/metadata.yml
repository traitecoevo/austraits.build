dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(species = stringr::str_replace(Samples, "-[:alpha:][:digit:]", ""))
  '
  collection_date: 2022-09
  taxon_name: species
  location_name: locations
  description: Study documenting how contrasting habitats with different soil [P]
    influenced P-acquisition strategies and demonstrates the variation in P-acquisition
    strategies among species in severely P-impoverished environments.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 2.1 Study site and species selection ^p The study was conducted
    in Alison Baird Reserve (41°24' S 115°98' E), a 35-ha megadiverse reserve located
    20 km southeast of Perth (Tauss et al., 2019) in September 2022. The reserve has
    been owned by the University of Western Australia since 1949 for teaching and
    research purposes. The study focused on the tall north-to-south dune of Bassendean
    sand that is central to the reserve and the clay flats that flank the dune to
    the east and west (Figure 1). The dune was formed ca. 2-million-years ago, and
    its sand has remarkably low plant-available P concentrations (Kendrick et al.,
    1991; Leopold & Zhong, 2019; Smith et al., 2023; Turner et al., 2018). The sand
    of the dune is moist in winter, but dry in summer. Both the east and west flats
    are partially inundated in winter, but dry in summer. The plant-available soil
    P concentration on both flats is higher than that on the dune (Gao et al., 2020;
    Liu et al., 2023). ^p We selected 12 species from Proteaceae, Fabaceae, Myrtaceae
    and Ericaceae that are common in the reserve, representing species with contrasting
    root traits and P-acquisition strategies, and occurring across habitats with differing
    soil total [P] (Table 1; Figure 1a). We randomly selected five plants of each
    species at each location (Figure 1a). Six of the selected species only grow at
    one of the two locations (Table 1; Figure 1a). Based on the premise that leaf
    [Mn] is a proxy for rhizosphere carboxylates, we selected Banksia telmatiaea,
    which has cluster roots that release carboxylates and therefore high leaf [Mn],
    as the positive reference for leaf [Mn] comparisons. Xanthorrhoea preissii, which
    is known not to release carboxylates and therefore typically has low leaf [Mn]
    (Wang, Yan, et al., 2025; Zhong et al., 2021), was selected as the negative reference.
    ^p 2.2 Volumetric soil water content and soil temperature ^p To characterise the
    microclimate of the east flat, west flat and Bassendean dune, four TMS-4 microclimate
    data loggers (TOMST) were installed in November 2022 (Figure 1a). Each datalogger
    recorded soil volumetric water content (5-10 cm deep; SWC), soil temperature (6
    cm deep; T1) and air temperature (2 and 15 cm above the ground; T2 and T3) every
    15 min. We selected the SWC and soil temperature data for September 2023, the
    same month in the year following this study, to assess the differences among these
    sites. ^p 2.3 Leaf and soil collection ^p Leaf samples were collected from all
    species on clear days at about 10 AM in early spring (September 2022). We chose
    undamaged, fully expanded mature leaves from at least three branches of the five
    plants for each species. Leaf samples were collected in aluminium foil and immediately
    submerged in liquid nitrogen. Samples were then transferred to the laboratory
    and stored at -80°C for subsequent analyses. ^p Bulk soil and rhizosphere soil
    were collected. Bulk soil samples were collected after removing the litter layer
    by removing three cores of the top 150 mm of soil within 300 mm from the stem
    of each plant, positioned within the canopy area but avoiding the structural root
    zone. The three soil cores were pooled and mixed to give one bulk soil sample
    per plant. Moist rhizosphere soil samples were collected by carefully digging
    out roots at the base of a target plant with a trowel, removing any adhered bulk
    soil by hand, followed by gently shaking soil adhering to the root surface into
    a zip-lock bag (Mo et al., 2023). A portion of both the fresh bulk soil and fresh
    rhizosphere soil was sieved (<2 mm) to measure acid phosphatase activity within
    1 day of collection. The remaining samples were weighed to determine fresh weight
    and dried at 40°C for 7 days before recording the dry weight. Air-dried soil was
    stored in plastic bags after sieving (<2 mm) for P analyses.
  original_file: in raw data folder
  notes: As the soil properties are linked to individual plants, they have been mapped in as plot contexts rather than as site properties.
