questions:
  question_1: NOTE, the species "Hypocalymma suave" is a recent name update that is not yet in the AusTraits master list. It will be properly recognised at the time of the next release. I assume "Leucopogon sp. (C. Tauss 5646)" is a phrase name, but it is not one listed in APC/APNI - I've looked for all names with "Tauss" and "5646". I am leaving it as "unknown" for now.
  question_2: Note, as the soil properties are linked to individual plants rather than truly being "location properties", I mapped them as plot contexts, where each value is linked to a specific plant, rather than as site properties. I could alternatively have a separate "site name" for each row of data, but this seemed less meaningful.
