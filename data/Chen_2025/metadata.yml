traits:
- var_in: Leaf [P] (mg/g)
  unit_in: mg/g
  trait_name: leaf_P_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Frozen leaf samples were freeze dried for 7 days to remove all water (VirTis
    Benchtop 'K'; New York, USA). Freeze-dried leaf samples were finely ground (Geno/Grinder,
    Spex SamplePrep, Metuchen, NJ, USA) using zirconium beads. Leaf [P] and [Mn] were
    measured using ICP-OES (Model 5300DV, Perkin Elmer, Shelton, CT, USA) after acid
    digestion (Zarcinas et al., 1987). Aliquots of 100 mg dried leaves were digested
    in 3 mL concentrated HNO3 at 90°C-100°C until foaming was finished and particulate
    material dissolved and then digested with 0.5 mL of HClO4 at 120°C-140°C, followed
    by reheating at 160°C-180°C for 10 min to dehydrate crystals. Crystals were dissolved
    in Milli-Q water to a final volume of 10 mL. Leaf [Mn] data of the negative reference
    species, X. preissii, were provided by Jun Wasaki (unpublished).
- var_in: Leaf [Mn] (mg/g)
  unit_in: mg/g
  trait_name: leaf_Mn_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Frozen leaf samples were freeze dried for 7 days to remove all water (VirTis
    Benchtop 'K'; New York, USA). Freeze-dried leaf samples were finely ground (Geno/Grinder,
    Spex SamplePrep, Metuchen, NJ, USA) using zirconium beads. Leaf [P] and [Mn] were
    measured using ICP-OES (Model 5300DV, Perkin Elmer, Shelton, CT, USA) after acid
    digestion (Zarcinas et al., 1987). Aliquots of 100 mg dried leaves were digested
    in 3 mL concentrated HNO3 at 90°C-100°C until foaming was finished and particulate
    material dissolved and then digested with 0.5 mL of HClO4 at 120°C-140°C, followed
    by reheating at 160°C-180°C for 10 min to dehydrate crystals. Crystals were dissolved
    in Milli-Q water to a final volume of 10 mL. Leaf [Mn] data of the negative reference
    species, X. preissii, were provided by Jun Wasaki (unpublished).
