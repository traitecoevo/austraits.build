contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: Pollinator taxon name
- context_property: pollinator count
  category: treatment_context
  var_in: No. of visitors
traits:
- var_in: Pollinator match value
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: During canola flowering, timed observations were made of insect visitors
    along transects at 20 m and 100 m into the canola crop (Methods). Insects that
    landed on and contacted a flower were recorded as visitors, categorised as far
    as possible to species using morphological identification; contact with reproductive
    structures and pollen transfer were not confirmed for these field records.
