dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::mutate(
        `Pollinator match column` = dplyr::case_when(
          `Animal species binomial name` == "Apis mellifera" ~ "Animal species binomial name",
          `Animal genus` %in% c("Exoneura", "Braunsapis", "Amegilla", "Bombus", "Xylocopa", "Tetragonula", "Austroplebeia") ~ "Animal genus",
          `Animal family` %in% c("Calliphoridae", "Calliphorinae", "Syrphidae", "Colletidae", "Halictidae", "Ichneumonidae", "Formicidae", "Vespidae", "Bombyliidae") ~ "Animal family",
          `Animal order` %in% c("Coleoptera", "Coleoptear", "Lepidoptera", "Hemiptera", "Hymenoptera", "Diptera") ~ "Animal order",
          TRUE ~ NA_character_
        ),
        `Pollinator match value` = dplyr::case_when(
          `Animal species binomial name` == "Apis mellifera" ~ `Animal species binomial name`,
          `Animal genus` %in% c("Exoneura", "Braunsapis", "Amegilla", "Bombus", "Xylocopa", "Tetragonula", "Austroplebeia") ~ `Animal genus`,
          `Animal family` %in% c("Calliphoridae", "Calliphorinae", "Syrphidae", "Colletidae", "Halictidae", "Ichneumonidae", "Formicidae", "Vespidae", "Bombyliidae") ~ `Animal family`,
          `Animal order` %in% c("Coleoptera", "Coleoptear", "Lepidoptera", "Hemiptera", "Hymenoptera", "Diptera") ~ `Animal order`,
          TRUE ~ NA_character_
        ),
        `Pollinator taxon name` = dplyr::case_when(
          is.na(`Animal genus`) & is.na(`Animal family`) ~ `Animal order`,
          is.na(`Animal genus`) ~ `Animal family`,
          stringr::str_detect(`Animal species binomial name`, stringr::regex("\\bsp\\.?\\b", ignore_case = TRUE)) ~ `Animal genus`,
          TRUE ~ `Animal species binomial name`
        ),
        location_name = dplyr::case_when(
          `Latitude (S)` == "-34.2742171" ~ "Cummins 1",
          `Latitude (S)` == "-34.30753" ~ "Cummins 2",
          `Latitude (S)` == "-33.746834" ~ "Jerdacuttup 1",
          `Latitude (S)` == "-33.7785556" ~ "Jerdacuttup 2",
          `Latitude (S)` == "-33.4711076" ~ "West River 1",
          `Latitude (S)` == "-33.5537092" ~ "West River 2",
          `Latitude (S)` == "-33.6225234" ~ "West River 3",
          `Latitude (S)` == "-34.126227" ~ "Yeelanna 1",
          `Latitude (S)` == "-34.1526001" ~ "Yeelanna 2",
          `Latitude (S)` == "-34.15638889" ~ "Yeelanna 3",
          TRUE ~ `Nearest named place`
        ),
        Date = util_parse_collection_date(Date)
      )
  '
  collection_date: Date
  taxon_name: Plant scientific name
  location_name: location_name
  description: To determine the relative contribution of insect abundance, diversity
    and taxonomic identity (versus the introduced honeybee specifically) to canola
    yield, and how semi-natural vegetation in the surrounding landscape affects wild
    insect visitation to canola crops.
  basis_of_record: field field_experiment
  life_stage: adult
  sampling_strategy: Canola is a major oilseed crop and benefits from insect pollination.
    The relative role of insect abundance, diversity, and roles of particular taxonomic
    groups however have been little explored. In Australia, it has been assumed that
    the introduced honey bee Apis mellifera is the pollinators of canola, which has
    lead to concerns about pollination in the wake of incursion of the parasitic mite
    Varroa destructor in Australia. Wild insects are also facing declines, and therefore
    landscape management such as semi-natural vegetation retention near crops, may
    help increase pollinator populations. To disentangle the contribution of insects
    to canola yield, and the role of semi-natural vegetation in the landscape we conducted
    caged experiments and pollinator observations over two years across 44 farms in
    New South Wales, Western Australia and South Australia. We compared canola yield
    components (seed weight, pod number, seeds per pod, and 1000-grain weight) from
    five plants harvested from quadrats with and without pollination exclusion cages
    along three transects each 20 m and 100 m into the canola crop. During canola
    flowering along these transects within a quadrat, timed observations were made
    of insect visitors.
  original_file: data.csv is derived from a subset of the records in Prendergast's big dataset, which differs somewhat from that archived on Zenodo (Prendergast et al., Zenodo, doi:10.5281/zenodo.22095100)
    -- specifically the plant-insect visitation records for the canola fields and
    surrounding vegetation component of that project.
  notes: none
identifiers: .na
