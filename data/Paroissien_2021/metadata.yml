dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(!trait_name %in% c("proportion_plants_flowering", "fruits_per_flowering_plant", "seed_carbohydrate_per_seed_dry_mass", "life_history", "plant_growth_form")) |>
      dplyr::mutate(
        basis_of_record = dplyr::case_when(
          !stringr::str_detect(source, "^Paroissien_2021") ~ "literature",
          trait_name %in% c("seed_germination", "seed_germination_time", "seed_germination_treatment", "seed_protein_per_seed_dry_mass", "seed_oil_per_seed_dry_mass") ~ "lab",
          TRUE ~ "field"
        )
      )
  '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait_name
  value: value
  location_name: location_name
  description: To determine whether the season in which a fire occurs affects the
    reproductive success of the post-fire flowering Doryanthes excelsa, including flowering,
    seed production, seed provisioning and germination, independently of fire severity.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: 'We conducted field sampling within and just outside the Royal
    and Heathcote National Parks (34° 04′ 30′′ S, 151° 34′ 24′′ E, 34° 07′ 49′′ S,
    150° 58′ 17′′ E) located on the south east coast of NSW in June 2020. We selected
    sites from maps supplied by the NSW Department of Planning Industry and Environment,
    showing history of burnt areas in NSW. The aim of the experimental design was to
    enable comparison of post-fire reproductive response between burnt and unburnt
    sites, and between sites burnt in different seasons. Sites were selected from across
    multiple years to achieve sufficient replication across burn season. ^p Sites were
    chosen based on season (via month) of last burn and the presence of D. excelsa.
    The characteristics of each site was also assessed to maintain consistency by ensuring
    similar vegetation and abiotic features. To control for fire history, we ensured
    that the penultimate fire experienced at each site occurred at a similar time.
    This meant that prior to the burn surveyed, fires had occurred in the 2001/2002
    fire season for all but one of the 15 sites (Table 1). All sites occurred on shallow
    infertile soils with underlying Triassic Hawkesbury Sandstone. Qualitative data
    including elevation, vegetation type, species present, whether D. excelsa occurred
    on ridges, slopes or in gullies, and canopy cover were recorded. Sites were primarily
    dry sclerophyll forest, with canopy species dominated by Angophora costata, Corymbia
    gummifera, Eucalyptus sieberi and Eucalyptus punctata (Nash, 1996; Tozer et al.,
    2017). Dominant families in the understorey included Proteaceae, Myrtaceae, Fabaceae,
    and Orchidaceae, and also included species that share a similar post-fire-flowering
    life-history such as Telopea speciosissima and Xanthorrhoea australis (Nash, 1996;
    Tozer et al., 2017). Climate is humid subtropical (using the Köppen Climate Classification
    Cfa). Rainfall in the region is aseasonal with maximum temperatures averaging 26
    °C in February and 15.8 °C in July (Bureau of Meteorology, 2020a). Dry sclerophyll
    forests are fire-prone, historically experiencing fires every 10–30 years during
    warm months (November to March). However, prescribed fires (i.e. for management
    such as hazard reduction) are implemented outside of these times in the cooler
    months (Williams et al., 2001; Tozer et al., 2017). ^p Sites were split based on
    moisture (dry versus wet sites) using GIS layers of streams, as classified by the
    Strahler system (NSW Department of Industry, 2018), overlayed onto fire history
    maps. The closest branch of the river within the burnt site was recorded; if this
    stemmed off a higher river close by within the burn, the higher river was recorded.
    If no stream line occurred in the burn site, the nearest was recorded. This was
    paired with data collected from sites on the streams, soil, slope and vegetative
    coverage to determine sites as either ‘wet’ or ‘dry’. Sites were dry if the closest
    stream was classified as “1” by the Strahler system (i.e. ephemeral streams) (NSW
    Department of Industry, 2018). Sites were also determined dry if mapped streams
    were completely dry at the time of sampling. ^p Sites were selected from a mixture
    of large and small fires, and prescribed burns and naturally occurring fires. Fires
    usually resulted in a mosaic of complex patterns, in which large areas may burn
    over multiple days and have significant variation in intensities, due to changes
    in weather and topography (Christensen et al., 1981; Hammill and Bradstock, 2006;
    Werner, 2012). Therefore, we sampled multiple sites within large burnt areas. This
    was not done for small burnt areas, as these burnt areas were more homogenous.
    Sampling was also conducted in unburnt sites adjacent to each burnt site, as a
    control. ^p Reproductive effort was estimated by counting the number of flowering
    stems and seed pods produced by plants at each site. It was possible to estimate
    flowering effort for the first season or two after fire as D. excelsa plants retain
    their flowering stems for many years, and have been noted to produce most flowering
    post-fire (Nash, 1996). The colour of the flowering stems also provided a clear
    record of age of the flowering event. Green and brown stems represented flowering
    in the current season (stems take approximately six to nine months to change from
    green to a smooth brown colour – Paroissien unpubl. data). Weathered grey stems
    were greater than two seasons old. ^p We used the 15 identified burnt sites and
    15 nearby unburnt sites to investigate the effects of fire on the proportion of
    plants flowering and the number of seed pods produced (reproductive effort). At
    each site, a 50-metre transect was laid down within the D. excelsa population,
    at least 200 m in from the roadside, with the transect running perpendicular to
    the slope. We sampled D. excelsa individuals if their base occurred in a zone 5
    m either side of the transect. For each transect, a minimum of 20 individuals were
    measured. The number of distinct whorls was recorded, and plants were considered
    the same individual (linked by ramets) if they were within 0.5 m of each other,
    to avoid sampling clonal individuals. We measured the diameter of the base and the
    length of the longest leaves, using a tape measure. ^p To assess the effects of
    season of burn on seed and germination traits, we collected 1–3 ripe seed pods
    per individual from 7-10 individuals along each transect from two sites for each
    of two seasons (summer, spring) (Table 1). Seed pods appeared ripe if the pod had
    started to crack at the top. Collection was carried out using a tree pruner to
    cut individual pods from the inflorescence, before ballistic dispersal occurred.
    A minimum of 30 seeds per site was weighed and, for full seed pods, number of seeds
    per pod counted. Seeds were then used for either a germination experiment or for
    nutrient analysis.'
  original_file: Values transcribed from the text, Table 1 and Table 2 of the primary
    publication; details of the 15 burnt sites (Table 1) are in raw/location_data.csv.
  notes: data.csv is a long-format transcription of every trait value reported in
    the paper. The paper reports values pooled across sites (by fire treatment, season
    of burn and wet versus dry sites), so field and seed values are mapped as metapopulation
    values for the Royal and Heathcote National Parks. Additional traits include proportion_plants_flowering, fruits_per_flowering_plant, and seed_carbohydrate_per_seed_dry_mass.
