questions:
  question1: The paper gives 34° 04′ 30′′ S, 151° 34′ 24′′ E and 34° 07′ 49′′ S, 150°
    58′ 17′′ E for the national parks; 151° 34′ 24′′ E is offshore, and that value is corrected to 151° 04′ 24′′ E. (A midpoint of these points is then used as the site coordinates.)
