    elevation (m): 25-390
    geology (stratigraphic map unit): Triassic Hawkesbury Sandstone
    climate description: humid subtropical
    georeference remarks: coordinates are the midpoint of the two coordinates in the paper.
    state: NSW
contexts:
- context_property: season of burn
  category: treatment_context
  var_in: burn_season
  values:
  - value: spring
    description: Sites burnt in August to October.
  - value: summer
    description: Sites burnt in December to February.
  - value: autumn
    description: Sites burnt in April to June.
  - find: spring; summer
    value: spring and summer
    description: Sites burnt in spring or in summer (pooled).
- context_property: site moisture
  category: plot_context
  var_in: site_moisture
  values:
  - value: wet
    description: Sites near permanent streams that were not
      dry at the time of sampling.
  - value: dry
    description: Sites whose closest stream was ephemeral or whose
      mapped streams were dry at the time of sampling.
traits:
- var_in: seeds_per_fruit
  unit_in: '{count}/{count}'
  trait_name: seeds_per_fruit
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'A minimum of 30 seeds per site was weighed and, for full seed pods,
    number of seeds per pod counted.'
- var_in: seed_germination
  unit_in: '{count}/{count}'
  trait_name: seed_germination
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Seeds from individual pods were pooled for each site, two representing
    summer and two representing spring burns. Four replicates of 20 seeds were sown
    onto filter paper (Whatmans No. 42) in 15 cm petri dishes for each fire season x
    site collection and sealed with plastic film. Dishes were watered as required to
    maintain a moist substrate. Germination experiments were conducted in a Memmert
    incubator (model: Peltier Incubator IPP110plus) set at 12/12 light/dark hour
    cycles, at 25 °C for day, 15 °C for night to replicate approximate temperatures
    experienced in sampled study sites during periods of germination (March, April).
    Seeds were checked every day until germination rates decreased to less than one
    germination per two weeks and terminated after approximately eight weeks.
    Germination was assessed on the presence of a radicle. Total germination was
    calculated based on the number of germinants divided by the number of viable
    seeds used.'
- var_in: seed_germination_time
  unit_in: wk
  trait_name: seed_germination_time
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Seeds from individual pods were pooled for each site, two representing
    summer and two representing spring burns. Four replicates of 20 seeds were sown
    onto filter paper (Whatmans No. 42) in 15 cm petri dishes for each fire season x
    site collection and sealed with plastic film. Dishes were watered as required to
    maintain a moist substrate. Germination experiments were conducted in a Memmert
    incubator (model: Peltier Incubator IPP110plus) set at 12/12 light/dark hour
    cycles, at 25 °C for day, 15 °C for night to replicate approximate temperatures
    experienced in sampled study sites during periods of germination (March, April).
    Seeds were checked every day until germination rates decreased to less than one
    germination per two weeks and terminated after approximately eight weeks.
    Germination was assessed on the presence of a radicle. Germination rate (speed)
    was estimated using the time taken to reach 50 % of seeds germinated (T50),
    calculated using the ‘drc’ package in R studio (RStudio Team, 2015; Ritz and
    Strebig, 2016).'
- var_in: seed_germination_treatment
  unit_in: .na
  trait_name: seed_germination_treatment
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Seeds from individual pods were pooled for each site, two representing
    summer and two representing spring burns. Four replicates of 20 seeds were sown
    onto filter paper (Whatmans No. 42) in 15 cm petri dishes for each fire season x
    site collection and sealed with plastic film. Dishes were watered as required to
    maintain a moist substrate. Germination experiments were conducted in a Memmert
    incubator (model: Peltier Incubator IPP110plus) set at 12/12 light/dark hour
    cycles, at 25 °C for day, 15 °C for night to replicate approximate temperatures
    experienced in sampled study sites during periods of germination (March, April).
    Seeds were checked every day until germination rates decreased to less than one
    germination per two weeks and terminated after approximately eight weeks.
    Germination was assessed on the presence of a radicle. ^p Seeds were germinated
    without a dormancy-breaking pre-treatment.'
- var_in: seed_protein_per_seed_dry_mass
  unit_in: '%'
  trait_name: seed_protein_per_seed_dry_mass
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Seeds were tested for nitrogen with an Elementar varioMACRO cube (CHNS)
    by XRF Laboratory, Solid State and Elemental Analysis Unit at the UNSW Mark
    Wainwright Analytical Centre. Three seeds from five plants per site (as
    allocated for germination) (n = 15 seed per site) were analysed for nitrogen.
    The samples were placed into tin foil into the varioMACRO cube, combusted at
    1150 °C, and the gases produced were analysed to record nitrogen (Elementar
    Analysensysteme GmbH, 2017). Crude protein was then calculated by multiplying
    nitrogen content by the assumed factor 6.25 (AOAC, 2002) for each seed.'
- var_in: seed_oil_per_seed_dry_mass
  unit_in: '%'
  trait_name: seed_oil_per_seed_dry_mass
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Seeds were tested for total lipid and carbohydrate content by the
    Faculty of Engineering UNSW. The seed coat was removed using a scalpel to
    provide a more accurate analysis of seed provisioning, and three lots of 2 g of
    seeds were weighed out for each site (as allocated for germination) for
    carbohydrates and total lipid. Lipid was calculated using method 925.12 as
    outlined by AOAC International (AOAC, 2002).'
- var_in: post_fire_flowering
  unit_in: .na
  trait_name: post_fire_flowering
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'We used the 15 identified burnt sites and 15 nearby unburnt sites to
    investigate the effects of fire on the proportion of plants flowering and the
    number of seed pods produced (reproductive effort). ^p A percentage flowering at
    each site was estimated using the number of stems as described above over the
    total number of individuals at each site. ^p Values compare the proportion of
    plants flowering at burnt and unburnt sites, separately for wet and dry sites.'
- var_in: flowering_time
  unit_in: .na
  trait_name: flowering_time
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'From our observations of D. excelsa, development of the flower stem
    appears predominantly in winter with peak flowering mid-spring (October) and
    development of seeds late summer/early autumn, though this may vary. ^p We
    derived an estimate of when inflorescences emerged during the flowering season
    from the colour of the flower stem. Green stems commonly possessed
    inflorescences that had not yet bloomed. As sites were surveyed during June (our
    southern hemisphere early winter), we deemed green stems as having flowered
    recently (i.e. autumn or early winter, approximately April to June) compared to
    brown stems that had undergone weathering. Brown stems predominantly contained
    inflorescences with seed pods that had already opened. Stems took approximately
    six to nine months to turn brown (R. Paroissien, pers. obvs), so brown stems
    were deemed as having flowered either in early or during peak flowering, the
    previous spring (approximately October). ^p Values give the flowering months
    indicated by stem colour at sites burnt in each season.'
- var_in: fruiting_time
  unit_in: .na
  trait_name: fruiting_time
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'From our observations of D. excelsa, development of the flower stem
    appears predominantly in winter with peak flowering mid-spring (October) and
    development of seeds late summer/early autumn, though this may vary. ^p Seed
    pods appeared ripe if the pod had started to crack at the top.'
- var_in: dispersal_syndrome
  unit_in: .na
  trait_name: dispersal_syndrome
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Fruits are loculicidal capsules which as they ripen, dry out, eventually
    ejecting the seeds (Nash, 1996) (Fig. 1a). Seeds are large and papery forming a
    wing that facilitates wind dispersal (Nash, 1996; Denham and Auld, 2002) (Fig.
    1b). ^p Collection was carried out using a tree pruner to cut individual pods
    from the inflorescence, before ballistic dispersal occurred.'
- var_in: leaf_length
  unit_in: mm
  trait_name: leaf_length
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Doryanthes excelsa Correa (family: Doryanthaceae), is a large perennial
    herb (Fig. 1), with a basal rosette of ensiform leaves up to 3 m in length and
    15 cm wide (Nash, 1996; Dimech et al., 2009) (Fig. 1d).'
- var_in: leaf_width
  unit_in: mm
  trait_name: leaf_width
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Doryanthes excelsa Correa (family: Doryanthaceae), is a large perennial
    herb (Fig. 1), with a basal rosette of ensiform leaves up to 3 m in length and
    15 cm wide (Nash, 1996; Dimech et al., 2009) (Fig. 1d).'
- var_in: plant_height_reproductive
  unit_in: m
  trait_name: plant_height_reproductive
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'The inflorescence occurs at the end of a scape varying in length from
    1.5 m to over 8 m, with many individual leaves (Nash, 1996).'
- var_in: flowers_per_inflorescence
  unit_in: '{count}/{count}'
  trait_name: flowers_per_inflorescence
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Inflorescences may contain up to 30 pinkish-red flowers, which occur in
    a compact raceme (Newman, 1928) (Fig. 1c).'
- var_in: inflorescence_type
  unit_in: .na
  trait_name: inflorescence_type
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Inflorescences may contain up to 30 pinkish-red flowers, which occur in
    a compact raceme (Newman, 1928) (Fig. 1c).'
- var_in: fruit_type
  unit_in: .na
  trait_name: fruit_type
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Fruits are loculicidal capsules which as they ripen, dry out, eventually
    ejecting the seeds (Nash, 1996) (Fig. 1a).'
- var_in: fruit_dehiscence
  unit_in: .na
  trait_name: fruit_dehiscence
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Fruits are loculicidal capsules which as they ripen, dry out, eventually
    ejecting the seeds (Nash, 1996) (Fig. 1a).'
- var_in: dispersal_appendage
  unit_in: .na
  trait_name: dispersal_appendage
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Seeds are large and papery forming a wing that facilitates wind
    dispersal (Nash, 1996; Denham and Auld, 2002) (Fig. 1b).'
- var_in: vegetative_reproduction_ability
  unit_in: .na
  trait_name: vegetative_reproduction_ability
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Doryanthes excelsa may also reproduce clonally (Nash, 1996).'
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Doryanthes excelsa resprouts after fire from underground buds, a process
    that can be quick with large amounts of biomass produced within weeks of a fire
    event (see Environment Recovery Project for examples; Kirchhoff et al., 2021).'
- var_in: bud_bank_location
  unit_in: .na
  trait_name: bud_bank_location
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Doryanthes excelsa resprouts after fire from underground buds, a process
    that can be quick with large amounts of biomass produced within weeks of a fire
    event (see Environment Recovery Project for examples; Kirchhoff et al., 2021).'
- var_in: fire_time_from_fire_to_flowering
  unit_in: mo
  trait_name: fire_time_from_fire_to_flowering
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Flowering post-fire may take a year and a half to occur, and release of
    seeds may not occur for another six months (Denham and Auld, 2002).'
- var_in: fire_time_from_fire_to_fruiting
  unit_in: mo
  trait_name: fire_time_from_fire_to_fruiting
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'Flowering post-fire may take a year and a half to occur, and release of
    seeds may not occur for another six months (Denham and Auld, 2002).'
- var_in: reproductive_maturity
  unit_in: a
  trait_name: reproductive_maturity
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'It is estimated that seedlings take up to 10 years to reach maturity
    (Dimech et al., 2009) and attain fire resistance within seven years (Denham,
    2007).'
- var_in: resprouting_capacity_time_from_germination
  unit_in: a
  trait_name: resprouting_capacity_time_from_germination
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'It is estimated that seedlings take up to 10 years to reach maturity
    (Dimech et al., 2009) and attain fire resistance within seven years (Denham,
    2007).'
- var_in: seed_dormancy_class
  unit_in: .na
  trait_name: seed_dormancy_class
  entity_type: entity_type
  value_type: value_type
  basis_of_value: basis_of_value
  replicates: replicates
  methods: 'The longer time taken could be a result of bet hedging, in which
    staggering the germination over weeks may increase success if environmental
    conditions are not suitable, especially given the lack of dormancy in the
    species (Letnic et al., 2000; Denham and Auld, 2002).'
substitutions: .na
taxonomic_updates: .na
