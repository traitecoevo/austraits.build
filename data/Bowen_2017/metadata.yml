exclude_observations: .na
questions:
  question1: The paper does not give sampling dates. In what years were the field
    seedlings collected and the glasshouse plants grown?
  question2: Table 1 gives collection locations as town names (e.g. Yanchep, Eneabba,
    Denmark, Albany). Do you have coordinates or more specific site names for these
    collections? Were the Yanchep, Eneabba and Denmark plants collected at the same
    sites as in Pate et al. (1990, Annals of Botany 65, 585-601), i.e. Banksia woodland
    at Yanchep, Banksia shrubland at Eneabba and coastal heath at Parry's Inlet, Denmark?
  question3: Where was the glasshouse in which the 34 glasshouse-grown species were
    raised?
  question4: The root starch assays (Table 1, mg/g) for Banksia grandis, B. hookeriana,
    B. ilicifolia, Hakea obliqua, H. prostrata, H. varia and Stirlingia tenuifolia
    are the same, to rounding, as the root starch values in Pate et al. (1990). Were
    these assays made on the same plants as that study?
  question5: Is the ORCID iD 0000-0003-3662-5566 (Barbara J Bowen) yours?
