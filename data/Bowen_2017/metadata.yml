  dataset:
    key: Bowen_2017
    bibtype: Article
    year: 2017
    author: Barbara J. Bowen and John S. Pate
    title: 'Patterns of storage tissue and starch distribution in the young taproot
      of obligate seeders and resprouters of Australian Proteaceae (Juss.): possible
      evidence of homoplastic evolution'
    journal: Austral Ecology
    volume: 42
    number: 5
    pages: 617--629
    doi: 10.1111/aec.12481
contributors:
  data_collectors:
  - last_name: Bowen
    given_name: Barbara
    ORCID: .na
    affiliation: School of Veterinary and Life Sciences, Murdoch University, Western
      Australia, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(is.na(omit_duplicate) | omit_duplicate == "")
    '
  collection_date: 2017
  taxon_name: taxon_name
  trait_name: trait
  value: value
  location_name: location_name
  description: To determine whether the size and distribution of root storage parenchyma
    and the magnitude of root starch reserves in young Proteaceae differ between obligate
    seeders and resprouters, and whether patterns of storage tissue within genera
    suggest homoplastic evolution of fire response in the family.
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: The root anatomy of 93 Australian species of Proteaceae was
    investigated; 42 seeder and 51 resprouter species from 12 genera, Adenanthos,
    Banksia (including species originally under the name Dryandra), Conospermum,
    Grevillea, Hakea, Isopogon, Lambertia, Petrophile, Stirlingia, Strangea and Synaphea.
    Of the total, 59 species were collected from locations in Western Australia including
    the far north (three species), central (15 species) and southern (41 species)
    region and 34 species were grown in the glasshouse from seeds collected from natural
    habitats including 23 from Western Australia and 11 from eastern Australia (see
    Table 1 for species list, strategy and source). Glass house plants were grown
    in white quartz sand for 18-24 months with monthly additions of 1:200 dilution
    of a solution containing 0.125 ppm N, 0.125 ppm K and 0.0025 ppm P (recommended
    by The Department of Agriculture, Western Australia) and modified Hoagland's solution
    (Bonner & Galston 1952). ^p Plants were authenticated as obligate seeders (no
    evidence of resprouting in burnt parent plants) or resprouters (ability of burnt
    parent plants to recover from epicormic buds) based on observations of their response
    to fire and substantiated by online databases (Department of Environment n.d.;
    Department of Parks and Wildlife n.d.) and references (George 1981, 1984; Sainsbury
    1987, 1991; Orchard 1995; Groom & Lamont 1996; Paczkowska & Chapman 2000; Wheeler
    et al. 2002; Herath & Lamont 2009). All species collected in the field were from
    sites that had been burnt between 2 and 4 years previously. For both resprouter
    and seeder species, only unburnt seedlings that had germinated following the fire
    were selected so that their growth history would be similar and to remove the
    possibility of changes in starch deposition as a response to fire in resprouters
    rather than initial genetic predisposition. Plants were between approximately
    2 and 4 years of age based on post-fire germination for plants collected in the
    field, or time from germination for glasshouse plants. ^p Two individuals of each
    species were excavated to 200 mm in depth. Sections of root 5 mm in length were
    taken between 20 and 60 mm below the soil surface from the principal (tap) root
    of each seedling and immediately fixed in 5% glutaraldehyde (in buffered 0.1 mol
    L-1 phosphate, pH 7.0) before embedding and sectioning. Where the principal taproot
    was greater than 15 mm diameter, samples were taken from a major lateral root
    at a similar depth. Additional root material from a selection of these study species,
    including 15 resprouter and 8 seeder species (across eight genera), was collected
    and oven dried at 90°C for chemical analysis of starch content.
  original_file: raw/trait_data.csv (transcribed from Tables 1 and 3 and the text
    of the published article)
  notes: Additional traits,
    root_storage_parenchyma_fraction (cortex plus ray parenchyma, % of cross-sectional
    area), root_starch_area_fraction (% of cross-sectional area occupied by stained
    starch granules, for the whole cross-section and, for Stirlingia latifolia, Stirlingia
    tenuifolia and Lambertia multiflora, separately for cortex, ray and xylem parenchyma),
    root_cortex_fraction, root_ray_parenchyma_fraction and root_ray_count (rays extending
    at least half the radius of the stele). The root starch
    assay (mg/g) values for Banksia grandis, Banksia hookeriana, Banksia ilicifolia,
    Hakea obliqua, Hakea prostrata, Hakea varia and Stirlingia tenuifolia equal, to
    rounding, the values already in Pate_1990 (same laboratory, sites and assay),
    so they are marked omit_duplicate = Pate_1990 and filtered. resprouting_capacity
    is linked to the collection site for field-collected species and is species-level
    for glasshouse-grown species; post_fire_recruitment is scored only for field-collected
    species, whose sampled seedlings had germinated after the fire at the collection
    site. Conospermum triplinervium and Grevillea pteridifolia are marked in Table
    1 as resprouter ecotypes (fire_response_ecotype column).
