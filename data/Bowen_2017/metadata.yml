traits:
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Plants were authenticated as obligate seeders (no evidence of resprouting
    in burnt parent plants) or resprouters (ability of burnt parent plants to recover
    from epicormic buds) based on observations of their response to fire and substantiated
    by online databases (Department of Environment n.d.; Department of Parks and Wildlife
    n.d.) and references (George 1981, 1984; Sainsbury 1987, 1991; Orchard 1995; Groom
    & Lamont 1996; Paczkowska & Chapman 2000; Wheeler et al. 2002; Herath & Lamont
    2009).
- var_in: post_fire_recruitment
  unit_in: .na
  trait_name: post_fire_recruitment
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: All species collected in the field were from sites that had been burnt
    between 2 and 4 years previously. For both resprouter and seeder species, only
    unburnt seedlings that had germinated following the fire were selected so that
    their growth history would be similar and to remove the possibility of changes
    in starch deposition as a response to fire in resprouters rather than initial
    genetic predisposition. ^p Records the presence of seedlings that germinated after
    the fire at each field collection site.
- var_in: root_starch_per_mass
  unit_in: mg/g
  trait_name: root_starch_per_mass
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: replicates
  methods: Additional root material from a selection of these study species, including
    15 resprouter and 8 seeder species (across eight genera), was collected and oven
    dried at 90°C for chemical analysis of starch content. ^p Assayed starch concentrations
    were determined for 15 resprouter and 8 seeder species for comparison with, and
    to confirm the validity of starch measurements based on Assess 2.0 image analysis.
    The assay was carried out in duplicate on the combined dried, finely ground (0.1
    mm mesh) root material of the same specimens used for anatomical preparations
    (see Table 1 for species used). Starch was extracted from 0.1 g aliquots of dry
    matter in perchloric acid and precipitated with iodine (Pucher et al. 1948). The
    starch was re-dissolved in dilute perchloric acid and assayed using the phenol
    method (Dubois et al. 1956). Concentrations were measured with a 'Spectronic 20'
    spectrophotometer (Bausch and Lomb) at a wavelength of 490 nm. Each determination
    involved two replicate assays and each batch was calibrated against starch standards
    (potato starch; Sigma Chemical Company, USA).
