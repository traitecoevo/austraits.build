  life_stage: adult
  description: Floral morphology, buzz pollination and bee-visitor observations of
    four Conostephium (Epacridaceae) species in south-west Western Australia, with
    detailed phenology, pollination and fruit-set data for C. pendulum at Murdoch,
    Perth.
  sampling_strategy: Incidental and opportunistic observations of bee activity on
    flowers of four Conostephium species were made at various times and locations
    (Toolinna Cove 1984; Barracca Nature Reserve and Kalbarri National Park 1999).
    Bees observed sonicating flowers were sometimes captured and identified by T.
    F. Houston (Western Australian Museum); pollen was scraped from the scopae of
    captured bees, mounted in glycerine jelly and identified/counted microscopically
    against reference pollen from Conostephium and other locally visited plants. At
    a separate, more intensively studied population of C. pendulum in a Perth suburb
    (Murdoch), flower phenology was tracked from the mature bud stage to corolla abscission;
    pollen tubes were examined in styles fixed in FAA, cleared in NaOH, stained with
    aniline blue and viewed under UV fluorescence, from flowers sampled opportunistically
    on 29 August 1999; and fruit set was quantified on marked branches counted on
    29 August and again on 9 October 1999.
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: data for additional traits, style_elongation_time, corolla_expansion_time,
    proportion_fruit_set, proportion_stigmas_with_pollen_tubes, proportion_styles_with_pollen_tubes_half_length,
    proportion_styles_with_pollen_tubes_to_base, pollen_grains_per_stigma, flower_tube_diameter, flower_style_length_exserted
