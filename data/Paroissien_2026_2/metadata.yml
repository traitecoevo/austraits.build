contexts:
- context_property: fire severity
  category: plot_context
  var_in: Severity
  values:
  - find: Unburnt
    value: unburnt
    description: Not burnt in the 2019/2020 fires.
  - find: Moderate
    value: moderate
    description: Burnt at moderate severity in the 2019/2020 fires, with a partially
      burnt canopy.
  - find: High
    value: high
    description: Burnt at high severity in the 2019/2020 fires, with a completely
      burnt canopy.
  - find: Extreme
    value: extreme
    description: Burnt at extreme severity in the 2019/2020 fires, with a completely
      consumed canopy.
- context_property: fire interval class
  category: plot_context
  var_in: FireIntervalGroups
  values:
  - find: low frequency, long interval
    value: long interval
    description: Burnt once or not at all since 1963, with a most recent fire interval
      of 60+ years.
  - find: moderate frequency, moderate interval
    value: moderate interval
    description: Burnt 3 or 4 times since 1963, with a most recent fire interval of
      27 years.
  - find: high frequency, short interval
    value: short interval
    description: Burnt 5 times since 1963, with a most recent fire interval of 6 years.
- context_property: seed bank layer
  category: method_context
  var_in: Depth
  values:
  - find: Leaf litter
    value: leaf litter
    description: Leaf litter separated from the top of the soil cores.
  - find: Soil
    value: soil
    description: Soil from 5 cm diameter by 8 cm deep cores, below the leaf litter.
traits:
- var_in: seedbank_location
  unit_in: .na
  trait_name: seedbank_location
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: At each site, six soil cores, each measuring 5 cm in diameter with a depth
    of 8 cm were sampled around the edge of the plot, spaced 1 m apart (Figure 2).
    Leaf litter was separated from the soil, and the six cores were pooled for each
    plot (resulting in two samples per plot, and 22 samples per site, Figure 2). ^p
    Fortnightly checks continued for a full calendar year to allow for seedlings that
    require a diverse range of seasonal requirements to emerge (Mackenzie et al.,
    2021). ^p A species is recorded as having a soil seedbank at a site when its seedlings
    emerged from that site's heat- and smoke-treated leaf litter or soil samples.
substitutions: .na
