questions:
  question1: Site codes in the data file are matched to Table S1 sites by fire severity
    and fire interval class. Three sites could not be matched directly and were assigned
    from their code pairs (MWL09b and MWL11b to Mt Tomah, like MWL09a and MWL11; MWL04
    to Mt Wilson), giving MWL04 = site 7, MWL09b = site 9 and MWL11b = site 10. Is
    this correct?
  question2: Do you have a list of which species had in situ seedlings (vs. combined
    presence of resprouters and seedlings)?
