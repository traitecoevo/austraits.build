dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2022-10/2022-11
  taxon_name: Species
  location_name: Site
  description: To assess how fire severity, together with fire frequency and interval,
    affects the species and functional group diversity of the soil seed bank of a
    threatened mesic forest community, and how this compares with the extant vegetation.
  basis_of_record: field
  life_stage: seedling
  sampling_strategy: We sampled 12 sites around Mt. Tomah (33.5415° S, 150.4222° E)
    and Mt. Wilson (33.5029° S, 150.3889° E) located in the Blue Mountains of New
    South Wales, in south-eastern Australia (Figure 1). All study sites were Upland
    Basalt Eucalypt Forests of the Sydney Basin Bioregion (Department of the Environment,
    2022), a WSF threatened ecological community. Wet sclerophyll forest is a tall
    open forest (with a canopy usually taller than 30 m) which receives more than
    1000 mm of rainfall a year, and is characterised by a sclerophyllous canopy and
    numerous rainforest species (Wardell-Johnson et al., 2017). Upland Basalt Eucalypt
    Forests of the Sydney Basin Bioregion occurs on basalt substrates at an elevation
    of 650 to 1050 m (Office of Environment and Heritage, 2022). Composition can include
    both sclerophyllous and rainforest-associated canopy trees, a shrub layer composed
    of numerous shrubs and vines, and a diverse understorey of grasses, forbs and
    ferns (Department of the Environment, 2022). Composition and structure is determined
    by site conditions, slope, moisture and disturbance history such as fire (Department
    of the Environment, 2022). The study sites experience a mean annual minimum and
    maximum temperature of 8 to 17°C, a mean monthly precipitation of 86 mm, and the
    climate is classified as temperate oceanic (using the Koppen Climate Classification
    Cfb) (Bureau of Meteorology, 2024). The suggested fire intervals for WSF is once
    every 25 to 60 years (Kenny et al., 2004). Nine sites were burnt during the 2019/2020
    Australian megafires, and three sites remained unburnt. ^p We selected 12 sites
    across a range of different fire histories (severity and fire interval class)
    as described in Table S1. To compare extant vegetation to soil seed bank diversity,
    we used a 50 m transect with 2 m2 plots laid out every 5 m along the transect
    (Figure 2), resulting in 11 plots per each of the 12 sites (Table 1). When comparing
    species present in the extant vegetation with those in the soil seed bank, we
    use the term ‘species pool’ to indicate we are comparing distinct pools of species.
    Transects were laid out at least 50 m from the roadside to avoid edge effects.
    We conducted flora surveys and collected soil samples from sites between October
    and November 2022, 2 years and 9 months after the 2019/2020 Australian megafires.
    We did this at each of the 12 sites. At each site, six soil cores, each measuring
    5 cm in diameter with a depth of 8 cm were sampled around the edge of the plot,
    spaced 1 m apart (Figure 2). Leaf litter was separated from the soil, and the
    six cores were pooled for each plot (resulting in two samples per plot, and 22
    samples per site, Figure 2). Presence of all plants rooted in each plot, including
    both seedlings and resprouters, was also recorded. Details on replication are
    shown in Table 1. Samples were stored in dark conditions at 15°C, 15% relative
    humidity between collection and soil seed bank experiment establishment, for a
    total of 3 months before further experimentation. ^p GEEBAM (Google Earth Engine
    Burnt Area Map) was used to classify fire severity for each sample location (Department
    of Planning and Environment, 2020). GEEBAM compares pre-fire and post-fire vegetation
    with a normalised burnt ratio (dNBR) using a time series of high-resolution images.
    By comparing images to a NSW State Vegetation Type Map, classification is specific
    to vegetation type (Department of Planning and Environment, 2020). Ground measurements,
    such as scorch height and canopy consumption, were recorded between November 2020
    and January 2021 and used to confirm severity classifications (Thomsen et al.,
    2025). We determined severity groups as, Moderate, containing a partially burnt
    canopy, High, containing a completely burnt canopy and Extreme containing a completely
    consumed canopy. Burnt sites were also compared to unburnt sites (Figure 1). Using
    publicly available online maps showing the history of burnt areas in NSW, the
    previous fire history of each site was determined (State Government of NSW and
    NSW DCCEEW, 2010). The dataset, created in 1988, contains records of fires in
    NSW for every year since 1920 (State Government of Nsw and Nsw Dcceew, 2010).
    This was used to calculate fire frequency (i.e. the number of times a site had
    been burnt by fire in the last 60 years (since 1963), as 60 years is the maximum
    interval recommended for WSF in Kenny et al. (2004)) and most recent fire interval
    (i.e. a count of years between the 2019/2020 Australian megafires and the next
    most recent preceding fire that occurred at sites). Due to the limited variation
    in temporal fire history, which is integral to the maintenance of WSF, we were
    only able to group fire frequency and most recent fire interval into three categorical
    groups which we hereon refer to as fire interval class; (1) Long interval—sites
    having only experienced fire once or none in the last 60 years resulting in a
    last fire interval of 60+ years, (2) moderate interval—sites having experienced
    fires 3 or 4 times in the last 60 years, with the most recent fire interval being
    27 years and (3) Short interval—sites having experienced fire 5 times in the last
    60 years with the most recent fire interval being 6 years (Figure 2). Fire frequency
    and fire interval are integral to understanding recovery timing of species, so
    fire interval class was incorporated into models alongside fire severity to investigate
    whether they exacerbated effects of fire severity in the soil seed bank. ^p As
    many species in fire-prone regions have seed dormancy released by the occurrence
    of fire, fire-related cues such as heat and smoke were applied to release dormancy
    and enhance germination for the seed bank experiment. Each pooled sample for both
    the leaf litter and soil was placed in a foil baking tray. In February 2023, to
    mimic summer fire conditions, leaf litter and soil samples were placed into ovens
    set at 100°C until soil temperature was between 70 and 85°C (usually taking around
    30 min), as these temperature drive the release of seedcoat imposed physical dormancy
    following fires but are low enough to prevent mortality in most species (Auld
    & O'connell, 1991; Kasel et al., 2022; Penman et al., 2008; Read et al., 2000;
    Tang et al., 2003). Species were removed after 5 minutes within target temperature
    range. Soil temperature was measured with a candy thermometer submerged into the
    soil. Samples that were observed to still contain moisture (darker and damp to
    touch) were turned over, to allow even heating through samples. Smoke was applied
    during setup as described below. ^p Following heat treatments, leaf litter samples
    were scattered over sterilised sand (~ 4 cm depth) in foil trays (20 × 10 × 5
    cm). The soil samples were placed onto 1 cm of sterilised sand in foil trays to
    a depth of around 2 cm to ensure seed received sufficient light. In line with
    nursery requirements to prevent potential contamination of the nursery's drainage
    systems, the trays contained no drainage holes, instead sand was used to facilitate
    drainage from the samples. Trays and emerging seedlings were inspected for potential
    contaminants, such as the pathogen Phytophthora, but no signs were detected. Trays
    were placed in a shaded greenhouse at the Australian Botanic Garden, Mt. Annan,
    NSW, in February 2023 during the southern hemisphere summer. Trays were isolated
    in a separate greenhouse to prevent contamination from other local plants and
    nursery species. While no nursery control trays were used to check for possible
    nursery contamination, all species identified were typical of the study habitat,
    so any contribution from nursery-derived species was considered negligible. To
    increase germination and emergence of smoke-sensitive species, for the first 4
    days, each sample was watered with 2% diluted smoke water and then watered with
    tap water until samples were saturated. Smoke water was generated through burning
    leaf litter from the Sydney Basin area and pumping the resulting smoke through
    distilled water for 3 h, a common method for producing smoke water (Martyn Yenson
    et al., 2021). Once established, each tray was regularly watered three times a
    day and rotated to avoid any potential position effects, over winter watering
    was dropped to once a day to avoid waterlogging of samples. Trays were initially
    checked once a week, with seedlings identified and removed; they were then checked
    once a fortnight once seedling emergence had slowed. Fortnightly checks continued
    for a full calendar year to allow for seedlings that require a diverse range of
    seasonal requirements to emerge (Mackenzie et al., 2021). Date of emergence was
    recorded as the week species were identified in (Figure S1).
  original_file: Data_for__The_post-fire_recovery_of_soil_seed_banks_along_a_fire_severity_gradient_in_an_Australian_threatened_mesic_forest_.csv,
    downloaded from Dryad Digital Repository (doi.org/10.5061/dryad.sf7m0cgj9).
  notes: data.csv is built from the Dryad file in raw/ by raw/extra_R_code_Paroissien_2026_2.R,
    using only the soil seed bank records. It has one row per species x site x seed
    bank layer (leaf litter, soil) for every species that emerged from that site's
    samples. Columns retained but not mapped are the number of plots (of 11) in which
    the species emerged (plots_with_seedlings), the total seedlings emerged (seedlings_emerged),
    the earliest and latest per-sample first emergence dates and days from experiment
    set-up (10 February 2023, Supporting Information Figure S1) to first emergence
    (first_emergence_date, last_first_emergence_date, days_to_first_emergence), whether
    the species was also recorded in the extant vegetation at that site (in_extant_vegetation),
    and the authors' functional group (FunctionalGroup), which was compiled from AusTraits
    and the NSW Flora Fire Response Database.
