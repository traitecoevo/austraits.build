traits:
- var_in: leaf_cuticle_thickness
  unit_in: um
  trait_name: leaf_cuticle_thickness
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 5
  methods: Thickness of leaf cuticle was determined by randomly selecting 5 fresh
    leaves of each tree species. Three 2 × 2 mm sections excised from each leaf were
    dehydrated in an ethanol concentration series of 30%, 50%, 70%, 90% and 100% v/v.
    The samples were subsequently infiltrated overnight with paraffin by being cycled
    through 50% and 100% molten paraffin solutions, embedded in paraffin blocks and
    cut in cross-section using a Microtom 2 microtome. All sections were mounted
    and examined under a Carl Zeiss Axioplan 2 microscope. Digital images of each
    section were then taken with a Carl Zeiss AxioCam at 400× magnification and an
    image resolution of 1300 × 1030 pixels. The cuticle thicknesses were measured
    with the measure length tool of the Carl Zeiss Axioplan image analysis software
    (Ver. 3.01).
- var_in: leaf_N_per_dry_mass
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Freshly collected leaf samples of each species were air dried at room
    temperature (~50% relative humidity) until a constant dry weight had been reached.
    Leaves (10 g) were then frozen with liquid N2 and ground into a fine powder. Samples
    were analysed at the Victorian Government State Chemistry Laboratory with a Leco
    furnace for nitrogen, phosphorus, potassium, sulphur, calcium, magnesium, sodium,
    copper, zinc, manganese, iron and boron.
