  trait_name: trait
  value: value
  location_name: location_name
  description: To determine whether leaves of co-occurring Australian tree species
    decay at different rates in the terrestrial and aquatic settings where leaves
    come to rest, whether leaf chemistry and structure predict decay rate, and whether
    loss of leaf area tracks loss of mass, so that species biases in the leaf fossil
    record can be assessed.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'Field experiments were undertaken at Cumberland Creek, in Victoria,
    south-eastern Australia (145°52′40″, 37°33′28″; Fig. 1). The site has been described
    in Steart et al. (2002, 2005, 2006) and consists of stands of cool temperate rainforest
    (CTRF); and wet sclerophyll forest (WSF; Fig. 1). The field site includes a ~5–6
    m deep valley, through which flows Cumberland Creek, a small perennial creek with
    a variable flow. Sediments on the valley floor include anaerobic mire deposits
    ≥2 m deep. Pools of surface water are present at some times of year. The site
    is subject to occasional winter snowfall; has a mean annual rainfall of ~170 cm;
    a mean annual temperature of ~9.6 °C (Steart et al., 2002); and a mean annual
    temperature range of ~12.8 °C. ^p The cool temperate rainforest is dominated by
    two tree species, Nothofagus cunninghamii and Atherosperma moschatum, with emergent
    Eucalyptus regnans scattered through the rainforest. In contrast, the wet sclerophyll
    forest surrounding the rainforest is dominated by E. regnans with a subcanopy
    of Acacia melanoxylon and other species. The shrub Lomatia fraseri occurs occasionally
    across the whole site. ^p Ten kilograms (fresh weight) of green leaves were collected
    at the field site from each of the 5 target tree species (Table 1). The leaves
    were dried at room temperature (20 °C) at ~50% humidity (as measured by a humidity
    logger), until a constant weight was achieved. This approach followed the recommendations
    of Boulton and Boon (1991), who demonstrated a range of artefacts that are introduced
    into decay experiments when leaves are dried under unnatural conditions. Although
    many decay experiments make use of fallen or brown leaves, high winds in this
    part of Australia are often responsible for the loss of green leaves from canopy
    trees, so the use of fresh-leaf material in the decay experiments is representative
    of natural conditions. ^p Following drying, 5 g of air-dried leaves were placed
    into 15 × 15 cm plastic-coated, fibreglass-mesh single-species leaf bags with
    a 2 mm aperture size and the bags heat-welded shut. Three hundred bags for each
    leaf species were made. Each leaf bag was labelled with coloured nylon builder''s
    line, a different colour being used for each species to help with identifying
    the taxa after recovery from the field site. Six leaf bags of the same species
    were tied to 45 cm steel tent pegs by the coloured nylon builder''s line, labelled
    with brightly coloured 25 mm wide plastic flagging tape (to indicate depositional
    location) and deployed. ^p The leaf bags were deployed throughout the rainforest
    section of the field site to measure leaf-decay rates in the 4 most likely depositional
    settings where a leaf may come to rest after abscission (after Ferguson, 1985;
    Spicer, 1989, 1991; Greenwood, 1991) (Fig. 2). The 4 different depositional setting
    used were: (1) Forest floor leaf litter or autochthonous leaf fall involving only
    short-distance or overland transport, where leaves tend not to enter watercourses.
    This environmental setting is called ''Land Surface'' or LS. (2) Autochthonous
    burial of forest-floor leaf litter, resulting from sediment deposition from a
    flash flood or other depositional events: ''Land Buried'' or LB. (3) Accumulation
    of leaves on the surface of stream channels: ''Stream Surface'' or SS. (4) Allochthonous
    burial in stream or lake sediments after transport: ''Stream buried'' or SB. ^p
    Seventy five leaf litter bags of each species were allocated to each depositional
    setting. The buried samples were inserted to a depth of at least 50 cm in the
    sediment, and 45 cm steel pegs used to hold the surface samples in place so that
    they would not be washed away by floods. A minimum lateral spacing of 50 cm was
    allowed between all leaf bags and the leaf bags and any steel pegs, in order to
    minimise spatial confounding. After deployment of the leaf packs, 6 leaf bags
    of each species were collected at random from each depositional setting on a
    monthly basis. Collections lasted for one year. The recovered leaf bags were stored
    at 4 °C after collection, and then gently rinsed in distilled water to remove
    any soil attached to the mesh bags, opened and rinsed again to remove remaining
    soil particles. Leaf material was dried at 70 °C, until a constant dry weight
    was obtained, and then weighed with a top-loading balance to the nearest 0.1 g.
    Sub-samples of ~1.0 g were taken from the 3, 6, 9 and 12-month samples, weighed
    to the nearest 0.001 g and placed into 45 ml crucibles to the determine ash-free
    dry weight using a muffle furnace heated to 550 °C for 2 h.'
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: Additional traits, leaf_litter_decay_rate_k
