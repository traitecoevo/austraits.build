    bibtype: Article
    year: '2025'
    author: Daniela Scaccabarozzi and Nina Sletvold
    title: Do sun orchids mimic buzz-pollinated plants? An experimental test of the
      adaptive significance of false anthers
    journal: Functional Ecology
    volume: '39'
    number: '10'
    pages: 2876--2888
    doi: 10.1111/1365-2435.70129
