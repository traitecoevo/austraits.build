dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        !(
          trait %in% c("fruit_set_proportion", "flowers_per_inflorescence") &
            (dplyr::coalesce(anther_treatment, "") != "control" | dplyr::coalesce(pollination_treatment, "") != "")
        )
      ) |>
      dplyr::mutate(
        trait_value = dplyr::if_else(
          trait %in% c("flower_visitor", "pollination_vector_possible", "pollination_vector_known"),
          trait_value_clean,
          trait_value
        )
      )
    '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  individual_id: plant_id
  description: To test whether the false anthers of sun orchids (Thelymitra) are an
    adaptation that mimics co-flowering buzz-pollinated plants, and whether their effect
    on fruit production depends on the local abundance of model plants.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: We collected data in autumn 2023 and 2024 in Southwestern Australia.
    The distribution of T. macrophylla and T. crinita ranges from Perth to Albany and
    from Gingin to Esperance, respectively. Study populations of T. macrophylla were in
    Banksia woodland habitats within Warwick and Shanton Park bushland reserves, and
    study populations of T. crinita were found in forests dominated by Eucalyptus
    marginata in the Darling Range on the Perth hills (Figure S1). Due to an unusual
    heatwave that caused flowering of T. crinita in the Perth region to end early, we
    also included a population in the Margaret River region, at Flat Rock bushland,
    Augusta (Figure S1). Both Thelymitra species are abundant in the study regions, with
    typical population sizes ranging from 20 to 100 plants. The flowering time ranges
    from September to October for T. macrophylla and from October to November for T.
    crinita (Western Australian Herbarium 1998). Both orchids co-occur with a range of
    rewarding species with similar flower colour, including both pollen-rewarding
    buzz-pollinated species and nectar-rewarding species that are not buzz-pollinated
    (Brundrett et al., 2024; Edens-Meier et al., 2014). In the T. macrophylla study
    populations, the main co-flowering species were O. laxus (Iridaceae) and Sowerbaea
    laxiflora (Asparagaceae) (Figure 1c,d) that both of which are pollen-rewarding and
    buzz-pollinated. In the T. crinita populations, the main co-flowering species were
    pollen-rewarding Thysanotus manglesianus and Agrostocrinum hirsutum (Asphodelaceae)
    (Figure 1g,h), and nectar-rewarding Lechenaultia biloba, Dampiera linearis and
    Scaevola calliptera (Goodeniaceae). ^p To determine flower colour similarity, we
    measured flower colour in one population of each orchid species, including all main
    co-flowering rewarding species (Table 1). To identify orchid pollinators and their
    behaviour on orchids and model plants, we conducted pollinator observations in three
    populations of T. crinita (Table 1). We initially included both orchid species in
    our observations, but due to very low insect activity in T. macrophylla populations,
    we focused on T. crinita. To test the adaptive significance of false anthers and
    whether it depends on rewarding context, we used two experimental approaches, anther
    removal and anther painting. With anther removal, physical damage may influence bee
    behaviour on flowers. With anther obscuration by paint, false anthers remained
    intact, and only the visual signal was removed. First, we examined the effect of
    removing the false anther in two populations of T. macrophylla, one with putative
    model plants (O. laxus, S. laxiflora) and one without (Table 1). Second, we examined
    the effect of obscuring the false anther using paint in two populations of each of
    the two species (Table 1). In the anther-painting experiment on T. macrophylla, we
    could not identify any workable sites with variation in model abundance, and the
    experiment was conducted in two populations that both had abundant model plants. In
    T. crinita, we conducted the anther-painting experiment in two populations that
    differed quantitatively in local abundance of putative model plants. In both
    populations, we quantified abundance of model and magnet plants by estimating the
    number of flowers per species in five randomly distributed 5 × 5 m plots per
    population. We counted all flowering stems and all flowers on 10 stems per plant and
    estimated total number of flowers by multiplying number of stems by mean number of
    flowers per stem. We included all rewarding species with blue-violet flower colour
    as potential model (A. hirsutum, T. manglesianus which are pollen-rewarding) and
    magnet plants (D. linearis, L. biloba, S. calliptera which are both nectar and
    pollen-rewarding) regardless of the reward type, because buzz pollinators forage on
    both nectar- and pollen-rewarding flowers. The mean number of rewarding flowers per
    plot was 3.9 times higher in the population with high model abundance (mean ± SD =
    87.6 ± 15.0) compared to the population with low model abundance (mean ± SD = 22.6 ±
    12.4), and the ratio of mimics to models was approximately half in the former (0.45
    and 0.89, respectively). ^p To characterise flower colour in the two deceptive
    orchids and the co-flowering pollen- and nectar-rewarding species, we collected
    inflorescences in the field and brought them to the laboratory, where we measured
    six flowers per species using a field spectrometer (JAZ, Ocean Insight, Orlando,
    FL). On each flower, we took one measurement on the surface of the tepals in the
    orchids and of the petals in the co-flowering plants. To quantify colour similarity
    according to bee visual perception, we used the conventional bee vision model
    (colour hexagon space) based on photoreceptor spectral sensitivity of honeybees
    (Chittka, 1992). [...] ^p To identify pollinators of T. crinita, we assessed the
    approach of all visitors to the flowers (attraction to the flower without
    necessarily landing), their behaviour and potential landing, and the capability to
    remove and deposit orchid pollinia, combining direct pollinator observations with
    camera recordings. Because the natural visitation rate was very low, we created
    experimental arrays of T. crinita inflorescences close to rewarding species, to
    increase the likelihood of observing visitors (Scaccabarozzi, Dixon, et al., 2020;
    Scaccabarozzi, Galimberti, et al., 2020; Scaccabarozzi, Guzzetti, et al., 2020).
    Arrays were formed by three cut orchid inflorescences placed in glass vials (one
    inflorescences per vial, each with 4–6 flowers) spaced 10 cm apart, and located ca 1
    m from flowering individuals of the main rewarding species, T. manglesianus and A.
    hirsutum. In Perth hills, we conducted 80 and 20 10-min trials in the first and
    second population, respectively, and in the Augusta population, we conducted 200
    10-min trials. This resulted in 50 h of pollinator observations in total. In each
    period, we also recorded insect behaviour using an EOS M video camera (Canon, Tokyo,
    Japan) for subsequent viewing in slow motion. Observations were done between 9 AM
    and 3 PM (typical flower anthesis) during sunny or partly sunny days, when
    temperatures were above 22°C (measured 20 cm above the ground with a Smartsensor
    AR827, Sinosource Scientific Company, China). To determine if T. crinita shares
    pollinators with putative model species, we also conducted pollinator observations
    and camera recordings of T. manglesianus and A. hirsutum during some of the orchid
    arrays. For both species, we performed 21 10-min observation periods, yielding a
    total of 3 h and 30 min observations per species. When possible, pollinators of both
    T. crinita and the putative model plants were identified in the field. In other
    cases, specimens were netted and later identified at the Museum of Western
    Australia. ^p On 24 September 2023, we randomly tagged 50 plants in each of two T.
    macrophylla populations separated by approximately 1 km within the Warwik Bushland
    Reserve, Perth. Putative model plants were present in one of the populations. In
    each population, we randomly assigned half of the plants to an anther removal
    treatment, while the other half were used as controls (n = 25 per treatment). In the
    anther removal treatment, we carefully excised the false anthers (i.e. the upper
    part of the column; Figure S2) from all open flowers using scissors. Most flowers
    were already open at the time of the experiment, and any remaining buds were
    removed. Prior to conducting manipulations, we recorded number of flowers per
    individual and examined if flowers had been visited. All flowers with pollinia
    removal or deposition were marked and excluded from the treatments (no difference
    between treatments; p > 0.05). In both populations, we recorded fruit production of
    all plants 2 weeks after removing false anthers. To test if anther removal affected
    the ability to produce fruits, we supplementally hand-pollinated all flowers on 16
    additional plants in another population in the Warwick bushland reserve, where eight
    had their false anther removed as described above, and eight were unmanipulated
    controls. We recorded fruit production 2 weeks later. ^p On 4 October 2023, we
    randomly tagged 40 plants at flowering peak in each of two T. macrophylla
    populations (both with abundant model plants) in Shenton Bushland Reserve, Perth. In
    each population, we randomly assigned half of the plants to an anther paint
    treatment, while the other half were used as controls (n = 20 per treatment). In the
    paint treatment, we obscured false anthers in all open flowers by applying a colour
    that matched the colour of the column (Eraldo Di Paolo, Acrylic Paint, Warm Blue;
    colour match examined by spectrometer measurements and false colour photography;
    Figure 2A). To control for potential side-effects of painting, we also applied paint
    to the backside of the corolla of all flowers in the control treatment. On 17
    October 2023, we randomly tagged 50 plants at flowering peak in each of two T.
    crinita populations (high vs. low abundance of model plants) on the Darling Scarp,
    Perth Hills. In each population, we randomly assigned half of the plants to an
    anther paint treatment, while the other half were used as controls (n = 25 per
    treatment). Treatments were conducted as described for T. macrophylla. Prior to
    manipulations, we recorded number of flowers per individual and marked and excluded
    all flowers with pollinia removal or deposition for both orchids (no difference
    between treatments; both p > 0.05). In both experiments, we recorded fruit
    production of all plants 2 weeks after the anther manipulations. ^p To test the
    ability for autogamous pollination in both orchids, we bagged the inflorescences on
    10 individuals of each species at the bud stage and recorded fruit production 4
    weeks later. None of the bagged inflorescences in either of the two species
    developed fruits.
  original_file: raw/trait_data.csv compiled from Supporting Information (Tables S1 and S2) and the Dryad data
    (doi:10.5061/dryad.k98sf7mk5).
  notes: Flower colour hue and chroma in the honeybee colour hexagon are calculated from the
    mean colour loci in Table S1. 
