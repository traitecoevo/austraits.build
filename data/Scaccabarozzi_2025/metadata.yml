contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: entity_context
- context_property: floral visitor individuals recorded (count)
  category: entity_context
  var_in: visitor_count
- context_property: foraging behaviour
  category: entity_context
  var_in: foraging_behaviour
  values:
  - value: buzzing
    description: bees produce wing vibrations and release pollen from the anthers
  - value: attempted buzzing
    description: bees manipulating the false anther appeared to attempt to buzz the orchid
      flower
  - value: no buzzing
    description: none of the bees attempted to buzz the flowers
- context_property: model plants in population
  category: plot_context
  var_in: model_plants
  values:
  - value: absent
    description: putative model plants (Orthrosanthus laxus, Sowerbaea laxiflora) absent
      from the population
  - value: present
    description: putative model plants (Orthrosanthus laxus, Sowerbaea laxiflora) present
      in the population
  - value: abundant
    description: putative model plants (Orthrosanthus laxus, Sowerbaea laxiflora) abundant
      in the population
traits:
- var_in: flowers_per_inflorescence
  unit_in: '{count}/{count}'
  trait_name: flowers_per_inflorescence
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: On 24 September 2023, we randomly tagged 50 plants in each of two T.
    macrophylla populations separated by approximately 1 km within the Warwik Bushland
    Reserve, Perth. Putative model plants were present in one of the populations. In
    each population, we randomly assigned half of the plants to an anther removal
    treatment, while the other half were used as controls (n = 25 per treatment). In the
    anther removal treatment, we carefully excised the false anthers (i.e. the upper
    part of the column; Figure S2) from all open flowers using scissors. Most flowers
    were already open at the time of the experiment, and any remaining buds were
    removed. Prior to conducting manipulations, we recorded number of flowers per
    individual and examined if flowers had been visited. ^p Each record is the number of
    flowers on one control plant (false anthers intact, open-pollinated).
- var_in: fruit_set_proportion
  unit_in: '{count}/{count}'
  trait_name: fruit_set_proportion
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: In each population, we randomly assigned half of the plants to an anther removal
    treatment, while the other half were used as controls (n = 25 per treatment). [...]
    In both populations, we recorded fruit production of all plants 2 weeks after removing
    false anthers. ^p To control for potential side-effects of painting, we also applied
    paint to the backside of the corolla of all flowers in the control treatment. [...]
    In both experiments, we recorded fruit production of all plants 2 weeks after the
    anther manipulations. ^p Each record is the number of fruits divided by the number
    of flowers on one control plant (false anthers intact, open-pollinated).
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Thelymitra is a genus of over 100 nectarless orchid species primarily found in
    Australia. ^p Most species within the genus are believed to be bee-pollinated via
    food deception. ^p We included all rewarding species with blue-violet flower colour
    as potential model (A. hirsutum, T. manglesianus which are pollen-rewarding) and
    magnet plants (D. linearis, L. biloba, S. calliptera which are both nectar and
    pollen-rewarding) regardless of the reward type.
- var_in: flower_colour_bee_hue
  unit_in: deg
  trait_name: flower_colour_bee_hue
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: To characterise flower colour in the two deceptive orchids and the co-flowering
    pollen- and nectar-rewarding species, we collected inflorescences in the field and
    brought them to the laboratory, where we measured six flowers per species using a
    field spectrometer (JAZ, Ocean Insight, Orlando, FL). On each flower, we took one
    measurement on the surface of the tepals in the orchids and of the petals in the
    co-flowering plants. To quantify colour similarity according to bee visual
    perception, we used the conventional bee vision model (colour hexagon space) based
    on photoreceptor spectral sensitivity of honeybees (Chittka, 1992). ^p Each record
    is the hue angle of the mean colour locus of six flowers, measured clockwise from
    the top of the colour hexagon.
- var_in: flower_colour_bee_chroma
  unit_in: '{dimensionless}'
  trait_name: flower_colour_bee_chroma
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: To characterise flower colour in the two deceptive orchids and the co-flowering
    pollen- and nectar-rewarding species, we collected inflorescences in the field and
    brought them to the laboratory, where we measured six flowers per species using a
    field spectrometer (JAZ, Ocean Insight, Orlando, FL). On each flower, we took one
    measurement on the surface of the tepals in the orchids and of the petals in the
    co-flowering plants. To quantify colour similarity according to bee visual
    perception, we used the conventional bee vision model (colour hexagon space) based
    on photoreceptor spectral sensitivity of honeybees (Chittka, 1992). ^p Each record
    is the distance of the mean colour locus of six flowers from the centre of the
    colour hexagon.
- var_in: flower_colour_bee_type
  unit_in: .na
  trait_name: flower_colour_bee_type
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To characterise flower colour in the two deceptive orchids and the co-flowering
    pollen- and nectar-rewarding species, we collected inflorescences in the field and
    brought them to the laboratory, where we measured six flowers per species using a
    field spectrometer (JAZ, Ocean Insight, Orlando, FL). On each flower, we took one
    measurement on the surface of the tepals in the orchids and of the petals in the
    co-flowering plants. To quantify colour similarity according to bee visual
    perception, we used the conventional bee vision model (colour hexagon space) based
    on photoreceptor spectral sensitivity of honeybees (Chittka, 1992). ^p Each record
    is the region of the colour hexagon in which the mean colour locus of the species
    lies.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To identify pollinators of T. crinita, we assessed the approach of all visitors
    to the flowers (attraction to the flower without necessarily landing), their
    behaviour and potential landing, and the capability to remove and deposit orchid
    pollinia, combining direct pollinator observations with camera recordings. ^p Each
    record is a bee observed removing or depositing orchid pollinia or caught carrying
    them, or a bee buzzing the anthers of the pollen-rewarding model plants to release
    pollen.
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To identify pollinators of T. crinita, we assessed the approach of all visitors
    to the flowers (attraction to the flower without necessarily landing), their
    behaviour and potential landing, and the capability to remove and deposit orchid
    pollinia, combining direct pollinator observations with camera recordings. ^p Each
    record is an insect observed landing on the flowers, or caught on them, without
    removing pollinia or releasing pollen.
substitutions:
- trait_name: flower_pollinator_reward
  find: nectar_and_pollen_rewarding
  replace: nectar pollen
- trait_name: flower_pollinator_reward
  find: nectarless
  replace: deceit
- trait_name: flower_pollinator_reward
  find: pollen_rewarding
  replace: pollen
taxonomic_updates: .na
exclude_observations: .na
questions: .na
