dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait_name %in% c(
          "bark_colour", "bark_texture", "bud_bank_location", "bud_length",
          "bud_width", "dispersal_appendage", "dispersal_syndrome", "dispersers",
          "flower_anther_length", "flower_bract_length", "flower_colour", "flower_diameter",
          "flower_fertile_stamens_count", "flower_filament_length", "flower_nectar_production", "flower_orientation",
          "flower_ovary_position", "flower_perianth_merism", "flower_perianth_symmetry", "flower_petal_length",
          "flower_scent_production", "flower_sepal_length", "flower_structural_sex_type", "flower_style_length",
          "flower_visitor", "flowering_cues", "flowering_time", "flowers_per_inflorescence",
          "fruit_colour", "fruit_dehiscence", "fruit_fleshiness", "fruit_height",
          "fruit_length", "fruit_surface_hairs", "fruit_type", "fruit_width",
          "fruiting_time", "germination_cues", "inflorescence_length", "inflorescence_type",
          "leaf_apex_shape", "leaf_arrangement", "leaf_base_shape", "leaf_compoundness",
          "leaf_glaucousness", "leaf_hairs_adult_leaves", "leaf_hairs_juvenile_leaves", "leaf_lamina_posture",
          "leaf_length", "leaf_lobation", "leaf_margin", "leaf_margin_posture",
          "leaf_phenology", "leaf_phyllotaxis", "leaf_shape", "leaf_surface_colour",
          "leaf_surface_reflectivity", "leaf_type", "leaf_width", "parasitic",
          "pedicel_length", "peduncle_length", "petiole_length", "plant_climbing_mechanism",
          "plant_growth_form", "plant_growth_substrate", "plant_height", "plant_photosynthetic_organ",
          "plant_width", "pollination_syndrome", "post_fire_recruitment", "resprouting_capacity",
          "seed_colour", "seed_length", "seed_shape", "seed_surface_reflectivity",
          "seed_surface_texture", "seed_width", "seeds_per_fruit", "sex_type",
          "stem_branching_form", "stem_diameter", "stem_growth_habit", "stem_hairs",
          "stem_length", "storage_organ"
        ),
        is.na(measurement_range) | measurement_range != "extreme"
      )
    '
  notes: 'The Flora of Australia extraction is split across datasets by family, to keep each data.csv within GitHub
    file-size limits: ABRS_AtoM_2026 (families A to M), ABRS_NtoZ_2026 (families N to Z), and ABRS_Asteraceae_2026,
    ABRS_Fabaceae_2026, ABRS_Myrtaceae_2026 and ABRS_Proteaceae_2026. One parser, ABRS_AtoM_2026/raw/build_data_csv.R,
    builds all of them; this dataset is written in long format (since October 2026). Family in this dataset: Myrtaceae.
    Candidate traits not yet in traits.yml (organ x character traits such as calyx_hairs, petal_count, ovary_shape) are
    listed with their coverage in raw/candidate_traits.csv, which the build script rewrites on every full build;
    custom_R_code keeps only the traits mapped below. Rows whose trait_name is a text field (habit_description,
    leaf_description, common_name, ...) carry the verbatim organ-level text and are unmapped. Parenthetical extremes
    (measurement_range = extreme) are in data.csv but not mapped.'
identifiers: .na
locations: .na
