questions:
  question1: If there are identifiers linking the DNA samples to GenBank (or other
    repository) we can add those in as `identifiers`.
  question2: There are a number of plant taxa that do not match to a currently accepted
    name or synonym in APC - I've looked these up in the ALA and iNaturalist and most
    have none (Cicer reticulatum, Cucumis hystrix, Ornithopus isthmocarpus) or sparse
    records (Haloragis erecta - 1 in Vic; Solanum pimpinellifolium - a few across
    multiple states). Are these identifications definite and are these naturalised
    populations?
  question3: I could alternatively input this data as two datasets, representing the two studies. Would that make more sense from the perspective of the sampling strategy information?
  question4: I could input this data as observation linked to specific locations - you could send me a much rawer data format, and I'll use functions to map the raw taxonomy, at whatever rank, to the values we're accepting for the AusTraits definitions.
  question5: You'll notice that we've increased the level of detail in pollinators represented in our trait definition. We've received many datasets with memebers of Apidae identified to family, genus or species and decided to retain more of this detail. We will remap all other datasets soon to reflect this.
