traits:
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: Sample size
  methods: Floral visitors were recorded opportunistically whenever encountered, providing
    information on potential pollinators of the study species. Number of individual
    pollinator specimens represented by the record. For observational records, it
    represents the number of observed individuals contributing to the summarised record.
    In detail, potential pollinators were sampled using blue vane traps to determine
    the abundance and diversity of potential pollinators available to plant species
    at each transect. This passive insect trapping method has effectively attracted
    native bees and non-bee insects like flies, wasps, and beetles (Hall 2018; Hall
    and Reboud 2019). As they are passive, they also vastly increase the sampling
    time possible compared to hand netting. Vane traps consist of a collecting jar,
    a top funnel, and two interconnected blue ‘vanes’. Traps are suspended at 1 m
    above the ground and filled with a soapy water solution. One trap was placed in
    the middle of each transect for two continuous weeks during canola’s peak bloom.
    After sampling, we collected all captured insects and preserved them in 70% alcohol
    for morphospecies identification. The transect-scale bee diversity index was calculated
    using the Hill-Shannon diversity index (Roswell et al. 2021). This diversity index
    assesses community diversity by combining species richness and abundance. This
    approach is a less biased assessment of diversity than just richness.
- var_in: Flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: Sample size
  methods: Number of individual pollinator specimens represented by the record. For
    DNA metabarcoding records, this corresponds to the number of specimens collected
    for pollen removal and subsequent DNA metabarcoding. Potential pollinators were
    collected three times from each plot across the canola flowering season (once
    during early canola bloom, peak canola bloom, and late canola bloom). We sampled
    only on sunny or partially cloudy, still days in 20-min time periods during peak
    insect activity times (10 am-3 pm). The 20-min timer was paused during insect
    capture and handling time. Preliminary surveys found minimal (often no) insect
    activity outside of this peak activity window possibly due to low temperatures
    (mean minimum temp of 6.1°C for July) early in the morning and late in these winter
    afternoons. Potential pollinators were collected only if they landed on a flower
    and were observed making contact with the anthers or stigmas of a flower. We were
    not able to directly assess whether each insect was actively pollinating during
    each visit, and thus note that collected insects in this study are potential pollinators
    only. For conciseness, however, we refer to them as “pollinators.” Insects were
    captured using sterile plastic containers or bags to ensure all body pollen was
    accounted for and no cross-contamination of pollen from different individuals
    occurred. All insects were identified by experts to the lowest taxonomic level
    possible, using collected specimens. Given the limited taxonomic work that has
    been done on Western Australian bees and flies, most species were only identifiable
    to the family or genus level. For species whose taxonomy was unclear, we categorized
    them into morphospecies. Due to low samples sizes (n = 36 individuals), wasps
    were excluded from the study. Sampling efforts in canola fields were limited to
    the edge of the crop fields due to access restrictions. All honeybees collected
    in this study were considered to be feral (unmanaged), as managed honeybee hives
    were not used by the canola growers in this region during the study years, and
    feral honeybees are known to reach very high colony densities in Australia (Cunningham
    et al., 2022). This is a very sparsely populated region of Australia (Perenjori
    Shire has a population density of 0.07 people/km2 (ABS, 2017)), and thus we are
    confident we were aware of all homesteads and know that no local farms or households
    were keeping honeybees during the study period. ^p We recorded pollen load (the
    composition and number of pollen grains) found on 893 of the 923 individual pollinators
    collected in the 2015 season. The remaining 30 insects had no pollen on their
    bodies. Pollen loads were assessed by swabbing each collection bag and insect
    body with Fuchsin jelly, which was then melted on a glass slide and prepared as
    per Kearns and Inouye (1993). We also created a pollen library to help with pollen
    compositional assessment, using the same Fuchsin jelly approach, where a voucher
