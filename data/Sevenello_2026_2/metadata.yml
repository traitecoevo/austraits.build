dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      generate_observation_numbers(`Pollinator trait`, taxon_name) |>
      mutate(collection_date = util_parse_collection_date(collection_date))
  '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: Pollinator trait
  value: value_to_use
  location_name: location
  description: This dataset contains unpublished data generated from studies investigating
    pollen carried by pollinators and pollinator visitation to flowering plants in
    agricultural landscapes.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The dataset combines two previously unpublished datasets that
    were merged and subsequently cleaned and standardised for analysis, 1.\tPlant
    taxa present in pollen carried by captured pollinators were identified using DNA
    metabarcoding of the ITS2 region. The resulting sequences were assigned to the
    lowest confident taxonomic level supported by the data. The original metabarcoding
    results were subsequently cleaned and summarised into a plant-pollinator matrix.
    ^p Each column representing a plant species corresponds to a taxon detected through
    DNA metabarcoding. An “X” indicates that DNA from that plant species was detected
    in the pollen carried by the corresponding pollinator. Thus, an X provides evidence
    that the insect was carrying pollen from that plant species when it was collected.
    For these records, the corresponding pollinator trait was assigned as “pollination_vector_possible”,
    indicating that the insect was identified as a potential pollination vector based
    on the detection of plant pollen in its pollen load. ^p The original metabarcoding
    records were also compressed and aggregated by insect taxonomic group. For example,
    plant DNA detections and/or observations associated with Apis mellifera were summarised
    into a single row rather than retaining separate records for individual observations
    or samples. Therefore, this file represents a summarised version of the original
    metabarcoding data rather than the raw sequencing output. ^p Sampling stategy
    details for DNA study, potential pollinators were collected three times from each
    plot across the canola flowering season (once during early canola bloom, peak
    canola bloom, and late canola bloom). We sampled only on sunny or partially cloudy,
    still days in 20-min time periods during peak insect activity times (10 am-3 pm).
    The 20-min timer was paused during insect capture and handling time. Preliminary
    surveys found minimal (often no) insect activity outside of this peak activity
    window possibly due to low temperatures (mean minimum temp of 6.1°C for July)
    early in the morning and late in these winter afternoons. Potential pollinators
    were collected only if they landed on a flower and were observed making contact
    with the anthers or stigmas of a flower. We were not able to directly assess whether
    each insect was actively pollinating during each visit, and thus note that collected
    insects in this study are potential pollinators only. For conciseness, however,
    we refer to them as “pollinators.” Insects were captured using sterile plastic
    containers or bags to ensure all body pollen was accounted for and no cross-contamination
    of pollen from different individuals occurred. All insects were identified by
    experts to the lowest taxonomic level possible, using collected specimens. Given
    the limited taxonomic work that has been done on Western Australian bees and flies,
    most species were only identifiable to the family or genus level. For species
    whose taxonomy was unclear, we categorized them into morphospecies. Due to low
    samples sizes (n = 36 individuals), wasps were excluded from the study. Sampling
    efforts in canola fields were limited to the edge of the crop fields due to access
    restrictions. All honeybees collected in this study were considered to be feral
    (unmanaged), as managed honeybee hives were not used by the canola growers in
    this region during the study years, and feral honeybees are known to reach very
    high colony densities in Australia (Cunningham et al., 2022). This is a very sparsely
    populated region of Australia (Perenjori Shire has a population density of 0.07
    people/km2 (ABS, 2017)), and thus we are confident we were aware of all homesteads
    and know that no local farms or households were keeping honeybees during the study
    period. ^p We recorded pollen load (the composition and number of pollen grains)
    found on 893 of the 923 individual pollinators collected in the 2015 season. The
    remaining 30 insects had no pollen on their bodies. Pollen loads were assessed
    by swabbing each collection bag and insect body with Fuchsin jelly, which was
    then melted on a glass slide and prepared as per Kearns and Inouye (1993). We
    also created a pollen library to help with pollen compositional assessment, using
    the same Fuchsin jelly approach, where a voucher specimen of every flowering plant
    species in each remnant during each visit was collected.
  original_file: in raw data folder
  notes: none
