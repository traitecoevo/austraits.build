contexts:
- context_property: leaf phase
  category: entity_context
  var_in: leaf_type
  values:
  - value: juvenile leaves
    description: Juvenile (heteroblastic juvenile-phase) foliage.
  - value: adult leaves
    description: Adult (heteroblastic adult-phase) foliage.
- context_property: leaf age
  category: entity_context
  var_in: leaf_age
  values:
  - value: leaves aged 0, 16 and 30 days (pooled)
    description: Juvenile leaves sampled when unfolding (day 0), at day 16 and on
      full expansion (day 30), with the three leaf ages combined.
  - value: unfolding leaves (day 0), proximal area
    description: Proximal area of unfolding (day 0) juvenile leaves.
  - value: unfolding leaves (day 0), distal area
    description: Distal area of unfolding (day 0) juvenile leaves.
  - value: 16-day-old leaves
    description: Juvenile leaves 16 days after unfolding.
  - value: 30-day-old leaves (full expansion)
    description: Juvenile leaves 30 days after unfolding, at full expansion.
  - value: third-node leaves
    description: Young juvenile leaves from the third node of the shoot.
- context_property: leaf colour phenotype
  category: entity_context
  var_in: leaf_colour_phenotype
  values:
  - value: glaucous phenotype
    description: Trees chosen as having glaucous juvenile leaves (15 trees).
  - value: green phenotype
    description: Trees chosen as having green juvenile leaves (13 trees).
- context_property: plant height at 16 months (cm)
  category: entity_context
  var_in: plant_height_16_months_cm
