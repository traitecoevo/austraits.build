- var_in: leaf_epicuticular_wax_crystal_form
  unit_in: .na
  trait_name: leaf_epicuticular_wax_crystal_form
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Juvenile leaves of three trees per species were sampled on day 0, day 16,
    and on full leaf expansion (day 30), for epicuticular wax examination. Epicuticular
    wax was studied on proximal and distal areas of unfolding leaves (day 0) of all
    species except E. albida. ^p Juvenile leaves were examined fresh on the day of
    sampling. Sections, 5 x 5 mm, were carefully cut from the middle of the leaves,
    or from the proximal and distal areas of 0 day leaves, and placed on a cold stage,
    adaxial surface uppermost, of an Electroscan environmental scanning electron microscope
    (ESEM) at 4-7 Torr, 6-7 mm working distance, 10 kV, 4-10 °C and 100 µm aperture.
    ... observations were made on the gross morphology of the wax.
- var_in: leaf_epicuticular_wax_density
  unit_in: .na
  trait_name: leaf_epicuticular_wax_density
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Juvenile leaves of three trees per species were sampled on day 0, day 16,
    and on full leaf expansion (day 30), for epicuticular wax examination. ^p Juvenile
    leaves were examined fresh on the day of sampling. Sections, 5 x 5 mm, were carefully
    cut from the middle of the leaves ... and placed on a cold stage, adaxial surface
    uppermost, of an Electroscan environmental scanning electron microscope (ESEM)
    at 4-7 Torr, 6-7 mm working distance, 10 kV, 4-10 °C and 100 µm aperture. ...
    measurement of percentage of the adaxial leaf surface covered by wax utilised
    the whole image, and observations were made on the gross morphology of the wax.
- var_in: leaf_wax_tube_length
  unit_in: um
  trait_name: leaf_epicuticular_wax_tube_length
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Unfolding leaves (designated day 0) were tagged on 18 species of Eucalyptus.
    Juvenile leaves of three trees per species were sampled on day 0, day 16, and
    on full leaf expansion (day 30), for epicuticular wax examination. Epicuticular
    wax was studied on proximal and distal areas of unfolding leaves (day 0) of all
    species except E. albida. ^p Juvenile leaves were examined fresh on the day of
    sampling. Sections, 5 x 5 mm, were carefully cut from the middle of the leaves,
    or from the proximal and distal areas of 0 day leaves, and placed on a cold stage,
    adaxial surface uppermost, of an Electroscan environmental scanning electron microscope
    (ESEM) at 4-7 Torr, 6-7 mm working distance, 10 kV, 4-10 °C and 100 µm aperture.
    Digital images were taken of the leaves and image analysis was performed on a
    Macintosh LC 475 computer using the public domain NIH Image program ... Measurements
    were taken of tube length and tube diameter at ten randomly selected areas on
    the image. ^p Two juvenile leaves from the third node of each tree were examined
    fresh on the day of sampling. Sections, 5 x 5 mm, were carefully cut from the
    middle of the leaves, and placed on a cold stage, adaxial surface uppermost, of
    an Electroscan environmental scanning electron microscope (ESEM) at 2.4 Torr,
    6-8 mm working distance, 20 kV, 4-10 °C and 100 µm aperture.
