dataset:
  data_is_long_format: yes
  custom_R_code: ' data |> dplyr::filter(trait %in% c("plant_growth_form",
    "plant_canopy_form", "storage_organ", "reproductive_maturity", "plant_tolerance_calcicole",
    "leaf_phyllotaxis", "leaf_shape", "leaf_margin", "leaf_glaucousness", "leaf_glaucousness_juvenile_leaves",
    "juvenile_leaf_colour_RHS", "leaf_surface_colour", "leaf_surface_reflectivity",
    "leaf_epicuticular_wax_crystal_form", "leaf_epicuticular_wax_density", "leaf_wax_tube_length",
    "leaf_wax_tube_diameter", "leaf_wax_surface_cover")) |> dplyr::filter(!grepl("pooled",
    taxon_name), !(entity_context %in% "wax removed from adaxial surface")) '
  collection_date: 1994-03/1997-12
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: To evaluate eighteen Eucalyptus species for their suitability as cut
    foliage, including variation in juvenile foliage characters, growth and response
    to pruning, and the structure, regeneration and chemistry of the epicuticular
    leaf wax responsible for glaucous foliage.
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: 'Eighteen species of Eucalyptus were assessed for their horticultural
    potential as cut foliage. Classification follows Pryor and Johnson (1971) and
    Chippendale (1988). ^p Ten of the species are mallees and possess a lignotuber,
    they include E. tetragona, E. kruseana, E. brachyphylla, E. socialis, E. gillii,
    E. orbifolia, E. crucis, E. macrocarpa, E. albida, and E. pulverulenta. One species,
    E. gunnii (nonlignotuberous) was looked at in detail, because of its current importance
    in floriculture and distinct transition from juvenile to adult foliage, with one
    hundred and fifty seedlings being planted. Seed was obtained commercially from
    Nindethana Seed Service (WA), Blackwood Seeds (SA), Waite Arboretum and the Society
    for Growing Australian Plants. Eucalyptus albida was not planted but sourced from
    the Waite Arboretum. Thirty seedlings of each of the remaining 16 species were
    planted. All of the plants were potted on into black poly bags and were planted
    out in autumn of 1994. ^p The 6 month old seedlings were planted in March 1994
    into paddock W9, at the Waite Agricultural Research Institute, University of Adelaide,
    South Australia, 34°58''S, 138°38''E, altitude 100 m. at spacings of 3 m x 2.5
    m. The trees were planted in a computer generated, randomised order, into 10 blocks
    of 16 species. E. gunnii trees were planted as one large block. There was also
    a seven metre headland around the perimeter of the paddock, to allow for tractor
    manoeuvring. The Mediterranean climate has hot dry summers and cool wet winters,
    with an average rainfall of 625 mm. This was supplemented in summer with weekly
    watering by drip irrigation. Fertiliser application consisted of 100 g ''Complete
    D'' (NPK 8:4:8) per tree at planting and a further 100 g NPK per tree yearly,
    applied by hand under the tree canopy but away from the base of the trunk. ^p
    Plant material used is described in Chapter 2 and Table 3.1. Morphological characters
    were measured every 3 months on a minimum of 10 plants per species: tree height,
    trunk diameter at 5 cm above ground level, presence or absence of lignotuber,
    diameter of lignotuber (above ground parts), colour of fully expanded juvenile
    leaves using Royal Horticultural Society colour charts. Juvenile leaf shape, leaf
    glaucousness, phyllotaxy, and stem shape and waxiness at the juvenile stage were
    assessed visually. Age at phase change to intermediate or adult leaves was noted
    as well as time of flowering if they occurred within the experimental period of
    41 months. ^p Unfolding leaves (designated day 0) were tagged on 18 species of
    Eucalyptus. Juvenile leaves of three trees per species were sampled on day 0,
    day 16, and on full leaf expansion (day 30), for epicuticular wax examination.
    Epicuticular wax was studied on proximal and distal areas of unfolding leaves
    (day 0) of all species except E. albida. ^p Fresh leaf material of Eucalyptus
    gunnii was collected from trees in a commercial plantation at Forest Range, South
    Australia. Trees were chosen on the basis of extremes of leaf colour, with 15
    glaucous trees and 13 green trees chosen. Young leaves (nodes 1-5) were sealed
    in plastic bags and kept cold until returned to the laboratory.'
  original_file: raw/trait_data.csv (extracted from the source PDF by Claude AI, Anthropic)
  notes: data for additional traits, juvenile_stem_shape, juvenile_stem_waxiness,
    juvenile_to_adult_leaf_phase_change_age, leaf_wax_tube_arrangement, leaf_wax_mass_per_sample,
    leaf_area_sampled, leaf_wax_per_area, leaf_wax_n_alkane compounds, leaf_wax_alcohol
    compounds, leaf_wax - many additional compounds; leaf_essential_oil_per_fresh_mass.
    Tree height, trunk diameter (5 cm above ground) and lignotuber diameter at 16
    months (Table 3.3) are entity contexts on the Chapter 3 species-evaluation records
    of the same species, not traits. Chapter 5 (epicuticular wax structure and regeneration,
    Tables 5.1-5.4) is published as Wirthensohn and Sedgley (1996), with the same
    data in its Tables 1-4; the per-species wax descriptions used for leaf_epicuticular_wax_crystal_form
    and leaf_epicuticular_wax_density are in the thesis only. Wax tube length, tube
    diameter and surface cover are mapped from Tables 5.1, 5.2, 5.4 (control leaves
    only) and 7.1; the Table 5.3 means pooled across 18 species and the Table 5.4
    regrowth after wax removal remain in raw/trait_data.csv. From Chapter 7 (E. gunnii
    glaucous versus green trees), the glaucousness records and wax tube length, tube
    diameter and surface cover (Table 7.1) are mapped; the wax amounts (Table 7.2)
    and wax class composition remain in raw/trait_data.csv, as do leaf wax chemistry
    (Table 6.2), headspace volatiles (Table 6.3) and leaf oils (Table 6.4). Table
    6.1 wax yields (0.7-4.5 mg/cm2) are not consistent with the wax weights and leaf
    areas in the same table and are 30-200 times the Chapter 7 values for E. gunnii,
    so they should not be used. Species maximum heights from the Chapter 2 species
    descriptions (plant_height) are not mapped, as they are identical to values already
    in AusTraits from Flora of Australia (Chippendale 1988) and other compilations.
