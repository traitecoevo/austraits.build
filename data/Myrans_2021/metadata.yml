  custom_R_code: ' data |> dplyr::filter( trait %in% c( "leaf_mass_per_area", "leaf_N_per_dry_mass",
    "root_N_per_dry_mass", "root_phenol_per_dry_mass", "leaf_nitrate_per_dry_mass"
    ) ) '
  collection_date: 2019-01/2019-03
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  description: To test whether wild Australian Sorghum species up-regulate cyanogenic
    glucoside production under high nitrogen availability, whether low cyanogenic
    glucoside concentrations are compensated by nitrate, phenolics or silicon, and
    whether nitrogen productivity is reduced in species with high cyanogenic glucoside
    concentrations, compared with domesticated sorghum.
  basis_of_record: captive_cultivated
  life_stage: sapling
  sampling_strategy: 'Five wild Sorghum species (S. brachypodum, Sorghum laxiflorum
    F. M. Bailey, Sorghum leiocladum (Hack.) C. E. Hubb., S. macrospermum, and Sorghum
    matarankense E. D. Garber & Snyder) were grown alongside domesticated S. bicolor
    to test the effects of nitrogen supplementation on concentrations of CNglcs and
    nitrate, as well as growth. These species are spread across the genus, with at
    least one representative from each of its five subgenera, and are all native to
    Australia except for S. bicolor (Table 2). Seeds of wild species were provided
    by the Australian Grains Genebank (Horsham, VIC, Australia). All plants (n = 132)
    were grown under controlled greenhouse conditions at Monash University (coordinates:
    -37.91°, 145.14°) between January and March 2019, with a mean temperature of 27.3
    ± 2.5 °C and 22.7 ± 1.9 °C day/night, and an average photoperiod of 12.9 h (average
    illuminance was 6567 ± 5 lx). Shades were kept shut until photoperiod fell below
    12.5 h, after which shades were left open to compensate for reduced irradiation.
    Different numbers of each species were grown due to varying seed availability
    and germination rates. ^p Seeds were germinated following Cowan et al. (2020).
    Firstly, caryopses were removed from seed coverings and soaked in 3 mM gibberellic
    acid (Growth Regulator, G7645, Sigma-Aldrich) at room temperature for approximately
    15 h (excepting S. bicolor). Caryopses were then transferred to Petri dishes containing
    filter paper wetted with distilled water. Petri dishes were incubated in a constant
    temperature (CT) cabinet and the filter papers kept moist with distilled water.
    The temperature in the CT cabinet was set to 35 °C, with 14 h of light (06:00-20:00)
    each day. Petri dishes were wrapped in foil for the first 24 h in the CT cabinet.
    Once seeds had formed a small shoot and root, they were transferred to seedling
    trays containing Debco seed raising substrate (Debco Pty Ltd) and perlite (1:1
    v/v ratio) and kept in the greenhouse for 1.5 weeks. Seedlings were then planted
    in 1.9 L pots containing Richgro all-purpose potting mix (Richgro Garden Products)
    and perlite (2:1 v/v ratio) and kept in the greenhouse. Pots were then watered
    daily for two weeks before treatments started. ^p Treatments were applied as modified
    half-strength Long Ashton''s solution (Miller et al., 2014), containing either
    a low (LN, 2 mM) or high (HN, 12 mM) nitrogen concentration, with proportions
    of NO3- and NH4+ in a 3:1 mol/mol ratio (Supplementary Table A.1). Plants were
    each given 150 mL modified Long Ashton''s solution three times per week. They
    were also watered to saturation once per week for the first three weeks of treatment
    to prevent build-up of salts. Pot positions were rotated weekly to minimise microclimate
    effects. Nitrogen concentrations of 2 mM and 12 mM in the treatments were selected
    to represent deficient and excessive nitrogen provisioning respectively (O''Donnell,
    2012). Treatments were administered for six weeks, after which plants were harvested
    and separated into roots, sheaths and leaves and dried in ovens at 50 °C for one
    week.'
  original_file: data.csv is a copy of raw/trait_data.csv, transcribed from Tables
    3 and 4 and the Results text of the primary reference (no per-plant data available)
  notes: Locations are the seed-collection (provenance) sites of the five wild accessions
    from Table 2. All plants were grown and measured in a greenhouse at Monash University
    (-37.91, 145.14). The domesticated Sorghum bicolor inbred line BTx623 has no seed-collection
    site, so its rows are deliberately left without a location rather than given the
    greenhouse coordinates. Additional traits present in data.csv are longest stem
    length and leaf number of the 9-week-old plants (plant_stem_length_longest, plant_leaf_count),
    leaf and root HCN potential (leaf_HCN_potential, root_HCN_potential) and the proportion
    of plant nitrogen allocated to HCN (plant_N_allocated_to_HCN).
