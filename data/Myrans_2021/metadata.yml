contexts:
- context_property: nitrogen treatment
  category: treatment_context
  var_in: nitrogen_treatment
  values:
  - find: LN
    value: low nitrogen
    description: plants supplied with modified half-strength Long Ashton's solution
      containing 2 mM nitrogen (NO3- and NH4+ in a 3:1 mol/mol ratio) for six weeks,
      representing deficient nitrogen provisioning.
  - find: HN
    value: high nitrogen
    description: plants supplied with modified half-strength Long Ashton's solution
      containing 12 mM nitrogen (NO3- and NH4+ in a 3:1 mol/mol ratio) for six weeks,
      representing excessive nitrogen provisioning.
- context_property: leaf type
  category: entity_context
  var_in: leaf_type
- context_property: cultivar status
  category: entity_context
  var_in: cultivar_status
  values:
  - value: cultivar
    description: domesticated crop line (Sorghum bicolor inbred line BTx623).
  - value: wild type
    description: wild-collected seed accession.
- context_property: plant age at harvest (days)
  category: entity_context
  var_in: days_grown
traits:
- var_in: Fv_Fm
  unit_in: '{dimensionless}'
  trait_name: leaf_fluorescence_fv_over_fm
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Net photosynthetic rate (PN) and maximum quantum yield of photosystem II
    (Fv/Fm) were both measured after five weeks of the treatment period on the newest
    fully expanded leaf (n = 5). Fv/Fm was measured using a PAM-2000 Chlorophyll Fluorometer
    (WALZ, Effeltrich, Germany). Fv/Fm measurements were not possible for S. leiocladum
    plants under LN due to leaves being too narrow, meaning no Fv/Fm data are presented
    for this species.
  leaf_type: leaf blade
- var_in: net_photosynthesis_umol_per_m2_per_s
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_photosynthetic_rate_per_area_saturated
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Net photosynthetic rate (PN) and maximum quantum yield of photosystem II
    (Fv/Fm) were both measured after five weeks of the treatment period on the newest
    fully expanded leaf (n = 5). PN was measured using an LI-6400XT Portable Photosynthesis
    System (LI-COR Biosciences, NE, USA). Parameters were set at 1000 µmol m-2 s-1
    PAR, 400 ppm CO2 and 25 °C. Where leaf width was smaller than that of the internal
    gasket, corrections were made using the leaf-width based approach (Savvides and
    Fotopoulos, 2018).
  leaf_type: leaf blade
- var_in: SLA_cm2_per_g
  unit_in: cm2/g
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Plant growth was quantified by measuring the length of each plant's longest
    stem (base to uppermost ligule), number of leaves and total leaf area, as well
    as measuring the biomass of each plant's leaves, sheaths, roots and, if present,
    flower head. Total leaf area was measured using a LI-3000 portable area meter
    and a LI-3050A belt conveyor (LI-COR Biosciences, NE, USA). Senescent leaves were
    included in total biomass measurements, but not in leaf area measurements, specific
    leaf area or chemical analyses. ^p Plant performance was also quantified through
    calculating specific leaf area (SLA) and nitrogen productivity (ANplant) using
    the following equations. SLA = total leaf area / biomass of green leaves.
  leaf_type: leaf blade
- var_in: leaf_N_percent
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Total elemental nitrogen and carbon (%) was measured for the roots, sheaths and
    leaves by the School of Chemistry, Monash University (Clayton, VIC, Australia).
  leaf_type: leaf blade
- var_in: sheath_N_percent
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Total elemental nitrogen and carbon (%) was measured for the roots, sheaths and
    leaves by the School of Chemistry, Monash University (Clayton, VIC, Australia).
  leaf_type: leaf sheath
- var_in: root_N_percent
  unit_in: '%'
  trait_name: root_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Total elemental nitrogen and carbon (%) was measured for the roots, sheaths and
    leaves by the School of Chemistry, Monash University (Clayton, VIC, Australia).
  leaf_type: .na.character
- var_in: leaf_nitrate_mg_per_g
  unit_in: mg/g
  trait_name: leaf_nitrate_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Nitrate concentrations were measured following O'Donnell et al., 2013 through
    colorimetric assay in 96-well microtiter plates, using 15 mg tissue per sample.
  leaf_type: leaf blade
- var_in: sheath_nitrate_mg_per_g
  unit_in: mg/g
  trait_name: leaf_nitrate_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Nitrate concentrations were measured following O'Donnell et al., 2013 through
    colorimetric assay in 96-well microtiter plates, using 15 mg tissue per sample.
  leaf_type: leaf sheath
- var_in: leaf_phenolics_mg_per_g
  unit_in: mg/g
  trait_name: leaf_phenol_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'All chemical analyses were performed using finely ground oven-dried tissue.
    Phenolics were extracted from 10-20 mg dried tissue, to which 1 mL of 80 % methanol
    was added. The mixture was immediately homogenised in an MM 300 MixerMill (Retsch,
    Haan, Germany) for 1 min and then centrifuged at 4 °C at 960 rpm for 20 min. The
    supernatant was filtered through a 0.45 µm nylon membrane (Pall Corporation, Port
    Washington, NY, USA), and analysed for phenolics by HPLC on an Agilent 1290 Infinity
    HPLC equipped with a Gemini C18 reverse-phase column (2.7 µm, 150 mm × 3.0 mm;
    Phenomenex, Torrance, CA, USA). The elution system, consisting of solvents 0.25
    % H3PO4 in water (pH 2.2) (A) and acetonitrile (B), was: 0-5 min, 12 % B; 5-7
    min, 18 % B; 7-16 min, 58 % B; 16-20 min, 0% B; with a flow rate of 0.5 mL min-1.'
  leaf_type: leaf blade
- var_in: sheath_phenolics_mg_per_g
  unit_in: mg/g
  trait_name: leaf_phenol_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'All chemical analyses were performed using finely ground oven-dried tissue.
    Phenolics were extracted from 10-20 mg dried tissue, to which 1 mL of 80 % methanol
    was added. The mixture was immediately homogenised in an MM 300 MixerMill (Retsch,
    Haan, Germany) for 1 min and then centrifuged at 4 °C at 960 rpm for 20 min. The
    supernatant was filtered through a 0.45 µm nylon membrane (Pall Corporation, Port
    Washington, NY, USA), and analysed for phenolics by HPLC on an Agilent 1290 Infinity
    HPLC equipped with a Gemini C18 reverse-phase column (2.7 µm, 150 mm × 3.0 mm;
    Phenomenex, Torrance, CA, USA). The elution system, consisting of solvents 0.25
    % H3PO4 in water (pH 2.2) (A) and acetonitrile (B), was: 0-5 min, 12 % B; 5-7
    min, 18 % B; 7-16 min, 58 % B; 16-20 min, 0% B; with a flow rate of 0.5 mL min-1.'
  leaf_type: leaf sheath
- var_in: root_phenolics_mg_per_g
  unit_in: mg/g
  trait_name: root_phenol_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'All chemical analyses were performed using finely ground oven-dried tissue.
    Phenolics were extracted from 10-20 mg dried tissue, to which 1 mL of 80 % methanol
    was added. The mixture was immediately homogenised in an MM 300 MixerMill (Retsch,
    Haan, Germany) for 1 min and then centrifuged at 4 °C at 960 rpm for 20 min. The
    supernatant was filtered through a 0.45 µm nylon membrane (Pall Corporation, Port
    Washington, NY, USA), and analysed for phenolics by HPLC on an Agilent 1290 Infinity
    HPLC equipped with a Gemini C18 reverse-phase column (2.7 µm, 150 mm × 3.0 mm;
    Phenomenex, Torrance, CA, USA). The elution system, consisting of solvents 0.25
    % H3PO4 in water (pH 2.2) (A) and acetonitrile (B), was: 0-5 min, 12 % B; 5-7
    min, 18 % B; 7-16 min, 58 % B; 16-20 min, 0% B; with a flow rate of 0.5 mL min-1.'
  leaf_type: .na.character
- var_in: leaf_Si_percent
  unit_in: '%'
  trait_name: leaf_Si_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: Silicon concentration (%) was determined for dried and ground plant material
    (leaves, sheaths and roots, ca. 80 mg) of six replicate samples using an X-ray fluorescence
    spectrometer (Epsilon-3x, PANalytical, the Netherlands), following the methods
    of Reidinger et al. (2012) and Hiltpold et al. (2016), at the Hawkesbury Institute
    for the Environment, Western Sydney University (Richmond, NSW, Australia). Silicon
    was calibrated against a certified plant reference material of known silicon concentration
    (NCS ZC73018 Citrus leaves, China National Institute for Iron and Steel). Only
    samples from the HN treatment were used for silicon analysis due to tissue availability
    constraints for LN samples.
  leaf_type: leaf blade
- var_in: sheath_Si_percent
  unit_in: '%'
  trait_name: leaf_Si_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: Silicon concentration (%) was determined for dried and ground plant material
    (leaves, sheaths and roots, ca. 80 mg) of six replicate samples using an X-ray fluorescence
    spectrometer (Epsilon-3x, PANalytical, the Netherlands), following the methods
    of Reidinger et al. (2012) and Hiltpold et al. (2016), at the Hawkesbury Institute
    for the Environment, Western Sydney University (Richmond, NSW, Australia). Silicon
    was calibrated against a certified plant reference material of known silicon concentration
    (NCS ZC73018 Citrus leaves, China National Institute for Iron and Steel). Only
    samples from the HN treatment were used for silicon analysis due to tissue availability
    constraints for LN samples.
  leaf_type: leaf sheath
- var_in: root_Si_percent
  unit_in: '%'
  trait_name: root_Si_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 6
  methods: Silicon concentration (%) was determined for dried and ground plant material
    (leaves, sheaths and roots, ca. 80 mg) of six replicate samples using an X-ray fluorescence
    spectrometer (Epsilon-3x, PANalytical, the Netherlands), following the methods
    of Reidinger et al. (2012) and Hiltpold et al. (2016), at the Hawkesbury Institute
    for the Environment, Western Sydney University (Richmond, NSW, Australia). Silicon
    was calibrated against a certified plant reference material of known silicon concentration
    (NCS ZC73018 Citrus leaves, China National Institute for Iron and Steel). Only
    samples from the HN treatment were used for silicon analysis due to tissue availability
