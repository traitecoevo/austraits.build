contexts:
- context_property: nitrogen treatment
  category: treatment_context
  var_in: nitrogen_treatment
  values:
  - find: LN
    value: low nitrogen
    description: plants supplied with modified half-strength Long Ashton's solution
      containing 2 mM nitrogen (NO3- and NH4+ in a 3:1 mol/mol ratio) for six weeks,
      representing deficient nitrogen provisioning.
  - find: HN
    value: high nitrogen
    description: plants supplied with modified half-strength Long Ashton's solution
      containing 12 mM nitrogen (NO3- and NH4+ in a 3:1 mol/mol ratio) for six weeks,
      representing excessive nitrogen provisioning.
- context_property: leaf type
  category: entity_context
  var_in: leaf_type
  values:
  - value: leaf blade
    description: Measurements made on the leaf blade (lamina).
  - value: leaf sheath
    description: Measurements made on the leaf sheath.
- context_property: cultivar status
  category: entity_context
  var_in: cultivar_status
  values:
  - value: cultivar
    description: domesticated crop line (Sorghum bicolor inbred line BTx623).
  - value: wild type
    description: wild-collected seed accession.
traits:
- var_in: leaf_mass_per_area
  unit_in: cm2/g
  trait_name: leaf_mass_per_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Plant growth was quantified by measuring the length of each plant's longest
    stem (base to uppermost ligule), number of leaves and total leaf area, as well
    as measuring the biomass of each plant's leaves, sheaths, roots and, if present,
    flower head. Total leaf area was measured using a LI-3000 portable area meter
    and a LI-3050A belt conveyor (LI-COR Biosciences, NE, USA). Senescent leaves were
    included in total biomass measurements, but not in leaf area measurements, specific
    leaf area or chemical analyses. ^p Plant performance was also quantified through
    calculating specific leaf area (SLA) and nitrogen productivity (ANplant) using
    the following equations. SLA = total leaf area / biomass of green leaves.
- var_in: leaf_N_per_dry_mass
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Total elemental nitrogen and carbon (%) was measured for the roots, sheaths and
    leaves by the School of Chemistry, Monash University (Clayton, VIC, Australia).
- var_in: root_N_per_dry_mass
  unit_in: '%'
  trait_name: root_N_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Total elemental nitrogen and carbon (%) was measured for the roots, sheaths and
    leaves by the School of Chemistry, Monash University (Clayton, VIC, Australia).
- var_in: root_phenol_per_dry_mass
  unit_in: mg/g
  trait_name: root_phenol_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: 'Phenolics were extracted from 10-20 mg dried tissue, to which 1 mL of
    80 % methanol was added. The mixture was immediately homogenised in an MM 300
    MixerMill (Retsch, Haan, Germany) for 1 min and then centrifuged at 4 °C at 960
    rpm for 20 min. The supernatant was filtered through a 0.45 µm nylon membrane
    (Pall Corporation, Port Washington, NY, USA), and analysed for phenolics by HPLC
    on an Agilent 1290 Infinity HPLC equipped with a Gemini C18 reverse-phase column
    (2.7 µm, 150 mm × 3.0 mm; Phenomenex, Torrance, CA, USA). The elution system,
    consisting of solvents 0.25 % H3PO4 in water (pH 2.2) (A) and acetonitrile (B),
    was: 0-5 min, 12 % B; 5-7 min, 18 % B; 7-16 min, 58 % B; 16-20 min, 0% B; with
    a flow rate of 0.5 mL min-1.'
- var_in: leaf_nitrate_per_dry_mass
  unit_in: mg/g
  trait_name: leaf_nitrate_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All chemical analyses were performed using finely ground oven-dried tissue.
    Nitrate concentrations were measured following O'Donnell et al., 2013 through
    colorimetric assay in 96-well microtiter plates, using 15 mg tissue per sample.
substitutions: .na
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: Most of the data in this study (biomass, relative growth rate, net photosynthetic
    rate, Fv/Fm, and leaf, sheath and root HCN potential, nitrate, phenolic and silicon
    concentrations) are shown only as bar graphs. Can you provide either the per-plant
    data, or treatment/species means?
