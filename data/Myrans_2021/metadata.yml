questions:
  question1: The N% leaf, N% sheath and N% root values for S. matarankense in the raw
    data file (means 52-54, 25-28 and 18-23) do not match Table 4 (0.97-1.91, 0.74-1.44
    and 0.63-1.04%) and fall outside the allowed range, so they are excluded at build.
    I was trying to work out if these is a conversion factor, but nothing stands out. At the moment these values are excluded.
