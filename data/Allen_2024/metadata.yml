dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      mutate(
        taxon_name = paste0(stringr::str_to_title(genus), " ", species, " subsp. ", subspecies),
        location_name = ifelse(!is.na(latitude), paste0("site_at_", latitude, "_deg_lat_and_", longitude, "_deg_lon"), NA)
      ) |>
      generate_observation_numbers(taxon_name, trait)
  '
  collection_date: 2024-09-19/2024-09-20
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: This was an opportunistic component of a hand pollination experiment for Bossiaea fragrans, designed to identify its' dominant breeding system and assess the impact of genetic relatedness on offspring fitness.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Photographs of observed floral visitors and possible pollinators for Bossiaea fragrans subspecies fragrans taken opportunistically in-field at sites selected for a hand-pollination experiment. These sites were selected based on population genetic data. There was no selection of individuals for this portion of the study as all observations made were opportunistic.
  original_file: in raw data folder
  notes: none
