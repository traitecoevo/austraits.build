contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: pollinator_species
- context_property: replicate observations
  category: temporal_context
  var_in: observation_number
traits:
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Photographs of observed floral visitors for Bossiaea fragrans subspecies fragrans taken opportunistically in-field at sites selected for a hand-pollination experiment. All floral visitors were in contact with the flowers when photographs were taken.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Photographs of observed possible pollinators for Bossiaea fragrans subspecies fragrans taken opportunistically in-field at sites selected for a hand-pollination experiment. All possible pollinators were in contact with the flowers when photographs were taken.
- var_in: pollination_syndrome
