traits:
- var_in: leaf
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 5
  methods: 'Sun-exposed leaves from the upper part of the canopy and wood samples
    were collected from five individuals of each species per zone. The material
    from each individual was analysed separately to record variability within the
    population. Ten leaves from one branch were bulked for each individual tree.
    ^p Samples were air-dried in the field and redried to a constant weight at 80°C
    in the laboratory, and were finely ground. Sample 13C/12C was measured by an
    Isochrom (Micromass, Middlewich, UK) continuous-flow mass spectrometer after
    combustion in a Carlo Erba (Milan, Italy) elemental analyser. 13C/12C ratios
    were converted to discriminations (Delta in ‰) by assuming a 13C composition for
    air of -7.8‰ relative to PDB (Farquhar et al. 1982). Repeated measures of the
    reference and selected Eucalyptus samples usually had standard deviations of
    ≈0.1‰.'
- var_in: wood
  unit_in: '{delta}[ppth]'
  trait_name: wood_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 5
  methods: 'Sun-exposed leaves from the upper part of the canopy and wood samples
    were collected from five individuals of each species per zone. The material
    from each individual was analysed separately to record variability within the
    population. Wood material was collected as shavings from a hand drill from two
    holes per individual, or as a basal disk for the smallest trees and the mallee
    growth forms. The drill penetrated ≈100 mm after the bark had been removed.
    The exact number of years each wood sample represented could not be determined.
    In the wetter areas, where the annual growth increments are larger, fewer years
    are represented than in the drier areas. ^p Samples were air-dried in the field
    and redried to a constant weight at 80°C in the laboratory, and were finely
    ground. Sample 13C/12C was measured by an Isochrom (Micromass, Middlewich, UK)
    continuous-flow mass spectrometer after combustion in a Carlo Erba (Milan, Italy)
    elemental analyser. 13C/12C ratios were converted to discriminations (Delta in ‰)
    by assuming a 13C composition for air of -7.8‰ relative to PDB (Farquhar et
    al. 1982). Repeated measures of the reference and selected Eucalyptus samples
    usually had standard deviations of ≈0.1‰.'
