  replicates: 5
  methods: 'Sun-exposed leaves from the upper part of the canopy and wood samples
    were collected from five individuals of each species per zone. The material
    from each individual was analysed separately to record variability within the
    population. Ten leaves from one branch were bulked for each individual tree.
    ^p Samples were air-dried in the field and redried to a constant weight at 80°C
    in the laboratory, and were finely ground. Sample 13C/12C was measured by an
    Isochrom (Micromass, Middlewich, UK) continuous-flow mass spectrometer after
    combustion in a Carlo Erba (Milan, Italy) elemental analyser. 13C/12C ratios
    were converted to discriminations (Delta in ‰) by assuming a 13C composition for
    air of -7.8‰ relative to PDB (Farquhar et al. 1982). Repeated measures of the
    reference and selected Eucalyptus samples usually had standard deviations of
    ≈0.1‰.'
