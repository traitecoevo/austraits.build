  methods: 'Sun-exposed leaves from the upper part of the canopy and wood samples
    were collected from five individuals of each species per zone. The material
    from each individual was analysed separately to record variability within the
    population. Wood material was collected as shavings from a hand drill from two
    holes per individual, or as a basal disk for the smallest trees and the mallee
    growth forms. The drill penetrated ≈100 mm after the bark had been removed.
    The exact number of years each wood sample represented could not be determined.
    In the wetter areas, where the annual growth increments are larger, fewer years
    are represented than in the drier areas. ^p Samples were air-dried in the field
