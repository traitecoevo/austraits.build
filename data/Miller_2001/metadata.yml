dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: 1996-09-16/1996-10-18
  taxon_name: species
  trait_name: tissue
  value: delta13C_permil
  location_name: location_name
  description: To test whether patterns of leaf and wood carbon isotope discrimination
    (a measure of stomatal limitation on photosynthesis) across a sequence of co-occurring
    and replacement Eucalyptus species could explain the species'' distributions
    along a subcontinental rainfall gradient in the monsoonal tropics of northern
    Australia.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'We measured Delta along the Northern Australian Tropical Transect,
    one of a series of the continental-scale transects of the International Geosphere-Biosphere
    Programme (IGBP) core project ''Global Change and Terrestrial Ecosystems'' (Koch
    et al. 1995), established to examine the responses of ecosystems to global environmental
    change. The transect runs from the Darwin region on the north coast of the NT
    (≈12.5°S) to the Tanami Desert region at 18-19°S. Across the transect,
    and further south to the southern border of the NT (≈25°S) there is an eightfold
    decrease in total annual rainfall from 1600 to 200 mm year-1 (Fig. 2a). Around
    80% of the rain occurs during December to March (the wet season) in the northern
    half of the transect. As latitude increases, the rainfall becomes less seasonal
    and more variable, and at the southern edge of the transect only 50% of the
    rainfall occurs during the wet season (Cook & Heergeden 1997; Heerdegen & Cook
    1999). The annual average mid-afternoon saturation vapour pressure deficits (SVPD)
    increased during the wet season from 12°S latitude to around 20°S (where
    rainfall is ≈400 mm year-1), but were relatively uniform further south into the
    drier areas (Fig. 2b). The sampling protocol attempted to space sample collections
    evenly along the Stuart Highway (Fig. 2c). The collection intervals in terms
    of changes in rainfall between zones were therefore greater in the north than
    in the south. ^p Dominant Eucalyptus species with mapped distributions (Brooker
    & Kleinig 1994) were selected a priori to include those restricted to the wetter,
    northern end of the transect (E. miniata A. Cunn. Ex. Schauer; E. tetrodonta
    F. Muell.; and E. tectifica F. Muell.), the middle of the transect (E. chlorophylla
    Brooker & Done; E. confertiflora F. Muell.; E. pruinosa Schauer; E. coolabah
    Blakely & Jacobs ssp. coolabah; E. leucophloia Brooker ssp. QQ; and E. dichromophloia
    F. Muell.), and the drier southern end of the transect (E. terminalis F. Muell.;
    E. odontocarpa F. Muell.; E. pachyphylla F. Muell.; and E. gamophylla F. Muell.).
    Species with restricted distributions (possibly linked to specific soil types)
    were avoided, although E. tectifica, E. chlorophylla and E. odontocarpa have
    relatively narrow distributions. Eucalyptus pruinosa, E. leucophloia and E. dichromophloia
    have wide distributions, and E. terminalis was selected because it has an extremely
    wide distribution. Most of the species are evergreen, although E. confertiflora
    is completely dry-season deciduous. Adult E. confertiflora and E. pruinosa retain
    the juvenile leaf-form, while the other species switch to the adult leaf-form
    at maturity. Eucalyptus odontocarpa, E. pachyphylla and E. gamophylla are multistemmed
    mallee shrubs ≈4 m tall, while the other species are single-stemmed trees. ^p
    We sampled along 1750 km of the Stuart Highway between Darwin and the southern
    border of the NT. The distance was divided into 33 zones (each ≈50 km long).
    The species that occurred in each zone were sampled once per zone at locations
    where they were locally abundant. Not all species within a zone occurred as
    a mixed stand at the same location, so samples were collected at 97 locations.
    Most of the locations were flat, and we sampled on loams and sandy soils as
    the species of interest were not common on clay soils (Williams et al. 1996).
    There was no stratification in sampling for soil type. Sampling was conducted
    at locations accessible from the highway at the end of the dry season between
    16 September and 18 October 1996.'
  original_file: data digitised from figures in thesis and publications by AusTraits curators
  notes: The subspecies name "E. leucophloia Brooker ssp. QQ" could not be resolved. This name appears in the thesis and the journal publication. Data manually digitised from Fig 3 using https://plotdigitizer.com/app. Values are rounded to the nearest 0.1 per mil, but accuracy is likely closer to 0.2 per mil. The methods state there were 97 sites sampled, but as we do not known their exact locations, we've grouped based on leaf-wood pairs of samples for each species, yielding 116 sites; there would have been too many assumptions trying to collapse across taxa.
