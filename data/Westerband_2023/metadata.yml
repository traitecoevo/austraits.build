    PNUE, PPUE), is.na)) |> mutate(Species = str_replace(Species, " ssp.", " subsp.
    ")) '
  collection_date: collection_date
  taxon_name: Species
  location_name: Site
  source_id: source_id
  description: Here we investigated the dependency of photosynthetic traits on climate
    and soil properties using a new Australia-wide trait dataset spanning 528 species
    from 67 sites.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: '2.1 Study system ^p Australia is highly suited for this line
    of inquiry as there is wide environmental variation in both soils and climate.
    The central portion of the continent (ca. 70% by land area) is arid to semi-arid,
    while coastal regions vary from Mediterranean in the south to southwest, cool
    temperate in the south, temperate to tropical in the east, and wet–dry tropics
    in the far north. Although Australian soils are on the whole ancient and nutrient-poor
    (He et al., 2021; Kooyman et al., 2017; Viscarra Rossel & Bui, 2016), higher-nutrient
    soils punctuate the landscape (de Caritat et al., 2011; Viscarra Rossel & Bui,
    2016) and the Great Dividing Range, which runs 3500 km north to south, approximately
    parallel to the east coast of Australia, divides the mesic coastal regions from
    the arid interior. Furthermore, although much of Australia has acidic soil, calcareous
    soils with high pH are also present across wide areas (de Caritat et al., 2011),
    for example in southern Australia, resulting from repeated marine incursions beginning
    in the Miocene era (Northcote & Wright, 1982; Taylor, 1994). In this study, the
    majority of the sites were on acidic soils with low soil nutrient availability
    (Table S1), which is representative of Australia but also relevant to other, similarly
    leached regions of the world. ^p 2.2 Field data collection ^p Leaf trait data
    were collected on woody and non-woody plant species at three sites between December
    2018 and March 2019: Kidman Springs Research Station (tropical savanna, sampled
    during the wet season; Northern Territory), Royal National Park (subtropical rainforest;
    New South Wales), and Mount Keira (subtropical rainforest; New South Wales). Latitude,
    longitude, and climate data for these sites can be found in Table S1. These sites
    were chosen to increase the number of samples within sites of moderately high
    total soil P concentrations and moderately high soil pH (Figure S2), compared
    with site coverage in our compilation of literature data, described below. Ten
    soil samples (to 30 cm depth) were collected at each site and air-dried prior
    to laboratory analyses (CSPB laboratory in Bibra Lake WA, Australia) of soil pH
    in CaCl2 solution (Rayment & Lyons, 2011) and total soil P concentration via colorimetry,
    following Kjeldahl digestion (Rayment and Lyons Method 9A3b). ^p We sampled seven
    to 28 species per site, randomly selecting three to eight individuals per species
    and focusing on dominant woody and non-woody species (excluding C4 plants). Photosynthetic
    traits were measured using a Li-6800 gas exchange system (Li-Cor Biosciences).
    Survey-style gas exchange measurements were made between 0800 and 1400 h on one
    leaf per plant. Young but fully expanded, undamaged leaves were sampled from the
    most sun-exposed portion of each canopy. We measured light-saturated (photosynthetic
    photon flux density of 1800 µmol m−2 s−1) photosynthesis per unit area (Aarea,
    µmol CO2 m−2 s−1) at an atmospheric CO2 concentration of 400 µmol mol−1, allowing
    leaves to remain in the chamber for several minutes. Leaf temperatures were initially
    set to 25°C, although in many cases the temperature had to be increased above
    this to prevent condensation in the cuvette. Mean leaf temperature was 29°C with
    95% of measurements made between 25 and 35°C; relative humidity varied between
    40 and 80%. We also recorded stomatal conductance to water vapor (gsw, mmol m−2
    s−1) associated with light-saturated photosynthesis, and the ratio of internal
    to ambient CO2 concentration (Ci:Ca, unitless). We note that gas exchange rates
    are sensitive to plant water status and can exhibit pronounced temporal (e.g.,
    diurnal, seasonal) variation. By measuring photosynthesis and stomatal conductance
    in light-saturated leaves at a controlled temperature and humidity, we reduced
    the amount of variation in the data by creating favorable conditions for photosynthesis
    inside the cuvette. ^p We also collected five or more outer canopy leaves per
    plant, sampling from multiple branches up to 10 m above the ground, using an extendable
    pole pruner. Leaves were scanned to estimate leaf area, dried at 60°C for a minimum
    of 72 h and weighed to calculate leaf mass per area (LMA, g m−2). Samples were
    analyzed for leaf N concentration (% mass basis) by the Stable Isotope Core Laboratory
    at Washington State University, USA using an elemental analyzer (ECS 4010, Costech
    Analytical). Leaf N per area (Narea; g m−2) was calculated as Narea = Nmass ×
    SLA−1. ^p 2.3 Data compilation ^p 2.3.1 Trait data ^p We compiled field-measured
    photosynthetic trait data from published and unpublished studies that employed
    similar standard methods to those described above, that is, light-saturated photosynthesis
    measured on young but fully expanded, undamaged “sun” leaves at ambient atmospheric
    CO2 concentration, and relative humidity between 40 and 80%. See Table S2 for
    a full list of source publications, noting that some of the trait data included
    herein are not published. Further details regarding our field methods can be found
    below. For inclusion, a dataset had to contain field-measured Asat, gsw, and Ci;
    where available we also extracted data for leaf temperature (Tleaf), LMA, and
    Narea. We estimated carboxylation capacity at a standardized temperature of 25°C
    (Vcmax 25) following the one-point method (De Kauwe et al., 2016), which utilizes
    Tleaf, Asat, and Ci. We consulted the original publication or contacted the data
    owners to determine the appropriate leaf temperature for studies where Tleaf was
    not reported. If Vcmax 25 from a CO2-response (A-Ci) curve was provided, we used
    these data rather than estimating Vcmax 25 via the “one-point method” (De Kauwe
    et al., 2016); 179 measurements, or 6% of the original dataset. To ensure consistency
    in approach to estimating Vcmax, Rday (CO2 evolution from mitochondria in the
    light) was estimated as 1.5% of Vcmax, following De Kauwe et al. (2016), rather
    than from reported estimates of field-measured leaf “dark” respiration (Rd, which
    were relatively scarce among the compiled datasets). ^p We visually inspected
    the data to find obvious errors (e.g., trait values <0; Ci:Ca >1) and outliers,
    conservatively excluding from the analyses any observations with Vcmax 25 > 500
    µmol CO2 m−2 s−1, and gsw > 3000 mmol m−2 s−1. This resulted in the exclusion
    of nine observations (seven for Vcmax 25, two for gsw). These cut-offs were based
    on previously published studies (Smith et al., 2019; Wright, Reich, et al., 2004).
    ^p 2.3.2 Climate and soil data ^p Long-term averages (1982–2002) of climate data
    (Table S3) were obtained for each site from the ANUClimate model (Hutchinson et
    al., 2009) and TERN Ecosystem Modelling and Scaling Infrastructure (eMAST) data
    products (Hutchinson et al., 2009; Xu et al., 2015), both of which provide Australia-wide
    coverage at 0.01° spatial resolution, 1970–2012 (https://www.tern.org.au/). We
    include a total of 21 soil and climate properties. Across the 68 study sites,
    MAT varied from 9.25 to 27.6°C, and MAP from 260 to 4390 mm (Figure S2). ^p We
    had field-measured data for soil total P concentrations from 34 sites and for
    soil pH (CaCl2) from 28 sites. Otherwise we extracted modelled estimates of soil
    total P concentration and pH (CaCl2) from the TERN Soil and Landscape Grid of
    Australia (Grundy et al., 2015; Viscarra Rossel et al., 2014) (https://data.csiro.au/),
    which offers Australia-wide gridded data at a resolution of 3 arc s (ca. 90 ×
    90 m pixels). We also extracted additional soil properties known to influence
    soil fertility, including soil texture, soil organic matter concentration, and
    cation exchange capacity (Table S3). In the combined dataset, soil total P concentration
    varied from 28.8 to 3790 ppm (mg kg−1), and pH from 3 to 9. There were two sites
    with exceptionally high (measured) soil P concentrations (Dorrigo National Park,
    NSW and Curtain Fig National Park, QLD); without these sites, maximum soil P concentration
    was 1786 ppm.'
  original_file: in raw data folder; slightly different to Dryad archive
  notes: The custom_R_code contains detailed filters to remove data already incorporated
    in AusTraits under individual dataset_id's. Filtering occurs at the level of dataset
    by species by trait matches (for references that match between AusTraits and the
    Westerband reference list).In addition to exact matches, variants treated as the
    same taxon, because values match, are Senna artemisioides (Bloomfield_2018 Senna
    artemisioides ssp. filifolia); Melaleuca systena, Hakea incrassate and Scaevola
    (Guilherme_Pereira_2019 Melaleuca affi. systena, Hakea incrassata, Scaevola crassifolia);
    and Dodonaea triquetra and Smilax glyciphylla (Leishman_2007 Dodonaea spp, Smilax
    sp).
