    .x))) |> mutate(across(c(LeafN_area_g.m2), ~ ifelse(stringr::str_detect(Reference.s.,
    "Walker, A.P."), NA_character_, .x))) |> filter(!if_all(c(Asat_area_micromol.m2.s,
