    data for leaf temperature (Tleaf), LMA, and Narea. We estimated carboxylation
    capacity at a standardized temperature of 25°C (Vcmax 25) following the one-point
    method (De Kauwe et al., 2016), which utilizes Tleaf, Asat, and Ci. We consulted
    the original publication or contacted the data owners to determine the appropriate
    leaf temperature for studies where Tleaf was not reported. If Vcmax 25 from a
    CO2-response (A-Ci) curve was provided, we used these data rather than estimating
    Vcmax 25 via the “one-point method” (De Kauwe et al., 2016); 179 measurements,
    or 6% of the original dataset. To ensure consistency in approach to estimating
    Vcmax, Rday (CO2 evolution from mitochondria in the light) was estimated as 1.5%
    of Vcmax, following De Kauwe et al. (2016), rather than from reported estimates
    of field-measured leaf “dark” respiration (Rd, which were relatively scarce among
    the compiled datasets). ^p We visually inspected the data to find obvious errors
    (e.g., trait values <0; Ci:Ca >1) and outliers, conservatively excluding from
    the analyses any observations with Vcmax 25 > 500 µmol CO2 m−2 s−1, and gsw >
    3000 mmol m−2 s−1. This resulted in the exclusion of nine observations (seven
    for Vcmax 25, two for gsw). These cut-offs were based on previously published
    studies (Smith et al., 2019; Wright, Reich, et al., 2004).
