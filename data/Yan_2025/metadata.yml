contexts:
- context_property: leaf age
  category: entity_context
  var_in: leaf age
traits:
- var_in: Nitrogen_mg_g
  unit_in: mg/g
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: After collection, all plant samples were dried at 70°C for >72 h and ground
    to a fine powder using a ceramic ball mill (Mixer Mill MM 400, Retsch, Haan, Germany).
    Nitrogen (N) concentrations were analysed using a LECO Trumac Analyser (LECO model
    CHN828, St. Joseph, MI, USA).
- var_in: Phosphorus_mg_g
  unit_in: mg/g
  trait_name: leaf_P_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: After collection, all plant samples were dried at 70°C for >72 h and ground
    to a fine powder using a ceramic ball mill (Mixer Mill MM 400, Retsch, Haan, Germany).
    Other elements (P, potassium (K), calcium (Ca), copper (Cu), zinc (Zn), Mn, Fe
    and magnesium (Mg)) were analysed via inductively coupled plasma-mass spectrometry
    (ICP-MS, Perkin Elmer ICPMS NexION 2000B with ESIFAST autosampler, Waltham, Massachussetts,
    US) and Inductively Coupled Plasma Optical Emission Spectrometer (ICPOES, Perkin
    Elmer Avio 500, Waltham, Massachussetts, US) after nitric acid digestion, following
    the American Public Health Association (APHA) guidelines for metal analysis (APHA,
    2018).
