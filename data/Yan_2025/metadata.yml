dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(across(c("Iron_mg_kg", "Silicon_mg_kg"), ~ stringr::str_replace(.x, "<", "")))
  '
  collection_date: 2022-11
  taxon_name: Species
  location_name: Site_name
  description: A study investigating how mycorrhizal plants succeed in P-impoverished
    environments without relying on fungal symbiosis, challenging the paradigm that
    carboxylate-driven P acquisition is exclusive to non-mycorrhizal species.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Study sites ^p A total of 18 sites from three regions were selected
    in New South Wales, Australia (33°37'-33°47'S, 150°19'-151°17'E). Sites were selected
    based on the distribution of various Myrtaceae, particularly eucalypts, i.e. Angophora,
    Blakella, Corymbia and Eucalyptus (Fig. 1). These sites included seven from the
    Blue Mountains region (Davies Park, Grose Road, Euroka, Lapstone and Minnehaha
    Reserve), eight from a coastal region (four sites in Kuring-Gai Chase National
    Park, two in Kuring-Gai Wildflower Garden as examples of pristine, remnant natural
    vegetation, and two in Dog Pound Creek Reserve), and three from Western Sydney
    (two in Castlereagh Reserve and one at EucFACE). Soils at all sites were considered
    to be low in available soil P (Supplementary Data Tables S1 and S2). ^p Leaf and
    soil collection ^p Leaf and soil samples were collected from all 18 sites in November
    2022. In total, we collected a diverse range of Myrtaceae, including 30 eucalypt
    species (six Angophora, one Blakella, one Corymbia, and 22 Eucalyptus species),
    as well as two Melaleuca and two Gaudium species (known as Leptospermum before
    revision of the genus; Wilson and Heslewood, 2023). Banksia species were chosen
    as positive reference species when present, as they produce cluster roots and
    exude carboxylates under low-P conditions (Shane and Lambers, 2005a). However,
    due to their absence at two sites (Kuring-Gai Chase National Park 1 and Lapstone),
    they were substituted by Persoonia, which belongs to the same family; it lacks
    cluster roots but does release root carboxylates (Lambers et al., 2021). Xanthorrhoea
    species served as negative reference species at most sites, based on published
    results, suggesting very low/no release of root carboxylates (Zhong et al., 2021,
    Zhou et al., 2022, Wang et al., 2025). Acacia and Macrozamia species, and young
    leaves of Eucalyptus species (at the Lapstone site) were selected as negative
    references when Xanthorrhoea was absent. In cases where reliable positive or negative
    reference species were unavailable, average values obtained from all other sites
    were used instead. Average positive references (APR) were used at Western Sydney-EucFACE
    and Coastal-Dog Pound Creek Reserve 2; average negative references (ANR) were
    used at Blue Mountains-Gross Road, Blue Mountains-Minnehaha 1, Western Sydney-Castlereagh
    Reserve 2 and Coastal-Kuring-Gai Wildflower Garden 2. At each site, four to five
    mature healthy individuals of similar height were selected for each species and
    five to 10 g of leaf material was sampled from each plant. The youngest fully
    mature intact leaves were selected. ^p Soil samples were collected from five locations
    at each site, with locations centrally located within the distribution of sampled
    plants. Within each location, leaf litter was removed and three soil cores (10
    cm depth) were taken and bulked (200 to 300 g).
  original_file: in raw data folder
  notes: none
identifiers: .na
