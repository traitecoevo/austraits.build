questions:
  question2: the contributor spreadsheet gives Colletidae sp. as a pollinator/visitor
    of Persoonia terminalis subsp. terminalis pollinator, but Appendix S4 and the
    main text both say Megachilidae. Megachilidae is used here; for Monotaxis macrophylla,
    the main text calls both pollinating bees Halictidae, but Appendix S4 identifies
    one as possibly Exoneura sp. (Apidae, Allodapini). Both are mapped to bee.'
  question4: Four Appendix S4 flower-contact records missing from the spreadsheet
    you submitted are included (a second native bee pollinating Monotaxis macrophylla;
    ants and a Lema leaf beetle on Kardomia odontocalyx flowers; Pieridae possibly
    nectaring on Homoranthus binghiensis). Should any be dropped?
