  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Summary of previous knowledge and new field observations from the current
    study of surveyed species within the Torrington SCA and Bolivia Hill NR. ^p Once
    a population was found, a maximum of 5–10 min was spent recording rapid visual
    estimates of population size, population age, health and phenology. ^p Populations
    in which burnt adults resprouted or suckered are recorded as resprouting, and
    populations in which burnt adults were killed and recruitment was from seed are
    recorded as fire-killed, separately for each fire intensity where the response
    differed.
