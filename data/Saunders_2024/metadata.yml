locations:
  Torrington State Conservation Area:
    latitude (deg): -29.2485
    longitude (deg): 151.5392
    description: Woodland, heath and granite outcrops on the New England Batholith
    fire history: the entire reserve was burnt in the November 2019 wildfire, with
      local burn impacts from unburnt to severely burnt.
    elevation (m): 804--1163
    georeference remarks: Coordinates approximate, based reserve name
    locality: Torrington State Conservation Area
    state: NSW
  Bolivia Hill Nature Reserve:
    latitude (deg): -29.3385
    longitude (deg): 151.9249
    description: Woodland, heath and granite outcrops
    fire history: not burnt in the 2019-2020 megafires, with the last recorded major
      wildfire in 2002.
    elevation (m): 1104--1126
    georeference remarks: Coordinates approximate, based reserve name
    locality: Bolivia Hill Nature Reserve
    state: NSW
contexts:
- context_property: fire intensity
  category: plot_context
  var_in: fire_intensity
  values:
  - value: low intensity
    description: Populations described as lightly burnt or burnt by low or lower intensity
      fire in the November 2019 wildfire.
  - value: high intensity
    description: Populations described as heavily burnt, burnt by crown fire, or burnt
      by higher intensity fire in the November 2019 wildfire.
  - value: low to moderate intensity
    description: Response observed after light and moderate intensity fire in the
      November 2019 wildfire.
  - value: moderate to high intensity
    description: Response observed after moderate to high intensity fire in the November
      2019 wildfire.
  - value: low to high intensity
    description: Response observed across fire intensities in the November 2019 wildfire,
      including after low intensity fire.
- context_property: flower visitor taxon name
  category: entity_context
  var_in: entity_context
- context_property: pollination evidence
  category: method_context
  var_in: visitor_behaviour
  values:
  - find: pollinating
    value: pollinating
    description: Insect clearly collecting pollen and/or transferring pollen between
      flowers.
  - find: nectaring, potentially pollinating
    value: nectaring, potentially pollinating
    description: Insect observed on flowers, but pollen transfer was not clear.
  - find: nectaring
    value: nectaring
    description: Insect observed nectaring on flowers.
  - find: possibly nectaring
    value: possibly nectaring
    description: Insect observed on flowers and possibly nectaring.
