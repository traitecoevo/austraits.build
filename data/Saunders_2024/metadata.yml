    |> dplyr::mutate( collection_date = dplyr::if_else(is.na(collection_date) | collection_date
    == "", "2020-10/2021-07", collection_date) ) '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  description: To determine how many of 21 priority-listed rare and threatened plant
    species in northern New South Wales survived and/or recruited after the 2019-2020
    megafires, and whether survival was linked to estimated local fire severity.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'In October 2020, 11 months after the Torrington wildfire in
    November 2019, we commenced a rapid assessment of 21 priority listed plant (Department
    of Climate Change, Energy, the Environment and Water, 2021), along with additional
    rare taxa known to occur in similar environments. The following 21 species were
    targeted: Acacia pubifolia Pedley, Acacia pycnostachya F.Muell. ex Benth., Acacia
    torringtonensis Tindale, Acacia williamsiana J.T.Hunter, Almaleea cambagei (Maiden
    & Betche) Crisp & P.H.Weston, Boronia boliviensis J.B.Williams & J.T.Hunter, Boronia
    granitica Maiden & Betche, Boronia inflexa ssp. torringtonensis Duretto, Brachyloma
    saxicola J.T.Hunter, Callistemon pungens Lumley & R.D.Spencer, Cassinia heleniae
    Orchard, Eucalyptus boliviana J.B.Williams & K.D.Hill, Hakea macrorrhyncha W.R.Barker,
    Homoranthus binghiensis J.T.Hunter, Homoranthus croftianus J.T.Hunter, Homoranthus
    lunatus Craven & S.R.Jones, Kardomia odontocalyx (A.R.Bean) Peter G.Wilson, Monotaxis
    macrophylla Benth., Persoonia terminalis ssp. terminalis L.A.S.Johnson & P.H.Weston,
    Prostanthera teretifolia Maiden & Betche and Thesium australe R.Br. A total of
    13 of the species are listed as either endangered or vulnerable on the NSW Biodiversity
    Conservation Act 2016 (BCA Act) and/or the federal Environmental Protection and
    Biodiversity Act (EPBC Act). Boronia boliviensis, B. granitica and B. inflexa
    ssp. torringtonensis may now be recognized in the genus Cyanothamnus (Duretto
    et al., 2020), but we will use Boronia in this paper to align with the priority
    list the project was funded under. ^p To locate populations of target threatened
    species, we used adaptive meanders (similar to adaptive line transects, or ‘Pollard
    walks’, of Pollard et al. (2002) used for butterfly sampling). Walks follow a
    non-linear path in response to topography and habitat conditions, with an expert
    observer maintaining a steady pace and looking within a buffer of approximately
    15 m (or line of sight) on each side of the navigated path for target species
    and suitable habitat. When a species or likely habitat is sighted, the observer
    leaves the path to search the likely habitat, confirm the species'' location and
    relevant information and then continues along the navigated path direction. The
    method is designed to cover as many locations and populations as possible with
    limited time and resources. Many of the target taxa were known to be restricted
    to granite outcrops and rock pavements (Bean, 1997; Clarke et al., 1998; Hunter,
    1997a, 1997b; Hunter, 1998a,1998b; Hunter & Clarke, 1998; Hunter & Copeland, 2001;
    Hunter & Williams, 1994; Williams & Hunter, 2006) while others were associated
    with intermediate or other landscape features. Similarly, A. cambagei is known
    largely from wetland areas (Clarke et al., 1998). Given the known preference of
    some target taxa for these habitats, the adaptive meanders prioritized rock pavements,
    outcrops and wetlands within the vicinity of the search paths; however, all habitats
    between target habitats were included in searches. In total, 20 adaptive meanders
    were undertaken across the range of environments found within the reserves between
    October 2020 and July 2021. All walks were led by JTH, an expert botanist with
    decades of experience working closely with the target species, who is highly skilled
    in being able to identify the target species in situ. ^p Once a population was
    found, a maximum of 5–10 min was spent recording rapid visual estimates of population
    size, population age, health and phenology. We used the free mobile and web application
    Epicollect5 (Aanensen et al., 2014) to enable mobile phone-based data collection
    and collected data from each location with the following main fields: date; location
    (latitude-longitude and easting-northing, with location error in meters recorded);
    taxa; estimated population size (<10, 10–50, 50–100, 100–500, 500–1000, 1000 plus);
    population age (mainly adults, mixed stand, mainly juveniles); phenology of the
    entire population (non-reproductive, largely not reproductive, few flowers, mostly
    flowering, flowers and fruit, mainly fruit); health (healthy, mixed, unhealthy,
    many dead); visual estimates of wildfire severity at the precise location (unburnt,
    scorch to 1 m, scorch 1–5 m, scorch 5–10 m, scorch >10 m, crown fire). Population
    size and age were estimated with a rapid visual count. Phenology and health were
    rapidly assessed using visual estimates of proportion of individuals and individual
    branches with flowers or fruits and/or obvious signs of herbivory or other factors
    affecting health (e.g., dieback). Populations were considered different if there
    was a clear and distinct discontinuity between patches; however, this was different
    for different species. For example, the highly restricted rock outcrop species
    had clear disjunctions, whereas other species such as P. terminalis ssp. terminalis
    were largely scattered individuals. As a general rule, if several hundred meters
    were passed without seeing any more individuals of the species it was considered
    the population had a defined boundary. ^p To gather additional ecological information
    on some target species, we established 11 monitoring sites covering 16 species
    across Torrington SCA (nine sites) and Bolivia Hill NR (two sites) (Appendix S3).
    These sites were a combination of known locations and new sites identified through
    adaptive meanders and were limited to sites where at least 100 individuals were
    counted. Baseline monitoring was established in October–early December 2020 for
    10 species and additional sites for the remaining six species were established
    from late January to early April 2021 as populations of other species were found
    during adaptive meanders. Most species (n = 14) were monitored at least twice:
    the first monitoring was conducted October 2020– February 2021 (austral late spring–summer)
    and the second monitoring in May 2021 (austral late autumn-winter). Populations
    of two species (E. boliviana and B. inflexa ssp. torringtonensis) were only monitored
    once due to being discovered later in the study period and logistical issues that
    prevented a second monitoring, including COVID-19 restrictions, a short funding
    period and adverse weather events that prevented access to Torrington SCA during
    austral summer 2020–2021. At each site, at least 100 individuals of the target
    species were tagged for monitoring. Most populations occurred within very small
    patches of suitable habitat and often with high densities. For small populations
    (100–200 individuals), all or most of the individuals were tagged. For larger
    populations, individuals were tagged haphazardly (taking into account safety and
    minimizing plant damage) until the target number was reached. Each individual
    was given a unique ID. On each monitoring visit (except for 5 populations that
    only have data for one monitoring visit; see Appendix S3) we measured the height
    (cm) of each tagged plant and gave it a health score. Health was scored from 0
    to 5, where 0 is dead and 5 is a thriving individual and scores of 2–4 were based
    on proportion of leaves lost from the plant due to herbivory or dieback. During
    monitoring, any insects observed interacting with the target species were photographed
    and the nature of the interaction or behaviour (e.g., pollination, herbivory,
    nesting or sheltering) was documented.'
  original_file: contributor submitted file (Poll observations for AusTraits.xlsx) supplemented by transcribed data from Appendix S1 (raw/aec13514-sup-0001-appendixs1.docx) and Appendix
    S4 (raw/aec13514-sup-0004-appendixs4.docx) of the primary source (by Claude AI (Anthropic))
  notes: Appendix S4 records of plant animal visitors that do not contact the flowers (resting, walking, leaf
    feeding, spiders, thrips on unopened buds) are excluded. Additional traits, habitat.
