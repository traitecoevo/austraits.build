dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(tube = case_when(
        tube == "present" ~ 1,
        tube == "present (at least at base)" ~ 0.5,
        tube == "absent, present (at least at base)" ~ 0.1,
        tube == "absent" ~ 0
      ))
  '
  collection_date: birthtime
  taxon_name: species
  location_name: site
  individual_id: individual
  description: A study to explore the relationship between floral longevity and floral symmetry.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: (a) Floral longevity and symmetry data ^p Fieldwork to collect floral longevity data was conducted during peak flowering from July to November at three sites around Sydney, Australia (see electronic supplementary material, Notes S1 for details). Floral longevity data were collected following a protocol adapted from Wright et al.'s [18] methods for leaf lifespan, which allowed us to minimize survey effort and maximize the number of individual flowers and species surveyed. Briefly, at each site, we chose five individual plants ≥5 m apart of an equal number of actinomorphic and zygomorphic species in flower. On each plant, we tagged the base of an inflorescence and recorded the number of buds, anthetic flowers and senesced flowers in the inflorescence. Repeat surveys every 1-3 days (with visits every 2 days ideal, see electronic supplementary material, Notes S1) recorded the number of buds, anthetic flowers and senesced flowers in each inflorescence along with the exact time of survey until all flowers in the inflorescence had senesced. Any flowers damaged by florivory were excluded, and new inflorescences or plants were marked. Mean floral longevity was calculated for each inflorescence as the average time difference between the onset of flower anthesis and flower senescence for all flowers in that inflorescence. Our final field dataset included mean floral longevities for 17 actinomorphic and 17 zygomorphic species, with an average of 11.3 (s.e. = 0.7) flowers monitored per plant, and an average of 5.1 (s.e. = 0.1) plants per species (electronic supplementary material, NotesS1).
  original_file: in raw data folder
  notes: none
