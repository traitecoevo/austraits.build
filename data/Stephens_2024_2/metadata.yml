traits:
- var_in: no_flowers
  unit_in: '{count}'
  trait_name: .na
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Number of flowers monitored in inflorescence
- var_in: longevity_days
  unit_in: d
  trait_name: flower_lifespan
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: On each plant, we tagged the base of an inflorescence and recorded the number of buds, anthetic flowers and senesced flowers in the inflorescence. Repeat surveys every 1--3 days (with visits every 2 days ideal, see electronic supplementary material, Notes S1) recorded the number of buds, anthetic flowers and senesced flowers in each inflorescence along with the exact time of survey until all flowers in the inflorescence had senesced. Any flowers damaged by florivory were excluded, and new inflorescences or plants were marked. Mean floral longevity was calculated for each inflorescence as the average time difference between the onset of flower anthesis and flower senescence for all flowers in that inflorescence.
- var_in: symmetry
  unit_in: .na
  trait_name: flower_perianth_symmetry
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Floral symmetry. Our definition of floral symmetry followed the functional approach of Yoder et al. [11], primarily considering the symmetry of the perianth but also considering the symmetry of the androecium and gynoecium in marginal cases. Species with pseudanthia that combine actinomorphic and zygomorphic florets (e.g. Asteraceae, some Apiaceae) were scored according to the symmetry of the pseudanthium overall, given this is the unit of attraction that pollinators respond to.
- var_in: infloheight_m
  unit_in: m
  trait_name: plant_height_reproductive
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Height of the inflorescence above ground in metres
- var_in: habit
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Plant habit, scored in the field
- var_in: height_m
  unit_in: m
  trait_name: plant_height
  entity_type: individual
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: Height of the plant in metres, from the ground to the highest point. Measured once on first field visit.
- var_in: inflosize_cm
  unit_in: cm
  trait_name: inflorescence_length
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Inflorescence size (cm) [length of longest axis, regardless of inflorescence type and presentation; bracts included]. Measured once on first field visit.
- var_in: flowersperplant
  unit_in: '{count}'
  trait_name: .na
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Number of anthetic flowers per plant (count if 1-20, estimates of ten thereafter). Measured once on first field visit.
- var_in: budsperplant
  unit_in: '{count}'
  trait_name: .na
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Number of buds per plant (count if 1-20, estimates of ten thereafter). Measured once on first field visit.
- var_in: florallength_cm
  unit_in: cm
  trait_name: flower_length
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Floral length (cm) [at anthesis; excluding pedicel; from base of gynoecium to tip of flower, all organs included]. Measured once on first field visit.
- var_in: floraldiam_cm
  unit_in: cm
  trait_name: flower_diameter
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Floral diameter (cm) [at anthesis; i.e., maximum width; all organs included]. Measured once on first field visit.
- var_in: colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Floral dominant display colour [at anthesis; bracts excluded, all other organs included]. Measured once on first firld visit.
- var_in: tube
  unit_in: '{dimensionless}'
  trait_name: flower_perianth_fusion
  entity_type: individual
  value_type: mean
  basis_of_value: expert_score
  replicates: .na
  methods: Floral tube [formed by fusion or close positioning of perianth parts; anthers and stigmas may be included or exserted]. Measured once on first field visit.
