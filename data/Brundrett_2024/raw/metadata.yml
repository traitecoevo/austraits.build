dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(
        across(c(Pollinators_Bee_Records, Pollinators_Bird, `Pollinators_Bird&Insect`, buzz_pollination_by_bees_BPB, Pollinators_Butterfly, `GDM_&_Bird` , pollinators_insects_generic_GIP, Insect_group, Insects, `non_flying_mammals&birds`, relatively_specialised_insect_pollination_RSIP, selfing_SP, specialised_insect_pollination_SIP, Pollination_Water, Pollination_Wind), 
        ~case_when(
    .x == 1 ~ cur_column(),
    .x == 0 ~ NA_character_,
    TRUE ~ as.character(.x)   # preserves anything unexpected instead of silently dropping it
  ))
      )
  '
  collection_date: 2019/2024
  taxon_name: SPECIES_NAME
  location_name: .na
  description: Using trait data on pollination, fire ecology, and dispersal to understand pollination and fire response strategies for ~8800 plants in the Southwest Australian Floristic Region.
  basis_of_record: literature
  life_stage: adult
  sampling_strategy: unknown
  original_file: in raw data folder
  notes: Starting with the raw data download (an Excel file, with worksheets for each family or other taxon group) and merged these into a single file with consistent column headers.
