questions:
  question1: Please consider this a preliminary addition of this large dataset! There is data here which requires new trait concepts in AusTraits and I haven't finished writing all of those - you'll note a few traits with half-written definitions and ones where the only dataset is yours, particularly of certain floral dimensions. We are also thinking of creating a second flower_colour trait that allows more terms. 
  question2: I believe I have correctly worked out most of the acronyms in your data file, but am unsure what MFT stands for - I was thinking minimum fire interval, but the values don't make sense for that.
  question3: Are any of these trait values inferred from the genus (versus known at the species-level)?
  question4: In aligning the taxonomy, I updated phrase name syntax to match the APC (no spaces between initials) for names within the APC. Other names that were clearly phrase names, but which did not match to the APC/APNI I left as is - presuming they are linked to a voucher but not (yet) recognised.
