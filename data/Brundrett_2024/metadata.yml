dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      generate_observation_numbers(SPECIES_NAME) |>
    dplyr::mutate(
      post_fire_flowering = trimws(paste(
        dplyr::coalesce(fire_cued_buds, ""),
        dplyr::coalesce(post_fire_flowering, "")
      )) %>% dplyr::na_if(""),
      Breeding = trimws(paste(
        dplyr::coalesce(Breeding, ""),
        dplyr::case_when(Dioecy == "selfing" ~ "autogamy", TRUE ~ "")
      )) %>% dplyr::na_if(""),
      Dioecy = dplyr::na_if(Dioecy, "selfing"),
      dispersal_appendage = trimws(paste(
        dplyr::coalesce(dispersal_appendage, ""),
        dplyr::coalesce(
          dplyr::case_when(
            Fruit_morphology == "winged, orange" ~ "wings",
            Fruit_morphology %in% c("large wings", "no wing", "thin wing", "winged", "winged or not") ~ Fruit_morphology,
            TRUE ~ NA_character_
          ),
          ""
        )
      )) %>% dplyr::na_if(""),
      Fruit_morphology = dplyr::case_when(
        Fruit_morphology == "winged, orange" ~ "orange",
        Fruit_morphology %in% c("large wings", "no wing", "thin wing", "winged", "winged or not") ~ NA_character_,
        TRUE ~ Fruit_morphology
      )
    )
  '
  collection_date: '2024'
  taxon_name: SPECIES_NAME
  location_name: .na
  description: unknown
  basis_of_record: unknown
  life_stage: unknown
  sampling_strategy: unknown
  original_file: in raw data folder, significantly modified from version online linked
    to 2024 paper
  notes: As the original compilation is build from many sources, there is likely to
    be some duplication in values reported here. We're accepting this, as the dataset
    also has many new values and the values are all being mapped in as species-level
    information. context_property pollen presenter type entity_context pollen_presentation_type
    context_property flower sex entity_context plant_sex
