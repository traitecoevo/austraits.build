  collection_date: 2020-09/2020-12
  taxon_name: taxon_name
  location_name: location_name
  individual_id: individual_id
  description: To investigate the intraspecific diversity of wild Australian Sorghum
    species growing along aridity clines, testing whether phenotypic and genotypic
    diversity co-vary with niche diversity and which phenotypic traits might confer
    adaptation to aridity.
  basis_of_record: captive_cultivated
  life_stage: sapling
  sampling_strategy: Six S. plumosum accessions, five S. stipoideum accessions and
    seven S. timorense accessions were germinated and grown for 10 weeks. Accessions
    were chosen on the basis of their collection sites occurring along aridity clines
    in northern Australia (Table 1). Within species, accessions were ordered numerically
    (P1–P6, S1–S5 and T1–T7) on the basis of increasing aridity of their collection
    sites (Fig. 1). The S. plumosum accessions ranged in aridity index from 0.109
    to 0.920, the S. stipoideum accessions from 0.358 to 0.589, and the S. timorense
    accessions from 0.128 to 0.296. ^p Seeds were provided by the Australian Grains
    Genebank (Horsham, Vic., Australia) and were collected by the Australian Tropical
    Crops Genetic Resource Centre. All plants (n = 251) were grown under controlled
    greenhouse conditions at Monash University (−37.91, 145.14) between September
    and December 2020, with a mean temperature of 31.35 ± 0.09°C/21.46 ± 0.03°C, day/night,
    and a mean photoperiod of 13.7 h. Supplementary light was provided using sodium
    lamps for 13 h per day (MK-1 Just-a-shade, Ablite, NSW, Australia). ^p Seeds were
    germinated in a constant-temperature cabinet, following Cowan et al. (2020). Once
    the coleoptile and radicle had emerged, plants were transferred to the greenhouse
    and planted in seedling trays containing Debco seed-raising substrate (Evergreen
    Garden Care, NSW, Australia) and perlite (1:1, v/v ratio) for 1.5 weeks. Seedlings
    were then transplanted into 1.9 L pots containing Debco seed-raising substrate,
    perlite and coarse sand (2:2:1, v/v ratio). Plants were grown for a further 8
    weeks and watered three times per week, namely twice with 250 mL water, once with
    250 mL Thrive all-purpose soluble fertiliser (Yates, Vic., Australia) with an
    N:P:K ratio of 25:5:8.8 (v/v ratio). Pot positions were randomised and rotated
    weekly to minimise microenvironment effects. At 10 weeks post-germination, plants
    were harvested and separated into roots, sheaths and leaves and dried in ovens
    at 50°C for 72 h.
  original_file: raw/Raw data Myrans_2024.xlsx (per-plant data supplied by the contributor);
    data.csv is written from it by raw/extra_R_code_Myrans_2024.R
  notes: LLocations are the 18 seed-collection (provenance) sites from Table 1; all
    plants were grown and measured in a greenhouse at Monash University (−37.91, 145.14).
