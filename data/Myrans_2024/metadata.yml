traits:
- var_in: SLA_cm2_per_g
  unit_in: cm2/g
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'Plant morphology was quantified by counting tillers, measuring total leaf
    area, and determining the biomass of leaves, sheaths and roots of each plant.
    Total leaf area was measured using a LI-3000 portable area meter and a LI-3050A
    belt conveyor (LI-COR Biosciences, NE, USA). Senesced leaves were included in
    total biomass measurements, but not in leaf-area measurements or chemical analysis.
    Specific leaf area (SLA; cm2 g−1) and root:shoot ratio were calculated using the
    following equations: SLA = total leaf area / biomass of green leaves.'
  leaf_type: leaf blade
- var_in: root_shoot_ratio
  unit_in: mg{root}/mg{shoot}
  trait_name: root_shoot_ratio
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'Plant morphology was quantified by counting tillers, measuring total leaf
    area, and determining the biomass of leaves, sheaths and roots of each plant.
    Total leaf area was measured using a LI-3000 portable area meter and a LI-3050A
    belt conveyor (LI-COR Biosciences, NE, USA). Senesced leaves were included in
    total biomass measurements, but not in leaf-area measurements or chemical analysis.
    Specific leaf area (SLA; cm2 g−1) and root:shoot ratio were calculated using the
    following equations: Root:shoot ratio = root biomass / (leaf biomass + sheath
    biomass).'
  leaf_type: .na.character
- var_in: Fv_Fm
  unit_in: '{dimensionless}'
  trait_name: leaf_fluorescence_fv_over_fm
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: So as to confirm that stress was not a factor in any phenotypic differences,
    Fv/Fm, a useful indicator of plant stress, was measured on the youngest fully
    unfurled leaf using a MINI-PAM Photosynthesis Yield Analyser (Heinz Walz GmbH,
    Effeltrich, Germany) 7 weeks post-germination (n = 6).
  leaf_type: leaf blade
- var_in: leaf_phenolics_mg_per_g
  unit_in: mg/g
  trait_name: leaf_phenol_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Phenolic concentration was also measured through colorimetric assay in
    96-well microtiter plates, by using a Folin–Ciocalteu method adapted from Ainsworth
    and Gillespie (2007) and Bärlocher and Graça (2020). Phenolics were extracted
    from 10 mg of dried, ground tissue into 1 mL of 70% acetone solution. 20 µL of
    sample was then mixed with 20 µL distilled water, 20 µL dilute Folin–Ciocalteu
    reagent and 200 µL of 2% sodium carbonate in 0.1 M sodium hydroxide solution,
    before being incubated at room temperature for 2 h. Absorbance was then measured
    at 760 nm (FLUOstar Galaxy, BMG Labtechnologies, Vic., Australia). Gallic acid
    (91215, Sigma-Aldrich, MO, USA) was used as the standard.
  leaf_type: leaf blade
- var_in: sheath_phenolics_mg_per_g
  unit_in: mg/g
  trait_name: leaf_phenol_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Phenolic concentration was also measured through colorimetric assay in
    96-well microtiter plates, by using a Folin–Ciocalteu method adapted from Ainsworth
    and Gillespie (2007) and Bärlocher and Graça (2020). Phenolics were extracted
    from 10 mg of dried, ground tissue into 1 mL of 70% acetone solution. 20 µL of
    sample was then mixed with 20 µL distilled water, 20 µL dilute Folin–Ciocalteu
    reagent and 200 µL of 2% sodium carbonate in 0.1 M sodium hydroxide solution,
    before being incubated at room temperature for 2 h. Absorbance was then measured
    at 760 nm (FLUOstar Galaxy, BMG Labtechnologies, Vic., Australia). Gallic acid
    (91215, Sigma-Aldrich, MO, USA) was used as the standard.
  leaf_type: leaf sheath
- var_in: root_phenolics_mg_per_g
  unit_in: mg/g
  trait_name: root_phenol_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Phenolic concentration was also measured through colorimetric assay in
    96-well microtiter plates, by using a Folin–Ciocalteu method adapted from Ainsworth
    and Gillespie (2007) and Bärlocher and Graça (2020). Phenolics were extracted
    from 10 mg of dried, ground tissue into 1 mL of 70% acetone solution. 20 µL of
    sample was then mixed with 20 µL distilled water, 20 µL dilute Folin–Ciocalteu
    reagent and 200 µL of 2% sodium carbonate in 0.1 M sodium hydroxide solution,
    before being incubated at room temperature for 2 h. Absorbance was then measured
    at 760 nm (FLUOstar Galaxy, BMG Labtechnologies, Vic., Australia). Gallic acid
    (91215, Sigma-Aldrich, MO, USA) was used as the standard.
  leaf_type: .na.character
- var_in: leaf_Si_percent
  unit_in: '%'
  trait_name: leaf_Si_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Silicon concentration ([Si]) was measured in leaf, sheath and root tissue
    by using 80 mg dried, ground tissue through X-ray fluorescence spectrometry (Epsilon-3x,
    PANalytical, Netherlands), following Reidinger et al. (2012) and Hiltpold et al.
    (2016), at the Hawkesbury Institute for the Environment, Western Sydney University
    (NSW, Australia). Silicon was calibrated against a certified plant reference material
    of known silicon concentration (NCS ZC73018 Citrus leaves, China National Institute
    for Iron and Steel).
  leaf_type: leaf blade
- var_in: sheath_Si_percent
  unit_in: '%'
  trait_name: leaf_Si_per_dry_mass
  entity_type: individual
  value_type: raw
