traits:
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Observations of flower-visitors to all plants in flower within transects
    at each site took 10-30 minutes, with the duration mostly dependent on the number
    of plants in flower present in a transect. A flower-visitor (also referred to
    as visitor) was defined as any animal that physically landed on and interacted
    with the reproductive organs of a flower, namely the stamen and style (Ollerton
    et al., 2011). After a visitor was spotted, identification was made on the wing,
    i.e. not killed or removed from the site. Each visitor was identified as taxonomically
    close to family as possible, and lower for conspicuous genera and species. Morphological
    and functional traits were also recorded to help identify the species later. Each
    visitor was recorded in association with the individual plant/s it visited.
