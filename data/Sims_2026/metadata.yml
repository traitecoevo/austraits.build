dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(
        Date = util_parse_collection_date(Date),
        across(c(`Start time`, `End time`), as.character)
      )
  '
  collection_date: Date
  taxon_name: Flowering plant species
  location_name: Site
  individual_id: observation
  description: Work which investigated plant-visitor interaction networks in alpine
    microclimates at Kosciuszko National Park, NSW.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'Brief site description ^p This study was conducted in Kosciuszko
    National Park, NSW, the lands of the Ngarigo and Walgalu people, and a part of
    the Australian Alpine Bioregion. The study locations were Mt Stilwell and Schlink
    Pass (Figure 2). ^p At each location, there were eight sites, paired by aspect,
    with four North-West facing sites and four South-East facing sites: 16 sites in
    total (Table 1). The sites were also at least 100 metres apart, but at similar
    elevations within a given location to ensure that any environmental differences
    between the sites in each pair were not due to elevational influence on temperature
    (Scherrer & Körner, 2011). Five Schlink Pass sites did not align strictly with
    NW and SE due to the curvature of the landscape following the creek (Figure 3).
    In these cases, we grouped sites with NW or SE based on the temperature influence
    of morning vs afternoon sunlight. Sites tending towards West or South-West were
    grouped with NW, with more Easterly sites grouped with South-East. ^p Data collection
    ^p The main sampling trip was conducted in January 2025. The main trip consisted
    of 12 days of sampling, six days at each location, giving six replicate sampling
    days for each of the 16 sites (96 sampling surveys in total; Figure 3). All the
    sampling was completed as close together in time as possible within a 3-week period,
    with the 12 sampling days interspersed with three days off. To avoid any influences
    of sampling time-of-day that might bias site variation in the data, the order
    that sites were visited was altered each time that a location was sampled, ensuring
    that each site was visited at a different time of day each time. The sampling
    itself was weather dependent, and only took place when it was not raining, as
    insect visitors have reduced activity during rainy weather (Lawson & Rands, 2019).
    ^p Using a measuring tape reel, a 15 m transect was marked out at each site. Sampling
    took place within one metre on either side of the transect line, creating a 15
    m x 2 m sampling plot. If the width of a plant extended beyond the 2 m buffer,
    its whole area was included in the sampling, as long as there were floral structures
    within the sampling plot. All flowering plants within the plot were identified,
    but for this dataset, I have only kept the ones that had a flower-visitor.'
  original_file: in raw data folder
  notes: Notonemouridae (stoneflies, Plecoptera) have no specific pollination_vector_possible
    term and are mapped to `insect`.
