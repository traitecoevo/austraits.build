dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        !pollination_treatment %in% c(
          "manipulative outcross",
          "manipulative selfing",
          "autonomous selfing",
          "all treatments"
        )
      ) |>
      dplyr::mutate(
        trait_value = dplyr::if_else(
          trait %in% c("flower_visitor", "pollination_vector_possible"),
          trait_value_clean,
          trait_value
        )
      )
    '
  collection_date: 2020-03/2021-05
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: To identify the factors limiting viable-seed production in two rainforest
    Rutaceae, Acronychia oblongifolia and Sarcomelicope simplicifolia subsp. simplicifolia,
    by examining their floral biology, floral visitors and pollination vectors, and
    confirming their breeding systems with hand-pollination experiments.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: This study was conducted between March 2020 and May 2021 on plant
    populations located in remnant rainforest, restored rainforest and botanic gardens
    mainly in the Illawarra area south-eastern New South Wales (NSW), Australia. Acronychia
    oblongifolia trees were located at two sites, one restored population at Jerrara
    Dam Reserve (34°40′19″S, 150°48′22″E) (hereafter Jerrara) and one planted population
    at the Australian Botanic Garden, Mount Annan (34°04′14″S, 150°46′04″E) (hereafter
    Mount Annan). The original provenance of the trees at Mount Annan was Boatharbour
    Nature Reserve, New South Wales. Sarcomelicope simplicifolia subsp. simplicifolia
    trees were studied at four sites, three restored populations at Jerrara, Spring
    Creek Wetland Kiama (34°39′41″S, 150°50′48″E) (hereafter Kiama) and Spring Creek
    Wetland South Kiama (34°39′48″S, 150°50′40″E) (hereafter South Kiama); and one
    planted population at Wollongong Botanic Garden (34°24′34″S, 150°52′30″E) (hereafter
    Wollongong). The trees planted at Wollongong were sourced from natural populations
    in the Illawarra region (Carl Glaister pers. comm.). ^p The methods for studying
    the floral biology, floral visitors and pollination vectors, and the breeding systems
    followed those described in Lopresti et al. (Under Review). ^p Any fauna species
    that contacted a flower were regarded as floral visitors. A combination of diurnal
    and nocturnal human observations, video recordings, time lapse photography (TLP),
    and nocturnal infrared motion sensor imaging were used to observe floral visitors.
    Sampling was conducted on 2-6 trees at 2-4 sites for each species (Table S1 details
    the survey effort). Observations were done on sunny days with no or light wind
    speeds (gusts did not exceed 20 km h-1), and temperatures ranged between 17°C and
    32°C. ^p A series of pollination experiments were conducted for both species to
    determine their breeding systems. Inflorescences containing at least five buds
    were haphazardly selected and subjected to one of five randomly applied treatments,
    (1) manipulative outcross, (2) autonomous selfing, (3) manipulative selfing, (4)
    open control (no bag), or (5) procedural control (partial bag).
  original_file: Data are transcribed from the paper (text, Table 2) and its Supplementary
    Material (Tables S1 and S2).
  notes: Values pooled across sites, or from sites the paper does not name, are assigned
    to a generic location representing Jerrara and Mount Annan (for Acronychia oblongifolia)
    or a generic location representing Illawarra (for Sarcomelicope simplicifolia subsp. simplicifolia);
    the sites_included column of data.csv lists the sites behind each value, or not stated where the paper does not name them.
    Additional traits, flower_time_from_opening_to_anther_dehiscence, flower_time_from_opening_to_pollen_removal,
    flower_time_from_opening_to_stigma_receptivity,
    flowering_duration, flower_pollen_width, pollen_aggregation_type, pollen_outline_equatorial_view,
    pollen_shape, pollen_outline_polar_view, pollen_polarity, pollen_exine_ornamentation,
    pollen_tackiness, seed_partially_filled_fraction,
    seed_empty_fraction, seed_predation_fraction and seed_predator.
    Fruit initiation and seed data from the manipulative outcross, manipulative selfing
    and autonomous selfing treatments, and values pooled across treatments, are kept
    in data.csv but filtered out; they were used only to score breeding_system.
