contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: entity_context
- context_property: sampling method
  category: method_context
  var_in: detection_method
  values:
  - find: direct
    value: direct observation
    description: floral visitor observed, and in some cases captured, by observers
      watching 50 x 50 cm sections of canopy
  - find: dvr
    value: digital video recording
    description: floral visitor recorded by an action camera filming a 15 x 30 cm
      area of canopy
  - find: both
    value: direct observation and digital video recording
    description: floral visitor detected both by observers and on video recordings
  - value: wind experiment
    description: fan-generated wind (5 and 40 km h-1 for 10 s) blown onto flowers with
      visible pollen, with Vaseline-coated pollen traps 5, 10 or 50 cm behind the flower
- context_property: floral visitor individuals captured (count)
  category: entity_context
  var_in: number_captured
- context_property: floral visitor individuals recorded on video (count)
  category: entity_context
  var_in: number_detected_by_dvr
- context_property: survey sites where floral visitor recorded (count)
  category: entity_context
  var_in: number_of_sites_observed
- context_property: entity measured
  category: method_context
  var_in: flower_part
  values:
  - find: whole flower (anthesis)
    value: flower
    description: duration of anthesis, from floral opening to abscission or fertilisation
  - find: stigma (receptive period)
    value: stigma
    description: duration the stigma remained receptive
- context_property: plant sex
  category: entity_context
  var_in: plant_sex
  values:
  - value: female
    description: female plant
  - value: male
    description: male plant
- context_property: pollination treatment
  category: treatment_context
  var_in: pollination_treatment
  values:
  - value: open control
    description: inflorescences left unbagged and open to natural pollinators
  - value: procedural control
    description: inflorescences in bags with three openings cut into them, so pollinators
      could visit the flowers
  - value: no treatment
    description: fruit collected from inflorescences not assigned to a treatment
traits:
- var_in: flower_dichogamy
  unit_in: .na
  trait_name: flower_dichogamy
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To examine the floral phenology of each species, 20-40 flowers from 2-4
    trees were observed daily from floral opening to abscission or fertilisation (following
    Kearns & Inouye 1993). On each day of observation, the anthers and stigmas of
    each flower were classed as immature, mature or senesced. The anthers were considered
    mature when pollen grains were visible when viewed through a hand lens. Stigma
    maturity was based on the size and colour of the stigma. Stigma receptivity was
    confirmed by a hydrogen peroxide test (following Kearns & Inouye 1993). [...] The
    first day that the androecium (male) and gynoecium (female) appeared mature, the
    duration of maturity, and the total anthesis period were recorded for each species.
- var_in: flower_lifespan
  unit_in: d
  trait_name: flower_lifespan
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 20-40
  methods: To examine the floral phenology of each species, 20-40 flowers from 2-4
    trees were observed daily from floral opening to abscission or fertilisation (following
    Kearns & Inouye 1993). On each day of observation, the anthers and stigmas of
    each flower were classed as immature, mature or senesced. The anthers were considered
    mature when pollen grains were visible when viewed through a hand lens. Stigma
    maturity was based on the size and colour of the stigma. Stigma receptivity was
    confirmed by a hydrogen peroxide test (following Kearns & Inouye 1993). For each
    species, 10 flowers each from individual plants thought to contain mature stigmas
    were placed in a petri dish and individually examined under a 40 x dissecting
    microscope. Hydrogen peroxide (3% v/v) was dropped onto each stigma and observed
    for 60 seconds. The formation of bubbles on the stigma was considered an indication
    of receptivity. The first day that the androecium (male) and gynoecium (female)
    appeared mature, the duration of maturity, and the total anthesis period were
    recorded for each species. ^p Values are the duration of anthesis for the whole
    flower and the duration of stigma receptivity, distinguished by the entity measured
    context.
- var_in: flower_pollen_apertures_count
  unit_in: '{count}'
  trait_name: flower_pollen_apertures_count
  entity_type: metapopulation
  value_type: mode
  basis_of_value: measurement
  replicates: 3
  methods: Pollen morphology and exine characteristics were described as outlined
    by Halbritter et al. (2018) to gain insight into potential pollination vectors,
    and an indication of breeding system. Pollen characteristics described included,
    the shape (both equatorial (E) and polar (P) views); the length of the polar axis
    compared to the equatorial diameter (the P/E ratio); the dispersal unit of pollen
    grains; and the ornamentation on the aperture and exine regions. Stamens from
    three flowers of each target species were examined under a scanning electron microscope
    (JEOL JSM-6490LA, Japan) on the day of collection (Acronychia oblongifolia) or
    following a brief period of refrigerated storage (Sarcomelicope simplicifolia
    subsp. simplicifolia).
- var_in: flower_pollen_aperture_shape
  unit_in: .na
  trait_name: flower_pollen_aperture_shape
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Pollen morphology and exine characteristics were described as outlined
    by Halbritter et al. (2018) to gain insight into potential pollination vectors,
    and an indication of breeding system. Pollen characteristics described included,
    the shape (both equatorial (E) and polar (P) views); the length of the polar axis
    compared to the equatorial diameter (the P/E ratio); the dispersal unit of pollen
    grains; and the ornamentation on the aperture and exine regions. Stamens from
    three flowers of each target species were examined under a scanning electron microscope
    (JEOL JSM-6490LA, Japan) on the day of collection (Acronychia oblongifolia) or
    following a brief period of refrigerated storage (Sarcomelicope simplicifolia
    subsp. simplicifolia). ^p Both colporate and colpate apertures occur on the pollen
    grains of each species.
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Nectar production was measured to determine whether flowers provided rewards
    to potential pollinators. Prior to quantifying nectar production, inflorescences
    that housed at least five buds near to opening were selected haphazardly and bagged
    using a hard plastic inner layer of coarse mesh (Saxon Gutter Guard) covered with
    polyorganza fabric (15 cm x 35 cm) to prevent biotic visitors extracting nectar
    prior to the flowers opening. For Acronychia oblongifolia, nectar was extracted
    from 10 flowers with a mature androecium and 10 flowers with a mature gynoecium
    at Mount Annan. For Sarcomelicope simplicifolia subsp. simplicifolia, nectar was
    extracted from five flowers with a mature androecium from staminate trees, and
    five flowers with a mature gynoecium from pistillate trees, at each of Wollongong,
    Jerrara, Kiama and South Kiama. Nectar was extracted into a 1 µl or 5 µl microcapillary
    tube and the volume withdrawn was determined by calculating the proportion of
    the column that was filled (in accordance with Morrant et al. 2009).
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Nectar production was measured to determine whether flowers provided rewards
    to potential pollinators. Prior to quantifying nectar production, inflorescences
    that housed at least five buds near to opening were selected haphazardly and bagged
    using a hard plastic inner layer of coarse mesh (Saxon Gutter Guard) covered with
    polyorganza fabric (15 cm x 35 cm) to prevent biotic visitors extracting nectar
    prior to the flowers opening. For Acronychia oblongifolia, nectar was extracted
    from 10 flowers with a mature androecium and 10 flowers with a mature gynoecium
    at Mount Annan. For Sarcomelicope simplicifolia subsp. simplicifolia, nectar was
    extracted from five flowers with a mature androecium from staminate trees, and
    five flowers with a mature gynoecium from pistillate trees, at each of Wollongong,
    Jerrara, Kiama and South Kiama. ^p Records the floral reward shown to be offered
    to visitors.
- var_in: flower_nectar_volume
  unit_in: uL
  trait_name: flower_nectar_volume
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Nectar production was measured to determine whether flowers provided rewards
    to potential pollinators. Prior to quantifying nectar production, inflorescences
    that housed at least five buds near to opening were selected haphazardly and bagged
    using a hard plastic inner layer of coarse mesh (Saxon Gutter Guard) covered with
    polyorganza fabric (15 cm x 35 cm) to prevent biotic visitors extracting nectar
    prior to the flowers opening. For Acronychia oblongifolia, nectar was extracted
    from 10 flowers with a mature androecium and 10 flowers with a mature gynoecium
    at Mount Annan. For Sarcomelicope simplicifolia subsp. simplicifolia, nectar was
    extracted from five flowers with a mature androecium from staminate trees, and
    five flowers with a mature gynoecium from pistillate trees, at each of Wollongong,
    Jerrara, Kiama and South Kiama. Nectar was extracted into a 1 µl or 5 µl microcapillary
    tube and the volume withdrawn was determined by calculating the proportion of
    the column that was filled (in accordance with Morrant et al. 2009). [...] Due
    to the small sample size, data were pooled across sites. ^p Values are the maximum
    volume across male- and female-phase flowers (Acronychia oblongifolia), and the
    mean volume of pistillate flowers and an upper bound on the mean volume of staminate
    flowers (Sarcomelicope simplicifolia subsp. simplicifolia).
- var_in: fruit_initiation_proportion
  unit_in: '%'
  trait_name: fruit_initiation_proportion
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Treatments were applied and replicated five (Acronychia oblongifolia) or
    ten (Sarcomelicope simplicifolia subsp. simplicifolia) times per tree. The reproductive
    success for all inflorescences was monitored, from pollination through to the
    maturation of fruit. Early fruit development was based on the ovary swelling,
    after the petals and stamens had senesced. Fruit maturity was based on the size
    and the colour of the fruits. Mature fruits were harvested and examined for viable
    seed. Reproductive success was classed as the percentage of flowers that developed
    fruit (early fruit development), and the quantity of viable seeds produced per
    treatment. [...] To determine the reproductive success for each species, the percentages
    of flowers that produced fruits were compared among treatments using a one-way
    ANOVA. For both plant species, data were pooled from all sites and trees, and arcsine
    transformed if needed. ^p Values are the percentage of flowers with early fruit
    development in open control inflorescences, pooled across sites or for one site
    or tree.
- var_in: seed_viability
  unit_in: '%'
  trait_name: seed_viability
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Fruits and seeds were dissected and examined under a stereo microscope
    (40x magnification) to determine the number of seeds per fruit and the proportion
    of filled seeds for all treatments. A 'filled' seed housed an embryo and endosperm
    filling the entire space and an 'empty' seed lacked both embryo and endosperm.
    A 'partially filled' seed contained an embryo, but the endosperm did not fill the
    entire space enclosed by the seed coat; these seeds are potentially viable. ^p
    Values are the filled seeds as a percentage of seeds dissected, for open control,
    procedural control and untreated inflorescences, by site, as the authors treat
    filled seeds as viable.
- var_in: pollination_syndrome
  unit_in: .na
  trait_name: pollination_syndrome
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The floral biology of these species was quantified to provide baseline
    data and insights into their pollination syndrome. ^p Pollination syndrome assigned
    by the authors from floral phenology, pollen morphology, nectar production and
    flower colour and size.
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Nectar, the primary floral reward for many pollinators (Kearns & Inouye
    1993), was produced by both species, providing further evidence for biotic pollination
    (Dafni 1992), while the small, white flowers indicated that these two plants are
    most likely pollinated by a range of insect species (Faegri and van der Pijl 1979).
    ^p Flower colour as described by the authors for the studied plants.
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Acronychia oblongifolia trees were located at two sites [...] Sarcomelicope
    simplicifolia subsp. simplicifolia trees were studied at four sites. ^p Growth
    form of the studied plants, which the paper refers to as trees throughout.
- var_in: flower_structural_sex_type
  unit_in: .na
  trait_name: flower_structural_sex_type
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: On each day of observation, the anthers and stigmas of each flower were
    classed as immature, mature or senesced. ^p Acronychia oblongifolia flowers house
    both an androecium and a gynoecium; Sarcomelicope simplicifolia subsp. simplicifolia
    has staminate and pistillate flowers (Figure 1).
- var_in: sex_type
  unit_in: .na
  trait_name: sex_type
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: On each day of observation, the anthers and stigmas of each flower were
    classed as immature, mature or senesced. ^p Plant sex type from the floral phenology
    observations, which confirmed that Sarcomelicope simplicifolia subsp. simplicifolia
    is dioecious; Acronychia oblongifolia produces hermaphroditic flowers (PlantNET
    2020).
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'A series of pollination experiments were conducted for both species to
    determine their breeding systems. Inflorescences containing at least five buds
    were haphazardly selected and subjected to one of five randomly applied treatments,
    (1) manipulative outcross, (2) autonomous selfing, (3) manipulative selfing, (4)
    open control (no bag), or (5) procedural control (partial bag). [...] Manipulative
    outcrossing involved bagging an inflorescence in the bud phase, and then hand pollinating
    each flower as the stigma became receptive, with pollen sourced from a donor tree
    located at least 10 m away but within the same population. Manipulative selfing
    was treated the same way, but with pollen sourced from the same tree. [...] Autonomous
    selfing involved bagging an inflorescence in the bud phase without manipulating
    the flowers. Control inflorescences were open to natural pollinators and not manipulated.
    [...] Treatments were applied and replicated five (Acronychia oblongifolia) or
    ten (Sarcomelicope simplicifolia subsp. simplicifolia) times per tree. [...] Reproductive
    success was classed as the percentage of flowers that developed fruit (early fruit
    development), and the quantity of viable seeds produced per treatment. ^p Fruit
    was produced from all treatments except manipulative selfing (Acronychia oblongifolia);
    no fruit was produced when pollinators were excluded from flowers (Sarcomelicope
    simplicifolia subsp. simplicifolia). Autonomous and manipulative selfing treatments
    produced few (Acronychia oblongifolia: <3%) or no (Sarcomelicope simplicifolia
    subsp. simplicifolia) viable seed, indicating these are predominantly outcrossing
    species [...] with no fruit set on any tree when pollinators were excluded from
    the flowers. ^p Breeding system as concluded by the authors from fruit and viable-seed
    production across treatments.'
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Any fauna species that contacted a flower were regarded as floral visitors.
    A combination of diurnal and nocturnal human observations, video recordings, time
    lapse photography (TLP), and nocturnal infrared motion sensor imaging were used
    to observe floral visitors. [...] Human observations were done on six fixed sections
    (50 cm x 50 cm) of canopy on each tree. Floral visitors were opportunistically
    captured following their foraging bout and euthanized. Captured specimens were
    identified and their pollen load was analyzed under a stereo microscope (40 x
    magnification). ^p Each record is one floral visitor taxon in Table S2 that the
    authors did not classify as a potential pollinator.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Floral visitors that either carried pollen of the target species on their
    body or contacted the stigma while foraging were classed as potential pollinators
    (following Kearns & Inouye 1993; Dafni 1992). To distinguish floral visitors from
    potential pollinators for species detected by DVR, contact with the stigma was
    recorded for all floral visitors. Pollen presence for captured individuals was
    examined under a stereo microscope (40 x magnification). Specimens carrying pollen
    were then examined under a scanning electron microscope (SEM) (JEOL JSM-6490LA,
    Japan) to examine whether the pollen was that of the target Rutaceae species.
    ^p To examine whether wind may be a pollination vector, the pedicels of flowers
    that contained visible pollen (viewed through a hand lens) were taped to a rod
    so that the anthers were exposed. A fan was used to generate wind speeds (5 km
    h-1 and 40 km h-1) blowing onto each flower for 10 seconds. A 9 cm Petri dish
    smeared with Vaseline was placed behind each open flower to capture any dislodged
    pollen. [...] To determine the maximum distance pollen could travel, petri dishes
    were placed at 5 cm, 10 cm or 50 cm behind the open flowers. [...] Treatments
    were replicated 10 times each for Acronychia oblongifolia, using flowers sourced
    from one tree at Mount Annan and one tree at Jerrara, and 15 times each for Sarcomelicope
    simplicifolia subsp. simplicifolia, using flowers sourced from one tree at each
    of Jerrara, South Kiama and Kiama. ^p Each record is one floral visitor taxon
    classed as a potential pollinator in Table S2 and the Results text, or wind, where
    the wind experiment dislodged and transported pollen and the authors concluded
