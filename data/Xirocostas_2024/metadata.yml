questions:
  question2: Supplementary information table 3 gives one location per site x species,
    but the data file's locality column sometimes disagrees. Centranthus ruber in
    Canberra is recorded at Queanbeyan (table 3 gives ANU, Sullivans Creek Road, Acton,
    -35.2795, 149.1153); Centranthus ruber in Melbourne is recorded at Plenty (table
    3 gives 21 Bayview Ave, Clayton, -37.9069, 145.126). Trifolium repens observations
    at Queanbeyan and Mount Waverley are not in table 3 (which lists Trifolium repens
    only at Black Mountain Peninsula and Damper Creek Reserve). For each of these
    the nearby location specified in table 3 was used. However for Hypericum perforatum
    observed in Reevsby, Sydney, no nearby "extra" coordinates existed and a suburb
    average was used. Is this approach OK?
