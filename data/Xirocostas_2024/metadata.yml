  custom_R_code: ' data |> dplyr::filter(range == "Introduced") '
  collection_date: collection_date
  taxon_name: species
  location_name: location_name
  individual_id: survey_id
  description: To test the Missed Mutualist Hypothesis, that plant species introduced
    to a new range escape their mutualists (here pollinators) as well as their enemies,
    by comparing the abundance and richness of flower visitors on ten herbaceous species
    across their native (European) and introduced (Australian) ranges.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'To determine whether plants are interacting with fewer, less
    diverse pollinators in their introduced range we chose target species that were:
    1. Biotically pollinated. 2. Present across a wide area in their native (Europe)
    and introduced ranges (Australia). ^p Using these criteria, we identified 15 plant
    species. Some species, however, were unable to be located or observed at least
    once in both ranges despite our best efforts in the field. Our final dataset is
    comprised of observations from the ten herbaceous plant species belonging to nine
    families and eight orders for which we were able to take observations in at least
    one site across both native and introduced ranges (Supplementary information).
    ^p We conducted floral observations at nine sites within the native and introduced
    ranges of ten plant species. For most of our study species in Australia, the exact
    source population, or populations for multiple introductions (as in Hypericum
    perforatum and Trifolium repens), are not known. Further, most of the introduced
    species present in Australia have very wide home ranges. Thus, studying a single
    native population and comparing it with a single introduced population could give
    misleading results. We therefore selected a broad range of sites and climatic
    conditions to get a general understanding of plant-pollinator interactions within
    and across native and introduced ranges (Fig. 6). We prioritised maximising the
    latitudinal range and landscape diversity in each range when selecting our study
    sites. We also considered the presence of our target species when choosing sites
    as we favoured places that would increase our sampling potential. Prior to choosing
    site locations we used online resources such as the Global Biodiversity Information
    Facility (gbif.org) and the Atlas of Living Australia (ala.org.au) to check the
    presence of our target species. However, not all study species were present at
    each site (i.e., city or region where sampling took place) (see Supplementary
    information). ^p Floral observations were made in early to mid-summer of 2019
    from May to August in Europe and from September to December in Australia. When
    choosing individuals, we looked for those that were actively in flower and then
    randomly selected individual plants from that subset population. This was done
    using a compass and random number generator to determine the observer''s direction
    of movement, the first individual encountered (or nearby) when walking in this
    direction was sampled. If ten or fewer individuals were present, all were sampled.
    All observations were conducted in daylight hours between 10am and 3 pm on days
    with no rain and minimal wind. Each observation was timed at 15 min and conducted
    with the observer placed 1-2 m from the target plant. We aimed to repeat these
    timed observations for at least 10 individuals of each species at every site.
    In total, we conducted 250 timed observations in the native range and 236 in the
    introduced range.'
  original_file: pollination_final_NOR_excl.csv, downloaded from figshare (https://doi.org/10.6084/m9.figshare.22819490.v1);
    in raw data folder
  notes: none
