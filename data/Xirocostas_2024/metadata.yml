traits:
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To be considered a pollinator, an animal must act as a vector for transferring
    pollen from one flower to another. As we could not visually ensure successful
    pollination occurring during our observations, we instead quantified the number
    of times a flower was visited by invertebrates (potential pollinators). We defined
    a 'visit' as any time an invertebrate came into contact with floral reproductive
    organs (e.g., anthers or stigma), as implemented across similar field studies.
    The duration of a visit was not recorded, and longer visits were considered the
    same as shorter ones (e.g., if a bee interacted with a flower for 5 min or 5 s
    it was still considered one visit). Visitors were categorised according to their
    taxonomic group as bees/wasps (Aculeata), flies (Diptera), ants (Formicidae),
    beetles (Coleoptera), butterflies/moths (Lepidoptera), spiders (Araneae), true
    bugs (Hemiptera), thrips (Thysanoptera), dragonflies (Odonata), and grasshoppers
    (Orthoptera). The total number of "floral units" (defined for each species in
    the Supplementary information) where visitors were observed on the target individual
    were also counted. If an invertebrate visited the same floral unit more than once
    (i.e., the animal left and then returned) or visited multiple floral units on
    the same individual, they were counted as multiple visits.
