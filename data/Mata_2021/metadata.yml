contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: Flower visitor taxon name
traits:
- var_in: Pollinator match value
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Direct field observation and sweep-netting of insects on plant species
    within survey plots, standardized as a proportion of the plant species' volume
    within the plot, with each plant species in each plot sampled three times from
    January (summer) to late March (autumn) 2015. Sampled insect specimens were processed
    in the laboratory and identified to species/morphospecies, then assigned to one
    or more functional groups, including "pollinators and other flower-visiting taxa";
    contact with the flower's reproductive structures and pollen transfer were not
    confirmed for these field records.
substitutions:
- trait_name: pollination_vector_possible
  find: halticidae
  replace: halictidae
- trait_name: pollination_vector_possible
  find: apis mellifera
  replace: apis_mellifera
- trait_name: pollination_vector_possible
  find: vespidae
  replace: wasp
