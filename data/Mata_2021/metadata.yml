dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::filter(pol == "1") |>
      dplyr::mutate(
        `Pollinator match column` = dplyr::case_when(
          genus == "Apis" ~ "species",
          family %in% c("Calliphoridae", "Syrphidae", "Colletidae", "Halictidae", "Halticidae", "Ichneumonidae", "Formicidae", "Vespidae") ~ "family",
          order == "Diptera" ~ "suborder",
          TRUE ~ "order"
        ),
        `Pollinator match value` = dplyr::case_when(
          genus == "Apis" ~ species,
          family %in% c("Calliphoridae", "Syrphidae", "Colletidae", "Halictidae", "Halticidae", "Ichneumonidae", "Formicidae", "Vespidae") ~ family,
          order == "Diptera" ~ suborder,
          TRUE ~ order
        ),
        `Flower visitor taxon name` = dplyr::case_when(
          is.na(genus) ~ family,
          stringr::str_detect(species, stringr::regex("\\bsp\\.?\\b", ignore_case = TRUE)) ~ genus,
          TRUE ~ species
        )
      )
  '
  collection_date: 2015-01/2015-03
  taxon_name: vegspecies
  location_name: site
  description: A study investigating whether plant origin (indigenous, regionally
    native, or nonnative) and growth form influence the taxonomic and functional diversity
    of insect communities, including pollinators and other flower-visiting taxa, in
    a densely urbanised municipality.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'Our study was conducted across 15 public parks, which varied
    in size across four orders of magnitude (1.1 x 10^3-1.3 x 10^6 m^2; Appendix S1:
    Table S1; Appendix S1: Fig. S1a). We established a total of 130 plots across the
    15 parks, with the number of plots in each park (2-36), and their size (84-148
    m^2), varying according to the park''s area (Appendix S1: Eq. S1-S3) and planting
    design elements and midstorey growth forms present (Appendix S1: Table S1; Appendix
    S1: Fig. S1b). Within each plot we identified all plants, totaling 133 species,
    genera, or species complexes; and representing the main monocot and eudicot phylogenetic
    clades across the angiosperm tree of life (Appendix S2: Table S2; Appendix S2:
    Table S7). We classified plant species by origin as indigenous (30), regionally
    native (9), and nonnative (94). We define indigenous plant species, also referred
    to in the literature as locally native, as those that are native to the local
    bioregions. For this study, indigenous plant species are those that occurred before
    European settlement in the Volcanic Victorian Plain and Gippsland Plain bioregions
    (State of Victoria; data available online). Regionally native (henceforth native)
    are species that are native to Australia but not to the local bioregions and have
    been anthropogenically introduced. Nonnative species are those that have been
    introduced to Australia. We also classified plant species by planting design element
    (henceforth design element) as lawn complex (41), midstorey (67), and tree canopy
    (25; Fig. 1a). Midstorey taxa were further stratified by growth form as forb (8),
    lilioid (13), graminoid (8), and shrub (38; Fig. 1b). We define lawn complexes
    (henceforth lawns) as patches dominated by turf-forming grasses (Poaceae) intermixed
    with one or more small, ruderal, herbaceous species. Midstorey species included
    broad-leaved perennial and annual herbaceous plants (forbs); petaloid monocots
    in orders Liliales and Asparagales (lilioids); grasses, sedges, and rushes of
    typically vertical habit with linear foliage and inconspicuous wind-pollinated
    flowers (graminoids); and woody perennials with multiple stems and <5 m in height
    (shrubs). Tree canopy species included single-stemmed woody plants >5 m in height.
    We sampled plant species for 12 insect groups known to dominate insect communities
    on above-ground vegetation: ants, bees, beetles, cicadas, flies, heteropteran
    bugs, jumping plant lice, leaf- and treehoppers, parasitoid wasps, planthoppers,
    sawflies, and stinging wasps. Samples were taken by direct observation and by
    sweeping with an entomological net. Observation time and sweeps per plant species
    were standardized as a proportion of the plant species'' volume within the plot
    (Appendix S1: Eq. S4-S5), with each plant species in each plot sampled three times
    from January (summer) to late March (autumn) 2015. Sampled insect specimens were
    processed in the laboratory and identified to species/morphospecies. We assigned
    these as (1) either indigenous to the studied bioregions and/or native to Australia
    (henceforth indigenous) or introduced to Australia and (2) one or more of the
    following functional groups: pollinators and other flower-visiting taxa (henceforth
    pollinators), herbivores, predators, parasitoids, and detritivores (Appendix S2:
    Table S1).'
  original_file: data.csv is an unmodified download of the dataset's Zenodo archive
    (Mata et al. 2020, doi:10.5281/zenodo.4127119).
  notes: The raw data records each insect's taxonomy across parallel `order`/`suborder`/`superfamily`/`family`/`subfamily`/`tribe`/`genus`/`species`
    columns of varying completeness. The derived columns `Pollinator match column`
    and `Pollinator match value` identify which of the raw taxonomy columns supplies
    the most taxonomically specific value that resolves to a `pollination_vector_possible`
    allowed value, and what that raw value was. Vespidae (true wasps, e.g. genus Vespula)
    is mapped via a `family` match plus a `vespidae` -> `wasp` substitution below,
    since `wasp` has no taxonomic synonyms declared in `config/traits.yml`. `Flower
    visitor taxon name` records the most specific taxon identity documented for the
    record. Tiphiidae, which is taxonomically close to (and sometimes conflated with)
    Thynnidae (the `thynnine_wasp` value), was left unmapped to avoid overclaiming
    a subfamily-level identity (Thynninae) that the data does not specify. The paper
    does not publish site coordinates and coordinates for each of the 15 park names
    were derived from OpenStreetMap records.
