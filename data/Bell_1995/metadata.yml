dataset:
  data_is_long_format: yes
  custom_R_code: ' data |> dplyr::filter(trait %in% c("seed_dry_mass", "seed_viability",
    "seed_germination", "seed_germination_treatment", "seed_dormancy_class", "life_form",
    "plant_growth_form", "resprouting_capacity", "seedbank_location", "bud_bank_location",
    "post_fire_flowering", "dispersal_appendage", "germination_cues")) '
  collection_date: '1994'
  taxon_name: taxon_name
  trait_name: trait
  value: value
  location_name: location_name
  source_id: source_id
  description: To determine how temperature, light and gibberellic acid control the
    germination of southwestern Western Australian species differing in life form,
    fire response, seed store and seed size, and whether these responses time seedling
    emergence to the cool, wet winter and to buried, shaded positions after fire.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: 'The tests utilized 43 species (21 genera, 11 families) of southwestern
    Western Australia, including a range of life-history strategies, fire-response
    syndromes and seed-store types (Table 1). Eight species were represented by two
    provenance collections. Thus the total number of taxa included was 50. Seeds were
    collected by a number of commercial collectors from native habitats and purchased
    by Alcoa of Australia Ltd. From field collection times in late spring and early
    summer the seeds were stored at 4 °C for one to three months at the Marrinup Nursery
    of Alcoa of Australia until transferred to The University of Western Australia
    where they were stored at room temperatures prior to germination testing (see
    Table 1 for year of collection). ^p Seed weights for each species were determined
    by weighing three lots of 50 or 100 seeds, depending on seed weight and availability.
    Viability percentages were determined in three replications of 25 seeds by staining
    with tetrazolium chloride (1 %, w/v) following nicking of the seed coat (Lakon
    1949). Seeds were germinated in clear plastic petri plates. Three replicate plates
    of 25 seeds were placed on a Whatman #1 filter paper over small squares of sponge
    and provided with a treatment solution of the fungicide Previcur (2 %, v/v), then
    sealed by Parafilm. Because many of the soil-stored native seeds are known to
    require a heat-shock treatment to crack the hard testa, those species were pre-treated
    to simulate fire before the trials under varying temperature, light and GA were
    carried out. These species seeds were placed in boiling water for durations found
    by Alcoa of Australia Ltd. to induce the highest percentage germination (Table
    1). ^p Environmental conditions provided during the four week incubation included
    two temperatures, two light conditions and the presence or absence of GA3. Constant
    incubation temperatures were either 15°C or 23°C. Dark conditions were provided
    with the petri plates sealed in Kodak light-tight bags for the duration of the
    incubation period. Light conditions were exposure to a 12h diurnal cycle at 80
    umol m-2 s-1 provided by Sylvania Gro-Lux lights. Treatment solutions were either
    distilled water or a 50 mg/l distilled water solution of GA3. ^p Germination was
    defined as the emergence of the radicle from the seed coat. As seed numbers were
    generally limited, procedures for testing germination trials for small collections
    followed Williams et al. (1992).'
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: GA3 also inhibited germination in the dark at 23 °C in Xanthorrhoea preissii,
    Daviesia cordata, Hovea trisperma (b) and Acacia extensa; this is not mapped to
    a trait. The +GA3 versus -GA3 germination percentages exist only as bars in Fig.
    1 and were not extracted. Smoke responses for six species are quoted in the Discussion
    from Dixon et al. (1995) and carry that source_id.
identifiers: .na
locations:
  southwestern Western Australia:
    latitude (deg): -33.0
    longitude (deg): 116.5
    description: Native vegetation of the southwest.
    climate description: Mediterranean-type climate of cool, wet winters and warm,
      predominantly dry summers
    georeference remarks: Seeds were collected by commercial collectors from native
      habitats across the region; coordinates are a generic point in southwestern
      Western Australia.
    state: WA
contexts:
- context_property: seed lot
  category: entity_context
  var_in: seed_lot
  values:
  - value: a
    description: first of two provenance seed collections of the taxon
  - value: b
    description: second of two provenance seed collections of the taxon
- context_property: seed collection year
  category: entity_context
  var_in: seed_collection_year
- context_property: canopy position
  category: entity_context
  var_in: canopy_position
- context_property: habitat openness
  category: plot_context
  var_in: habitat_openness
- context_property: seed pre-treatment
  category: method_context
  var_in: pretreatment
  values:
  - value: none
    description: seeds not pre-treated before incubation
  - value: boiled 30 s
    description: seeds placed in boiling water for 30 s to crack the hard testa
  - value: boiled 60 s
    description: seeds placed in boiling water for 60 s to crack the hard testa
  - value: seed nicked
    description: seed coat nicked before incubation
- context_property: incubation temperature (C)
  category: treatment_context
  var_in: incubation_temperature
- context_property: incubation light condition
  category: treatment_context
  var_in: light_condition
  values:
  - value: light
    description: 12 h diurnal cycle of white light at 80 umol m-2 s-1
  - value: dark
    description: constant darkness, plates sealed in light-tight bags
traits:
- var_in: seed_dry_mass
  unit_in: mg
  trait_name: seed_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Seed weights for each species were determined by weighing three lots of
    50 or 100 seeds, depending on seed weight and availability.
- var_in: seed_viability
  unit_in: '%'
  trait_name: seed_viability
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Viability percentages were determined in three replications of 25 seeds
    by staining with tetrazolium chloride (1 %, w/v) following nicking of the seed
    coat (Lakon 1949).
- var_in: seed_germination
  unit_in: '%'
  trait_name: seed_germination
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: 'Seeds were germinated in clear plastic petri plates. Three replicate plates
    of 25 seeds were placed on a Whatman #1 filter paper over small squares of sponge
    and provided with a treatment solution of the fungicide Previcur (2 %, v/v), then
    sealed by Parafilm. ^p Environmental conditions provided during the four week
    incubation included two temperatures, two light conditions and the presence or
    absence of GA3. Constant incubation temperatures were either 15°C or 23°C. Dark
    conditions were provided with the petri plates sealed in Kodak light-tight bags
    for the duration of the incubation period. Light conditions were exposure to a
    12h diurnal cycle at 80 umol m-2 s-1 provided by Sylvania Gro-Lux lights. Treatment
    solutions were either distilled water or a 50 mg/l distilled water solution of
    GA3. ^p Germination was defined as the emergence of the radicle from the seed
    coat. ^p To determine the major effects of temperature and light regardless of
    the presence of GA3 supplementation, the + GA and - GA trial data were combined
    and re-analyzed to highlight the germination response to these two major environmental
    conditions. ^p Table 1 ... highest percentage germinability (± se; n =3) from
    trials. ^p Table 3. Germination percentage (± se) of native species of Western
    Australia in relation to temperature and light treatments.'
- var_in: seed_germination_treatment
  unit_in: .na
  trait_name: seed_germination_treatment
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Species previously known to require a heat-shock treatment to overcome
    dormancy due to an impervious testa were pre-treated prior to imposition of temperature,
    light and GA3 conditions. ^p These species seeds were placed in boiling water
    for durations found by Alcoa of Australia Ltd. to induce the highest percentage
    germination (Table 1). ^p GA3 also overcame the inhibition resulting from exposure
    to light in some understorey species (e.g. Allocasuarina campestris, Regelia ciliata,
    Xanthorrhoea gracilis and X. preissii). ^p Records the pre-treatment applied to
    each seed lot and gibberellic acid overcoming light inhibition of germination.
- var_in: germination_cues
  unit_in: .na
  trait_name: germination_cues
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The ecological significance of the tests would be that species which have
    seed dormancy mechanisms capable of delaying germination until the cool temperature,
    winter rainy period of this mediterranean-type climate would be more likely to
    survive than if germination followed summer rain showers or the first, intermittent
    rains of autumn. ^p Increased germination percentages in darkness compared to
    light appears related to the ability of the seeds to sense the buried environment.
    ^p The fire-resprouters, Andersonia lehmanniana, Billardiera bicolor, Hypocalymma
    angustifolium, Patersonia occidentalis, Tetratheca hirsuta, Thysanotus multiflorus,
    T. dichotomus and Leucopogon verticillatus did not germinate in any of the treatments
    here. In a recent study by Dixon et al. (1995), the first six of these species
    had higher germination percentages after exposure to smoke treatment. ^p Records
    species whose germination was greater at the cooler (15 °C) or warmer (23 °C)
    incubation temperature, or in darkness or light, as stated in the text, and the
    smoke responses reported by Dixon et al. (1995).
- var_in: seed_dormancy_class
  unit_in: .na
  trait_name: seed_dormancy_class
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Species previously known to require a heat-shock treatment to overcome
    dormancy due to an impervious testa were pre-treated prior to imposition of temperature,
    light and GA3 conditions. ^p Because many of the soil-stored native seeds are
    known to require a heat-shock treatment to crack the hard testa, those species
    were pre-treated to simulate fire before the trials under varying temperature,
    light and GA were carried out.
- var_in: life_form
  unit_in: .na
  trait_name: life_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Life-history types include Phanerophyte (P, taller shrubs, > 1 m and trees);
    Megachamaephyte (CH-mg, 20-100 cm, low shrubs); Nanochamaephyte (Ch-na, 10-20
    cm, small shrubs); tufted Hemicryptophyte (H-tfd, tufted clumps, mainly perennial
    monocots); Climbers (C).
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Life-history types include Phanerophyte (P, taller shrubs, > 1 m and trees);
    Megachamaephyte (CH-mg, 20-100 cm, low shrubs); Nanochamaephyte (Ch-na, 10-20
    cm, small shrubs); tufted Hemicryptophyte (H-tfd, tufted clumps, mainly perennial
    monocots); Climbers (C). ^p The species as listed roughly in order of life form
    type as overstorey trees, understorey trees, and shrubs and suffrutescent perennials.
    ^p Allocasuarina campestris and Regelia ciliata, two large understorey shrubs
    with canopy-stored seeds. ^p Growth form is taken from the life-history descriptions
    and the Table 3 life form groups.
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Fire-response syndromes include obligate seeders (OS) and resprouters (R).
- var_in: seedbank_location
  unit_in: .na
  trait_name: seedbank_location
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Seed-storage syndromes include soil-stored seed (S) and canopy-borne seed
    (C).
- var_in: bud_bank_location
  unit_in: .na
  trait_name: bud_bank_location
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: In this study, the seed populations of the large, dominant tree species
    of the region germinated in equal proportions in both the 15 °C and 23 °C incubation
    temperatures. These trees (except for Eucalyptus diversicolor) are capable of
    resprouting following fires from epicormic buds buried beneath the protection
    of thick bark (Bell et al. 1987).
- var_in: post_fire_flowering
  unit_in: .na
  trait_name: post_fire_flowering
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: In the post-fire resprouting, understorey species, Phyllanthus calycinus,
    and two species, where flowering is induced by fire, Xanthorrhoea gracilis and
    X. preissii, germination percentages were highest at 15°C and under dark conditions.
- var_in: dispersal_appendage
  unit_in: .na
  trait_name: dispersal_appendage
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Most of the legume species have seeds with white elaiosomes or other structures
    which are associated with collection, dispersal and burial by ants (Bell 1994a).
    The exceptions to this morphology in the legumes in this trial were Acacia cyclops,
    which has a very large red (bird-dispersal?) elaiosome and Paraserianthes lophantha,
    which has no elaiosome, but is a very large seed.
