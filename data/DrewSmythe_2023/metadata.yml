dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: Date
  taxon_name: Plant species
  location_name: location_name
  individual_id: Obs#
  description: To compare flower-visitor interactions and visitor diversity among
    mine-site rehabilitation areas of differing age and a nearby natural reference
    area in the Illawarra region, NSW.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Our study was conducted in the rehabilitation areas of Appin
    North Colliery (operated by Illawarra Metallurgical Coal (IMC), South32 during
    our study). The rehabilitation areas consisted of three areas that range in time
    since rehabilitation commenced, Stage 1 (STG1, oldest), Stage 2 (STG2, middle-aged),
    and Stage 3 (STG3, youngest). A nearby natural reference area (REF) was identified
    for comparison. In each area, a 90m x 90m plot was marked out. The flower-visitor
    surveys were conducted along belt transects (measuring 20m x 3m) within each plot,
    with a new starting point and direction selected each subsequent survey to prevent
    resampling over the span of the survey period. Surveys were conducted on 10 days
    in each area between October 2022 and February 2023 (approximately every fortnight),
    and one belt transect was surveyed per area on each day (total n=10 surveys per
    area). The survey order of the areas was shuffled each day. Two to three observers
    walked each 20m x 3m belt transect for 20 minutes to complete the surveys. All
    animal visitors to flowers were recorded, photographed in the field and identified
    on the wing (i.e. without collection) and/or using photographs. Animal visitors
    were identified to family level in most cases, and to genus or species level where
    possible. Plants were identified to species.
  original_file: Drew-Smythe, Emery, Davila 2022-23 interaction data.xlsx (sheet IXN_DATA;
    study details in sheet Information), supplied by the data contributors.
  notes: A manuscript is in preparation and will replace the thesis as the source
    once published.
