dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      mutate(
        taxon_name = paste0(stringr::str_to_title(genus), " ", species),
        location_name = ifelse(!is.na(latitude), paste0("site_at_", latitude, "_deg_lat_and_", longitude, "_deg_lon"), NA)
      ) |>
    generate_observation_numbers(species,trait)
  '
  collection_date: 2026/2026
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: unknown
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: unknown
  original_file: in raw data folder
  notes: none
identifiers: .na
locations:
  site_at_-35.273103_deg_lat_and_149.10871_deg_lon:
    latitude (deg): -35.273103
    longitude (deg): 149.10871
    description: unknown
contexts:
- context_property: floral visitor or pollinator
  category: entity_context
  var_in: pollinator_species
- context_property: replicate observations
  category: temporal_context
  var_in: observation_number
traits:
- var_in: flower_visitor
