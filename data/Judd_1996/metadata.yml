dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait %in% c(
          "leaf_N_per_dry_mass", "leaf_P_per_dry_mass", "leaf_K_per_dry_mass",
          "leaf_Ca_per_dry_mass", "leaf_Mg_per_dry_mass", "leaf_Mn_per_dry_mass",
          "leaf_Na_per_dry_mass", "leaf_S_per_dry_mass", "leaf_Cl_per_dry_mass",
          "leaf_Cu_per_dry_mass", "leaf_Zn_per_dry_mass", "leaf_B_per_dry_mass",
          "bark_N_per_dry_mass", "bark_P_per_dry_mass", "bark_K_per_dry_mass",
          "bark_Ca_per_dry_mass", "bark_Mg_per_dry_mass",
          "wood_N_per_dry_mass", "wood_P_per_dry_mass", "wood_K_per_dry_mass",
          "wood_Ca_per_dry_mass", "wood_Mg_per_dry_mass"
        ),
        grepl("^Table (2|9|10|16|17),", source_section),
        !(grepl("^Table 16,", source_section) & !grepl("country or region: Australia", context)),
        !(grepl("^Table 17,", source_section) & taxon_name %in% c("Eucalyptus grandis", "Eucalyptus saligna")),
        !(grepl("^Table 17,", source_section) & taxon_name == "Eucalyptus diversicolor" & grepl("^leaf_", trait)),
        is.na(omit_duplicate),
        !is.na(trait_value_clean), trait_value_clean != ""
      )
    '
  collection_date: 1989/1996
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  source_id: source_id
  description: 'To synthesise published nutrient concentrations in Eucalyptus in order
    to test whether the subgenera Monocalyptus and Symphyomyrtus differ nutritionally,
    and to compare nutrient concentrations between native forests and plantations and
    among plant components.'
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: 'We have assembled a database of nutrient concentrations in
    components of 110 species of Eucalyptus growing in native forests and in plantations
    and glasshouse trials around the world. ^p While our understanding of eucalypt
    nutrition is by no means complete, the literature from which we can draw, covering
    many aspects of both nutrition and productivity, is extensive (more than 500
    references). The literature encompasses native forests, plantations and
    glasshouse-grown seedlings, and much of it is reviewed or described in other
    chapters. This chapter reviews that part which includes data from nutrient analyses,
    that is concentrations and contents of various plant components. Our aim is to
    summarize these data, assessing variation and making comparisons between taxa and
    plant components. We have placed particular emphasis on identifying and quantifying
    nutritional differences between the major eucalypt subgenera Monocalyptus and
    Symphyomyrtus. The assembled database contains information on 110 species. This
    chapter is also designed as a reference source for those with more specific
    interests. Appendix I lists all references used to compile the database and is
    cross-indexed by species (Appendix II) and components (Appendix III). ^p Similarly,
    we compared adjacent E. globulus Labill. and E. nitens (both within Symphyomyrtus
    series Viminales) plantations on three sites of varying soil fertility in northern
    Tasmania and found that the foliar concentration of calcium was consistently greater
    (1.8 times on average) in E. globulus, while differences in foliar concentrations of
    nitrogen, phosphorus, potassium and magnesium between the two species were smaller,
    site-specific (with the exception of magnesium) and mostly non-significant (Table
    10). ^p Work on the database commenced in 1989, funded in part by the Australian
    Research Council (ARC).'
  original_file: raw/trait_data.csv (extracted from the source PDF by Claude AI, Anthropic)
  notes: Data for additional traits, leaf_sulfate_S_per_dry_mass and stand level nutrient concentrations remain in raw/trait_data.csv only. Only data from Australian
    material are mapped. custom_R_code excludes subgenus- and genus-level means and ranges (Tables 1,
    3-8, 13), stand-level data, and data from overseas plantations. Values already in
    AusTraits from the original studies are flagged in the data.csv column omit_duplicate
    with the dataset holding them (Richards_2008) and excluded by custom_R_code. For some of these values Richards only reports the maximum end of a range, so for these same records the minimum is retained here.
