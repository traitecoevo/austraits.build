  category: method_context
  var_in: entity_measured
traits:
- var_in: leaf_N_per_dry_mass
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: 'Table 2. Range of measured nutrient concentrations in foliage of three
    south-west Western Australian eucalypts derived from the database. ^p Table 9.
    Concentrations of macro-nutrients in foliage at age 2 years for adjacent E. regnans
    and E. nitens plantations grown on an unamended ''ex-forest'' (i.e. cleared native
    forest) site with uniform site preparation in south Gippsland, Victoria (unpublished
    data). ^p Table 10. Comparison of concentrations of macro-nutrients in foliage for
    adjacent plantations, each with identical site preparation and fertilizer addition,
    of E. globulus and E. nitens at three locations in northern Tasmania. Site 1,
    ex-forest on Permian sediments; Site 2, ex-forest on dolerite; Site 3,
    ex-agriculture on basalt. Overall comparison is for 22 sites for E. globulus and 40
    sites for E. nitens. Data from Judd et al. (1991). ^p Table 16. Range of measured
    concentrations of macro-nutrients in foliage of selected eucalypt species grown in
    Australia and overseas. Species grown in Australia include those from both native
    forests and plantations. ^p All of the analyses reported in this paper are of
    concentrations of the total of a given nutrient. ^p Records are total element
    concentrations per unit dry mass of foliage, as ranges (minimum and maximum) of
    values compiled from the literature or as means for individual plantation sites.'
