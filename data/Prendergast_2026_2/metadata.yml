questions:
  question1: Acacia-genus rows (Plant genus == "Acacia") were split out of this
    dataset on 2026-09-21 into the sibling dataset Prendergast_2026_3, which accompanies
    the magazine article Prendergast (2026) "Potential pollinators of Australian
    Acacias". As a result, secondary references and taxonomic_updates entries here
    were recomputed for this now-smaller, Acacia-excluded dataset (the >50-record
    threshold for a formal secondary reference dropped WAMuseum_2025, Bernhardt_1987
    and Martinez-Bauer_2015, all now entirely in Prendergast_2026_3), and location_name
    disambiguation (which depends on how many distinct coordinates share a place
    name) was recomputed within this subset alone -- flagging for curator review.
