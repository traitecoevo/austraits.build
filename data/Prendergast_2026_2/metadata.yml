-06-17/1982-06-18", "September 1996 - April 1997 and in September - October 1997." = "1996-09/1997-10", "July - Aug" = NA_character_, "Sept 1996 - April 1997" = "1996-09/1997-04", "December 1999 - April 2001" = "1999-12/2001-04", "15th-17th March 2017." = "2017-03-15/2017-03-17", "17-27/10/1999" = "1999-10-17/1999-10-27", "23/08/2010 - 07/10/2010" = "2010-08-23/2010-10-07", "April 1974-Dec 1976" = "1974-04/1976-12", "May 1975-Dec 1976" = "1975-05/1976-12", "2/8/1058" = "1958-08-02");
    data |>
      dplyr::mutate(
        `Pollinator match column` = dplyr::case_when(
          `Animal species binomial name` == "Apis mellifera" ~ "Animal species binomial name",
          `Animal subgenus` %in% c("Exoneura", "Braunsapis", "Amegilla", "Bombus", "Xylocopa", "Tetragonula", "Austroplebeia", "Pteropus", "Thrips", "Syrphidae") ~ "Animal subgenus",
          `Animal genus` %in% c("Exoneura", "Braunsapis", "Amegilla", "Bombus", "Xylocopa", "Tetragonula", "Austroplebeia", "Pteropus", "Thrips", "Syrphidae") ~ "Animal genus",
          `Animal subfamily` == "Thynninae" ~ "Animal subfamily",
          `Animal family` %in% c("Calliphoridae", "Calliphorinae", "Syrphidae", "Colletidae", "Halictidae", "Ichneumonidae", "Formicidae", "Vespidae", "Bombyliidae", "Meliphagidae", "Zosteropidae", "Psittacidae", "Scincidae", "Gekkonidae", "Diplodactylidae", "Megachilidae", "Stenotritidae", "Sarcophagidae", "Apidae", "Nectariniidae", "Thynnidae") ~ "Animal family",
          `Animal order` %in% c("Coleoptera", "Coleoptear", "Lepidoptera", "Hemiptera", "Hymenoptera", "Hymnoptera", "Diptera", "Blattodea", "Thysanoptera", "Chiroptera", "Psittaciformes", "Psittaformes", "Diprotodontia") ~ "Animal order",
          `Animal class` %in% c("Aves", "Insecta", "Mammalia") ~ "Animal class",
          TRUE ~ NA_character_
        ),
        `Pollinator match value` = dplyr::case_when(
          `Animal species binomial name` == "Apis mellifera" ~ `Animal species binomial name`,
          `Animal subgenus` %in% c("Exoneura", "Braunsapis", "Amegilla", "Bombus", "Xylocopa", "Tetragonula", "Austroplebeia", "Pteropus", "Thrips", "Syrphidae") ~ `Animal subgenus`,
          `Animal genus` %in% c("Exoneura", "Braunsapis", "Amegilla", "Bombus", "Xylocopa", "Tetragonula", "Austroplebeia", "Pteropus", "Thrips", "Syrphidae") ~ `Animal genus`,
          `Animal subfamily` == "Thynninae" ~ `Animal subfamily`,
          `Animal family` %in% c("Calliphoridae", "Calliphorinae", "Syrphidae", "Colletidae", "Halictidae", "Ichneumonidae", "Formicidae", "Vespidae", "Bombyliidae", "Meliphagidae", "Zosteropidae", "Psittacidae", "Scincidae", "Gekkonidae", "Diplodactylidae", "Megachilidae", "Stenotritidae", "Sarcophagidae", "Apidae", "Nectariniidae", "Thynnidae") ~ `Animal family`,
          `Animal order` %in% c("Coleoptera", "Coleoptear", "Lepidoptera", "Hemiptera", "Hymenoptera", "Hymnoptera", "Diptera", "Blattodea", "Thysanoptera", "Chiroptera", "Psittaciformes", "Psittaformes", "Diprotodontia") ~ `Animal order`,
          `Animal class` %in% c("Aves", "Insecta", "Mammalia") ~ `Animal class`,
          TRUE ~ NA_character_
        ),
        `Pollinator taxon name` = dplyr::case_when(
          is.na(`Animal genus`) & is.na(`Animal family`) & is.na(`Animal order`) ~ `Animal class`,
          is.na(`Animal genus`) & is.na(`Animal family`) ~ `Animal order`,
          is.na(`Animal genus`) ~ `Animal family`,
          stringr::str_detect(`Animal species binomial name`, stringr::regex("\\bsp\\.?\\b", ignore_case = TRUE)) & !is.na(`Animal subgenus`) ~ paste0(`Animal genus`, " (", `Animal subgenus`, ")"),
          stringr::str_detect(`Animal species binomial name`, stringr::regex("\\bsp\\.?\\b", ignore_case = TRUE)) ~ `Animal genus`,
          TRUE ~ `Animal species binomial name`
        ),
        .lat = `Latitude (S)`, .place = trimws(stringr::str_replace_all(`Nearest named place`, "\u00a0", " "))
      ) |>
      dplyr::group_by(.place) |>
      dplyr::mutate(.n_variants = dplyr::n_distinct(.lat[!is.na(.lat)])) |>
      dplyr::ungroup() |>
      dplyr::mutate(
        location_name = dplyr::case_when(
          is.na(.lat) ~ "unknown",
          is.na(.place) | .n_variants > 1 ~ paste(.place, `Location - State`, .lat, sep = " - "),
          TRUE ~ .place
        ),
        location_name = dplyr::if_else(
          location_name %in% c("?", "Classon Park Leeming (32°04’56.69” S, 115°51’34.22”E), and Wireless Hill (32°1’46.99”S, 115°49’45.99”E)", "Darlington, Perth - WA - ?", "Dawesville", "Jandakot and Beeliar Regional Parks area", "Jurien Bay", "Mt Cooke", "Perth Metropolitan", "Swan Coastal Plain", "Trigg Island, Perth", "Warrigal Rd, Wandoo NP", "Mt Nelson"),
          "unknown", location_name
        ),
        `Plant scientific name` = dplyr::if_else(
          `Plant scientific name` %in% c("Acacia sp.", "Daviesia sp.", "Dillwynia sp.", "Eucalyptus sp.", "Gastrolobium sp.", "Scholtzia sp.", "Terminalia sp.") & location_name != "unknown",
          paste0(`Plant scientific name`, " [", location_name, "]"),
          `Plant scientific name`
        )
      ) |>
      dplyr::select(-.lat, -.place, -.n_variants) |>
      dplyr::distinct(
        `Plant scientific name`, location_name, source_id, Date, `Pollinator taxon name`,
        `No. of visitors`, `Pollinator match value`, .keep_all = TRUE
      ) |>
      mutate(
        Date = dplyr::if_else(Date %in% names(DATE_FIX_MAP), unname(DATE_FIX_MAP[Date]), Date),
        Date = util_parse_collection_date(Date)
      )
  '
  collection_date: Date
  taxon_name: Plant scientific name
  location_name: location_name
  source_id: source_id
  measurement_remarks: Reference
  description: To compile documented plant-flower visitor interactions for Australian
    native and introduced plants from diverse published and unpublished sources.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: This is a secondary literature/database compilation, drawing together diverse pollination_vector_possible observations. The dataset compiler has already curated the dataset to include only possible pollinators, not all flower visitors.
  original_file: data.csv is the compilation file as supplied, with one added column,
    source_id (a per-row Dataset_ID -> reference-key lookup, placed immediately after
    Dataset_ID), rather than computing it at build time via custom_R_code; raw/Pickup_Prendergast_2025_Datasets.xlsx
    is the accompanying reference table (one row per Dataset_ID, with title/authors/journal/year/DOI/n_interaction_rows/etc.)
    used to identify and cite the secondary references above and to build the source_id
    lookup. All rows with Plant genus Acacia were subsequently split out of this
    file into the sibling dataset Prendergast_2026_3, which accompanies Prendergast
    (2026) "Potential pollinators of Australian Acacias"; this file now holds only
    the remaining, non-Acacia rows.
  notes: 'basis_of_record is field for every row, with no genuine ambiguity: a
    flower-visitor interaction is, by definition, always a field event -- unlike
    a trait such as a plant dimension, which really can be measured on a preserved/pressed
    specimen, a pollinator cannot be observed visiting a flower inside a museum
    collection or purely from reading a paper. This holds for Kit Prendergast''s
    own unpublished field survey reports/thesis (source_id starting Prendergast_),
    her personal field observations (Prendergast_pers_obs), grey-literature sightings
    (source_id starting GreyLit_ -- Facebook/YouTube/flickr/iNaturalist/blog posts
    documenting a live observation), WAMuseum_2025 (a museum specimen database --
    the specimen itself was collected in the field during a captured visitation
    or with an attached pollen load picked up in the field, the museum record is
    just how that field-collected evidence is now catalogued), rows flagged in
    the raw Observation type column as pollen-grain-only (P) or DNA-based (D)
    identification (the visitor was still observed/caught interacting with the
    flower in the field, with pollen-grain analysis or DNA barcoding used only
    afterwards to confirm its identity, not to detect the interaction itself),
    and every other secondary source cited above (published articles, other
    researchers'' reports/theses): this is a compilation of specific, individually
    documented interaction records, not a set of values being loosely reported
    or synthesised from literature review, so each row is itself a discrete field
    observation regardless of who made it or when. Pollinator match column & Pollinator match value identify which raw column supplies the most taxonomically specific value
    that resolves to a `pollination_vector_possible` allowed value, species (Apis
    mellifera only), then subgenus/genus (checked against genus-level vocabulary synonyms
    spanning bees -- Exoneura/Braunsapis=allodapini, Amegilla=anthophorini, Bombus=bumblebee,
    Xylocopa=carpenter_bee, Tetragonula/Austroplebeia=stingless_bee -- and Pteropus=flying_fox,
    Thrips=thrips), then subfamily (Thynninae=thynnine_wasp), then family, order,
    class (for
    the bird/insect families and orders with no dedicated vocabulary term). `Pollinator taxon name` records the most specific
    real taxonomic identity documented. The 11 sources with > 50 records (within this now Acacia-excluded subset) are included as secondary references. A complete list of references is retained within measurement remarks. `location_name` is derived
    from the raw `Nearest named place` column, disambiguated by state and coordinates
    where the same place name covers more than one distinct site. Where a plant genus-level
    `sp.` name (e.g. `Eucalyptus sp.`) recurs across more than one distinct named
    location, `Plant scientific name` is suffixed with that location (e.g. `Eucalyptus
    sp. [Flint]`) so these are not conflated as the same unidentified species; records
    left with an "unknown" location keep the plain `Genus sp.` name. Acacia-genus records were removed from this dataset and moved into the sibling dataset Prendergast_2026_3, which accompanies the magazine article Prendergast (2026) "Potential pollinators of Australian Acacias"; secondary references and taxonomic_updates entries were re-derived/renumbered for this now-smaller dataset accordingly.'
identifiers: .na
locations: locations.csv
contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: Pollinator taxon name
- context_property: pollinator count
  category: treatment_context
  var_in: No. of visitors
traits:
- var_in: Pollinator match value
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Compiled from field observations, museum and herbarium specimen records,
    and unpublished survey/thesis records across many original sources. Contact with the flower's reproductive
    structures and pollen transfer are not confirmed for the great majority of records,
    so these are treated as possible rather than known pollen vectors; where a source
    identifies an animal to varying taxonomic precision across several parallel columns,
    the value mapped in here is the most taxonomically specific of those columns that
    corresponds to an AusTraits controlled-vocabulary term for this trait.
