contexts:
- context_property: replicate observations
  category: temporal_context
  var_in: observation_number
- context_property: floral visitor taxon name
  category: entity_context
  var_in: pollinator_taxon
- context_property: sampling method
  category: method_context
  var_in: Method
- context_property: pollination evidence
  category: method_context
  var_in: Pollination evidence
traits:
- var_in: pollination_vector_known
  unit_in: .na
  trait_name: pollination_vector_known
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: A compilation of floral-visitor and pollen-vector records, merging personal field observations and photographic records,
    with data from independently published/unpublished studies. A `pollination_vector_known` record
    indicates direct/confirmed evidence of pollen transfer or an assumed pollinator
    based on morphology plus pollen swabbed from the body.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: A compilation of floral-visitor and pollen-vector records, merging personal field observations and photographic records, with data from independently published/unpublished studies. A `pollination_vector_possible` record indicates the visitor was observed contacting the flowers stigma and/or anthers, but pollination was not experimentally confirmed.
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: A compilation of floral-visitor and pollen-vector records, merging personal field observations and photographic records,
    with data from independently published/unpublished studies. A `flower_visitor` record indicates
    the taxon was observed visiting/on the flower (e.g. taking a nectar reward) with
    no recorded contact with the stigma or anthers.
- var_in: pollination_syndrome
  unit_in: .na
  trait_name: pollination_syndrome
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: A compilation of floral-visitor and pollen-vector records, merging personal field observations, photographic records,
    with data from independently published/unpublished studies. A `pollination_syndrome` record indicates
    the likely pollinator group was inferred from floral morphology rather than directly
    observed visitation.
substitutions: .na
