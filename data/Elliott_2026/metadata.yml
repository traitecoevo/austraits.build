dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      mutate(
        taxon_name = trimws(paste(`Plant Genus`, ifelse(is.na(`Plant Species`), "", `Plant Species`))),
        pollinator_taxon = case_when(
          !is.na(`Visitor Genus`) & !is.na(`Visitor Species`) ~ paste(`Visitor Genus`, `Visitor Species`),
          !is.na(`Visitor Genus`) ~ `Visitor Genus`,
          !is.na(`Visitor Order/Family`) ~ `Visitor Order/Family`,
          TRUE ~ Morphospecies
        ),
        collection_date = stringr::str_extract(source_id, "[0-9]{4}$")
      ) |>
      generate_observation_numbers(taxon_name, `Visitor TRAIT`, Location)
  '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: Visitor TRAIT
  value: pollinator_trait_value
  location_name: Location
  description: Compilation of floral-visitor and pollen-vector records for Western
    Australian and south-eastern Australian plant species, drawn from personal observations
    and photographic records by Carole Elliott and Leonie Monks (Biodiversity and
    Conservation Science, DBCA), together with a series of published theses, journal
    articles and unpublished agency reports on rare and threatened flora species.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Dataset is an informal database merging data from disparate published
    and unpublished studies, supplemented with personal observations and photographic
    records of floral visitors by Carole Elliott and Leonie Monks. Sampling strategy
    and observation method vary by record - see the `sampling method` and `pollination
    evidence` contexts, and the cited source (`source_id`) for each record, for study-specific
    methodology.
  original_file: in raw data folder
  notes: Plant and pollinator taxon identities were split across several raw columns
    (`Visitor Order/Family`, `Visitor Genus`, `Visitor Species`, `Morphospecies`) and merged into taxon name columns for the context and pollinator/flower visitor values.
identifiers: .na
