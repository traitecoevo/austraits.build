dataset:
  data_is_long_format: no
  custom_R_code: ' data |> dplyr::filter(!range %in% "Native") '
  collection_date: collection_date
  taxon_name: taxon_name
  location_name: location_name
  individual_id: uniqueID
  description: To test the missed mutualist hypothesis for an invasive plant with
    the buzz pollination syndrome, by comparing the floral visitors, potential pollinators
    and pollen-foraging behaviours of Senna obtusifolia between its native range (Mexico)
    and invaded range (Australia).
  basis_of_record: field
  life_stage: adult
  sampling_strategy: We conducted this study in Mexico and Australia during the respective
    S. obtusifolia flowering seasons. We undertook pollinator observations between
    September and November 2023 at three sites in Yucatan, Mexico, Chochola, Tekik
    de Regil, and Xmatkuil (Appendix S1, Table S1, Figure S1). We undertook pollinator
    observations between May and July 2022 at five sites in Queensland, Australia,
    White Rock, Kamerunga, Trinity Beach, Lakeland, and the West Normanby River (Appendix
    S1, Table S1). Sites in each location were located at least 6.5 km apart and separated
    by either suburbia, farmland, native vegetation, or a combination of the three.
    Each site contained at least 50 S. obtusifolia plants. ^p We assessed floral visitors
    with a combination of direct observations and digital video recordings for a total
    observation time of 65 h across regions and sites (Appendix S1, Table S2 details
    the sampling effort at each site). For both direct observations and recordings,
    we sampled the accessible part of the plant canopy, with the flowers housing mature
    androecium or gynoecium. Both sampling methods were conducted within 2 m of the
    ground. We surveyed on days with minimal cloud cover, no rainfall, calm winds
    (maximum wind gusts did not exceed 54 km h−1), and temperatures ranging between
    17 and 30°C (Australia) or 24 and 36°C (Mexico). ^p We directly observed and captured
    floral visitors during defined time periods and areas to ensure similar sampling
    effort across sites. The exception was at Lakeland (Australia) where, due to time
    and distance constraints, we did not undertake direct observations. At all seven
    of the other sites, trained volunteers assisted with the floral visitor observations.
    Two observers conducted assessments in 30-min blocks resulting in a total observation
    time of 5–6 h per site (Appendix S1, Table S2). In Australia, surveys were done
    evenly over one day at each site, between 08:00 and 16:30. In Mexico, surveys
    were done over two days between 07:00 and 11:00, because floral visitors were
    not active after this time, potentially due to the hot climate. We observed fixed
    sections of the flowering stand (80 cm × 80 cm), referred to as the "arena" (following
    Dafni, 1992). We determined this 80 × 80 cm arena size based on the observer's
    ability to confidently track the movements of floral visitors. We captured floral
    visitors in specimen jars or using insect sweep nets after their foraging bouts
    within the arena and euthanized them on ice for subsequent identification and
    pollen analysis. We identified captured specimen with the help of entomologists
    Rei Asai, Matthew Connors, and Abiel Sansores using the keys, Houston (2018),
    Mexico, Ayala (1999), Ayala-Barajas (2016), Michener (1994, 2007), and Packer
    (2023). Specimens are vouchered in the Insect Ecology Laboratory (James Cook University,
    Cairns, Australia) and in the Department of Tropical Ecology (Universidad Autónoma
    de Yucatán, Mexico). ^p At all eight sites, we used digital video recordings to
    increase total observation time and observe species that may be deterred by human
    presence (as described by Dafni, 1992). We set GoPro HERO10 Black and Zero-X ZX-40
    UHD Action Cameras to record in 3000 resolution up to two flowers that had mature
    anthers and a receptive stigma, in 1-h time block commencing between 07:00 and
    12:00, over three days at each site throughout the flowering season. Due to technical
    issues, we obtained data from one, two, or three days at each site. We did not
    record in the afternoon due to cameras overheating (human observations showed
    peak pollinator activity was between 09:30 and 10:00 in Australia and between
    07:30 and 08:00 in Mexico).
  original_file: Floral visitors_ALL_publishing.xlsx (sheet Floral visitors_ALL; column
    definitions in sheet Metadata), published at Research Data JCU (https://doi.org/10.25903/zx8c-0q24);
    in raw data folder. data.csv is built from it by raw/extra_R_code_Lopresti_2026.R.
  notes: Records from the native range (Mexico) are filtered out in custom_R_code.
    raw/extra_R_code_Lopresti_2026.R adds taxon_name, collection_date (parsed from
    Excel date serials and video-clip labels in the date column), location_name, foraging_behaviour,
    flower_visitor and pollination_vector_possible to the authors' columns, plus two
    final rows holding species-level traits (nectar production, anther dehiscence,
    pollinator reward, breeding system) stated in the paper's description of the study
    species, with the source sentences in source_text. Columns describing the visitors
    themselves (thorax width, size-match index, foreign pollen count, pollen fidelity,
    visit duration, flowers contacted) are not mapped.
