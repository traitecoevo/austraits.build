contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: speciesScientific
- context_property: sampling method
  category: method_context
  var_in: methodDetected
  values:
  - find: Human observations
    value: direct observation
    description: floral visitor observed, and in some cases captured, by observers
      watching an 80 x 80 cm section of the flowering stand
  - find: DVR
    value: digital video recording
    description: floral visitor recorded by an action camera filming up to two flowers
- context_property: foraging behaviour
  category: entity_context
  var_in: foraging_behaviour
  values:
  - value: buzzing
    description: floral visitors contact the flower, anther cone, or single anther,
      and produce high-frequency vibrations via thoracic muscles, or head-banging
      behavior, to expel pollen
  - value: biting
    description: chewing a new hole or probing an existing hole either through the
      side of the anther or from the apical tip and extracting pollen with the proboscis
  - value: gleaning
    description: collecting residual pollen grains after the flower has been foraged
      by another (typically sonicating) species
  - find: biting/gleaning
    value: biting and gleaning
    description: both biting and gleaning recorded for the visit
- context_property: pollen grains carried (count)
  category: entity_context
  var_in: sicklepodPollenCount
traits:
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We documented the foraging behavior of each floral visitor. We defined
    floral visitors as species contacting any part of the flower. We assessed whether
    each floral visitor contacted the stigma while foraging and whether it produced
    audible floral vibrations to extract pollen. For every floral visitor, we recorded
    the behavior the individual used to extract pollen (buzzing or not buzzing) and
    where possible, we noted what non-buzzing behavior (see Lopresti et al., 2024)
    (Appendix S1, Table S3). ^p Each record is one floral visitor observed, video-recorded
    or captured on S. obtusifolia flowers.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We classed any floral visitor that contacted the stigma while foraging
    or carried pollen on their body as a potential pollinator. ^p We placed each euthanized
    specimen on a sterile slide under a stereomicroscope and swabbed it with basic
    fuchsin stain gels cut into 1 mm3 on a stainless-steel pin (Kearns & Inouye, 1993;
    Razanajatovo et al., 2024). We did not assess the pollen contained within the
    scopa and took care to not contact the scopa because tightly compact pollen grains
    in the scopa remain on the bee if it contacts the stigma (Parker et al., 2014),
    and we were only interested in pollen available for pollination. We swabbed each
    of the body parts until no pollen remained visible on the insect under 40× magnification
    (Mexico, Motic SMZ168; Australia, Nikon SMZ800). We warmed the cubes to melt the
    jelly and identified and counted the pollen grains under a standard light microscope
    (40× or 100× magnification) (Mexico, Motic BA310; Australia, Nikon Eclipse 200).
    ^p Each record is one floral visitor that contacted the stigma or carried S. obtusifolia
    pollen.
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: S. obtusifolia (Fabaceae) is a globally broadly distributed invasive plant
    (CABI, 2021). It has common traits of buzz-pollinated plants, including poricidal
    anthers and nectarless flowers. ^p Value from the description of the study species.
- var_in: flower_anther_dehiscence
  unit_in: .na
  trait_name: flower_anther_dehiscence
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: S. obtusifolia (Fabaceae) is a globally broadly distributed invasive plant
    (CABI, 2021). It has common traits of buzz-pollinated plants, including poricidal
    anthers and nectarless flowers. ^p Value from the description of the study species.
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Buzz-pollinated flowers have restricted pollen access, commonly encased
    by poricidal anthers (Buchmann et al., 1983). ^p It has common traits of buzz-pollinated
    plants, including poricidal anthers and nectarless flowers. ^p For every floral
    visitor, we recorded the behavior the individual used to extract pollen (buzzing
    or not buzzing) and where possible, we noted what non-buzzing behavior (see Lopresti
    et al., 2024) (Appendix S1, Table S3). ^p Value from the description of the study
    species and the pollen-foraging behaviour recorded for its floral visitors.
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Hand pollination experiments showed that S. obtusifolia is fully self-compatible
    but that it can set little seed in the absence of pollinators in both the native
    and invaded regions (Lopresti et al., unpublished). ^p Value from the hand-pollination
    experiments reported in the description of the study species.
substitutions:
- trait_name: flower_nectar_production
  find: nectarless
  replace: nectar_absent
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: The data file names two Australian sites differently from Table S1. I
    have matched Centenary Park to Trinity Beach and Springvale to Lakeland, because
    Figure 1 and Table S1 use Trinity Beach and Lakeland while Figure S2 and Table
    S2 use Centenary Park and Springvale. Can you confirm these are the same sites?
  question2: Four captured Homalictus specimens from Springvale (Lakeland) are dated
    15 June 2020 in the data file. We have assumed this should be 15 June 2022, the
    date of the Springvale video recordings. Can you confirm?
