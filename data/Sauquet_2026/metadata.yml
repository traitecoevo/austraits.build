dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      generate_observation_numbers(NTax1Ind, NIntInd, location_name)
  '
  collection_date: collection_date
  source_id: source_id
  taxon_name: NTax1Ind
  trait_name: NIntInd
  value: pollinator_trait_value
  location_name: location_name
  description: Literature survey of plant-pollinator interactions, primarily within
    Proteaceae and magnoliids.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Literature survey to complement the decision to include a new
    interaction data module in PROTEUS, which had been designed as a plant trait database;
    see individual references for more details on study sampling strategies.
  original_file: in raw data folder
  notes: Location coordinates are approximate park/area centroids unless stated in
    the locality. Apoidea was mapped to hymenoptera rather than bee, since Apoidea
    also includes apoid wasps. Hexapoda and Psocoptera were mapped to insect, and
    Acari (mites) to animal, as there is no more specific term for mites. Diptera,
    Cecidomyiidae and the cecidomyiid genera Clinodiplosis, Contarinia and Lestodiplosis
    were mapped to fly, following the Diptera to fly substitution used in other AusTraits
    datasets, although gall midges are Nematocera rather than Brachycera.
