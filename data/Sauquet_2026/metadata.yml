taxonomic_updates:
- find: Dryandra cunutea
  replace: Dryandra cuneata
  reason: Fuzzy match of taxon name to an APC-known canonical name once punctuation
    and filler words are removed (2026-09-28)
  taxonomic_resolution: species
exclude_observations:
- variable: taxon_name
  find: Dryandra, Hakea, Macadamia, Persoonia
  reason: excluding genus-level identications for a literature survey
questions:
  question2: Two bird records had the wrong family in the source - Zosterops lateralis
    is listed under Cisticolidae but is a Silvereye (Zosteropidae), mapped to silvereye;
    Malurus cyaneus is listed under Meliphagidae but is a fairy-wren (Maluridae),
    mapped to bird rather than honeyeater.
  question3: Eopsaltria griseogularis (Petroicidae) and Trochilidae (hummingbirds;
    Mast et al 2012, Hakea) were mapped to bird - but the bigger question is why there
    are hummingbirds in an Australia dataset.
