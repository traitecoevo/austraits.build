source:
  dataset:
    key: SAH_2014
    bibtype: Book
    author: J. P. Jessop, H. R. Toelken
    title: Flora of South Australia, 4th edition, 4 vols
    year: 1986
    publisher: Government Printer, Adelaide
    note: Electronic version curated by J. Kellermann, State Herbarium of South Australia.
contributors:
  data_collectors:
  - last_name: Kellermann
    given_name: Jürgen
    ORCID: 0000-0001-9124-9802
    affiliation: State Herbarium of South Australia, Botanic Gardens and State Herbarium,
      Hackney Road, Adelaide, SA 5000, Australia
  dataset_curators: Rachael Gallagher
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data %>%
      mutate(location_name = "South Australia") %>%
      mutate(
        .flora_key = paste(`original_name`, `trait_name`, `value_type`, `unit`, `value`, sep = "|"),
        `value` = ifelse(.flora_key %in% c(
          "Lepidosperma semiteres|leaf_length|maximum|mm|1.5",
          "Lepidosperma semiteres|leaf_length|minimum|mm|1"
        ), NA, `value`)
      ) %>%
      select(-.flora_key)
  '
  collection_date: 1986
  taxon_name: original_name
  location_name: location_name
  trait_name: trait_name
  value: value
  description: Taxonomic treatment - Flora of South Australia
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: Herbarium specimens and other herbarium curated data from South
    Australia
  measurement_remarks: authors
  source_id: .na
  original_file: .na
  notes: Request acknowledgement of "State Herbarium of South Australia"; Eucalyptus
    porosa `leaf_width` value has been modified from 25 cm to 2.5, due to likely typo,
    in custom_R_code.
    After outlier checks against other AusTraits datasets (at least 50-fold from the
    same species, or 100-fold from the genus), flora-derived numeric values that were
    parsing errors or unit typos in the source text are fixed in custom_R_code - 2 set
    to NA where it does not; E. Wenk 2026-11-14.
locations:
  South Australia:
    latitude (deg): .na
    longitude (deg): .na
    description: Taxa described in the Flora of South Australia; no specific collection locations.
    state: SA
contexts: .na
traits:
- var_in: plant_height
  unit_in: unit
  trait_name: plant_height
  entity_type: species
  value_type: value_type
  basis_of_value: measurement
  replicates: .na
  methods: unknown
- var_in: leaf_length
  unit_in: unit
  trait_name: leaf_length
  entity_type: species
  value_type: value_type
  basis_of_value: measurement
  replicates: .na
  methods: unknown
- var_in: leaf_width
  unit_in: unit
  trait_name: leaf_width
  entity_type: species
  value_type: value_type
  basis_of_value: measurement
  replicates: .na
  methods: unknown
substitutions: .na
taxonomic_updates:
- find: Poa labillardieri
  replace: Poa labillardierei
  reason: match_07_fuzzy. Fuzzy alignment with accepted canonical name in APC (2022-11-12)
  taxonomic_resolution: species
exclude_observations: .na
questions: .na
