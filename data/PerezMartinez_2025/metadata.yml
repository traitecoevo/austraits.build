traits:
- var_in: Wooddensity.g.cm3.
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: On a clean section of stem (without branches, buds or scars) ~5 cm length
    wood segment, with at least 0.5 cm of diameter, was cut ~50 cm from the sampled
    branch tip. Branch wood volume of the segment was measured after bark removal
    using the water displacement method (Chave et al., 2006) and dry mass was measured
    on an analytic balance after the segment was dried at 70°C to constant mass. Wood
    density (WD) was calculated as the wood segment dry mass divided by its volume.
- var_in: Average.Size_cm2
  unit_in: cm2
  trait_name: leaf_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: Countedleaves
  methods: Fully developed leaves (5–12) were collected from the sampled branch (leaf
    number dependent on leaf size variation). Leaves were scanned on a flatbed scanner
    to measure leaf area (LA) with ImageJ software (Schindelin et al., 2015). ^p Values
    are the total area of the scanned leaves divided by the number of leaves.
- var_in: SLA_m2.kg
  unit_in: m2/kg
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Fully developed leaves (5–12) were collected from the sampled branch (leaf
    number dependent on leaf size variation). Leaves were scanned on a flatbed scanner
    to measure leaf area (LA) with ImageJ software (Schindelin et al., 2015). Dry
    mass was determined after oven-drying at 70°C for 48 h. LMA was calculated as
    the leaf dry mass divided by LA.
- var_in: totalN
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Dry leaf samples were ground to a fine powder using a cyclone grinder (Retsch,
    Germany) with 0.5 mm particle size mesh. Leaf nitrogen concentration (Nmass as
    15N percentage of dry matter) and isotope ratio of 13C to 12C (δ13C) were analysed
    using a Micromass Isoprime Spectrometer (CF-IRMS, Manchester, England) at Australian
    National University (Canberra, Australia).
- var_in: totalC
  unit_in: '%'
  trait_name: leaf_C_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Dry leaf samples were ground to a fine powder using a cyclone grinder (Retsch,
    Germany) with 0.5 mm particle size mesh. Leaf nitrogen concentration (Nmass as
    15N percentage of dry matter) and isotope ratio of 13C to 12C (δ13C) were analysed
    using a Micromass Isoprime Spectrometer (CF-IRMS, Manchester, England) at Australian
    National University (Canberra, Australia). ^p Leaf carbon concentration is reported
    from the same analysis.
- var_in: d13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Dry leaf samples were ground to a fine powder using a cyclone grinder (Retsch,
    Germany) with 0.5 mm particle size mesh. Leaf nitrogen concentration (Nmass as
    15N percentage of dry matter) and isotope ratio of 13C to 12C (δ13C) were analysed
    using a Micromass Isoprime Spectrometer (CF-IRMS, Manchester, England) at Australian
    National University (Canberra, Australia).
