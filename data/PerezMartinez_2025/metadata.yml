dataset:
  data_is_long_format: no
  custom_R_code: ' data |> dplyr::filter( !is.na(Wooddensity.g.cm3.) | !is.na(Average.Size_cm2)
    | !is.na(SLA_m2.kg) | !is.na(d13C) | !is.na(totalN) | !is.na(totalC) ) |> dplyr::mutate(
    location_name = "Currency Creek Arboretum", taxon_name = stringr::str_squish(Taxonsimplified_DN),
    seed_provenance = stringr::str_squish(Provenance.x), accession_number = dplyr::if_else(
    grepl("^[0-9]+$", UniqueID), paste0("Dean Nicolle tree number ", UniqueID), NA_character_
    ), tree_number = paste0("Currency Creek Arboretum row ", Row, " tree ", Tree),
    individual_id = tree_number ) '
  collection_date: 2020-12
  taxon_name: taxon_name
  location_name: location_name
  individual_id: individual_id
  description: To determine whether drought sensitivity in eucalypts is associated
    with the climate of origin, whether climate of origin determines functional trait
    variation, and which functional traits best predict drought sensitivity, using
    trees grown in a common garden that experienced an extreme drought.
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: The Currency Creek Arboretum (CCA) is a eucalypt common garden
    arboretum located in South Australia (35°26′ S 138°46′ E) at 100 m above sea level.
    Climate is Mediterranean type with hot and dry summers, mean annual temperature
    of 15.8°C and mean annual precipitation of 456 mm; temperatures can reach 40°C
    in summer and drop to 2°C in winter with no occurrence of frost. Soil is sandy
    loam to loam (3–10 m depth) over clay or sandstone with a neutral pH. Since 1993,
    eucalypt seeds from 1919 sites (referred now on as provenances) including 1026
    species, subspecies and varieties (referred as taxa now on) were collected from
    natural stands across Australia, and specimen vouchers were deposited in the National
    Herbarium. Taxonomic names were matched to the Australian Plant Name Index (https://www.anbg.gov.au/apni/)
    and disagreements were resolved based on the classification of the eucalypts (Nicolle,
    2024). ^p From each provenance where seeds were collected, locality details and
    height of mother plant were recorded (Figure 1a). Each seed collection was made
    from a single mother tree. Seeds were propagated in a local nursery and subsequently
    established as tube stocks into the ground with four adjacent tree replicates
    along rows with 5 m spacing. Each year, new seed collections were planted into
    different blocks within the arboretum (Figure 1b) with each block containing a
    wide representation of climates (Figure S1). In total, 7869 trees were planted
    from 1993 to 2018 over an area of 32 ha. Tree age was categorized as young (2–10
    years old) and adult (14–27), based on the time to maturity of eucalypts. Note
    that at the time of the study, the arboretum lacked trees between 11 and 13 years
    old and trees older than 27 years old. ^p Temperature at the arboretum was estimated
    from the Bureau of Meteorology—Hindmarsh Island and Strathalbyn weather stations,
    located near the arboretum (8.8 km SE, and 27.6 km NW, respectively). Monthly
    temperature was estimated as the mean of the average maximum monthly temperature
    from both stations (www.bom.gov.au/climate/data). Monthly precipitation was collected
    at the arboretum with a manual rain gauge from 1994 to 2021. Mean annual temperatures
    in 2018 and 2019 were well above the average (by 0.76°C and 0.75°C, respectively)
    accompanied by low rainfall (annual totals 97 and 67 mm below long-term average,
    respectively; Figure 1c). ^p A subset of 224 provenances from 195 taxa growing
    in the arboretum was selected to represent eucalypts range of climate-origin and
    resprouting abilities. Only trees planted before 2003 (classified as adults) were
    sampled to control for tree age. To account for and control for phylogenetic effects,
    we restricted the selection to genus Eucalyptus, subgenus Symphyomyrtus, sections
    Adnataria, Maidenaria, Exsertaria, Dumaria, Glandulosae and Bisectae, all of which
    contained replicated taxa with contrasting climate-origins and life histories
    (Hill et al., 2001; Nicolle, 2024). ^p In December of 2020 (i.e. summer following
    the drought), middle canopy branches, sun exposed, when possible, with fully developed
    leaves were collected in the morning (8:00 AM to 12:00 PM) and kept in the dark
    at 4°C until processed in the laboratory within 3 days of collection. [...] ^p
    Most of the provenances sampled were represented by three individual trees. However,
    because some trees died after being drought-assessed, some provenances were only
    represented by two individuals (38 taxa). Trait values were averaged to provide
    an estimate for each provenance.
  original_file: CCAThornhillTraitsretrievedplussampling&ClimateFinal.csv, supplied
    by the authors together with DroughtAssessCategorical_allmerge_Climcorrected&MeanFT.csv,
    DroughtImpact_SummaryBy_Completetraits_Climcorrected.csv and Binomial_Continuous_AllCCA.csv
    (all in the raw folder)
  notes: data.csv is written by raw/extra_R_code_PerezMartinez_2025.R from CCAThornhillTraitsretrievedplussampling&ClimateFinal.csv,
    the arboretum's tree-level planting records (all 7869 trees) with the trait measurements
    for the 622 sampled trees. The other raw files are subsets and provenance-level
    summaries of the same data. 365 of the trees were sampled again for Britton_2026
    in winter and spring 2022, about 18 months later, and share identifiers with it;
    the values in the two datasets are separate measurements of the same trees. The
    data.csv file also includes the height of each provenance's seed parent tree in
    the field (MotherTreeHeight_AVG_m).
