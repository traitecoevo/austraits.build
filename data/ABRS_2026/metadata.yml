questions:
  question1: Elizabeth Wenk is listed as the data collector (she ran the extraction);
    the Flora of Australia profile authors are recorded per taxon in the profile_author
    column. Confirm this is the preferred attribution.
  question2: Parenthetical extremes (*_extreme_min / *_extreme_max) are not mapped.
    Should they be added as separate minimum / maximum records with a context (e.g.
    commonness_qualifier = rarely)?
  question3: bark_texture, seeds_per_fruit and leaf_count exist in traits.yml on the
    nutrients_physiology_2026-09 branch but not on this branch; map them once the
    branches are merged through develop.
  question4: 61 values fall outside the allowed ranges in traits.yml and are excluded
    at build, all apparently genuine flora values - flower_petal_length and flower_bract_length
    below 1 mm (tiny-flowered taxa), flower_tube_length below 0.1 cm, peduncle_length
    of 1.75-2 m (Tapeinochilos), plant_height_reproductive of 0.7 mm (Gaimardia scape),
    flower_style_length of 132-162 mm, and zero lower bounds from ranges such as "0-1
    mm". Consider widening the trait ranges.
  question5: leaf_glaucousness 'subglaucous' (13 taxa) and breeding_system 'cleistogamy'
    (2 taxa) are not allowed values and are excluded at build.
  question6: Hibbertia hypericoides subsp. hypericoides leaves are given in the source
    as "(6-) 10-5 (-25) mm long"; read as 10-15 mm (fixed in the script). Confirm against
    the printed Flora if possible.
  question7: Some ranges in the source are reversed or garbled (e.g. anther "072-0.76",
    "10.9-1.8", "1.6-1.1" mm; style "8-2", "6.2-1.2" mm; filament "3-0.5" mm; bract
    "1.5-1" mm). These were dropped rather than guessed; check the printed Flora if needed.
