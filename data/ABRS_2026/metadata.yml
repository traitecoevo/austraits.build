dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: '2026'
  taxon_name: taxon_name
  description: To compile plant trait values from the taxon descriptions in the Flora
    of Australia online, the national flora of Australia published by the Australian
    Biological Resources Study.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'Species, subspecies, variety and form profiles of the Flora
    of Australia online (profiles.ala.org.au/opus/foa) were downloaded, together with
    genus and family profiles. Trait values were extracted from the Description, Phenology,
    Ecology, Notes and Habitat text with a scripted parser (raw/build_data_csv.R):
    each description is split into sentences, clauses and comma-separated segments,
    each segment is assigned to the organ it describes (habit, stem, leaf, leaflet,
    inflorescence, flower, fruit, seed, ...), and categorical terms and measurements
    are read from the segments of the relevant organ. Categorical terms are mapped
    to AusTraits trait values, with the source terms kept verbatim in a matching *_description
    column; several values are listed in the order they appear in the text, and alternatives
    qualified by a commonness word (usually, rarely, sometimes ...) or a region are
    recorded on separate rows. Measurements record the typical range given in the
    description as minimum and maximum values; parenthetical extremes are kept in
    separate *_extreme_min / *_extreme_max columns. Where a profile describes several
    earlier treatments, the most recent is used. Categorical values stated as a single,
    unqualified value in a genus (or family) description, and not contradicted by
    any member taxon that describes the trait, are copied to member taxa whose own
    description is silent on that trait. Subspecies, varieties and forms whose own description
    is silent on a trait take the values (categorical and numeric) from the description
    of their species. Where the description names no growth form, palms and cycads are
    scored as palmoid, ferns as fern (fern palmoid when a trunk height is given), and
    sedges, grasses, rushes, restiads and Centrolepidaceae as graminoid herbs. Each family
    was checked against the source text after extraction, and source typographical errors
    were corrected in the script.'
  original_file: foa_profiles.csv (Flora of Australia online profiles, downloaded
    30 September 2026)
  notes: 'Families extracted so far (114): Acanthaceae, Achariaceae, Actinidiaceae,
    Agapanthaceae, Aizoaceae, Akaniaceae, Alismataceae, Alliaceae, Alseuosmiaceae,
    Alstroemeriaceae, Amaranthaceae, Amaryllidaceae, Anacardiaceae, Anarthriaceae,
    Annonaceae, Apiaceae, Apocynaceae, Apodanthaceae, Aponogetonaceae, Aquifoliaceae,
    Araceae, Araliaceae, Araucariaceae, Arecaceae, Argophyllaceae, Aristolochiaceae,
    Asparagaceae, Asphodelaceae, Aspleniaceae, Asteliaceae, Atherospermataceae,
    Austrobaileyaceae, Balanopaceae, Balanophoraceae, Balsaminaceae, Basellaceae,
    Bataceae, Berberidaceae, Berberidopsidaceae, Betulaceae, Bignoniaceae, Bixaceae,
    Blandfordiaceae, Blechnaceae, Boraginaceae, Boryaceae, Brassicaceae, Bromeliaceae,
    Burseraceae, Byblidaceae, Cabombaceae, Cactaceae, Calycanthaceae, Campanulaceae,
    Campynemataceae, Cannabaceae, Cannaceae, Capparaceae, Cardiopteridaceae,
    Caryophyllaceae, Casuarinaceae, Celastraceae, Centrolepidaceae, Cephalotaceae,
    Ceratophyllaceae, Chenopodiaceae, Chrysobalanaceae, Cistaceae, Cleomaceae,
    Clusiaceae, Colchicaceae, Combretaceae, Commelinaceae, Connaraceae, Convolvulaceae,
    Cornaceae, Corsiaceae, Corynocarpaceae, Costaceae, Cucurbitaceae, Cupressaceae,
    Cyatheaceae, Cycadaceae, Cymodoceaceae, Cyperaceae, Dasypogonaceae, Datiscaceae,
    Davalliaceae, Dennstaedtiaceae, Dichapetalaceae, Dicksoniaceae, Dilleniaceae,
    Dioscoreaceae, Dipteridaceae, Doryanthaceae, Droseraceae, Dryopteridaceae,
    Ecdeiocoleaceae, Elaeagnaceae, Elaeocarpaceae, Elatinaceae, Equisetaceae, Ericaceae,
    Eriocaulaceae, Euphorbiaceae, Eupomatiaceae, Fagaceae, Flagellariaceae,
    Frankeniaceae, Gelsemiaceae, Gentianaceae, Gesneriaceae, Gleicheniaceae,
    Goodeniaceae. Asteraceae and Fabaceae have not yet been extracted. Candidate traits in data.csv not yet in traits.yml (unmapped; about 400, mostly organ x character columns such as calyx_hairs, petal_count, ovary_shape) are listed with their coverage in raw/candidate_traits.csv, which the build script rewrites on every full build. Also unmapped: the parenthetical
    extremes (*_extreme_min, *_extreme_max), the verbatim *_description columns, and
    the organ-level text columns (habit_description, leaf_description, ...).'
