contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: flower_visitor identity
traits:
- var_in: plant_height (maximum) (cm)
  unit_in: cm
  trait_name: plant_height
  entity_type: species
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: 'Maximum vegetative height as stated in Material and methods, Study
    species (p.191): "Verticordia staminosa ssp. staminosa is a low, winter-flowering
    shrub to 30 cm tall."'
- var_in: plant_width (maximum) (m)
  unit_in: m
  trait_name: plant_width
  entity_type: species
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: 'Maximum canopy width as stated in Material and methods, Study species
    (p.191): "...with widely spreading branches forming a dense canopy up to
    1 m in diameter."'
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Growth form as stated in Material and methods, Study species (p.191):
    "Verticordia staminosa ssp. staminosa is a low, winter-flowering shrub..."'
- var_in: plant_growth_substrate
  unit_in: .na
  trait_name: plant_growth_substrate
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: As stated in Material and methods, the taxon "grows within cracks in outcropping
    granite," is "endemic to granite inselbergs," and "occupies a highly specific
    habitat, growing almost exclusively within cracks in the massive granite
    pavement."'
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Flower colour as stated in Material and methods, Study species (p.191):
    "The flowers are showy with 9-12-mm-long yellow staminal filaments (united
    for 2-3 mm) that become red with age, yellow anthers, yellow petals and sepals
    subtended by red persistent bracts." Recorded as the single dominant colour
    (yellow_orange); the secondary red colouring of ageing filaments and bracts
    is not captured by this trait.'
- var_in: flower_ovules_per_functional_carpel_count ({count})
  unit_in: '{count}'
  trait_name: flower_ovules_per_functional_carpel_count
  entity_type: species
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: 'Number of ovules per carpel as stated in Material and methods, Study
    species (p.191): "In V. staminosa ssp. staminosa the ovary is unilocular
    and contains two ovules." Usually only one ovule becomes a seed.'
- var_in: fruit_type
  unit_in: .na
  trait_name: fruit_type
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Fruit type as stated in Material and methods, Study species (p.191):
    "...usually only one ovule becomes a seed enclosed within an indehiscent
    nut-like fruit on which the sepals are retained."'
- var_in: fruit_dehiscence
  unit_in: .na
  trait_name: fruit_dehiscence
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Fruit dehiscence as stated in the same sentence as fruit_type (Material
    and methods, Study species, p.191) and Discussion (p.198), which also describes
    the fruit as "indehiscent."
- var_in: dispersal_unit
  unit_in: .na
  trait_name: dispersal_unit
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Dispersal unit as stated in Discussion (p.198): "In V. staminosa ssp.
    staminosa, the indehiscent fruits are passively dispersed from plants each
    year from late spring to summer."'
- var_in: dispersal_syndrome
  unit_in: .na
  trait_name: dispersal_syndrome
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Dispersal syndrome as stated in Discussion (p.198): "Fruits can either
    accumulate beneath plants and be incorporated into organic matter/litter
    or dispersed across the rock surface by wind and/or surface water flow."
    Recorded as both anemochory (wind) and hydrochory (surface water) as simultaneous
    values.'
- var_in: dispersal_appendage
  unit_in: .na
  trait_name: dispersal_appendage
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Dispersal appendage as stated in Discussion (p.198), citing Rye &
    James (1992): "the retention of the deeply divided sepals on the indehiscent
    fruit in Verticordia may have adaptive advantages for dispersal."'
- var_in: sex_type
  unit_in: .na
  trait_name: sex_type
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Plant sex type as stated in Discussion (p.197): "V. staminosa ssp.
    staminosa is hermaphroditic and is capable of self-fertilization."'
- var_in: flower_structural_sex_type
  unit_in: .na
  trait_name: flower_structural_sex_type
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Inferred from the same statement as sex_type (Discussion, p.197) that
    the species is hermaphroditic, with no separate male/female flowers mentioned
    anywhere in the source.
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  basis_of_record: field_experiment
  replicates: .na
  methods: 'Determined experimentally by hand self-, near-cross-, far-cross- and
    open-pollination treatments on tagged flowers, comparing pollen tube development
    and fruit/seed set among treatments (Material and methods, Breeding system,
    p.191-192; Results, Breeding system, p.192-194). Abstract (p.189): "The study
    species has a mixed mating system with similar rates of pollen tube development
    and fertilization observed in self-, cross- and open-pollinated flowers."
    Discussion (p.197) confirms the species "is capable of self-fertilization"
    and is "self-compatible," with no reduction in seed number under self-pollination
    relative to outcross/open pollination -- recorded as self-compatible, the
    matching AusTraits allowed value (AusTraits'' breeding_system vocabulary
    has no separate "mixed mating" value; see substitutions).'
- var_in: vegetative_reproduction_ability
  unit_in: .na
  trait_name: vegetative_reproduction_ability
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Vegetative reproduction as stated in Discussion (p.196): "new individuals
    in the population can arise vegetatively when the stem of an adult plant
    layers and there is subsequent decay or breakage of the connecting stem."
    Reported as rarely observed; recruitment of juveniles into the population
    was always from seeds (Results, p.196).'
- var_in: life_history
  unit_in: .na
  trait_name: life_history
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Not explicitly stated as "perennial" by the source; inferred (medium
    confidence) from the shrub growth form and from the low mortality of mature,
    tagged plants over the 3-year study reported in Discussion (p.196) -- "only
    four deaths in the 404 tagged plants recorded over the 3 years" -- in a taxon
    otherwise described (Abstract, p.189) as a "long-isolated, small population."
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Presence of nectar as stated in Results, Nectar production and flower
    visitors (p.194): "Flowers produced nectar at night that was not replenished
    during the day."'
- var_in: pollination_syndrome
  unit_in: .na
  trait_name: pollination_syndrome
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'Inferred pollination syndrome as stated in the Abstract (p.189) and
    Discussion (p.196): "Floral morphology, orientation and the concentration
    and volume of nectar produced suggest some degree of specialization associated
    with pollination by birds." Discussion (p.196) elaborates that the floral
    form (stamens/staminodes fused into a prominent tube), flower colour, and
    presentation hanging beneath branchlets suggests bird pollination, consistent
    with related Verticordia and Chrysoma-subgenus taxa lacking this species''
    unusual floral tube.'
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'Recorded as honeybee based on Abstract (p.189), Results (p.194) and
    Discussion (p.196-197): "feral honey bees were the most commonly observed
    flower visitor and they seem to have replaced honeyeaters as the primary
    pollinator" -- the introduced honey bee (Apis mellifera) was "observed foraging
    on nectar and contacting anthers and stigmas at all times during the day,
    accounting for more than 90% of observations" (Results, p.194 and p.197).
    Singing honeyeaters (bird) were also observed probing flowers in 3 of 63
    observation periods (5%), suggesting some ongoing bird pollination (see the
    separate pollination_syndrome and flower_visitor entries for that evidence).'
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'All animal taxa recorded visiting flowers during observation periods
    in nine subpopulations at peak flowering in 1999 and 2001 (Material and methods,
    Flower visitors and nectar production, p.192; Results, p.194 and p.197):
    the introduced honey bee (Apis mellifera), the moth Helicoverpa punctigera
    (F. Noctuidae, seen in 1999 only), and the singing honeyeater (Lichenostomus
    virescens, seen probing flowers in 3 of 63 observation periods). The three
    identities are recorded together on one row (space-delimited in flower_visitor,
    comma-delimited in the companion flower_visitor identity column) since all
    were recorded for the same taxon at its single population.'
- var_in: flower_count_maximum (median) ({count})
  unit_in: '{count}'
  trait_name: flower_count_maximum
  entity_type: population
  value_type: median
  basis_of_value: measurement
  replicates: '20'
  methods: 'At peak flowering in June 1999, flower production was estimated for
    20 tagged plants across five subpopulations by counting branchlets and mean
    flowers per branchlet (Material and methods, Rates of flowering, pollination
    and seed production, p.192-193). Results (p.194): "The median number of flowers
    per plant was 810 and the range 119-4968." Median/minimum/maximum describe
    the variation in per-plant flower count across these 20 tagged plants, not
    a single individual''s maximum.'
- var_in: flower_count_maximum (minimum) ({count})
  unit_in: '{count}'
  trait_name: flower_count_maximum
  entity_type: population
  value_type: minimum
  basis_of_value: measurement
  replicates: '20'
  methods: See flower_count_maximum (median) for full methods; this is the minimum
    of the range (119) reported for the same 20 tagged plants (Results, p.194).
- var_in: flower_count_maximum (maximum) ({count})
  unit_in: '{count}'
  trait_name: flower_count_maximum
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: '20'
  methods: See flower_count_maximum (median) for full methods; this is the maximum
    of the range (4968) reported for the same 20 tagged plants (Results, p.194).
- var_in: seed_count (median) ({count})
  unit_in: '{count}'
  trait_name: seed_count
  entity_type: population
  value_type: median
  basis_of_value: measurement
  replicates: '20'
  methods: 'Estimated per-plant seed production for the same 20 tagged plants
    used for flower_count_maximum, calculated as total flowers x proportion of
    fruit containing a viable seed (Material and methods, Rates of flowering,
    pollination and seed production, p.193, Eqn 2). Results (p.195): "the median
    seed production per plant was 360 and the range 56-2186." This was higher
    than for open-pollinated flowers in the controlled pollination experiment,
    probably because the sample represented the whole flowering season rather
    than the short time of the pollination experiment.'
- var_in: seed_count (minimum) ({count})
  unit_in: '{count}'
  trait_name: seed_count
  entity_type: population
  value_type: minimum
  basis_of_value: measurement
  replicates: '20'
  methods: See seed_count (median) for full methods; this is the minimum of the
    range (56) reported for the same 20 tagged plants (Results, p.195).
- var_in: seed_count (maximum) ({count})
  unit_in: '{count}'
  trait_name: seed_count
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: '20'
  methods: See seed_count (median) for full methods; this is the maximum of the
    range (2186) reported for the same 20 tagged plants (Results, p.195).
substitutions:
- trait_name: breeding_system
  find: mixed mating system
  replace: self-compatible mixed_mating_system
taxonomic_updates: .na
exclude_observations: .na
questions: .na
