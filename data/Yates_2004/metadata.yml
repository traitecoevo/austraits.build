  description: To determine the extent to which breeding system, pollinator interactions
    (including apparent replacement of bird by honey-bee pollination), and seed-based
    regeneration ecology constrain population growth in Verticordia staminosa ssp.
    staminosa, a rare shrub restricted to a single wild population on a granite
    outcrop.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The study area near Wongan Hills has a dry Mediterranean
    climate with cool wet winters and dry hot summers. The mean annual rainfall
    is 390 mm with rain falling predominantly between May and September. Annual
    rainfall may be highly variable and during the 3 years of the present study
    (1999-2001), 1999 was a year of exceptionally high rainfall (600 mm), whereas
    2000 was drier than average (342 mm). The mean maximum and minimum temperatures
    in the warmest month (January) are 34.4°C and 17.9°C, respectively, and in
    the coolest month (July) are 16.9°C and 6.7°C, respectively. In June 1999,
    19 plants distributed across six subpopulations were tagged. Within individual
    plants a branch with unopened flower buds was bagged with black insect mesh
    to exclude pollinators. Bagging of individual flowers was unnecessary as flowers
    were well separated and cross-contamination highly unlikely. When flowers
    began to open they were assigned to one of three treatments, self-pollination,
    cross-pollination with nearest neighbour, or cross-pollination with a distant
    plant (>10 m). Crossed flowers were emasculated prior to pollination. Pollen
    was applied by brushing freshly collected anthers across a stigma. In addition,
    flowers of the same plant outside the bag were selected as an open-pollination
    treatment. Similar numbers of flowers were assigned to treatments within each
    plant, but this varied among plants from 2 to 12 flowers depending on the
    number of flowers that were open and suitable for manipulation. Individual
    flowers within treatments were coded with small coloured beads on a thin
    copper wire looped around the peduncle. In three plants that had larger numbers
    of flowers available for manipulation, two to five flowers per treatment
    per plant were harvested into formaldehyde acetic acid alcohol (FAA) 24 h
    after pollination for analysis of pollen tube development. The styles were
    dissected from flowers and transferred into a 10% solution of NaOH for 48
    h. They were later rinsed in water for 30 min, soaked in the stain aniline
    blue (0.4% aniline blue in 0.1 mol L-1 potassium acetate) for a minimum of
    1 h (Dafni 1992) and then mounted on slides, pressed down and studied under
    a microscope. Pollen tubes fluoresced under ultraviolet light and the numbers
    at the stigma and base of the style were counted. The remaining flowers were
    harvested 2 months after pollination when fruits were well developed. Each
    fruit was dissected and the presence or absence of a healthy seed recorded.
    In June 1999, a preliminary survey of flower visitors and nectar production
    was undertaken in one of the larger subpopulations. On each of 3 days, censuses
    were made in the morning (09.00 hours), midday (13.00 hours) and evening
    (17.00 hours). The numbers of animals observed on flowers during random walks
    through the subpopulation over a 15-min period were used as an indicator
    of visitor abundance and activity. Animal activity at flowers was greatest
    at midday (13.00 hours) and subsequent observations were restricted to that
    period. Nectar measurements were made on five flowers from each of three
    plants in the same subpopulation. On 9 June 1999, flowers were sampled at
    17.00 hours and no nectar was found. Subsequently, flowers were bagged and
    nectar volume measured on 10 June at 09.30, 13.30 and 17.00 hours and on
    11 June at 08.30 hours. In addition, the percentage sucrose concentration
    of nectar was measured with a Bellingham and Stanley hand-held refractometer.
    The identity and number of flower visitors were recorded in nine subpopulations
    during peak flowering in 1999 and 2001. In each subpopulation, individual
    plants were observed for periods of 15 min on each of 3 days in 1999 and
    4 days in 2001. The effect of subpopulation size on flower-visitor abundance
    was analysed with a one-way ANOVA. Data from 1999 and 2001 were pooled and
    square-root transformed to stabilize variances. Post-hoc comparisons of means
    were undertaken with Tukey tests with a family error rate of 0.05 (Zar 1984).
    Untransformed means are presented for ease of interpretation. At peak flowering
    in June 1999, flower production was estimated for tagged plants (n = 20)
    in five of the nine subpopulations for which size-class structure and demography
    were also being measured. Within each plant, the number of similar sized
    branchlets in the canopy were counted and five branchlets were randomly chosen
    and the number of flowers on each counted. The total number of flowers for
    each plant was calculated using the following formula, Total no. flowers
    = No. branchlets x Mean no. flowers per branchlet (1). The relationship between
    the total number of flowers per plant and plant canopy area (calculated as
    an ellipse) was examined with linear regression (Zar 1984). At peak flowering
    in June 1999, 2000 and 2001, five flowers were harvested from each tagged
    plant, immediately fixed in FAA and styles subsequently treated for assessing
    pollen tube development in the stigma and at the base of the style. In November
    1999, 2000 and 2001, when fruits had matured but before they were dispersed,
    50 fruits were harvested from each tagged plant. Fruits were sectioned and
    the presence of viable seeds recorded. A seed was considered viable if it
    contained a swollen, moist, white embryo. For each plant, the proportion
    of fruits containing a viable seed was calculated. The effect of subpopulation
    and year and the interaction between subpopulation and year on the number
    of pollen tubes in the stigma, pollen tubes at the base of the style and
    proportion of fruit with seed were analysed with repeated measures ANOVA
    using mean values for each plant as replicates. Underlying assumptions of
    normality and equality of variance in the models were checked with residual
    plots and no transformations were necessary (Zar 1984). Estimates of seed
    production from the 1999 flowering were made for individual plants (n = 20)
    in the five subpopulations where total flower production had been estimated
    using the following formula, Total no. seeds produced per plant = Total no.
    flowers x Proportion of fruit that contain a seed (2). A census was taken
    of the entire population and the number of individuals in subpopulations
    counted. The life stage, size and canopy characteristics of individual plants
    in six subpopulations were described during peak flowering in 1999, 2000
    and 2001. Plants were labelled with numbered aluminium tags, their life stage
    recorded (juvenile or reproductive) and canopy diameters at the widest point
    and at right angles to this were measured. For each subpopulation, the number
    of juveniles, reproductive and non-reproductive senescing adult plants within
    canopy diameter classes were calculated. Plant densities in the medium and
    large subpopulations were determined using the T-square method (Krebs 1999).
    In 1999, 2000 and 2001 at the end of the winter wet season, searches were
    made for seedlings in each subpopulation. Seedlings began to die with the
    onset of the summer drought, but both dead and living seedlings were easily
    recognizable. When a seedling was encountered, its status (living or dead)
    and habitat position (on moss mats or mineral soil in shallow depressions
    on the surface of the granite, or in cracks in the rock) were recorded. Living
    seedlings were marked with plastic cocktail sticks and their survival was
    monitored in subsequent years. The density and width of cracks in the granite
    varies. Seedlings were seen to establish in cracks as narrow as 1 mm, but
    in all cases cracks were never deep enough to shade seedlings to any significant
    extent. For each of the nine subpopulations, two 10-m transects, one running
    north-south and the other east-west, were centred on the most centrally located
    V. staminosa ssp. staminosa plant. Ten 1-m2 quadrats were positioned alternately
    on either side of each transect, and the total length of rock cracks was
    measured. The relationship between mean crack length and subpopulation size
    was examined with linear regression (Zar 1984).
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: Traits not in AusTraits, floral_dichogamy, autogamous_self_pollination,
    flower_nectar_volume, flower_nectar_sugar_concentration, flower_visitor_abundance,
    proportion_fruit_with_viable_seed, subpopulation_size_class_proportion, plant_population_density,
    plant_mortality_rate, seedling_emergence_timing, seedling_survival_proportion,
    seedling_count_surviving.
