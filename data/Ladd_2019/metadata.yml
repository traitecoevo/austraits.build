  unit_in: unit
  trait_name: flower_anther_dehiscence
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Inferred from anther and pollen-release morphology.
- var_in: flower_pollinator_reward
  unit_in: unit
  trait_name: flower_pollinator_reward
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Flowers produce no nectar; pollen is the reward extracted by bees sonicating
    or raking the poricidal anthers.
- var_in: flower_ovules_per_functional_carpel_count
  unit_in: unit
  trait_name: flower_ovules_per_functional_carpel_count
  value_type: value_type
  basis_of_value: measurement
  replicates: .na
  methods: Based on flower description in methods/results.
- var_in: pollination_vector_known
  unit_in: unit
  trait_name: pollination_vector_known
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Buzz pollination by native bees assessed by field observation of bee
    visitation/sonication behaviour and by capturing bees at flowers and examining
    their pollen loads (washed in glycerol, identified and counted; Methods, Observations
    and collection of bees, p.250; Results, Table 2, p.251). For T. paynterae subsp.
    paynterae this rests on direct pollen-load evidence; for the other three taxa
    it rests on the paper's general Abstract/Introduction statement and the Methods'
    generalisation of floral morphology and bee behaviour across the four taxa,
    not on taxon-specific pollen-load data (see measurement_remarks).
- var_in: pollination_vector_possible
  unit_in: unit
  trait_name: pollination_vector_possible
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Insects captured on T. paynterae subsp. paynterae flowers in October
    2010 and examined for pollen loads (washed in a small amount of glycerol, pollen
    counted to a maximum of 500 grains and identified; Methods, Observations and
    collection of bees, p.250; Results, Table 2, p.251).
