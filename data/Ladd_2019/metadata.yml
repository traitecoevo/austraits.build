  custom_R_code: '
    data |>
      dplyr::mutate(
        collection_date = ifelse(collection_date == "unknown", "2003/2011", collection_date)
      ) |>
      generate_observation_numbers(taxon_name, trait, location_name)
  '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  entity_type: entity_type
  description: Pollination ecology, bee-visitor community, buzz pollination and rates
    of pollination of four rare Tetratheca (Elaeocarpaceae) taxa restricted to isolated
    Banded Iron Formation ranges in semi-arid south-west Western Australia.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: Study species and area ^p The BIFs occur as ranges of iron-rich erosion-
    resistant rocks in a relatively at landscape of Archean granites and gneisses.
    The upper parts of the range consist of massive ironstone that provides the
    habitat for the Tetratheca species. The rock is extensively fractured and the
    ssures and soil and moisture- collecting depressions provide the locations for
    plant establishment (Yates et al. 2011). ^p The area has a semiarid
    Mediterranean-type climate with a rainfall from 270 to 290 mm annually, most
    reliable rainfall falling in winter but with highly variable (mean 50 mm),
    occasional rainfall across the summer months (Yates et al. 2011). Weather data
    for the periods of the study at Windarling were provided from the Cliffs Mine
    weather station. The BIF Tetratheca species can ower at any time of the year
    following substantial rain, but the main owering period is at the end of the
    winter wet season when rainfall is most reliable in August to October (Yates
    et al. 2008). The following description is relevant for all taxa. Flowers of
    T. paynterae subsp. paynterae are pendulous and open for at least 3 days, and
    usually longer, and stay open overnight. The owers do not produce nectar, and
    pollen is held within tubular porocidal anthers that form a ring surrounding
    the ower style. Pollen is extracted from the anthers either by native bees
    sonicating and vibrating pollen loose from the anthers or by raking the
    anthers with their front legs (McNee 2003). Bees alight on the owers and grasp
    the anthers to vibrate them. The style protrudes from the centre of the anther
    ring and the stigma touches the bee’s thorax at the same point where pollen is
    deposited after the sonication. Pollen collected by the bees is stored on leg
    and abdominal hairs but is transferred between owers if bees contact the
    stigma, which is highly likely due to the arrangement of the anther ring and
    stigma. Floral morphology and bee behaviour at owers are similar for the four
    taxa. Bees are most active on warm (>22 C) days when winds are light to
    moderate (0.25–5.26 m s–1) (McNee 2003). ^p Observations and collection of
    bees ^p
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: Data for pollen_grains_per_stigma, proportion_styles_without_pollen_tubes, stigma_anther_pore_distance,
    bee_visit_frequency, bee_flowers_visited_per_plant_single_visit, bee_visits_outer_canopy_proportion
    and buzz_pollination are also available in this paper
