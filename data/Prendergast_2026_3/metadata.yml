  collection_date: Date
  taxon_name: Plant scientific name
  location_name: location_name
  source_id: source_id
  measurement_remarks: Reference
  description: To compile documented plant-flower visitor interactions for Australian
    Acacia species.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: This is a literature/database compilation, drawing together diverse pollination_vector_possible observations for Acacia specifically, including systematic Google Scholar and Flickr searches per Acacia species with paired insect observations, native bee taxonomic papers recording host plants, and the WA Museum''s entomological specimen database.
  original_file: data.csv holds the subset of rows from the full database that arent separately entered into AusTraits under their own dataset_id.
  notes: WAMuseum_2025 (a museum specimen database wiht rows flagged in the raw Observation type column
    as pollen-grain-only (P) or DNA-based (D) identification, based on how the identification was made. Only references that contribute >50 observations are individually included; a complete list of references
    is retained within measurement remarks.
identifiers: .na
locations: locations.csv
contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: Pollinator taxon name
- context_property: pollinator count
  category: treatment_context
  var_in: No. of visitors
traits:
- var_in: Pollinator match value
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Compiled from field observations, museum and herbarium specimen records,
    and unpublished survey/thesis records across many original sources. Contact with the flowers reproductive
    structures and pollen transfer are not confirmed for the great majority of records,
    so these are treated as possible rather than known pollen vectors.
