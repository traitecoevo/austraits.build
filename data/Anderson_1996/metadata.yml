  description: To determine whether intrinsic water-use efficiency, as indexed by
    carbon isotope discrimination, and other leaf attributes of Eucalyptus species
    grown in a common garden are related to the climate of their native habitats.
  basis_of_record: captive_cultivated
  life_stage: sapling
  sampling_strategy: In September 1991, seedlings of 34 species of Eucalyptus were
    planted at Wagga Wagga, NSW, as part of the CSIRO Wagga Effluent Plantation Project.
    The overall project consists of 4.5 ha of irrigated plantations on an improved
    pasture site adjacent to a sewerage treatment works. Plantation soils are red
    and yellow podzolic duplex profiles with well-drained sandy loams overlying medium
    to sandy clays. The mean annual rainfall of 570 mm has a more or less uniform
    seasonal distribution. Annual pan evaporation is 1860 mm and is strongly seasonal,
    with monthly means ranging from a low of 35 mm in June-July to a high of 320 mm
    in January (B. Myers, CSIRO Division of Forestry, personal communication.) For
    convenience, we use the term 'Wagga' to refer to the location of the common garden.
    ^p Seedlings were raised in a nursery by the NSW Forestry Commission at Dubbo,
    NSW, from seeds provided by the Tree Seed Centre, CSIRO Division of Forestry.
    Six seedlings of each species/provenance were planted in a randomly-selected 4-m
    by 5-m cell in each of three replicate blocks. The plants were irrigated with
    secondary effluent applied with a micro-sprinkler system at a rate sufficient
    to offset measured evapotranspiration. ^p On 1 April 1992, we sampled leaf tissues
    for carbon isotope and nutrient (NPK) analyses from 17 provenances of 14 species
    of Eucalyptus in the Wagga plantation. We chose species representing a broad range
    of climates at their habitats of origin (Table 1). To assess intraspecific variability,
    three provenances of Eucalyptus camaldulensis and two provenances of Eucalyptus
    grandis were included. The five tallest of the six replicate plants in each of
    the three blocks were sampled.
  original_file: Table 1 of Anderson et al. (1996), transcribed into raw/trait_data.csv
  notes: data.csv is a copy of raw/trait_data.csv, transcribed from Table 1, plus
    raw/location_data.csv. Table 1 gives carbon isotope discrimination D; leaf δ13C
    is back-calculated with the δ13C of air of -7.8 per mil stated in Methods, and
    the original D values and their standard errors are kept in trait_value_raw and
    error_value. Seed provenance coordinates, annual precipitation and potential evaporation
    (ESOCLIM) are in data.csv; the coordinates are given in the seed provenance context
    descriptions. Leaf mass per area and leaf N per unit area were measured for the
    12 non-phreatophytic populations but are shown only in Fig. 5, with unlabelled
    points; leaf P and K were analysed but not reported.
