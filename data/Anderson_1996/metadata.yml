traits:
- var_in: leaf_delta13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 15
  methods: For carbon isotope analyses, we collected approximately 10 of the youngest
    currently expanding leaves from each plant. These were combined, dried, and ground
    with a mortar and pestle as a composite sample for each plant. Abundances of stable
    isotopes of carbon in combusted samples were measured as described by Wright et
    al. (1988) using a VG Isomass 1108 ratioing mass spectrometer. The isotope composition
    of the air relative to PeeDee Belemnite (δ13Cair) was -7.8‰. [...] The planting
    block effect was insignificant for all parameters analysed (P >> 0.05). Thus,
    samples from the three blocks were pooled and means of all 15 replicates were
    used in all correlation analyses. ^p Leaf δ13C as the mean of 15 plants, calculated
    from the reported discrimination values with the same δ13C of air.
