contexts:
- context_property: sampling season
  category: temporal_context
  var_in: season
  values:
  - find: aut
    value: autumn
  - find: spr
    value: spring
  - find: sum
    value: summer
  - find: win
    value: winter
- context_property: time of day
  category: temporal_context
  var_in: Time
- context_property: floral visitor behaviour
  category: entity_context
  var_in: Behaviour
  values:
  - find: Hov
    value: hover
    description: Floral visitor hovers above the flower.
  - find: Vis
    value: visits
    description: Floral visitor hovers lands on the flower.
- context_property: scientific name of floral visitor
  category: entity_context
  var_in: pollinator.genus_species
- context_property: number of visits by floral
  category: treatment_context
  var_in: freq
