dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(
        plant.genus_species = stringr::str_replace(plant.genus_species, "_", " "),
        site = paste0("site_", site),
        Date = lubridate::dmy(Date),
        Time = lubridate::hm(`Survey time`),
        flower_pollinator_possible = pollinator.common
      )
  '
  collection_date: Date
  taxon_name: plant.genus_species
  location_name: site
  description: A study that investigated the seasonal use of floral resources by honey
    bees and native hover flies (Melangyna indet.) in urban greenspaces of varying
    urbanization levels in Sydney, Australia due to concerns about the impacts of
    introduced honey bees (Apis mellifera L.) on native insects and pollination services
    are prevalent.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Sample Design and Site Selection ^p This study was conducted
    within Sydney, Australia, which has a human population of 5.2 million people (Australian
    Bureau of Statistics 2021), and a humid subtropical climate (Köppen classification
    system) characterized by mild winters and hot summers (Kottek et al. 2006). ^p  We
    randomly selected 6 quadrats in each of 5 urbanization levels, resulting in a
    total of 30 quadrats (Supplementary Fig. S1). We chose one urban greenspace with
    an area between 0.5 and 118 ha within each quadrat, for a total of 30 sampling
    sites. To generate the 5 urbanization levels, we estimated the human population
    density by using the 'ABS Census of Population and Housing Mesh Block Counts'
    digital map layer (ABS 2016), which provides information related to the resident
    population and dwelling counts from the 2016 Australian population census. We
    projected this layer onto the Map Grid of Australia 1994 (MGA94) in QGIS (QGIS
    Development Team 2021) and generated a human population density heatmap of Sydney
    using a grid of square quadrats measuring 0.01 Decimal Degrees (DD) by 0.01 DD
    (0.0001 DD2 quadrats), overlaid on the metropolitan area of Sydney.^p We calculated
    the relative population density per cell by dividing the absolute population density
    of each quadrat by the population of the most densely populated quadrat (2,533
    persons). Finally, we used the Jenks natural breaks optimization method in QGIS
    3.14 (n = 5 bins, μ = 5.5, sigma = 15.5) (QGIS Development Team 2021) to divide
    the population density scores into 5 categories of relative human population density.
    We used these 5 categories of relative human population density as a proxy for
    urbanization levels. ^p On the initial visit to each site, we established a 100-m
    sampling transect by following walking paths when available. For sites without
    paths, we defined the 100-m transect as the transitable path adjacent to the most
    vegetated area. Subsequently, we surveyed the interactions of honey bees and hover
    flies with plants along each transect. ^p Honey Bee and Hover Fly Survey ^p We
    conducted visits to each of the 30 sites, one in each season from winter 2019
    until autumn 2020. Sampling of honey bees and hover flies was conducted between
    9:00 AM and 6:00 PM on week days with favorable conditions (ie sunny or partly
    cloudy days, winds below 30 km/h, chance of rain below 50%, and a minimum daytime
    temperature above 10 °C). Visits to sites were randomized spatially and temporally
    during the 3-month period of each season, so that a maximum of 2 sites were visited
    per day per season. During a 20-min walk along a 100-m transect, we recorded all
    interactions between insects and plants within 2.5 m of the transect line. An
    interaction between an insect and a plant was defined by either an insect making
    contact with the plant (flowers and vegetative parts) or by hover flies hovering
    immediately above the plant at a distance ≤10 cm for more than 2 s. We identified
    the plant species in situ, or by photographing specimens if not identifiable in
    the field. The New South Wales Flora Online system (PlantNET 2021) was used to
    identify all plants to the species level. Insects were captured with a sweep net
    and each specimen was transferred to an individual vial. The timer was paused
    between the time the insect was first seen and the time it was secured in the
    vial and notes on the interaction were taken, at which time the insect survey
    and the timer were resumed. If the insect escaped and could not be identified
    in situ, a morphological description of the specimen was produced and recorded.
    ^p We identified all collected hover flies to species level, except for 3 specimens
    whose genera could not be determined and were treated as “morphospecies”. Specimens
    were identified with the help of Andrew Young and by using a series of dichotomous
    keys that were compiled and/or rewritten by F. Christian Thompson, which are not
    published, but widely circulated (Thompson 2011). Overall, 16 species of hover
    flies were identified, but 15 of these species of hover flies had too few interactions,
    so they were excluded from the analyses. Only honey bees and hover flies within
    the genus Melangyna were used in the analyses. However, we could not identify
    hover flies within the genus Melangyna indet. to the species level, because this
    entire genus is a complex consisting of at least 4 subgenera (Vockeroth 1969)
    whose phylogenetic relationships remain unresolved, indicating a need for taxonomic
    revision (Mengual et al. 2023). Therefore, the 3 species within the genus Melangyna
    (subgenus Austrosyphus) with potential to occur in the study area (M. collatus
    Walker; M. jacksoni Bigot; and M. viridiceps Macquart) are treated as Melangyna
    indet. throughout this paper. All specimens were pinned and are currently housed
    at our university (Table 1).
  original_file: FloralVisitorsOfSydneysUGS.csv
  notes: Testing new trait definitions following pollination workshop - should hovering
    insects be categorised as a separate trait?
