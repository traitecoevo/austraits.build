  description: To examine whether stable carbon and nitrogen isotope signatures in
    soil and vegetation are consistent with the landscape processes thought to maintain
    banded mulga (Acacia aneura) ecosystems, in which perennial groves and sparser
    intergroves alternate across the landscape.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Study site ^p Samples were collected in September 1999 from banded
    mulga vegetation within Kunoth Paddock (c. 23 deg 30' S 133 deg 37' E) on Hamilton
    Downs Station to the north-west of Alice Springs, Northern Territory (Low 1978)
    (Figure 1). The site has a gentle slope of 1 in 300 to 1 in 450 with a north-north-westerly
    aspect, and has an elevation of about 700 m (Australian Height Datum). Typically
    in banded mulga, the intergroves slope gently between almost flat groves giving
    alternating zones of water runoff and runon (Anderson and Hodgkinson 1997; Tongway
    and Ludwig 1990). Median rainfall of Kunoth Paddock is 286 mm with about 73% of
    the mean annual rainfall falling from October to March. At the time of sampling,
    Hamilton Downs Station had received 230 mm for the preceding year (Clewett et
    al. 2003). Samples were collected from three replicate mulga groves and three
    intergroves in sequence on each of two soil types (Figure 2). The intergrove spacing
    was approximately 50 m. Vegetation on the sandy clay loam soil was characterised
    by the presence of woollybutt grass Eragrostis eriopoda, a perennial species that
    grew in both the groves and intergroves. On the sandy loam soil, perennial grasses
    were absent from the intergroves, and occasional desert bloodwood trees Corymbia
    opaca occurred within the mulga groves. ^p Sampling ^p  We also collected fresh
    leaves and leaf litter from mulga A. aneura within the groves and from isolated
    trees in the intergroves. Fresh leaves and litter from the occasional desert bloodwood
    trees within the groves on the sandy loam soil were also sampled. The fresh mulga
    and bloodwood leaf samples consisted of bulked grab samples of leaves from the
    outside edge of the canopy from one tree in each replicate. Three replicates were
    collected for all samples except for all mulga trees in intergroves on the sandy
    loam soil for which only two replicates could be collected. On return to the laboratory,
    vegetation samples were dried at c. 70 deg C for 48 h prior to grinding for chemical
    analysis.
  original_file: data transcribed from Table 2 in manuscript; raw/trait_data.csv includes
    all study data.
  notes: none
