traits:
- var_in: d13C_permil
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Samples were analysed for carbon and nitrogen concentrations and delta13C
    and delta15N values using the methods reported in Cook (2001) and Bowman and Cook
    (2002). Briefly, measurements were made by coupling a preparation system employing
    the Dumas principle with a stable isotope mass spectrometer detector, allowing
    measurement of total nitrogen and carbon and also 15N or 13C levels. The samples
    were analysed using a Europa 20-20 isotope ratio mass spectrometer with an automated
    nitrogen and carbon analysis (ANCA) preparation system. In a batch of samples,
    every eighth sample was a reference to correct for any drift in the instrument.
