contexts: .na
traits:
- var_in: SLA_mean
  unit_in: m2/kg
  trait_name: leaf_mass_per_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 5
  methods: Morphological traits were measured only for WW plants at the end of the
    experiment using standardised protocols (Perez-Harguindeguy et al. 2016). [...]
    SLA (leaf area per unit leaf dry mass; m2 kg−1 leaf) was determined for three
    youngest fully expanded leaves for each plant using individual leaf area measured
    using ImageJ (version 1.52a; Wayne Rasband, National Institutes of Health, USA)
    and the dry mass of sampled leaves. Where present, the petiole was included in
    SLA measurements.
- var_in: RMF_mean
  unit_in: g/g
  trait_name: root_mass_fraction
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 5
  methods: Morphological traits were measured only for WW plants at the end of the
    experiment using standardised protocols (Perez-Harguindeguy et al. 2016). Shoot
    dry weight included above-ground stems and leaves and was recorded after drying
    in an 80 °C oven until constant mass. [...] Roots were washed free of soil and
    weighed before storing in 1-L plastic containers filled with 50% ethanol and stored
    at 4 - 5 °C to preserve them for root-scanning. [...] All root samples were then
    oven-dried at 80 °C until constant mass to calculate SRL (total root length per
    unit root dry mass; m g-1 root) (n = 3) for scanned samples and RMF (root dry
    mass per unit total plant dry mass; g g-1) (n=5).
- var_in: SRL_mean
  unit_in: m/g
  trait_name: root_specific_root_length
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Morphological traits were measured only for WW plants at the end of the
    experiment using standardised protocols (Perez-Harguindeguy et al. 2016). [...]
    Roots were washed free of soil and weighed before storing in 1-L plastic containers
    filled with 50% ethanol and stored at 4 - 5 °C to preserve them for root-scanning.
    Three replicates of washed roots were scanned at 2400 dpi to determine root length
    using WinRHIZO (version 2016; Regent Instruments Inc., Quebec, QC, Canada). All
    root samples were then oven-dried at 80 °C until constant mass to calculate SRL
    (total root length per unit root dry mass; m g-1 root) (n = 3) for scanned samples
    and RMF (root dry mass per unit total plant dry mass; g g-1) (n=5).
