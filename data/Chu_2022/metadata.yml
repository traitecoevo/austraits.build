dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2019-03/2019-05
  taxon_name: species
  location_name: location_name
  description: A glasshouse experiment testing whether fast-slow above- and below-ground
    plant traits predict water use and drought resistance, to help select green roof
    plants that maximise rainfall retention without jeopardising drought survival.
  basis_of_record: lab
  life_stage: sapling
  sampling_strategy: We selected 14 species (mostly C3 plants) used in Mediterranean-type
    climate green roofs based on their SLA to represent a gradient of 'fast-slow'
    plants (Table 1). Plants with C3 photosynthetic pathway are better suited in Mediterranean-type
    climates with wet winters and less annual rainfall (Gurevitch et al. 2006). However,
    C3 plants have lower instantaneous water-use efficiency compared to C4 and CAM
    plants (Gurevitch et al. 2006), i.e. C3 plants gain less carbon for every unit
    of water used in photosynthesis. SLA data were obtained from the TRY Plant Trait
    Database (Kattge et al. 2020). Fifteen plants of each species were obtained as
    six-month old seedlings from local nurseries. In early December (summer) 2018,
    the seedlings were potted into 4-L black plastic pots (200 mm diameter, 190 mm
    height), containing 3 kg of a scoria-based green roof substrate (60% scoria 8
    mm minus, 20% 7 mm scoria aggregate, 20% composted coir; water-holding capacity
    (WHC) = 45.9%; air-filled porosity (AFP) = 13.8%; bulk density = 1.26 g cm-3
    (Farrell et al. 2012)) that is designed based on the FLL (2008) guideline recommendations
    for extensive green roofs. The substrate design is commonly used on Australian
    green roofs as the components are readily available with minimal variation in
    composition and properties (Conn et al. 2020). After potting, 12 grams of low-phosphorous
    slow-release fertiliser (14 N:1.3P:14.9K, Osmocote Pro, Scotts Australia Pty
    Ltd.) was applied evenly to the surface of each pot. For the next two months,
    plants were grown outdoors and watered by automated sprinklers for 7 minutes twice
    daily (06:45 and 13:45 h). ^p The experiment took place at the Burnley Campus,
    University of Melbourne, Australia (37°47′ S; 144°58′ E). In mid-February (summer)
    2019, plants were moved into a glasshouse, with daily temperatures ranging from
    8.5 to 28.6 °C and an average temperature of 17.5 °C during the experiment. This
    temperature range was on average lower than that of green roof surfaces in Melbourne,
    which have been shown to range from 15 to 65 °C from summer to winter, with average
    maximum temperatures in summer reaching up to 35 °C (Rayner et al. 2016). All
    plants were watered to pot-capacity three times a week until the start of the
    experiment. The experiment ran for 72 days, from 20th March to 31st May (autumn)
    2019. Three plants of each species were harvested before the watering treatments
    began to determine initial plant mass. Their mean initial biomass was assumed
    to be representative of their species in the treatment blocks for calculation
    of soil water content (SWC). Plants were arranged in a complete randomised block
    design with five blocks. Each block comprised 28 plants; each species had one
    pair of similar-sized plants randomly assigned to either well-watered (WW) or
    water-deficit (WD) treatments. All pots were weighed before each watering session,
    and pots that were watered were weighed again after pots drained (45 minutes after
    watering) to determine evapotranspiration (ET). Throughout the experiment, WW
    plants were watered to pot-capacity three times a week (Monday, Wednesday, and
    Friday). For the first 42 days of the experiment, WD plants were watered on the
    same day as WW plants, but only when their gravimetric SWC was below 20%, to gradually
    induce drought stress. Water-deficit plants received their final watering on day
    42 and were then left to dry-down. During the dry-down phase, ET and midday water
    potential (PsiMD) of all plants were measured daily until stomatal closure (when
    ET of WD was < 20% of WW plants) (Somerville et al. 2019) (see Appendix S1, Figure
    S1 for figures showing the relationship between PsiMD and SWC for each species).
    WW and WD plants were harvested in replicate pairs, based on the dry-down rate
    of WD plants. Final plant biomass (shoot and root), SLA, SRL were measured during
    the final harvest for WW plants only.
  original_file: data downloaded from figshare (doi.org/10.26188/5ebce2c3c57bd)
  notes: Daily evapotranspiration
    per pot and per unit shoot dry weight under well-watered conditions, and days
    to stomatal closure, cumulative evapotranspiration until stomatal closure and
    the degree of iso-anisohydry (difference in midday leaf water potential between
    well-watered and water-deficit plants) during dry-down and shoot biomass exist in the data.csv file
    but do not match current traits.
