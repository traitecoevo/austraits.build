dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      filter(!str_detect(trait_value, "\\(")) |>
      mutate(unit = case_when(
        unit == "feet" ~ "ft",
        unit == "foot" ~ "ft",
        unit == "inch" ~ "in",
        unit == "inches" ~ "in",
        unit == "cn" ~ "cm",
        unit == "xm" ~ "m",
        unit == "jugate" ~ "{count} [jugate]",
        unit == "leaflets" ~ "{count}",
        unit == "foliate" ~ "{count}",
        unit == "segments" ~ "{count} [segments]",
        TRUE ~ unit
      )) |>
      mutate(
        trait_value = ifelse(trait_name == "plant_growth_form", 
          str_replace_all(trait_value, "mallett", "mallee"), trait_value),
        trait_value = ifelse(trait_name == "woodiness_detailed", 
          str_replace_all(trait_value, "soft_woody", "semi_woody"), trait_value),
        trait_value = ifelse(trait_name == "stem_branching_form", 
          str_replace_all(trait_value, "umbrageous", "spreading"), trait_value),
        trait_value = ifelse(trait_name %in% c("stem_growth_habit", "leaf_shape"), 
          str_replace_all(trait_value, "sub-", ""), trait_value), 
        trait_value = ifelse(trait_name %in% c("stem_growth_habit", "leaf_shape") & !str_detect(trait_value, "submerged") & !str_detect(trait_value, "subterranean") & !str_detect(trait_value, "subulate"), 
          str_replace_all(trait_value, "sub", ""), trait_value), 
        trait_value = ifelse(trait_name %in% c("stem_growth_habit", "leaf_shape"), 
          str_replace_all(trait_value, "semi-", ""), trait_value),
        trait_value = ifelse(trait_name %in% c("stem_growth_habit", "leaf_shape"), 
          str_replace_all(trait_value, "semi", ""), trait_value)
      )
  '
  collection_date: 2025-08/2026-02
  taxon_name: taxon_name
  trait_name: trait_name
  value: trait_value
  description: Gap-filling plant height and leaf dimension values from floras and the taxonomic literature to create a near-complete trait layer for Australian plant species.
  basis_of_record: literature
  life_stage: adult
  measurement_remarks: reference
  sampling_strategy: Combination of AI and manual scoring from online floras and taxonomic descriptions.
  original_file: unknown
  notes: unknown
