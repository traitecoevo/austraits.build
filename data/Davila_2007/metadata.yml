questions:
  question1: In the 2004 spreadsheet, one of the columns is `Mosquito fly`; does this mean an uncertainty if a flower visitor is a mosquito or fly or is this a specific type of insect? (it has currently been mapped to mosquito). Similarly, the header `Native bee (Colletidae, Halictidae)` was mapped to `colletidae sweat_bee` (as in both were observed), but perhaps they should be mapped to the broader `bee` category instead?
