  sampling_strategy: 'Study species ^p Trachymene incisa ssp. incisa Rudge (Apiaceae) is a common perennial herb endemic to eastern Australia, with a large latitudinal range from Fraser Island, Queensland, south to Ulladulla and inland to the Nandewar Range near Narrabri, NSW (Powell 1992; Hart & Henwood 2006). It grows on infertile sandy soils in dry eucalypt woodland or scrub and in crevices of granite outcrops (Benson & McDougall 1993). ^p There are approximately 72 flowers per inflorescence, arranged in simple umbels (Davila 1999; Davila & Wardle 2002). Each flower has five white petals, five stamens and two equally sized carpels (bilocular) each of which are connected to an elongated style at female anthesis (Hart & Henwood 2006). The flowers open centripetally within the umbel (Davila & Wardle 2002). Within the completely protandrous flowers, the anthers dehisce sequentially while the styles remain curled and non-receptive, and after the anthers are spent the flower enters a quiescent phase. The female phase occurs when the styles have elongated and stigmas are receptive and begins after all flowers within the umbel have entered the quiescent phase (Davila & Wardle 2002). Therefore, whole umbels function as either male (pollen presenting, approximately 16 days) or female (pollen receptive, approximately 4 days), which prevents self-pollination within the umbel (Davila 1999; Davila & Wardle 2002). Nectar is present in open flowers that are functioning as either male or female, but not during the quiescent phase (Davila & Wardle 2002). Umbels develop sequentially on a floral stalk with the secondary umbels branching off the floral stalk of the terminal primary umbel, and the tertiary umbels branching off the floral stalk of the secondary umbels and so forth. Therefore, male and female phase umbels are usually present on the same plant at the same time (hemi-synchronous dichogamy, Lloyd & Webb 1986). Because gender is not synchronized across umbel orders, geitonogamous pollination is possible. Trachymene incisa is self-compatible, although seed set resulting from self-pollination is less than seed set resulting from cross-pollination (Davila & Wardle 2002). ^p There are very few morphological changes in the umbel with the shift from male-to-female phase. Umbel height (mean = 5.1 mm) and diameter (mean = 19.7 mm) do not change significantly from the middle of the male phase (approximately 8 days after the first flowers open) through to the end of the female phase (Davila 1999). There is approximately 5% UV reflectance from petals during both male and female phases (Davila 2006). The height of dehiscing anthers and receptive stigmas from the base of flowers is similar (Davila 1999). Therefore, any differences in visitation rate by insects are more likely to be due to differences in floral rewards available, rather than minute morphological differences. ^p The umbels attract a large suite of insect visitors, including native bees, wasps, flies, butterflies and the introduced European honey bee Apis mellifera (Davila 1999; Davila & Wardle 2002). The flowering period usually begins in late spring and continues through to late autumn, with peak flowering during summer (Powell 1992; Davila & Wardle 2002). ^p Study populations ^p Insect visitation was recorded at three populations of T. incisa occurring in New South Wales, Australia: Myall Lakes National Park, the Tomago Sandbeds and Agnes Banks Woodland. At Myall Lakes National Park (32°30′S, 152°21′E), 200 km north of Sydney, T. incisa grows in dry heath and dry heath forests on freely drained sands (Myerscough & Carolin 1986). The Tomago Sandbeds (32°47′S, 151°51′E) are located on the central coast of New South Wales, approximately 70 km south of Myall Lakes National Park. Trachymene incisa occurs within the dry open-forest, low woodland and in adjacent fire breaks of the sandbeds. Myall Lakes National Park and the Tomago Sandbeds share similar climate, geomorphology, soils and vegetation (Fox et al. 1996; Ross et al. 2002). The Agnes Banks Woodland (33°39′S, 150°41′E) is a unique low woodland community occurring on wind blown sand dunes, 55 km west of Sydney (Benson 1992). The Woodland is listed as an Endangered Ecological Community with T. incisa as an identifying species (NSW Scientific Committee 2000). Benson (1981) noted that 47% of the Agnes Banks flora is also found at Myall Lakes. Therefore, all three sites are floristically similar but geographically separated. ^p Insect visitation to natural patches of male and female umbels ^p Six observation patches consisting of 3–6 plants in an area of approximately 2 m2 were located and tagged at all populations during the peak flowering seasons of 2003 and 2004. We labelled each flowering umbel in a patch with a sticker and unique number on its inflorescence stalk. Insects did not approach the labels and foraging did not appear to be affected by the labels (Y. C. Davila, pers. obs. 2003). Flying insect visitors to male and female umbels were observed at each patch for 10 min, at three time periods per day in the morning (09.30–11.00 hours), midday (12.30–14.00 hours) and afternoon (15.30–17.00 hours). Observations have been made at sunrise (07.00–08.00 hours), sunset (18.30–19.30 hours) and at night (21.00–22.00 hours), however, insects were either absent or in very low numbers, indicating that pollination does not occur or is very limited during those times (Davila 2006). Observations were made over three consecutive days during peak flowering for each population. During the observation periods, the morphospecies of flying insects (as a surrogate for species because identification was difficult in the field) and all umbels they visited were recorded. ^p Insect visitation to experimental arrays of male and female umbels ^p During the 2004 flowering season, experimental arrays of freshly cut umbels, consisting of five male phase and five female phase umbels, were placed in moist florist foam. The umbels were arranged in two rows of five umbels, in random order and spaced 4 cm apart. The density of umbels in the array was high but was not unlike high density patches, which are common at all populations (Y. C. Davila, pers. obs. 2003). The array was placed approximately 60 cm above ground level, which is the average height of umbels above ground (Wardle 2003). The array was also located in close proximity to other flowering umbels to maximize visitation. One array was set up during peak flowering at each of the three populations. ^p Insect visitation to the array was recorded with a video-camera mounted on a tripod 1 m from the array. Visitation was recorded for one 90-min session during the middle of the day when insect visitation to umbels is greatest (Davila 2006). The advantages of using a video-camera to record visitation include: (i) no insect observations are missed during the observation periods; (ii) the foraging time can be determined accurately; (iii) there was no need for marking the umbels with labels to identify gender phases; and (iv) the insects are not disturbed by the presence of observers. ^p The number of visits to each umbel and the foraging time per visit were recorded for each insect visitor. Foraging time was determined to the nearest 0.04 s (25 frames per second). Insect visitors were grouped into four categories that could be easily distinguished from video footage, native bee, fly, butterfly and wasp.'
  original_file: raw/Davila_Wardle_2007_visitation_data.xlsx (sheets 'visitn 2003
    ab,ml,ts' and 'visitn 2004 ab,ml,ts', exported as raw/2003data.csv and raw/2004data.csv)
  notes: The two survey years were merged and pivoted to long format, with each raw
    visitor column name retained under `pollinator_raw`, its count under `pollinator_counts`,
    and a mapping onto the flower_visitor vocabulary under `flower_visitor`. Visitor
    groups that are allowed values of pollination_vector_possible are mapped to that
    trait, all others (spiders) to flower_visitor. Blank cells (visitor not recorded
    in a patch observation) were dropped.
