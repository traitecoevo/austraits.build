traits:
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: 3-6
  methods: In 2003, Flying insect visitors to male and female umbels were observed at each patch for 10 min, at three time periods per day in the morning (09.30–11.00 hours), midday (12.30–14.00 hours) and afternoon (15.30–17.00 hours). Observations have been made at sunrise (07.00–08.00 hours), sunset (18.30–19.30 hours) and at night (21.00–22.00 hours), however, insects were either absent or in very low numbers, indicating that pollination does not occur or is very limited during those times (Davila 2006). Observations were made over three consecutive days during peak flowering for each population. During the observation periods, the morphospecies of flying insects (as a surrogate for species because identification was difficult in the field) and all umbels they visited were recorded. In 2004, Insect visitation to the array was recorded with a video-camera mounted on a tripod 1 m from the array. Visitation was recorded for one 90-min session during the middle of the day when insect visitation to umbels is greatest (Davila 2006). The advantages of using a video-camera to record visitation include, (i) no insect observations are missed during the observation periods; (ii) the foraging time can be determined accurately; (iii) there was no need for marking the umbels with labels to identify gender phases; and (iv) the insects are not disturbed by the presence of observers. The number of visits to each umbel and the foraging time per visit were recorded for each insect visitor. Foraging time was determined to the nearest 0.04 s (25 frames per second). Insect visitors were grouped into four categories that could be easily distinguished from video footage, native bee, fly, butterfly and wasp.
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: 3-6
  methods: In 2003, Flying insect visitors to male and female umbels were observed at each patch for 10 min, at three time periods per day in the morning (09.30–11.00 hours), midday (12.30–14.00 hours) and afternoon (15.30–17.00 hours). Observations have been made at sunrise (07.00–08.00 hours), sunset (18.30–19.30 hours) and at night (21.00–22.00 hours), however, insects were either absent or in very low numbers, indicating that pollination does not occur or is very limited during those times (Davila 2006). Observations were made over three consecutive days during peak flowering for each population. During the observation periods, the morphospecies of flying insects (as a surrogate for species because identification was difficult in the field) and all umbels they visited were recorded. In 2004, Insect visitation to the array was recorded with a video-camera mounted on a tripod 1 m from the array. Visitation was recorded for one 90-min session during the middle of the day when insect visitation to umbels is greatest (Davila 2006). The advantages of using a video-camera to record visitation include, (i) no insect observations are missed during the observation periods; (ii) the foraging time can be determined accurately; (iii) there was no need for marking the umbels with labels to identify gender phases; and (iv) the insects are not disturbed by the presence of observers. The number of visits to each umbel and the foraging time per visit were recorded for each insect visitor. Foraging time was determined to the nearest 0.04 s (25 frames per second). Insect visitors were grouped into four categories that could be easily distinguished from video footage, native bee, fly, butterfly and wasp.
- var_in: flower_dichogamy
  unit_in: .na
  trait_name: flower_dichogamy
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Trachymene incisa umbels are protandrous, with all flowers of an umbel
    passing through a male (pollen-presenting) phase before a female (stigma-receptive)
    phase; umbels were scored as male- or female-phase during visitor observations.
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Nectar is present in open flowers functioning as either male or female,
    but not during the quiescent phase; male-phase umbels present pollen and nectar,
    whereas female-phase umbels offer nectar only.
