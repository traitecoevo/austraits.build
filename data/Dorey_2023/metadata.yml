source:
  dataset:
    key: Dorey_2023
    bibtype: Article
    year: 2023
    author: James B. Dorey and Erica E. Fischer and Paige R. Chesshire and Angela
      Nava-Bolaños and Robert L. O'Reilly and Silas Bossert and Shannon M. Collins
      and Elinor M. Lichtenberg and Erika Tucker and Allan Smith-Pardo and Armando
      Falcon-Brindis and Diego A. Guevara and Bruno R. Ribeiro and Diego de Pedro
      and James Keng-Lou Hung and Katherine A. Parys and Lindsie M. McCabe and Matthew
      S. Rogan and Robert L. Minckley and Santiago J. E. Velazco and Terry Griswold
      and Tracy A. Zarrillo and Walter Jetz and Yanina V. Sica and Michael C. Orr
      and Laura Melissa Guzman and John Ascher and Alice C. Hughes and Neil S. Cobb
    title: A globally synthesised and flagged bee occurrence dataset and cleaning
      workflow
    journal: Scientific Data
    volume: 10
    pages: 747
    doi: 10.1038/s41597-023-02626-w
contributors:
  data_collectors:
  - last_name: Dorey
    given_name: James B.
    ORCID: 0000-0003-2721-3842
    affiliation: University of Wollongong, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: ' data |> dplyr::filter(!is.na(location_name), is.na(omit_duplicate)) |> dplyr::group_by(taxon_name,
    bee_species, flower_visitor, location_name, collection_date) |> dplyr::summarise(
    individualCount = sum(dplyr::coalesce(as.numeric(individualCount), 1)), count_method
    = paste(sort(unique(count_method)), collapse = "; "), dplyr::across(c(catalog_number,
    occurrenceID, gbifID, database_id, duplicate_database_id), ~ dplyr::na_if(paste(stats::na.omit(.x),
    collapse = "; "), "")), .groups = "drop" ) '
  collection_date: collection_date
  taxon_name: taxon_name
  location_name: location_name
  description: Host plants recorded on the labels of Australian bee specimens, compiled
    from museum collections and online biodiversity repositories as part of the BeeBDC
    global bee occurrence dataset.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Bee occurrence records were compiled from the major online repositories
    (ALA, GBIF, SCAN, iDigBio and others) and private collections, then taxonomically
    harmonised, flagged for spatial, temporal and taxonomic issues, and de-duplicated
    using the BeeBDC R workflow (Dorey et al. 2023). Australian records that list
    an associated plant taxon (the `associatedTaxa` field, typically "host:" followed
    by the plant family and name transcribed from the specimen label) were extracted
    by James Dorey for AusTraits. The great majority are pinned museum specimens,
    each a bee collected while visiting, or netted from, the named plant.
  original_file: raw/AusData_out.xlsx, supplied by James Dorey in November 2026 (46,724
    Australian BeeBDC records with an associatedTaxa value, 139 columns); not in GitHub
    due to its size. data.csv and locations.csv are written from it by raw/extra_R_code_Dorey_2023.R,
    using raw/Dorey_2023_plant_lookup.csv to clean the host plant names.
  notes: Each row of data.csv is one bee specimen (a label naming two host plants
    gives a row for each), with its museum catalogue number, occurrenceID, gbifID
    and BeeBDC database_id kept as identifiers. 21,542 specimens were present twice
    in the supplied file, once from ALA and once from GBIF (same catalogue number,
    bee species, host, locality, date and coordinates, both marked Unique by BeeBDC,
    because the shared number is held in recordNumber, which is not among the columns
    BeeBDC compares when de-duplicating, and the ALA copy lacks the gbifID and occurrenceID);
    each is kept once, from the GBIF copy, with the ALA copy's BeeBDC id in duplicate_database_id.
    Specimens of one bee species collected on one host plant at one location on one
    date are different individual bees (each was killed when collected); custom_R_code
    collapses each such collecting event into one observation, with individualCount
    giving the number of bees (each pinned specimen counting as one unless its record
    gives an individualCount) and the specimens' identifiers listed, separated by
    semicolons; the context pollinator count determination records whether the count
    is of preserved specimens or of photographic observations (15 iNaturalist records).
    Records from a canola (Brassica rapa) crop survey (S. Rao, 2008-2009, Boorowa
    and Ginninderra; 2,766 specimens) were removed, as crop studies are not included
    in AusTraits, as were records whose host was not a plant (a Sceliphron nest, mites)
    or was given as none. J.B. Dorey's 18 specimens from the targeted Pharohylaeus
    lactiferus observation events (Dorey 2021, Table S1; 11 vials on Stenocarpus sinuatus
    and Brachychiton acerifolius) are marked omit_duplicate = Dorey_2021 and removed by
    custom_R_code, as Dorey_2021 holds these events with their other visitors and counts.
    Host plant names were taken from associatedTaxa after removing
    the "host:" prefix and family name (raw/Dorey_2023_plant_lookup.csv, which also
    corrects Mesembrion to Mesembryanthemum and the common name Oleander to Nerium
    oleander, both of which APCalign mismatches). Genus-level host names are suffixed
    with their location (e.g. Eucalyptus sp. [Katherine; Dorey_2023]), to distinguish
    between the many identical 'genus sp.' entries (e.g. Eucalyptus sp., representing
    many species of Eucalyptus); coordinates and collection date are added only where
    the same genus was collected at more than one point under one place name, or on
    more than one day at one point (e.g. Eucalyptus sp. [Katherine (-14.4667, 132.2667),
    1974-11-20; Dorey_2023]). collection_date is taken from the BeeBDC year, month
    and day fields or, where these are empty or were mis-parsed by BeeBDC, from the
    date written on the label (often held in the locality field). Four label years
    that were single outliers against the same collector's other records from that
    collecting event were corrected (1871 to 1971, 1884 to 1994, 1894 to 1984 and
    1195 to 1995); records with no recoverable year are given unknown/2023, the year
    the BeeBDC dataset was compiled. Each unique coordinate pair, rounded to 4 decimal
    places (about 10 m), is a location, labelled with the place part of the label
    locality most often given for it; a place name given for more than one coordinate
    pair carries the coordinates in each location name. Records without coordinates
    (3,439 rows) are kept in data.csv but removed by custom_R_code, as in the BeeBDC
    cleaned dataset, which drops records flagged by bdc_coordinates_empty; they have
    no location and would need georeferencing from the label text in locality_verbatim.
    The bee taxon is mapped to the most specific flower_visitor level available, from
    genus (honeybee, allodapini, anthophorini, carpenter_bee) or family (colletidae,
    sweat_bee, megachilidae, stenotritid_bee); the remaining Apidae (Thyreus, Ceratina,
    Melissodes) are mapped to bee.  Most plant taxa with a species-rank name could
    be aligned to a known/accepted name in the APC or explicitly identified as non-native,
    non-nautralised garden plantings. 6 names could not be matched and are aligned
    to genus only, Cassia carpa, Eremophila spinosa, Eucalyptus linariifolia, Hypoxis
    rooporis, Leptospermum contintenalis, Melaleuca latrobsi.
identifiers:
- var_in: catalog_number
  identifier_type: catalogNumber
  institution_code: various (institution code prefixed to each catalogue number)
- var_in: occurrenceID
  identifier_type: occurrenceID
  institution_code: various (ALA, GBIF and SCAN data publishers)
- var_in: gbifID
  identifier_type: gbifID
  institution_code: GBIF
locations: locations.csv
contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: bee_species
- context_property: pollinator count
  category: entity_context
  var_in: individualCount
- context_property: pollinator count determination
  category: method_context
  var_in: count_method
  values:
  - value: count of preserved specimens
    description: Number of bees collected on the host plant during the collecting
      event and preserved as specimens, each pinned individually or several catalogued
      together as one lot.
  - value: count of photographic observations
    description: Number of bees photographed on the host plant during the collecting
      event (iNaturalist observations), with no specimen collected.
traits:
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Bees were collected visiting flowers in the field and the host plant noted
    on the specimen label; specimens were later identified by bee taxonomists and
    catalogued in museum collections. Contact with the flower's reproductive structures
    and pollen transfer were not recorded, so the bees are recorded as flower visitors.
    The bee species was mapped to the most specific AusTraits flower_visitor level
    available for its genus or family.
substitutions: .na
