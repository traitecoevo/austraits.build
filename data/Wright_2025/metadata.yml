    "(?<=fire severity: )(high|low)"), NA_character_) ) '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  entity_type: entity_type
  description: To determine whether post-fire seedling recruitment of the obligate-seeding
    shrub Acacia mariae increases with fire severity, whether that relationship is
    spatially consistent across shrub populations, and whether recruitment patterning
    is driven by seedbank transience and heat-stimulated germination.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: 'The impacts of fire severity on A. mariae seedling recruitment
    were assessed in July 2021 at the following four sites: Gibbican Rd, Timmellallie
    Creek, No. 1 Break Rd and Rocky Creek Rd. At each site, fire severity during the
    2018 wildfires had been patchy. This site-level variability in fire severity facilitated
    systematic stratification of shrubs into three distinct fire severity categories:
    high severity burnt, low severity burnt and unburnt. High severity burnt shrubs
    were classified based on burnt twigs/branches having a ''mean minimum burnt tip
    diameter'' (MMBD) exceeding 3 mm (Moreno and Oechal 1991). In contrast, shrubs
    in the low severity burn class exhibited vegetation that had undergone scorching
    but displayed twig/branch MMBDs measuring less than 1 mm. Unburnt shrubs were
    classified as having remained unburnt during the wildfires. ^p At each site, 20
    shrubs from each of the three burn severity categories were systematically tagged
    and numbered using the stratified random sampling methodology of Harding (2012).
    Subsequently, a random number generator was used to select 10 shrubs for each
    burn severity category. A circular quadrat with a 1 m radius with the base of
    the shrub as the centroid was used to quantify the number of seedlings directly
    beneath shrub canopies for each shurb. Exclusion criteria for the shrubs included
    ensuring that the radii of any two sampling quadrats did not overlap and that
    sampled shrubs were not directly adjacent to mature trees. This was done to reduce
    the potential competition between established trees and seedlings which could
    affect the likelihood of seedling establishment. ^p Acacia mariae seedbank dynamics
    were monitored over a period of 60 months from four reproductively mature shrubs
    at the Rocky Creek Rd site of the recruitment study. The sampling timeframe encompassed
    a widespread seed production event that occurred in the spring of 2020. Selection
    of the four shrubs for sampling was based on reproductive maturity at the time
    of assessment and the absence of any fire damage during the 2018 summer wildfire
    event. Seedbank sampling was also carried out at the Timmellallie Creek and Number
    1 Break Rd sites of the recruitment study. However, resource constraints meant
    that only three rounds of sampling occurred at these two sites over a period of
    20 months between January 2021 and August 2022. ^p At each sampling site, the
    seedbanks of four shrubs were sampled. At each of these shrubs, two randomly selected
    20 × 20 cm square by 6 cm deep columns of soil were excavated from beneath the
    shrub canopy. Following the trenching of column sides, the surface litter layer
    and the deeper 5 × 1 cm layers were removed from the column using a paint scraper
    and steel ruler. Seed populations in these various layers were assessed in the
    field by passing the soil/litter materials through 1.6 mm sieves and enumerating
    the seeds. Post-extraction, seed viability was evaluated by splitting the seeds
    and inspecting for intact white embryo tissue. When large numbers of seeds were
    encountered in the samples, viability testing was conducted on a representative
    sample of 20 seeds. The overall percentage viability for these larger samples
    was subsequently calculated by multiplying the total seed count by the estimated
    percentage viability of the representative sample. To prevent resampling the same
    location during successive sampling rounds, 15 cm long steel camping pegs were
    inserted into the ground whenever a soil column was extracted. ^p A germination
    trial was conducted in 2021 in a laboratory at the University of New England,
    Armidale. Seeds for the trial were sourced from five randomly chosen A. mariae
    shrubs located at the Number 1 Break Rd and Timmellallie sites of the ''recruitment
    study''. Seed samples were stored in paper bags for 3 months after collection
    at room temperature. The experimental design of the trial used a two-factor orthogonal
    design, with the primary objective being to test the impact of heat shock and
    incubation temperature on seed germination. Heat shock effects were assessed by
    comparing the germination of untreated (control) seeds with the germination of
    seeds that were heat shocked for 5 min at temperatures of 60, 80, 100, 120 and
    140°C. The effects of incubation temperature on seed germination were examined
    by comparing germination of seeds incubated in darkness at 25°C (intended to represent
    a mean summertime soil temperature at 2 cm depth), with seeds incubated at 10°C
    (intended to approximate a mean wintertime soil temperature at the same depth).
    ^p Five replicates of 20 seeds were used for each combination of the heat shock
    and incubation temperature treatments, resulting in a total of 100 seeds tested
    for each of the 12 treatment combinations. After the heat shock treatment, the
    seeds were arranged on Whatman No. 1 germination pads (Advantec, Dublin, California,
    USA) that had been placed on moisture-retaining sponges positioned within 100
    mm petri dishes. The dishes were sterilised in boiling water, and sponges were
    placed in these and moistened with water sourced from the Armidale town water
    supply. The dishes were randomly distributed in the 10 and 25°C incubators. The
    incubation period spanned 21 days, and the trays were checked daily and kept moist
    for the duration of the trial. A final count of germination was conducted at the
    termination of the incubation period, with germination being defined as the emergence
    of the radicle from the testa. Tetrazolium testing of the unviable seeds was not
    conducted at the closure of the study and we acknowledge this as a limitation
    of the study.'
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: also data in raw data file for leaf_hair_colour, post_fire_seedlings_per_plant,
    soil_seedbank_density. Germination trial seed came from shrubs at the No. 1 Break
    Rd and Timmellallie Creek sites combined, so these records are assigned to the
    forest-wide Pilliga forest location.
