      forest, between Baradine and Coonabarabran
    description: semi-arid eucalypt-dominated forest and Callitris woodland
    locality: Pilliga forest, New South Wales
    geology (stratigraphic map unit): Pilliga sandstone
    soil_type: sandy soils derived from Jurassic Pilliga sandstone; sediment-rich
      outwash soils in northern and western sectors
    fire history: Study sites were
      Gibbican Rd, Timmellallie Creek, No. 1 Break Rd and Rocky Creek Rd, all burnt
      patchily in the January 2018 Gibbican Rd wildfire.
    state: NSW
