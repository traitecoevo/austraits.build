  unit_in: .na
  trait_name: leaf_hairs_adult_leaves
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: The small (0.4–1.3 cm long) phyllodes are covered in fine silvery-grey
    appressed hairs.
- var_in: flowering_time
  unit_in: .na
  trait_name: flowering_time
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Flowering occurs during winter months.
- var_in: fruiting_time
  unit_in: .na
  trait_name: fruiting_time
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Pod maturation and subsequent seed dispersal take place from mid to late
    spring (October–November).
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: This Acacia species is an obligate-seeder and thicket-forming.
- var_in: post_fire_recruitment
  unit_in: .na
  trait_name: post_fire_recruitment
  value_type: value_type
  basis_of_value: expert_score
  replicates: unknown
  methods: A circular quadrat with a 1 m radius with the base of the shrub as the
    centroid was used to quantify the number of seedlings directly beneath shrub canopies
    for each shurb, at four sites where shrubs were stratified into high severity
    burnt, low severity burnt and unburnt categories after the 2018 wildfires. Mean
    recruitment was 5.8 seedlings/shrub after high-severity fire, 0.8 seedlings/shrub
    after low-severity fire and 0.1 seedlings/shrub in unburnt shrubs.
- var_in: seedling_establishment_conditions
  unit_in: .na
  trait_name: seedling_establishment_conditions
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Seedlings were counted in a 1 m radius circular quadrat beneath the canopy
    of shrubs stratified into high severity burnt, low severity burnt and unburnt
    classes, 3.5 years after the 2018 Gibbican Rd wildfire; recruitment was strong
    after high severity fire and low in the absence of fire.
- var_in: seed_germination_treatment
  unit_in: .na
  trait_name: seed_germination_treatment
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Inferred from a germination trial comparing untreated seeds with seeds
    heat shocked for 5 min at 60, 80, 100, 120 and 140°C, incubated in darkness at
    10 or 25°C; germination was highest after heat shocks of 100-140°C at 25°C.
- var_in: seed_dormancy_class
  unit_in: .na
  trait_name: seed_dormancy_class
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Inferred from the heat-shock requirement for germination in the germination
    trial.
- var_in: seedbank_location
  unit_in: .na
  trait_name: seedbank_location
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Soil seedbanks beneath shrub canopies were sampled with 20 x 20 cm by 6
    cm deep soil columns, sieved at 1.6 mm, and viable seeds counted.
- var_in: seedbank_longevity_class
  unit_in: .na
  trait_name: seedbank_longevity_class
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Inferred from repeated soil seedbank sampling over 60 months at Rocky Creek
    Rd and 20 months at Timmellallie Creek and No. 1 Break Rd, during which seed densities
    rose sharply after the spring 2020 seed production event and then declined rapidly.
- var_in: plant_tolerance_fire
  unit_in: .na
  trait_name: plant_tolerance_fire
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: In our previous experiments in which we used a plant ignitability unit,
    results showed that the plant matter has fire-retardant properties, such as lower
    burn temperatures and slower ignition than coexisting plants.
- var_in: reproductive_maturity
  unit_in: unit
  trait_name: reproductive_maturity
  value_type: value_type
  basis_of_value: expert_score
  replicates: unknown
  methods: We observed A. mariae plants that recruited after the 2018 wildfires to
    be flowering and fruiting by 2023, indicating a primary juvenile period of less
    than 5 years.
- var_in: seed_germination
  unit_in: unit
  trait_name: seed_germination
  value_type: value_type
  basis_of_value: measurement
  replicates: 5
  methods: Seeds were heat shocked for 5 min at 60, 80, 100, 120 or 140°C, or left
    untreated (control), then incubated in darkness at 10 or 25°C. Five replicates
    of 20 seeds were used for each combination of the heat shock and incubation temperature
    treatments. The seeds were arranged on Whatman No. 1 germination pads placed on
    moisture-retaining sponges within 100 mm petri dishes. The incubation period spanned
    21 days, and the trays were checked daily and kept moist for the duration of the
    trial. A final count of germination was conducted at the termination of the incubation
    period, with germination being defined as the emergence of the radicle from the
    testa.
