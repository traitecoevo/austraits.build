- var_in: plant_height_type
  unit_in: .na
  trait_name: plant_height_type
  entity_type: species
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: 'Inferred for taxa whose profile gives no plant height, from the taxon''s own scored traits (evidence in value_description):
    marine or aquatic (floating, submerged) substrate; epiphyte or lithophyte substrate; climbing (climber growth form or
    a climbing-plant height); geophyte (a reproductive height and a bulb, corm or tuber, or a terrestrial orchid); rosette
    or leaf_tuft (a reproductive height and a rosette, or a tufted habit or graminoid); prostrate (prostrate or creeping,
    not also erect); mat-forming; rhizome (ferns with a rhizome). The description names the trait that holds the plant''s
    length instead (plant_height_reproductive, plant_height_climbing_plant, stem_length). Not scored when no reason applies.'
