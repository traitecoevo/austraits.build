          "fruiting_time", "germination_cues", "glume_length", "glume_width",
          "hypanthium_length", "hypanthium_width", "inflorescence_colour", "inflorescence_diameter",
          "inflorescence_length", "inflorescence_shape", "inflorescence_type", "involucral_bract_length",
          "involucral_bract_width", "involucre_length", "juvenile_leaf_colour", "juvenile_leaf_length",
