  entity_type: species
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Scored from the leaf clause of the taxon description that names hanging leaves (pendulous, pendent, drooping, weeping;
    verbatim in value_description); an erect or spreading alternative in the same clause ("Leaves spreading to pendent") is
    recorded as not_pendulous. Taxa whose leaves are not described as hanging are not scored.
