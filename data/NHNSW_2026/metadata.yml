  entity_type: species
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: 'Scored from the habit text (woody base, suffruticose -> woody_base; woody rootstock or taproot -> woody_root;
    soft-wooded -> semi_woody; verbatim in value_description) and, for taxa without one, inferred from the growth form on
    trait_scoring_method = inferred_from_growth_form rows: herb, graminoid, fern, tussock, hummock, herbaceous climber, geophyte
    -> herbaceous; tree, shrub, mallee, woody climber, palmoid -> woody; both when the forms are mixed (the ABRS_2022 rules).'
- var_in: leaf_pendulousness
