  collection_date: '2026'
  taxon_name: taxon_name
  trait_name: trait_name
  value: value
  description: To compile plant trait values from the taxon descriptions of the Flora of New South Wales online (PlantNET, National
    Herbarium of New South Wales), for all families.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'The family, genus, species and infraspecific profiles of the Flora of New South Wales on PlantNET
    (plantnet.rbgsyd.nsw.gov.au) were downloaded. Trait values were extracted from the Description, Flowering, Distribution and
    occurrence and Notes text with the scripted parser written for the Flora of Australia online (ABRS_AtoM_2026/raw/build_data_csv.R,
    PlantNET mode): each description is split into sentences, clauses and comma-separated segments, each segment is assigned to the
    organ it describes, and categorical terms and measurements are read from the segments of the relevant organ, with the family
    rules of that parser (Fabaceae phyllodes, orchids, grasses and other graminoids, ferns, Asteraceae heads ...). Categorical terms
    are mapped to AusTraits trait values, with the source terms kept verbatim in value_description; several values are listed in the
    order they appear in the text, and alternatives qualified by a commonness word or a region are recorded on separate rows. A
    measured range is recorded as minimum and maximum values, a single measurement as a mean, a single count as a mode, "to X" as a
    maximum and "X or more" as a minimum; parenthetical extremes are kept on separate rows (measurement_range = extreme). Categorical
    values stated as a single, unqualified value in a genus (or family) description, and not contradicted by any member taxon that
    describes the trait, are copied to member taxa whose own description is silent on that trait; subspecies and varieties silent on a
    trait take the values of their species. Values that descriptions state only when atypical (terrestrial substrate, leaf as
    photosynthetic organ, not parasitic, broadleaf) are recorded on trait_scoring_method = inferred rows when nothing in the profile
    suggests otherwise. Ecological traits (fire response, dispersal, pollination, clonality) were scored by reading each statement of
    the Distribution and occurrence and Notes text; hedged statements are scored with the hedge word as scoring_certainty. Taxon names
    are given without authorities; informal variants and phrase names are kept as written.'
  original_file: plantnet_nsw_flora.csv (PlantNET Flora of NSW profiles, downloaded 1 October 2026)
  notes: 'The profile URL of each taxon is in raw/taxon_urls.csv (one row per taxon; as a data.csv column it took the file to the
    GitHub size limit). Candidate traits not yet in traits.yml are listed with their coverage in raw/candidate_traits.csv;
    custom_R_code keeps only the traits mapped below. Rows whose trait_name is a text field (habit_description, leaf_description,
    habitat_description, ...) carry the verbatim organ-level text and are unmapped. Parenthetical extremes (measurement_range =
    extreme) are in data.csv but not mapped.'
identifiers: .na
locations: .na
contexts:
- context_property: commonness qualifier
  category: entity_context
  var_in: commonness_qualifier
- context_property: leaf division
  category: entity_context
  var_in: leaf_division
- context_property: entity measured
  category: method_context
  var_in: entity_measured
- context_property: population region
  category: entity_context
  var_in: population_region
- context_property: plant organ measured
  category: entity_context
  var_in: plant_organ_measured
  values:
  - value: fronds
    description: Plant height measured to the top of the fronds.
  - value: trunk
    description: Height of the trunk.
  - value: spikelet
    description: Measurement of a spikelet, the small inflorescence unit of grasses and sedges.
  - value: floret
    description: Measurement of a floret, a small flower of a grass spikelet or Asteraceae head.
  - value: glume
    description: Measurement of a glume, one of the bracts at the base of a grass spikelet.
  - value: involucral bract
    description: Measurement of an involucral bract, a bract of the involucre surrounding an inflorescence.
  - value: labellum
    description: Measurement of the labellum, the modified median petal of an orchid flower.
  - value: lemma
    description: Measurement of a lemma, the lower bract enclosing a grass floret.
  - value: palea
    description: Measurement of a palea, the upper bract enclosing a grass floret.
  - value: spathe
    description: Measurement of a spathe, a large bract enclosing an inflorescence.
  - value: leaf abaxial surface
    description: Measurement of the lower (abaxial) surface of the leaf lamina.
  - value: leaflet
    description: Measurement of a leaflet of a compound leaf.
  - value: leaf adaxial surface
    description: Measurement of the upper (adaxial) surface of the leaf lamina.
  - value: branchlet
    description: Measurement of the branchlets (the youngest woody or leafy stems).
  - value: utricle
    description: Measurement of the utricle (perigynium), the sac enclosing the nut of Carex and allied sedges.
  - value: nut
    description: Measurement of the nut, when the utricle (perigynium) enclosing it is also measured.
- context_property: trait scoring method
  category: method_context
  var_in: trait_scoring_method
- context_property: scoring certainty
  category: method_context
  var_in: scoring_certainty
