source:
  dataset:
    key: Mucina_2026
    bibtype: Unpublished
    year: 2026
    author: Ladislav Mucina
    title: 'Unpublished dataset: Kwongan Trait Database (Kwongan TDB 2.0), including
      unpublished observations of kwongan species.'
  source:
  - key: FloraBase_2026
    bibtype: Online
    year: 2026
    author: '{Western Australian Herbarium}'
    title: Florabase—the Western Australian Flora.
    publisher: Department of Biodiversity, Conservation and Attractions.
    url: https://florabase.dpaw.wa.gov.au/
contributors:
  data_collectors:
  - last_name: Mucina
    given_name: Ladislav
    ORCID: 0000-0003-0317-8886
    affiliation: Murdoch University, Perth, Western Australia, Australia
    additional_role: contact
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      tidyr::separate_rows(source_id, sep = " ") |>
      dplyr::mutate(trait = stringr::str_extract(`Trait:State`, "^[^:]+")) |>
      dplyr::group_by(`Taxon Name`, trait, source_id) |>
      dplyr::summarise(
        value = paste(unique(`Trait:State`), collapse = " "),
        .groups = "drop"
      ) |>
      dplyr::mutate(
        location_name = "Kwongan",
        basis_of_record = dplyr::if_else(source_id == "Mucina_2026", "field", "literature")
      )
    '
  collection_date: '2026'
  source_id: source_id
  taxon_name: Taxon Name
  trait_name: trait
  value: value
  location_name: location_name
  description: Species-level trait database for the kwongan (sandplain shrubland and
    heathland) flora of south-western Australia, compiled to document the functional
    traits of this flora.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: Placeholder text, to be replaced by a description from L. Mucina.
    Traits were scored at species level for the kwongan flora of south-western Australia,
    using the species descriptions in FloraBase, the online flora of the Western Australian
    Herbarium, supplemented by the unpublished field observations of L. Mucina.
  original_file: Kwongan TDB 2.0 Parasitism Detailed DONE LM11-10 to AusTraits 26-10.xlsx;
    trait codes and definitions in Kwongan TDB 2.0 A_Traits List & Codes 21-10-2026
    to AusTraits 26-10.xlsx
  notes: data.csv is the xlsx file's single sheet, with its three columns unchanged
    and a source_id column appended that recodes the Source codes as space-delimited
    reference keys ([001] = FloraBase_2026, [LM] = Mucina_2026). custom_R_code splits
    each row citing several sources into one record per source, so each value is linked
    to the source that reports it, with basis_of_record field for Mucina_2026 and
    literature for the other sources. Each parasitic taxon has two rows in the source
    file (holo- or hemiparasitism, plus root or stem parasitism); the values a source
    gives for a taxon are combined into one space-delimited value. The trait codes
    file describes the full Kwongan TDB 2.0 trait system; only parasitism is included
    so far.
identifiers: .na
locations:
  Kwongan:
    latitude (deg): -31.4063
    longitude (deg): 117.7646
    description: Kwongan (sandplain shrubland and heathland) of south-western Western
      Australia.
    georeference remarks: Coordinates given as Durokoppin Nature Reserve, a kwongan
      remnant near the centre of the kwongan region, which extends from Kalbarri through
      the northern sandplains and wheatbelt to the Fitzgerald River and Esperance
      sandplains.
    state: WA
contexts: .na
traits:
- var_in: Paras
  unit_in: .na
  trait_name: parasitic
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Parasitism (holoparasitism, hemiparasitism, root parasite, stem parasite,
    non-parasitic) scored for each taxon from FloraBase species descriptions and the
    unpublished field observations of L. Mucina.
substitutions:
- trait_name: parasitic
  find: paras:holo
  replace: holoparasitic
  match: word
- trait_name: parasitic
  find: paras:hemi
  replace: hemiparasitic
  match: word
- trait_name: parasitic
  find: paras:root
  replace: root_parasitic
  match: word
- trait_name: parasitic
  find: paras:stem
  replace: stem_parasitic
  match: word
- trait_name: parasitic
  find: paras:none
  replace: not_parasitic
  match: word
