questions:
  question1: Two records (Anthobolus foveolatus, Paras:Hemi and Paras:Root) cite source
    [002], which is not identified in the files supplied. Its source_id is the placeholder
    unknown_002 until the reference is known.
  question2: sampling_strategy and methods are a summary, as no written description
    of how Kwongan TDB 2.0 was compiled was supplied. I can add a few senteneces that
    you write, or use my own generic description of how traits were scored.
  question3: Pterostylis dilatata is listed twice in the parasitism file (rows 1034
    and 1035), with identical values for the trait and source columns (Paras:None,
    source [001]); it has been collapsed into a single record. Was the second row
    meant to be a different taxon?
