dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        across(c(specific_leaf_area, chlorophyll, dark_respiration_rate, light_compensation_point,
          Pmax, chlorophyll_per_dry_mass), ~ stringr::str_replace(.x, "\\±.+", "")),
        specific_leaf_area = as.numeric(specific_leaf_area)/10,
        chlorophyll_per_dry_mass = as.numeric(chlorophyll_per_dry_mass)/10,
        Pmax = as.numeric(Pmax)*10
      )
  '
  collection_date: 1984-08/1984-12
  taxon_name: species_name
  location_name: location_name
  description: To determine whether comparative light requirements of the three
    Australian Nothofagus species, and of Nothofagus moorei and Eucryphia moorei
    relative to their co-occurring canopy species, help explain differences in
    the regeneration dynamics of the rainforests they dominate.
  basis_of_record: field_experiment
  life_stage: sapling
  sampling_strategy: The Tasmanian species were grown from seed collected at Mt
    Field National Park (42 deg 41' S, 146 deg 40' E). Seedlings of the New South
    Wales species were collected from Banda Banda (31 deg 10' S, 152 deg 24' E)
    (N. moorei, C. apetalum and D. sassafras) and from Clyde Mountain (35 deg 36'
    S, 149 deg 57' E) (E. moorei). The Chilean species were grown from seed collected
    from the botanical gardens of the Universidad Austral de Chile, Valdivia. Seedlings
    of each species (six months to two years old at the start of the conditioning
    period) were grown in contrasting light regimes in a glasshouse from August
    to December 1984. All plants were grown in sandy loam, watered daily and given
    nutrient weekly. This experiment was performed in conjunction with a comparative
    study of the light requirements of Tasmanian rainforest canopy species, and
    methods and results have been described for N. cunninghamii and A. moschatum
    already (Read, 1985a). Eight plants of each species were grown unshaded in
    the glasshouse (approx. 80% of the PAR of natural sunlight), and the same number
    shaded from direct sunlight so that maximum photon flux density (PFD) of unfiltered
    diffuse light was 30 to 80 umol quanta m-2 s-1. The daily maximum temperatures
    in the glasshouse for the seven weeks prior to and during measurement ranged
    from 23 to 31 deg C with a mean maximum daily temperature of 26 deg C. Leaf
    temperature varied by less than 1 deg C between the two light regimes. N. gunnii
    has a poor survival rate when grown outdoors or in glasshouse conditions in
    Hobart. This is probably due to climatic differences between Hobart and the
    areas of natural occurrence of N. gunnii. Therefore, comparison of this species
    with N. cunninghamii was made by growing seedlings of both species in a controlled
    environment growth cabinet at 23 deg C day temperature and 20 deg C night temperature.
    The light source was composed of a 400 W metal arc lamp, eight 40 W fluorescent
    lamps and four 60 W incandescent lamps during a 12 h photoperiod. One group
    of plants was positioned to receive a PFD of 700 to 800 umol quanta m-2 s-1
    (daily photon flux = 30 to 35 mol quanta m-2 d-1). This was the highest PFD
    possible in the growth cabinet. The second group of plants was shaded from
    the 400 W metalarc lamp and received 50 umol quanta m-2 s-1 (daily photon flux
    = 2 mol quanta m-2 d-1) from the fluorescent and incandescant lights. Leaf temperature
    was 1 to 2 deg C higher in the plants grown under the higher light intensity
    during the photoperiod. Leaves of N. gunnii produced in the shade regime are
    similar in form to juvenile leaves and are not suitable for measurement of
    photosynthesis because of their small size and arrangement which prevents
    enclosure in the leaf chamber. Verbatim from secondary_01 (Read 1985a), for
    Atherosperma moschatum, Eucryphia lucida, Phyllocladus aspleniifolius, Lagarostrobos
    franklinii and Athrotaxis selaginoides, grown alongside Nothofagus cunninghamii
    under the same glasshouse regime and dates as above. Another group of plants
    was grown for 12 months outdoors in a bush-house under a eucalypt woodland
    canopy of approximately 60% canopy cover (measured by hemispherical photograph).
    The daily maximum temperature for the 7 weeks prior to and during measurement
    ranged from 11 deg C to 24 deg C with a mean maximum daily temperature of 16
    deg C.
  original_file: transcriptions of Tables 1 and 2 (primary) and Table 1 (secondary_01)
    from manuscript PDFs in raw data folder
  notes: The source's specific leaf area (SLA) values appear anomalously high for
    these species - e.g. this study's glasshouse-grown Nothofagus cunninghamii
    SLA is 131-149 m2/kg (Sun/Shade), compared with roughly 6 m2/kg for wild, mature
    N. cunninghamii in this repo's own Wright_2006 (GLOPNET) dataset. Some difference
    is expected (glasshouse-grown juvenile seedling leaves vs wild mature sclerophyll
    foliage), but a ~20-fold gap is atypically large. The printed units (m2 g-1
    x 10-3) are confirmed and identical between both datasets--they have been adjusted by 10x, because the two downstream measurements using these values were also off - photosynthetic rates and chlorophyll measurements made sense in leaf area units, but were far too low in leaf mass units. Pmax edited 
