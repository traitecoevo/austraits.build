contexts:
- context_property: growth light regime
  category: method_context
  var_in: growth_light_regime
  values:
  - find: Sun
    value: Sun
    description: full sunlight in the glasshouse (approx. 80% of natural PAR)
  - find: Shade
    value: Shade
    description: shaded from direct sunlight in the glasshouse (unfiltered diffuse
      light 30-80 umol quanta m-2 s-1)
  - find: Bush-house
    value: Bush-house
    description: grown for 12 months outdoors under a eucalypt woodland canopy,
      approximately 60% canopy cover
  - find: '700-800'
    value: 700-800 umol quanta m-2 s-1
    description: controlled environment growth cabinet, highest PFD treatment possible
      in the cabinet
  - find: '50'
    value: 50 umol quanta m-2 s-1
    description: controlled environment growth cabinet, shaded PFD treatment
- context_property: experiment
  category: method_context
  var_in: experiment
traits:
- var_in: specific_leaf_area
  unit_in: m2/kg
  trait_name: leaf_mass_per_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count
  methods: Leaf area was measured photometrically. 
- var_in: chlorophyll
  unit_in: mg/m2
  trait_name: leaf_chlorophyll_per_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count
  methods: Chlorophylls were extracted from one leaf per plant of each species,
    in 80% (v/v) acetone and estimated spectrophotometrically.
- var_in: chlorophyll_per_dry_mass
  unit_in: mg/g
  trait_name: leaf_chlorophyll_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count
  methods: Chlorophylls were extracted from one leaf per plant of each species,
    in 80% (v/v) acetone and estimated spectrophotometrically. Reported in secondary_01
    (Read 1985a) as chlorophyll per unit leaf dry weight, calculated from chlorophyll
    per unit leaf area and specific leaf area
- var_in: dark_respiration_rate
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_dark_respiration_per_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count
  methods: An open gas exchange system incorporating a Series 225 infra-red gas
    analyzer (Analytical Development Co. Ltd.) was used to measure the net rate
    of CO2 assimilation at selected incident photon flux densities. The light source
    was a Sylvania 400 W metalarc lamp. Photosynthetically active radiation was
    measured by a LiCor LI-185 meter with quantum sensor. The light intensities
    were obtained by varying the distance of the leaf chamber from the light source,
    and using shade cloth screens. Humidified air (317 to 340 ul/l CO2) was pumped
    through a leaf chamber of cross-sectional area 10 cm2 at a flow rate of 0.4
    l/min. Leaf temperature was monitored by a thermocouple on the lower leaf surface
    and maintained at 21+/-1 deg C. Leaf photosynthesis was measured only on young
    fully expanded leaves which developed in the experimental light conditions.
    One leaf per plant was sampled, with five to eight replicates (five replicates
    for the growth cabinet experiment).
- var_in: light_compensation_point
  unit_in: umol{photon}/m2/s
  trait_name: leaf_light_compensation_point
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count
  methods: An open gas exchange system incorporating a Series 225 infra-red gas
    analyzer (Analytical Development Co. Ltd.) was used to measure the net rate
    of CO2 assimilation at selected incident photon flux densities, decreasing
    from 750 umol quanta m-2 s-1. Light compensation point is the photon flux density
    at which net photosynthesis is zero, interpolated from the light-response curve.
    Leaf temperature was maintained at 21+/-1 deg C.
- var_in: Pmax
  unit_in: nmol{CO2}/g/s
  trait_name: leaf_photosynthetic_rate_per_dry_mass_saturated
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: count
  methods: An open gas exchange system incorporating a Series 225 infra-red gas
    analyzer (Analytical Development Co. Ltd.) was used to measure the net rate
    of CO2 assimilation at selected incident photon flux densities, up to 750 umol
    quanta m-2 s-1 (no evidence of photoinhibition was observed at PFDs up to 2500
    umol quanta m-2 s-1). Pmax is the maximum (light-saturated) net photosynthetic
    rate from the light-response curve, at ambient CO2 concentration (317-340 ul/l).
    Leaf temperature was maintained at 21+/-1 deg C. The source's Pmax column is
    printed as (umol CO2 g-1 leaf dry weight s-1 x 10-4); custom_R_code decodes
    this printed-value scale factor (x0.1, to nmol/g/s) before the unit conversion
    routine handles the remaining nmol -> umol conversion.
substitutions: .na
taxonomic_updates: .na
exclude_observations: .na
questions: .na
