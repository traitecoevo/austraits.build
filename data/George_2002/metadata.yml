  unit_in: mm
  trait_name: bracteole_length
  entity_type: species
  value_type: value_type
  basis_of_value: measurement
  replicates: .na
  methods: 'Measurement given in the taxon description (verbatim in value_description): a range is recorded as minimum and
    maximum values, a single measurement as a mean, a single count as a mode, "to X" as a maximum and "X or more" as a minimum;
    parenthetical extremes are on measurement_range = extreme rows (not mapped).'
