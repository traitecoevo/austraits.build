traits:
- var_in: leaf_essential_oil_per_dry_mass
  unit_in: '%'
  trait_name: leaf_essential_oil_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Samples of clean, mature leaves were picked from single trees and, after
    freezing with liquid nitrogen, were reduced to a fine powder using a stainless
    steel Waring Blender (Model No. SS110). This procedure was necessary to rupture
    the oil glands. The dry powder was then vacuum-distilled so that the leaf oil
    condensed on to a gold-plated copper rod maintained at approximately -75°C. Complete
    details of this procedure have been published previously. All oils obtained were
    colourless to pale yellow and lighter than water. Table 1 lists the oil yields
    (wt%, leaves dried in an oven at 38°C) for the 24 species studied.
- var_in: leaf_1_8_cineole_per_dry_mass
  unit_in: '%'
  trait_name: leaf_1_8_cineole_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Table 1 lists the oil yields (wt%, leaves dried in an oven at 38°C) for
    the 24 species studied. ^p Freshly isolated oils obtained by vacuum distillation
    of powdered leaves from single trees were analysed by GC and by GC-MS. The results
    for the 24 species are listed in Table 2; only those components with concentrations
    greater than 0.05% are reported. ^p Leaf 1,8-cineole content is calculated as
    the oil yield multiplied by the percentage of 1,8-cineole in the oil.
