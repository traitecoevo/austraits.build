  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  description: To characterise the volatile leaf oil yield and composition of 24 south-western
    and southern Australian eucalypt taxa of series Levispermae, most of which had
    not previously been analysed.
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: Continuing our investigation of indigenous Australian eucalypts
    we have examined the leaf oils of 24 species of the series Levispermae. In this
    study we have followed the system of Brooker & Kleinig and the botanic nomenclature
    of the Flora of Australia. Locations of all species, which are native to south-western
    and southern Australia, are listed in Table 1. A more detailed description of
    the occurrence of these eucalypts has been given elsewhere. ^p Samples of clean,
    mature leaves were picked from single trees and, after freezing with liquid nitrogen,
    were reduced to a fine powder using a stainless steel Waring Blender (Model No.
    SS110). This procedure was necessary to rupture the oil glands. The dry powder
    was then vacuum-distilled so that the leaf oil condensed on to a gold-plated copper
    rod maintained at approximately -75°C. Complete details of this procedure have
    been published previously. All oils obtained were colourless to pale yellow and
    lighter than water. Table 1 lists the oil yields (wt%, leaves dried in an oven
    at 38°C) for the 24 species studied. ^p The specimens for these species were authenticated
    by Mr M. I. H. Brooker, Australian National Herbarium, or Dean Nicolle, Currency
    Creek Arboretum, South Australia. ^p Botanical voucher specimens have been deposited
    at the South Australian Herbarium by Dean Nicolle, who collected the leaves for
    these species.
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: Percentage composition data for the individual leaf oil compounds are in
    the data.csv file. E. wandoo and E. arachnaea oil yields are printed as "tr."
    (trace) and have no numeric value. Derived columns (basis_of_record, life_stage)
    and the calculated leaf_1_8_cineole_per_dry_mass rows are added in raw/extra_R_code_Bignell_1997.R.
