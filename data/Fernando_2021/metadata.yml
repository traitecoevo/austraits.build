dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(trait %in% c("leaf_P_per_dry_mass", "leaf_K_per_dry_mass", "leaf_S_per_dry_mass",
      "leaf_Ca_per_dry_mass", "leaf_Mg_per_dry_mass", "leaf_Na_per_dry_mass", "leaf_Cu_per_dry_mass",
      "leaf_Zn_per_dry_mass", "leaf_Mn_per_dry_mass", "leaf_Al_per_dry_mass", "leaf_Fe_per_dry_mass",
      "leaf_B_per_dry_mass", "leaf_Si_per_dry_mass", "leaf_phenol_per_dry_mass", "leaf_C_per_dry_mass",
      "leaf_N_per_dry_mass", "leaf_Mo_per_dry_mass", "leaf_Co_per_dry_mass", "leaf_Ni_per_dry_mass",
      "leaf_NP_ratio", "leaf_CN_ratio", "leaf_photosynthetic_rate_per_area_saturated",
      "leaf_stomatal_conductance_per_area_at_Asat", "leaf_intercellular_CO2_concentration_at_Asat",
      "leaf_transpiration_per_area_at_Asat", "leaf_palisade_layer_number", "plant_tolerance_salt")) |>
      dplyr::filter(!grepl("^~", trait_value_raw)) |>
      dplyr::filter(source_section != "Discussion p.15") |>
      dplyr::filter(!(trait == "leaf_intercellular_CO2_concentration_at_Asat" & grepl("S1-D", context))) |>
      dplyr::mutate(sampling_date = dplyr::if_else(is.na(sampling_date), "2016-10-30/2018-07-13", sampling_date))
    '
  collection_date: sampling_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  individual_id: individual_id
  source_id: source_id
  description: To determine whether flooding by environmental water releases changes
    soil chemistry, nutrient uptake, leaf physiology and cellular elemental storage in
    mature Black Box (Eucalyptus largiflorens) trees on the loamy sands of the Hattah
    Lakes floodplain.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: Fernando_2018, The fieldwork was conducted in October 2016 in the Hattah
    Lakes section of the 48,000 hectare Hattah Kulkyne National Park, in Victoria, SE Australia
    (34°41′8.39″S/142°22′32.39″E). At the time of sampling, this floodplain lake system was
    inundated, being fed by Chalka Creek, a tributary of the Murray River. Rising water levels
    were approaching a 25-year record due to unusually high rainfall in September 2016 (120.6
    mm), which ensued a regulated release of environmental water allocation (McCarthy et al.
    2009). Sampling was undertaken at the following three lake sites that remained accessible
    by road, (1) Lake Konardin (34°41′35.05″S 142°21′2.11″E), (2) Lake Woterap (34°40′9.5″S
    142°21′19.5″E), and (3) Lake Mournpall (34°42′26.16″S 142°20′50.24″E). Henceforth these
    lake sites will be referred to as Site 1, Site 2 and Site 3 respectively. The direction
    of water flow within the Chalka creek system was such that of the three study sites, the
    southernmost (Site 3) had been inundated for the longest period of around 7 days, while
    Sites 2 and 1 had been inundated for a shorter period of around 4 days. Due to the low slope
    at the three sites, inundation was gradual rather than fast overland flow of water. At each
    of these three sites, two locations designated ''wet'' and ''dry'' were selected so that
    wet locations were just within the waterline, while dry locations were at least 20 m from
    the waterline. The dry locations were intended here to represent pre-inundation conditions.
    ^p At each wet and dry location, five mature trees (~10 m height) were selected for sampling,
    resulting in ten trees per site, and a total of thirty trees overall. For each tree, several
    branchlets obtained with long-handled pruners were then utilised for all tests described
    in the following sections below, i.e., (a) leaf functional measurements, (b) leaf mineral
    nutrient analysis, and (c) foliar total phenolics. All measurements were undertaken on one
    day in October (30th), 2016. ^p Fernando_2021, The Hattah-Kulkyne National Park includes
    a system of lakes hydrologically connected to the River Murray by an anabranch, Chalka Creek.
    These lakes and surrounding areas are within the bed of a large freshwater paleo-lake (Hattah
    Mega-lake) from the Upper Pleistocene (Kotsonis et al. 1999), evident as grey soil. Immediately
    to the west is the Sunset Country dune field, a system of longitudinal dunes encroaching
    onto the lake system along the western margins of the National Park. ^p Floodplain eucalypt
    woodlands occur on the lacustrine sediments of Hattah Mega-lake, with River Red Gum woodlands
    on lower-lying areas, and Black Box woodlands on slightly higher and less frequently-flooded
    areas (MDBA 2012). Black Box woodlands also occur in some inter-dunal swales (Kotsonis et
    al. 1999). Three sites utilised in an earlier pilot study by Fernando et al. (2018) were
    included here, with sites H1 and H2 on the riparian fringes of Lakes Konardin and Woterap,
    and H3 on a flood-out area ~ 200 m west of Lake Mournpall. All three sites are on lacustrine
    sediments overlain by dune sands (Kotsonis et al. 1999). Climate for the study area is semi-arid,
    with low-variable rainfall and high temperatures. Annual rainfall at the closest weather
    station, Ouyen, was 374.2 mm in 2017, compared with the long-term mean of 329.6 mm (Bureau
    of Meteorology, Australia (http://www.bom.gov.au/). ^p Five trees within each site were
    sampled between July 4, 2017 and July 13, 2018. Eight field visits were undertaken during
    this time, commencing just prior to water release to the Chalka Creek in July 2017. Environmental
    water allocation to the Hattah Lakes system was made by pumping water from the Murray River
    into the Chalka Creek. Surface inundation at the study sites were variously observed between
    August and December 2017. Since assessment of below-ground movement of floodwaters was beyond
    the scope of this study, surface floodwater at each site was taken as an indication that
    water was accessible to the root systems of all five study trees per site, with maximum
    surface water coverage for the entire study area observed in October 2017 at all sites.
    These woodlands were structurally open, with sparse woody shrub understories and insubstantial
    ground litter ranging from light to virtually absent. ^p Fernando_2021_2, The field site,
    Lake Konardin (34°41′35.05″S, 142°21′2.11″E), is one of numerous interconnecting floodplain
    lakes in the Hattah Kulkyne National Park, Australia (Fernando et al. 2018a). Natural water-flows
    into these lakes from the Chalka Creek tributary off the Murray River is supplemented by
    a managed process termed ''environmental watering'' where in this case, river water is pumped
    into the feeder creek (Fernando et al. 2021). Three field samplings of black box leaves
    were conducted as follows, across two time-points linked to a managed watering cycle that
    was initiated in early July 2017 (a) on 9 December 2017, from an inundated black box tree
    that had been receiving floodwaters continuously for at least 3 months before sampling;
    (b) on 9 December 2017, from a black box tree on dry ground, well beyond the reach of floodwaters,
    and (c) on 13 July 2018, from tree (a) at least 5 months after surface waters had fully
    receded. In the field, harvested leaves were stored cool in just-moist packaging so as to
    retain their field freshness for laboratory processing within 24 h. The youngest fully expanded
    leaves at the growing tips of branchlets were selected for the ''young'' category, and the
    oldest, highly sclerophyllous, largest leaves lower down along branchlets were selected
    for the ''mature'' category. These two categories were visually very distinct.
  original_file: data extracted from the three source PDFs
  notes: Data from three studies of the same Black Box trees and sites at Hattah Lakes, linked
    by source_id, Fernando_2018 (pilot study, October 2016), Fernando_2021 (eight samplings,
    July 2017 to July 2018) and Fernando_2021_2 (microprobe study, December 2017 and July 2018).
    Data for additional traits leaf_crude_protein_per_dry_mass, leaf_NS_ratio, leaf_NK_ratio,
    leaf_anatomy_symmetry, leaf_intercellular_spaces, leaf_cuticle_presence, leaf_orientation,
    plant_tolerance_drought and the SEM-EDS line-scan concentrations (leaf_tissue_N/K/Mg/Na/P/Cl_microprobe_linescan)
    remain in raw/trait_data.csv. Approximate values read by the authors from figures (leaf
    Si ~250 and ~375-475 mg/kg; leaf Na around 3000-6000 mg/kg) are excluded in custom_R_code,
    as is the Fernando_2018 intercellular CO2 value for Site 1 dry, which the authors describe
    as anomalous.
