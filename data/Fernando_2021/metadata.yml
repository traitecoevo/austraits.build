contexts:
- context_property: leaf age
  category: method_context
  var_in: leaf_age
  values:
  - value: mature
    description: Oldest, largest, highly sclerophyllous leaves lower down along branchlets.
  - value: young
    description: Youngest fully expanded leaves at the growing tips of branchlets.
  - value: young and mature
    description: Young and mature leaves together.
- context_property: inundation status
  category: treatment_context
  var_in: inundation_status
  values:
  - find: wet (just within waterline; inundated ~4 days)
    value: inundated ~4 days
    description: trees just within the waterline, inundated for around 4 days at sampling
  - find: wet (just within waterline; inundated ~7 days)
    value: inundated ~7 days
    description: trees just within the waterline, inundated for around 7 days at sampling
  - find: dry (>=20 m from waterline; pre-inundation reference)
    value: not inundated
    description: trees at least 20 m from the waterline, beyond the reach of floodwaters
  - find: pooled across environmental watering cycle (pre-, during and post-inundation)
    value: pooled across inundation cycle
    description: values pooled across samplings before, during and after inundation
  - find: sampling 2 (surface water first observed at some H1 trees)
    value: early inundation
    description: sampled when surface water first reached some trees
  - find: sampling 3 (surface water at all trees)
    value: inundated
    description: sampled with surface water present around all trees
  - find: sampling 5 (surface water present at some trees; second soil-moisture peak)
    value: late inundation
    description: sampled with surface water still present around some trees, at peak soil moisture
  - find: sampling 6 (post-inundation drying phase)
    value: post-inundation drying phase
    description: sampled post-inundation during drying phase
  - find: sampling 8 (post-inundation, dry)
    value: post-inundation dry
    description: sampled post-inundation, dry
  - find: flooded (inundated continuously >=3 months)
    value: flooded >=3 months
    description: tree receiving floodwaters continuously for at least
      3 months before sampling.
  - find: never flooded (dry ground beyond floodwaters)
    value: never flooded
    description: tree on dry ground well beyond the reach of floodwaters.
  - find: post-flood (>=5 months after surface waters receded)
    value: post-flood
    description: sampled at least 5 months after surface waters had
      fully receded.
traits:
- var_in: leaf_P_per_dry_mass
  unit_in: mg/kg
  trait_name: leaf_P_per_dry_mass
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Fernando_2018, 20-25 of the largest, most mature leaves and, separately, the youngest
    fully expanded leaves were pooled per tree, oven dried (70 °C), ground, microwave-digested
    (0.2 g) in 10 ml concentrated HNO3, diluted to 35 ml and quantified by ICP-MS against
    equivalently acidified standards. Fernando_2021, young (youngest fully expanded) and mature
    (oldest, largest, highly sclerophyllous) leaves were collected per tree as two bulk samples
    of 10-20 leaves, oven dried (70 °C), ground, microwave-digested (0.2 g) in 10 mL concentrated
    HNO3 and analysed by ICP-MS; C and N by high-temperature combustion (LECO TruMac). Fernando_2021_2,
    six samples, each of 10-20 bulked and ground oven-dried young or mature leaves from a
    single tree, analysed by the method of Fernando et al. (2018).
