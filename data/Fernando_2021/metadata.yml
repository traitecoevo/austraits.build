exclude_observations: .na
questions:
  question1: The three papers report the same trees and sites. The Fernando_2021_2 (AJB) trees sampled at Lake Konardin on 9 December 2017 and 13 July 2018 coincide with Fernando_2021 samplings 5 and 8 at site H1, and tree (a) is probably one of the H1 trees T2 or T3 (surface water present at both on 9 December). The bulk leaf values may therefore overlap with the Fernando_2021 data. Check with the authors.
  question2: In Fernando_2021 Table 2 the young-leaf 'actual value' column repeats the mature-leaf values exactly; only the log means differ. The text confirms that Cu 3.16 and Fe 56.96 mg/kg are mature-leaf values, so these are mapped as mature leaves only and young-leaf means are not used. Table 2 gives n = 24 ('3 mediums, 8 samplings'); replicates set to 15 trees (5 trees x 3 sites).
  question3: Units corrected from the printed text. Fernando_2021 reports young-leaf Al as mg/g (4.90, 19.0, 25.67, 69.0), which must be mg/kg; Fernando_2018 Table 4 prints CER and ICC as mmol CO2, which must be umol CO2 (values 7-14 /m2/s and ~250 /mol). unit_in is set accordingly.
  question4: Fernando_2021 results-text means (December 2017, February 2018, August/September 2017 vs July 2018) do not state whether the +/- values are SE or SD, or n; the Methods only mention SE of the means.
  question5: plant_tolerance_salt is mapped to halophyte_moderate from the authors' interpretation of high foliar Na ('highly salt tolerant by foliage accumulation') rather than a tolerance trial (curator decision).
  question6: Inundation status is mapped as a treatment_context, so Fernando_2021_2 tree a gets separate populations for its flooded and post-flood samplings although it is the same tree (individual_id 'tree a').
