- var_in: plant_tolerance_salt
  unit_in: .na
  trait_name: plant_tolerance_salt
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Fernando_2021_2, 'Elevated foliar Na concentrations of ~2000-6000 mg kg-1 observed
    here (Table 1) add to emerging evidence that black box at the Hattah Lakes site is highly
    salt tolerant by foliage accumulation.' Scored from the authors' interpretation of foliar
    Na concentrations.
