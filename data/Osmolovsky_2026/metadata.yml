  collection_date: 2023-11/2024-03
  taxon_name: species
  location_name: location
  description: Pollination syndrome classification for alpine plant species native
    to Kosciuszko National Park, NSW, Australia, studied as part of a comparison
    of pollen limitation and selfing success between uphill-shifting and non-shifting
    species.
  basis_of_record: field_experiment
  life_stage: adult
  sampling_strategy: We conducted our study in alpine vegetation in Kosciuszko
    National Park, New South Wales, Australia (36.4317° S, 148.3289° E) between
    November 2023 and March 2024. Our study sites spanned from 1700 to 2210 m a.s.l.
    in elevation (see Appendix S1 for a full list of the sampled locations, their
    elevation and coordinates). Precipitation in the alpine zone (1850-2210 m a.s.l.;
    Costin et al.) ranges from 1800 to 3100 mm per year, with 60% of the precipitation
    falling as snow (Green and Osborne). Over the last 60 years, the area experienced
    an increase in annual temperatures and a decline in snow depth and the duration
    of snow cover (Hennessy et al.; Bhend et al.). The vegetation is characterised
    by low-growing shrubs, grasses and forbs (Bear et al.). ^p We chose six species from a study on the range shifts of 36 alpine plant species
    native to Kosciusko National Park (Auld et al.). We chose three species that
    displayed significant uphill range shifts and three species that did not exhibit
    significant changes to their distribution. These species were easily distinguishable
    from other species, were flowering during the sampling season (late November-early
    March), with flowers that were easy to hand-pollinate and were abundant at the
    three points of distribution we sampled. We preferentially selected species
    that were resurveyed during the 2020 survey. ^p Five of the six species in our study are monoecious with hermaphroditic flowers
    (Costin et al.), with Aciphylla glacialis as the only dioecious species (Pickering).
    While some information exists regarding the phenology and the visiting pollinators
    of some of the species (Mitchell-Storey; Milla and Encinas-Viso; Inouye and
    Pyke), only two studies explored self-compatibility in two of the species (Prasophyllum
    tadgellianum and Pentachondra pumila), suggesting that they might be obligate
    outcrossers (Freestone; Godley). However, these studies were conducted in the
    Alpine National Park in Victoria, Australia (Freestone) and in New Zealand (Godley)
    and regional differences in reproductive mechanisms might exist.


    We performed pollination treatments on four of the chosen species (Table 1),
    because Aciphylla glacialis and Pappochroma setosum mostly finished flowering
    by the beginning of the sampling period. We sampled three positions of each
    species'' distribution, the upper and lower range edges and the distribution
    core (overall, we sampled 18 sites). Range edges were selected based on the
    lower-most and upper-most locations where each species was previously observed
    and recorded. We then checked if the species was present at the indicated locations.
    If we were unable to locate the species, we searched for lower/higher locations
    within an elevation range of 200 m of the lowermost and uppermost edges. We
    could not locate any individuals at a previously recorded lower edge for Dichosciadium
    ranunculaceum var. ranunculaceum, opting for a higher reported position as the
    new edge. Because our study focused on understanding reproductive dynamics
    of uphill and non-shifting species, we excluded several species initially considered
    for the study, but for which we were unable to identify the upper edge population
    within 200 m of elevation from the indicated location. Core positions were
    chosen as close as possible to the centroid of the distribution. At each location,
    we ensured a minimum of 5 m distance between the sampled area and any trail
    or road and that at least 15 individuals were present, as some of the individuals
    were used as pollen donors and some individuals were used as pollen acceptors.
    All the edge positions we observed had at least 15 individuals. ^p At each site, we randomly chose 10 individuals as the target individuals for
    pollination treatments. We used a compass and a random number generator to
    assign direction and distance to the next individual, marking the closest plant
    in that direction and distance. We never backtracked our steps, ensuring a
    distance of at least a two-canopy distance between one sampled individual and
    the next (2-10 m, depending on the species). We aimed to choose individuals
    with a mix of open and unopened buds, skipping individuals that were not flowering
    or only had senescent flowers. Next, we collected anthers or flowers bearing
    anthers from 5 to 20 donor individuals, each located at least 10 m away from
    the target individuals. The collected pollen was used for all subsequent pollen
    supplementation treatments. ^p On each of the target individuals, we performed 1-3 of the three possible pollination
    treatments (i.e., more than one pollination treatment was performed on each
    individual), Open pollination. Pollen supplementation. We applied pollen collected
    from nearby donor plants to the stigmas of open flowers, using a fine paintbrush
    (Arnell et al.). Pollinator exclusion. We covered unopened buds with mesh bags
    (Figure 1d). ^p We covered the open pollination and pollen supplementation flowers or inflorescences
    (in Prasophyllum tadgellianum) with fine mesh bags, after the pollen was applied
    to the pollen supplementation treatment, to reduce the potential loss of fruits
    and seeds. In both the open pollination and pollen supplementation treatments,
    we ensured that flowers were fully open and were exposed to native pollinators
    prior to covering them with mesh bags. While we randomly chose and assigned
    open and pollen supplementation treatments to open flowers, in both cases,
    we visually ensured that the flowers were mature, with receptive stigmas. The
    number of treatments and replicates depended on the flower arrangement of each
    species. On shrubby plants (e.g., Nematolepis ovatifolia) and plants with flowers
    arranged in rosettes (e.g., Dichosciadium ranunculaceum var. ranunculaceum),
    we assigned treatments to three randomly chosen sections on the target plants.
    At each section, we covered the nearest unopened bud (or buds, if they were
    on the same branch). Next, we randomly assigned the open and pollen supplementation
    treatments to the nearest open flowers or flower-bearing branches. If the plant
    was more than 1 m in diameter, we sampled within 1 m of the first point encountered
    when locating the 10 individuals. While there might be a difference in resource
    allocations between different flowers on the same individual (Diggle), we randomly
    assigned flowers for each treatment. Further, using only one pollination treatment
    per individual would have introduced a between-individual variability in seed
    number between the treatments. ^p In Prasophyllum tadgellianum, the flowers are arranged in a spike. We thus performed
    up to two treatments on each spike, marking the treatments by tying coloured
    ribbons below the flowers included in each treatment. Any unopened flowers
    on a stalk were assigned to a pollinator exclusion treatment. Because different
    flowers on the spike get different resource allocation, with flowers at the
    lower parts of the spike often getting more resources, which might affect the
    number of produced seeds (Diggle), we randomly allocated the open pollination
    and pollen supplementation treatments to different parts of open, but not senescent
    flowers on each spike. However, in plants where the flowers at the top of the
    spike were unopened, we always assigned pollinator exclusion treatments to
    these plants. We are aware that this might skew the number of resulting seeds;
    however, we applied pollinator exclusion treatments to fully unopened spikes
    in all populations. Senescent and fruiting flowers were removed from the flowering
    stalks. We then covered the whole stalk with a mesh bag. We ensured that flowers
    could not touch each other by covering them with larger mesh bags that allowed
    good spatial separation between the flowers, thus avoiding any potential pollen
    transfer between different flowers on the same plant. For each target individual,
    we recorded the number of treatments and the overall number of flowers within
    each treatment. ^p We performed pollination treatments on 1950 flowers across 120 individuals
    of two uphill and two non-shifting species. However, in some locations, we
    had fewer final replicates and treatments than the initial number of treatments
    performed because animals and park visitors removed or disturbed our samples,
    resulting in only 1254 fruits collected. Only 23 fruits remained at the distribution
    core of Prasophyllum tadgellianum and no replicates of the pollinator exclusion
    treatment remained at the lower edge of Dichosciadium ranunculaceum var. ranunculaceum
    (see doi.org/10.6084/m9.figshare.28561100 for a full list of assigned
    and collected treatments). ^p We collected the resulting fruits and seeds from all but one species approximately
    1 month after pollination. We collected the fruits of Pentachondra pumila 2
    months after pollination because fruits in this species take longer to reach
    maturity (Costin et al.). Before the seeds in each collected fruit were counted,
    we stored them in paper bags, ensuring dry conditions. In Prasophyllum tadgellianum,
    we sampled the seeds in three randomly selected fruits from each treatment,
    after ensuring that the average number of seeds from the three fruits was close
    to the average number of seeds in each treatment. ^p In summary, the seeds from the collected treatments allowed us to test whether
    pollen limitation in all the sampled species at all the distribution positions,
    compare the overall selfing capacity between all the species (at all the positions)
    and compare the selfing capacity between the upper edge and core of uphill-shifting
    species, but not the lower range edge.
