dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::mutate(
        location_name = "Currency Creek Arboretum",
        individual_id = paste(Species, Tree_ID, sep = "_")
      )
    '
  collection_date: 2022-08/2023-08
  taxon_name: Species
  location_name: location_name
  individual_id: individual_id
  description: A common garden study using pairs of closely related Eucalyptus species
    that contrast in either the temperature or the precipitation of their climate
    of origin, to disentangle the separate influences of temperature and precipitation
    on the evolution of wood anatomical traits underpinning plant hydraulics.
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: All plant material was collected from Currency Creek Arboretum
    (CCA), a common garden in south-east South Australia (-35.4288, 138.7611). CCA
    is a relatively homogenous garden of over 10 000 mature trees of 952 Eucalyptus
    species and subspecies varying in age from 1 to 30 years old, planted in blocks
    where all trees within a block are of the same age. Originally, four individuals
    of each species were planted as tube stock in 5 m wide rows, approximately 4 m
    apart within each row. The site experiences a Mediterranean climate with mean
    annual precipitation and temperature of 581 mm and 15.3°C, respectively (long-term
    data from nearest weather station). A total of 58 species of Eucalyptus were sampled
    at the end of the Australian winters of August 2022 and August 2023. All trees
    sampled were reproductively mature plants (minimum age of 5 years old). Where
    available, the three healthiest trees (replicates) of each species were sampled.
    However, in some instances, we were only able to sample two (for three species)
    or one individual (for seven species) per species, due to limited healthy foliage
    or death in the other replicates. For each tree, an approximately 1 m long sun-exposed
    branch, ideally located in the mid-canopy position, was selected and cut. Branches
    were placed in large garbage bags with moist paper towel to reduce dehydration
    and transported off-site for processing. From each branch, a twig with undamaged,
    healthy leaves was chosen, located approximately 20 cm (19-21 cm) from the branch
    tips. A 1-2 cm segment was excised from these twigs and preserved in 70% ethanol
    for wood anatomy analysis.
  original_file: Supporting Information for manuscript
  notes: Additional traits, 'Relative pith area' (pith area as a proportion of twig
    cross-sectional area, excluding bark) and 'VWT/D' (ratio of vessel wall thickness
    to vessel diameter, an index of vessel implosion resistance). Climate-of-origin
    variables (MAP, MAT, PDQ, MTCM, MAFD) and the phylogenetically independent contrast
    pairings are given in Table 1 and Supporting Information Table S1 of the primary
    reference and are not included.
