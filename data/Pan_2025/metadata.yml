    and adjacent VTs (Figure 1). [...] VLF is the percentage of cumulative vessel
    area (A, um2) in cross-sectorial area analysed.'
- var_in: Vessel wall thickness (um)
  unit_in: um
  trait_name: stem_vessel_wall_thickness
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 1
  methods: Measurements of anatomical traits were taken from wood transverse sections.
    10-30 um thick sections were obtained with sliding microtomes (Leica SM2010R;
    Leica Microsystems and Reichert, Vienna, Austria). The sections were initially
    stained in a 1% safranin solution in 50% ethanol for 2 min (Sigma-Aldrich, Castle
    Hill, Australia), after which they were rinsed with distilled water. Subsequently,
    they were stained with a 1% Astra Blue solution for 30 min (Australian Biostain
    Pty Ltd, Traralgon, Australia), followed by another rinse. Finally, the sections
    were gradually dehydrated in a series of ethanol solutions (50%, 75%, and 99%),
    with each dehydration step lasting for 2 min (Kotowska et al. 2020). After dehydration,
    the sections were mounted on glass slides with glycerol (Sigma-Aldrich, Castle
    Hill, Australia) or Euparal (BioQuip Products, Rancho Dominguez, USA) and dried
    at 60°C for 72 h. For each sample, 10-16 digital images were captured at random
    spots with various magnifications (2×, 4×, 20×, and 40×), using a light microscope
    (Model BX60; Olympus, Tokyo, Japan) fitted with a high-resolution digital camera
    (Leica DFC 500; Leica Microsystems). ^p Anatomical traits were determined using
    Fiji software (Schindelin et al. 2012). Bark was excluded for all analyses. [...]
    At 20× or 40× magnification, we captured 6-10 random images for each sample. VWT
    was measured directly using the straight-line tool in Fiji. As illustrated in
    Figure 1, the thickness of yellow lines, in the direction perpendicular to each
    vessel, indicate wall thickness. Measurements were taken at multiple locations
    along each vessel wall, and the average of these measurements was calculated to
    represent the overall wall thickness for each vessel.
- var_in: Theoretical conductivity (kg s-1 m-1 MPa-1)
  unit_in: kg/m/MPa/s
  trait_name: sapwood_specific_hydraulic_conductivity_theoretical
  entity_type: individual
  value_type: raw
  basis_of_value: model_derived
  replicates: 1
  methods: Measurements of anatomical traits were taken from wood transverse sections.
    10-30 um thick sections were obtained with sliding microtomes (Leica SM2010R;
    Leica Microsystems and Reichert, Vienna, Austria). The sections were initially
    stained in a 1% safranin solution in 50% ethanol for 2 min (Sigma-Aldrich, Castle
    Hill, Australia), after which they were rinsed with distilled water. Subsequently,
    they were stained with a 1% Astra Blue solution for 30 min (Australian Biostain
    Pty Ltd, Traralgon, Australia), followed by another rinse. Finally, the sections
    were gradually dehydrated in a series of ethanol solutions (50%, 75%, and 99%),
    with each dehydration step lasting for 2 min (Kotowska et al. 2020). After dehydration,
    the sections were mounted on glass slides with glycerol (Sigma-Aldrich, Castle
    Hill, Australia) or Euparal (BioQuip Products, Rancho Dominguez, USA) and dried
    at 60°C for 72 h. For each sample, 10-16 digital images were captured at random
    spots with various magnifications (2×, 4×, 20×, and 40×), using a light microscope
    (Model BX60; Olympus, Tokyo, Japan) fitted with a high-resolution digital camera
    (Leica DFC 500; Leica Microsystems). ^p Anatomical traits were determined using
    Fiji software (Schindelin et al. 2012). Bark was excluded for all analyses. [...]
    Therefore, we excluded VTs in our measurements and in calculations of theoretical
    hydraulic conductivity. [...] Individual vessel area (A, um2) was measured directly
    by Fiji. [...] Vessel diameter (D, um) was calculated as D = sqrt(4A/pi). We then
    used individual vessel diameters to calculate hydraulically-weighted mean vessel
    diameter (Dh, um) as Dh = sum(D^5)/sum(D^4). Vessel density (VD, n mm-2) was calculated
    as the number of vessels per cross-sectional area. Theoretical conductivity (Kth,
    kg s-1 m-1 MPa-1) was calculated as Kth = (pi*Dh^4/(128*eta))*VD*rho, in which
    eta (MPa s) is the viscosity of water and rho (kg m-3) is the density of water.
    Both eta and rho are temperature dependent. We calculated eta as eta = 1.95 ×
    10^14/T^7, in which T is the temperature of liquid water in K, the unit of eta
    here is N s m-2 (Roderick and Berry 2001). rho refers to Table 2 in Bigg (1967).
