    spots with various magnifications (2×, 4×, 20×, and 40×), using a light microscope
    (Model BX60; Olympus, Tokyo, Japan) fitted with a high-resolution digital camera
    (Leica DFC 500; Leica Microsystems). ^p Anatomical traits were determined using
    Fiji software (Schindelin et al. 2012). Bark was excluded for all analyses. [...]
    Therefore, we excluded VTs in our measurements and in calculations of theoretical
    hydraulic conductivity. [...] At 4×, we obtained two to four images showing 1/2
    or 1/4 of a stem cross-section, and we selected two to four fan-shaped areas to
    analyze the vessel properties (Supporting Information: Figure S2D-F). Individual
    vessel area (A, um2) was measured directly by Fiji. An area threshold (≥ 100 um2)
    was first used to automatically collect large vessels. For small-diameter vessels,
    manual measurements were used. In most cases, solitary vessels are much wider
    in diameter than VTs in Eucalyptus which made it easier to distinguish vessels
