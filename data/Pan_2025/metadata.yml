traits:
- var_in: Hydraulic diameter (um)
  unit_in: um
  trait_name: stem_vessel_diameter_hydraulic
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'Measurements of anatomical traits were taken from wood transverse sections.
    10-30 um thick sections were obtained with sliding microtomes (Leica SM2010R;
    Leica Microsystems and Reichert, Vienna, Austria). The sections were initially
    stained in a 1% safranin solution in 50% ethanol for 2 min (Sigma-Aldrich, Castle
    Hill, Australia), after which they were rinsed with distilled water. Subsequently,
    they were stained with a 1% Astra Blue solution for 30 min (Australian Biostain
    Pty Ltd, Traralgon, Australia), followed by another rinse. Finally, the sections
    were gradually dehydrated in a series of ethanol solutions (50%, 75%, and 99%),
    with each dehydration step lasting for 2 min (Kotowska et al. 2020). After dehydration,
    the sections were mounted on glass slides with glycerol (Sigma-Aldrich, Castle
    Hill, Australia) or Euparal (BioQuip Products, Rancho Dominguez, USA) and dried
    at 60°C for 72 h. For each sample, 10-16 digital images were captured at random
    spots with various magnifications (2×, 4×, 20×, and 40×), using a light microscope
    (Model BX60; Olympus, Tokyo, Japan) fitted with a high-resolution digital camera
    (Leica DFC 500; Leica Microsystems). ^p Anatomical traits were determined using
    Fiji software (Schindelin et al. 2012). Bark was excluded for all analyses. [...]
    Therefore, we excluded VTs in our measurements and in calculations of theoretical
    hydraulic conductivity. [...] At 4×, we obtained two to four images showing 1/2
    or 1/4 of a stem cross-section, and we selected two to four fan-shaped areas to
    analyze the vessel properties (Supporting Information: Figure S2D-F). Individual
    vessel area (A, um2) was measured directly by Fiji. An area threshold (≥ 100 um2)
    was first used to automatically collect large vessels. For small-diameter vessels,
    manual measurements were used. In most cases, solitary vessels are much wider
    in diameter than VTs in Eucalyptus which made it easier to distinguish vessels
    from VTs in the transverse sections by their relative size and locations. Another
    criterion for identifying VTs is the presence of bordered pits between a vessel
    and adjacent VTs (Figure 1). Vessel diameter (D, um) was calculated as D = sqrt(4A/pi).
    We then used individual vessel diameters to calculate hydraulically-weighted mean
    vessel diameter (Dh, um) as Dh = sum(D^5)/sum(D^4).'
