- var_in: Vessel lumen fraction
  unit_in: mm2/mm2
  trait_name: stem_vessel_lumen_fraction
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'Measurements of anatomical traits were taken from wood transverse sections.
    10-30 um thick sections were obtained with sliding microtomes (Leica SM2010R;
    Leica Microsystems and Reichert, Vienna, Austria). The sections were initially
    stained in a 1% safranin solution in 50% ethanol for 2 min (Sigma-Aldrich, Castle
