questions:
  question1: 'Stemodia anisata growth form: the description says Prostrate shrub to 10 cm
    high ... with woody stems, the key says Prostrate forb. Both are in data.csv; the
    description (shrub, woodiness woody) is mapped because the taxon own text ranks above
    the key. Confirm, or map both (shrub herb).'
  question2: 'S. anisata grows in seasonally inundated low-lying areas with sandy soils.
    plant_growth_substrate is terrestrial, not semiaquatic, because nothing names a swamp
    or standing water. Confirm.'
  question3: 'Values the Affinities text states for the species compared (erect for S.
    tephropelina, versus linear for S. glabella, pedicels 1--10 mm long for S.
    tephropelina, seeds papillose) are scored for those species. Characters of Stemodia
    sp. Tanami are the author reading of an image on the Flora NT website. Confirm both
    should be kept.'
  question4: 'Stemodia sp. Tanami is written as printed, (P.K. Latz 8218);
    config/taxon_list.csv has Stemodia sp. Tanami (P.K.Latz 8218), without the space. Left
    for APCalign.'
  question5: 'Mappings to check: seed surface lacunose -> pitted; papillose and minutely
    papillose -> bumpy; corolla purple or mauve -> blue_purple; forb -> herb; corolla
    fused for most of its length -> connate; corolla length -> flower_length (entity
    measured corolla).'
  question6: 'The two Northern Territory specimens cited under S. anisata bear the phrase
    name Stemodia sp. Manners Creek, whose own voucher (T.S.Henshall 1779) Bean says is
    Elacholoma prostrata. Nothing is scored for Stemodia sp. Manners Creek; the vouchers
    file records it.'
