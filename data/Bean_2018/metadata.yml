source:
  dataset:
    key: Bean_2018
    bibtype: Article
    year: 2018
    author: A. R. Bean
    title: Stemodia anisata A.R.Bean (Plantaginaceae), a new species from Queensland and the Northern Territory
    journal: Austrobaileya
    volume: 10
    number: 2
    pages: 242--246
    doi: 10.5962/p.299905
contributors:
  data_collectors:
  - last_name: Bean
    given_name: Anthony
    ORCID: 0000-0001-5697-1664
    affiliation: Queensland Herbarium, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait %in% c(
          "bracteole_length", "flower_anther_colour", "flower_anther_length",
          "flower_colour", "flower_fertile_stamens_count", "flower_filament_length",
          "flower_length", "flower_petal_fusion", "flower_sepal_length",
          "flowering_time", "flowers_per_inflorescence", "fruit_dehiscence",
          "fruit_length", "fruit_shape", "fruit_type", "fruiting_time",
          "inflorescence_type", "leaf_apex_shape", "leaf_hairs_adult_leaves",
          "leaf_length", "leaf_length_to_width_ratio", "leaf_margin",
          "leaf_phyllotaxis", "leaf_shape", "leaf_type", "leaf_width", "parasitic",
          "pedicel_length", "plant_growth_form", "plant_growth_substrate",
          "plant_height", "plant_photosynthetic_organ", "plant_width", "seed_colour",
          "seed_length", "seed_shape", "seed_surface_texture", "stem_growth_habit",
          "stem_hairs", "woodiness_detailed"
        )
      ) |>
      dplyr::mutate(
        source_rank = dplyr::if_else(grepl("^Key", source_section), 2, 1)
      ) |>
      dplyr::group_by(taxon_name, trait, entity_measured) |>
      dplyr::filter(source_rank == min(source_rank)) |>
      dplyr::ungroup()
    '
  collection_date: '2018'
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  description: 'To describe a new species of Stemodia from far western Queensland and the
    adjacent Northern Territory, and to provide a key to the Queensland species of
    Stemodia.'
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'This study is based on a morphological examination of specimens held
    at BRI, and photographic images of specimens held at DNA. The measurements for
    corolla, stamens and style are based on material reconstituted with hot water; other
    plant parts were measured from dried material.'
  original_file: 'Plantaginaceae Stemodia anisata new_species Bean_2018 Austrobaileya
    part299905.pdf (BHL copy of Austrobaileya 10(2): 242--246)'
  notes: 'data.csv is raw/trait_data.csv (a hand transcription of every clause of the paper,
    checked on the page images) with trait_scoring_method added from rank_scored_from
    (inferred_from_species_group for a key lead covering several species, inferred for
    typical values stated only when atypical). Type and cited specimens are in
    raw/Bean_2018_vouchers.csv. data.csv also carries two unmapped per-taxon columns from
    raw/Bean_2018_taxa.csv: treatment_type (1 new species, 8 not described; not described
    = key, Affinities or Notes only) and original_concept_year, the year of the earliest
    name for the taxon concept as cited in the paper (blank where the paper gives no
    year). Only Stemodia anisata is described. The other Queensland species are scored
    from the key, S. glabella and S. tephropelina also from the values the Affinities text
    states for them, and Stemodia sp. Tanami from the author reading of an image on the
    Flora NT website. When a taxon has a character in the text and the key, custom_R_code
    keeps the text for each taxon, trait and part measured. Numbers in a key lead covering
    several species are kept in *_class candidates, not copied to each species. Candidate
    traits not yet in traits.yml (unmapped, dropped in custom_R_code):
    anther_locule_count, associated_species, bracteole_arrangement, bracteole_count,
    bracteole_position, bracteole_shape, bracteole_to_sepal_length_ratio,
    bracteole_to_sepal_length_ratio_class, bracteole_width_relative_to_sepals,
    calyx_persistence, conservation_status, corolla_hair_type, corolla_hairs,
    corolla_lobe_count, corolla_lobe_fusion, corolla_lobe_length, corolla_lobe_shape,
    corolla_shape, corolla_throat_width, corolla_tube_colour, corolla_tube_length,
    distribution_description, flower_attachment, flowers_per_inflorescence_class,
    fruit_dehiscence_type, fruit_enclosure, habitat_description, habitat_terms,
    leaf_abaxial_hairs, leaf_adaxial_hairs, leaf_attachment, leaf_gland_colour,
    leaf_glands, leaf_hair_colour, leaf_hair_orientation, leaf_hair_type,
    leaf_length_to_width_ratio_class, leaf_midrib_visibility, leaf_scent,
    leaf_secondary_vein_visibility, leaf_size_categorical, leaf_texture, leaves_per_whorl,
    ovary_locule_count, pedicel_elongation, pedicel_hair_length, pedicel_hair_type,
    pedicel_length_class, seed_papillae, sepal_count, sepal_hair_length, sepal_hairs,
    sepal_shape, sepal_size_uniformity, soil_terms, stamen_arrangement, stamen_attachment,
    stem_hair_length, stem_hair_orientation, stem_hair_type, stem_rooting_at_nodes,
    stigma_hairs, stigma_shape.'
