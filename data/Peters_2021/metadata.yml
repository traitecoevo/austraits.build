- var_in: wood density (g cm-3)
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 4--6
  methods: Wood density samples were taken from canopy branches. Samples ranged in
    volume from 0.2 to 10 cm3. Bark was removed from samples and xylem tissue was
    hydrated overnight prior to measurement. Volume was measured using water displacement
    weight and samples were dried at 70°C for 48 h before dry weight was measured.
- var_in: HSM
  unit_in: MPa
  trait_name: hydraulic_safety_margin_50
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 4--6
  methods: Hydraulic vulnerability curves were constructed by measuring hydraulic
    conductivity at progressively more negative xylem pressures. Maximum vessel length
    was measured first, using the air-injection method (Cohen et al., 2003), for all
    species to determine the appropriate technique for measuring hydraulic vulnerability
    (measurement method is available in Table 2). A single branch per measurement
    tree was collected in the early morning (between first light and no more than
    1 h after sunrise) from each of the four to six measurement trees. Sampling occurred
    in the early morning to minimize xylem tension at collection and thus minimize
    cutting artefacts. Branches were between 0.7 and 5 cm diameter at cut end and
    at least 30% longer than maximum vessel length (0.5 m to 2.5 m depending on species).
    Branches were placed in large plastic bags with moist towels to prevent dehydration
    and cut ends were immediately recut under water to allow the relaxation of xylem
    tension in the field. Branches were transported to the laboratory either still
    in water or with wet towels and plastic on cut end (maximum transport time was
    1 h). Branches were stored in a cool, dark area with cut end in water for 6-24
    h before measurements began.
  safety_margin_definition: minimum water potential minus stem P50
- var_in: PSI leaf
  unit_in: MPa
  trait_name: water_potential_midday
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 4--6
  methods: For midday measurements, two leaves on each tree were covered with plastic
    wrap and aluminium foil to stop photosynthesis and transpiration for at least
    30 min before collection (Brodribb et al., 2003; McCutchan & Shackel, 1992). Then
    the two covered leaves and two uncovered leaves were collected for stem and leaf
    water potentials respectively. Leaves were excised, stored in airtight bags in
    a cool dark insulated box until measurement (maximum 1 h). Water potentials were
    measured in the field using a Scholander pressure chamber (Model 1505D, PMS Instruments
    Co.) as described in Scholander et al. (1965). All water potentials were measured
    on clear sunny days at multiple times throughout each visit and the lowest observed
    values are reported here as seasonal minimum water potentials, psimin, and corresponding
    predawn, psipd, and midday leaf, psiLeaf.
  method_context: leaf
- var_in: ks
  unit_in: kg/m/MPa/s
  trait_name: sapwood_specific_hydraulic_conductivity
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3--6
  methods: Maximum conductivity of flushed samples (either as part of hydraulic vulnerability
    measurements or as independent measurements using the flowmeter) was used to calculate
    sapwood-specific conductivity (Ks, kg s-1 m-1 MPa-1). Sapwood area and length
    of stem segment were measured using digital callipers. For two species, flushing
    of stem segments to remove emboli resulted in reduced flow, likely due to mucilage
    build-up in the xylem. For these species, only initial flow measurements were
    taken using the benchtop flowmeter set-up. Kinital was normalized by the pressure
    head, sapwood area and stem length to calculate sapwood-specific hydraulic conductivity.
- var_in: Kth.mean
  unit_in: kg/m/MPa/s
  trait_name: sapwood_specific_hydraulic_conductivity_theoretical
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 1--7
  methods: Branch samples, typically those used for hydraulic conductivity measurements,
    were preserved in 70% ethanol for anatomical analysis. Samples were sectioned
    transversely using a sliding microtome (Leica SM2010R; Leica Microsystems); the
    approximately 20-um thick sections were stained with 0.05% Toluidine blue and
    digitally photographed (ProgRes C14, JenOptik) under a light microscope (Olympus
    BX60). Sections were imaged at 10 and 40 times magnification, and vessel area
    and sapwood area were measured using Image J software (v1.48 Rasband, 2014). Samples
    represent three to seven individual trees of each species, except for Acacia aneura,
    Acacia hemiteles and Eucalyptus moluccana with data coming from only one, two
    and two trees respectively. Theoretical conductivity (Kth; kg s-1 m-1 MPa-1) was
    calculated as Kth = pi Dh^4 / 128 eta x VD x rho, where eta is the viscosity of
    water (1.002 x 10^-9 MPa s) and rho is the density of water (998.23 kg m-3), both
    at 20 degrees C.
- var_in: Dh.mean
  unit_in: um
  trait_name: stem_vessel_diameter_hydraulic
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 1--7
  methods: Branch samples, typically those used for hydraulic conductivity measurements,
    were preserved in 70% ethanol for anatomical analysis. Samples were sectioned
    transversely using a sliding microtome (Leica SM2010R; Leica Microsystems); the
    approximately 20-um thick sections were stained with 0.05% Toluidine blue and
    digitally photographed (ProgRes C14, JenOptik) under a light microscope (Olympus
    BX60). Sections were imaged at 10 and 40 times magnification, and vessel area
    and sapwood area were measured using Image J software (v1.48 Rasband, 2014). Samples
    represent three to seven individual trees of each species, except for Acacia aneura,
    Acacia hemiteles and Eucalyptus moluccana with data coming from only one, two
    and two trees respectively. Each vessel area was used to calculate the vessel
    diameter and the mean hydraulically weighted vessel diameter (Dh; um) was calculated
    as Dh = (sum(D^4)/N)^(1/4), where D is the vessel diameter and N is the number
    of vessels per image.
- var_in: Vdensity.mean
  unit_in: '{count}/mm2'
  trait_name: stem_vessel_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 1--7
  methods: Branch samples, typically those used for hydraulic conductivity measurements,
    were preserved in 70% ethanol for anatomical analysis. Samples were sectioned
    transversely using a sliding microtome (Leica SM2010R; Leica Microsystems); the
    approximately 20-um thick sections were stained with 0.05% Toluidine blue and
    digitally photographed (ProgRes C14, JenOptik) under a light microscope (Olympus
    BX60). Sections were imaged at 10 and 40 times magnification, and vessel area
    and sapwood area were measured using Image J software (v1.48 Rasband, 2014). Samples
    represent three to seven individual trees of each species, except for Acacia aneura,
    Acacia hemiteles and Eucalyptus moluccana with data coming from only one, two
    and two trees respectively. Vessel density (VD; mm-2) was calculated as the number
    of vessels per sapwood area analysed.
- var_in: lma.mean
  unit_in: g/m2
  trait_name: leaf_mass_per_area
  entity_type: population
  value_type: mean
