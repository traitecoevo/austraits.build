dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::filter(Flag_LDMC != "3" | is.na(Flag_LDMC)) |>
      dplyr::mutate(
        taxon_name = dplyr::case_when(
          Species == "ACAC" ~ "Acacia acuminata",
          Species == "COCA" ~ "Corymbia calophylla",
          Species == "EMARG" ~ "Eucalyptus marginata",
          Species == "ESAL" ~ "Eucalyptus salmonophloia",
          Species == "AMYG" ~ "Eucalyptus amygdalina",
          Species == "OBLI" ~ "Eucalyptus obliqua",
          Species == "OVAT" ~ "Eucalyptus ovata",
          Species == "VIMI" ~ "Eucalyptus viminalis subsp. viminalis"
        ),
        LDMC = dplyr::if_else(Flag_LDMC %in% c("1", "2"), NA, as.numeric(LDMC)),
        LMA = dplyr::if_else(
          Flag_LDMC %in% c("1", "2") | Flag_Area %in% c("1") |
            Branchtag == "VIMI-FREY-C-1-c" | Treetag == "ESAL-BEN-C-1",
          NA, as.numeric(LMA)
        ),
        huber_value = dplyr::if_else(Flag_Area %in% c("1"), NA, 1 / as.numeric(Al_As)),
        avg_area = dplyr::if_else(Flag_Area %in% c("1"), NA, as.numeric(avg_area)),
        WD = dplyr::if_else(Branchtag == "ACAC-PER-B-5-1", NA, as.numeric(WD)),
        twig_diameter = as.numeric(Stem_Di_corrected),
        twig_length = as.numeric(Stem_Length),
        WD_diameter = as.numeric(Diameter),
        collection_date = dplyr::case_when(
          Loc == "WA" ~ "2014-11",
          Loc == "Tas" ~ "2016-02"
        )
      ) |>
      dplyr::group_by(
        Treetag, Plottag, Species, taxon_name, Loc, TreeDBH, StandBA, collection_date
      ) |>
      dplyr::summarise(
        dplyr::across(
          c(WD, LMA, LDMC, huber_value, avg_area),
          ~ sum(!is.na(.x)),
          .names = "{.col}_n"
        ),
        dplyr::across(
          c(WD, LMA, LDMC, huber_value, avg_area),
          ~ dplyr::if_else(all(is.na(.x)), NA_real_, mean(.x, na.rm = TRUE))
        ),
        dplyr::across(
          c(twig_diameter, WD_diameter),
          ~ dplyr::if_else(all(is.na(.x)), NA_real_, round(mean(.x, na.rm = TRUE), 2))
        ),
        twig_length = dplyr::if_else(
          all(is.na(twig_length)), NA_real_, round(mean(twig_length, na.rm = TRUE), 1)
        ),
        .groups = "drop"
      ) |>
      dplyr::mutate(
        stem_tissue = dplyr::if_else(Species == "ACAC", "sapwood and bark", "sapwood only")
      )
    '
  collection_date: collection_date
  taxon_name: taxon_name
  location_name: Plottag
  individual_id: Treetag
  description: To test whether leaf and stem tissue robustness and leaf-to-stem allocation
    shift consistently with aridity within and across closely related eucalypt species
    and a co-occurring Acacia, whether these traits are coordinated within species,
    and whether within-species trait variation is more constrained at drier sites.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: We collected trait data along two temperate aridity gradients
    (Supporting Information Fig. S1), one in southwest Western Australia (sampled November
    2014) and one in Tasmania (sampled February 2016). Along each gradient, we identified
    three or four dominant eucalypt tree species (from the Eucalyptus or Corymbia genera
    of the Myrtaceae family) that are easily identified in the field and do not widely
    form cryptic hybrids or have notable subspecies within the sampled regions. In Western
    Australia, we sampled Eucalyptus marginata Donn ex Sm., Eucalyptus salmonophloia
    F.Muell., and Corymbia calophylla (Lindl.) K.D. Hill & L.A.S. Johnson. We also opportunistically
    sampled the non-eucalypt Acacia acuminata Benth., which broadly co-occurs with the
    most xeric sampled eucalypt, E. salmonophloia. In Tasmania we sampled Eucalyptus
    amygdalina Labill., Eucalyptus obliqua L'Hér., Eucalyptus ovata Labill., and Eucalyptus
    viminalis subsp. viminalis Labill, all of which cover the majority of their global
    precipitation range within Tasmania. All focal species are evergreen, dominant or
    co-dominant canopy trees with the exception of Acacia acuminata, which is a small
    tree/tall shrub. All focal species are common in multiple vegetation types and are
    both habitat generalists (i.e. not riparian affiliated) and soil type generalists
    with the exception of E. marginata, which is a habitat generalist but principally
    occurs on ironstone-derived soils. Collectively, sampled sites spanned a mean annual
    precipitation range of 328-1574 mm yr-1 (328-1189 mm in Western Australia, 584-1574
    mm in Tasmania). Mean annual temperature spanned 8-20°C and elevation ranged from
    24-620 m asl., with no site experiencing significant frost (mean coldest month minimum
    temperature > 0°C for all sites). Average site climate, soil, DBH (diameter at breast
    height as a proxy for tree size) and stand basal area (measured for each tree with
    a variable radius forestry wedge prism, Tasmania only) can be found in Table S1.
    Sampled tree size and (where measured in Tasmania) stand basal area did not vary
    strongly with aridity for most species (Table S1). ^p Trait measurements were collected
    in a nested hierarchical design with four or five sites sampled per species to capture
    broad climate gradients, three plots per site to capture topographic/edaphic variation,
    five trees per plot to capture within-population variation, and three samples per
    tree to capture within-individual variation (Fig. S1). For each species, four or
    five forestry reserves, national parks, state forests, nature reserves or conservation
    areas were selected to cover as much of each species' precipitation range as possible.
    Each species' precipitation range was determined using collection locations of herbarium
    specimens, initially downloaded from Australia Virtual Herbarium (www.avh.chah.org.au)
    for identifying sampling locations and later validated with expanded occurrence records
    from the Atlas of Living Australia (see species climate distributions and sampling
    coverage in Fig. S3; ala.org.au). Edaphic variation was captured by locating three
    plots that were > 500 m but < 5 km apart and each containing more than five individuals
    of the focal species within a 30 m radius. In each of the three plots, we sampled
    within-population variation by collecting three sun exposed branches from the north
    side of each of five mature, healthy individuals using pole clippers and pull ropes.
    Sampled individuals in a plot were apparently healthy, canopy dominant trees at least
    5 m, but less than 60 m, apart. Our sample design resulted in 180-225 trait measurements
    per species. ^p From each branch, we collected a section c. 8 mm in diameter for
    WD measurement, and a terminal branch (first order branch collected at the point
    of branching) for leaf and HV measurements. We selected terminal branches (typically
    c. 1 mm in diameter, see Table S2 for details) with intact 'mature' leaves (i.e.
    fully expanded, not soft green new growth), although most of the study species flush
    sporadically throughout the year (Davison & Tay, 1989; Heatwole et al., 1997) so
    it was not possible to perfectly control for leaf age. Sampling periods (November
    in Western Australia and February in Tasmania) avoided large leaf flush events for
    all species with the exception of Corymbia calophylla at two of its five sample sites.
    Samples were rehydrated in moist ziplock bags in a cooler for at least 12 h before
    trait measurement (Pérez-Harguindeguy et al., 2013).
  original_file: Data sourced from the authors' GitHub repository (https://github.com/leanderegg/EucTraits).
  notes: Each data.csv row is one branch; three branches were sampled per tree. custom_R_code
    averages the branches of each tree (individual_id = Treetag), with replicates giving
    the number of branches with a value for each trait (columns <trait>_n). Values omitted by the authors in their analysis were
    removed in custom_R_code (LDMC and LMA where Flag_LDMC > 0 (young leaves, damaged or missing leaves), LMA,
    Huber value and leaf area where Flag_Area > 0, and the three outliers the authors
    removed during analysis (WD of ACAC-PER-B-5-1, LMA of VIMI-FREY-C-1-c and LMA of
    tree ESAL-BEN-C-1). The four branches the authors flagged as misidentified samples
    (Flag_LDMC = 3; AMYG-TMP-A-1-a/b/c, possibly E. tenuiramis, and VIMI-FREY-A-5-c,
    possibly E. amygdalina) are removed entirely. The tree means
    of terminal twig diameter (Stem_Di_corrected and length (Stem_Length) are entity contexts of the traits measured
    on the terminal twig (leaf area, LMA, LDMC and Huber value), and the tree mean of
    the oven-dried WD sample diameter (Diameter) is the entity context of wood density.
    Huber value carries a method context for whether the stem area is sapwood only
    (twig diameter measured under the bark) or sapwood and bark (Acacia acuminata).
    Additional traits, leaf herbivory (qualitative, LIGHT/MID/HEAVY/EXTREME), leaf Feret diameter, leaf
    aspect ratio, leaf circularity, leaf roundness and leaf solidity.
identifiers: .na
