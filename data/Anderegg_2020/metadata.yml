contexts:
- context_property: DBH (cm)
  category: entity_context
  var_in: TreeDBH
- context_property: stand basal area (ft2/acre)
  category: entity_context
  var_in: StandBA
- context_property: branch diameter (mm)
  category: entity_context
  var_in: branch_diameter
- context_property: branch length (cm)
  category: entity_context
  var_in: branch_length
- context_property: stem tissue measured
  category: method_context
  var_in: stem_tissue_measured
  values:
  - value: sapwood only
    description: twig diameter measured under the bark, so the stem area excludes bark
  - value: sapwood and bark
    description: twig diameter measured over the bark, so the stem area includes bark
traits:
- var_in: WD
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: WD_n
  branch_diameter: WD_diameter
  methods: From each branch, we collected a section c. 8 mm in diameter for WD measurement,
    and a terminal branch (first order branch collected at the point of branching) for
    leaf and HV measurements. ^p Bark was peeled from branch sections and WD quantified
    from segments roughly 7 cm in length by dividing dry mass (following 72+ h drying
    at 70°C). WD was weakly related to branch diameter for six species (Likelihood Ratio
    Test of a linear mixed effects model with a fixed effect for diameter and site and
    random effects for plot and tree was significant at alpha = 0.05 compared with an
    identical model without diameter), so diameter was included as a covariate in models
    of WD for these species. ^p Wood density is branch dry mass divided by green volume,
    with green volume measured by water displacement. Each value is the mean of the three
    branches sampled per tree.
- var_in: LMA
  unit_in: g/cm2
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: LMA_n
  branch_diameter: twig_diameter
  branch_length: twig_length
  methods: All leaves subtending the selected terminal branch were collected for measurement
    of leaf area, LMA and LDMC. Total fresh one-sided leaf area (including petioles)
    of terminal branch samples was measured with a flatbed scanner and ImageJ image processing
    software (Schneider et al., 2012). Leaves were then oven dried at 70°C to a constant
    weight (typically 48+ h) and their dry mass measured. ^p For each terminal branch
    HV, LMA and LDMC was calculated. Multivariate trait outliers were visually diagnosed
    by plotting all traits against each other for each species and removed (n < 10 per
    trait), as were LMA and LDMC values from still expanding leaves (< 10% of measurements).
    ^p LMA of each terminal twig is the bulked dry mass of all its leaves divided by
    their total area; each value is the mean of the three branches sampled per tree.
    Phyllodes were measured for Acacia acuminata.
- var_in: LDMC
  unit_in: g/g
  trait_name: leaf_dry_matter_content
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: LDMC_n
  branch_diameter: twig_diameter
  branch_length: twig_length
  methods: Samples were rehydrated in moist ziplock bags in a cooler for at least 12
    h before trait measurement (Pérez-Harguindeguy et al., 2013). ^p All leaves subtending
    the selected terminal branch were collected for measurement of leaf area, LMA and
    LDMC. Total fresh one-sided leaf area (including petioles) of terminal branch samples
    was measured with a flatbed scanner and ImageJ image processing software (Schneider
    et al., 2012). Leaves were then oven dried at 70°C to a constant weight (typically
    48+ h) and their dry mass measured. ^p For each terminal branch HV, LMA and LDMC
    was calculated. Multivariate trait outliers were visually diagnosed by plotting all
    traits against each other for each species and removed (n < 10 per trait), as were
    LMA and LDMC values from still expanding leaves (< 10% of measurements). ^p LDMC
    of each terminal twig is the bulked dry mass of all its leaves divided by their rehydrated
    fresh mass; each value is the mean of the three branches sampled per tree. Phyllodes
    were measured for Acacia acuminata.
- var_in: huber_value
  unit_in: mm2{sapwood}/cm2{leaf}
  trait_name: huber_value
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: huber_value_n
  branch_diameter: twig_diameter
  branch_length: twig_length
  stem_tissue_measured: stem_tissue
  methods: We measured branch WD (g dry mass per cm3 fresh volume), LMA (g dry mass
    per cm2 fresh leaf area) and LDMC (g dry mass per g fresh mass) as metrics of stem
    and leaf robustness, and terminal branch HV, the ratio of sapwood area to leaf area
    (mm2 per cm2), as a metric of investment in water transport vs light capture. ^p
    We selected terminal branches (typically c. 1 mm in diameter, see Table S2 for details)
    with intact 'mature' leaves (i.e. fully expanded, not soft green new growth). ^p
    Total fresh one-sided leaf area (including petioles) of terminal branch samples was
    measured with a flatbed scanner and ImageJ image processing software (Schneider et
    al., 2012). Terminal twig basal diameter was measured just above the swelling at
    the branch base after gently peeling back bark (except in A. acuminata, where bark
    was difficult to distinguish from woody tissue). For each terminal branch HV, LMA
    and LDMC was calculated. ^p The data file gives total leaf area of each terminal twig
    per twig cross-sectional area; its inverse is the Huber value of that twig, and each
    value is the mean of the three branches sampled per tree. Phyllodes were measured
    for Acacia acuminata.
- var_in: avg_area
  unit_in: cm2
  trait_name: leaf_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: avg_area_n
  branch_diameter: twig_diameter
  branch_length: twig_length
  methods: All leaves subtending the selected terminal branch were collected for measurement
    of leaf area, LMA and LDMC. Total fresh one-sided leaf area (including petioles)
    of terminal branch samples was measured with a flatbed scanner and ImageJ image processing
    software (Schneider et al., 2012). ^p Mean leaf area of each terminal twig is its total
    leaf area divided by its number of leaves; each value is the mean of the three branches
    sampled per tree. Phyllodes were measured for Acacia acuminata.
substitutions: .na
taxonomic_updates: .na
exclude_observations: .na
questions: .na
