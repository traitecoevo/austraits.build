dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      mutate(flowering_period = convert_month_range_vec_to_binary(flowering_period))
  '
  collection_date: 2017-09/2017-12
  taxon_name: taxon_name
  location_name: location_name
  description: To determine the mating systems (selfing ability, reliance on outcrossing)
    of five common native plant species in urban banksia-woodland fragments in Perth,
    Western Australia, and to identify which insects visit and potentially pollinate
    them, in order to assess the plants' vulnerability to habitat fragmentation and
    pollinator loss.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'We selected three fragments of native banksia woodland vegetation
    near Perth, Western Australia: Classon Park Leeming (32 degrees 04''56.69"S,
    115 degrees 51''34.22"E), Nicholson Road Reserve (32 degrees 03''02.64"S, 115
    degrees 55''57.19"E) and Wireless Hill (32 degrees 1''46.99"S, 115 degrees 49''45.99"E).
    All three sites experience a Mediterranean-type climate with cool winters and
    hot summers (mean maximum annual temperature, 24.8 degrees C; mean minimum annual
    temperature, 12.8 degrees C), and rainfall is ~732 mm per year (Bureau of Meteorology
    2018). Having selected five plant species, we opted to focus our efforts on
    one population of each species. This design was necessary given the lack of
    available data on mating systems to inform a more complex design. We selected
    six plants of each species in September 2017 and manipulated insect access and
    pollen transfer based on techniques outlined by Kearns and Inouye (1993); multiple
    inflorescences or individual flowers on six plants per species were randomly
    assigned pollination treatments. We tagged flowers corresponding to their specified
    pollination treatment, either open, autogamy, self, outcross or supplementary
    pollination (Table 2). Given the window for hand pollination was limited by
    flowering time, supplementary pollination was undertaken at Wireless Hill, where
    the majority of pollination experiments occurred (supplementary pollinations
    completed for D. revoluta, J. sericea and T. elatior). Self-, outcross- and
    supplementary pollinations were achieved by hand. To facilitate pollination,
    we used sharp tweezers to scrape pollen directly from the anther of a donor
    flower and wipe it onto the stigma of the recipient. As D. revoluta had poricidal
    anthers, donor anthers were pierced and sliced with the tweezers to access pollen,
    which was then distributed onto the specified recipient. Given the close proximity
    of stigma and anthers in H. pungens, hand pollinations had to be undertaken
    on mature buds before autogamy could occur. Autogamy, self and outcross pollination
    treatments were covered with organza bags to exclude insect visitors (Table
    2). We collected fruits close to maturity in late 2017 and recorded the number
    of fruits and seeds. Sites were visited daily, and the first flowering dates
    were recorded when five or more flowers of the species were open. The end of
    flowering was recorded when flowers of the focal plant species remained at
    five or fewer. Between 40 and 179 flowers of each native plant species (Table
    3) were treated from 18 September to 22 December 2017. Floral visitor observations
    were recorded on warm, sunny days between 0930 and 1530 hours. We varied the
    timing of observations to span the duration of the flowering season, as well
    as morning and afternoon recordings for each plant species. These staggered
    observation times gave us a better chance of detecting insects which may have
    been active at different times throughout the day. We also recorded weather
    conditions, which we periodically reviewed to ensure a similar range of weather
    conditions while observing insects on each plant species. Observations for
    each plant species were undertaken during their flowering period (Table 1),
    with one plant watched by an observer (E. L. Eakin-Busher) sitting ~1 m away.
    The observer sat still for 1 min before recording any observations to limit
    observer effects (Wade et al. 2005). The selected plants usually had ~10 flowers,
    but the minimum was 2 flowers, and the maximum was ~100 flowers on a large T.
    elatior. To document nearby flowering, we estimated the total number of flowers
    (of any plant species) within a 10-m radius of each species. Observation effort
    for each species varied because of the different number of flowers produced
    and overlaps in their flowering times (Table 1). Insects were recorded in 10-min
    intervals while watching focal plants, with overall observations on each occasion
    lasting at least 30 min (Table S1, available as Supplementary material to this
    paper). In the case of buzz-pollinated D. revoluta, we recorded pollination
    when bees grasped a flower from underneath, and vibration was audible. Buzz
    pollinators, usually bees, remove pollen from poricidal anthers using vibration
    (De Luca and Vallejo-Marin 2013). For the other plant species, insect visitors
    were listed as potential pollinators when they interacted with the anthers
    and stigmas of flowers. Where insects landed on the flower but did not contact
    the anthers or stigma, they were recorded as visitors and as these were not
    crucial to our study, have not been included.'
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: P. occidentalis produces no nectar, but the source never states what reward (if any) its flowers offer, so none is
    guessed. A substantial part of this paper's data is not yet mappable
    to any AusTraits trait, e.g. flower_anther_display and flower_stigma_display (anther/stigma
    exsertion); buzz_pollination; and a set of pollination-experiment reproductive-output
    figures from Table 3 (fruit_count_produced, proportion_flowers_set_fruit, fruit_set_source_percentage,
    pollen_limitation_index, seeds_per_fruit_potential, seeds_per_fruit, all by
    pollination treatment)
