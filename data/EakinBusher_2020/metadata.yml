contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: pollination_vector_possible identity
traits:
- var_in: flower_diameter (cm)
  unit_in: cm
  trait_name: flower_diameter
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: Approximate flower diameter as characterized in Table 1 (Study species),
    based on field observation of each focal species at its study site.
- var_in: flowering_period
  unit_in: .na
  trait_name: flowering_time
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Flowering start/end recorded in Table 1 from daily site visits (first
    flowering date recorded when five or more flowers were open; end of flowering
    recorded when five or fewer flowers of the focal species remained).
- var_in: flower_perianth_symmetry
  unit_in: .na
  trait_name: flower_perianth_symmetry
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Flower perianth symmetry (actinomorphic vs zygomorphic) as characterized
    in Table 1 (Study species), based on field observation of each focal species.
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Flower colour as characterized in Table 1 (Study species), based on
    field observation. Hemiandra pungens' two-tone white-purple colouration is recorded
    as two simultaneous values (white_cream, blue_purple).
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Presence/absence of nectar as characterized in Table 1 (Study species),
    based on field observation of each focal species.
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'For Dianella revoluta, the reward is pollen, extracted from poricidal
    anthers by buzz-pollinating bees (Methods, Experimental design and data collection,
    p.28-29); flowers do not produce nectar (Table 1). For Hemiandra pungens, Jacksonia
    sericea and Tricoryne elatior, reward is inferred as nectar directly from Table
    1''s Nectar = Yes for these species, as the source does not separately discuss
    reward type. No reward is recorded for Patersonia occidentalis (see dataset
    notes).'
- var_in: flower_lifespan_max (d)
  unit_in: d
  trait_name: flower_lifespan
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: Duration of flower display as characterized in Table 1 (Study species).
    Dianella revoluta, Patersonia occidentalis and Tricoryne elatior are stated
    as lasting <1 day, recorded as an upper-bound maximum of 1; Hemiandra pungens
    and Jacksonia sericea are stated only as lasting "several days", with no exact
    number given, so no value is recorded for these two species rather than guessing
    one.
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Growth habit as characterized in Table 1 (Study species; e.g. rhizomatous
    herb, prostrate shrub, low spreading shrub), based on field observation. The
    specific growth-habit qualifiers (rhizomatous, prostrate, low spreading) are
    not separately captured by any AusTraits trait currently mapped here.
- var_in: life_history
  unit_in: .na
  trait_name: life_history
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Perennial/annual status as characterized in Table 1 (Study species).
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Determined experimentally by comparing fruit and seed set among the
    hand-pollination treatments (autogamy, self, outcross, supplementary) against
    open (unmanipulated) pollination (Table 2, Methods p.28; Table 3, p.29). A taxon
    is recorded as self-incompatible when autogamous and self-pollination treatments
    produced no or negligible fruit/seed set (Dianella revoluta, Jacksonia sericea;
    Results, Mating systems and Insect observations, p.30), and self-compatible
    when autogamous pollination nonetheless produced substantial fruit set, despite
    requiring insect visitation for full reproductive output (Hemiandra pungens,
    Patersonia occidentalis; Abstract p.26, Results p.30).
  basis_of_record: field_experiment
- var_in: flower_anther_dehiscence
  unit_in: .na
  trait_name: flower_anther_dehiscence
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Recorded only for Dianella revoluta, whose poricidal anthers required
    donor anthers to be pierced and sliced with tweezers to access pollen for hand-pollination
    treatments; anther
    dehiscence type is not described for the other four species.
- var_in: pollination_system
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Insect taxa observed to visit and contact the anthers/stigmas of each
    focal species during floral visitor observations (10-min interval watches lasting
    at least 30 min per session, 0930-1530 hours on warm days; insects that landed on a flower without contacting
    the anthers or stigma were excluded.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The most specific insect identity documented per focal species during
    floral visitor observations (see pollination_vector_known methods); recorded
    regardless of whether pollen transfer or fruit set was confirmed for that visitor
    (e.g. Apis mellifera on Tricoryne elatior, the most frequently observed visitor
    even though no fruit was produced by the plants on which it was observed; Results,
    Insect observations, p.30).
substitutions: .na
taxonomic_updates: .na
exclude_observations: .na
questions: .na
