  description: A comparison of the floral form, breeding system and animal interactions
    (bee visitors, beetle visitors/seed predators) of two sister Thysanotus (Asparagaceae)
    climbers in the Perth region of south-west Western Australia, documenting a
    facultative brood pollination mutualism between T. manglesianus and the beetle
    Notobrachypterus sp.
  sampling_strategy: 'Two sister climber species, Thysanotus patersonii and T. manglesianus, were studied at four sites in south-west Western Australia over multiple years (2005-2021 depending on site/measure): Nicholson Road (NR, Bush Forever site 456) and Mocardy Hill (MH) for T. manglesianus; Ken Hurst Reserve (KH) and, from 2020, Forrest Road (FR) for T. patersonii. Flower and floral-part measurements (Table 1) were made on field-collected material. Flower visitor observations were made in several years at different sites (PGL): T. patersonii counted while observing flowers on each visit; T. manglesianus recorded at 10-minute intervals while watching groups of flowers. Breeding-system manipulations (bagging to exclude pollinators; hand self/outcross/pollen-supplementation pollinations) were carried out on T. manglesianus at NR; T. patersonii was not manipulated, being assumed autogamous from Brittan (1981) and confirmed by comparing pollen loads on stigmas of insect-excluded versus open flowers. Fruit set and larval (beetle) infestation of fruit were recorded from marked/haphazardly tagged plants across years at each site. Beetle presence/abundance was censused one to two days per week during flowering at NR (2019-2021) and MH (2017/2019/2020), and flowers were examined for beetles at KH and FR. Beetles and bees were identified by T. Houston (bees) and A. Slipinski (beetles); beetle crop/leg contents and bee scopal pollen loads were examined microscopically to confirm they carried Thysanotus pollen.'
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: style_anther_separation_distance,
