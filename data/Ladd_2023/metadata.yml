  replicates: .na
  methods: Floral-form-predicted pollinator inferred from anther and style morphology.
- var_in: pollination_vector_known
  unit_in: unit
  trait_name: pollination_vector_known
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: For T. patersonii, confirmed autogamous by comparing pollen loads on stigmas of flowers isolated in insect-proof gauze from before anthesis against open-pollinated flowers (Methods p.3; Discussion p.8). For T. manglesianus, beetles (Notobrachypterus sp.) captured at flowers had Thysanotus pollen in their crop and on their legs (Results p.2, p.5; Fig. 1d), while no bee pollinator was ever observed at NR despite consistently high fruit set -- the first report of a beetle, rather than a moth or weevil, as a Thysanotus brood pollinator.
- var_in: flower_pollinator_reward
  unit_in: unit
  trait_name: flower_pollinator_reward
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Beetles observed eating parts of the T. manglesianus flower, including the anthers, and ingesting pollen (Results, p.2); the genus is also stated to provide no nectar and restrict access to pollen generally, but this is only individually confirmed for T. manglesianus.
- var_in: pollination_vector_possible
  unit_in: unit
  trait_name: pollination_vector_possible
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Incidental and targeted observations of insects visiting flowers, made in several years at different sites. Notobrachypterus sp. beetles were the most frequent, repeated visitor to both species; native bees (Leioproctus spp., Lasioglossum sp.) visited T. patersonii at MH and FR; the introduced honeybee Apis mellifera was infrequently recorded on T. manglesianus at NR, where no native bees were ever recorded.
- var_in: inflorescence_type
  unit_in: unit
  trait_name: inflorescence_type
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Expert knowledge.
- var_in: storage_organ
  unit_in: unit
  trait_name: storage_organ
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Expert knowledge.
- var_in: breeding_system
  unit_in: unit
  trait_name: breeding_system
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: For T. patersonii, autogamy (and, by entailment, self-compatibility) confirmed by comparing pollen loads on stigmas of insect-excluded vs open flowers (Methods p.3; Discussion p.8). For T. manglesianus, a mating-system trial at NR (Results p.4-5; Fig. 5A) hand-pollinated flowers under Auto (self, no vector), OCL/OCS (hand outcross) and Supp (pollen supplementation) treatments; the Auto treatment set fruit (proportion 0.16), and OCL/OCS/Supp set fruit at up to 0.70 -- evidencing both autogamy and allogamy succeed, i.e. self- and cross-compatible.
