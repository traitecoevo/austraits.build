  custom_R_code: .na
  collection_date: '2013'
  taxon_name: taxon_name
  location_name: location_code
  description: To determine whether pairs of co-occurring, co-flowering Thysanotus
    species with almost identical floral morphology maintain reproductive isolation
    through phenological separation and/or pollinator behaviour, and to test whether
    heterospecific pollen transfer between such species pairs has a detrimental
    effect on fruit and seed set.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'Pollination trials on Thysanotus tenellus Endl. and T. triandrus
    R.Br. were undertaken at the Nicholson Road Reserve (32°02′56.89″S, 115°55′58.75″N)
    in the Perth metropolitan region of south-western Western Australia. The study
    site is an urban reserve in a low-lying area of the Bassendean landform system
    of the Swan Coastal Plain, supporting relatively natural heathland vegetation
    with scattered emergent trees. The soil profile is described as duplex with
    a sandy A horizon and a dense sandy clay B horizon that becomes waterlogged
    in the lower areas in winter and early spring. The climate is Mediterranean
    type with cool winters and hot summers (average maximum annual temperature,
    25.5°C; minimum annual temperature, 13.4°C), and rainfall is c. 822 mm year-1
    (Bureau of Meteorology, 2014, for the City of Gosnells, 1991-2013). All species
    occur in the same area, but vary somewhat in density in different parts of the
    area (Supporting Information, Fig. S1). ^p The flowering period of each species
    overlapped with a congeneric species that had an almost identical flower form.
    Thysanotus spp. have similarly coloured and shaped broadly campanulate flowers.
    The flower colour is usually described as purple in published descriptions,
    but there may be slight variation between species (Fig. 1). The flower colours
    of the four Thysanotus spp. in this study were quantified using an ASD FieldSpec
    4 spectroradiometer (standard resolution; ASD Inc., Boulder, Colorado) to confirm
    similarity of colour across the visible and near-visible UV spectrum (350-700
    nm; Supporting Information, Fig. S2). ^p Flowers last only a few hours, opening
    in the morning and closing c. 5-6 h later. All species have a gynoecium with
    a single papillate stigma, trilocular ovary and two ovules per locule. ^p The plants were examined in three separate areas
    in the reserve that were delimited on the basis of fire history. Area A was
    burnt in 2000 and is adjacent to (separated by a 3-m-wide track) area B that
    was burnt in 2002. Area D is long unburnt (> 20 years) and > 500 m away from
    the other two areas with species varying in abundance, but largely co-occurring
    (Fig. S1). Representative vouchers are held in The Western Australian Herbarium,
    Perth. ^p FLOWERING PHENOLOGY AND POLLINATOR VISITATION ^p In 2013, all flowers of the four species were counted on most days during
    the flowering season in three areas (A, B and D) in which they occur in the
    reserve. Phenological reproductive isolation was calculated between T. tenellus
    and Thysanotus sp. and between T. multiflorus and T. triandrus following Martin
    & Willis (2007) for the areas in which they co-occur. Phenological isolation
    quantifies the synchrony of flowering based on the proportion of each species
    flowering each day, where one is complete isolation and zero is complete overlap
    in the time and number of flowers. ^p At the same time as flowers were counted,
    pollinator activity was also measured in two ways. First, during flower counting,
    flowers were scrutinized for pollinators as observers (PGL, EEB) travelled
    through the study site. These observation periods occurred on 20-30 days year-1
    with each visit c. 30 min in duration and included all focal species with qualitative
    estimates of the number of pollinators or visited flowers recorded. Second,
    in November 2013, focal flowers were regularly observed to quantify pollinator
    visitation rates. Plants of T. triandrus and T. multiflorus growing in close
    proximity were observed for 10-min periods during the morning (total 5.8 h,
    2700 flower hours), and bee visits were recorded. Thysanotus tenellus was not
    sampled to quantify visitation because, over the entire month of flower counting,
    not a single pollinator was observed (further, examination of open flowers
    near their closing time in 2013 showed that the vast majority of flowers had
    no pollen on the petals, indicating little or no visitation by bees; P. Ladd,
    pers. observ.). ^ POLLINATION EXPERIMENTS ^p Mating systems ^p Mating system manipulations were performed on plants in the
    field which were bagged using black plastic mesh (2 mm opening) that excluded
    any potential pollinators. Pollen was obtained by slitting an anther to expose
    the pollen and applying the pollen to the stigma of a flower using a x12 jeweller''s
    lens to ensure that the pollen was correctly placed. Treatments were autogamy
    (flowers unmanipulated), self (pollen from the same flower) and outcross (pollen
    from a plant > 4 m from the recipient, flower emasculated). From a floral anatomical
    point of view, there are two pairs of species (Table 1) and these have overlapping
    flowering times. Thus, hybrid pollen crosses were also performed to determine
    whether the species would produce hybrid seed (manipulated flowers emasculated).
    In the two focal species, supplementary pollination of flowers on unbagged
    inflorescences was compared with unmanipulated flowers tagged at the same time
    as the supplementary pollinations to test for pollen limitation under natural
    conditions. Flower pedicels were tagged with different coloured beads for different
    treatments. A self-incompatibility index (ISI) was calculated from the mating
    system study (Zapata & Arroyo, 1978) as 1 - hand self-pollination (or autogamous
    treatment)/hand cross-pollination. ^p Heterospecific pollen ^p To test whether heterospecific pollen inhibited
    the production of fruit, T. tenellus and T. triandrus were used as recipients
    for pollen from Thysanotus sp. and T. multiflorus, respectively. Six T. triandrus
    plants with six or more inflorescences were selected (in area B) and covered
    with mesh bags to prevent pollinator visitation. Six inflorescences were labelled
    per plant, using different coloured labels for self-pollination (3) and outcross
    pollination (3). At 07.30 h each day, every flower on the labelled inflorescences
    was hand pollinated with pollen of T. multiflorus. At least an hour later,
    the flowers were pollinated with either self- or cross-pollen of T. triandrus,
    according to their tag. It was found that T. tenellus is autogamous at the
    Nicholson Reserve. However, from the mating system experiment, hybrid pollen
    seemed to decrease fruit set, and so, in a separate trial, flowers were pollinated
    with hybrid (Thysanotus sp.) pollen. At flower opening in the morning, pollen
    of Thysanotus sp. was applied to the stigma of flowers of T. tenellus (12 plants
    used) and the flowers were tagged; a similar number of unmanipulated flowers
    on each plant were also tagged as controls. As the interest was in whether
    heterospecific pollen interfered with fruit set if the flowers were visited
    or not, inflorescences were not bagged. As self-pollen seems to be placed on
    stigmas before the flowers open, it was not possible to have a treatment of
    pollen of Thysanotus sp. applied to emasculated T. tenellus. In all cases,
    any fruits that formed were harvested to count the seeds and the numbers of
    tagged flowers that did not set fruit were recorded. It was not possible to
    examine pollen tube growth in the styles because aniline blue-stained pollen
    tubes do not clearly fluoresce under ultraviolet light in Thysanotus. Heterospecific
    pollination of T. triandrus on T. multiflorus and T. tenellus on Thysanotus
    sp. was assessed, but only one plant of T. multiflorus and Thysanotus sp. was
    used, and so the results are preliminary and indicative only.'
  original_file: trait_data.csv in raw data folder includes all data scraped from the manuscript in long format.
  notes: none
