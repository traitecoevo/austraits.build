contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: flower_visitor identity
traits:
- var_in: plant_growth_form
  unit_in: .na
  trait_name: life_form
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Raunkiaer life form (Geophyte for T. tenellus and Thysanotus sp.; HC
    = hemicryptophyte for T. triandrus and T. multiflorus, per the table's own
    footnote) as characterized in Table 1's Plant form column (Characteristics
    of the Thysanotus species studied), based on field observation of each focal
    species at Nicholson Road Reserve. This is Raunkiaer life form, not the AusTraits
    plant_growth_form trait (a different classification, of overall plant shape/height
    rather than perennating-bud position) -- the data.csv column is named plant_growth_form
    only because that was the raw column header, but it is mapped to life_form
    here.
- var_in: flower_diameter (mean) (cm)
  unit_in: cm
  trait_name: flower_diameter
  entity_type: species
  value_type: mean
  basis_of_value: measurement
  replicates: .na
  methods: Flower diameter (mean, with an error term whose type is not stated in
    the table header) as characterized in Table 1 (Characteristics of the Thysanotus
    species studied), based on field measurement of each focal species' flowers.
- var_in: inflorescence_type
  unit_in: .na
  trait_name: inflorescence_type
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Inflorescence architecture (panicle for T. tenellus and Thysanotus sp.;
    umbel for T. triandrus and T. multiflorus) as characterized in Table 1's Inflorescence
    type column, based on field observation. The qualifiers "open" and "large"
    given alongside these terms in the source are not captured by the current
    AusTraits inflorescence_type vocabulary.
- var_in: flower_fertile_stamens_count ({count})
  unit_in: '{count}'
  trait_name: flower_fertile_stamens_count
  entity_type: species
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: 'Number of anthers per flower (six for T. tenellus and Thysanotus sp.;
    three for T. triandrus and T. multiflorus) as characterized in Table 1''s Anthers
    column and the accompanying floral-morphology description in Material and
    methods, Study species and area (p.3), "Thysanotus tenellus ... has six suberect,
    equal-sized anthers ... that generally cluster to one side of the gynoecium"
    and "In T. triandrus ... there are three curved anthers ... to one side of
    the gynoecium."'
- var_in: flower_filament_fusion
  unit_in: '{dimensionless}'
  trait_name: flower_filament_fusion
  entity_type: species
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: Whether the anther filaments are free (unfused) as stated in Table 1's
    Anthers column ("... free" for all four species); recorded as the numeric
    value 0 on this trait's 0 (fully free) to 1 (fully fused) scale.
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Flower colour as stated in Material and methods, Study species and
    area (p.3), "The flower colour is usually described as purple in published
    descriptions, but there may be slight variation between species."'
- var_in: flower_lifespan (minimum) (h)
  unit_in: h
  trait_name: flower_lifespan
  entity_type: species
  value_type: minimum
  basis_of_value: measurement
  replicates: .na
  methods: 'Flower duration as stated in Material and methods, Study species and
    area (p.3), "Flowers last only a few hours, opening in the morning and closing
    c. 5-6 h later." Recorded as a minimum of 5 h, applying to all four focal
    species.'
- var_in: flower_lifespan (maximum) (h)
  unit_in: h
  trait_name: flower_lifespan
  entity_type: species
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: 'Flower duration as stated in Material and methods, Study species and
    area (p.3), "Flowers last only a few hours, opening in the morning and closing
    c. 5-6 h later." Recorded as a maximum of 6 h, applying to all four focal
    species.'
- var_in: flower_structural_carpels_count ({count})
  unit_in: '{count}'
  trait_name: flower_structural_carpels_count
  entity_type: species
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: 'Number of carpels (locules) per ovary as stated in Material and methods,
    Study species and area (p.3), "All species have a gynoecium with a single
    papillate stigma, trilocular ovary and two ovules per locule." "Trilocular"
    is recorded as 3 structural carpels.'
- var_in: flower_ovules_per_functional_carpel_count ({count})
  unit_in: '{count}'
  trait_name: flower_ovules_per_functional_carpel_count
  entity_type: species
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: 'Number of ovules per carpel/locule as stated in the same sentence as
    flower_structural_carpels_count (Material and methods, Study species and area,
    p.3), "... two ovules per locule."
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Presence/absence of nectar as stated in Material and methods, Study
    species and area (p.3), "No nectar is produced, with pollen being the only
    reward to the pollinator."
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: species
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: 'Reward offered to pollinators as stated in the same sentence as flower_nectar_production
    (Material and methods, Study species and area, p.3), "... with pollen being
    the only reward to the pollinator." 
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: population
  value_type: mode
  basis_of_value: measurement
  basis_of_record: field_experiment
  replicates: .na
  methods: 'Determined experimentally by comparing fruit and seed set among hand-pollination
    treatments (autogamy, self, outcross) against open pollination (Material and
    methods, Pollination experiments, Mating system, p.4). Thysanotus tenellus
    is recorded as autogamous with prior selfing, fruit and seed set did not differ
    between autogamous, self- and outcross pollination, and 88% of stigmas from
    just-opened, unvisited flowers already carried pollen (Results, p.6). Thysanotus
    triandrus is described in the source as having a "mixed mating system" (self-incompatibility
    index, ISI = 0.56, Results p.6), self-pollen set significantly less fruit
    and seed than outcross pollen, but still set some, so it is recorded here
    as self-compatible, the closest matching allowed value (see questions).'
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'The most specific insect visitor identity documented per focal species,
    from field observation (Results, p.6), blue-banded bees (Amegilla chlorocyanea)
    recorded moving between T. triandrus and T. multiflorus flowers during 500
    min (2700 flower-hours) of observation in area A; small black beetles (c.
    2 mm long) recorded as the only occasional visitors to T. tenellus and Thysanotus
    sp., stated as not contacting the anther pores or stigmas and "not seem[ing]
    to be involved in pollination."'
substitutions:
- trait_name: life_form
  find: HC
  replace: hemicryptophyte
- trait_name: inflorescence_type
  find: Open panicle
  replace: panicle
- trait_name: inflorescence_type
  find: Large umbel
  replace: umbel
- trait_name: flower_fertile_stamens_count
  find: Six
  replace: '6'
- trait_name: flower_fertile_stamens_count
  find: Three
  replace: '3'
- trait_name: flower_filament_fusion
  find: free
  replace: '0'
- trait_name: flower_colour
  find: purple
  replace: blue_purple
- trait_name: flower_nectar_production
  find: No nectar is produced
  replace: nectar_absent
- trait_name: flower_pollinator_reward
  find: pollen being the only reward to the pollinator
  replace: pollen
- trait_name: breeding_system
  find: autogamous, with prior selfing
  replace: autogamy self-compatible
- trait_name: breeding_system
  find: mixed mating system
  replace: self-compatible
taxonomic_updates: .na
exclude_observations: .na
questions: .na
