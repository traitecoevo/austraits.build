dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: 1989/2015
  taxon_name: taxon_name
  trait_name: trait_name
  value: value
  source_id: source_id
  description: Species trait values harvested from the literature for the study of
    McCarthy et al. (2019), limited to the values not otherwise in AusTraits.
  basis_of_record: literature
  life_stage: adult
  sampling_strategy: Species-level values of seed mass, specific leaf area and wood
    density compiled from the literature for the plant species of south-east Queensland
    studied by McCarthy et al. (2019). Each value cites the study it was taken from.
    Only values that were measured in Australia, are not already in AusTraits (as
    a value, or as a species mean of a dataset), and come from studies whose data
    are not otherwise in AusTraits are included here; the selection is documented
    in raw/harvested_candidates_vetted.csv and raw/handbook_densities_vetted.csv.
  original_file: JMcCarthy_AustraitsSubmission_harvestedData.csv in the raw folder
    of McCarthy_2017
  notes: Built by raw/make_data.R from the vetted lists. Of 4,048 harvested values
    other than height, 2,999 match AusTraits values or species means; values for
    introduced species, values measured outside Australia and values from compilations
    were excluded. The 487 air-dry wood densities from timber handbooks were vetted
    separately (raw/handbook_densities_vetted.csv) - 399 are already in AusTraits,
    as Kingston_1961 air-dry values or converted to basic density in Ilic_2000,
    Zanne_2009 and Kooyman_2011, and 33 are rounded repeats of another handbook's
    value - and 50 are included.
locations: .na
contexts:
- context_property: wood moisture content
  category: method_context
  var_in: wood_moisture
  values:
  - value: air-dry, 12% moisture content
    description: Density of wood air-dried to a standard 12% moisture content, as
      tabulated in timber handbooks.
traits:
- var_in: seed_dry_mass
  unit_in: mg
  trait_name: seed_dry_mass
  entity_type: species
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Seed mass taken from the cited study.
- var_in: fruit_dry_mass
  unit_in: mg
  trait_name: fruit_dry_mass
  entity_type: species
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Fruit mass taken from French (1991), reported in the harvested data as
    seed mass; the values are about 50 times the seed masses in AusTraits for the
    same species and are fruit masses.
- var_in: diaspore_dry_mass
  unit_in: mg
  trait_name: diaspore_dry_mass
  entity_type: species
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Propagule mass of a viviparous mangrove taken from Clarke et al. (2001),
    reported in the harvested data as seed mass. Whether it is a dry or a fresh
    mass was not verified.
- var_in: leaf_mass_per_area
  unit_in: mm2/mg
  trait_name: leaf_mass_per_area
  entity_type: species
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Specific leaf area taken from the cited study.
- var_in: wood_density_air_dry
  unit_in: g/cm3
  trait_name: wood_density_air_dry
  entity_type: species
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Air-dry wood density at 12% moisture content taken from the cited timber
    handbook or flora (Cause et al. 1989, Smith et al. 1991, Bootle 2005, Boland et
    al. 2006, Poropat 2009, 2013, Lake 2015, Kamminga 2002), or from studies quoting
    such values (Hyland 1989, Kooyman & Westoby 2009); the values of the last two
    are assumed to be air-dry, as they stand to basic densities in AusTraits as the
    handbook values do.
substitutions: .na
taxonomic_updates: .na
exclude_observations: .na
questions: .na
