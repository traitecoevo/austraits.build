source:
  primary:
    key: Brown_1997
    bibtype: Book
    author: E.M. Brown and A.H. Burbidge and John Dell and D. Edinger and Stephen
      D. Hopper and R.T. Wills
    year: 1997
    title: 'Pollination in Western Australia: A Database of Animals Visiting Flowers'
    publisher: Western Australian Naturalists' Club
    place: Perth, WA
    number: Handbook No. 15
contributors:
  data_collectors:
  - last_name: Brown
    given_name: E.M.
    ORCID: .na.character
    affiliation: unknown
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::mutate(
        `Plant scientific name` = dplyr::if_else(
          `Plant scientific name` %in% c("Acacia sp.", "Adenanthos sp.", "Agonis sp.", "Astartea sp.", "Astroloma sp.", "Baeckea sp.", "Banksia sp.", "Barringtonia sp.", "Bauhinia sp.", "Beaufortia sp.", "Billardiera sp.", "Bombax sp.", "Brachychiton sp.", "Callistemon sp.", "Calothamnus sp.", "Calytrix sp.", "Carpobrotus sp.", "Dicrastylis sp.", "Dryandra sp.", "Eremophila sp.", "Eucalyptus sp.", "Gardenia sp.", "Grevillea sp.", "Hakea sp.", "Hibbertia sp.", "Jacksonia sp.", "Lechenaultia sp.", "Leptospermum sp.", "Leucopogon sp.", "Melaleuca sp.", "Myoporum sp.", "Pimelea sp.", "Ptilotus sp.", "Scholtzia sp.", "Solanum sp.", "Sphenotoma sp.", "Stylidium sp.", "Thryptomene sp.", "Verticordia sp.", "Xanthorrhoea sp.") & location_name != "unknown",
          paste0(`Plant scientific name`, " [", location_name, "]"),
          `Plant scientific name`
        )
      ) |>
      generate_observation_numbers(`Plant scientific name`, location_name) |>
      mutate(Date = util_parse_collection_date(Date))
  '
  collection_date: Date
  taxon_name: Plant scientific name
  location_name: location_name
  description: A large compilation of published, museum, herbarium and field-record
    observations of animals visiting the flowers of Western Australian native plant
    species, assembled as a reference database of possible pollen vectors for the
    south-west Australian flora.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: This is a secondary literature/database compilation rather than
    a single field study, so no single sampling design applies across records; each
    row draws on whatever original observation (published study, herbarium specimen
    annotation, museum record or unpublished field note, see the Observation type
    and Comments columns of the raw data) documented that particular plant-animal
    interaction.
  original_file: data.csv, transcribed from the Brown et al. (1997) database export
    supplied to AusTraits by Kit Prendergast.
  notes: The source includes columns with multiple different taxon ranks for each animal visitor (species binomial, genus, subgenus, species
    epithet, family, subfamily, common name, class and order). To map into AusTraits, two derived columns were generated, `Pollinator match column` and `Pollinator
    match value` to identify which of the taxon rank columns supplied the most taxonomically
    specific value that resolves to an AusTraits `pollination_vector_possible`
    term, and what that raw value was. 234 records had no interpretable location
    and were mapped to a `location_name` of "unknown". Where a plant genus-level
    `sp.` name (e.g. `Eucalyptus sp.`) recurs across more than one distinct named
    location, `Plant scientific name` is suffixed with that location (e.g.
    `Eucalyptus sp. [Kings Park_1]`) so these are not conflated as the same
    unidentified species; records left with an "unknown" location keep the plain
    `Genus sp.` name.
identifiers: .na
locations: locations.csv
contexts:
- context_property: replicate observations
  category: temporal_context
  var_in: observation_number
- context_property: flower visitor taxon name
  category: entity_context
  var_in: Animal species binomial name
traits:
- var_in: Pollinator match value
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: unknown
  methods: Animal visitors to flowers, compiled from published observations, museum
    and herbarium specimen records, and unpublished field records (see the raw Observation
    type and Comments columns). Contact with the flower's reproductive structures
    is not confirmed for every record, so these are treated as possible rather than
    known pollen vectors. Because the source identifies each animal to varying taxonomic
    precision across several parallel columns, the value mapped in here is the most
    taxonomically specific of those columns that corresponds to an AusTraits controlled-vocabulary
    term for this trait (see the `notes:` field and the `Pollinator match column`/`Pollinator
    match value` columns of data.csv).
substitutions:
- trait_name: pollination_vector_possible
  find: apis mellifera
  replace: honeybee
- trait_name: pollination_vector_possible
  find: diptera
  replace: fly
  match: word
- trait_name: pollination_vector_possible
  find: thyninnae
  replace: thynninae
  match: word
- trait_name: pollination_vector_possible
  find: tiphiidae
  replace: thynninae
  match: word
- trait_name: pollination_vector_possible
  find: pteropidae
  replace: bat
  match: word
- trait_name: pollination_vector_possible
  find: muridae
  replace: rodent
  match: word
