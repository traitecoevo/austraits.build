dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        location_name = ifelse(
          !is.na(`Decimal Latitude`),
          paste0("seeds_collected_at_", `Decimal Latitude`, "_lat_and_", `Decimal Longitude`, "_long"),
          NA
        ),
        collection_date = dplyr::coalesce(
          as.character(`Collection Date`),
          stringr::str_sub(as.character(`Storage Date`), 1, 4),
          stringr::str_sub(as.character(`Date Tested`), 1, 4),
          "2026"
        ),
        measurement_remarks = ifelse(!is.na(Collector), paste0("Collector: ", Collector), NA),
        germination_unadjusted = ifelse(
          is.na(`Adjusted Germination %`),
          dplyr::coalesce(
            suppressWarnings(as.numeric(`Final Germination Percentage`)),
            ifelse(
              as.numeric(`Number Tested`) > 0,
              100 * as.numeric(`Number Germinated`) / as.numeric(`Number Tested`),
              NA
            )
          ),
          NA
        )
      ) %>%
      filter(!is.na(`Scientific Name`))
    '
  collection_date: collection_date
  taxon_name: Scientific Name
  location_name: location_name
  description: Seed trait data from the Victorian Conservation Seed Bank, including
    seed mass of collected seeds and data on germination trials.
  basis_of_record: lab
  life_stage: adult
  measurement_remarks: measurement_remarks
  sampling_strategy: The Victorian Conservation Seedbank is Victoria's primary facility for the conservation of the state's most threatened plants. It stores the seeds and spores of native Victorian plants, particularly endemics and at-risk species, forming the basis for our research into effective long-term germplasm storage, germination characteristics, and the propagation of recalcitrant native species. The centre, supported by our associated laboratories and plant propagation nurseries, forms part of Royal Botanic Gardens Victoria's Bushfire Plant Recovery and Care Unit, which aims to support the restoration of fire damaged landscapes and ecosystems.
  original_file: Data downloaded from the Australian Virtual Seed Bank (https://seedbank.ala.org.au)
    GraphQL API (https://events-databox.ala.org.au/graphql) on 10 Nov 2026, all records
    for the Victorian Conservation Seed Bank; see data/ANBG_2026/raw/AVSB_download.R and
    data/ANBG_2026/raw/AVSB_split_by_seedbank.R. The Feb 2025 website download is
    data/Victorian_Conservation_Seed_Bank_2025/data.csv in commit 245b581a.
  notes: data.csv has one row per seed accession and one row per germination trial (with
    its treatment and the accession's taxon, locality and dates), distinguished by `Event
    Type`. Where an accession has no collection date, collection_date is the year it went
    into storage, else the year of the germination test, else 2026 (download year). Rows
    with `Data Version` = "2025 download" are values from the Feb 2025 download that are
    no longer in the Australian Virtual Seed Bank; they are listed, with the reason, in
    raw/2025_missing_values.csv.
identifiers:
- var_in: Accession Number
  identifier_type: catalogNumber
  institution_code: Victorian Conservation Seedbank
- var_in: Herbarium Voucher
  identifier_type: catalogNumber
  institution_code: National Herbarium of Victoria (MEL)
