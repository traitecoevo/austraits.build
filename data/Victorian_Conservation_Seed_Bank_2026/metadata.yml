source:
  dataset:
    key: Victorian_Conservation_Seed_Bank_2026
    bibtype: Online
    author: Victorian Conservation Seed Bank
    year: 2026
    title: Victorian Conservation Seed Bank dataset from Australian Virtual Seed Bank
    publisher: Australian Virtual Seed Bank
    url: https://seedbank.ala.org.au
contributors:
  data_collectors:
  - last_name: Robinson
    given_name: Alastair
    ORCID: 0000-0001-8581-2718
    affiliation: Royal Botanic Gardens Victoria
  - last_name: Miller
    given_name: Rebecca
    ORCID: 0000-0003-2785-0024
    affiliation: Royal Botanic Gardens Victoria
  - last_name: Eyles
