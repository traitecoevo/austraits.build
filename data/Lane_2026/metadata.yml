  sampling_strategy: 2.1 | Study sites and permits ^p The NSW Department of Planning,
    Industry and Environment (DPIE) provided approvals to undertake the activities
    associated with this project under Part 2 Division 3 of the NSW Biodiversity Conservation
    Act 2016 (research agreement number DOC20/500625). Leaf collection for this study
    was undertaken at a burnt (wildfire in late January 2020) and nearby unburnt site
    in the NSW Southern Tablelands region, within and around the Macanally-- Numeralla
    Ranges (Figure 1). This area comprises north–south ridges with steep sloping terrain.
    Elevation ranges from 800 to 1233 m. The natural vegetation of the area is predominantly
    dry sclerophyll forest, with an overstorey dominated by red stringybark (Eucalyptus
    macrorhyncha) and scribbly gum (E. rossii) (Zylstra, 2019). Additionally, brittle
    gum (E. mannifera) and broad-- leaved peppermint (E. dives) are also common in
    these areas (Allen, 2015). Ribbon gum (E. viminalis) and candlebark (E. rubida)
    are present along creek lines and snow gums (E. pauciflora) are found on slopes
    at higher elevations (Leavesley & Rhind, 2008; Office of Environment and Heritage
    NSW National Parks and Wildlife Services, 2012). Understorey vegetation is dominated
    by Acacia spp. (Martin et al., 2020). ^p 2.2 | Eucalypt species ^p We selected
    six eucalypt species that were abundantly available at both the burnt and unburnt
    site and are used to varying degrees by arboreal marsupial folivores in the Central
    and Southern Tablelands of NSW for food, as well as for shelter (Beale et al.,
    2022; Gopalan et al., 2026; Jensen et al., 2015; Lane, Youngentob, Clark, & Marsh,
    2024; Marsh, Wallis, & Foley, 2003; State of NSW and Office of Environment and
    Heritage, 2018). Three were monocalypt species, E. dives, E. macrorhyncha and
    E. rossii. The other three were symphyomyrtle species, E. viminalis, E. rubida
    and E. mannifera. ^p 2.3 | Sampling locations ^p Initially, 50 locations were
    generated at both the burnt and unburnt sites using the Halton Iterative Partitioning
    (HIP) sampling method (Robertson et al., 2018), which provides a well-- distributed
    spatial sample and ensures equal-- probability random sampling. This selection
    process was implemented in R (v4.2.2) (R Core Team, 2022), using the SDraw package
    (v.2.1.13) (McDonald & McDonald, 2020) and the locations were generated within
    a polygon that outlined the study sites. All of the locations were visited and
    surveyed in numerical order, with one tree of each of the selected species marked
    at each location (where available) until 10 trees from each of the six species
    were marked at both the burnt and unburnt sites. We selected multiple trees per
    species because individual trees, even within the same species, can differ in
    concentrations of foliar chemical compounds (Lawler et al., 1998; Marsh et al.,
    2018; Steinbauer et al., 2015). Only one tree per species was selected at any
    one location to reduce the chances of including closely related trees of the same
    species, as trees that are close in proximity may have similar genetic, and therefore
    chemical, profiles (Andrew, Peakall, et al., 2007). Sampling from genetically
    diverse trees allowed us to obtain a more representative sample of the chemical
    variation within species. Unused locations were eliminated from the study. We
    did not encounter any E. rubida trees at the 50 allocated locations at the burnt
    site, so we selected 10 trees from known locations of occurrence within the burnt
    site, ensuring that there was at least 60 m between each tree to again reduce
    the chances of genetic similarity (Andrew, Peakall, et al., 2007). At the end
    of this selection period, we had 33 locations in the burnt landscape and 31 locations
    in the unburnt landscape (Figure 1). Two locations in the burnt landscape (with
    two E. mannifera trees and one E. rossii tree) were removed from the study after
    the second sampling round due to loss of site access. ^p 2.4 | Leaf collection
    ^p Leaf collection commenced in November 2020 (9.5 months post-- fire) and ended
    in November 2021, occurring every 4 to 6 weeks with a total of seven rounds being
    completed. The small differences in timing were due to a combination of difficulties
    in accessing the sites during periods of wet weather and travel restrictions due
    to the global COVID-- 19 pandemic. At the beginning of the first leaf collection
    round, we recorded the GPS locations of each tree and measured the diameter at
    breast height (DBH). ^p In the burnt landscape, epicormic growth was collected
    from all trees in all collection rounds. We collected epicormic growth at least
    1 m above the base of the trunk and either used our hands to remove growth from
    the trunk or a saw attached to an extendable pole if it was higher in the tree.
    If there were trees with adult phase foliage present at the burnt site of any
    of the six eucalypt species, we also collected this foliage from one tree per
    species per collection location. As a result, adult phase foliage was collected
    at the burnt site from 10 E. macrorhyncha and E. rossii trees and seven E. mannifera
    trees. There were insufficient E. dives, E. rubida and E. viminalis trees sampled
    (n = 3, 2, 2, respectively) for statistical comparisons, but they are included
    on figures for visualisation. At the unburnt site, only mature (i.e. fully expanded),
    adult phase foliage was collected from the six focal species during the same time
    periods as the epicormic growth in the burnt landscape. Adult phase foliage was
    collected using an arborist throw-- line launcher (methods outlined in Youngentob
    et al. (2016)). Approximately 100 g of leaf was collected per tree by individually
    removing each leaf from the stems. At the end of each day, samples were frozen
    at −20°C.
