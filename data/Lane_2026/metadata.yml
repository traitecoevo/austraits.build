- var_in: TotalN
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 2.5 | Sample preparation ^p Leaf samples were freeze-- dried and then ground
    in a Foss Tecator 1093 Cyclotec sample mill (Foss Tecator, Höganäs, Sweden) with
    a 1 mm particle size sieve. For all dried, ground foliage samples, we collected
    reflectance spectrum from 400 to 2498 nm using a lab-based Foss XDS near-- infrared
    reflectance (NIR) spectrometer (Foss-NIRsystems Inc., Silver Spring, MD, USA).
    This range (400–2498) covers the full visible (400–700 nm) and near-- infrared
    (700–2498) spectrum (Pan et al., 2022; Rossel et al., 2006). These spectra were
    later used to determine the chemical composition of all samples (see methods for
    ‘Analysis by near-- infrared spectroscopy [NIRS]’). ^p 2.6 | Total and available
    N ^p Total and available N concentrations were measured in the first round of
    collected leaf samples (n = 160) using a modified version of the method of DeGabriel
    et al. (2008) as outlined in Marsh et al. (2014) and also used in Lane, Youngentob,
    Clark, and Marsh (2024). For both digested and undigested leaves, the N concentration
    was determined in 0.100 ± 0.020 g of sample using a Leco Truspec C/N analyser
    (Leco Corporation, Sydney, NSW, Australia). These values were used to calculate
    the in vitro N digestibility and available N.
  leaf_N_measurement: total nitrogen
