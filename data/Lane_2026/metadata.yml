- var_in: UBFs
  unit_in: '%'
  trait_name: unknown
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: '2.5 | Sample preparation ^p Leaf samples were freeze-- dried and then
    ground in a Foss Tecator 1093 Cyclotec sample mill (Foss Tecator, Höganäs, Sweden)
    with a 1 mm particle size sieve. For all dried, ground foliage samples, we collected
    reflectance spectrum from 400 to 2498 nm using a lab-based Foss XDS near-- infrared
    reflectance (NIR) spectrometer (Foss-NIRsystems Inc., Silver Spring, MD, USA).
    This range (400–2498) covers the full visible (400–700 nm) and near-- infrared
    (700–2498) spectrum (Pan et al., 2022; Rossel et al., 2006). These spectra were
    later used to determine the chemical composition of all samples (see methods for
    ‘Analysis by near-- infrared spectroscopy [NIRS]’). ^p 2.7 | Quantification of
    UBFs We measured the total concentration of UBFs in all 80 monocalypt samples
    from round 1. All solvents were LCMS grade. The procedure for extraction followed
    Marsh et al. (2019). Specifically, 20.5 ± 0.5 mg of dried, ground leaf material
    was extracted twice in 1 mL methanol by sonicating for 10 min and then centrifuging
    at 2500 rpm for 10 min each time. The supernatant from both extractions was combined
    and filtered through a 0.2 µm syringe filter. Prior to analysis, all extracts
    were diluted into 50% methanol containing 0.5 µM naringenin as an internal standard.
    5 µL of sample extracts were analysed using a Dionex Ultimate 3000 High Performance
    Liquid Chromatography (HPLC) system coupled to an Orbitrap Fusion Mass Spectrometer
    (Thermo Fisher Scientific, USA). The order in which samples were run was randomised,
    with a quality control standard mix inserted randomly at different points within
    the order. Samples were chromatographically separated on a Waters Acquity Premier
    BEH C18 column with dimensions of 50 mm length × 2.1 mm ID and particle size of
    1.7 µm (part number 186009455, Waters, Milford, USA). The solvents were Milli--
    Q water (A) and methanol (B), both containing 0.1% formic acid. A flow rate of
    0.3 mL min−1 was used. The LC gradient consisted of: 50% B from 0 to 1.3 min,
    a linear gradient from 50% to 95% B from 1.3 to 13.3 min, 95% B from 13.3 to 16.3
    min, 95%–50% B from 16.3 to 16.4 min and 50% B from 16.4 to 20 min. The Orbitrap
    Fusion was operated with a heated electrospray ionisation (ESI) source under the
    following conditions: vaporizer temperature of 350°C, an ion transfer tube temperature
    of 325°C and a positive ion spray voltage of 3500 V. The instrument was operated
    in a data independent acquisition (DIA) mode consisting of a Full MS scan followed
    by 12 subsequent MS/MS scans spanning an m/z range of 195–437 with a window size
    of 23 m/z and an overlap of 3 m/z between each MS/MS scan. Full MS scans were
    acquired in the orbitrap detector with a resolution of 120,000, scan range of
    180–440 m/z, normalised AGC target of 25% and maximum injection time of 50 ms
    with quadrupole isolation selected. MS/MS scans were acquired in the orbitrap
    detector using quadrupole isolation with a resolution of 30,000, Higher energy
    collisional dissociation (HCD) energy of 35%, maximum injection time of 54 ms
    and an automatic scan range. Data was analysed using the mass spectrometry software
    Skyline (Henderson et al., 2018; Pino et al., 2020). Compounds were identified
    and quantified based on their retention times, mass spectra and area under the
    curve (MS1) relative to the authentic standards outlined in Marsh et al. (2019).
    Stock solutions were prepared by dissolving each standard in methanol, after which
    they were combined to form a standard mix. Standard curves were prepared in duplicate
    by serially diluting the standard mix in 50% methanol. We developed a linear calibration
    curve for each standard with 10 points ranging from 0 to 2.4 µM and a 2.5-fold
    dilution each time.'
- var_in: FPCs
  unit_in: '%'
  trait_name: unknown
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: '2.5 | Sample preparation ^p Leaf samples were freeze-- dried and then
    ground in a Foss Tecator 1093 Cyclotec sample mill (Foss Tecator, Höganäs, Sweden)
    with a 1 mm particle size sieve. For all dried, ground foliage samples, we collected
    reflectance spectrum from 400 to 2498 nm using a lab-based Foss XDS near-- infrared
    reflectance (NIR) spectrometer (Foss-NIRsystems Inc., Silver Spring, MD, USA).
    This range (400–2498) covers the full visible (400–700 nm) and near-- infrared
    (700–2498) spectrum (Pan et al., 2022; Rossel et al., 2006). These spectra were
    later used to determine the chemical composition of all samples (see methods for
    ‘Analysis by near-- infrared spectroscopy [NIRS]’). ^p 2.8 | Quantification of
    FPCs We measured the total concentration of FPCs in all 80 symphyomyrtle samples
    from round 1. All solvents were LCMS grade. 50.0 ± 0.5 mg of dried, ground leaf
    material was extracted once in 5.0 mL of acetonitrile: water (93:7 v/v) with 0.1%
    trifluoroacetic acid for 1 h with occasional sonication. The extract was filtered
    through a 0.2 µm nylon syringe filter prior to injection. 20 µL sample extracts
    were analysed on an Agilent 1100 HPLC with an Agilent 1260 Infinity Diode Array
    Detector (Agilent Technologies, USA). Samples were chromatographically separated
    on a 4.6 × 250 mm Waters XBridge C18 3.5 µm column (part number 186003943, Waters,
    Milford, USA). The solvents were Milli-- Q water (A) and acetonitrile (B), both
    containing 0.1% trifluoracetic acid. A flow rate of 1.0 mL min−1 was used. The
    LC gradient consisted of: 60% B from 0 to 5 min, a linear gradient from 60% to
    90% B from 5 to 60 min, 90% B from 60 to 70 min, 90%–60% B from 70 to 71 min and
    60% B from 71 to 80 min. Absorbance was read at 275 nm. Raw chromatographic data
    were analysed using the package ChromatographR (v0.7.1) (Bass, 2023) in the R
    Statistical Environment, version 4.3.1 (R Core Team, 2023). Processing steps included
    interpolation and baseline correction followed by variable penalty dynamic time
    warping to achieve peak alignment across chromatograms, peak fitting and peak
    table assembly. Known compounds were identified based upon retention times and
    similarity of UV spectra to authentic standards where available. Quantification
    was made on the basis of previously established standard curves where authentic
    standards were available for known compounds. Additional minor peaks were classified
    as macrocarpal-- type meroterpenoid formylated phloroglucinol compounds on the
    basis of UV-- spectral similarity to known macrocarpals, and a standard curve
    for Macrocarpal G was used for their quantification.'
