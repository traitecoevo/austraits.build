source:
  dataset:
    key: Bean_1992
    bibtype: Article
    year: 1992
    author: A. R. Bean
    title: The genus Leptospermum Forst. et Forst. f. (Myrtaceae) in northern Australia and Malesia
    journal: Austrobaileya
    volume: 3
    number: 4
    pages: 643--659
    doi: 10.5962/p.366003
contributors:
  data_collectors:
  - last_name: Bean
    given_name: Anthony
    ORCID: 0000-0001-5697-1664
    affiliation: Queensland Herbarium, Australia
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait %in% c(
          "bark_colour", "bark_texture", "flower_anther_attachment",
          "flower_anther_dehiscence", "flower_colour", "flower_diameter",
          "flower_fertile_stamens_count", "flower_hypanthium_length",
          "flower_petal_length", "flower_petal_shape", "flowering_time",
          "flowers_per_inflorescence", "fruit_colour", "fruit_fleshiness",
          "fruit_length", "fruit_shape", "fruit_surface_hairs", "fruit_type",
          "fruit_width", "inflorescence_type", "leaf_apex_shape", "leaf_base_shape",
          "leaf_discolority", "leaf_hairs_adult_leaves", "leaf_hairs_immature_leaves",
          "leaf_length", "leaf_length_to_width_ratio", "leaf_main_vein_count",
          "leaf_margin_posture", "leaf_phyllotaxis", "leaf_shape",
          "leaf_surface_colour", "leaf_type", "leaf_width", "parasitic",
          "pedicel_length", "petiole_length", "plant_growth_form",
          "plant_growth_substrate", "plant_height", "plant_photosynthetic_organ",
          "seed_colour", "seed_length", "seed_shape", "seed_surface_texture",
          "seed_width", "stem_growth_habit", "stem_hairs", "stem_shape"
        ),
        is.na(commonness_qualifier) | commonness_qualifier != "extreme_range"
      ) |>
      dplyr::mutate(
        source_rank = dplyr::case_when(
          grepl("^Dichotomous", source_section) ~ 3,
          grepl("^Multi-access", source_section) ~ 2,
          TRUE ~ 1
        )
      ) |>
      dplyr::group_by(taxon_name, trait, population_region, entity_measured) |>
      dplyr::filter(source_rank == min(source_rank)) |>
      dplyr::ungroup()
    '
  collection_date: '1992'
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  description: 'To resolve the taxonomic problems remaining in the northern Australian and
    Malesian species of Leptospermum, in particular the circumscriptions of L. parviflorum
    and L. javanicum, and to describe new taxa from Queensland, the Northern Territory and
    Western Australia.'
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'A revision of the genus Leptospermum was recently published by Joy
    Thompson (Thompson 1989), which elucidated many matters of concern to taxonomists and
    provided a basis for further research. Readers are referred to that publication for
    descriptions and full synonymy of species not treated in this paper. ^p The seeds of
    most of the northern Leptospermum species have been examined in the present study. In
    most cases, seeds were collected from plants in their natural habitat, rather than
    from herbarium specimens. Thus, seed maturity could be properly assessed. ^p I would
    like to thank the Directors of A, DNA, L, NSW, PERTH and SING for the loan of their
    herbarium material and types, and the directors of BRI, JCT and QRS for access to
    their herbaria.'
  original_file: 'Myrtaceae Leptospermum partial_revision Bean_1992 Austrobaileya
    part366003.pdf (BHL scan of Austrobaileya 3(4): 643--659)'
  notes: 'data.csv is raw/trait_data.csv (a hand transcription of every clause of the paper,
    from the page images) with trait_scoring_method added from rank_scored_from
    (inferred_from_genus for the genus statement in the Introduction,
    inferred_from_species for subspecies silent on a character,
    inferred_from_species_group for a key lead or group statement covering several taxa,
    inferred for typical values stated only when atypical). Type and cited specimens are
    in raw/Bean_1992_vouchers.csv. data.csv also carries two unmapped per-taxon columns
    from raw/Bean_1992_taxa.csv: treatment_type (2 new species, 2 new infra taxa, 4
    revision, 25 not described, i.e. annotated list and keys only) and
    original_concept_year, the year of the earliest name for the taxon concept as cited in
    the paper. Six species are described in full (L. pallidum, L. madidum and its two
    subspecies, L. parviflorum, L. venustum, L. javanicum, L. amboinense); the rest are
    annotated with distribution and habitat and scored through the two keys. Each value is
    recorded in the source words (trait_value_raw, the clause; trait_value, the source
    terms) and mapped with substitutions. Several values are listed in text order; a
    commonness word splits a character onto rows (commonness_qualifier), and parenthetical
    extremes are on extreme_range rows, in data.csv but not mapped. When a taxon has a
    character from several places custom_R_code keeps the highest-ranked source for each
    taxon, trait, region and part measured: the taxon own text, then the multi-access key,
    then the dichotomous key. Numbers in a key lead covering several taxa, and bounds such
    as Largest leaves <9 mm or Pedicels >8 mm, are not values for a taxon; they are kept
    in the *_class candidates. L. madidum subsp. sativum growth rate and soils in
    cultivation (Brock 1988) are candidate rows. Candidate traits not yet in traits.yml
    (unmapped, dropped in custom_R_code): anther_cell_length, anther_cell_orientation,
    anther_cell_size, anther_gland_colour, anther_gland_prominence, anther_gland_shape,
    associated_species, bark_adherence, bark_description, bark_persistence,
    bract_bud_coverage, bract_colour, bract_hairs, bract_persistence, bract_shape,
    bracteole_colour, bracteole_persistence, bracteole_scar_position, bracteole_shape,
    branch_orientation, branchlet_hair_length, branchlet_hair_orientation,
    conservation_status, cultivation_status, distribution_description,
    distribution_queensland_pastoral_districts, elevation,
    flowers_per_inflorescence_class, fruit_attachment, fruit_base_shape,
    fruit_diameter_class, fruit_dome, fruit_dome_apex_position,
    fruit_dome_height_relative_to_hypanthium, fruit_hypanthium_surface,
    fruit_locule_count, fruit_surface, fruit_texture, fruit_valve_count,
    fruit_valve_position, geology_terms, growth_rate, habitat_description, habitat_terms,
    hypanthium_hairs, hypanthium_shape, inflorescence_arrangement,
    inflorescence_description, inflorescence_position, inflorescence_unit,
    leaf_abaxial_colour, leaf_abaxial_hair_colour, leaf_abaxial_hair_orientation,
    leaf_abaxial_hairs, leaf_apex_prickliness, leaf_attachment, leaf_hair_orientation,
    leaf_length_class, leaf_length_largest_leaves_class, leaf_length_to_width_ratio_class,
    leaf_margin_hairs, leaf_midrib_adaxial_relief, leaf_midrib_visibility,
    leaf_oil_gland_abundance, leaf_oil_gland_prominence, leaf_orientation, leaf_scent,
    leaf_thickness_categorical, leaf_venation, leaf_width_class, ovary_hair_orientation,
    ovary_hair_position, ovary_hairs, ovary_locule_count, pedicel_length_class,
    pedicel_presence, petal_hairs, seed_chaff_similarity, seed_length_to_width_ratio,
    seed_wings, sepal_hair_position, sepal_hairs, sepal_margin_hairs, sepal_oil_dots,
    sepal_persistence, sepal_shape, soil_terms, stamen_fusion,
    stamen_length_relative_to_petals, stamen_length_uniformity, stamen_whorls,
    stem_flange_extent, stem_flange_prominence, stem_flanges, stem_hair_persistence,
    stigma_shape, stigma_to_style_width_class, style_position, unfertilised_seed_colour,
    unfertilised_seed_shape.'
