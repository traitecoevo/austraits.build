taxonomic_updates: .na
exclude_observations:
- variable: taxon_name
  find: Leptospermum javanicum, Leptospermum parviflorum, Leptospermum recurvum
  reason: Non-Australian taxa (Malesia, New Guinea, Borneo and Sulawesi)
questions:
  question1: 'Multi-access key, Leaf apex: the state acute, prickly is printed 1,18,23,25.
    Read as a misprint for 11 (L. microcarpum): 1 (L. pallidum) is also listed under
    acute, not prickly and its description has no prickly wording, 11 is under no other
    leaf apex state, and couplet 16 keys L. microcarpum as prickly. Scored for L.
    microcarpum, not L. pallidum, with a note on each row. Confirm.'
  question2: 'When a taxon has a character from several places only the highest-ranked
    source is mapped: the taxon own text, then the multi-access key, then the dichotomous
    key (all stay in data.csv). Confirm the order. The multi-access key ranks above the
    dichotomous key because it scores each species singly, whereas most dichotomous leads
    cover a group.'
  question3: 'Stem flanges are one of the main diagnostic characters of the genus and are
    scored for all 31 species (candidate stem_flanges, stem_flange_prominence,
    stem_flange_extent). Consider a stem_flanges trait; stem_shape winged or angular is
    not the same character.'
  question4: 'Values with no level, mapped to the nearest: bark scaly -> flaky (Bean
    separates flaky from scaly under L. variabile; Lim_2010 also maps scales to flaky),
    seed shape linear -> ovoid_elongated (the elongate rule), seed striate -> ribbed and
    reticulate -> netted (precedent across the repo), anthers opening by narrow slits ->
    longitudinal_slit, not recurved margins -> flat, recurved margins -> revolute, creamy
    bark -> white, triangular twigs -> angular. Check these.'
  question5: 'L. petersonii leaf apex minutely retuse has no level in leaf_apex_shape and
    goes to excluded_data as an unsupported value. The multi-access state obtuse or
    minutely retuse is substituted to obtuse. Consider adding retuse to leaf_apex_shape.'
  question6: 'Inequalities in the keys (Largest leaves <9 mm, 9--15 mm, >15 mm; Fruit
    diameter <5 mm, >5 mm; Pedicels >8 mm; Leaves mostly >4 mm wide) are kept as *_class
    candidates, not leaf_length, fruit_width or pedicel_length, because a bound is not a
    measured value. They are the only leaf-length data for many taxa; say if you would
    rather map them as maximum or minimum values.'
  question7: 'Numbers that disagree within the paper, recorded as printed: L. madidum 22--70
    mm leaf length and 2.5--5.0 mm fruit width against subsp. sativum 20--45 mm and
    2.0--3.5 mm; L. venustum hypanthium 3--4 mm (description) against 3.5--4.0 mm (couplet
    32). Categorical disagreements: L. amboinense narrowly elliptical leaves (description)
    against lanceolate (Introduction), and sepals not persistent (description) against
    both states (multi-access key); L. variabile bark flaky (Note) against papery or
    fibrous (key).'
  question8: 'Seed morphology group 1 (seeds and chaff identical, linear, striate) is stated
    for all woody-fruited species. It is applied, as inferred_from_species_group, to L.
    gregarium, L. wooroonooran, L. oreophilum and L. variabile, which couplet 23 calls
    woody and which have no seed text of their own. L. recurvum (woody only by implication
    in the Introduction) and L. petersonii (never called woody) are left without seed
    values. Confirm.'
  question9: 'The paper has no Methods section, so sampling_strategy quotes the
    Introduction, the Seed morphology section and the Acknowledgements. Bean gave no
    statement of how characters were scored in the keys.'
  question10: 'L. brachyandrum hillside and creek-dwelling plants are alike in being
    protected from fire, and Bean adds that this is perhaps a determinant of its
    distribution. This is kept in habitat_description and habitat_terms; no fire response
    is scored.'
