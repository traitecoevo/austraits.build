dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      generate_observation_numbers(taxon_name, region) |>
      mutate(
        dataset_id = dplyr::case_when(
          dataset_id == "eFlora_NT" ~ "NTH_2022",
          dataset_id == "eFlora_SA" ~ "SAH_2022",
          dataset_id %in% c("Florabase_WA", "FloraBase_WA") ~ "WAH_2022_2",
          dataset_id == "PlantNET" ~ "NHNSW_2022",
          dataset_id == "RBGSYD_2021" ~ "NHNSW_2021",
          dataset_id == "VicFlora" ~ "RBGV_2022",
          dataset_id == "Flora_Aus" ~ "ABRS_2022",
          dataset_id == "EUCLID" ~ "CPBR_2022",
          TRUE ~ dataset_id
        )
      )
  '
  collection_date: 2026/2026
  source_id: dataset_id
  taxon_name: taxon_name
  trait_name: trait_name
  value: value
  location_name: region
  description: Dataset of flowering times for Australian angiosperms.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Manual scoring of species' flowering time for Australian angiosperm
    species found in AusPlots sites that were missing flowering_time data in the AusTraits
    v2.1 database. Included here are 95 species that were not in original submission
    to AusTraits in 2021
  measurement_remarks: URL
  original_file: in raw data folder
  notes: none
identifiers: .na
locations:
  Aus:
    latitude (deg): .na
    longitude (deg): .na
    description: .na
    state: .na
  NSW:
    latitude (deg): .na
    longitude (deg): .na
    description: .na
    state: NSW
  NT:
    latitude (deg): .na
    longitude (deg): .na
    description: .na
    state: NT
  SA:
    latitude (deg): .na
    longitude (deg): .na
    description: .na
    state: SA
  VIC:
    latitude (deg): .na
    longitude (deg): .na
    description: .na
    state: Vic
  WA:
    latitude (deg): .na
    longitude (deg): .na
    description: .na
    state: WA
contexts:
- context_property: trait value reliability
  category: method_context
  var_in: Reliable
  values:
  - find: '1'
    value: reliable trait value
  - find: '0'
    value: unreliable trait value
- context_property: replicate observations
  category: temporal_context
  var_in: observation_number
traits:
- var_in: flowering_time
  unit_in: .na
  trait_name: flowering_time
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: .na
  methods: Flowering time scored as whether a species has been recorded flowering
    in each month. Y = flowering in that month, N = not flowering in that month. Order
    of values indicates month, per AusTraits plant trait dictionary.
substitutions: .na
taxonomic_updates: .na
exclude_observations: .na
questions: .na
