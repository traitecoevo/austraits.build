questions:
  question1: Leaf chlorophyll a:b ratios and root:shhot ratios are lower than for
    most species. Confirming this is as you'd expect for these individuals/species
    relative to other data in AusTraits.
  question2: Coordinates for Ss2 (JC 2356; -14.1090, 126.6820) differ from those given
    for the same accession in Myrans_2024 (S1; -14.1025, 126.7097). Which pair is
    correct?
