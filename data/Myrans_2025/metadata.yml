dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2023-02/2023-04
  taxon_name: taxon_name
  location_name: location_name
  individual_id: individual_id
  description: To test how genotype and water availability interact to shape growth,
    chlorophyll and defence chemistry in three wild Australian Sorghum species sourced
    from more and less arid provenances, and to compare their response with domesticated
    sorghum.
  basis_of_record: captive_cultivated
  life_stage: sapling
  sampling_strategy: Two S. plumosum accessions, two S. stipoideum accessions, and
    two S. timorense accessions were germinated and grown in a standardized greenhouse
    environment for 8 weeks. The study accessions are a subset of those studied by
    Myrans et al. (2024) and sourced from either a more (1) or less (2) arid provenance,
    as defined by Williams et al. (2010) (Figure 1; Table 1). A well-studied, improved
    S. bicolor line, BTx623, was grown as the domesticated genotype for comparison.
    ^p Seeds of wild accessions were provided by the Australian Grains Genebank (Horsham,
    Australia), collected by the Australian Tropical Crops Genetic Resource Centre.
    All plants (n = 90) were grown in a greenhouse at Monash University (−37.91°,
    145.14°) between February and April 2023, with a mean temperature of 33.29°C ±
    0.07°C and 24.17°C ± 0.04°C day/night, a mean photoperiod of 12 h, and a mean
    relative humidity of 49.3% ± 0.2%. Supplementary light was provided using sodium
    lamps for 13 h per day (MK-1 Just-a-shade; Ablite). ^p Seeds were germinated following
    Cowan et al. (2020). Once the coleoptile and radicle had emerged, seedlings were
    planted in seedling trays containing Debco Seed and Cutting Premium Germinating
    Mix (Evergreen Garden Care Australia) and river sand (Bastion Pacific Pty Ltd)
    (2:1 v/v ratio) for 2 weeks. Seedlings were then transplanted into 6 L pots containing
    the same substrate, with 30 g Scotts Osmocote All Purpose Landscape Controlled
    Release Fertilizer (Evergreen Garden Care Australia) added. Each pot had four
    51 mm holes drilled into its base and was lined with 20 cm2 of 20 µm nylon mesh
    (Allied Filter Fabrics). ^p Control and drought treatments were imposed following
    Marchin et al. (2020). The potted plants were placed on 23 cm Ideal Floral Foam
    Maxlife Bricks (OASIS Floral Australia), which were standing inside 100 L plastic
    tubs filled with water to 1 cm below the top of the floral foam (z = 1 cm). There
    were 16 tubs in total (eight per treatment), with five or six plants per tub (organized
    in randomized incomplete blocks). For the first 2 weeks after transplanting, plants
    were allowed to adapt to capillary watering in the tubs, with all tubs at z =
    1 cm. After this, half the tubs stayed at z = 1 cm (control treatment), and the
    other half were drained until z = 21 cm (drought treatment) for 4 weeks, that
    is, 8 weeks after transplanting. This duration was chosen as it had been shown
    by Rosati, Blomstedt, et al. (2019) to be sufficient to induce changes in composition
    and biomass, without causing extensive senescence or death. We also wanted to
    complete the experiment when plants were still in the vegetative stage as the
    time to flowering is unknown in the wild species. Tub water levels were topped
    up twice per week to maintain consistent z levels. Soil volumetric water content
    (VWC; %) of each pot was measured twice weekly using a CS658 HydroSenseII with
    a 20 cm water content probe (Campbell Scientific Inc.). If VWC dropped below 20%
    or 5% in control or drought pots, respectively, the pot was top-watered with 250
    mL water to maintain target VWC (Figure 2). Replicate numbers for each group at
    the start and end of the treatment period can be found in Table 2. ^p Plants were
    harvested 4 weeks after the imposition of the treatment (i.e., 8 weeks after transplanting).
    Plants were separated into leaves (leaf blades), sheaths (leaf sheaths plus stems),
    and roots, and oven dried at 50°C for 72 h.
  original_file: raw data downloaded from Monash Bridges, doi.org/10.26180/28406183
  notes: Locations are the seed-collection (provenance) sites of the five wild accessions
    from Table 2. All plants were grown and measured in a greenhouse at Monash University
    (-37.91, 145.14). The domesticated Sorghum bicolor inbred line BTx623 has no seed-collection
    site, so its rows are deliberately left without a location rather than given the
    greenhouse coordinates. Additional traits present in data.csv are leaf, leaf sheath
    and root HCN potential.
