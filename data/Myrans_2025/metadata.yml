traits:
- var_in: root_shoot_ratio
  unit_in: mg{root}/mg{shoot}
  trait_name: root_shoot_ratio
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'Plants were harvested 4 weeks after the imposition of the treatment (i.e.,
    8 weeks after transplanting). Plants were separated into leaves (leaf blades),
    sheaths (leaf sheaths plus stems), and roots, and oven dried at 50°C for 72 h.
    Plant growth was quantified by measuring the biomass of the leaves, sheaths, and
    roots for each plant. Senesced leaves were included in total biomass measurements,
    but not in chemical analysis. The root:shoot ratio was calculated using the following
    equation: Root:shoot ratio = root biomass / (leaf biomass + sheath biomass).'
- var_in: leaf_chlorophyll_mg_per_g
  unit_in: mg/g
  trait_name: leaf_chlorophyll_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Concentrations of chlorophyll a and b were measured following Gleadow et
    al. (1983), as modified by Burns et al. (2002). Chlorophyll was extracted from
    10 mg dried, ground leaf tissue by mixing with 1.5 mL 80% acetone solution and
    a ball bearing before shaking in a TissueLyser II (Qiagen) for 1 min. The mixture
    was centrifuged at 15,000 rpm for 2 min and the supernatant collected. The pellet
    was then twice resuspended in 0.5 mL 80% acetone, shaken for one more minute,
    and centrifuged for 2 min, with supernatants from the three extractions per sample
    pooled. The pooled supernatant was poured into a 1.6 mL semi-micro cuvette and
    its absorbance was measured at 664 and 647 nm in a Cary 50 Bio UV–Visible Spectrophotometer
    (Varian).
- var_in: chlorophyll_a_b_ratio
  unit_in: umol{chlorophyllA}/umol{chlorophyllB}
  trait_name: leaf_chlorophyll_A_B_ratio
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Concentrations of chlorophyll a and b were measured following Gleadow et
    al. (1983), as modified by Burns et al. (2002). Chlorophyll was extracted from
    10 mg dried, ground leaf tissue by mixing with 1.5 mL 80% acetone solution and
    a ball bearing before shaking in a TissueLyser II (Qiagen) for 1 min. The mixture
    was centrifuged at 15,000 rpm for 2 min and the supernatant collected. The pellet
    was then twice resuspended in 0.5 mL 80% acetone, shaken for one more minute,
    and centrifuged for 2 min, with supernatants from the three extractions per sample
    pooled. The pooled supernatant was poured into a 1.6 mL semi-micro cuvette and
    its absorbance was measured at 664 and 647 nm in a Cary 50 Bio UV–Visible Spectrophotometer
    (Varian).
- var_in: leaf_phenolics_mg_per_g
  unit_in: mg/g
  trait_name: leaf_phenol_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Phenolic concentration was measured by colorimetric assay in 96-well microtiter
    plates, following a Folin–Ciocalteu method adapted from Ainsworth and Gillespie
    (2007) and Bärlocher and Graça (2020). Ten milligrams of ground tissue was mixed
    with 1 mL 70% acetone solution. Twenty microliters of acetone mixture was then
    mixed with 20 µL distilled water, 20 µL diluted Folin–Ciocalteu reagent, and 200
    µL of 2% sodium carbonate in 0.1 M sodium hydroxide solution. This mixture was
    incubated at room temperature for 2 h before its absorbance was measured at 760
    nm (FLUOstar Galaxy; BMG Labtechnologies). Gallic acid (91215; Sigma-Aldrich)
    was used to produce the standard curve.
