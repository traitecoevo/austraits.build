  custom_R_code: '
    data |>
      dplyr::filter(
        !source_id %in% c(
          "Scaccabarozzi_2020", "Scaccabarozzi_2024 Scaccabarozzi_2020", "Scaccabarozzi_2025"
        )
      ) |>
      dplyr::distinct()
    '
  collection_date: collection_date
  taxon_name: taxon_name
  location_name: location_name
  source_id: source_id
  description: To document the animals that pollinate or visit the flowers of plant
    species in southwestern Australia.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The 10 examples of biotic interactions I give here are largely
    taken from Southwestern Australia, renowned for its exceptionally nutrient-impoverished
    soils among the Mediterranean-type-climate biomes of the Earth (Kruger et al.
    1983). One might therefore expect nutrient relations among its biotic components
    to be exceptionally ‘tight’ in order to minimise ‘leakiness’ of the ecosystem
    (this topic was first pursued by Lamont (1982a), under the heading ‘Specialised
    Modes of Nutrition and the Plugging of Ecosystem Leaks’). Minimising leakiness
    would be expressed by such features as (a) efficient nutrient uptake, including
    mutualistic relations between micro-organisms and roots (mycorrhizas, nitrogen-fixing
    nodules) (Brundrett 2009), (b) utilising novel sources of nutrients via carnivory
    and parasitism (Lamont 1982a), (c) efficient remobilisation of absorbed nutrients
    to the reproductive parts of the plant (Witkowski and Lamont 1996) and from the
    seed to the seedling (Lamont and Groom 2002), (d) pollination mechanisms that
    ensure the fittest (outcrossed) seeds mature (Brundrett et al. 2024) and (e) the
    effective protection of leaves from herbivores, and nutrient-packed seeds from
    granivores (Hanley et al. 2007). The expression of most of these possibilities
    is demonstrated here, they are not unique to SW Australia, they are just especially
    abundant and complex in this biome. Note that this hypothesis-testing approach
    to research now takes us from the traditional natural history perspective into
    the realm of ecology, but that the techniques of the naturalist (accurate identifications;
    careful measurements; multiple observations) remain unchanged. ^p All data used
    in this review are available from the cited references and other sources given
    in the captions to each figure. ^p Table of flowering plant species and their
    pollinators in SW australia. Collated by Prof Byron B Lamont Oct 2026.
  original_file: raw/Table of flowering plant species and their pollinators in SW
    australia.docx; data.csv
    is written from it by raw/extra_R_code_Lamont_2026.R.
  notes: Each row of the table is one plant species x animal species record, attributed
    (source_id) to the study that first published it; references the table gives as
    "also see" are secondary references. data.csv keeps the table's six columns as
    given and adds the derived columns written by raw/extra_R_code_Lamont_2026.R.
    Rows whose Notes say the animal was not inspected for pollen, or was an ineffective
    pollinator, are mapped to flower_visitor; all other rows, where the Notes record
    pollen or pollinaria carried on the body, pollen harvested, or the animal's role
    as the plant's pollinator, are mapped to pollination_vector_possible. The animal
    named in the table is kept as the flower visitor taxon name context, with common
    names removed and spellings corrected (Aleucosia, Cercartetus, Scoliidae, Leioproctus
    (Leioproctus), Vanessa kershawi). Records of the same observations in Elliott_2026
    (Banksia ilicifolia, Lamont and Collins 1988) and Brown_1997 (Lamont 1982, 1985;
    Houston et al. 1993; Peakall 1989; Stylidium scandens) are kept here, and are
    filtered from those datasets. Sites and observation dates for these records are
    taken from Elliott_2026 and Brown_1997 (records at several sites become one row
    per site). Rewards (flower_pollinator_reward) are mapped from the Notes (sexual
    deception, pollen harvested or ingested) and, for Diuris magnifica and Thelymitra
    crinita, from Lamont (2026). Records from Scaccabarozzi et al. (2020, 2024) and
    Scaccabarozzi and Sletvold (2025) are retained as part of those datasets (Scaccabarozzi_2020,
    Scaccabarozzi_2025). Additional traits, flowering_time_diel. The table also notes
    pollinators that are monolectic.
