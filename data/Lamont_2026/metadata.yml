traits:
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Table of flowering plant species and their pollinators in SW australia.
    Collated by Prof Byron B Lamont Oct 2026. ^p Each record is an animal taxon listed
    as a pollinator of the plant species, with the table's notes recording pollen
    or pollinaria carried on its body, pollen harvested from the flowers, or its role
    in the plant's pollination system; or autonomous, where the notes record that
    the plant self-pollinates when no pollinator visits.
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Table of flowering plant species and their pollinators in SW australia.
    Collated by Prof Byron B Lamont Oct 2026. ^p Each record is an animal taxon recorded
    visiting the flowers, where the table's notes record that it was not inspected
    for pollen, or that it carries pollen but is an ineffective pollinator.
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Table of flowering plant species and their pollinators in SW australia.
    Collated by Prof Byron B Lamont Oct 2026. ^p These orchids produce no nectar and
    the pollen coheres into a pollinarium with a viscid disc at its apex that cannot
    be harvested in the usual way. ^p The sun orchid Thelymitra has yellow-tipped
    projections (false anthers) above the anther-stigma that deceive bees, such as
    Leioproctus, into pollinating for no reward. ^p Each record is the reward the
    listed pollinator receives, from the table's notes (sexually deceptive orchids,
    pollen harvested or ingested by the visitor) or, for Diuris magnifica and Thelymitra
    crinita, the text of Lamont (2026).
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Table of flowering plant species and their pollinators in SW australia.
    Collated by Prof Byron B Lamont Oct 2026. ^p Will self-pollinate if no wasps.
    ^p Each record is a plant species whose notes in the table record that it self-pollinates
    when its pollinators do not visit.
- var_in: pollination_syndrome
  unit_in: .na
  trait_name: pollination_syndrome
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Table of flowering plant species and their pollinators in SW australia.
    Collated by Prof Byron B Lamont Oct 2026. ^p Mammal-pollinated syndrome. ^p Each
    record is a plant species whose notes in the table record its pollination syndrome.
