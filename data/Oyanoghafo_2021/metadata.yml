questions:
  question1: Prior to adding this dataset the highest wood density was 1.26 mg/mm3
    (out of 10,000+ entries). Given that some of your values are 3-4 times larger
    than this I am wondering if there is something unusual about the method you used?
    Hakea species of course have dense wood, but these values are really very high
    - and most of your data is filtered out of AusTraits because we've set the maximum
    allowed value at 1.4 mg/mm3.
  question2: P88 values for the Hakea species are currently digitised from Supplementary
    Fig. S3 (to about 0.05 MPa). Could you provide a table with this data?
  question3: Could you provide the Chapter 2 (thesis) data for the 20 species (Banksia, Buckinghamia, Grevillea, Persoonia and Hakea sericea) not included in the publications -- traits should include P50,
    P88, wood density, SLA, Huber value, LDMC, maximum vessel length and xylem specific
    conductivity? P50 is currently digitised from thesis Fig. 2 and the other traits
    are only shown as unlabelled points.
  question4: When were the Mount Annan branches collected for Chapters 2 and 3? collection_date
    is currently set to 2020, the year the primary manuscript was submitted. A month or year is fine - I'm not searching for an exact data.
  question5: For the Banksia marginata experiment (Oyanoghafo et al. 2023), could
    you provide the individual-plant data (plant ID, provenance, water treatment,
