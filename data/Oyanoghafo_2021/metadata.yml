dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: collection_date
  taxon_name: Species
  location_name: location
  source_id: source_id
  description: A study comparing the cavitation resistance of Hakea and other Proteaceae
    species that differ in life history and climatic niche, to determine which attributes
    allow species to persist in arid climates.
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: 'Experimental design and species selection ^p All samples were
    collected from the Australian Botanic Garden (ABG), Mount Annan, NSW, Australia
    [GPS location, latitude -34.0703, longitude 150.7668, average annual rainfall
    of 759 mm (2007-016)] and were well watered via irrigation systems (simulating
    a common garden design). Comparing multiple species from the same Hakea genus
    in a common garden minimizes environmental effects and allows quantification of
    genetically determined trait variation. Using this approach, we examined the variation
    in functional traits and vulnerability to xylem cavitation traits of a diverse
    array of species sampled from across the Hakea phylogeny (Cardillo et al., 2017).
    A total of 16 species were selected to represent a wide range of vegetation type,
    biome, climate and life histories (Table 1). Species occurrence records were downloaded
    from the Australian Living Atlas (https://www.ala.org.au/, 2019). Life history
    traits (resprouting ability and leaf form) were obtained from published flora,
    such as Flora of Australia, and field observations. Vegetation type was defined
    according to the World Wildlife Fund (WWF) as abbreviated by Cardillo et al. (2017),
    arid (deserts and xeric shrublands), Mediterranean (Mediterranean forests, woodlands
    and scrub), forest (temperate broadleaf and mixed forests) and grasslands (temperate
    grasslands, savannas and shrublands). The vegetation harbouring >50 % of the species
    occurrence records was assigned as its vegetation type (Cardillo et al., 2017).
    Biome was defined based on the aridity index (AI; UNEP, 1997) as broadly humid
    and arid (AI >0.5 and <0.5, respectively). The climate summary details for each
    species distribution were obtained from The Atlas of Living Australia using R
    v3.6.3 (R Core Team, 2020). ^p Sampling of plant material ^p Three individuals
    for each species were sampled from the above-ground biomass. Terminal full sunlight,
    north-facing branches that were approx. 90 cm long were sampled and placed into
    a black plastic bag with wet tissue paper and transported immediately to the laboratory
    (<90 min). Samples were stored in a cold room at 4 °C until they were processed
    (within 10 d). ^p To minimize environmental effects and quantify genetically determined
    trait variation among species, I used a common garden design with all samples
    obtained from well-watered garden in the Australian Botanic Garden (ABG), Mount
    Annan, NSW, Australia [GPS location: latitude -34.0703, longitude 150.7668, average
    annual rainfall of 759 mm (2007-2016)] (Oyanoghafo et al., 2021). To determine
    xylem physiological tolerance within this family, I selected species consisting
    of arid and humid species from genera that have transitioned into arid biome
    (Hakea and Grevillea) or can occupy arid margins (Banksia and Persoonia) along
    with a species from typical rainforest specific genus (Buckinghamia). A total
    of 28 species were selected to represent a wide range of vegetation types, biomes,
    climates and life histories (Table 1) to explore the relationship between physiological
    tolerance, with other functional traits and climate. I was limited to sampling
    six (6) individuals of each species to minimise damage and impact to the living
    collections. Sunlit north facing terminal branches (ca. 90 cm long) were sampled,
    stored in an opaque black plastic bag with wet tissue paper, transported to the
    laboratory immediately (<90 minutes), stored in the cold room at a temperature
    of 4°C, and processed within 10 days (Oyanoghafo et al., 2021). ^p We selected
    seven naturally occurring populations of B. marginata with contrasting climate-origins
    (wet and dry) partitioned by precipitation of warmest quarter (PWQ) (Table S1,
    supplementary information). Seeds were collected from natural populations from
    distinct maternal individuals, dried and stored at room temperature. Seeds were
    sown on 29 January 2020, initially under nursery conditions in Hiko planting trays
    at the South West TAFE, Sherwood Park Campus growth facility (Warrnambool, Victoria,
    Australia). After establishment, seedlings were planted into 20 cm pots containing
    native potting mix (Bio Grow, Mt Gambier - Banksia/Grevillea mix) on 11th of September
    2020. ^p We conducted a water-controlled glasshouse experiment with seven populations
    of B. marginata using a split block design. The glasshouse regulated temperature
    through roof vents, misting, and a hydronic pump system (mean temperature 18.9
    °C and relative humidity of 57%). Pots were randomly arranged in blocks on pallets
    (1.1 m x 1.1 m) with two replicates of each population, except FUR which only
    had a single plant on each pallet due to low germination success. The design
    consisted of 16 pallets in the growth facility with 4 rows with 4 pallets per
    row, which was surrounded by a border row of B. marginata plants (not included
    in data collection) to minimize potential edge effects on the study plants. Pallets
    were assigned to well-watered and water reduction (water-limited) treatments,
    alternating treatments between neighbouring pallets. This resulted in 16 replicates
    per population per treatment (i.e. a total of at least 32 individuals per population),
    except one population (FUR) with 8 replicates per treatment (16 individuals).
    Some plants were lost from the experiment as they did not establish or were impacted
    from other factors (e.g. insect) as such at completion, BAY, JIL, LMS, and MHA
    populations had 20 individuals while COL, FUR, and WLT had 10, 12, and 15 individuals
    respectively (i.e. 117 established plants). ^p Initially, plants were watered
    by hand twice a week to allow for sapling acclimatisation during the establishment
    phase. Drippers delivering 3 L/h on 4-way manifolds, connected to 5 mm tubing
    running along each row from a programmable controller were established. All plants
    were well watered for 6 weeks before the water treatment was imposed. The frequency
    and duration of watering events (irrigation) supplied to each pot was adjusted
    to achieve the significant differences in plant water availability realised in
    differential growth responses. Plants assigned to the well-watered treatment received
    irrigation five times per week for 15 minutes (ca. 935 ml per week), while those
    assigned to the water-limited treatment were irrigated three times per week for
    seven minutes (ca. 261 ml per week). The well-watered and water-limited treatments
    received an average water supply of 7.02% (weighing 90 g) and 3.43% (weighing
    47 g) respectively. This design was implemented to mimic prolonged water limited
    stress but to avoid plant death. ^p Plant trait measurements were conducted after
    129-151 days in the treatment period. ^p Plant size was measured non-destructively
    on 14th May 2021 (151 days) on all established plants as indicator of growth.
    Plant height (Hmax, mm) was measured with a ruler starting from the soil level
    to the highest tip of the plant. Basal diameter (BD, mm) at the base of each plant
    was obtained using a digital calliper as an average of two perpendicular measures.
    Total leaf area (TLA, cm2) was estimated as the total leaf count multiplied by
    the average leaf size obtained from the leaf area meter (see functional traits
    below).'
  original_file: transcribed from papers and thesis
  notes: Hakea species (source_id Oyanoghafo_2021) are transcribed from Table 1 and
    Table 3 of the primary reference. P88 values were digitised from the bar chart
    in the primary reference's Supplementary Fig. S3 (reproduced as thesis Fig. S6),
    calibrated against the three P88 values stated in the Results text (H. salicifolia,
    H. macraeana, H. tephrosperma); digitised values are accurate to about 0.05 MPa
    and reproduce the arid and humid biome means given in the text. The 20 additional
    species (source_id Oyanoghafo_2022) come from Chapter 2 of the thesis, Table 1
    (biome, vegetation, climate) and Fig. 2 (P50, digitised the same way and calibrated
    against the nine Hakea P50 values shared with the primary reference plus the
    G. hilliana and G. spinosa values stated in the text; accurate to about 0.05
    MPa). Banksia marginata
    rows (source_id Oyanoghafo_2023) are the means stated in the Results text of
    that paper, the only values published; they pool all seven provenances within
    a water treatment (wood density, LDMC, stomatal conductance, water potentials),
    or the provenances within each climate-origin and water treatment (SLA). LDMC
    means by climate-origin pooled across treatments (wet 0.294, dry 0.274 g/g) are
    not included. Whole-plant leaf area, biomass and relative growth rate data exist
    in the data.csv file. Wood density, SLA, Huber value, LDMC, maximum vessel length and xylem specific
    conductivity of the thesis-only species are shown only as unlabelled points in
    thesis Figs 4 and 5 and could not be extracted. The column "Mean individual leaf
    size (cm2) (per 40 cm branch length)" is the total leaf area of the 40 cm branch
    and is not mapped.
