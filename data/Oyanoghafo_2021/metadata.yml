- var_in: WD (g cm-3)
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  basis_of_record: lab
  life_stage: sapling
  methods: 'Wood density was obtained through destructive harvest of the 117 established
    plants Wood density [stem dry mass (g)/stem volume (cm3)] was estimated on a 5
    cm standard length from the base of the main stem. Wood volume obtained using
    the formula: V= (0.5D)2 × pi × L (Pérez-Harguindeguy et al., 2013), where D is
    the stem diameter with bark removed measured by averaging three digital calliper
    measurements (top, middle and bottom), and L is the stem length. Wood samples
    were subsequently oven-dried for 105°C for 72 h and weighed to determine the stem
    dry mass.'
- var_in: SLA (cm2 g-1)
  unit_in: cm2/g
  trait_name: leaf_mass_per_area
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 15-20
  basis_of_record: lab
  life_stage: sapling
  methods: Specific leaf area (SLA) was measured using five (5) well-developed and
    healthy leaves from five (5) replicate plants per population per treatment were
    sampled during destructive harvest, scanned through the leaf area meter, and dry
    mass obtained using the oven. Specific leaf area (SLA) was estimated as the leaf
    area over the dry mass of the leaf sample [leaf area (cm2)/dry mass (g)].
- var_in: LDMC (g g-1)
  unit_in: g/g
  trait_name: leaf_dry_matter_content
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 35
  basis_of_record: lab
  life_stage: sapling
  methods: Sub-samples of plants were used to estimate functional traits on 14 May
    2021 (151 days). Leaf area was estimated on a sub-sample of 10 leaves (fully expanded
    sun-lit) using a leaf area meter (Li-Cor 3100, LI-COR, Lincoln, NE, USA). Leaf
    samples were weighed to determine fresh mass and then leaf samples were oven-dried
    at 70°C for 48 h to obtain dry mass; these data were used to determine leaf dry
    matter content (LDMC = dry mass (g)/fresh mass (g)).
- var_in: gs (mmol m-2 s-1)
  unit_in: mmol{H2O}/m2/s
  trait_name: leaf_stomatal_conductance_per_area_ambient
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: 35
  basis_of_record: lab
  life_stage: sapling
  methods: Water potential, psi (predawn, PD and midday MD, -MPa), stomatal conductance
    (gs), and relative chlorophyll content (RC) were measured on 22 April 2021 (129
    days). A single fully expanded, sun-lit, leaf from five (5) replicates per population
    per treatment was sampled at predawn (ca 1 hour before sunrise) and midday to
    obtain leaf water potentials using a Scholander pressure chamber. Stomatal conductance
    was measured on an adjacent leaf on the same individuals between 10 am and 1:00
    pm using a leaf porometer (SC-1 Leaf Porometer) at relative humidity 50-80%.
