questions:
  question1: Table 1 gives the seed sources of Alyogyne hakeifolia (Salmon Gums),
    Alyogyne huegelii (near Esperance), Grevillea scapigera (translocated population
    at Corrigin) and Codonocarpus cotinifolius (Hyden) without coordinates. Do you
    have coordinates for these collections?
  question2: Table 2 gives 72% viable seeds for Alyogyne hakeifolia and 60% for Tersonia
    cyathiflora, while the non-heated seeds in the July 2004 tetrazolium test were
    56% and 96% viable. Were the same seed lots used in both tests, and do the July
    2004 values include the possibly viable seeds?
