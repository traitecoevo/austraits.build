source:
  dataset:
    key: Baker_2005
    bibtype: Article
    year: 2005
    author: Katherine S. Baker and Kathryn J. Steadman and Julie A. Plummer and Kingsley
      W. Dixon
    title: Seed dormancy and germination responses of nine Australian fire ephemerals
    journal: Plant and Soil
    volume: 277
    number: 1-2
    pages: 345--358
    doi: 10.1007/s11104-005-7971-9
contributors:
  data_collectors:
  - last_name: Downes
    given_name: Katherine S.
    ORCID: 0000-0003-1148-8649
    affiliation: School of Plant Biology, Faculty of Natural and Agricultural Sciences,
      The University of Western Australia, Crawley, WA, Australia
    notes: published as Katherine S. Baker
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        !trait %in% c(
          "lifespan", "seed_possibly_viable_fraction", "seed_dead_fraction",
          "excised_embryo_normal_growth", "cotyledon_protrusion_without_radicle"
        ),
        !(trait %in% c("seed_viability", "seed_water_permeable_fraction") &
          dplyr::coalesce(seed_treatment, "") == "100 °C 1 h"),
        !grepl("^pooled", dplyr::coalesce(seed_treatment, ""))
      )
    '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: value
  location_name: location_name
  description: To classify the seed dormancy types of nine Western Australian fire
    ephemerals and identify the incubation conditions and treatments (temperature,
    light, chemicals, scarification, heat and smoke) that release dormancy and allow
    fresh and stored seed to be germinated ex situ.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: This study investigates the germination requirements of the following
    nine fire ephemerals, Austrostipa compressa, Austrostipa macalpinei (Poaceae),
    Alyogyne hakeifolia, Alyogyne huegelii (Malvaceae), Actinotus leucocephalus (Apiaceae),
    Codonocarpus cotinifolius, Gyrostemon racemiger and Tersonia cyathiflora (Gyrostemonaceae)
    and Grevillea scapigera (Proteaceae; Bell et al., 1984; Pate et al., 1985; Pate
    and Dixon, 1996; Rossetto et al., 1995). Austrostipa compressa, Austrostipa macalpinei
    and Actinotus leucocephalus are monocarpic fire ephemerals and the remaining species
    are polycarpic fire ephemerals. All of these species occur within the south-west
    botanical province of Western Australia which has a mediterranean climate, although
    not all species are restricted to this area. ^p Seed collection and provenance
    data is outlined in Table 1. Voucher specimens of Actinotus leucocephalus, Austrostipa
    compressa, Austrostipa macalpinei and Gyrostemon racemiger were lodged at the Western
    Australian Herbarium (PERTH). After collection, seeds were air-dried and stored
    in sealed containers at 15 °C until use in germination tests, except Alyogyne
    hakeifolia, Alyogyne huegelii and Codonocarpus cotinifolius seeds which were stored
    at 4 °C until February 2002 and then transferred to 15 °C. Experiments were undertaken
    on the mericarps of Actinotus leucocephalus (hereafter referred to as 'seeds')
    and the seeds of all other species. ^p Germination tests were performed between
    April 2002 and April 2003. To prevent fungal contamination, seeds were shaken for
    30 s in a 2% w/v NaOCl solution containing two drops of a non-ionic surfactant
    (Plus 50, Ciba-Geigy, Sydney) per 250 mL, unless noted otherwise. [...] Four replicates
    of 25 seeds were used in each treatment. Seeds were placed on two pieces of filter
    paper (Whatman No. 1) over three 4 cm2 pieces of absorbent sponge in 90 mm diameter
    plastic Petri dishes. These were moistened with 10 mL of sterile distilled water
    containing 0.15% v/v of the fungicide Previcur (Aventis, Melbourne, active ingredient
    600 g L-1 propamocarb) unless noted otherwise. All Petri dishes were sealed with
    Parafilm and placed in transparent plastic bags. Light was provided by cool white
    fluorescent tubes (50 umol m-2 s-1 PAR; R:FR=9:1). Seeds were monitored weekly
    for 84 days and germination was scored when the radicle emerged >2 mm. Seeds that
    displayed cotyledon but not radicle emergence were noted separately.
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: Candidate traits not in config/traits.yml remain unmapped in data.csv, seed_filled_fraction
    (cut test), embryo_type (seed types of Martin 1946), embryo_development, seed_water_permeable_fraction
    (Alyogyne only) and monocarpy (monocarpic vs polycarpic fire ephemerals). Rows
    filtered in custom_R_code but kept in data.csv are lifespan (the Introduction's
    statement that polycarpic fire ephemerals flower and set seed over three to four,
    occasionally up to 10 years, which describes the functional group, not each species),
    the tetrazolium possibly viable and dead fractions, excised embryo growth, cotyledon
    protrusion without radicle emergence, seed viability and water permeability after
    heating at 100 °C for 1 h, and a 5-15% germination range pooled across three Actinotus
    leucocephalus treatments. Most germination percentages are shown only as bars
    and curves in Figures 1-5; only values stated in the text are included, with '<3%'
    and similar bounds entered as maximum and '>70%' as minimum values. The Grevillea
    scapigera seed came from a translocated population.
