contexts:
- context_property: fire history
  category: plot_context
  var_in: site_fire_history
  values:
  - value: burnt
    description: seed collected at a burnt site
  - value: unburnt
    description: seed collected at an unburnt rehabilitation site with re-spread topsoil
- context_property: seed collection date
  category: entity_context
  var_in: seed_collection_date
- context_property: seed pre-germination treatment
  category: treatment_context
  var_in: seed_treatment
  values:
  - value: control
    description: untreated seeds; incubated in sterile distilled water with 0.15% v/v
      Previcur (pH 5.6)
  - value: hydrogen peroxide
    description: seeds presoaked in 1% v/v H2O2 for 24 h at 20 °C, then washed five
      times in distilled water
  - value: polyvinylpyrrolidone
    description: surface-sterilised seeds soaked in 2% w/v polyvinylpyrrolidone for
      30 min, then washed five times in distilled water
  - value: sulphuric acid
    description: seeds soaked in concentrated H2SO4 for 5 min, then washed five times
      in sterile distilled water
  - value: potassium hydroxide
    description: seeds soaked in 5 M KOH for 10 min, then washed five times in sterile
      distilled water
  - value: manual scarification
    description: palea and lemma peeled from Austrostipa seeds, pericarp removed from
      Actinotus leucocephalus mericarps, or a 1 mm2 portion of the seed coat removed
      from the side of the seed in other species
  - value: ethylene
    description: seeds imbibed at 20 °C for 24 h, then exposed to 200 uL L-1 ethylene
      for 24 h
  - value: gibberellic acid
    description: seeds incubated in 30 uM GA3
  - value: potassium nitrate
    description: seeds incubated in 10 mM KNO3 (pH 5.9)
  - value: smoke water
    description: seeds incubated in smoke water (Seed Starter) diluted to 1:10 v/v
  - value: 70 °C 10 min
    description: seeds heated in aluminium foil at 70 °C for 10 min, then held at 20
      °C for 12 h before incubation
  - value: 70 °C 1 h
    description: seeds heated in aluminium foil at 70 °C for 1 h, then held at 20 °C
      for 12 h before incubation
  - value: 70 °C 1 h x 5
    description: seeds alternately heated at 70 °C for 1 h and cooled at 20 °C for
      1 h five times, then held at 20 °C for 12 h before incubation
  - value: 70 °C 1 h + smoke water
    description: seeds heated at 70 °C for 1 h, then incubated in 1:10 v/v smoke water
  - value: 70 °C 1 h x 5 + smoke water
    description: seeds heated at 70 °C for 1 h five times, then incubated in 1:10
      v/v smoke water
  - value: 100 °C 1 h
    description: seeds heated in aluminium foil at 100 °C for 1 h, then held at 20
      °C for 12 h before incubation
  - value: 100 °C 1 h + smoke water
    description: seeds heated at 100 °C for 1 h, then incubated in 1:10 v/v smoke
      water
  - value: smoke water 0.1% v/v, continuous
    description: seeds incubated continuously in 0.1% v/v smoke water
  - value: smoke water 1% v/v, continuous
    description: seeds incubated continuously in 1% v/v smoke water
  - value: smoke water 5% v/v, continuous
    description: seeds incubated continuously in 5% v/v smoke water
  - value: smoke water 10% v/v, continuous
    description: seeds incubated continuously in 10% v/v smoke water
  - value: smoke water 15% v/v, continuous
    description: seeds incubated continuously in 15% v/v smoke water
  - value: smoke water 20% v/v, continuous
    description: seeds incubated continuously in 20% v/v smoke water
  - value: smoke water 30% v/v, continuous
    description: seeds incubated continuously in 30% v/v smoke water
  - value: smoke water 30% v/v, 24 h pulse
    description: seeds imbibed in 30% v/v smoke water for 24 h at 20 °C, rinsed three
      times and incubated in distilled water
- context_property: incubation temperature (C)
  category: treatment_context
  var_in: incubation_temperature
  values:
  - value: '5'
    description: constant 5 °C
  - value: '10'
    description: constant 10 °C
  - value: '15'
    description: constant 15 °C
  - value: '20'
    description: constant 20 °C
  - value: 25/15
    description: alternating 25 °C and 15 °C, 12 h each
  - value: '30'
    description: constant 30 °C
- context_property: incubation light condition
  category: treatment_context
  var_in: light_regime
  values:
  - value: 12 h light/12 h dark
    description: 12 h light, 12 h dark diurnal cycle
  - value: continuous darkness
    description: dishes wrapped in aluminium foil to exclude light
- context_property: incubation light red to far-red ratio
  category: treatment_context
  var_in: red_far_red_ratio
  values:
  - value: '9:1'
    description: cool white fluorescent tubes, typical of germination incubators but
      not found in nature
  - value: '1.1:1'
    description: fluorescent and incandescent lights, similar to unfiltered sunlight
- context_property: germination test duration (days)
  category: method_context
  var_in: germination_test_duration
traits:
- var_in: life_history_ephemeral_class
  unit_in: .na
  trait_name: life_history_ephemeral_class
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Fire ephemerals are short-lived plants with seeds that persist in the soil
    and germinate after a fire or physical soil disturbance. ^p This study investigates
    the germination requirements of the following nine fire ephemerals, Austrostipa
    compressa, Austrostipa macalpinei (Poaceae), Alyogyne hakeifolia, Alyogyne huegelii
    (Malvaceae), Actinotus leucocephalus (Apiaceae), Codonocarpus cotinifolius, Gyrostemon
    racemiger and Tersonia cyathiflora (Gyrostemonaceae) and Grevillea scapigera (Proteaceae;
    Bell et al., 1984; Pate et al., 1985; Pate and Dixon, 1996; Rossetto et al., 1995).
    ^p Records the authors' classification of each study species as a fire ephemeral.
- var_in: life_history
  unit_in: .na
  trait_name: life_history
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Fire ephemerals can be either monocarpic (fire annuals), flowering and
    producing seeds once, or polycarpic (fire perennials), flowering and producing
    seeds over three to four and occasionally up to 10 years (Pate et al., 1985; Pate
    and Dixon, 1996). ^p Austrostipa compressa, Austrostipa macalpinei and Actinotus
    leucocephalus are monocarpic fire ephemerals and the remaining species are polycarpic
    fire ephemerals.
- var_in: seedbank_location
  unit_in: .na
  trait_name: seedbank_location
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Fire ephemerals are a functional group of species in each of these regions
    that predominantly germinate after fire, are short-lived and persist between fires
    as seeds in the soil seedbank (Bell et al., 1984; Le Maitre and Midgley, 1992;
    Pate et al., 1985; Thanos and Rundel, 1995). ^p Records the seed store of the
    fire ephemeral functional group for each study species.
- var_in: seedbank_longevity_class
  unit_in: .na
  trait_name: seedbank_longevity_class
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Fire ephemerals are a functional group of species in each of these regions
    that predominantly germinate after fire, are short-lived and persist between fires
    as seeds in the soil seedbank (Bell et al., 1984; Le Maitre and Midgley, 1992;
    Pate et al., 1985; Thanos and Rundel, 1995). ^p This appears to conflict with
    the notion that these species usually form persistent seedbanks and require fire
    to germinate (Bell, 1999; Smith et al., 1999). ^p Records the seedbank persistence
    of the fire ephemeral functional group for each study species.
- var_in: post_fire_recruitment
  unit_in: .na
  trait_name: post_fire_recruitment
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Under natural conditions, fire-related cue(s) appear to play an important
    role in the germination of fire ephemerals from the soil seedbank, as highly synchronous
    germination events occur in the growing season following a fire (Pate and Dixon,
    1996). ^p Although the nine fire ephemerals examined require fire to germinate
    under natural conditions, a range of germination responses and dormancy types
    was observed. ^p Surprisingly, whereas all the study species respond to fire in
    their natural habitat, this unifying relationship was not evident in the diverse
    responses of seeds to germination treatments.
- var_in: germination_cues
  unit_in: .na
  trait_name: germination_cues
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Although the nine fire ephemerals examined require fire to germinate under
    natural conditions, a range of germination responses and dormancy types was observed.
    ^p To determine whether light was required for germination at 20 °C, four replicate
    dishes of each species were exposed to the incubator light/dark regime and four
    dishes were wrapped in aluminium foil to exclude light. Germination was assessed
    after 84 days. To test the effect of incubation temperature on germination, seeds
    were incubated at 5, 10, 15, 20 °C, and 25/15 °C (alternating 12 h/12 h regime).
    ^p Seed germination response to a range of chemical, scarification, smoke water
    and heat treatments was tested at 20 °C under a 12 h light/12 h dark regime. ^p
    Species-level records give the authors' statement about germination under natural
    conditions; population-level records give the light, temperature, heat and smoke
    responses of the seed lots tested.
- var_in: seed_dormancy_class
  unit_in: .na
  trait_name: seed_dormancy_class
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The aims of this research were to classify the dormancy types of these
    species according to the system of Baskin and Baskin (2004) to better understand
    the conditions required to alleviate dormancy, and to identify optimum methods
    for ex situ germination of fresh and laboratory stored seeds through examining
    the effects of various incubation temperatures, light conditions, chemical stimulants,
    scarification, and heat and smoke treatments. ^p Seeds were classified according
    to the morphological types of Martin (1946) and embryos were described as either
    developed or underdeveloped (Baskin and Baskin, 1998, 2004). ^p For each species,
    four replicates of 10 seeds were incubated in distilled water at 20 °C and weighed
    2-hourly during the initial 12 h of imbibition and then 4-hourly for a further
    12 h to establish whether seeds had imbibed water. ^p Five excised Codonocarpus
    cotinifolius and Tersonia cyathiflora embryos were placed on filter paper moistened
    with distilled water to test whether they could grow normally without additional
    hormones.
- var_in: seed_germination_treatment
  unit_in: .na
  trait_name: seed_germination_treatment
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Seed germination response to a range of chemical, scarification, smoke
    water and heat treatments was tested at 20 °C under a 12 h light/12 h dark regime.
    Control seeds were incubated in 10 mL of sterile distilled water and Previcur
    (0.15% v/v), which had a pH of 5.6. [...] Three scarification treatments were
    tested, acidic, basic and manual. [...] The impact of heating seeds at different
    temperatures and for different durations was also examined. Seeds were wrapped
    in aluminium foil and placed in an oven at 70 °C for 10 min, 70 °C for 1 h, 70
    °C for 5 h or 100 °C for 1 h. [...] For the combined heat and smoke water treatments,
    heat treatments were repeated (apart from 70 °C for 10 min) and seeds were incubated
    in smoke water instead of water. ^p The impact of the 1 h heat treatment at 100
    °C on seed viability was determined using the tetrazolium chloride test. The test
    was performed as described above in July 2004 on three replicates of 15 non-heated
    and heat-treated seeds of each species. ^p Records the most effective treatments
    for each seed lot and whether heating at 100 °C for 1 h killed seeds.
- var_in: seed_viability
  unit_in: '%'
  trait_name: seed_viability
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: For species that produced <90% germination in all trials, a tetrazolium
    chloride test was conducted to determine seed viability. Three replicates of 50
    seeds of each of the Alyogyne species (nicked first to facilitate water uptake)
    and three replicates of 10 seeds for remaining species were imbibed in distilled
    water for 24 h at 25 °C. Seeds were dissected longitudinally and placed in 1%
    w/v 2,3,5-triphenyl tetrazolium chloride for 24 h at 30 °C in the dark. Seeds
    were then classified as viable (most of the embryo stained including the radicle),
    possibly viable (patchy or faint staining of embryo) or dead (embryo either stained
    very faintly or unstained). ^p The test was performed as described above in July
    2004 on three replicates of 15 non-heated and heat-treated seeds of each species.
    ^p Table 2. Percentage (mean±se) of filled seeds, and percentage of filled seeds
    that were viable, possibly viable or dead according to the tetrazolium chloride
    test.
- var_in: seed_germination
  unit_in: '%'
  trait_name: seed_germination
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Four replicates of 25 seeds were used in each treatment. [...] Seeds were
    monitored weekly for 84 days and germination was scored when the radicle emerged
    >2 mm. ^p To test the effect of incubation temperature on germination, seeds were
    incubated at 5, 10, 15, 20 °C, and 25/15 °C (alternating 12 h/12 h regime). Light,
    on a 12 h light, 12 h dark cycle, was provided by cool white fluorescent tubes
    (30-50 umol m-2 s-1; R:FR 9:1) for the constant temperatures, and fluorescent
    and incandescent lights for the 25/15 °C treatment (50 umol m-2 s-1; R:FR=1.1:1).
    Codonocarpus cotinifolius and Gyrostemon racemiger were also incubated at 30 °C.
    ^p For all species cumulative germination after 42 days of incubation is presented
    (Figure 4) as few additional seeds germinated between days 42 and 84, unless noted.
    ^p Actinotus leucocephalus and Tersonia cyathiflora seeds were incubated continuously
    at each of the following smoke water dilutions, 0.1, 1, 5, 10, 15, 20 and 30%
    v/v. Seeds were also imbibed in 30% v/v Seed Starter for 24 h at 20 °C, rinsed
    three times and transferred to fresh Petri dishes for incubation in distilled
    water alone. ^p All germination results have been adjusted to express germination
    as a percentage of filled seeds.
