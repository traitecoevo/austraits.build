contexts:
- context_property: inselberg habitat
  category: plot_context
  var_in: habitat
  values:
  - value: herbfield
    description: one herbaceous layer, mostly deciduous species, generally on highly
      irradiated, shallow-soil patches
  - value: shrubland
    description: two layers (herbs and woody shrubs, generally evergreen species)
      on highly variable edaphic and sun-exposure conditions
  - value: woodland
    description: resource-rich woodland with three vegetation layers (herbs, shrubs
      and trees, mainly evergreen species), typically on deep soils at the edge of
      the outcrop where water run-off accumulates
  - value: resource-impoverished woodland
    description: similar woodland on resource-impoverished soils in the surrounding
      landscape, 1-2 km from the outcrop
  - value: sun-exposed
    description: highly irradiated, generally north-facing slopes, not shaded by rocks,
      trees or shrubs, on shallow (<10 cm deep) soils
  - value: sheltered
    description: deep soils with reduced solar radiation through protection by granitic
      rock and in-flow of water and nutrients as run-off, in flat areas near the base
      of the outcrop or near big boulders or trees
- context_property: plant height (population mean, m)
  category: entity_context
  var_in: plant_height_m
traits:
- var_in: leaf_mass_per_area
  unit_in: mm2/mg
  trait_name: leaf_mass_per_area
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Specific leaf area [SLA (mm2 mg-1)] (Ackerly et al., 2002; Pérez-Harguindeguy
    et al., 2013; Ruiz-Navarro et al., 2016). Trait collection followed standard procedures
    (Pérez-Harguindeguy et al., 2013). Ten samples for each species per habitat type
    and site were generally collected. ^p SLA is the one-sided area of a fresh leaf,
    divided by its oven-dry mass - 72 h at 60° C. ^p Pairwise comparisons between
    traits were done using parametric t-tests for normally distributed data, non-parametric
    Wilcoxon tests for data not normally distributed (in italics, and in the footnote
    median, 25 and 75 percentiles were reported).
- var_in: bark_thickness
  unit_in: mm
  trait_name: bark_thickness
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: For each individual sampled, we averaged the bark thickness from five measurements
    collected from every stem (average N = 270; Appendix I). We measured bark thickness
    at breast height for trees and high shrubs (ca. 135 cm above ground; Fajardo &
    Piper 2011), and at 20 cm above the ground for small shrubs, using a forester
    penetrating scaled head. ^p We collected data for bark thickness (cm), leaf dry
    matter content (LDMC; mg g-1), foliar C:N (in weight), foliar δ13C isotopic composition
    (‰ vpdb), plant height (m) and specific leaf area (SLA; mm2 mg-1). We recorded
    plant traits during late-spring and early-summer 2012, following standardised
    protocols (Perez-Harguindeguy et al. 2013).
- var_in: leaf_area
  unit_in: mm2
  trait_name: leaf_area
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf area [LA (mm2)]. Trait collection followed standard procedures (Pérez-Harguindeguy
    et al., 2013). Ten samples for each species per habitat type and site were generally
    collected.
- var_in: leaf_dry_matter_content
  unit_in: mg/g
  trait_name: leaf_dry_matter_content
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf dry matter content [LDMC (mg g-1)]. Trait collection followed standard
    procedures (Pérez-Harguindeguy et al., 2013). Ten samples for each species per
    habitat type and site were generally collected. ^p LDMC was obtained by calculating
    the ratio between the oven-dry (72 h at 60° C) mass of a leaf, and its water-saturated
    fresh mass.
- var_in: leaf_delta13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf delta 13C (‰ parts per thousand). Trait collection followed standard
    procedures (Pérez-Harguindeguy et al., 2013). For the foliar isotopic traits (i.e.
    leaf delta 13C, delta 15N and C/N), five samples were measured and only for a
    selected group of species due to logistic constraints (Appendix 1).
- var_in: leaf_delta15N
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta15N
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf delta 15N (‰ air). Trait collection followed standard procedures (Pérez-Harguindeguy
    et al., 2013). For the foliar isotopic traits (i.e. leaf delta 13C, delta 15N
    and C/N), five samples were measured and only for a selected group of species
    due to logistic constraints (Appendix 1).
- var_in: leaf_CN_ratio
  unit_in: g/g
  trait_name: leaf_CN_ratio
  entity_type: entity_type
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf C/N (on a weight basis). Trait collection followed standard procedures
    (Pérez-Harguindeguy et al., 2013). For the foliar isotopic traits (i.e. leaf delta
    13C, delta 15N and C/N), five samples were measured and only for a selected group
    of species due to logistic constraints (Appendix 1).
- var_in: leaf_phenology
  unit_in: .na
  trait_name: leaf_phenology
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The herbfields considered in this study are dominated by deciduous species
    (Cheilanthes austrotenuifolia and Stypandra glauca), whereas shrublands and woodlands
    host mainly evergreen species (e.g. Eucalyptus spp.; Fig. 2). ^p We focussed on
    two geophytic, common species on granite outcrops that are reduced to their belowground
    rhizomes during the hot, dry summers. ^p Leaf phenology of species named in these
    statements.
- var_in: life_form
  unit_in: .na
  trait_name: life_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We focussed on two geophytic, common species on granite outcrops that are
    reduced to their belowground rhizomes during the hot, dry summers. ^p Life form
    of the two species named in this statement.
- var_in: clonal_spread_mechanism
  unit_in: .na
  trait_name: clonal_spread_mechanism
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We studied seven plant traits for two common, rhizomatous granite outcrop
    species (the fern Cheilanthes austrotenuifolia, and the herb Stypandra glauca)
    with seasonal foliage during the cooler, wetter winter months. ^p Clonal spread
    mechanism of the two species named in this statement.
