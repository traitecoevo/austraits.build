questions:
  question1: Can you provide data for these studies in tabular format? Individual-level
    values are always preferred, but otherwise, site means/outcrop means are good.
  question2: Given you have leaf C:N ratio, can you also provide data for leaf N and
    leaf C?
  question3: Your LDMC values are very high compared to other data in AusTraits (see
    plot lower in report). Is this expected?
  question4: Ottaviani_2019 Table 1 gives bark thickness in cm, but its woodland means
    (23.18 and 16.52) suggest the values are in mm. unit_in is mapped as mm for all
