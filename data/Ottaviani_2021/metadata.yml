  location_name: location_name
  individual_id: individual_id
  source_id: source_id
  description: To test whether leaf water-economics traits of granite outcrop plants
    in southwestern Australia become more acquisitive and less variable with increasing
    precipitation seasonality.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'We focused on seven sites (granite outcrops) scattered in an
    area of SWA which extends approximately 400 km both eastward and southward of
    Perth (Fig. 1). The study area spans over aridity and precipitation seasonality
    gradients (Table 1; Ottaviani et al., 2016). Here, we examined the role of precipitation
    seasonality in shaping trait patterns - see Ottaviani et al., (2016, 2018), Ottaviani
    & Keppel, (2018) for studies on trait-aridity links. Monthly combined microwave-IR-gauge
    estimates of precipitation at 0.25° spatial resolution for the 1998-2012 period
    were downloaded from the NASA TRMM 3B43 dataset (TRMM, 2011). Cumulative monthly
    precipitations were then derived from the TRMM data and averaged across the 1998-2012
    period to obtain 15 years of monthly cumulative precipitation averages which were
    used to derive precipitation seasonality for each site as the annual coefficient
    of variation. ^p At each site, we sampled plants for trait scoring from three
    habitat types: (i) herbfields, characterized by one herbaceous layer (mostly composed
    of deciduous species) generally found on highly irradiated, shallow-soil patches;
    (ii) shrublands, distinguished by two layers (herbs and woody shrubs, generally
    evergreen species) growing on highly variable edaphic and sun-exposure conditions;
    and iii) woodlands, formed by three vegetation layers (herbs, shrubs and trees,
    mainly evergreen species) typically on deep soils at the edge of the outcrops
    where resources accumulate thanks to water run-off from the granitic slopes. All
    plant samples were collected at comparable elevations across the seven sites,
    i.e. between 300 and 500 m a.s.l. In each habitat type, we selected the most dominant
    (at the local scale) and common (across sites) species, two species per habitat
    type, i.e. usually six species per site were sampled as only a few were found
    across different habitats. The total number of the studied species was sixteen
    (Appendix 1)-refer to Schut et al. (2014) and Ottaviani et al. (2016) for more
    details on species selection procedure and habitat description. ^p Trait values
    were measured during spring/early summer 2012. We included six functional traits
    tightly linked to leaf economics spectrum (Wright et al., 2005): (1) leaf area
    [LA (mm2)]; (2) leaf C/N (on a weight basis); (3) leaf delta 13C (‰ parts per
    thousand); (4) leaf delta 15N (‰ air); (5) leaf dry matter content [LDMC (mg g-1)];
    (6) specific leaf area [SLA (mm2 mg-1)] (Ackerly et al., 2002; Pérez-Harguindeguy
    et al., 2013; Ruiz-Navarro et al., 2016). Trait collection followed standard procedures
    (Pérez-Harguindeguy et al., 2013). Ten samples for each species per habitat type
    and site were generally collected, except for the foliar isotopic traits (i.e.
    leaf delta 13C, delta 15N and C/N), for which five samples were measured and only
    for a selected group of species due to logistic constraints (Appendix 1). ^p South-western
    Australia experiences a Mediterranean-type climate with a marked aridity gradient
    from the wet south-west to the arid north-east. Granite outcrops of varying size
    and relief are a common feature throughout this region. We chose two outcrops
    among the best studied in SWA (e.g. Schut et al. 2014; Tapper et al. 2014; Ottaviani
    et al. 2016); Porongurup (34.68121°S, 117.87270°E) being a relatively mesic site
    (MAT: 13.8°C; MAP: 669 mm), and Boyagin Rock (32.47365°S, E 116.87836°E) more
    arid (MAT: 16°C; MAP: 512 mm). Previous studies suggest these outcrops have served
    as microrefugia during past adverse climates, and could buffer against increasing
    aridification by facilitating the persistence of biota favouring mesic habitats
    (Schut et al. 2014; Tapper et al. 2014). We examined plants in resource-rich woodlands
    at base of each of these two outcrops (putative microrefugia), and plants from
    similar, but resource-impoverished woodlands in the surrounding landscape (non-refugia),
    located 1-2 km from each outcrop. These putative refugial and non-refugial woodlands
    share a similar species pool, while exhibiting different species frequency and
    abundance (Hopper & Gioia 2004). ^p We measured traits of four dominant woody
    species native to SWA and common in the studied region: Banksia nobilis (Proteaceae),
    Corymbia calophylla, Eucalyptus marginata (both Myrtaceae) and Trymalium odoratissimum
    (Rhamnaceae). Corymbia calophylla and E. marginata are of particular biogeographic
    and conservation significance as both are endemic and broadly distributed in SWA.
    We focused on two species per habitat type per site. At Boyagin Rock, we sampled
    C. calophylla and E. marginata in resource-rich woodlands, and B. nobilis and
    E. marginata in resource-impoverished woodlands. At Porongurup, we sampled C.
    calophylla and T. odoratissimum in resource-rich woodlands, and C. calophylla
    and E. marginata in resource-impoverished woodlands. We could not sample C. calophylla
    in resource-impoverished habitats at Boyagin Rock, and E. marginata in resource-rich
    habitats at Porongurup because these species were not occurring there. At each
    site, we collected trait data from ten individuals of each target species per
    habitat type. ^p We selected six functional traits informing on plant resource
    acquisition, retention and use strategies (Lavergne et al. 2003; Rosell 2016;
    Ottaviani & Keppel 2018). Resource scarcity is indeed one major environmental
    driver in the region (Schut et al. 2014; Ottaviani & Keppel 2018). We collected
    data for bark thickness (cm), leaf dry matter content (LDMC; mg g-1), foliar C:N
    (in weight), foliar δ13C isotopic composition (‰ vpdb), plant height (m) and specific
    leaf area (SLA; mm2 mg-1). For foliar δ13C and C:N, we collected five samples
    per species, focusing on C. calophylla and E. marginata. We recorded plant traits
    during late-spring and early-summer 2012, following standardised protocols (Perez-Harguindeguy
    et al. 2013). ^p At the habitat scale, sheltered and sun-exposed habitats were
    identified based on visual qualitative assessment in the field and on ecological
    knowledge of the study system (see Schut et al. 2014; Ottaviani et al. 2016; Keppel
    et al. 2017). Sheltered habitats were characterized by deep soils, reduced solar
    radiation through protection by granitic rock and the in-flow of water and nutrients
    as run-off from granitic slopes. These habitats occurred in flat areas near the
    base of the outcrop and in the vicinity of big boulders or trees (which were not
    overhanging the focal plants). Sun-exposed habitats were located on highly irradiated
    (generally north-facing) slopes, not shaded by rocks, trees or shrubs, on shallow
    (<10 cm deep) soils. Therefore, the two habitat types strongly differed in water-stress
    (i.e. higher in sun-exposed and lower in sheltered habitats) and we only sampled
    focal plants in habitats that we could clearly identify as either sheltered or
    sun-exposed. ^p We focussed on two geophytic, common species on granite outcrops
    that are reduced to their belowground rhizomes during the hot, dry summers. Cheilanthes
    austrotenuifolia H.M. Quirk & T.C. Chambers (Pteridaceae) is a fern (Western Australian
    Herbarium, in FloraBase, http://florabase.dpaw.wa.gov.au/ [accessed 31 March 2017])
    that can be either associated with arbuscular mycorrhizas or not (Brundrett 2008).
    This species is sympatric with its congeneric Cheilanthes sieberii Kunze. To ensure
    that we did not confuse the two species, we verified as many distinguishing characters
    as possible in the field and only sampled individuals with laminas wider than
    4 cm (Quirk et al. 1983). Stypandra glauca R.Br. (Hemerocallidaceae) is a tufted
    herb (Western Australian Herbarium, in FloraBase, http://florabase.dpaw.wa.gov.au/
    [accessed 31 March 2017]), with no indication of mycorrhizas association (Brundrett
    2008). ^p For traits collection, we followed guidelines provided in the standardized
    handbook by Perez-Harguindeguy et al. (2013), harvesting trait data from healthy
    adult individuals, measuring all the traits from the same sample. ^p We collected
    traits from ten individuals per species per outcrop, from ten different plots
    in each outcrop per species. Plots were equally divided between sun-exposed and
    sheltered habitats on each outcrop. For foliar stoichiometric traits (C/N, δ13C,
    and δ15N), we gathered data from five individuals per species per outcrop due
    to logistic constraints. Trait collection occurred in 2012 towards the end of
    the growing season, which occurs earlier in the arid sites. More arid sites were
    sampled during spring (September/October) and more mesic sites in early summer
    (November/December). ^p We collected bark thickness from fourteen woody species
    (Table I) that were found to be dominant by prior surveys of the vegetation (for
    details refer to Ottaviani, Marcantonio & Mucina 2016). We investigated two prevalent
    vegetation types: shrublands and woodlands. Shrublands are composed of two vegetation
    layers (herbs and shrubs) generally occurring on the slopes, and flattening areas
    (e.g., tops) of the granite outcrops. Woodlands are characterized by three vegetation
    layers (defined by herbs, shrubs, and trees) that develop at the edges of inselbergs
    bordering the surrounding landscapes, where they gain more water and nutrients,
    compared to shrublands, through run-off from the impermeable granitic slopes.
    ^p We gathered bark thickness data from ten healthy, adult individual plants per
    species per outcrop where the species occurred, targeting individuals of similar
    age for each species (Pérez-Harguindeguy et al. 2013). Each sample came from a
    different vegetation plot, randomly placed on a granite outcrop. In this way,
    we could account both for intra- and inter-specific trait variability. For each
    individual sampled, we averaged the bark thickness from five measurements collected
    from every stem (average N = 270; Appendix I). We measured bark thickness at breast
    height for trees and high shrubs (ca. 135 cm above ground; Fajardo & Piper 2011),
    and at 20 cm above the ground for small shrubs, using a forester penetrating scaled
    head.'
  original_file: Ottaviani_2021 SI Appendix 2A (species averages per habitat type
    per site) and Appendix 2B (coefficients of variation), Ottaviani_2019 Table 1,
    Ottaviani_2018 Results text and the Ottaviani_2017 Dryad table (Appendix I, bark
    thickness per individual), transcribed into raw/trait_data.csv
  notes: Values are species means per habitat type per site from Ottaviani_2021 SI
    Appendix 2A; the matching coefficients of variation (%) from Appendix 2B are kept
    in the data.csv error_value column (error_type CV). Ottaviani_2019 Table 1 adds
    bark thickness and the resource-impoverished woodlands 1-2 km from Porongurup
    and Boyagin Rock, for Corymbia calophylla and Eucalyptus marginata (means with
    SD, plus SLA medians for E. marginata). Its resource-rich woodland values for
    the other traits are the same samples as the Ottaviani_2021 woodland records;
    they are flagged in the omit_duplicate column and filtered out in custom_R_code.
    Ottaviani_2019 also sampled Banksia nobilis and Trymalium odoratissimum, but gives
    their values only in a multivariate ordination figure. Ottaviani_2018 adds means
    pooled across the outcrops for sun-exposed versus sheltered habitats (Cheilanthes
    austrotenuifolia LDMC; Stypandra glauca leaf delta13C and C/N), entered as metapopulations,
    plus life form, rhizomes and summer dormancy of both species from statements in
    the text. Its other values (and the leaf size trait) appear only in figures. The
    Ottaviani_2017 Dryad data (used in Ottaviani_2018_2) give bark thickness for 270
    individuals of 14 woody species in shrublands and apron woodlands; each value
    is the mean of five measurements on the stem (the five readings are listed in
    the data.csv notes column, the SD in error_value). The two Ottaviani_2019 resource-rich
    woodland bark means are the means of these individuals and are flagged as duplicates.
    The PhD thesis (Ottaviani_2015) is the source of these papers; its chapter 2 table
    gives earlier, partly different values for the Ottaviani_2019 comparison, which
    are superseded by the published paper and not included, and its chapter 4 (published
    as Ottaviani et al. 2016, Plant Ecology & Diversity 9, 263-276) analyses the same
    individual plants against soil depth but reports trait values only in figures.
    Plant height of the sampled plants is recorded as an entity context. Leaf phenology
    values are taken from statements in the Ottaviani_2021 Discussion and Ottaviani_2018
    Methods.
