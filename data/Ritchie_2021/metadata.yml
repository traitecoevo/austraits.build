  basis_of_value: expert_score
  replicates: .na
  methods: Direct field observation of animals probing inflorescences and contacting
    the stigma and/or anthers, or captured/swabbed insects carrying pollen, recorded
    as possible pollen vectors where contact with reproductive structures was observed
    but pollen transfer to the stigma was not directly confirmed. For Banksia menziesii, Movements of bird pollinators within and among B. menziesii plants were recorded in the remnant and central restored sites through April, May, and June 2012. Of the restored sites, only the central site was surveyed as its plants were more similar in size and density to those of the remnant site than the much younger restored sites, where 75% of plants had yet to flower. Surveys were conducted during periods of fine weather, for the first 10 minutes of each hour for 8 hours beginning at sunrise. Once a bird had begun feeding, the number of inflorescences visited and time spent foraging on each individual plant was noted, as well as whether the bird left the immediate area or moved to another plant in the vicinity. The significance of differences in species abundance and movements between the restored and remnant sites w
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Direct field observation of animals probing Banksia inflorescences, or
    insects captured and swabbed and found to be carrying more than ten pollen grains
    under microscopic examination, without confirmed contact with the flower's reproductive
    structures. For Banksia menziesii, Movements of bird pollinators within and among B. menziesii plants were recorded in the remnant and central restored sites through April, May, and June 2012. Of the restored sites, only the central site was surveyed as its plants were more similar in size and density to those of the remnant site than the much younger restored sites, where 75% of plants had yet to flower. Surveys were conducted during periods of fine weather, for the first 10 minutes of each hour for 8 hours beginning at sunrise. Once a bird had begun feeding, the number of inflorescences visited and time spent foraging on each individual plant was noted, as well as whether the bird left the immediate area or moved to another plant in the vicinity. The significance of differences in species abundance and movements between the restored and remnant sites was tested by an analysis of similarities (ANOSIM) and chi-square tests using PRIMER_v6 (Clarke & Gorley 2006).
