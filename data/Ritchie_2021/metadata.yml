  trait_name: POLLINATOR TRAIT
  value: pollinator_trait_value
  location_name: location_name
  description: Records of floral visitors and pollen vectors of Banksia menziesii
    and Banksia attenuata observed at restored and remnant Banksia woodland sites
    across the Perth Metropolitan region, Western Australia.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Floral attractiveness of sites was quantified during each floral
    visitor survey by counting the total number of inflorescences produced for 10
    arbitrarily selected trees of each species in each study area. The study area
    was limited to 4-5 ha within each site due to differences in remnant size (detailed
    in Appendix S1). For each floral visitor survey, two spatially distant (>20 m)
    flowering trees with >=5 inflorescences (labeled maternal) and their surrounding
    neighbors (noting their distance from the maternal tree) were monitored for floral
    visitors within the site, one by the same observer and the other by one volunteer.
    A list of bird species observed during the floral visitor surveys was collated
    to document differences in the general bird community (i.e., beyond nectarivores).
    Banksia attenuata was monitored in three summers (once in 2010/2011 and twice
    in each of 2011/2012 and 2012/2013) and B. menziesii was monitored over three
    winters (once 2011 and twice in each of 2012 and 2013), during days without rain
    or high wind. A total of 96 survey days were conducted in a consecutive sequence
    of 5-day blocks during peak Banksia flowering for each Banksia species. On each
    survey day, visits to inflorescences by bird species were observed for eight,
    10-min census periods each hour, starting within 30 min of sunrise. Observations
    of foraging behavior by floral visitors were made during survey periods based
    on point count observation method used by Ramsay (1989) and Whelan et al. (2009).
    Observers recorded the species and foraging behavior for each floral visit to
    a maternal tree as follows, Visitation-foraging bouts were counted as the continuous
    tracking of a single floral visitor until lost from sight or survey time elapsed.
  original_file: in raw data folder
  notes: none
