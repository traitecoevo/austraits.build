- var_in: water_potential_predawn
  unit_in: MPa
  trait_name: water_potential_predawn
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 40
  methods: Samples for shoot psi_x were collected pre-dawn and at midday, at 1 month
    intervals between May 2010 and February 2011 to sample across all seasons. Shoots
    were harvested from the crown perimeter of four replicates of each species. The
    same population for each species was sampled every month at a single location,
    and individuals within populations were selected at random on each occasion. Each
    sample was immediately enclosed in a sealable plastic bag with as little air as
    practicable, and then stored in darkness inside an insulated box containing pre-frozen
    cooling bars within a few minutes of sampling until measurement. The psi_x of
    each shoot was then measured using a Scholander pressure chamber (Soil Moisture
    Equipment, Santa Barbara, CA, USA). The time taken to complete all measurements
    was ~2 h, due to the large number of samples. ^p Values are averages across the
    study period.
- var_in: water_potential_midday
  unit_in: MPa
  trait_name: water_potential_midday
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 40
  methods: Samples for shoot psi_x were collected pre-dawn and at midday, at 1 month
