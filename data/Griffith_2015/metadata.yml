  description: To test whether differences in water relations among wallum species
    on coastal sand barriers are related to their groundwater habitat and growth form,
    as a basis for predicting vegetation responses to groundwater abstraction.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The Nabiac barriers comprise quartzose sand, and form a beach
    ridge chronosequence which spans two interglacial cycles (80 000 to 260 000 years
    before present) (Melville 1984; Roy et al. 1997). Despite their minimal elevation
    (2-7 m Australian height datum) and weathered, degraded relief (<3 m) (Roy et
    al. 1997; Murphy 2005), the Nabiac barriers maintain floristic patterns related
    to topography and hence groundwater relations (Griffith and Wilson 2007, 2008).
    The soils form a catenary sequence from Podzols on comparatively well drained
    sites to Humus Podzols where drainage is imperfect to poor, and Acid Peats replace
    podzols lower in the landscape where waterlogging is severe (Atkinson 1999; Murphy
    2005). ^p Twenty-six perennial species representing eight plant families, three
    growth forms (herb, shrub and tree) and three vegetation strata (tree, shrub and
    ground) were investigated, although logistical constraints prevented the inclusion
    of all species in each component of the study (Table 1). The species were sampled
    in contrasting groundwater habitats (Fig. S2) associated with three landforms
    (ridge, open depression, closed depression; sensu Speight 1984). ^p The ridge
    habitat was sampled in woodland with Eucalyptus racemosa Cav. subsp. racemosa
    dominant in the tree stratum (canopy). This woodland had a well developed shrub
    (mid-) stratum of Banksia aemula R.Br., Leptospermum trinervium (Sm.) Joy Thomps.
    and other species (Table 1), and the ground stratum supported both small shrubs
    (e.g. Dillwynia retorta (J.C.Wendl.) Druce and Eriostemon australasius Pers.)
    and herbs (Caustis recurvata Spreng. var. recurvata and Hypolaena fastigiata R.Br.).
    ^p Vegetation sampled in the open depression was structurally variable across
    short distances although predominantly heathland or woodland, and some of the
    observed variation may be attributed to the fire history (Griffith and Wilson
    2007). Eucalyptus robusta Sm. was the dominant tree in the woodland, and Banksia
    ericifolia subsp. macrantha (A.S.George) A.S.George the dominant species in the
    mid-stratum. The heathland supported many small shrub (e.g. Boronia falcifolia
    A.Cunn.exEndl., Dillwynia floribunda Sm., Epacris obtusifolia Sm. and Leptospermum
    liversidgei R.T.Baker&H.G.Sm.) and herb (e.g. Empodisma minus (Hook. f.) L.A.S.Johnson&D.F.Cutler
    and Sporadanthus interruptus (F.Muell.) L.A.S.Johnson&B.G.Briggs) species, the
    majority of which also occurred in the ground stratum of the E. robusta woodland.
    ^p Closed depressions in wallum typically support sedgeland, or occasionally shrubland
    with a sedgeland ground stratum (Griffith et al. 2003). Both of these structural
    formations formed a mosaic in the closed depression, although sampling was confined
    to an area largely devoid of a shrub stratum where ground stratum herbs were dominant
    (e.g. Baloskion pallens (R.Br.) L.A.S. Johnson&B.G.Briggs, Leptocarpus tenax (Labill.)
    R.Br. and Schoenus brevifolius R.Br.), and small ground stratum shrubs subsidiary
    (e.g. Callistemon pachyphyllus Cheel). ^p The open and closed depression sites
    were clustered within a radius of 125 m, and ~3.2 km from the ridge site. The
    sites were representative of groundwater habitats on the Nabiac barriers (Griffith
    and Wilson 2007), where the study species are widespread and generally cover-abundant.
    Most of the species are also representative of wallum over a wide geographic range
    in eastern Australia (Griffith et al. 2003; Griffith and Wilson 2007). Voucher
    specimens were lodged with the N.C.W. Beadle Herbarium (NE), University of New
    England.
