traits:
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Perennial herb, shrub and tree species were sampled in three groundwater
    habitats (landforms), and grouped by their presence in one of three vegetation
    strata (tree, shrub, ground), where woodland supported all three strata, shrubland
    supported two strata (shrub and ground), and heathland and sedgeland had a single
    (ground) stratum. The ground stratum comprised both small shrubs and herbs. ^p
    Growth form of each species as listed in Table 1.
- var_in: osmotic_potential_at_full_turgor
  unit_in: MPa
  trait_name: osmotic_potential_at_full_turgor
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3-5
  methods: During mid- to late spring (October-November) 2009, shoots (or large leaves)
    up to 1.5 m in length were sampled from 3-5 random replicates of each species
    at the same sites used for measurement of psi_x. Each shoot was recut to a length
    of ~0.3 m under water, and the cut end inserted into a test tube filled with water
    to ensure that air bubbles did not enter the xylem. Samples were then stored at
    4°C in the dark to fully re-hydrate for a minimum of 24 h. Over the following
    2 days, one shoot subsample was cut from each replicate, blotted dry and the saturated
    weight determined before measurement of the balancing pressure using a Scholander
    pressure chamber (Soil Moisture Equipment). The change in FW and balancing pressure
    were measured at regular intervals over 8-10 h while the shoots dried on a bench.
    Each shoot was then oven-dried at 80°C for 24 h and the DW recorded. The osmotic
    potential at full (pi100) and zero turgor (pi0), relative water content at zero
    turgor (RWC0), apoplastic water content (B) and bulk modulus of elasticity (epsilon)
    were determined using the procedure described by Rutherford et al. (2013).
- var_in: leaf_turgor_loss_point
  unit_in: MPa
  trait_name: leaf_turgor_loss_point
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3-5
  methods: During mid- to late spring (October-November) 2009, shoots (or large leaves)
    up to 1.5 m in length were sampled from 3-5 random replicates of each species
    at the same sites used for measurement of psi_x. Each shoot was recut to a length
    of ~0.3 m under water, and the cut end inserted into a test tube filled with water
