questions:
  question1: Species-mean pre-dawn and midday water potentials (Fig. 3a, 15 species),
    monthly pre-dawn water potential (Fig 2), and leaf delta13C (Fig. 5a, 26 species)
    are only shown as bars. Can you provide the data underpinning these plots?
