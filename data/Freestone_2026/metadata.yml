traits:
- var_in: fruit_set_proportion
  unit_in: unit
  trait_name: fruit_set_proportion
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: The bags were then opened and the number of swollen, developed fruits and
    withered, non-developed fruits were counted. The proportion of swollen fruits
    was considered as a measure of 'fruit set'. Values are from the natural pollination
    treatment (plants not bagged initially to allow natural pollination, then bagged
    2 weeks after pollination had occurred when flowers had started to wither). ^p
    Mean percentage fruit set in P.
    tadgellianum and P. frenchii in this study was comparable to that in other naturally
    pollinated Prasophyllum (52% in P. odoratum, Bernhardt and Burns-Balogh 1986;
    59% in P. fimbria, Peakall 1987; and 70% in P. elatum; 80% in P. fimbria, Elliott
    and Ladd 2002; 72–84% in P. innubum Hayashi et al. 2024).
- var_in: seed_mass_per_fruit
  unit_in: unit
  trait_name: seed_mass_per_fruit
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: For all species, bagged inflorescences containing developed seed were collected
    4 weeks after pollination and dried to 15% relative humidity for 10 days in a dehumidifying
    drying cabinet. The seed from all fruits were then cleaned and transferred to a
    small 5 mL glass vial. The vial was weighed before and after the addition of seed,
    to measure the weight of all seed from each plant. Weight per fruit was determined
    by dividing the total seed weight by the number of developed fruits on the inflorescence.
    Values are from the natural pollination treatment.
- var_in: seed_viability
  unit_in: unit
  trait_name: seed_viability
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: We used the method of van Waes and Debergh (1986) with small modifications,
    detailed as follows. Seeds were chemically tested for viability by using 2,3,5-triphenyltetrazolium
    chloride (TTC). For each sample (i.e. seed from a single plant), approximately
    100–300 seeds were transferred to a clean 5 mL glass vial. To make the seed coat
    transparent, the seeds were soaked in 2 mL of a filtered 4% w/v solution of calcium
    hypochlorite for 10 min, although this step was omitted for P. lindleyanum because
    seed lacked a typical seed coat and the embryos were clearly visible. The bleach
    solution was pipetted off and washed with 5 mL deionised water. This step was repeated, and the vial
    was incubated in deionised water at 20°C for 24 h. The water was then pipetted
    off and replaced with 2 mL of a 1% TTC solution, mixed and incubated in the dark
    at 30°C. After 24 h, the TTC solution was pipetted off and the seed washed with
    5 mL deionised water. The water wash step was repeated after 30 min. The seeds
    were then pipetted onto a glass microscope slide, covered with a coverslip and
    sealed with nail polish painted around the edges of the coverslip. Seeds were
    viewed under a dissecting microscope within 1 h of slide preparation. Approximately
    100 seeds (including those without embryos) were counted per replicate slide per
    inflorescence (i.e. 2100–2500 seed per treatment, per species,) by photographing
    the microscope slide, printing and marking seeds on the printed photo. The number
    of seeds with no or very small embryos and the number of polyembryonic seeds were
    recorded (Fig. 2). Seeds with stained embryos (any colouration) were scored as
    viable (i.e. all dark-, mid- and light-coloured embryos pooled together). Values
    are for seed from the natural pollination treatment.
- var_in: seed_germination
  unit_in: unit
  trait_name: seed_germination
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Asymbiotic germination was used to test percentage germination of seeds
    of P. frenchii and P. tadgellianum, from an independent subsample from the same
    plant (i.e. different individual seeds from those that were tested using tetrazolium
    staining). Seeds were randomly allocated to either tetrazolium staining or asymbiotic
    germination assays by shaking the vial of seeds to mix thoroughly, before scooping
    out a 5 mm spatula-full of seed for either assay. Seeds were surface-sterilised
    using the same surface-sterilisation regime as for TTC staining. The surface-sterilised
    seed was rinsed in sterile deionised water twice and then pipetted onto two plates
    of W9.5 + 5% coconut water (Western Orchid Laboratories, Coromandel Valley, Australia),
    the most effective known asymbiotic germination medium for Prasophyllum (Freestone
    et al. 2023). ^p Plates were then sealed and randomly arranged in large plastic
    containers and kept in the dark at a temperature regime of 16°C for 8 h, followed
    by 20°C for 16 h, for 9 months. At the end of the incubation period, plates were
    scored by counting the total number of seeds that had germinated into protocorms
    of Stage 3 or above (Clements et al. 1986), and the total number of seeds on the
    plate. Of the two sown plates for each seed subsample, only the plate with the
    highest germination percentage was included in the analyses. Where neither plate
    supported germination, the plate with the highest total count of seeds was included.
    Values are for seed from the natural pollination treatment. ^p A separate asymbiotic germination study of P. frenchii observed 10% germination
    with naturally pollinated seed collected from the same study site collected a
    year earlier (Freestone et al. 2023).
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Breeding system scored from fruit set and seed viability under the pollinator
    exclusion, emasculation, hand self-pollination and cross-pollination treatments.
    ^p In P. lindleyanum, there was no significant difference in percentage fruit set
    among the six pollination treatments (F5,95 = 2.05, P = 0.079; average 95 ± 3%
    across all treatments; Table 2), indicating that this species does not require
    a pollinator and is apomictic. In P. tadgellianum and P. frenchii, no fruit set
    was observed in plants that had pollinators excluded. ^p In contrast to P. lindleyanum,
    P. frenchii and P. tadgellianum are allogamous, requiring a vector to produce seed.
    ^p Prasophyllum tadgellianum is a rare case among orchids, with a mixed mating
    system consisting of both autogamy (self-pollination via a vector as neither pollinator-excluded
    or emasculated flowers produced seed) and allogamy, because seed viability was intermediate
    between self-pollinated and cross-pollinated treatments (Brown 1979). ^p Hand self-pollinated
    flowers set fruit in P. tadgellianum (92 ± 4%, seed viability 10 ± 3%) and P. frenchii
    (76 ± 7%, seed viability 21 ± 4%) (Table 2). ^p Very few Prasophyllum species have had their mating systems identified, with
    the exception of P. fimbria (Peakall 1987, 1989) and P. innubum, both of which
    have a mixed mating system (Hayashi et al. 2024).
