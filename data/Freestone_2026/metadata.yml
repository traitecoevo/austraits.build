traits:
- var_in: fruit_set_proportion
  unit_in: unit
  trait_name: fruit_set_proportion
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: The bags were then opened and the number of swollen, developed fruits and
    withered, non-developed fruits were counted. The proportion of swollen fruits
    was considered as a measure of 'fruit set'. ^p Mean percentage fruit set in P.
    tadgellianum and P. frenchii in this study was comparable to that in other naturally
    pollinated Prasophyllum (52% in P. odoratum, Bernhardt and Burns-Balogh 1986;
    59% in P. fimbria, Peakall 1987; and 70% in P. elatum; 80% in P. fimbria, Elliott
    and Ladd 2002; 72–84% in P. innubum Hayashi et al. 2024), making natural pollination
    in Prasophyllum very high by global standards (average of 37.1% fruit set across
    84 species of rewarding orchids globally, Tremblay et al. 2005). ^p Nevertheless,
    given observations of 100% fruit set in other populations of P. lindleyanum and
    <100% fruit set in other populations of P. frenchii and related species (M. Freestone,
    pers. obs.), it appears likely that the results observed in this study are broadly
    applicable within other populations of the studied species.
- var_in: seed_mass_per_fruit
  unit_in: unit
  trait_name: seed_mass_per_fruit
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: 'For all species, bagged inflorescences containing developed seed were collected 4 weeks after pollination and dried to 15% relative humidity for 10 days in a dehumidifying drying cabinet. The bags were then opened and the number of swollen, developed fruits and withered, non-developed fruits were counted. The proportion of swollen fruits was considered as a measure of ''fruit set''. The seed from all fruits were then cleaned and transferred to a small 5 mL glass vial. The vial was weighed before and after the addition of seed, to measure the weight of all seed from each plant. Weight per fruit was determined by dividing the total seed weight by the number of developed fruits on the inflorescence.'
- var_in: seed_viability
  unit_in: unit
  trait_name: seed_viability
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: We used embryo staining with 2,3,5-triphenyltetrazolium chloride (TTC),
    first described by Lakon (1949) and adapted to orchid seeds by van Waes and Debergh
    (1986), which is widely used for seed viability testing in orchids (Vujanovic
    et al. 2000; Borba et al. 2001). We used the method of van Waes and Debergh (1986)
    with small modifications, detailed as follows. Seeds were chemically tested for
    viability by using 2,3,5-triphenyltetrazolium chloride (TTC). For each sample
    (i.e. seed from a single plant), approximately 100–300 seeds were transferred
    to a clean 5 mL glass vial. To make the seed coat transparent, the seeds were
    soaked in 2 mL of a filtered 4% w/v solution of calcium hypochlorite for 10 min,
    although this step was omitted for P. lindleyanum because seed lacked a typical
    seed coat and the embryos were clearly visible. These surface-sterilisation methods
    were used following the results of small pilot trials (Supplementary Tables S1,
    S2) and a separate study of the effect of stratification on asymbiotic germination
    of P. chasmogamum (M. Freestone, unpubl. data). The bleach solution was pipetted
    off and washed with 5 mL deionised water. This step was repeated, and the vial
    was incubated in deionised water at 20°C for 24 h. The water was then pipetted
    off and replaced with 2 mL of a 1% TTC solution, mixed and incubated in the dark
    at 30°C. After 24 h, the TTC solution was pipetted off and the seed washed with
    5 mL deionised water. The water wash step was repeated after 30 min. The seeds
    were then pipetted onto a glass microscope slide, covered with a coverslip and
    sealed with nail polish painted around the edges of the coverslip. Seeds were
    viewed under a dissecting microscope within 1 h of slide preparation. Approximately
    100 seeds (including those without embryos) were counted per replicate slide per
    inflorescence (i.e. 2100–2500 seed per treatment, per species,) by photographing
    the microscope slide, printing and marking seeds on the printed photo. The number
    of seeds with no or very small embryos and the number of polyembryonic seeds were
    recorded (Fig. 2). Seeds with stained embryos (any colouration) were scored as
    viable (i.e. all dark-, mid- and light-coloured embryos pooled together). A detailed
    analysis of the intensity of stain colouration is presented in the Supplementary
    material (Supplementary methods; Supplementary Table S3), where the viability
    of embryos was scored according to their intensity of colouration (dark, mid or
    light; Fig. 2) and analysed separately.
- var_in: seed_germination
  unit_in: unit
  trait_name: seed_germination
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Asymbiotic germination was used to test percentage germination of seeds
    of P. frenchii and P. tadgellianum, from an independent subsample from the same
    plant (i.e. different individual seeds from those that were tested using tetrazolium
    staining). Seeds were randomly allocated to either tetrazolium staining or asymbiotic
    germination assays by shaking the vial of seeds to mix thoroughly, before scooping
    out a 5 mm spatula-full of seed for either assay. Seeds were surface-sterilised
    using the same surface-sterilisation regime as for TTC staining. The surface-sterilised
    seed was rinsed in sterile deionised water twice and then pipetted onto two plates
    of W9.5 + 5% coconut water (Western Orchid Laboratories, Coromandel Valley, Australia),
    the most effective known asymbiotic germination medium for Prasophyllum (Freestone
    et al. 2023). Prasophyllum lindleyanum was not subject to asymbiotic germination
    because surface-sterilisation for the minimum time possible (30 s) resulted in
    very low percentage germination and high contamination rates of plates, presumably
    because most embryos were fully exposed to the bleach because of the lack of seed
    coat and were killed (Mweetwa et al. 2008); however, there was insufficient time
    for the bleach to kill contaminant fungal spores and bacteria (M. Freestone, unpubl.
    data). ^p Plates were then sealed and randomly arranged in large plastic containers
    and kept in the dark at a temperature regime of 16°C for 8 h, followed by 20°C
    for 16 h, for 9 months. At the end of the incubation period, plates were scored
    by counting the total number of seeds that had germinated into protocorms of Stage
    3 or above (Clements et al. 1986), and the total number of seeds on the plate.
    Stage 3 protocorms of P. frenchii usually progress to leaf-bearing seedlings in
    asymbiotic germination (M. Freestone, pers. obs.). Of the two sown plates for
    each seed subsample, only the plate with the highest germination percentage was
    included in the analyses, because asymbiotic germination rates are known to be
    variable among plates with identical conditions (Freestone et al. 2023), and we
    were interested in the maximum germination rate to infer seed viability, rather
    than the variability of asymbiotic germination among plates. Where neither plate
    supported germination, the plate with the highest total count of seeds was included.
    ^p A separate asymbiotic germination study of P. frenchii observed 10% germination
    with naturally pollinated seed collected from the same study site collected a
    year earlier (Freestone et al. 2023), suggesting that asymbiotic germination percentages
    in the current study were not an accurate reflection of the true seed viability.
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: entity_type
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: 'The pollination treatments were as follows: (1) to determine whether a
    pollinator vector is required or whether plants mechanically self-pollinate, plants
    were bagged with a cylinder of tea bag material and sealed with micropore tape
    prior to flowers opening to exclude pollinators, (2) to determine whether plants
    are apomictic, flowers were emasculated and bagged to exclude pollinators. Flowers
    were bagged before opening to ensure that no insects were able to pollinate the
    flowers. After the flowers opened, the pollinia were removed, checking that they
    removed easily and were intact (pollinia in Prasophyllum are a cohesive mass of
    pollen that can be removed and transferred in a single unit), and the bag was
    resealed. Pollinia were removed after the flower opened because to do so beforehand
    would require mutilation of the flower and would introduce bias. (3) To determine
    whether plants are self-compatible (autogamous), plants were bagged before opening,
    then each flower was self-pollinated by hand, and the bag resealed. Furthermore,
    plants were subjected to (4) intrapopulation cross-pollination (xenogamy) (plants
    bagged before opening, then pollinia removed from each flower, and hand-pollinated
    with pollinia from a plant approximately 50–100 m away, and the bag was resealed),
    (5) interpopulation cross-pollination (plants bagged before opening, then pollinia
    removed and hand-pollinated with pollinia from a different population, and the
    bag was resealed), and (6) natural pollination (plants not bagged initially to
    allow natural pollination, then bagged 2 weeks after pollination had occurred
    when flowers had started to wither). ^p Pollination treatments that did not result
    in any fruit set or seed production (i.e. the no pollination and emasculations
    treatments in P. frenchii or P. tadgellianum) were not included in analyses, and
    thus, the statistical comparisons of treatment effects apply only to treatments
    that produced seed. ^p Very few Prasophyllum species have had their mating systems
    identified, with the exception of P. fimbria (Peakall 1987, 1989) and P. innubum,
    both of which have a mixed mating system (Hayashi et al. 2024).'
