  description: To determine whether pollen source (self, outcross or natural pollination)
    affects seed quantity and quality in three Prasophyllum orchid species, in order
    to infer their mating systems and whether artificial pollination would improve
    the seed collected for ex situ conservation.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: We studied the following three species of Prasophyllum, each
    of which is representative of a different morphological group in the genus (Jones
    2021), with numerous threatened and geographically restricted congeners, P. lindleyanum
    (fitzgeraldii complex, Group 8, Jones 2021), P. frenchii (frenchii complex, Group
    6, Jones 2021), and P. tadgellianum (alpinum complex, Group 4, Jones 2021) (Fig.
    1). All species were sampled in the 2017/18 flowering season in south-eastern
    Australia. Each of the three study species are annually dormant over the Australian
    summer period, shedding their above-ground foliage and reducing to an underground
    tuber, and subsequently re-emerging as a single leaf between March and June. All
    three study species are reliant on one or more species of Rhizoctonia (formerly
    Ceratobasidium) for germination in the wild (Freestone et al. 2022, 2024). The
    flowers of these species have visible (i.e. putative nectar) secretions (M. Freestone,
    pers. obs., this study). ^p Prasophyllum lindleyanum is Endangered in Victoria
    under the Flora and Fauna Guarantee Act 1988 and endemic to eucalypt woodlands
    from 10 to 1500 m above sea level (ASL) in Victoria and Tasmania. It produces
    a single inflorescence in October to December, containing 10–20 small green flowers
    (Reichenbach 1871; VicFlora 2023). The study site for P. lindleyanum was in a
    low eucalypt forest on shallow granitic soils at 340 m ASL at the Warby Ranges
    National Park, Victoria, Australia, containing approximately 200 flowering plants
    in 2017. ^p Prasophyllum tadgellianum is common and endemic to subalpine grassland
    and woodland in south-eastern Australia. It produces a single inflorescence containing
    8–20 small, brown flowers in early summer (December–January) (Rogers 1923; VicFlora
    2023). The study site for P. tadgellianum was in subalpine native grassland at
    1540 m ASL at the headwaters of Shaw Creek (Snowy High Plain), in the Alpine National
    Park, Victoria, Australia, where several thousand plants flowered in 2017/18.
    ^p Prasophyllum frenchii is endemic to wet lowland native grasslands and swamps
    in southern Victoria and south-eastern South Australia. It produces a single inflorescence
    with 20–65 small, brown flowers from October to December (von Mueller 1889; VicFlora
    2023). Prasophyllum frenchii is listed as endangered in Australia (DCCEEW 2026).
    The study site for P. frenchii was in a small (4 ha) lowland native grassland
    remnant at 20 m ASL at Yarram, Victoria, Australia, containing about 300 flowering
    plants in 2017. ^p To determine the mating system, and therefore whether there
    is a particular artificial pollination strategy that produces high-quality seed
    for the three Prasophyllum species, we applied up to six pollination treatments
    to each species. For each plant, we applied only a single treatment. The lowest
    10 flowers on each inflorescence (five in P. tadgellianum because of the smaller
    number of flowers per inflorescence) were subject to the treatment, with excess
    flowers being removed by cutting the inflorescence above the treated flowers.
    Although cutting the unused flowers above the treatment could affect the plant's
    production of seed, this treatment was undertaken uniformly across all inflorescences
    and controls for each species. Ensuring that a consistent number of flowers were
    used in each treatment ensured similar resource use by each plant (and therefore
    potential effect on the seed produced). The pollination treatments were as follows,
    (1) to determine whether a pollinator vector is required or whether plants mechanically
    self-pollinate, plants were bagged with a cylinder of tea bag material and sealed
    with micropore tape prior to flowers opening to exclude pollinators, (2) to determine
    whether plants are apomictic, flowers were emasculated and bagged to exclude pollinators.
    Flowers were bagged before opening to ensure that no insects were able to pollinate
    the flowers. After the flowers opened, the pollinia were removed, checking that
    they removed easily and were intact (pollinia in Prasophyllum are a cohesive mass
    of pollen that can be removed and transferred in a single unit), and the bag was
    resealed. Pollinia were removed after the flower opened because to do so beforehand
    would require mutilation of the flower and would introduce bias. (3) To determine
    whether plants are self-compatible (autogamous), plants were bagged before opening,
    then each flower was self-pollinated by hand, and the bag resealed. Furthermore,
    plants were subjected to (4) intrapopulation cross-pollination (xenogamy) (plants
    bagged before opening, then pollinia removed from each flower, and hand-pollinated
    with pollinia from a plant approximately 50–100 m away, and the bag was resealed),
    (5) interpopulation cross-pollination (plants bagged before opening, then pollinia
    removed and hand-pollinated with pollinia from a different population, and the
    bag was resealed), and (6) natural pollination (plants not bagged initially to
    allow natural pollination, then bagged 2 weeks after pollination had occurred
    when flowers had started to wither). ^p Prasophyllum lindleyanum was subjected
    to all six pollination treatments, with 21 plants (210 flowers) per treatment
    (N = 21 for each P. lindleyanum treatment). The pollinia donor population for
    the interpopulation cross-pollination treatment was located 218 km away at Rheola,
    Victoria. ^p Prasophyllum tadgellianum was subjected to five pollination treatments,
    with 21 plants (105 flowers) per treatment (N = 21 for each P. tadgellianum treatment).
    The emasculation treatment was not undertaken because of logistical difficulties
    accessing the remote study site, and for this reason inflorescences were also
    not bagged prior to opening. Instead, the pollination treatments were undertaken
    as flowers were starting to open, and all flowers were visually inspected for
    evidence of pollinia on the plate (stigma). If pollinia were present on the plate
    or the pollinia was missing, on any flower on the inflorescence, the plant was
    assigned to the natural pollination treatment or excluded from the study because
    of risks it may have already been pollinated. The pollinia donor population for
    the interpopulation cross-pollination treatment was located 12 km north of the
    study site. ^p Prasophyllum frenchii was subjected to five pollination treatments
    with 25 plants (250 flowers) per treatment, owing to the presence of more flowering
    plants (N = 25 for each P. frenchii treatment). The effect of interpopulation
    cross-pollination was unable to be tested because of the absence in this species
    of a second sufficiently large population that flowers at the same time as the
    studied population in this species. ^p For all species, bagged inflorescences
    containing developed seed were collected 4 weeks after pollination and dried to
    15% relative humidity for 10 days in a dehumidifying drying cabinet. The bags
    were then opened and the number of swollen, developed fruits and withered, non-developed
    fruits were counted. The proportion of swollen fruits was considered as a measure
    of 'fruit set'. The seed from all fruits were then cleaned and transferred to
    a small 5 mL glass vial. The vial was weighed before and after the addition of
    seed, to measure the weight of all seed from each plant. Weight per fruit was
    determined by dividing the total seed weight by the number of developed fruits
    on the inflorescence. Finally, the vial was sealed with an air-tight plastic cap,
    labelled, and stored in a container with silica gel at 4°C. Seeds were stored
    for 4 (P. frenchii) or 5 (P. lindleyanum and P. tadgellianum) months prior to
    chemical staining. Prior to being used in the asymbiotic germination trial, the
    same seed collections of P. frenchii and P. tadgellianum that were used in chemical
    staining were stored for an additional 15 months and 12 months respectively (P.
    lindleyanum was not used in germination trials).
  original_file: raw/trait_data.csv and raw/location_data.csv compiled from the source pdf
  notes: Candidate traits in data.csv not yet mapped in, seed_small_or_no_embryo_proportion,
    seed_polyembryony_proportion, seed_polyembryony, seed_coat_development, pollinator_requirement,
    inflorescences_per_plant, flower_size_descriptive,
    pollen_dispersal_unit, flowers_autopollinated_proportion, habitat, elevation_range,
    conservation_status. Values the paper cites from other studies (fruit set of P.
    odoratum, P. fimbria, P. elatum and P. innubum; mixed mating in P. fimbria and P.
    innubum; nectar rewards; 10% asymbiotic germination of P. frenchii) are kept, with
    source_id set to the original study. Fruit set, seed mass per fruit, seed viability
    and germination are mapped only for the natural pollination treatment; values from
    the pollinator exclusion, emasculation and hand-pollination treatments, and means
    averaged across treatments, are kept in data.csv but filtered out, and were used
    only to score breeding_system. Fruit set observed in other populations is also
    filtered out.
