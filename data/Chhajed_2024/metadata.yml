- var_in: Cs
  unit_in: kg{H20}/m3/MPa
  trait_name: stem_sapwood_capacitance
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 5-10
  methods: 'Sapwood capacitance (CS) measurements were made using a thermocouple psychrometer
    setup (83 series; JRD Merrill Specialty Equipment, Logan, UT, USA) as described
    in detail by Richards et al. (2014). Briefly, c. 2-m-long branches were cut in
    situ and transported to the laboratory in sealed moist plastic bags. Three 1-cm-long
    stem samples were obtained from each branch such that they were c. 10 mm2 in area
    (3.6 mm diameter) upon removing bark and cambium. The stem segments were soaked
    in distilled water overnight to allow rehydration of the tissues. They were then
    quickly blotted dry, weighed for sapwood saturated mass (ms), sealed together
    in a single thermocouple psychrometer chamber, allowed to equilibrate for 2–2.5
    h in a water bath at 30°C and measured for microvolt outputs using a 12-channel
    digital psychrometer (85 series; JRD Merrill Specialty Equipment). The voltage
    reading was converted into a measure of sapwood water potential using a calibration
    curve determined previously for each psychrometer chamber using filter paper soaked
    in a set of salt solutions of known water potential at 30°C. The sapwood samples
    were partially dehydrated on a bench, reweighed for sapwood fresh mass (mf) and
    resealed in the chambers for another round of water potential measurement. Measurements
    were repeated 6–10 times until the water potential was between −6 and −10 MPa.
    Finally, the samples were dried completely at 70°C for 5 d and the dry mass (md)
    was measured. Sapwood relative water content corresponding to each water potential
    measurement was calculated as: RWC = (mf − md)/(ms − md) (Eqn 1). Cumulative water
    released (CWR) was then calculated as: CWR = (1 − RWC) × ((ms − md)/md) × WD ×
    1000 (Eqn 2), where WD is the sapwood density (g cm−3) determined as the ratio
    of md to sapwood volume (calculated using the formula for cylinder volume based
    on sample length and diameter measurements). Sapwood water release curves were
    then generated for each species (Meinzer, 2003; Fig. 1, e.g. curve). CS is typically
    calculated as the initial slope in the water release curve (Meinzer, 2003; Scholz
    et al., 2011; Jupa et al., 2016). However, the ‘operating range’ of stem water
    potentials, that is the water potentials experienced under real-world conditions,
    does not often correspond with this early part of the curve (Richards et al.,
    2014). Thus, if the tissues never reach full water saturation, then the estimate
    of CS is functionally ambiguous, and higher (the curve is steeper) than what plants
    would experience. To avoid such an overestimation of CS, we calculated the slope
    of the water release curve in the ‘operating range’ of water potentials. Furthermore,
    psychrometer measurements are prone to mechanical and manual error. This may result
    in the loss of data points essential for subsequent curve fitting. Therefore,
    to execute robust curve fitting, that is lower the sensitivity in curvature to
    singular data points, we pooled the data from all the individuals for a species
    together and fitted a common curve. This best-fit overall trend was defined by
    a three-parameter equation (Eqn 3; Figs 1, S3, S4; Meinzer, 2003). CWR = p × Psi/(q
    + Psi) + r × Psi (Eqn 3), where CWR is the cumulative amount of stored water released,
    and p, q and r are three parameters optimized for best fit (Meinzer, 2003). Cumulative
    water released values, CWRPD and CWRMD, corresponding to predawn and midday water
    potentials, were calculated using the fit curve. Sapwood capacitance (CS) was
    then calculated using Eqn 4 (Figs 1, S3–S6). CS = (CWRMD − CWRPD)/ΔPsi (Eqn 4).'
