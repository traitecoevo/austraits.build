dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::mutate(
        location_name = "Castlereagh Nature Reserve",
        dplyr::across(
          c(LASA, LMSM),
          ~ dplyr::if_else(species == "Exocarpos strictus", NA, .x)
        )
      )
    '
  collection_date: 2019-10/2019-11
  taxon_name: species
  location_name: location_name
  description: To test whether variation in hydraulic traits
    explains the variation in photosynthetic traits, especially the ratio of leaf-internal
    to ambient CO2 concentration.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The study was conducted at Castlereagh Nature Reserve (33°39′S,
    150°42′E), a remnant of Cumberland Plains Woodland in the Sydney basin region.
    The field site is a predominantly flat, open temperate woodland 30–40 m above sea
    level. It receives 801 mm mean annual rainfall and has mean annual daily maximum
    temperature of 23.9°C (based on 100-yr averages of climate data for the closest
    meteorological station recorded by the Bureau of Meteorology, Australian Government
    (http://www.bom.gov.au/)). The mean ± SD soil total phosphorus is 205 ± 23 ug
    g−1, and soil total nitrogen is 0.059 ± 0.007% (Niinemets et al., 2009). The study
    focused on 18 of the most abundant C3 trees and shrubs at the site (all angiosperms;
    for species list, see Table S1). We measured at least five individuals (treated
    as statistical replicates) for each trait for each species. In cases where the
    replicates for a species did not have consistent values, we measured up to 10
    individuals to get better species averages. All the individuals were growing within
    700 m of each other, on a substrate of Tertiary alluvials (Herbert, 1980) derived
    from an underlying bedrock of Wianamatta group shales and sandstone (Bannerman
    & Hazelton, 2011; Bannerman et al., 2010). The in situ measurements were made
    during October–November 2019 on replicates for all species spread across several
    days. The environmental conditions (precipitation and temperature) recorded during
    the study period were typical of the area.
  original_file: CNR_Data.csv from the authors' GitHub repository, archived on Zenodo
    (doi.org/10.5281/zenodo.12683689)
  notes: Additional traits, daily operating range of water potential
    (DeltaPsi, the difference between species mean predawn and midday leaf water potentials),
    and leaf-normalised sapwood capacitance (Cs.l, g/m2/MPa). There were 9 species x trait values that were flagged as potential duplicates with a Bloomfield_2018 study from the same location. These are considered chance duplicates; a copy of the flagged values is in the raw data folder.
