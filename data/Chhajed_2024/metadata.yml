    (to garner sufficient leaf mass) were cut and placed in plastic bags and transported
    to the laboratory in an insulated cooler. Leaf area was then measured using a
    flatbed scanner and the FIJI image analysis software (Schindelin et al., 2012).
    Leaves were dried at 60°C for at least 72 h and then weighed. ^p Leaf dry matter
    content calculated as leaf dry mass divided by water-saturated leaf mass.
- var_in: LeafRWC
