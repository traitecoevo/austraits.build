- var_in: Aarea
  unit_in: umol{CO2}/m2/s
  trait_name: leaf_photosynthetic_rate_per_area_saturated
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 5-10
  methods: 'Leaf gas exchange was measured in situ using a portable gas exchange system
    (Licor-6800; Li-Cor, Lincoln, NE, USA) between 07:00 h and 11:00 h each day, which
    is when maximum rates of gas exchange are typically observed in plants. In particular,
    we calculated leaf-internal to ambient CO2 concentration ratio (ci : ca) and net
    light-saturated photosynthetic rate (Asat), stomatal conductance to water vapour
    (gS) and transpiration rate – all standardized per unit leaf area. Across all
    measurements, standard cuvette conditions were maintained: leaf chamber temperature
    was set at 25°C (±2°C), light level (photosynthetically active radiation) at 2000
    umol m−2 s−1, CO2 concentration at 400 ppm, and relative humidity was 40–75%.
    Leaves were in the cuvette typically for 2–5 min as stable gas exchange readings
    were achieved quickly (mostly under a minute). This was mainly due to the set
    cuvette conditions being similar to the ambient conditions. The range of RH values
    is also typical of the site and photosynthetic parameters were consistent across
    all RH levels. Only sun-exposed outer canopy most recent fully expanded leaves
    with little to no evidence of herbivory or senescence were used for measurements.'
