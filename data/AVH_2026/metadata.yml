dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      mutate(
      location_name = paste0("at_", round(decimalLatitude, 6),"_deg_lat_and_", round(decimalLongitude, 6),"_deg_long"),
      value_type = str_replace(value_type, "max", "maximum"),
      value_type = str_replace(value_type, "min", "minimum")
      ) |>
      generate_observation_numbers(scientificName, trait_name, location_name)
  '
  collection_date: eventDate
  taxon_name: scientificName
  trait_name: trait_name
  value: height_final
  location_name: location_name
  individual_id: recordID
  description: Plant height and width data extracted from the The Australasian Virtual
    Herbarium.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Occurrence records were obtained for all Australian plant species
    from the Australian Virtual Herbarium (AVH), retaining only records with geographic
    coordinates (latitude/longitude) and information on plant height or width recorded
    in the occurrenceRemarks field. Numeric values and associated units were extracted
    from occurrenceRemarks using string matching (in R). Initial broad filtering removed
    extracted values that did not refer to whole-plant dimensions, including measurements
    of floral or leaf parts and spatial distances unrelated to plant size (e.g., patch
    extent, height of a landscape feature, or distance from a road). Given the persistence
    of erroneous or ambiguous values after this step, we manually checked all records
    for species represented by fewer than 30 records, as well as the ten smallest
    and ten largest values for all species, together covering approximately two-thirds
    of retained records. Remaining records were then screened in two further passes,
    first, flagging values less than 0.2 times or greater than 5 times the mean height/width
    for that species within the AVH dataset; and second, flagging values less than
    0.2 times or greater than 5 times the species' reported height/width in the taxonomic
    literature or floras. Flagged records were manually checked and corrected or removed
    as appropriate. Finally, units were standardised, taxonomy was aligned to the
    APC, and reported ranges were split into separate minimum and maximum values.
    While these data have been extensively checked a few inconsistencies likely remain
    for 1) climbing plants which should be designated `plant_height_climbing_plant`
    but are sometimes missed and classified as `plant_height` or `stem_length`; 2)
    plants where a height might be either a vegetative or reproductive height, which
    should be designated as `plant_height_reproductive`, but will sometimes be designated
    as `plant_height`; 3) ferns, cycads, grasstrees, and small palms, where height
    is likely to include a mix of trunk heights, leaf lengths, and actual plant heights
    due to difficulties in assigning heights to existing categories
  original_file: download of all AVH records in September 2025 not in GitHub due to
    its size
  notes: Most columns removed before upload to GitHub due to file size. Contact AusTraits
    curators for more information - or use the recordID's to link back to full AVH
    information.
