dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        across(c(photosynthesis_per_area, transpiration_per_area, water_use_efficiency,
          leaf_dry_matter_d13C_gas_exchange_canopy, leaf_delta15N), ~ stringr::str_replace(.x,
          "\\±.+", "")),
        root_vessel_diameter = as.numeric(root_vessel_radius) * 2,
        root_vessel_lumen_fraction = as.numeric(root_vessel_lumina_pct_stele_area) / 100,
        root_Ks_stele_area_basis = as.numeric(root_Ks_stele_area_basis) * 1e-7 * 998,
        root_Ks_total_vessel_lumina_area_basis = as.numeric(root_Ks_total_vessel_lumina_area_basis) * 998
      ) %>%
      mutate(
        across(c(resprouting_capacity, bud_bank_location, clonal_spread_mechanism,
          vegetative_reproduction_ability), replace_duplicates_with_NA)
      )
  '
  collection_date: collection_date
  taxon_name: species_name
  location_name: site
  description: To investigate the extent of host dependence, water relations, and
    haustorial biology of the root hemiparasite Santalum acuminatum and its principal
    host species, using natural-abundance delta15N and delta13C signals, gas exchange,
    and root hydraulic conductivity measurements.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The study region was located in the northern sand plains of south
    western Australia, 40 km north of Eneabba (29 deg 49' S, 115 deg 16' E), and comprised
    three separate habitats, each containing relatively dense stands of Santalum acuminatum
    (R. Br.) A. DC.(Santalaceae) along with a range of woody shrubs and trees. The
    three sites had not been burnt for at least 5 years prior to the seasons of investigation.
    Species acting as principal hosts for the parasite were identified during the
    growing seasons (April-October) of 1995 and 1996 by means of a series of shallow
    excavations around potential hosts and examination of the partly exposed roots
    for haustoria. Common species whose roots were regularly or occasionally parasitized
    by Santalum at the first site (A) were Acacia rostellifera Benth. (Mimosaceae),
    Acacia pulchella R. Br. (Mimosaceae), Baeckea tetragona Benth. (Myrtaceae), Cryptandra
    mutila Reissek. (Rhamnaceae), Melaleuca viminea Lindley (Myrtaceae), Alyogyne
    hakeaefolia (Giord.) Alef. (Malvaceae), Anthocercis viscosa R. Br. (Solanaceae),
    Spyridium cordatum (Turcz.) Benth. (Rhamnaceae), Exocarpos sparteus Benth. (Santalaceae)
    and Dodonaea aptera Miq. (Sapindaceae). At the second site (B) hosts were identified
    as Allocasuarina campestris (Diels) L. Johnson (Casuarinaceae), Acacia pulchella
    R. Br. (Mimosaceae), Melaleuca viminea Lindley. (Myrtaceae), Spyridium cordatum
    (Turcz.) Benth. (Rhamnaceae), Leucopogon ovalifolius Sonder. (Epacridaceae), Lysinema
    ciliatum R. Br. (Epacridaceae), Desmocladus asperus Nees (Restionaceae), Hemiandra
    pungens R. Br. (Lamiaceae), Conostylis candicans Endl. (Haemodoraceae) and Gompholobium
    tomentosum Labill. (Fabaceae). At the third site (C) parasitized hosts were Acacia
    pulchella R. Br. (Mimosaceae), Acacia rostellifera Benth. (Mimosaceae), Melaleuca
    viminea Lindley. (Myrtaceae), Phyllanthus calycinus Benth. (Euphorbiaceae), Allocasuarina
    campestris (Diels) L. Johnson (Casuarinaceae), Desmocladus asperus Nees (Restionaceae)
    and Hemiandra pungens R. Br. (Lamiaceae). Twenty replicate samples of new season
    leafy shoot material of each species were collected in spring from within the
    designated (100 m2) plot transects at each site (site A sampled in August 1995
    and sites B and C in September 1996). The material was oven dried at 80 deg C
    for 72 h, ground and then sieved through a 1.25-mm-diameter mesh sieve.
  original_file: transcriptions of tables and figures from manuscript PDF in raw data
    folder
  notes: data transcribed from manuscript by ClaudeAI; root_Ks_stele_area_basis and root_Ks_total_vessel_lumina_area_basis
    (Fig. 7A/D) are carried with an unmapped (.na) trait_name rather than mapped
    to root_specific_hydraulic_conductivity - even after converting the paper's
    volumetric Ks to the mass-based units that trait_name expects (multiplying by water density), the resulting values are
    2-3 orders of magnitude below its allowed_values_min (0.01) - a systematic gap that we can't trace; custom_R_code still applies the unit conversion, so the values are already
    in root_specific_hydraulic_conductivity's units
identifiers: .na
