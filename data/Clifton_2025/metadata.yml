traits:
- var_in: genome_size
  unit_in: unit
  trait_name: genome_size
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  life_stage: juvenile
  methods: Preparation of sample material involved the following, 0.35 g of fresh
    young leaf tissues from both the target and standard species that were chopped
    separately (Galbraith et al. 1983) in 0.95 mL of lysis buffer (OTTO-I; Otto 1990)
    supplemented with 4.0 mM dithiothreitol and 50 µL (1 mg/mL) RNAse for 60 s using
    a double-sided razor blade. The homogenates were filtered through a 35 µm nylon
    mesh filter into a 5.0 mL microcentrifuge tubes prior to centrifugation at 100g
    for 5 min at 3°C, and again at 400g for 3 min at 3°C. ^p After centrifugation,
    the supernatant was extracted and discarded, and the remaining pellets were resuspended
    and incubated for 20 min in 100 µL of OTTO-I lysis buffer. The suspensions were
    stained with 1.2 mL OTTO-I:OTTO-II solution (Otto 1990; Doležel and Göhde 1995)
    at a ratio of 1:2 (400 µL OTTO I + 800 µL OTTO II). This solution was supplemented
    with 75 µL (1 mg/mL) propidium iodide (PI) 4.0 mM dithiothreitol and 75 µL (1
    mg/mL) RNAse (Doležel et al. 1992; Meister 2005). Samples were then incubated
    in the dark on ice for 40 min, followed by filtering through a 35 µm nylon mesh.
    ^p The prepared material was analysed at the La Trobe University Bioimaging platform
    by using a CytoFLEX V2-B2-R2 Flow Cytometer (Beckman and Coulter, Brea, CA, USA).
    PI fluorescence intensity was measured using the PerCP-A detector (690/50 nm band-pass
    filter) following excitation with the 488 nm blue laser, and side scatter (SSC)
    from ≥100,000 events was recorded using CytExpert (ver. 2.5; Beckman Coulter,
    Brea, CA, USA). Gate configuration of the SCC-2 and PerCP-A parameters was used
    to generate PerCP-A histograms showing the G0/G1 nuclei peaks of the target sample
    and internal standard, from which mean fluorescence estimates were obtained. After
    analysing the target and standard separately to determine their individual G0/G1
    peaks, the corresponding nuclei suspensions were combined and co-analysed to estimate
    the 2C DNA content of each target sample from the ratio of their mean fluorescence
    intensities following Pellicer and Leitch (2014).
- var_in: ploidy
  unit_in: unit
  trait_name: ploidy
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  life_stage: juvenile
  methods: Root tip squashes were based on modified methods of Maluszynska (2003)
    and Mondal et al. (2023). Approximately 10 mm of terminal root tissue was cut
    from each seedling and placed in individual microtubes containing a pre-cooled
    solution of 1% colchicine and refrigerated at 4°C for 3 h. Roots were then washed
    in Milli-Q water and fixed in 45% glacial acetic acid at approximately 20°C for
    15 min. Roots were then hydrolysed in 1 M HCl at 60°C for 11 min, followed by
    excision of the terminal 2 mm of the root. This tissue was then mounted on slides
    in a drop of aceto-orcein stain for 20 min, teased apart with a dissection needle
    and squashed under a cover slip. Slides were examined under an Olympus CX22 compound
    microscope for the presence of well spread metaphase plates and photographed using
    a digital camera (Canon ES1300D). ^p To infer ploidy levels in the hybrid taxa
    (C. forresterae and C. kenmorrisonii) estimated, 2C DNA contents were compared
    with the mean 2C DNA content of the diploid parental species (C. citrinus and
    C. subulatus). Likewise, because C. nyallingensis is genomically allied to C.
    subulatus, its estimated 2C DNA content was compared directly with that of C.
    subulatus.
