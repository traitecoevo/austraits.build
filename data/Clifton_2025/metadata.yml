dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(trait != "plant_height") |>
      dplyr::mutate(
        replicates = n,
        reference_standard = dplyr::if_else(
          trait == "genome_size",
          stringr::str_extract(context, "(?<=internal standard: ).+$"),
          NA_character_
        ),
        structure_measured = dplyr::if_else(
          trait == "perianth_colour",
          stringr::str_extract(context, "(?<=structure measured: ).+$"),
          NA_character_
        )
      )
  '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_code
  entity_type: entity_type
  source_id: source_id
  description: To determine whether polyploidy is associated with hybridisation in
    a complex of clonal, narrow-range endemic East Gippsland Callistemon species.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: 'Sampling of seed material used to propagate plants for this
    study was conducted February–November 2023. Mature seed capsules (≥1 year after
    flowering) were collected in situ from plants of known genotype, as determined
    by Clifton et al. (2025, 2026) (Table 1). Because of extremely few unique genotypes
    in all of the East Gippsland narrow endemic Callistemon populations/subpopulations
    (some are monoclonal) (Clifton et al. 2025, 2026), and limited seed availability
    between genotypes, seed from only one representative genotype was sampled per
    population. An exception was made for one C. forresterae subpopulation at Ivor
    Track, Wangarabell (ITW), which was sampled twice to capture additional genotypic
    variation (Table 1). ^p Callistemon forresterae seed was sampled from the following
    three subpopulations: Wangarabell Rock Bar, on the Genoa River, Wangarabell, Victoria
    (WRB); Coopracambra National Park, near Ivor Track on the Genoa River, Coopracambra
    National Park, Wangarabell, Victoria (ITW) and the Upper Genoa River, Coopracambra
    National Park, Victoria (UGR). Seed from both known C. kenmorrisonii populations
    were sampled in Wingan State Forest, Genoa, Victoria, including where Stony Peak
    Road meets the Betka River (SPW) and where Roger Track meets the Betka River (RTB).
    Callistemon nyallingensis seed was sampled from its single known population at
    Boggy Creek, Nowa Nowa, Victoria (NN). Finally, seed from C. subulatus was sampled
    from two populations (WRB and ITW), whereas C. citrinus seed was sampled from
    UGR and from Burnt Bridge Road, Toorloo Arm, Victoria (BBR) (Table 1, Fig. 2).
    ^p After harvesting, the Callistemon seed capsules were retained in field collection
    envelopes (Tudor size 5) at ambient temperatures for approximately 2 weeks to
    allow the capsules to dehisce. Seeds were germinated in a sterilised seed-raising
    medium comprising four parts of native seed-raising mix (Spotswood, Yarra Glen,
    Vic, Australia) and one part Grade 3 vermiculite (Australian Vermiculite, Carroll
    Park, Qld, Australia) and grown in a Conviron CMP 6010 growth chamber (Controlled
    Environments Inc., Pembina, ND, USA) with a 12-h light cycle set at 20°C and a
    12-h dark cycle set at 10°C for 3 weeks. They were watered daily with approximately
    100 mL of reverse-osmosis water. After 10 weeks they were transferred to individual
    forestry tubes and grown on in a polyhouse set at a constant temperature of 20°C
    with daily watering. Plants used for chromosome counts were transferred to water
    baths and grown using subirrigation to promote root growth from the base of the
    forestry tubes (for ease of sampling root tips). ^p Root meristem samples were
    harvested from seed-grown individuals from each Callistemon species, population
    and genotype. The genotypes included four from C. forresterae (FOR1, FOR2, FOR3
    and FOR4), one from C. nyallingensis (NYA1), two from C. kenmorrisonii (KEN1,
    KEN2), two from C. citrinus (CIT1, CIT2), and two from C. subulatus (SUB1, SUB2)
    (Table 2), with between three and five replicates per population. Actively growing
    roots were harvested in the morning approximately 1 h after sunrise to capture
    the roots in an optimal stage of cell division. ^p Genome size and ploidy were
    estimated using an optimised flow cytometric analyses of propidium iodide (PI)-stained
    nuclei isolated from Callistemon leaf samples. Raphanus sativus ''Saxa'' (2C =
    1.11; Doležel et al. 1992) and Arabidopsis thaliana ''Columbia'' (2C = 0.32; Bennett
    et al. 2003) were used as internal reference standards to infer genome size and
    ploidy in the target Callistemon species. Leaf samples from each Callistemon species
    were from plants of the same genotype as those used in the chromosome count analyses,
    and leaf samples of R. sativus and A. thaliana were randomly selected from the
    seed-generated plants. Three separate analyses were conducted on each genotype
    by using one or both of the internal standards (Table 2), although only A. thaliana
    was fit for purpose in comparisons with C. citrinus and C. forresterae because
    of the similar genome sizes of the latter two species and R. sativus.'
  original_file: raw/trait_data.csv and raw/location_data.csv (extracted from the
    source PDF by Claude AI, Anthropic)
  notes: Candidate traits recorded in raw/trait_data.csv but not yet in config/traits.yml
    are hybrid_origin and population_size.
