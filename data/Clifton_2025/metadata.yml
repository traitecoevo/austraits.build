- var_in: chromosome_count
  unit_in: unit
  trait_name: chromosome_count
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  life_stage: juvenile
  methods: Root tip squashes were based on modified methods of Maluszynska (2003)
    and Mondal et al. (2023). Approximately 10 mm of terminal root tissue was cut
    from each seedling and placed in individual microtubes containing a pre-cooled
    solution of 1% colchicine and refrigerated at 4°C for 3 h. Roots were then washed
    in Milli-Q water and fixed in 45% glacial acetic acid at approximately 20°C for
    15 min. Roots were then hydrolysed in 1 M HCl at 60°C for 11 min, followed by
    excision of the terminal 2 mm of the root. This tissue was then mounted on slides
    in a drop of aceto-orcein stain for 20 min, teased apart with a dissection needle
    and squashed under a cover slip. Slides were examined under an Olympus CX22 compound
    microscope for the presence of well spread metaphase plates and photographed using
    a digital camera (Canon ES1300D).
- var_in: polyploidy_type
  unit_in: .na
  trait_name: polyploidy_type
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Inferred from the tetraploid chromosome number (2n = 44) and approximately
    doubled 2C DNA content of C. nyallingensis relative to C. subulatus, the diploid
