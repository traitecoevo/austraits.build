    year: 2007
    author: Denise R. Fernando and Ian E. Woodrow and E. J. Bakkaus and Richard N. Collins
      and Alan J. M. Baker and George N. Batianoff
    journal: Plant and Soil
    title: Variability of Mn hyperaccumulation in the Australian rainforest tree Gossia
      bidwillii (Myrtaceae)
    volume: 293
    number: 1-2
    pages: 145--152
    doi: 10.1007/s11104-007-9269-6
