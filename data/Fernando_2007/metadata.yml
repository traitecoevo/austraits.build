contexts: .na
traits:
- var_in: leaf_Ca_per_dry_mass
  unit_in: ug/g
  trait_name: leaf_Ca_per_dry_mass
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Leaf samples were rinsed in distilled water and oven-dried at 70°C for
    inductively coupled plasma optical emission spectrometry (ICP-OES) analyses. They
    were ground and weighed to ~0.3 g, and digested in 5 ml 70% nitric acid at 125°C for
    2 h. Digests were treated with 30% hydrogen peroxide, diluted to 75 ml with
    distilled water, analysed and quantified against a series of aqueous standards
    acidified with nitric acid. ^p Using this methodology, concentrations of Mn, Ca, Fe
    and Mg in leaf dry matter samples, and total Mn, Al, Ca, Co, Cr, Fe, Mg and Ni in
    soil samples were obtained. ^p Sample standard errors were calculated where
    replication exceeded three.
