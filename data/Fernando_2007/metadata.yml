dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(trait %in% c("leaf_Ca_per_dry_mass", "leaf_Fe_per_dry_mass", "leaf_Mg_per_dry_mass",
      "leaf_Mn_per_dry_mass"))
    '
  collection_date: 2006
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  description: To investigate how variable Mn hyperaccumulation is within and among
    natural stands of the rainforest tree Gossia bidwillii.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Eight geographic areas defined as sites 1-8 were sampled. Their
    coordinates, the numbers of plant and soil samples collected from each site, and
    individual soil types on each site are summarised in Table 1. Leaves were harvested
    from branchlets, and soils were sampled to a depth of 10 cm. Each individual soil
    sample comprised ten sub-samples. Since G. bidwillii is sparsely distributed,
    discrete populations are not clearly defined, and the term 'stand' is used to
    describe groups of trees. Four stands of trees (stands 1-4 on sites 1-4,
    respectively) were sampled. One to three trees and their soils were sampled from
    each of four other locations (sites 5-8).
  original_file: data extracted from the source PDF (Tables 1-3 and text)
  notes: Data for additional traits leaf_Mn_hyperaccumulator_proportion (proportion of
    trees above 10,000 ug/g Mn) and leaf_Mn_sequestration_tissue (PIXE/EDAX mapping)
    remain in raw/trait_data.csv. Sites 5 and 6 are single trees (entity_type
    individual); the minimum and maximum leaf Mn are across all 47 trees at the eight
    sites.
