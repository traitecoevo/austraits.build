questions:
  question_1: For several traits where the units were reported as '%' I am wondering if they should be 'mg/g'? The values for these leaf nutrients were the highest in AusTraits and quite a few data points were excluded as above the allowed maximum value. I've currently remapped the units to mg/g.  The units for leaf P, which were reported in the paper, are already mg/g in both the dataset and the paper.
  question_2: Are data also available for leaf N and d15N?
  question_3: Are data also available for the other sites mentioned in the manuscript?
  quetsion_4: NOTE, I will map in mycorrhizal status and other root structure information from Table 1, but linked to the original datasets for most taxa.
