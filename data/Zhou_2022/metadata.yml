- var_in: Al (mg/kg)
  unit_in: mg/kg
  trait_name: leaf_Al_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Mature leaf total P and Mn (and other micronutrient) concentrations were analysed from five to 10 plants per species. Oven-dried leaf samples (70 °C for two days) were ground in a ball-mill grinder (Geno/Grinder 2010, Spex SamplePrep, Metuchen, NJ, USA) using plastic vials and yttria-stabilised zirconia ceramic beads. Samples were then digested with hot concentrated HNO3:HClO4 (3:1) and analysed using ICP-OES (Model 5300DV, Perkin Elmer, Shelton, CT, USA).
