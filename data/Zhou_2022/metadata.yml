  collection_date: 10-2020/11-2020
  taxon_name: Species
  location_name: location_name
  description: The low diversity of tall Eucalyptus forests in southwest Australia can be explained by dominant mycorrhizal species exhibiting a carboxylate-releasing strategy. The tall eucalypts are therefore strong competitors that do not require facilitation, but also do not access organic N.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Site descriptions ^p The three study sites comprise evergreen tall forests in southwest Australia, a region characterised by a Mediterranean climate, with hot dry summers (December to February) and cool wet winters (June to August). The E. patens site is located at Cypress Form, Waroona (32°47'35''S, 116°0'46''E), ~100 km south of Perth, with a mean annual rainfall of 992 mm (1990-2015), mean annual temperature of 21.9 °C, and mean monthly maxima from 15.1 °C (July) to 29.7 °C (January/ February) (Australian Bureau of Meteorology, http://www.bom.gov.au/climate/data/). This is where we sampled the vast majority of all vascular plant species present at the site. The two E. diversicolor sites occur on different soil types, in Torndirrup National Park (35°06'12''S, 117°53'57''E) and Porongurup National Park (34°41'28''S, 117°54'22''E), ~400 km south of Perth. The sites have a mean annual rainfall of 925 mm (1990-2015) and mean annual temperature of 19.5 °C and mean monthly maxima from 15.8 °C (July) to 22.9 °C (February) (Australian Bureau of Meteorology, http://www.bom.gov.au/climate/data/). These sites were included to allow a comparison of dominant Eucalyptus species in tall eucalypt forest in southwest Australia. At these sites we only sampled the focal species, and reference species where possible. ^p Soil samples ^p Moist surface soil was collected from five locations within each site (four samples combined at each location). Soil was sampled using an auger (diameter = 100 mm, depth = 150 mm). Samples were sieved (<2 mm), air-dried, and stored in zip-lock bags at 25°C before chemical analyses. Soil pH was measured (in deionised water (DI) and 0.01 M CaCl2 in a 1:5 soil-to-solution ratio) using a pH and electrical conductivity (EC) probe (Orion 720a, Beverly, MA, USA) (Rayment and Lyons 2011). Total N was measured by the combustion method using a Leco analyser (FP628, St. Joseph, MI, USA). Plant-available soil P was measured as resin-P using anion-exchange membranes (AEM) (Rayment and Lyons 2011), with soil samples shaken for 16 h in 30 ml deionised water and four anionic form AEM strips (10 x 40 mm; manufactured by BDH, Poole, UK). Phosphate was recovered by shaking strips with 30 ml 0.5 M HCl for 1 h. Soil organic P was determined by the ignition method (550°C, for 1 h) and extraction in 1 M HCl (16 h, 1:50 soil to solution ratio) (Saunders and Williams 1955). The organic P concentration was calculated by subtracting the 1 M HCl-extracted P without ignition from the 1 M HCl-extracted P after ignition. Phosphate concentrations in extracts were determined by the malachite-green method (Rao et al. 1997), using a UV-VIS spectrophotometer (UV160A Shimadzu, Kyoto, Japan). Elements in soil were extracted with aqua regia (3:1 mixture of HNO3 to HCl) digestion (1 h at 130°C) and then determined by inductively coupled plasma optical emission spectrometry (ICP-OES; Model 5300DV spectrometer, Perkin Elmer, Shelton, CT, USA) (Rayment and Lyons 2011).  ^p Selection of species ^p We collected 21 species at the E. patens site in October and November 2020, including a positive reference species (Banksia grandis) and a negative reference species (Xanthorrhoea preissii) (Fig. 1, Table 1). This comprised most species at the site, except for some understorey orchids, sundews, and sedges. We used X. preissii as a negative reference, because Xanthorrhoea species are mycorrhizal and do not release carboxylates; they invariably have a low leaf [Mn] (Hayes et al. 2014; Zhong et al. 2021). ^p We also sampled species at the two E. diversicolor sites in December 2020 (Fig.1, Table 1). In Torndirrup National Park, there were Proteaceae (B. grandis and Adenanthos obovatus) located at somewhat greater distance of over 300 m from E. diversicolor, but there were no Xanthorrhoea species as negative reference. Therefore, we used young expanding leaves of Adenanthos obovatus as a negative reference, because young leaves tend to exhibit consistently low [Mn] while those in old leaves vary (Shane and Lambers 2005b). ^p In Porongurup National Park, E. diversicolor was the only Myrtaceae species, whereas no Proteaceae for a positive reference or any species for a negative reference were found within at least 1000 m. Thus, we selected young expanding leaves of E. diversicolor as possible reference material.
  original_file: original file in raw data folder
  notes: none
