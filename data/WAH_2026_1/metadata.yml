dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait_name %in% c(
          "extrafloral_nectary_count",
          "anther_colour", "bark_colour", "bark_texture", "bracteole_length",
          "bracteole_width", "branchlet_hairs", "bud_length", "clonal_spread_mechanism",
          "corolla_lobe_length", "dispersal_appendage", "extrafloral_nectaries", "extrafloral_nectary_position",
          "filament_fusion", "flower_anther_length", "flower_bract_length", "flower_colour",
          "flower_colour_detailed", "flower_diameter", "flower_fertile_stamens_count", "flower_filament_length",
          "flower_length", "flower_nectar_production", "flower_orientation", "flower_perianth_merism",
          "flower_petal_length", "flower_scent_production", "flower_sepal_length", "flower_stamen_length",
          "flower_structural_sex_type", "flower_style_length", "flowering_cues", "flowering_time",
          "flowers_per_inflorescence", "fruit_colour", "fruit_dehiscence", "fruit_fleshiness",
          "fruit_height", "fruit_length", "fruit_shape", "fruit_surface",
          "fruit_surface_hairs", "fruit_texture", "fruit_type", "fruit_width",
          "germination_cues", "glume_length", "inflorescence_colour", "inflorescence_diameter",
          "inflorescence_length", "inflorescence_shape", "inflorescence_type", "involucral_bract_length",
          "leaf_adaxial_colour", "leaf_apex_shape", "leaf_arrangement", "leaf_attachment",
          "leaf_base_shape", "leaf_compoundness", "leaf_discolority", "leaf_glaucousness",
          "leaf_hairs_adult_leaves", "leaf_hairs_juvenile_leaves", "leaf_heterogeneity", "leaf_lamina_division",
          "leaf_lamina_posture", "leaf_length", "leaf_length_type", "leaf_lobation",
          "leaf_main_vein_count", "leaf_margin", "leaf_margin_posture", "leaf_pendulousness",
          "leaf_phenology", "leaf_phyllotaxis", "leaf_shape", "leaf_surface_colour",
          "leaf_surface_reflectivity", "leaf_texture", "leaf_type", "leaf_width",
          "leaflet_count", "leaflet_count_pairs", "leaflet_length", "leaflet_width",
          "lemma_length", "life_history", "parasitic", "pedicel_length",
          "peduncle_length", "petiole_length", "pistil_length", "plant_canopy_form",
          "plant_climbing_mechanism", "plant_growth_form", "plant_growth_substrate", "plant_height",
          "plant_height_climbing_plant", "plant_height_reproductive", "plant_height_type", "plant_photosynthetic_organ",
          "plant_physical_defence_structures", "plant_succulence", "plant_width", "post_fire_flowering",
          "post_fire_recruitment", "seed_colour", "seed_length", "seed_shape",
          "seed_surface_reflectivity", "seed_surface_texture", "seed_width", "seeds_per_fruit",
          "sex_type", "stem_base_form", "stem_branching_form", "stem_constitution",
          "stem_diameter", "stem_growth_habit", "stem_hairs", "stem_length",
          "stem_shape", "stipule_presence", "storage_organ", "storage_organ_diameter",
          "storage_organ_length", "style_shape", "tepal_length", "tepal_width",
          "vegetative_reproduction_ability", "woodiness_detailed"
        ),
        is.na(measurement_range) | measurement_range != "extreme"
      ) |>
      dplyr::mutate(location_name = "Western Australia")
    '
  collection_date: '2026'
  taxon_name: taxon_name
  location_name: location_name
  trait_name: trait_name
  value: value
  description: To compile plant trait values from the brief descriptions (Descriptive Catalogue) of the Florabase profiles of
    the Western Australian flora.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'The brief descriptions of the Florabase profiles (source: Descriptive Catalogue) were downloaded: "<habit>,
    <height>[, organ clauses]. Fl. <colours>, <months>. <Soils>. <Habitats>.". The text before the "Fl." sentence is read as
    the description, the flower colours and months of the "Fl." sentence as flower colour and flowering time (colours joined
    by -, / or & are each scored), and the soil and habitat sentences as the habitat text. Trait values were extracted with
    the scripted parser written for the Flora of Australia online (ABRS_AtoM_2026/raw/build_data_csv.R, Florabase mode, FB_TEXT
    = brief): each description is split into sentences, clauses and comma-separated segments, each segment is assigned to the
    organ it describes, and categorical terms and measurements are read from the segments of the relevant organ, with the family
    rules of that parser (Fabaceae, orchids, grasses and other graminoids, ferns, Asteraceae heads ...). Categorical terms are
    mapped to AusTraits trait values, with the source terms kept verbatim in value_description; several values are listed in
    the order they appear in the text, and alternatives qualified by a commonness word or a region are recorded on separate
    rows. A measured range is recorded as minimum and maximum values, a single measurement as a mean, a single count as a mode,
    "to X" as a maximum and "X or more" as a minimum; parenthetical extremes are kept on separate rows (measurement_range =
    extreme). Subspecies and varieties silent on a trait take the values of their species. Values that descriptions state only
    when atypical (terrestrial substrate, leaf as photosynthetic organ, not parasitic, broadleaf) are recorded on trait_scoring_method
    = inferred rows when nothing in the profile suggests otherwise; plant_height_type records why a taxon has no plant_height.
    Taxon names are given without authorities; current and not-current Florabase names are both included (one profile per name,
    the current one first).'
  original_file: florabase_profiles.csv (Florabase profiles, downloaded 1 October 2026), field brief_description
  notes: The profile URL of each taxon is in the foa_url column. Rows whose trait_name is not mapped below (candidate traits,
    and text fields such as habit_description or habitat_description with the verbatim organ-level text) are in data.csv but
    filtered out in custom_R_code; candidate traits are listed with their coverage in raw/candidate_traits.csv.
