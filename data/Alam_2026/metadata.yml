dataset:
  data_is_long_format: no
  custom_R_code: ' data |> dplyr::filter( !source_id %in% c("Cernusak_2011", "Givnish_2014",
    "Anderson_1996") ) |> dplyr::mutate( individual_id = dplyr::if_else( source_id
    == "Alam_2026" & source_file == "NT_NQ_leaf_data.csv", paste(location_name, Leaf_num,
    sep = "_"), NA_character_ ) ) '
  collection_date: collection_date
  taxon_name: taxon_name
  location_name: location_name
  individual_id: individual_id
  source_id: source_id
  description: To determine why the sensitivity of leaf carbon isotope discrimination
    to mean annual precipitation differs among subcontinental regions of Australia,
    and in particular whether soil phosphorus availability modulates this response
    through its effects on stomatal conductance or photosynthetic capacity.
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: Data including site location and plant δ13C from six previously
    published sampling transects were collated from the literature (Fig. 1; Table
    1; Supporting Information Table S1) and combined with new data from a transect
    in northeastern Queensland. In addition to leaf or wood δ13C, we also collated
    SLA if available. All transects ranged from near the coastal regions, where MAP
    is generally high, to the arid interior of the Australian continent. For the new
    transect presented here, leaf samples were collected from trees at 11 sites in
    northeastern Queensland, starting near Cairns at the edge of the Australian Wet
    Tropics bioregion, and extending to near the edge of the Simpson Desert. Sampling
    from three trees of one dominant eucalypt species at each site took place during
    the dry season in 2015 (Cheesman & Cernusak, 2017). Data on δ13C, leaf nutrients,
    and SLA are presented here for the first time. ^p In April 2015, 11 sampling sites
    were selected within the state of Queensland along a 900 km transect from the
    edge of the Australian wet tropics bioregion towards the Simpson desert (Figure
    1, Table 1). [...] At each sampling station, 12 leaves and an associated branch
    section (1 cm diameter, 5 cm length) were collected from an exposed branch of
    three representative trees of the same eucalypt species (Table 2). Leaves were
    placed in paper bags and then into ziplock bags, while branch sections were immediately
    stripped of bark and placed into 50 ml centrifuge tubes. All samples were double
    sealed and frozen for transportation back to the laboratory. ^p Data from two
    common garden studies were obtained from the literature to provide additional
    insight into the interaction between soil P and MAP in modulating Δ13C (Anderson
    et al., 1996; Cernusak, 2020). The two common garden studies provided an opportunity
    to contrast species that naturally occur in a higher-P region of Australia with
    those that occur in a low-P region. The first utilised 11 southeastern Australian
    eucalypt tree species (Anderson et al., 1996). We excluded two species in the
    dataset from Western Australia and two additional species from New South Wales,
    identified by the authors as phreatophytic. We used the MAP at the point of seed
    collection as reported in the original paper. The second study utilised nine northern
    Australian tree species, collected in the Northern Territory (Cernusak, 2020).
    In this case, the precise geographic locations of seed collection were not known;
    therefore, the species range MAP was used, as described in the original paper.
    For the species from southeastern Australia, the MAP at the species origin ranged
    from c. 200 to 1700 mm, whereas for the Northern Territory species, the species
    mean MAPs ranged from c. 500 to 1750 mm. Plants were well-watered in both experiments
    when growing in the common gardens.
  original_file: NT_NQ_leaf_data.csv, Transects_data.csv (VIC-Givnish rows) and Common_gardens.csv
    from the Dryad data repository, doi:10.5061/dryad.zgmsbccst
  notes: data.csv merges three files from the Dryad archive (column source_file) and
    is built by raw/extra_R_code_Alam_2026.R; For these source_id indicates the source
    of each measurement, and custom_R_code drops the sources that are in AusTraits
    as their own datasets. Data from Cernusak_2020, data newly published for this
    study (NE-QLD-Cheesman, 33 trees at 11 sites, source_id Alam_2026), and one Givnish_2014
    site are mapped here, while all other datasets are in AusTraits as their own datasets,
    Anderson_1996, Cernusak_2011, Cheesman_2017, Miller_2001, Schulze_1998, Schulze_2006_2,
    Stewart_1995, Westerband_2023
