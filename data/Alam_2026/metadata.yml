traits:
- var_in: LMA_g_m2
  unit_in: g/m2
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf samples collected from the northeastern Queensland transect (NE-QLD-Cheesman)
    were scanned for leaf area, oven dried at 60°C, weighed for determination of SLA
    and then ground to a fine powder (Bench Top Ring Mill, ROCKLABS, New Zealand).
- var_in: d13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf samples collected from the northeastern Queensland transect (NE-QLD-Cheesman)
    were scanned for leaf area, oven dried at 60°C, weighed for determination of SLA
    and then ground to a fine powder (Bench Top Ring Mill, ROCKLABS, New Zealand).
    Carbon isotope ratios (δ13C, ‰) and leaf N concentrations (mg g−1) were measured
    using an Elemental Analyser coupled via a ConFloIV to a Delta V PLUS Isotope Ratio
    Mass Spectrometer (ThermoScientific, Waltham, MA, USA).
- var_in: C_per
  unit_in: '%'
  trait_name: leaf_C_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf samples collected from the northeastern Queensland transect (NE-QLD-Cheesman)
    were scanned for leaf area, oven dried at 60°C, weighed for determination of SLA
    and then ground to a fine powder (Bench Top Ring Mill, ROCKLABS, New Zealand).
    Carbon isotope ratios (δ13C, ‰) and leaf N concentrations (mg g−1) were measured
    using an Elemental Analyser coupled via a ConFloIV to a Delta V PLUS Isotope Ratio
    Mass Spectrometer (ThermoScientific, Waltham, MA, USA). ^p Leaf carbon concentration
    is reported as percent carbon in the leaf dry matter.
- var_in: N_per
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf samples collected from the northeastern Queensland transect (NE-QLD-Cheesman)
    were scanned for leaf area, oven dried at 60°C, weighed for determination of SLA
    and then ground to a fine powder (Bench Top Ring Mill, ROCKLABS, New Zealand).
    Carbon isotope ratios (δ13C, ‰) and leaf N concentrations (mg g−1) were measured
    using an Elemental Analyser coupled via a ConFloIV to a Delta V PLUS Isotope Ratio
    Mass Spectrometer (ThermoScientific, Waltham, MA, USA).
- var_in: Leaf_P_mg_g
  unit_in: mg/g
  trait_name: leaf_P_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf samples collected from the northeastern Queensland transect (NE-QLD-Cheesman)
    were scanned for leaf area, oven dried at 60°C, weighed for determination of SLA
    and then ground to a fine powder (Bench Top Ring Mill, ROCKLABS, New Zealand).
    Leaf P concentration (mg g−1) was analysed by microwave-assisted acid digestion,
    followed by detection via inductively coupled plasma-atomic emission spectrometry
    (ICP-AES).
- var_in: N_area_g_m2
  unit_in: g/m2
  trait_name: leaf_N_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf samples collected from the northeastern Queensland transect (NE-QLD-Cheesman)
    were scanned for leaf area, oven dried at 60°C, weighed for determination of SLA
    and then ground to a fine powder (Bench Top Ring Mill, ROCKLABS, New Zealand).
    Carbon isotope ratios (δ13C, ‰) and leaf N concentrations (mg g−1) were measured
    using an Elemental Analyser coupled via a ConFloIV to a Delta V PLUS Isotope Ratio
    Mass Spectrometer (ThermoScientific, Waltham, MA, USA). ^p Leaf nitrogen per unit
    leaf area is calculated from leaf N concentration and leaf mass per area.
- var_in: P_area_g_m2
  unit_in: g/m2
  trait_name: leaf_P_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf samples collected from the northeastern Queensland transect (NE-QLD-Cheesman)
    were scanned for leaf area, oven dried at 60°C, weighed for determination of SLA
    and then ground to a fine powder (Bench Top Ring Mill, ROCKLABS, New Zealand).
    Leaf P concentration (mg g−1) was analysed by microwave-assisted acid digestion,
    followed by detection via inductively coupled plasma-atomic emission spectrometry
    (ICP-AES). ^p Leaf phosphorus per unit leaf area is calculated from leaf P concentration
    and leaf mass per area.
- var_in: NP_ratio_g_g
  unit_in: g/g
  trait_name: leaf_NP_ratio
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Carbon isotope ratios (δ13C, ‰) and leaf N concentrations (mg g−1) were
    measured using an Elemental Analyser coupled via a ConFloIV to a Delta V PLUS
    Isotope Ratio Mass Spectrometer (ThermoScientific, Waltham, MA, USA). Leaf P concentration
    (mg g−1) was analysed by microwave-assisted acid digestion, followed by detection
    via inductively coupled plasma-atomic emission spectrometry (ICP-AES). ^p Ratio
    of leaf nitrogen to leaf phosphorus on a mass basis.
- var_in: Leaf_d13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Data from two common garden studies were obtained from the literature to
    provide additional insight into the interaction between soil P and MAP in modulating
    Δ13C (Anderson et al., 1996; Cernusak, 2020). Plants were well-watered in both
    experiments when growing in the common gardens. ^p Average leaf δ13C for each
    species grown in the common garden.
substitutions: .na
taxonomic_updates:
- find: Eucalyptus sp.
  replace: Eucalyptus sp. [Alam_2026]
  reason: Exact match of taxon name ending with `sp.` to an APC genus (2026-10-30)
  taxonomic_resolution: genus
- find: Syzigium forte
  replace: Syzygium forte
  reason: Fuzzy match of taxon name to an APC-accepted canonical name once punctuation
    and filler words are removed (2026-10-30)
  taxonomic_resolution: species
exclude_observations: .na
questions:
  question1: Many of the datasets used in this analysis were already in AusTraits
    and we have just added the remaining ones we did not yet have, so that each dataset
    is explicitly linked to the sampling strategy/methods the respective authors used.
    The only exception is Cernusak_2020, since the data in that paper are only represented
    in plots. Do you have the individual-level data from that study that we could
    incorporate as a dataset explicitly linked to Cernusak_2020?
  question3: For the NE-QLD-Cheesman sites, Alam et al. (2026) Table S1 and Cheesman
    & Cernusak (2017) Tables 1-2 give different species at the same coordinates (each
    STN site is within 0.1 km of a Cheesman station; Cheesman station numbers run
    opposite to the STN codes, station 1 = STN_11). The species differ at all 11 sites.
    Species here follow Cheesman & Cernusak (2017); please confirm which table is
    correct.
  question4: Leaf mass per area for the NE-QLD trees appears to be the same measurements
    as the station means in Cheesman & Cernusak (2017) Table 2 (identical SDs; Alam
    means are consistently 0-5 g m-2 lower). Were the values recalculated for this study, 
    and which version should be used?
