contexts:
- context_property: vegetation type
  category: plot_context
  var_in: Habitat type
  values:
  - value: herbfield
    description: one herbaceous layer, mostly deciduous species, generally on highly
      irradiated, shallow-soil patches
  - value: shrubland
    description: two layers (herbs and woody shrubs, generally evergreen species) on
      highly variable edaphic and sun-exposure conditions
  - value: woodland
    description: three vegetation layers (herbs, shrubs and trees, mainly evergreen
      species)
- context_property: sun exposure
  category: plot_context
  var_in: Sun irradiance
  values:
  - value: exposed
    description: highly irradiated, generally north-facing slopes, not shaded by rocks,
      trees or shrubs, on shallow (<10 cm deep) soils
  - value: sheltered
    description: deep soils with reduced solar radiation through protection by granitic
      rock and in-flow of water and nutrients as run-off, in flat areas near the base
      of the outcrop or near big boulders or trees
- context_property: sample location
  category: plot_context
  var_in: Sample location
  values:
  - value: granite outcrop
    description: on the granite outcrop or in the woodlands at its base, which receive
      run-off from the granitic slopes
  - value: landscape matrix
    description: similar vegetation on resource-impoverished soils in the surrounding
      landscape, 1-2 km from the outcrop
- context_property: soil depth at plant (cm)
  category: plot_context
  var_in: Soil depth
- context_property: plant height (m)
  category: entity_context
  var_in: Plant height vegetative
traits:
- var_in: SLA
  unit_in: mm2/mg
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: SLA is the one-sided area of a fresh leaf, divided by its oven-dry mass
    - 72 h at 60° C. ^p A sample was either a leaf (for the four leaf traits) or a
    measure of plant stature. For LDMC, SLA, and plant height we collected ten samples
    per species from ten different individual plants, from ten different plots in
    each study site (Table 2).
- var_in: Leaf area
  unit_in: mm2
  trait_name: leaf_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Leaf area [LA (mm2)]. Trait collection followed standard procedures (Pérez-Harguindeguy
    et al., 2013). ^p SLA is the one-sided area of a fresh leaf, divided by its oven-dry
    mass - 72 h at 60° C.
- var_in: LDMC
  unit_in: mg/g
  trait_name: leaf_dry_matter_content
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: LDMC was obtained by calculating the ratio between the oven-dry (72 h at
    60° C) mass of a leaf, and its water-saturated fresh mass.
- var_in: Leaf delta 13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Due to logistic constraints, we measured foliar δ13C isotopic composition
    and leaf C:N ratio from 5 samples per site for a restricted group of species (Table
    1). These characters were measured from dried leaves (72 h at 60° C), subsequently
    finely ground, weighted, and analysed using mass spectrometer at the West Australian
    Biogeochemistry Centre (The University of Western Australia, Perth, Australia).
- var_in: Leaf delta 15N
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta15N
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Due to logistic constraints, we measured foliar δ13C isotopic composition
    and leaf C:N ratio from 5 samples per site for a restricted group of species (Table
    1). These characters were measured from dried leaves (72 h at 60° C), subsequently
    finely ground, weighted, and analysed using mass spectrometer at the West Australian
    Biogeochemistry Centre (The University of Western Australia, Perth, Australia).
    ^p Foliar δ15N (‰ air) was measured on the same samples.
- var_in: Leaf C/N
  unit_in: g/g
  trait_name: leaf_CN_ratio
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Due to logistic constraints, we measured foliar δ13C isotopic composition
    and leaf C:N ratio from 5 samples per site for a restricted group of species (Table
    1). These characters were measured from dried leaves (72 h at 60° C), subsequently
    finely ground, weighted, and analysed using mass spectrometer at the West Australian
    Biogeochemistry Centre (The University of Western Australia, Perth, Australia).
    ^p Leaf C/N is on a weight basis.
- var_in: Leaf %N
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Due to logistic constraints, we measured foliar δ13C isotopic composition
    and leaf C:N ratio from 5 samples per site for a restricted group of species (Table
    1). These characters were measured from dried leaves (72 h at 60° C), subsequently
    finely ground, weighted, and analysed using mass spectrometer at the West Australian
    Biogeochemistry Centre (The University of Western Australia, Perth, Australia).
    ^p Leaf N (% of dry mass) was measured on the same samples.
- var_in: Leaf %C
  unit_in: '%'
  trait_name: leaf_C_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Due to logistic constraints, we measured foliar δ13C isotopic composition
    and leaf C:N ratio from 5 samples per site for a restricted group of species (Table
    1). These characters were measured from dried leaves (72 h at 60° C), subsequently
    finely ground, weighted, and analysed using mass spectrometer at the West Australian
    Biogeochemistry Centre (The University of Western Australia, Perth, Australia).
    ^p Leaf C (% of dry mass) was measured on the same samples.
- var_in: Bark thickness
  unit_in: mm
  trait_name: bark_thickness
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 5
  methods: For each individual sampled, we averaged the bark thickness from five measurements
    collected from every stem (average N = 270; Appendix I). We measured bark thickness
    at breast height for trees and high shrubs (ca. 135 cm above ground; Fajardo & Piper
    2011), and at 20 cm above the ground for small shrubs, using a forester penetrating
    scaled head.
- var_in: leaf_phenology
  unit_in: .na
  trait_name: leaf_phenology
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We focussed on two geophytic, common species on granite outcrops that are
    reduced to their belowground rhizomes during the hot, dry summers. ^p Leaf phenology
    of these two species is from this statement (Ottaviani_2018); that of the other
    species was provided by the author in response to AusTraits queries.
- var_in: life_form
  unit_in: .na
  trait_name: life_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We focussed on two geophytic, common species on granite outcrops that are
    reduced to their belowground rhizomes during the hot, dry summers. ^p Life form
    of these two species is from this statement (Ottaviani_2018); the author confirmed
    that all other species in the dataset are phanerophytes.
- var_in: clonal_spread_mechanism
  unit_in: .na
  trait_name: clonal_spread_mechanism
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: We studied seven plant traits for two common, rhizomatous granite outcrop
    species (the fern Cheilanthes austrotenuifolia, and the herb Stypandra glauca) with
    seasonal foliage during the cooler, wetter winter months. ^p Clonal spread mechanism
    of the two species named in this statement.
substitutions: .na
