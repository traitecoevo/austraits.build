dataset:
  data_is_long_format: no
  custom_R_code: '
    data |>
      dplyr::mutate(
        `Habitat type` = dplyr::if_else(
          `Site name` == "Boyagin Rock" & `Sample location` == "landscape matrix",
          "woodland",
          `Habitat type`
        )
      )
    '
  collection_date: 2012-09/2012-12
  taxon_name: Species
  location_name: Site name
  description: To infer the ecological and evolutionary processes shaping plant communities
    on granite outcrops of southwestern Australia, including whether outcrops act as
    refugia, using the functional traits of dominant species.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: 'We selected seven granite outcrops along a transect from Southwest
    to Northeast of the SW Australia, spanning a rainfall range from approximately 1100
    mm y-1 in the mesic Southwest to 300 mm y-1 in the more xeric Northeast (Fig. 1).
    ^p We determined mean soil depth in locations of each sampled individual plant,
    as the average of five soil depth measures from around the main stem by inserting
    a scaled (cm) pole in the soil. Soil depth ranged from 0.6 cm to 83.0 cm (mean
    = 22.2 cm, SD = 15.16 cm). ^p In each site (granite outcrop), only the dominant
    and most common species were selected for trait sampling. Such species selection
    follows the rationale of the Mass Ratio Hypothesis (Grime 1998), and recommendations
    for standardized traits collections (Pérez-Harguindeguy et al. 2013). Previous
    detailed floristic field surveys (Schut et al. 2014; G. Wardell-Johnson pers. comm.)
    allowed the assessment of the relative abundance of each species in plots. We used
    the plot size of 1 × 1 m in herbfields (vegetation type defined as consisting of
    only herbaceous plants), 5 x 5 m in shrublands (vegetation characterized by two
    layers: herbaceous and shrubby), 20 × 20 m in woodlands (three vegetation layers:
    herbaceous, shrubby and tree layer) using a modified Braun-Blanquet (1964) cover-abundance
    scale (Mueller-Dombois and Ellenberg 1974). ^p A candidate species was considered
    dominant if it scored a cover-abundance value ≥50% in more than half of the plots
    within a particular vegetation type in a site. We selected six species per outcrop
    following this dominance criterion (Table 1). For each species we collected trait
    data from ten individual samples in each outcrop from ten different vegetation plots
    randomly placed, where the candidate species was dominant. Each individual plant
    was sampled from one homogenous vegetation patch, which represented one vegetation
    plot. A sample was represented by a collection of a leaf (for the leaf traits, see
    next paragraph for details), and a measure of plant height. The cover values of
    the selected species were visually estimated within each plot, being the plots
    used in this study different than those of the previous survey. In total, we sampled
    17 woody and herbaceous species (Table 1). We collected data from ten individual
    plants per species in each site for the purpose of functional traits analysis.
    ^p We selected two outcrops along the rainfall gradient: one in mesic (Porongurup;
    34.68121 S, 117.87270 E; mean annual temperature 13.8° C; mean annual precipitation
    669 mm), and one in more xeric conditions (Boyagin Rock; 32.47365 S, 116.87836
    E; mean annual temperature 16.0° C; mean annual precipitation 512 mm). Within each
    outcrop, we considered woodlands occurring in sheltered and resource-rich conditions,
    i.e. putative refugia (Fig. 3A, 3C). Similarly, we selected woodlands in the surrounding
    landscape matrices, hypothesised to be non-refugial, focusing on similar type and
    structural vegetation, occurring 1-2 km from each outcrop (Fig. 3B, D). We focused
    on four dominant species (two species per outcrop; Banksia nobilis - Proteaceae,
    Corymbia calophylla - Myrtaceae, Eucalyptus marginata - Myrtaceae, Trymalium odoratissimum
    - Rhamnaceae). These species were selected based on achieving cover values of ≥
    80% in at least 50% of plots in vegetation surveys that used ten 20 × 20 m vegetation
    plots per site. Vegetation surveys were undertaken in both the apron and matrix
    woodlands, collecting trait data from ten plots (randomly placed, and where the
    candidate species were dominant) in the putative refugium and ten plots in non-refugium.
    Where possible, we sampled the same species both in the resource-gaining sheltered
    woodlands and in the matrix woodlands. This allowed comparing intra-specific trait
    variability for E. marginata at the more arid site and C. calophylla at the mesic
    site. ^p At the habitat scale, sheltered and sun-exposed habitats were identified
    based on visual qualitative assessment in the field and on ecological knowledge
    of the study system (see Schut et al. 2014; Ottaviani et al. 2016; Keppel et al.
    2017). Sheltered habitats were characterized by deep soils, reduced solar radiation
    through protection by granitic rock and the in-flow of water and nutrients as run-off
    from granitic slopes. These habitats occurred in flat areas near the base of the
    outcrop and in the vicinity of big boulders or trees (which were not overhanging
    the focal plants). Sun-exposed habitats were located on highly irradiated (generally
    north-facing) slopes, not shaded by rocks, trees or shrubs, on shallow (<10 cm deep)
    soils. ^p We sampled functional traits from healthy adult individuals (Pérez-Harguindeguy
    et al. 2013). A sample was either a leaf (for the four leaf traits) or a measure
    of plant stature. For LDMC, SLA, and plant height we collected ten samples per species
    from ten different individual plants, from ten different plots in each study site
    (Table 2). LDMC was obtained by calculating the ratio between the oven-dry (72 h
    at 60° C) mass of a leaf, and its water-saturated fresh mass. SLA is the one-sided
    area of a fresh leaf, divided by its oven-dry mass - 72 h at 60° C. Plant height
    was measured in the field using a meter-tape and forester''s inclinometer, deriving
    plant height using principles of trigonometry. Due to logistic constraints, we measured
    foliar δ13C isotopic composition and leaf C:N ratio from 5 samples per site for
    a restricted group of species (Table 1). These characters were measured from dried
    leaves (72 h at 60° C), subsequently finely ground, weighted, and analysed using
    mass spectrometer at the West Australian Biogeochemistry Centre (The University
    of Western Australia, Perth, Australia). We collected the five traits from the
    same individual plants. ^p Trait collection occurred in 2012 towards the end of
    the growing season, which occurs earlier in the arid sites. More arid sites were
    sampled during spring (September/October) and more mesic sites in early summer
    (November/December). ^p We gathered bark thickness data from ten healthy, adult
    individual plants per species per outcrop where the species occurred, targeting
    individuals of similar age for each species (Pérez-Harguindeguy et al. 2013). Each
    sample came from a different vegetation plot, randomly placed on a granite outcrop.
    In this way, we could account both for intra- and inter-specific trait variability.
    For each individual sampled, we averaged the bark thickness from five measurements
    collected from every stem (average N = 270; Appendix I). We measured bark thickness
    at breast height for trees and high shrubs (ca. 135 cm above ground; Fajardo & Piper
    2011), and at 20 cm above the ground for small shrubs, using a forester penetrating
    scaled head.'
  original_file: raw/Trait data_SW Australia granite outcrops_Ottaviani.xlsx (individual-level
    trait data supplied by the author.
  notes: Soil depth (mean of five measurements around
    the stem) and plant height of each sampled plant are recorded as contexts.
    The sampling_strategy combines the thesis methods (chapters 2 and 4) with the habitat
    definitions of Ottaviani_2018 and the bark thickness method of Ottaviani_2018_2
    (Appendix S1).
