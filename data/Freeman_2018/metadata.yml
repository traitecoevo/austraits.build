  description: To determine how fire frequency affects tree size class distributions
    within and between eco-taxonomic groups of species in an Australian mesic savanna,
    and whether these groups differ in their strategies for persisting and reproducing
    under frequent fire.
  basis_of_record: basis_of_record
  life_stage: life_stage
  sampling_strategy: Melville Island, the second largest island of Australia (5,790
    km2, maximum elevation 102 m above sea level), is one of the Tiwi Islands, which
    lie 60 km north-east of Darwin in the Northern Territory of Australia. The climate
    is monsoonal with rainfall averaging 1,840 mm in the wet season (November-April)
    and 144 mm in the dry season (May-October; BOM, 2017). Approximately 77% of Melville
    Island is frequently burnt savanna co-dominated by Eucalyptus tetrodonta, Eucalyptus
    miniata, and Corymbia nesophila (Woinarski and Baker, 2002). The understorey is
    dominated by C4 grasses and multi-stemmed woody resprouts. The height (≤30 m)
    and canopy cover (~30-60% projected foliage cover) of this vegetation community
    reflects an open forest formation (Specht, 1970), but the prevalence of C4 grasses
    in the understorey, fire-tolerant tree species, and lack of midstorey driven by
    very frequent fire equates these open forests with savannas elsewhere (Ratnam
    et al., 2011). ^p Data presented in this study were collected within experimental
    fire areas established as part of the Tiwi Carbon Study. Detailed information
    about the Tiwi Carbon Study, including study area descriptions can be found in
    Richards et al. (2012). In brief, the Tiwi Carbon Study consisted of 18 treatment
    sites at four locations in western Melville Island (Figure 1). Annual early dry
    season burning (annual), early dry season burning every 3 years (triennial) and
    fire exclusion (unburnt) treatments were replicated across these locations. There
    was one replicate of each fire treatment at Imalu, Taracumbi and Pikertaramoor,
    and three replicates of each fire treatment at Shark Bay (total of six replicates
    for each fire treatment). All fire treatment sites were located in natural savanna
    vegetation areas between forestry plantation blocks of Acacia mangium Willd. These
    areas burnt frequently before plantation establishment in 2006 (2005 at Imalu).
    Since 2001, ~35% of the eucalypt open forests on the Tiwi Islands have burnt every
    year, 72% of which occurred in the late dry season (Richards et al., 2015). Unburnt
    fire treatment sites have had fire excluded since plantation establishment. Annual
    treatment sites were burnt annually since plantation establishment and triennial
    treatment sites had fire excluded between plantation establishment and 2009, when
    the first experimental burns of the Tiwi Carbon Study were conducted (Figure 2).
    After 2009, fire intensities at the annual and triennial fire treatments were
    determined from scorch heights at each site using equations from Williams et al.
    (2003, p. 40). Fire intensities averaged 489 [± standard error (se) 96] kw m-1
    at the annual treatment sites and 2020 (± se 556) kw m-1 at triennial treatment
    sites. Burn coverage (patchiness) averaged 73% (± se 5) in the annual fire treatment
    and 84 (± se 6)% in the triennial fire treatment (Appendix S1). ^p The primary
    author (M.E. Freeman) recorded informal observations of flowering and fruiting
    for the 11 most common tree species encountered in our census in a separate growth
    study of 1,250 healthy resprout and sapling-sized trees (<5 cm diameter) at the
    same fire experiment sites as this study (unburnt and annual fire treatment sites
    only, Freeman, 2017; Table 1). ^p Informal observations of flowering and fruiting
    from 1,250 resprout and sapling sized trees (< 5 cm diameter at 50 cm above ground)
    measured in a growth study of 11 common species at the same annual (A) and unburnt
    (U) fire experiment sites as censused in this study (Freeman 2017). ^p Fecundity
    observations were recorded as presence or absence of reproductive material between
    November 2014 and May 2016. A “–” indicates that no fruits or flowers were observed
    on these species over the observation period. N is the total number of individuals
    surveyed. [...]
  original_file: raw/trait_data.csv (extracted from the source PDF and supplementary
    material)
  notes: Two candidate traits are in data.csv but not mapped. reproduction_in_resprouts_and_saplings
    records, for each of the 11 species and the annual and unburnt treatments, whether
    any flowers or fruits were seen on the tagged resprouts and saplings (<5 cm diameter)
    over the observation period (eucalypts and Erythrophleum chlorostachys never;
    six other species did). plant_height_at_reproduction records the height of each
    individual resprout or sapling seen with flowers or fruits (49 individuals; Table
    1), as low as 0.05 m. The paper's main data, tree densities by size class, fire
    treatment and eco-taxonomic group (Figures 3-8), are community-level and not species
    traits. The authors also state that eucalypts purportedly do not become sexually
    mature until ~7-10 cm diameter (N. Cuff and P. McCullough pers. comm.); this genus-level
    statement is not mapped. flowering_time and fruiting_time rows (months with flowers
    or fruits seen in Table 1) are kept in data.csv but filtered out in custom_R_code,
    because only three census months (November, August and May) were surveyed. fire_time_from_fire_to_flowering
    is recorded only for the three species named in Figure 9.
identifiers: .na
locations:
  Tiwi Carbon Study fire experiment, western Melville Island:
    latitude (deg): -11.70
    longitude (deg): 130.88
    description: eucalypt open forest (mesic savanna)
    vegetation: Eucalypt open forest co-dominated by Eucalyptus tetrodonta, Eucalyptus
      miniata and Corymbia nesophila, with a C4 grass understorey and multi-stemmed woody
      resprouts, in natural vegetation between Acacia mangium plantation blocks.
    precipitation, MAP (mm): 1194-1544
    fire history: annual early dry season burning, burning every three years in the
      early dry season, or fire exclusion since plantation establishment in 2005/06;
      formal fire experiment from 2009; frequently burnt before 2005/06
    locality: Imalu, Shark Bay, Taracumbi and Pikertaramoor, western Melville Island,
      Tiwi Islands
    georeference remarks: Coordinates are the Tiwi Carbon Study location given in
      Freeman (2017, PhD thesis, Chapter 3 Appendix S1); the four sites (Imalu, MAP
      1194 mm; Pikertaramoor, 1252 mm; Shark Bay, 1369 mm; Taracumbi, 1544 mm) are
      shown only on a map (Figure 1)
    state: NT
contexts:
- context_property: fire treatment
  category: treatment_context
  var_in: fire_treatment
  values:
  - value: annual
    description: burnt annually in the early dry season
  - value: unburnt
    description: fire excluded
traits:
- var_in: fire_time_from_fire_to_flowering
  unit_in: mo
  trait_name: fire_time_from_fire_to_flowering
  entity_type: metapopulation
  value_type: maximum
  basis_of_value: measurement
  replicates: unknown
  methods: She observed that several pantropicals flower and fruit within the flame
    zone as low as 5 cm in height and within 1 year of resprouting after fire-induced
    topkill (Table 1, Figure 9). ^p Species in the pantropical eco-taxonomic group
    that are capable of fruiting and flowering at very small height within the flame
    zone and within 1 year of burning. ^p Records the time from post-fire resprouting
    to flowering in the annually burnt treatment.
- var_in: fire_time_from_fire_to_fruiting
  unit_in: mo
  trait_name: fire_time_from_fire_to_fruiting
  entity_type: metapopulation
  value_type: maximum
  basis_of_value: measurement
  replicates: unknown
  methods: She observed that several pantropicals flower and fruit within the flame
    zone as low as 5 cm in height and within 1 year of resprouting after fire-induced
    topkill (Table 1, Figure 9). ^p Species in the pantropical eco-taxonomic group
    that are capable of fruiting and flowering at very small height within the flame
    zone and within 1 year of burning. ^p Records the time from post-fire resprouting
    to fruiting in the annually burnt treatment, for the species with fruits recorded
    in that treatment.
- var_in: vegetative_reproduction_ability
  unit_in: .na
  trait_name: vegetative_reproduction_ability
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Two of the dominant eucalypts in this study, E. miniata and C. nesophila,
    do not reproduce clonally and therefore risk population extinction if they do
    not escape the fire trap and reproduce sexually. ^p E. tetrodonta can produce
    rhizomes, however such a strategy without input of new genetic material via seedlings
    similarly poses a risk to population viability in the long-term.
- var_in: clonal_spread_mechanism
  unit_in: .na
  trait_name: clonal_spread_mechanism
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Two of the dominant eucalypts in this study, E. miniata and C. nesophila,
    do not reproduce clonally and therefore risk population extinction if they do
    not escape the fire trap and reproduce sexually. ^p E. tetrodonta can produce
    rhizomes, however such a strategy without input of new genetic material via seedlings
    similarly poses a risk to population viability in the long-term.
substitutions:
- trait_name: vegetative_reproduction_ability
  find: do_not_reproduce_clonally
  replace: not_vegetative
- trait_name: vegetative_reproduction_ability
  find: rhizomes
  replace: vegetative
- trait_name: clonal_spread_mechanism
  find: do_not_reproduce_clonally
  replace: non_clonal
- trait_name: clonal_spread_mechanism
  find: rhizomes
  replace: rhizome
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: Table 1 pools the flowering and fruiting observations across the six
    sites of each fire treatment, and the sites are shown only on a map (Figure 1).
    Could you provide coordinates for the annual and unburnt treatment sites, and the
    site of each tree observed flowering or fruiting?
