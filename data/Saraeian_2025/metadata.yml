dataset:
  data_is_long_format: no
  custom_R_code: ' data %>% mutate( AMT_distribution = paste0(AMT_mean, " (SD ", AMT_SD,
    "; range ", AMT_min, "-", AMT_max, ")"), AP_distribution = paste0(AP_mean, " (SD
    ", AP_SD, "; range ", AP_min, "-", AP_max, ")") ) '
  collection_date: 2017/2018
  taxon_name: taxon_name
  location_name: .na
  description: To understand for germination is influenced by climate (e.g. temperature,
    precipitation and seasonality) and seed reserves, we explored the relationships
    among seed mass, germination attributes (germination percentage, lag, and rate)
    and the climate experienced by a range of Australian annual species.
  basis_of_record: lab
  life_stage: adult
  sampling_strategy: Seed mass and viability ^p Seeds of 58 Australian annual species
    from eight families (Supplementary Table S1) that occur across Australia in a
    wide range of habitats and climates (Supplementary Fig. S1) were sourced commercially
    from 'Nindethana' (www.nindethana.net.au) and 'Australian Seed' (www.australianseed.com)
    seed companies in 2017-2018. The classification of these species as annuals was
    collated from Western Australian Herbarium (1998) - FloraBase, the Western Australian
    Flora, Department of Biodiversity, Conservation and Attractions (florabase.dbca.wa.gov.au),
    National Herbarium of NSW - PlantNET, The Plant Information Network System of
    The Royal Botanic Gardens and Domain Trust, Sydney, Australia (ver. 2.0) (plantnet.rbgsyd.nsw.gov.au),
    and Royal Botanic Gardens Victoria - VicFlora, Flora of Victoria (vicflora.rbg.vic.gov.au).
    Although, a small number of these species can behave as biennials or perennials
    in part of their range (Table S1). The vast range of distribution across different
    habitats of these species, and their short, unpredictable lifecycles, made it
    impractical to collect the seeds directly for our study. Seeds were stored in
    a refrigerator at 6°C prior to viability and germination testing.
  original_file: Data transcribed from Supplementary Tables S1, S2, S3 and S4
  notes: There are 38 species that did not germinate in any of the treatments. They
    have been excluded from the germination % and germination_time. Germination lag
    (Table S3) and germination rate (T50, Table S4) are both mapped to seed_germination_time,
    distinguished by a method_context (seed germination time methods). Treatments
    with no germination, or with less than 10% germination for T50 ("No G.", "little
    G."), are left blank.
identifiers: .na
locations: .na
contexts:
- context_property: germination treatment
  category: treatment_context
  var_in: treatment_context
  values:
  - value: untreated 20/10 C
    description: 'Control 20/10°C: untreated seeds with alternating temperature regime
      of 20/10°C.'
  - value: untreated 25/15 C
    description: 'Control 25/15°C: untreated seeds with alternating temperature regime
      of 25/15°C.'
  - value: gibberellic acid 20/10 C
    description: 'Gibberellic acid 20/10°C: seeds pre-soaked overnight in a 250 mg/L
      GA3 solution, before moving to agar plates, then incubated at 20/10°C.'
  - value: gibberellic acid 25/15 C
    description: 'Gibberellic acid 25/15°C: seeds pre-soaked in 250 mg/L GA3 solution
      incubated at 25/15°C.'
  - value: karrikinolide 20/10 C
    description: 'Karrikinolide 20/10°C: seeds pre-soaked for 24 h in a 0.67 uM concentration
      of KAR1, before moving to agar plates, then incubated at 20/10°C.'
- context_property: annual mean temperature across species distribution, mean (SD;
    range) (C)
  category: entity_context
  var_in: AMT_distribution
- context_property: annual precipitation across species distribution, mean (SD; range)
    (mm)
  category: entity_context
  var_in: AP_distribution
- context_property: seed germination time methods
  category: method_context
  var_in: method_context
  values:
  - value: time to first germination (lag)
    description: Germination lag (lag time), days to first germination from the beginning
      of the experiment.
  - value: time to 50% germination (T50)
    description: Germination rate (T50), days taken from the commencement of the experiment
      to germination of 50% of all germinated seeds (Coolbear et al. 1984).
traits:
- var_in: seed_mass_mg
  unit_in: mg
  trait_name: seed_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 1-4
  methods: Seed mass was defined as the oven-dry weight of seeds after removing all
    its accessories (e.g. wings, pappus, comas) (Pérez-Harguindeguy et al. 2013).
    For seed mass, four replicates, each with 50 seeds, or one replicate of 100 seeds
    (depending on seed size or availability) for each species was oven-dried at 80°C
    for 72 h and weighed to obtain one-seed weight (mg) (Pérez-Harguindeguy et al.
    2013).
- var_in: viability_percentage
  unit_in: '%'
  trait_name: seed_viability
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 3
  methods: Seed viability (the proportion of germinable seeds) was determined using
    a cut test (Commander et al. 2009) on three replicates of 20 seeds per species
    (Table S1). The presence or absence of endosperm was evaluated by sectioning seeds
    under a dissecting microscope. Filled seeds (seeds containing fully developed
    embryos/endosperm) were considered viable, whereas empty seeds or seeds with shrivelled
    endosperm were considered non-viable.
- var_in: germ_pct_untreated_20_10
  unit_in: '%'
  trait_name: seed_germination
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 4
  methods: To quantify germination of each species, four replicates of 25 randomly
    selected seeds (unsterilised) were placed on the surface of 1% agar in a 9 cm
    petri dish and incubated in a growth chamber (providing cool white, fluorescent
    light). Petri dishes were sealed with parafilm to prevent evaporation. Germination
    was scored every day for 31 days as per Dwyer and Erickson (2016) and defined
    as the emergence of the radicle from the seed coat. Germination attributes determined
    in this experiment were as follows, 1. Germination percentage (GP), which was
    calculated as follows, GP = Number of germinated seeds / (Number of seeds per
    treatment × Percentage viability) × 100. ^p To alleviate any potential dormancy
    and trigger germination, and achieve the highest germination possible for each
    species, germination tests were conducted using five different combinations of
    incubation temperature and germination stimulants. For all tests, the light conditions
    in the chambers were maintained at a 12/12 h light/dark photoperiod. Temperature
    regimes for the germination treatments were informed by prior research on Australian
    species (Jurado and Westoby 1992; Plummer and Bell 1995; Morgan 1998; Bell 1999;
    Facelli et al. 2005; Aleman et al. 2015). Two germination stimulants, gibberellic
    acid (GA3) and karrikinolide (KAR1; 3-methyl-2H-furo [2,3-c] pyran-2-one; a smoke
    derived compound) were used to break the dormancy and/or promote germination as
    these have been shown to be commonly used for these purposes in Australian species
    (Hoyle et al. 2008; Commander et al. 2009; Probert et al. 2009; Aleman et al.
    2015).
  treatment_context: untreated 20/10 C
- var_in: germ_pct_untreated_25_15
  unit_in: '%'
  trait_name: seed_germination
  entity_type: population
