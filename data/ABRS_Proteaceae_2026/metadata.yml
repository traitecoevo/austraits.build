          "inflorescence_diameter", "inflorescence_length", "inflorescence_shape", "inflorescence_type",
          "leaf_apex_shape", "leaf_arrangement", "leaf_base_shape", "leaf_compoundness",
          "leaf_glaucousness", "leaf_hairs_adult_leaves", "leaf_hairs_juvenile_leaves", "leaf_lamina_division",
          "leaf_lamina_posture", "leaf_length", "leaf_length_to_width_ratio", "leaf_length_type",
          "leaf_lobation", "leaf_margin", "leaf_margin_posture", "leaf_phenology",
          "leaf_phyllotaxis", "leaf_shape", "leaf_surface_colour", "leaf_surface_reflectivity",
          "leaf_type", "leaf_width", "leaflet_count", "leaflet_length",
          "leaflet_width", "life_history", "mycorrhizal_association_type", "parasitic",
          "pedicel_length", "peduncle_length", "petiole_length", "plant_canopy_form",
          "plant_climbing_mechanism", "plant_diameter_breast_height", "plant_growth_form", "plant_growth_substrate",
          "plant_height", "plant_height_reproductive", "plant_photosynthetic_organ", "plant_physical_defence_structures",
          "plant_width", "pollination_syndrome", "post_fire_flowering", "post_fire_recruitment",
          "resprouting_capacity", "resprouting_capacity_non_fire_disturbance", "seed_colour", "seed_height",
          "seed_length", "seed_shape", "seed_surface_texture", "seed_width",
          "seedbank_location", "seeds_per_fruit", "serotiny", "sex_type",
          "stem_base_form", "stem_branching_form", "stem_constitution", "stem_count",
