          "leaf_adaxial_colour",
          "anther_colour", "inflorescence_colour", "juvenile_leaf_colour", "leaf_abaxial_colour", "ovary_colour", "style_colour",
          "bracteole_width", "flower_bract_width", "involucral_bract_width", "ovary_width", "tepal_width",
          "juvenile_leaf_length",
          "tepal_length", "bracteole_length", "pistil_length", "ovary_length", "involucre_length", "involucral_bract_length",
