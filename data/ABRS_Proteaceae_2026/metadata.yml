- context_property: population region
  category: entity_context
  var_in: population_region
- context_property: plant organ measured
  category: entity_context
  var_in: plant_organ_measured
  values:
  - value: involucral bract
    description: Measurement of an involucral bract, a bract of the involucre surrounding an inflorescence.
  - value: leaf abaxial surface
    description: Measurement of the lower (abaxial) surface of the leaf lamina.
  - value: leaf adaxial surface
    description: Measurement of the upper (adaxial) surface of the leaf lamina.
  - value: branchlet
    description: Measurement of the branchlets (the youngest woody or leafy stems).
- context_property: phenological stage
  category: entity_context
  var_in: phenological_stage
- context_property: trait scoring method
  category: method_context
  var_in: trait_scoring_method
- context_property: scoring certainty
  category: method_context
  var_in: scoring_certainty
