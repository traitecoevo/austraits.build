dataset:
  data_is_long_format: yes
  custom_R_code: ' data |> dplyr::mutate( trait_value = dplyr::case_when( trait %in%
    c("flower_visitor", "pollination_vector_possible") ~ trait_value_clean, is.na(trait_value)
    ~ trait_value_clean, TRUE ~ trait_value ) ) '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: To determine the factors contributing to viable-seed production in
    the endangered Zieria granulata, by examining its floral biology, identifying
    its floral visitors and potential pollinators, and confirming its breeding system
    with hand-pollination experiments.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: This study was conducted between August and December 2020, at
    six locations, Jerrara Dam Reserve (34°40′19″S, 150°48′22″E) (hereafter Jerrara),
    Spring Creek Wetland Kiama (34°39′41″S, 150°50′48″E) (hereafter Kiama), Spring
    Creek Wetland South Kiama (34°39′48″S, 150°50′40″E) (hereafter South Kiama), Killalea
    Reserve Shellharbour (34°35′28″S, 150°51′40″E) (hereafter Shellharbour), Austinmer
    (34°18′20″S, 150°55′34″E), and Wollongong Botanic Gardens (34°24′34″S, 150°52′30″E)
    (hereafter Wollongong) (Fig. 1). Study sites located at Jerrara, Kiama, South
    Kiama and Shellharbour contain natural populations located in remnant and regrowth
    rainforest, study sites at Austinmer and Wollongong contain two and five individuals
    respectively, planted in a garden bed. ^p The methods for investigating the floral
    biology, floral visitors and pollinators, and breeding system followed those described
    in Lopresti et al. (2023). ^p Floral visitors were defined as species contacting
    any part of the flower and visitation was assessed through a combination of human
    observations (diurnal and nocturnal), digital video recordings, time-lapse photography,
    and nocturnal infrared motion-sensor imaging. Sampling was conducted on 3–10 shrubs
    at three to four sites per method (see Supplementary Table S1 for sampling details).
    For all sampling methods, observations of floral visitors were made on days with
    minimal cloud cover, wind speeds not exceeding 20 km h−1 and temperatures ranging
    from 17°C to 32°C. ^p To determine the breeding system of Z. granulata, a series
    of pollination experiments was conducted on two to six shrubs at each site (depending
    on the population size).
  original_file: Data are transcribed from the paper (text, Tables 1 and 3) and its
    Supplementary Material (Tables S1 and S2).
  notes: Values pooled across sites are assigned to the location Illawarra (multiple
    sites); the sites_included column of data.csv lists the sites behind each value.
    Additional traits, flower_anther_dehiscence_time, flower_stigma_receptivity_onset_time,
    flower_dichogamy_interval, flower_pollen_width, pollen_aggregation_type, pollen_outline_equatorial_view,
    pollen_shape, pollen_outline_polar_view, pollen_polarity, pollen_exine_ornamentation,
    pollen_tackiness, pollen_wind_transport, fruit_time_from_pollination_to_fruiting,
    seed_predation_fraction, seed_predator and flower_visitor_presence_fraction.
