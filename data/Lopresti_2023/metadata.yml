questions:
  question1: The Results state that the androecium "was mature and usually dehisced
    within 1 day of floral opening", but also that anthers dehisced, on average, 3
    days after floral opening. Could you clarify which value describes anther dehiscence?
  question2: Table 1 records Apis mellifera at six sites, and the text says it was
    present at all study sites, but Table S1 lists floral-visitor surveys at four
    sites only (Jerrara, Kiama, Shellharbour, Wollongong). Were floral visitors also
    recorded at Austinmer and South Kiama?
  question3: Dichaetomyia species is marked as a potential pollinator in Table 1,
    but its pollen-present entry is No and it has no stigma-contact data. I'm retaining
    it as a potential pollinator, because it is indicated as such in the table, but
    I want to make sure this is appropriate.
  question4: The paper cites a companion study using the same methods (Lopresti et
    al. 2023, Cunninghamia 23, 11-26) on Acronychia oblongifolia and Sarcomelicope
    simplicifolia subsp. simplicifolia. Should we include these data in AusTraits
    as well?
  question5: The paper does not give an ORCID for Todd Minchinton. The ORCID registry
    has a record under his name (0000-0001-6989-9315) with no works or affiliations
    listed. Is this his ORCID?
