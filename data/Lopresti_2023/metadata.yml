contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: entity_context
- context_property: sampling method
  category: method_context
  var_in: detection_method
  values:
  - find: direct
    value: direct observation
    description: floral visitor observed, and in some cases captured, by observers
      watching 25 x 25 cm sections of canopy
  - find: dvr
    value: digital video recording
    description: floral visitor recorded by an action camera filming a 15 x 30 cm
      area of canopy, or by time-lapse photography
  - find: both
    value: direct observation and digital video recording
    description: floral visitor detected both by observers and on video or time-lapse
      recordings
- context_property: floral visitor individuals captured (count)
  category: entity_context
  var_in: number_captured
- context_property: floral visitor individuals recorded on video (count)
  category: entity_context
  var_in: number_detected_by_dvr
- context_property: survey sites where floral visitor recorded (count)
  category: entity_context
  var_in: number_of_sites_observed
- context_property: pollination treatment
  category: treatment_context
  var_in: pollination_treatment
  values:
  - find: autonomous selfing and manipulative selfing
    value: selfing
    description: inflorescences bagged before flowers opened, either left unmanipulated
      (autonomous selfing) or hand-pollinated with pollen from the same shrub (manipulative
      selfing)
  - find: manipulative outcross and open control
    value: outcross and open control
    description: inflorescences bagged and hand-pollinated with pollen from a different
      shrub (manipulative outcross), or left unbagged and open to pollinators (open
      control)
  - value: manipulative outcross
    description: inflorescences bagged before flowers opened and hand-pollinated with
      pollen from a different shrub
  - value: open control
    description: inflorescences left unbagged and open to pollinators
  - find: no treatment (fruit collected opportunistically)
    value: no treatment
    description: fruit collected opportunistically from untreated inflorescences
  - value: all treatments
    description: pooled across outcross, open control and untreated inflorescences
  - value: bagged fruiting branches
    description: fruiting branches bagged to exclude seed predators
- context_property: entity measured
  category: method_context
  var_in: flower_part
  values:
  - find: whole flower (anthesis)
    value: flower
    description: duration of anthesis, from floral opening to abscission or fertilisation
  - find: stigma (receptive period)
    value: stigma
    description: duration the stigma remained receptive
  - find: anthers (pollen presentation)
    value: anther
    description: duration pollen remained available on dehisced anthers
traits:
- var_in: flower_dichogamy
  unit_in: .na
  trait_name: flower_dichogamy
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To examine the floral phenology of Z. granulata, 10 flowers from two shrubs
    at both Wollongong and Austinmer were observed daily from floral opening to abscission
    or fertilisation (following Kearns and Inouye 1993). For both androecium and gynoecium
    development, reproductive structures were defined as immature, mature or senesced
    for each flower. The androecium was considered mature when anther heads began
    dehiscing and pollen grains were visible (when viewed through a hand-lens). Gynoecium
    maturity was based on the size and colour of the stigma. The first day that the
    androecium and gynoecium matured, duration of maturity, and the total anthesis
    period were recorded.
- var_in: flower_lifespan
  unit_in: d
  trait_name: flower_lifespan
  entity_type: metapopulation
  value_type: value_type
  basis_of_value: measurement
  replicates: unknown
  methods: To examine the floral phenology of Z. granulata, 10 flowers from two shrubs
    at both Wollongong and Austinmer were observed daily from floral opening to abscission
    or fertilisation (following Kearns and Inouye 1993). For both androecium and gynoecium
    development, reproductive structures were defined as immature, mature or senesced
    for each flower. The androecium was considered mature when anther heads began
    dehiscing and pollen grains were visible (when viewed through a hand-lens). Gynoecium
    maturity was based on the size and colour of the stigma. The first day that the
    androecium and gynoecium matured, duration of maturity, and the total anthesis
    period were recorded. ^p Values are the duration of anthesis for the whole flower,
    and the durations of stigma receptivity and pollen availability, distinguished
    by the entity measured context.
- var_in: flower_pollen_apertures_count
  unit_in: '{count}'
  trait_name: flower_pollen_apertures_count
  entity_type: population
  value_type: mode
  basis_of_value: measurement
  replicates: 3
  methods: To gain insight into potential vectors of pollination and the breeding
    system, pollen morphology and exine characteristics were observed and described
    as outlined by Halbritter et al. (2018). Key morphological characteristics described
    included pollen shape, from both equatorial (E) and polar (P) views, pollen shape
    in relation to the P:E ratio (length of the polar axis between the two poles compared
    with the equatorial diameter), pollen unit (the dispersal unit of mature pollen
    grains), and ornamentation of the aperture and exine regions. Stamens from three
    flowers located at Wollongong were examined under a scanning electron microscope
    (JEOL JSM-6490LA, Japan) on the day of collection.
- var_in: flower_pollen_aperture_shape
  unit_in: .na
  trait_name: flower_pollen_aperture_shape
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To gain insight into potential vectors of pollination and the breeding
    system, pollen morphology and exine characteristics were observed and described
    as outlined by Halbritter et al. (2018). Key morphological characteristics described
    included pollen shape, from both equatorial (E) and polar (P) views, pollen shape
    in relation to the P:E ratio (length of the polar axis between the two poles compared
    with the equatorial diameter), pollen unit (the dispersal unit of mature pollen
    grains), and ornamentation of the aperture and exine regions. Stamens from three
    flowers located at Wollongong were examined under a scanning electron microscope
    (JEOL JSM-6490LA, Japan) on the day of collection. ^p Both colporate and colpate
    apertures occur on the pollen grains.
- var_in: flower_nectar_production
  unit_in: .na
  trait_name: flower_nectar_production
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Nectar abundance was measured to determine whether flowers provided a reward
    to potential pollinators. Inflorescences that housed at least five buds near to
    opening were selected haphazardly and enclosed within bags made of polyorganza
    fabric (10 cm wide × 5 cm long) to prevent biotic visitors extracting nectar prior
    to the flowers opening. Nectar was then extracted from five flowers with a mature
    androecium and five flowers with a mature gynoecium, at Jerrara, Kiama, South
    Kiama and Shellharbour. Nectar was extracted into a 1 µL microcapillary tube (following
    Morrant et al. 2009), and the volume withdrawn was determined by calculating the
    proportion of the column that was filled.
- var_in: flower_nectar_volume
  unit_in: uL
  trait_name: flower_nectar_volume
  entity_type: metapopulation
  value_type: maximum
  basis_of_value: measurement
  replicates: 40
  methods: Inflorescences that housed at least five buds near to opening were selected
    haphazardly and enclosed within bags made of polyorganza fabric (10 cm wide ×
    5 cm long) to prevent biotic visitors extracting nectar prior to the flowers opening.
    Nectar was then extracted from five flowers with a mature androecium and five
    flowers with a mature gynoecium, at Jerrara, Kiama, South Kiama and Shellharbour.
    Nectar was extracted into a 1 µL microcapillary tube (following Morrant et al.
    2009), and the volume withdrawn was determined by calculating the proportion of
    the column that was filled. [...] Because of the small sample sizes, data were
    pooled across sites. ^p Value is the maximum volume of nectar withdrawn from a
    flower, across male- and female-phase flowers.
- var_in: flower_pollinator_reward
  unit_in: .na
  trait_name: flower_pollinator_reward
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Nectar abundance was measured to determine whether flowers provided a reward
    to potential pollinators. Inflorescences that housed at least five buds near to
    opening were selected haphazardly and enclosed within bags made of polyorganza
    fabric (10 cm wide × 5 cm long) to prevent biotic visitors extracting nectar prior
    to the flowers opening. Nectar was then extracted from five flowers with a mature
    androecium and five flowers with a mature gynoecium, at Jerrara, Kiama, South
    Kiama and Shellharbour. ^p Records the floral reward shown to be offered to visitors.
- var_in: pollination_syndrome
  unit_in: .na
  trait_name: pollination_syndrome
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Components of floral biology, including floral ontogeny and nectar production,
    were quantified to determine the pollination syndrome and the likely breeding
    system. ^p Pollination syndrome assigned by the authors from floral phenology,
    pollen morphology and nectar production.
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Z. granulata flowers were small, white, protandrous and produced highly
    ornamented pollen grains and small quantities of nectar. ^p Flower colour as described
    by the authors for the studied plants.
- var_in: flower_structural_sex_type
  unit_in: .na
  trait_name: flower_structural_sex_type
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: For both androecium and gynoecium development, reproductive structures
    were defined as immature, mature or senesced for each flower. ^p Each observed
    flower bears both an androecium and a gynoecium.
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Zieria granulata (Rutaceae) is a tall, bushy shrub listed as endangered
    under both the Commonwealth Environment Protection and Biodiversity Conservation
    Act 1999 and the New South Wales (NSW) Biodiversity Conservation Act 2016. ^p
    Growth form from the species description in the Introduction.
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: To determine the breeding system of Z. granulata, a series of pollination
    experiments was conducted on two to six shrubs at each site (depending on the
    population size). Inflorescences on each shrub housing a minimum of five flower
    buds near the opening were haphazardly selected and subjected to one of the following
    five randomly selected treatments, (1) manipulative outcross, (2) autonomous selfing,
    (3) manipulative selfing, (4) open control (no bag), or (5) procedural control
    (partial bag). [...] Manipulative outcrossing involved bagging an inflorescence
    prior to flowers opening, and then hand-pollinating each flower with pollen sourced
    from a different shrub within 1 h of collecting the pollen. [...] The autonomous
    selfing treatment involved bagging an inflorescence without manipulating the pollen.
    Control inflorescences were not bagged and were thus open to pollinators. ^p Breeding
    system as concluded by the authors from fruit and viable-seed production across
    treatments.
- var_in: fruit_set_proportion
  unit_in: '%'
  trait_name: fruit_set_proportion
  entity_type: metapopulation
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: All inflorescences were monitored for reproductive success from the time
    of pollination to fruit maturation. Fruit development was defined as the swelling
    of the ovary after abscission of petals and stamens. Fruit was classed as mature
    when swelling had ceased and a colour change was observed in the exocarp. At this
    point, fruits were harvested and examined for viable seed. ^p Value is the proportion
    of self-pollinated flowers that produced mature fruit, pooled across sites, shrubs
    and inflorescences.
- var_in: fruit_initiation_proportion
  unit_in: '%'
  trait_name: fruit_initiation_proportion
  entity_type: metapopulation
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: All inflorescences were monitored for reproductive success from the time
    of pollination to fruit maturation. Fruit development was defined as the swelling
    of the ovary after abscission of petals and stamens. [...] Reproductive success
    was defined as (1) the percentage of flowers that produced fruit, and (2) the
    percentage of flowers that produced viable seed. [...] For this analysis, data
    were combined from all sites, shrubs and inflorescences, and the design was unbalanced.
    ^p Minimum and maximum values span the two treatments in each treatment group.
- var_in: seed_set_proportion
  unit_in: '%'
  trait_name: seed_set_proportion
  entity_type: entity_type
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Mature fruits and seeds from each site were dissected and examined under
    a microscope (×40 magnification) to determine (a) the number of seeds per fruit,
    and (b) the proportion of filled seeds. A 'filled' seed was defined as one which
    contained an embryo and surrounding endosperm filling the entire space enclosed
    by the seed coat, whereas an 'empty' seed lacked both embryo and endosperm. The
    total number of seeds in each seed class was presented as a percentage of the
    seed count for each treatment. ^p Values are the proportion of seeds in matured
    fruit that were filled, each coccus bearing a single seed.
- var_in: seeds_per_fruit
  unit_in: '{count}/{count}'
  trait_name: seeds_per_fruit
  entity_type: metapopulation
  value_type: maximum
  basis_of_value: measurement
  replicates: unknown
  methods: Z. granulata fruits each contained up to four cocci, i.e. individual segments
    of the fruit that each contain a single seed (sometimes called a mericarp; PlantNET
    2022). Fruit matured within 3 months of pollination and was collected in December
    2020. Mature fruits and seeds from each site were dissected and examined under
    a microscope (×40 magnification) to determine (a) the number of seeds per fruit,
    and (b) the proportion of filled seeds.
- var_in: fruit_type
  unit_in: .na
  trait_name: fruit_type
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Z. granulata fruits each contained up to four cocci, i.e. individual segments
    of the fruit that each contain a single seed (sometimes called a mericarp; PlantNET
    2022). ^p Fruit type as described by the authors.
- var_in: fruit_dehiscence
  unit_in: .na
  trait_name: fruit_dehiscence
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Mature fruits and seeds from each site were dissected and examined under
    a microscope (×40 magnification). ^p Records the authors' observation that the
    fruit remained open on the plant once seed had dispersed.
- var_in: fruiting_time
  unit_in: .na
  trait_name: fruiting_time
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Fruit matured within 3 months of pollination and was collected in December
    2020. ^p Records the month in which mature fruit was collected.
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Floral visitors were defined as species contacting any part of the flower
    and visitation was assessed through a combination of human observations (diurnal
    and nocturnal), digital video recordings, time-lapse photography, and nocturnal
    infrared motion-sensor imaging. [...] Floral visitors were opportunistically caught
    in specimen jars, then euthanised on ice for subsequent identification and pollen-presence
    identification. Euthanised insect specimens were identified under a dissecting
    microscope at ×40 magnification. ^p Each record is one floral visitor taxon in
    Table 1 that the authors did not classify as a potential pollinator.
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: metapopulation
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: A floral visitor was defined as a potential pollinator if it carried the
    pollen of the target species anywhere on its body, determined through inspection
    under a dissecting microscope (Kearns and Inouye 1993), or made contact with the
    stigmatic surface of at least one flower of the target species (Dafni 1992). To
    examine whether a visitor detected by DVR acted as a potential pollinator, any
    contact with the stigmatic surface was recorded for all visiting species. During
    in-person observations, floral visitors were captured using a jar and then placed
    in a cool box filled with ice and transferred to the freezer. The presence of
    pollen on captured individuals was detected using a dissecting microscope at ×40
    magnification. Individuals carrying pollen were then examined under a scanning
    electron microscope (SEM) (JEOL JSM-6490LA, Japan) to determine whether the pollen
    carried matched specimens previously collected from Z. granulata. ^p Each record
    is one floral visitor taxon marked as a potential pollinator in Table 1.
