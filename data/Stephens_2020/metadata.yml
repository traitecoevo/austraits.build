contexts:
- context_property: observer
  category: method_context
  var_in: Observer
- context_property: plant height (m)
  category: treatment_context
  var_in: Height_m
traits:
- var_in: Habit
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Plant habit [ground creepers are not necessarily climbers; do not take inflorescence woodiness into account]
- var_in: Inflor_cm
  unit_in: cm
  trait_name: inflorescence_length
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Inflorescence size (cm) [length of longest axis, regardless of inflorescence type and presentation; bracts included]
- var_in: No_flowers_perinflor
  unit_in: '{count}'
  trait_name: flowers_per_inflorescence
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Number of anthetic flowers per inflorescence
- var_in: No_inflor
  unit_in: '{count}'
  trait_name: .na
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Number of inflorescences per plant; not currently mapped into AusTraits, because this is an allometric trait, depending on the size of the individual plant.
- var_in: Florlength_cm
  unit_in: cm
  trait_name: flower_length
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Floral length (cm) [at anthesis; excluding pedicel; from base of gynoecium to tip of flower, all organs included]
- var_in: Flordiam_cm
  unit_in: cm
  trait_name: flower_diameter
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Floral diameter (cm) [at anthesis; i.e., maximum width; all organs included]
- var_in: Colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Floral dominant display colour [at anthesis; bracts excluded, all other organs included]
- var_in: Symmetry
  unit_in: .na
  trait_name: flower_perianth_symmetry
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Floral symmetry
- var_in: Tube
  unit_in: '{dimensionless}'
  trait_name: flower_perianth_fusion
  entity_type: species
  value_type: mean
  basis_of_value: measurement
  replicates: 1
  methods: Floral tube [formed by fusion or close positioning of perianth parts; anthers and stigmas may be included or exserted]
substitutions:
- trait_name: flower_colour
  find: orange
  replace: yellow_orange
- trait_name: flower_colour
  find: purple
  replace: blue_purple
- trait_name: flower_colour
  find: red
  replace: red_brown
- trait_name: flower_colour
  find: white
  replace: white_cream
- trait_name: flower_colour
  find: yellow
  replace: yellow_orange
- trait_name: flower_perianth_symmetry
  find: actinomorphic
  replace: actinomorphic_general
- trait_name: inflorescence_length
  find: 1-12
  replace: '12'
taxonomic_updates: .na
exclude_observations: .na
questions: .na
