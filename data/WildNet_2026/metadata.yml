    bibtype: Online
    author: '{Queensland Government}'
    year: '2026'
    title: WildNet species profiles
    publisher: Queensland Government, Brisbane
    url: https://wildnet.science-data.qld.gov.au/species-search?kingdom_name=Plantae
    note: accessed 1 October 2026
contributors:
  data_collectors:
  - last_name: Wenk
