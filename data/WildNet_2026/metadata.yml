  basis_of_value: expert_score
  replicates: .na
  methods: 'Scored from the "is a ..." growth-form phrase of the species profile (verbatim in
    plant_growth_form_description); several forms are listed in the order they appear in the text, and a tufted grass, sedge
    or grass-like plant is scored tussock.'
