    notes: Extracted the trait data from the WildNet species profiles
  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: '2026'
  taxon_name: taxon_name
  description: 'To compile plant trait values from the species profiles in WildNet, the Queensland Government database of
    Queensland plants and animals; the profiles cover mostly threatened and near-threatened Queensland plant taxa.'
  basis_of_record: literature
  life_stage: adult
  sampling_strategy: 'All plant taxa in WildNet (wildnet.science-data.qld.gov.au) were downloaded through its public API on
    1 October 2026, and the 302 taxa with species profile text were kept. Trait values were extracted from the Description,
    Reproduction, Habitat and other profile sections with a scripted parser (raw/build_data_csv.R). Sentences comparing the
    taxon with another species were dropped, so that characters of other taxa are not attributed to it. Categorical terms
    are mapped to AusTraits trait values, with the source sentence or phrase kept verbatim in a matching *_description
    column; several values are listed in the order they appear in the text. Growth forms qualified by a commonness word
    ("tree or rarely a shrub") are recorded on separate rows with a commonness qualifier. Measurements record the typical
    range given in the text as minimum and maximum values, converted to a single unit per column (plant heights in m, all
    other lengths and diameters in mm, lifespan and age at reproductive maturity in years, flower lifespan in days);
    parenthetical extremes are not recorded. Ecological traits (pollination, dispersal, fire response, seed bank,
    germination, vegetative reproduction, lifespan) were scored by reading each relevant statement; hedged statements were
    left unscored. The values were checked against the source text, and source typographical errors were corrected in the
    script.'
  original_file: wildnet_plant_profiles_with_text.csv (WildNet species profiles, downloaded 1 October 2026)
  notes: 'Unmapped columns: the verbatim *_description columns, flower_colour_sentence, WildNet identifiers and links
    (wildnet_taxon_id, wildnet_url), common_name, family, wildnet_name_superseded (TRUE where WildNet lists the name as
    superseded), conservation status (nca_status, epbc_status), and the habitat, distribution, soil and elevation columns.
    Taxa with storage organs measured have a second row with entity_measured naming the organ. No growth form in these
    profiles is qualified by a commonness word, so the commonness_qualifier column is empty and is not mapped; map it as an
    entity_context (context_property: commonness qualifier) if a re-extraction fills it.'
identifiers: .na
locations: .na
contexts:
- context_property: entity measured
  category: method_context
  var_in: entity_measured
