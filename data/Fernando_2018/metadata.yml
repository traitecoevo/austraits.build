  custom_R_code: '
    data |>
      dplyr::filter(trait %in% c("leaf_P_per_dry_mass", "leaf_K_per_dry_mass", "leaf_S_per_dry_mass",
      "leaf_Ca_per_dry_mass", "leaf_Mg_per_dry_mass", "leaf_Mn_per_dry_mass", "leaf_Si_per_dry_mass",
