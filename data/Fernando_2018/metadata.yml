  collection_date: 2017
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value_clean
  location_name: location_name
  description: To test whether high leaf Mn in two sympatric Gossia species is related
    to insect galling and leaf surface damage, directly or through other leaf chemical
    and physical traits.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Gossia grayi (N.Snow & Guymer) and Gossia shepherdii (F. Muell.)
    trees targeted for this study were adjacent to a 25 ha permanent forest dynamics
    plot (Bradford et al. 2014) (17°07′S, 145°37′E) in Danbulla National Park, Far North
    Queensland, Australia; part of the World Heritage listed Wet Tropics bioregion.
    Here, G. shepherdii was much shorter (~1 m average height) than G. grayi (~3 m
    average height), with both species within the low- to mid-storey stratum of this
    small area of dense tropical rainforest (Fig. 1a) situated at an elevation of around
    680-740 m, on an acidic brown dermosol substrate (Miller et al. 2006; Bradford et
    al. 2014). Visual symptoms of insect activity on G. grayi and G. shepherdii foliage
    (Fig. 1b-d) are described in the 'Results'. ^p For both species, 6-10 each of
    recently expanded young leaves (y) and mature older leaves (m) were harvested
    separately for (a) total mineral nutrient analyses, (b) leaf phenolics assays, (c)
    calculating specific leaf weight (SLW) as a proxy for leaf toughness, i.e. leaf
    physical defence (Steinbauer 2001), and (d) high resolution photography for the
    digital quantification of leaf laminal damage in both species. Additionally, (e)
    mature galled leaves were obtained from 10 G. grayi trees to separate laminae from
    galls in order to compare their Mn concentrations using a paired t-test. G. grayi
    (Gg) trees were selected for sampling by visually assessing the overall level of
    (highly obvious) galling so as to capture an 'infestation gradient' (Fig. 1b-d).
    This strategy was deemed necessary given that one of the key aims was to examine the
    interaction between foliar Mn concentrations and gall formation, where foliar Mn
    concentrations were unknown at the time of sample collection. Thirty G. grayi trees
    and 20 G. shepherdii (Gs) trees were sampled. Leaves were initially placed in
    zip-lock plastic bags containing slightly dampened paper towel so as to retain field
    freshness and prevent desiccation, necessary for all measurements except total
    nutrient analyses. Samples were placed immediately in cool boxes at the field site,
    and retained refrigerated until treated in the laboratory a week later. For image
    analysis (d), upper leaf-surfaces were photographed within hours of harvesting by
    laying down all leaves per sample against a white background incorporating sample
    number and a measurement scale. In the laboratory, each leaf was halved for mineral
    nutrient analysis (a) and the other half used for phenolics testing (b) and SLW (c).
    Leaf tissues were pooled per sample and oven-dried for 1 week at 40°C
    for (a), stored at -80°C for (b), and leaf SLW (c) measurements were commenced using
    fresh leaf tissues. ^p Three soil samples from the top 10 cm surface horizon cleared
    of leaf litter were obtained three at collection points across the area where plants
    were sampled.
  original_file: data extracted from the source PDF (Tables 1-2 and text)
  notes: Data for additional traits leaf_gall tissue chemistry, leaf_gall_abundance, leaf_gall_incidence, leaf_gall_occupancy,
    leaf_gall_fresh_lining_percentage, leaf_gall_parasitism, leaf_gall_length,
    leaf_galling_insect (Cecidomyiidae), leaf_herbivory_damage_type and
    leaves_counted_per_tree remain in raw/trait_data.csv. Leaf phenolics, 'SLW' and
    percentage leaf surface damage for each species and leaf age are shown only as model
    estimates in Fig. 2 and were not extracted; only the approximate maximum leaf
    phenolics for G. shepherdii stated in the Discussion is included. 'SLW' was
    calculated as (FW - DW)/FW, i.e. leaf water content per fresh mass, and is not
    included.
