- var_in: leaf_phenol_per_dry_mass
  unit_in: mg/g
  trait_name: leaf_phenol_per_dry_mass
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: replicates
  methods: Phenolics analyses were carried out by finely grinding freeze-dried leaf
    tissue before adding 1.8 mL of a 50% acetone/water solution, followed by continuous
    agitation (three repetitions per second) for 1hr, and centrifugation. The
    supernatant was refrigerated until analysis, when first 400 uL Folin-Ciocalteu
    reagent was added to 20 uL leaf-extract, followed by two successive additions of 700
    mM NaCO3 (800 uL) at 1 min intervals. After 2 h of dark incubation, the absorbance
    readings of solutions were taken at 765 nm (Blainski et al. 2013). Concentrations
    were calculated using a calibration curve that had previously been established for
    gallic acid.
