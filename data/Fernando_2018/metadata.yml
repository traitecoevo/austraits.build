traits:
- var_in: leaf_P_per_dry_mass
  unit_in: mg/kg
  trait_name: leaf_P_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: replicates
  methods: Rinsed and oven-dried leaf tissues (a, e) and gall tissues (e) were finely
    ground, heat digested in concentrated HNO3, and diluted with deionised water. The
    elements phosphorus (P), potassium (K), sulfur (S), calcium (Ca), magnesium (Mg),
    Mn, aluminium (Al) and silicon (Si) were quantified by inductively coupled optical
    emission spectroscopy (ICP OES) against a series of equivalently acidified standard
    solutions.
