contexts:
- context_property: fire severity
  category: plot_context
  var_in: SeverityGroup
  values:
  - find: Unburnt
    value: unburnt
    description: Unburnt forest adjacent to the fire edge.
  - find: Low/Moderate
    value: low to moderate
    description: Burnt at low to moderate severity during the 2019-2020 fires, with
      an unburnt or partially burnt canopy.
  - find: High/Extreme
    value: high to extreme
    description: Burnt at high to extreme severity during the 2019-2020 fires, with
      a completely burnt or consumed canopy.
- context_property: dispersal distance calculation
  category: method_context
  var_in: calculation
traits:
- var_in: plant_height_max
  unit_in: m
  trait_name: plant_height
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: unknown
  methods: Height range of each identified species was determined on the basis of
    the average observed minimum and maximum heights of plants (in metres) at both
    Mount Tomah and Mount Wilson, and organised into groups (0.1–0.5, 0.5–1.5, 0.5–3,
    0.5–10, 10–25). This approach was preferred over extracting maximum heights from
    trait databases to account for differences in height imposed by the recent fire.
    ^p Values mapped as `plant_height` are the upper bound of each species' height-range
    group.
- var_in: SeedSize
  unit_in: mg
  trait_name: seed_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 1-10
  methods: Seed size (mass in milligrams) was determined by weighing 10 seeds of each
    species from seed traps and averaging across them. If species had fewer than 10
    seeds recovered from seed traps, the maximum number of available seeds was weighed.
    Seeds were weighed as retrieved from seed traps to more accurately represent weight
    that influenced dispersal, and generally included woody endocarps but excluded
    fleshy fruit.
- var_in: distance_median
  unit_in: m
  trait_name: seed_dispersal_distance
  entity_type: population
  value_type: minimum
  basis_of_value: measurement
  replicates: seeds_measured
  methods: Minimum dispersal distance was determined over several months coinciding
    with periods when the contents of the seed traps were collected, between March
    2023 and March 2024. Minimum dispersal distance was determined for each species
    in each seed trap by walking concentric circles around seed traps at 0.5 m intervals
    up to 5 m (Fig. S4). The distance of the closest adult individual, fully grown
    and/or reproductively mature, was measured from the trap. For species where an
    adult individual was not found within 5 m, a larger area was investigated by walking
    multiple 20 m long transects 5 m apart parallel to seed trap rows (Fig. S4). If
    species were still not located within 20 m from the seed trap in any direction,
    the general area was searched more coarsely (Fig. S4). If no individual was found
    within 50 m from the seed trap in any direction, the origin of that specific seed
    in that specific seed trap was recorded as unknown. This occurred only for two
    species, Persoonia mollis and Nyssa sp., both of which were found in only two
    traps in low quantities (2 and 5 seeds respectively). ^p The median is the seed-weighted
    median of the per-trap values. Values are summarised for each species at each
    site and fire severity from the per-trap minimum dispersal distances (MinimumDist),
    weighting each trap by the number of seeds of the species it caught. Each per-trap
    value is the distance to the closest adult, so it is a minimum estimate of how
    far those seeds travelled. Traps where no adult was found within 50 m are excluded.
  calculation: seed-weighted median distance from an adult plant to a seed-trap
- var_in: distance_max
  unit_in: m
  trait_name: seed_dispersal_distance
  entity_type: population
  value_type: minimum
  basis_of_value: measurement
  replicates: seeds_measured
  methods: Minimum dispersal distance was determined over several months coinciding
    with periods when the contents of the seed traps were collected, between March
    2023 and March 2024. Minimum dispersal distance was determined for each species
    in each seed trap by walking concentric circles around seed traps at 0.5 m intervals
    up to 5 m (Fig. S4). The distance of the closest adult individual, fully grown
    and/or reproductively mature, was measured from the trap. For species where an
    adult individual was not found within 5 m, a larger area was investigated by walking
    multiple 20 m long transects 5 m apart parallel to seed trap rows (Fig. S4). If
    species were still not located within 20 m from the seed trap in any direction,
    the general area was searched more coarsely (Fig. S4). If no individual was found
    within 50 m from the seed trap in any direction, the origin of that specific seed
    in that specific seed trap was recorded as unknown. This occurred only for two
    species, Persoonia mollis and Nyssa sp., both of which were found in only two
    traps in low quantities (2 and 5 seeds respectively). ^p The maximum is the largest
    per-trap value, so it is the distance at least one seed travelled. Values are
    summarised for each species at each site and fire severity from the per-trap minimum
    dispersal distances (MinimumDist). Each per-trap value is the distance to the
    closest adult, so it is a minimum estimate of how far those seeds travelled. Traps
    where no adult was found within 50 m are excluded.
  calculation: furthest distance from an adult plant to a seed-trap
- var_in: fruiting_time
  unit_in: .na
  trait_name: fruiting_time
  entity_type: population
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Contents of seed traps were collected once a month for 1 year, from January
    2023 to January 2024. All samples were examined, with seeds identified to species
    where possible. ^p Months are those in which seeds of the species fell into the
    seed traps at the site, with each collection assigned to the month in which most
    of its collection interval fell.
