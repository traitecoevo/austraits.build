questions:
  question1: While most species per trap have a single `MinimumDist` value, Polyscias
    sambucifolia in trap WE55_9 at Mount Wilson has two different MinimumDist values
    (1.2 and 6 m) on different collection dates, so it is kept as two records. Is
    it correct that your data file has two different minimum distances for this species
    at this seed trap?
  question2: Seeds were weighed as retrieved from the traps, generally including woody
    endocarps. Confirming seed_dry_mass, not diaspore_dry_mass is the appropriate
    trait name to use.
  question3: I was trying to figure out how to best summarise dispersal distance -
    I calculated the median and maximum distance travelled by a seed. But these are
    still really both types of `minimum distance` since it is relative to the closest
    tree. I have now mapped them as `minima` but added a context that indicated how
    they were calculated.
  question4: For the seed dispersal calculations, is it best to have separate calculations
    by fire severity category or group across the fire severities?
