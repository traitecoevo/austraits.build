dataset:
  data_is_long_format: no
  custom_R_code: ' date_range <- function(x) ifelse(min(x) == max(x), min(x), paste(min(x),
    max(x), sep = "/")); collection_month <- c("11/02/2023" = 1, "2/03/2023" = 2,
    "30/03/2023" = 3, "4/05/2023" = 4, "10/06/2023" = 5, "29/06/2023" = 6, "3/08/2023"
    = 7, "7/09/2023" = 8, "5/10/2023" = 9, "2/11/2023" = 10, "1/12/2023" = 11, "21/12/2023"
    = 12, "1/02/2024" = 1); seeds <- data |> dplyr::filter(!is.na(Species)) |> dplyr::mutate(
    date = util_parse_collection_date(DateCollected), month = collection_month[DateCollected],
    seed_count = as.numeric(Count), distance = suppressWarnings(as.numeric(MinimumDist))
    ); dplyr::bind_rows( seeds |> dplyr::group_by(Species, Site) |> dplyr::summarise(
    date_range = date_range(date), plant_height_max = stringr::str_extract(dplyr::first(HeightRange),
    "[0-9.]+$"), SeedSize = dplyr::first(SeedSize), fruiting_time = paste(ifelse(1:12
    %in% month, "y", "n"), collapse = ""), .groups = "drop" ), seeds |> dplyr::filter(!is.na(distance))
    |> dplyr::group_by(Species, Site, SeverityGroup) |> dplyr::summarise( date_range
    = date_range(date), distance_median = as.character(stats::median(rep(distance,
    seed_count))), distance_max = as.character(max(distance)), seeds_measured = as.character(sum(seed_count)),
    .groups = "drop" ) ) '
  collection_date: date_range
  taxon_name: Species
  location_name: Site
  description: To determine whether seed rain from adjacent unburnt forest can drive
    the recolonisation of wet sclerophyll forest burnt at differing fire severities,
    and which dispersal traits determine how far seeds travel into the burnt area.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: To assess how seed dispersal aids in post-fire recovery of WSF,
    we established seed traps across four sites, including two at Mount Tomah (33.5415°S,
    150.4222°E) and two at Mount Wilson (33.5029°S, 150.3889°E), all located in the
    Blue Mountains of New South Wales, Australia. All sites were Upland Basalt Forests.
    The Upland Basalt Forests community is a tall open mesic forest receiving greater
    than 1000 mm of rainfall a year, which occurs on basalt substrates at an elevation
    of 650–1050 m (Office of Environment and Heritage 2022). Like various other WSF
    communities, this community has a sclerophyllous canopy and a large number of
    rainforest species, including canopy trees such as Ceratopetalum apetalum and
    Doryphora sassafras, vines such as Pandorea pandorana, and various fern species
    (Wardell-Johnson et al. 2017). Both study sites experience similar climates, with
    a mean monthly precipitation of 86 mm, a mean annual minimum and maximum temperature
    of 8°C to 17°C respectively, and the climate is classified as temperate oceanic
    (using the Koppen Climate Classification Cfb) (Bureau of Meteorology 2024). Two
    of the four sites were burnt during the 2019–2020 Australian megafires, spanning
    a gradient of fire severities as explained below. ^p Burnt sites experienced a
    gradient of fire severities close to the fire edge that bordered unburnt WSF,
    with low- to moderate-severity fire occurring closest to the burnt edge (within
    20 m) and high- to extreme-severity occurring further away from the burnt edge
    (50 m). Fire severity does not always correspond to distance from unburnt edge
    and results will be driven both by proximity to fire edge and fire severity (Parkins
    et al. 2018). We used Google Earth Engine Burnt Area Map (GEEBAM) to identify
    fire severity at each site (Department of Planning and Environment 2020; Supplementary
    Fig. S1). GEEBAM uses a time series of high-resolution images to compare pre-fire
    and post-fire vegetation with a normalised burnt ratio (dNBR). The images are
    compared to NSW State Vegetation Type maps and adjusted for differing vegetation
    types (Department of Planning and Environment 2020). We recorded ground measurements,
    such as canopy consumption, across the area where seed traps were placed, as described
    in the following paragraph, to confirm classifications (Fig. S1). Unburnt areas
    were confirmed through on-ground observations by Botanic Gardens staff (pers.
    comm., Stuart Allen, Blue Mountains Botanic Garden Mount Tomah, August 2022).
    Because fire severity can vary substantially across a landscape, we created two
    severity groups based on the burn mosaic at our sites, ensuring sufficient repetition
    within each group. Groups were (1) low to moderate severity, containing an unburnt
    or partially burnt canopy, occurring closest to the burnt–unburnt edge, and (2)
    high to extreme severity, containing a completely burnt or consumed canopy, occurring
    further away from the burnt–unburnt edge (Fig. S1). ^p Seed traps were inverted
    cone-like structures made from shade cloth (knit structure with openings 2–3 mm),
    suspended on poles hammered into the soil. A summary of the number of seed traps
    across sites is provided in Supplementary Table S1 and the seed trap experimental
    design is provided in Fig. S2. The opening of the seed traps was 0.5 m2 and was
    0.5 m above the soil surface. The design of the seed traps was biased towards
    species dispersing at a height >0.5 m and towards wind-dispersed species, potentially
    reducing the likelihood of trapping groundcover species and seeds moved by specific
    vectors such as mammals, insects, caching birds and water (Gros et al. 2023).
    ^p To measure the dispersal of seed rain into burnt areas at both Mount Tomah
    and Mount Wilson, seed traps, 5 m apart, were placed in rows parallel to the fire
    edge, in a fan-like arrangement, with a greater number of traps increasing per
    row the further from the fire edge. This was undertaken to predominantly capture
    species dispersing from behind the fire edge and to account for the decreased
    likelihood of dispersal as distance increases, maintaining even sampling across
    the leptokurtic distribution of seed rain, similar to other studies on seed rain
    (Bullock et al. 2006; Nathan et al. 2012; Charles et al. 2017) (Fig. 2). At Mount
    Tomah, seven rows of traps (23 in total, 2, 3, 3, 3, 3, 4, 5) were placed in areas
    burnt at low to moderate severity and two rows of traps (17 in total, 7, 10) were
    placed in areas burnt at high to extreme severity. The first row of traps was
    20 m from the identified burnt edge to allow for fire edge effects where it was
    difficult to determine burnt from unburnt. The second row was 20 m from the first,
    and then all following rows were 10 m apart. Given difficult site conditions,
    limited trap availability and maintaining sufficient replicates in burnt areas,
    seed traps were unable to be placed in the unburnt area at Mount Tomah. At Mount
    Wilson, there was a gravel fire management road (3 m wide) at the fire edge. Three
    rows of traps (10 in total, 3, 3, 4) were placed in the unburnt area to additionally
    observe whether local dispersal (<20 m) occurred in unburnt areas. In the burnt
    area that experienced low- to moderate-severity fire, two rows of traps were placed
    (7 in total, 3, 4), and in the area that experienced high- to extreme-severity
    fire, three rows of traps were placed (23 in total, 5, 8, 10). The first row of
    traps on both the unburnt and burnt sides were 10 m from the burnt edge to allow
    for fire edge effects, and all following rows were 10 m apart. Seed trap arrangement
    is provided in Fig. S3. ^p To identify extant species that were likely to disperse
    into burnt sites, we conducted vegetation surveys at our study sites in June and
    July of 2024, following the final collection of seed trap contents. Transects
    were laid out along the length of the seed trap rows, parallel to fire edge and
    were therefore 10 m apart. Transect lengths varied from 10 (2 traps) to 50 m (10
    traps) depending on the number of seed traps in the row. Presence of species rooted
    within 5 m of either side of this transect was recorded. Minimum and maximum height
    of each species was also recorded. For the unburnt area at Mount Tomah, which
    contained no seed traps, three 20 × 5 m transects 10 m apart were laid out to
    record species composition. To assess how cover changes with fire severity, species
    cover over seed traps was also measured in Supplementary material 2 and presented
    in Fig. S9. ^p Contents of seed traps were collected once a month for 1 year,
    from January 2023 to January 2024. All samples were examined, with seeds identified
    to species where possible. For some species, germinating of seeds was required
    to confirm identification, when sufficient quantity and germination requirements
    were known. The total number of seeds present per monthly sample was also counted.
    Where we were not able to identify seeds to species level, we identified to genus
    level. We acknowledge that in some genera, such as in Acacia and Rubus, it is
    likely that this would pool multiple species, which could mask some of the diversity
    that occurred at the site. However, we were able to identify 73% (35 of 48) of
    the species present in traps to species level. Only one species could not be determined
    and is included as ‘unknown’.
  original_file: Paroissien_2026_SeedRain.csv, supplied by the authors; the data are
    also available from the Dryad Digital Repository (https://doi.org/10.5061/dryad.cjsxksnjw).
  notes: data.csv is an unmodified copy of raw/Paroissien_2026_SeedRain.csv, with
    one row per seed trap x collection date x species. Data for dispersal syndrome
    and growth form has been sourced from the NSW Fire Response Database, which for
    these traits, is identical to AusTraits. The values for each species used in this
    analysis are retained in the data.csv file, but not mapped into AusTraits as traits.
    custom_R_code builds new rows for seed mass and plant height, retaining one row
    per species x location, with collection_date the range of collection dates for
    that species at that location. Traps where no adult was found within 50 m (MinimumDist
    "Not found", Persoonia mollis and Nyssa sp.) or the taxon was unidentified ("Unknown")
    cannot be quantified and are excluded. The number of seeds of each species per
    trap per monthly collection (Count), cover over each seed trap at two time points
    (SeedTrapCoverT1, SeedTrapCoverT2) and the trap installation date (DateInitial)
    are not mapped, but retained in data.csv.
