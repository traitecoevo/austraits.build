contexts:
- context_property: data collector
  category: method_context
  var_in: observer
- context_property: tree dbh
  category: entity_context
  var_in: dbh
- context_property: bark type
  category: entity_context
  var_in: bark_type
  values:
  - value: Ironbark
    description: Tree has ironbark type bark.
  - value: Rough
    description: Tree has rough bark, including all subfibrous bark types other than
      subfibrous - stringy (i.e. rough, subfibrous - rough, subfibrous - peppermint-like,
      subfibrous - box-like and subfibrous - tessellated).
  - value: Smooth
    description: Tree has smooth bark, which is shed each year.
  - value: Stocking
    description: Tree has smooth bark with a stocking of persistent, rough bark at
      the base of the trunk.
  - value: Stringy
    description: Tree has stringy bark, with long, loose fibres, including subfibrous
      - stringy bark.
traits:
- var_in: bark_type_thickness
  unit_in: .na
  trait_name: bark_morphology_eucalyptus
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Bark was defined as the phloem, periderm and rhytidome. Species were categorised
    as having one of the following bark types, smooth, smooth with stocking, rough,
    subfibrous – rough, subfibrous – peppermint-like, subfibrous – box-like, subfibrous
    – tessellated, stringy, or subfibrous – stringy, as described by Keith (2004)
    and Horsey and Watson (2012). Smooth bark is shed each year, yet trees with smooth
    bark and stocking have persistent, rough bark at their bases. Rough bark can be
    corky, compact or furrowed. Stringy bark usually has long, loose fibres, although
    the fibres of the subfibrous subtype are softer and shorter. Species were then
    categorised more broadly as having either smooth, rough, or stringy bark, for
    modelling purposes. Smooth bark with stocking was dropped from the analyses, because
    these species were often not true smooth barks at the physical point of measurement,
    and all subfibrous bark types were categorised as rough bark, aside from subfibrous
    – stringy bark, which was categorised as stringy bark.
- var_in: bark_thickness
  unit_in: mm
  trait_name: bark_thickness
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: In the primary bark thickness dataset, bark thickness measurements were
    taken by hammering a 3 mm wide flat head screwdriver into the stem at breast height
    until it reached sapwood, producing a characteristic feel and sound, following
    Gill et al. (1982), similar to using a pin punch (Lawes et al. 2021). Measurements
    were taken on top of bark corrugations if these featured (Hoffmann et al. 2003;
    Lawes et al. 2011a; Schubert et al. 2016). Similarly, measurements were taken
    at points equally spaced around the stem circumference. If bark protuberances
    or stem divisions occurred where measurements were to be taken, they were taken
    beside or below these. In the secondary bark thickness dataset, bark thickness
    measurements were taken using a 50 mm bark gauge (Haglöf Inc., Sweden) and each
    stem was measured at both a north and south aspect, regardless of size.
- var_in: bark_thickness_index
  unit_in: mm/mm
  trait_name: bark_thickness_index
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: In the primary bark thickness dataset, bark thickness measurements were
    taken by hammering a 3 mm wide flat head screwdriver into the stem at breast height
    until it reached sapwood, producing a characteristic feel and sound, following
    Gill et al. (1982), similar to using a pin punch (Lawes et al. 2021). Measurements
    were taken on top of bark corrugations if these featured (Hoffmann et al. 2003;
    Lawes et al. 2011a; Schubert et al. 2016). Similarly, measurements were taken
    at points equally spaced around the stem circumference. If bark protuberances
    or stem divisions occurred where measurements were to be taken, they were taken
    beside or below these. In the secondary bark thickness dataset, bark thickness
    measurements were taken using a 50 mm bark gauge (Haglöf Inc., Sweden) and each
    stem was measured at both a north and south aspect, regardless of size.
- var_in: bark_density
  unit_in: g/cm3
  trait_name: bark_density
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Bark cores were extracted using a 5.15 mm increment borer (Haglöf Inc.),
    at the same height and depth as bark thickness was measured. One core per tree
    was extracted from stems of <40 cm DBH and two cores per tree were extracted from
    stems of ≥40 cm DBH. Cores were taken on top of bark corrugations, on opposite
    sides of stems, beside bark protuberances and points of stem division where applicable.
    When it was not possible to obtain a large-enough core by using the borer, a chisel
    or screwdriver was used instead. For any friable core that expanded and broke
    apart very quickly, vernier calipers were used to measure the core length while
    it was still in the extractor. All cores were put into sealed plastic tubes and
    stored in a chiller bag. Once back from the field, the cores were kept in a cool,
    dark room (Pérez-Harguindeguy et al. 2013). ^p Laboratory methods ^p The volume
    of each bark core was estimated using the water displacement method (Chave et
    al. 2006; Williamson and Wiemann 2010; Pérez-Harguindeguy et al. 2013). Each core
    was submerged in water without it contacting either the sides or base of the vessel.
    The change in mass recorded on the balance was equal to the volume of the core.
    This assumed that the density of the water was ~1 g cm−3 (Chave et al. 2006; Williamson
    and Wiemann 2010; Pérez-Harguindeguy et al. 2013). For any friable core, the dimensional
    method calculation was used as an alternative way to get its fresh volume (Pérez-Harguindeguy
    et al. 2013) ^p The core was sealed in a paper envelope and dried at 105°C in
    an oven for 48 h (Williamson and Wiemann 2010; Pérez-Harguindeguy et al. 2013).
    Once removed from the oven, it was weighed to get its dry mass.
