dataset:
  data_is_long_format: no
  custom_R_code: ' data |> mutate(bark_thickness_index = 2*bark_thickness/(dbh*10),
    bark_type = bark_type_thickness) |> group_by(display_name) |> mutate(across(c(bark_type_thickness), replace_duplicates_with_NA))
    |> ungroup() '
  collection_date: collection_date
  taxon_name: display_name
  location_name: site_label
  description: A study that examined whether bark thickness and density varied with
    fire frequency and landscape aridity, and whether these relationships differed
    among smooth, stringy and rough bark types.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Study area and data ^p Data were drawn from two datasets (primary
    and secondary). Fieldwork was undertaken to collect the primary dataset between
    August 2019 and June 2021. The secondary dataset was collected between February
    2018 and July 2018 (Bendall 2020). The combined primary and secondary datasets
    comprised 158 sites for the bark thickness analysis and 43 sites for the bark
    density analysis (Fig. 1); the majority of bark density sites (41 of 43) were
    also represented in the bark thickness sample. The primary dataset was collected
    in dry sclerophyll forests across south-eastern Australia. These forests typically
    contain trees with a canopy of ~20 m in height, with shrubby understorey vegetation
    up to 4 m in height. The primary dataset was combined with secondary datasets
    collected in dry sclerophyll and wet sclerophyll forests in eastern NSW (Bendall
    2017, 2020). In the combined study area, the mean annual temperature (MAT) ranged
    between 11°C and 18°C and the mean annual precipitation (MAP) ranged between 600
    and 1700 mm (Australian Bureau of Meteorology; BOM 2025). The elevation ranged
    from near sea level to ~1,400 m above sea level. ^p The landscape aridity index
    value for each survey site was extracted from a 30 m resolution raster layer representing
    the Budyko radiative index of dryness (DCCEEW 2023). This index is a dimensionless
    parameter that represents the long-term balance between net radiation and precipitation
    (Nyman et al. 2014), while also accounting for topographic position. Through exploratory
    modelling, we found that elevation and slope had no discernible influence on bark
    attribute values once the aridity index was included as a predictor, and these
    variables were therefore excluded from further analysis. Broad lithology class
    was also explored but excluded because the available classification was too coarse
    to be informative at the scale of the study. ^p Fire-frequency data were obtained
    from the NSW National Parks and Wildlife Service Fire History – Wildfires and
    Prescribed Burns records (DCCEEW 2024). Frequency values included both wildfires
    and prescribed burns. Only records from 1970 onward were used, being the most
    reliable. To account for the different survey periods of the primary and secondary
    datasets, fire frequency was calculated using only fires that occurred prior to
    the first survey date at each site, namely, fires before 01/01/2020 for sites
    in the primary dataset, and fires before 01/01/2018 for sites in the secondary
    dataset. To achieve a reasonable balance of site representation across fire-frequency
    levels, frequency values were grouped into two classes, namely, less frequent
    fire (0–3 fires recorded) and more frequent fire (more than three fires recorded)
    (Table 1). ^p Field methods ^p Bark thickness and bark density ^p In the combined
    dataset, bark thickness was measured in 3258 trees from 55 eucalypt species. Bark
    density was measured in a selection of 942 of these trees. Tree diameter measurements
    were taken at 1.3 m above the ground (diameter at breast height; DBH), from the
    largest live stem of each tree (Lawes et al. 2014; Odhiambo et al. 2014; Schubert
    et al. 2016). Live stems were those with canopy leaves. Mature trees were defined
    as those ≥20 cm DBH (Bowman et al. 2014; Prior et al. 2016; Bendall et al. 2022).
    No juvenile trees were measured to prevent ontogenetic variation in bark thickness
    from confounding the results (Jackson et al. 1999; Schwilk et al. 2013; Lawes
    and Neumann 2022). For trees with a 20–30 cm DBH, two bark thickness measurements
    were taken. For trees ≥30 cm DBH, three bark thickness measurements were taken.
