- var_in: water_potential_predawn
  unit_in: MPa
  trait_name: water_potential_predawn
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 26-188
  methods: Pre-dawn and midday shoot xylem pressure potentials (psi_x) were measured
    at 2-3-month intervals between December 2007 and July 2009. Fully mature, sun-exposed
    shoots were cut from three or four random replicates of each species, sealed in
    plastic bags and stored in a cooler box until measured. The psi_x of each shoot
    was measured using a Scholander pressure chamber (Soil Moisture Equipment, Santa
    Barbara, CA, USA). ^p Values are averages across the study period.
- var_in: water_potential_midday
  unit_in: MPa
  trait_name: water_potential_midday
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Pre-dawn and midday shoot xylem pressure potentials (psi_x) were measured
    at 2-3-month intervals between December 2007 and July 2009. Fully mature, sun-exposed
    shoots were cut from three or four random replicates of each species, sealed in
    plastic bags and stored in a cooler box until measured. The psi_x of each shoot
    was measured using a Scholander pressure chamber (Soil Moisture Equipment, Santa
    Barbara, CA, USA). ^p Values are averages across the study period, means for a
    single sampling date, or the lowest and highest sampling-date means.
- var_in: leaf_delta13C
  unit_in: '{delta}[ppth]'
  trait_name: leaf_delta13C
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: '6'
  methods: During mid-autumn 2008, approximately 250-mg samples of fully expanded,
    sun-exposed photosynthetic tissue were harvested from six random replicates of
    each species. Samples were oven-dried at 80°C for 16 h and then ground using a
    Culatti DFH48 mill with a 0.5-mm screen (Glen Creston, Stanmore, UK). Subsamples
    (50 mg) were sent to the Environmental Biology Group, RSBS, at the Australian
    National University, for determination of the carbon isotope ratio (delta13C)
    with a continuous-flow stable isotope ratio mass spectrometer (Micromass IsoChrom,
    Cheshire, UK).
