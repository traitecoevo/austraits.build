traits:
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Each species was assigned to one of three growth forms (herb, shrub, tree),
    with shrubs further subdivided on the basis of mean crown height and stem diameter
    (at breast height (DBH), or basal if DBH not applicable), as follows, tree (~12
    m high, 0.5 m in DBH); large shrub (4-5 m high, 0.1-0.2 m in DBH); medium shrub
    (~2 m high, 0.02-0.03 m in basal diameter); small shrub (<=1 m high, <=0.01 m
    in basal diameter); and herb (<1 m high, <0.002 m in basal diameter).
- var_in: osmotic_potential_at_full_turgor
  unit_in: MPa
  trait_name: osmotic_potential_at_full_turgor
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: '4'
  methods: During late autumn 2008, shoots up to 1.5 m in length were sampled from
    four random replicates of each species. Each shoot was recut to a length of approximately
    0.3 m under water, and the cut end was inserted into a test tube filled with water
    to ensure that air bubbles did not enter the xylem. Samples were then stored at
    4°C in the dark to fully re-hydrate for a minimum of 24 h. Over the following
    2 days, one shoot subsample was cut from each replicate, blotted dry and its saturated
    weight (SW) determined before measurement of the balancing pressure by using a
    Scholander pressure chamber (Soil Moisture Equipment). The change in fresh weight
    (FW) and balancing pressure were measured at regular intervals over 8-10 h while
    the shoots dried on a bench. Each shoot was then oven-dried at 80°C for 24 h and
    its dry weight (DW) recorded. The change in relative water content (RWC) was calculated
    using the formula in Ladiges (1975), as follows, RWC = (FW - DW)/(SW - DW) x 100.
    ^p Pressure-volume curves for each shoot were constructed by plotting the change
    in RWC against the change in the inverse of the balancing pressure. The osmotic
    potential at full (pi100) and zero turgor (pi0), relative water content at zero
    turgor (RWC0) and the apoplastic water content (B) were determined from each curve,
    using the method outlined by Turner (1981). The balancing pressure measurements
    provided the water potential at full turgor (psi100), and the difference between
    psi100 and pi100 gave the pressure potential at full turgor (P100). The bulk modulus
    of elasticity (epsilon) of each shoot was calculated using the formula in Carter
    et al. (2006), as follows, epsilon = (P100 - P0)/(RWC100 - RWC0) x S, where P0
    is the pressure potential at zero turgor (0 MPa), and S is the symplastic water
    content (the difference between RWC100 and B).
