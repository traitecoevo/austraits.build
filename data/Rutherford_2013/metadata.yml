  data_is_long_format: yes
  custom_R_code: .na
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: To test whether differences in water relations among wallum species
    in dry sclerophyll woodland on coastal sand barriers are related to growth form,
    as a basis for understanding their dependence on groundwater.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: The Nabiac barriers are located at 32°09'S, 152°26'E (Fig. 1),
    within the NSW North Coast biogeographical region (Thackway and Cresswell 1995)
    and the North Coast botanical subdivision (Anderson 1961). The Bureau of Meteorology
    (2008) has provided climatic averages for Taree, which is similar to the Nabiac
    barriers in terms of altitude and distance from the ocean. The mean annual rainfall
    for Taree is 1176 mm. [...] ^p The Nabiac barriers comprise quartzose sand, and
    form a beach ridge chronosequence spanning two interglacial cycles (80 000-260
    000 years before present; Melville 1984; Roy et al. 1997). The present study was
    undertaken in dry sclerophyll woodland with Eucalyptus racemosa subsp. racemosa
    dominant in the canopy, and this vegetation is common on comparatively well drained
    beach ridges where the soils are likely to have a very low available waterholding
    capacity (Atkinson 1999). Fifteen perennial herb, shrub and tree species from
    seven plant families were investigated (Table 1). These species are locally widespread
    and generally cover-abundant in a range of drier vegetation subformations on the
    Nabiac barriers (i.e. forest, woodland, mallee, shrubland and heathland), and
    most are representative of wallum over a wide geographic range in eastern Australia
    (Griffith et al. 2003; Griffith and Wilson 2007). Each species was assigned to
    one of three growth forms (herb, shrub, tree), with shrubs further subdivided
    (small, medium, large) on the basis of mean crown height and stem diameter (Table
    1). Voucher specimens were lodged with the N.C.W. Beadle Herbarium (NE), University
    of New England. ^p Data for weather conditions during the study were sourced from
    the Bureau of Meteorology (2011) for Taree Airport (Site 060141, opened 1997),
    and compared with long-term averages for Taree Robertson Street (Site 060030,
    3 km south-west of Site 060141; opened 1881, now closed). Changes in groundwater
    depth were measured at 2-4-week intervals using a 503DR neutron moisture probe
    (Campbell Pacific Nuclear, Pacheco, CA, USA). Nine access tubes for the neutron
    moisture probe were positioned in a grid pattern throughout the study site.
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: Mean pre-dawn and midday water potential and delta13C
    were only given in the text for some species.
