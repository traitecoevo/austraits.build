questions:
  question1: Species means of pre-dawn and midday water potential across the study
    period (Fig. 4a), pre-dawn and midday water potential on each sampling date (Fig.
    5), and delta13C (Fig. 7a) are shown only as bars or points, with values given
    in the text for a few species only. Can you provide the data underlying these
    figures?
