dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait_name %in% c(
          "storage_organ",
          "bracteole_length", "branchlet_hairs", "corolla_lobe_length", "dispersal_appendage",
          "filament_fusion", "flower_anther_length", "flower_bract_length", "flower_colour",
          "flower_colour_detailed", "flower_diameter", "flower_fertile_stamens_count", "flower_filament_length",
          "flower_length", "flower_ovary_position", "flower_perianth_merism", "flower_perianth_symmetry",
          "flower_petal_length", "flower_sepal_length", "flower_stamen_length", "flower_style_length",
          "flowering_time", "fruit_dehiscence", "fruit_length", "fruit_shape",
          "fruit_surface", "fruit_surface_hairs", "fruit_texture", "fruit_type",
          "fruit_width", "inflorescence_colour", "inflorescence_type", "leaf_apex_shape",
          "leaf_attachment", "leaf_compoundness", "leaf_hairs_adult_leaves", "leaf_lamina_division",
          "leaf_lamina_posture", "leaf_length", "leaf_length_type", "leaf_lobation",
          "leaf_margin", "leaf_margin_posture", "leaf_phyllotaxis", "leaf_shape",
          "leaf_texture", "leaf_type", "leaf_width", "leaflet_count",
          "leaflet_length", "leaflet_width", "life_history", "ovary_length",
          "parasitic", "pedicel_length", "peduncle_length", "petal_fusion",
          "petiole_length", "pistil_length", "plant_canopy_form", "plant_climbing_mechanism",
          "plant_growth_form", "plant_growth_substrate", "plant_height", "plant_height_reproductive",
          "plant_height_type", "plant_photosynthetic_organ", "plant_physical_defence_structures", "seed_length",
          "seed_shape", "seed_width", "stem_constitution", "stem_growth_habit",
          "stem_hairs", "stem_shape", "stipule_length", "stipule_presence",
          "style_shape", "tepal_length", "woodiness_detailed"
        ),
        is.na(measurement_range) | measurement_range != "extreme"
      )
    '
  collection_date: '2026'
  taxon_name: taxon_name
  trait_name: trait_name
  value: value
  description: To compile plant trait values from the key-based scientific descriptions (C. Hollister & K.R. Thiele) of the
    Florabase profiles of the Western Australian flora.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'The scientific descriptions written by C. Hollister and K.R. Thiele from the Florabase identification
    keys (Fabaceae, Proteaceae, Malvaceae, Goodeniaceae, Rutaceae, Haemodoraceae) were downloaded. Most are generated prose;
    943 profiles (mostly Fabaceae) are the raw character list the prose is made from ("Stems Indumentum hairy, Pustules or glands
    absent, Cross section terete ..."), which was rewritten as that prose before parsing. States the key codes as uncertain
    ("(?)") are scored with scoring_certainty = uncertain: each such profile is read a second time with every state, and the
    values only that reading finds go on the uncertain rows. The "Flowers in" / "Flowering time" sentence is the flowering time.
    Trait values were extracted with the scripted parser written for the Flora of Australia online (ABRS_AtoM_2026/raw/build_data_csv.R,
    Florabase mode, FB_TEXT = key): each description is split into sentences, clauses and comma-separated segments, each segment
    is assigned to the organ it describes, and categorical terms and measurements are read from the segments of the relevant
    organ, with the family rules of that parser (Fabaceae, orchids, grasses and other graminoids, ferns, Asteraceae heads ...).
    Categorical terms are mapped to AusTraits trait values, with the source terms kept verbatim in value_description; several
    values are listed in the order they appear in the text, and alternatives qualified by a commonness word or a region are
    recorded on separate rows. A measured range is recorded as minimum and maximum values, a single measurement as a mean, a
    single count as a mode, "to X" as a maximum and "X or more" as a minimum; parenthetical extremes are kept on separate rows
    (measurement_range = extreme). Subspecies and varieties silent on a trait take the values of their species. Values that
    descriptions state only when atypical (terrestrial substrate, leaf as photosynthetic organ, not parasitic, broadleaf) are
    recorded on trait_scoring_method = inferred rows when nothing in the profile suggests otherwise; plant_height_type records
    why a taxon has no plant_height. Taxon names are given without authorities; current and not-current Florabase names are
    both included (one profile per name, the current one first).'
  original_file: florabase_profiles.csv (Florabase profiles, downloaded 1 October 2026), field Scientific Description (C. Hollister
    and K.R. Thiele)
  notes: The profile URL of each taxon is in the foa_url column. Rows whose trait_name is not mapped below (candidate traits,
    and text fields such as habit_description or habitat_description with the verbatim organ-level text) are in data.csv but
    filtered out in custom_R_code; candidate traits are listed with their coverage in raw/candidate_traits.csv.
