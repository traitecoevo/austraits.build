dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      mutate(
        taxon_name = paste0(stringr::str_to_title(genus), " ", species),
        location_name = ifelse(!is.na(latitude), paste0("site_at_", latitude, "_deg_lat_and_", longitude, "_deg_lon"), NA)
      ) |>
    generate_observation_numbers(species,trait)
  '
  collection_date: 2025-08-09
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  description: Pollen viability study for putatively male sterile plant speces, Zieria baeuerlenii. 
  basis_of_record: captive_cultivated
  life_stage: adult
  sampling_strategy: Images collected opportunistically when undertaking hand crossing experiment between genets stored in living collection at Australian National Botanic Gardens Canberra. Flowers were observed with dehiscent anthers, nectar production and floral visitors.
  original_file: in raw data folder
  notes: none
identifiers: .na
locations:
  site_at_-35.273103_deg_lat_and_149.10871_deg_lon:
    latitude (deg): -35.273103
    longitude (deg): 149.10871
    description: living collection at Australian National Botanic Gardens
    state: ACT
