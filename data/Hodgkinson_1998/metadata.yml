dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: trait
  value: value
  location_name: location_name
  basis_of_record: basis_of_record
  life_stage: life_stage
  description: To determine how the post-fire sprouting success of co-occurring shrub
    species in a fire-prone semi-arid woodland changes as plants grow taller, and whether
    these height-dependent patterns are explained by meristem availability, bark thickness
    or the onset of flowering and match the species' fire survival strategies.
  sampling_strategy: The site was 115 km south of Bourke in New South Wales on the
    pastoral property 'Oakvale' (146°30'E, 30°55'S) and within an extensive area of
    semi-arid woodland (Harrington et al. 1984). It is near the centre of a large
    pediplain and at an elevation of 250 m. Soil type is a massive red earth (Stace
    et al. 1968) or typic durargid (Soil Survey Staff 1975), with no A2 horizon and
    an indurated layer of stone or bedrock at 60-80 cm (Johns 1984). Topography is
    very gently undulating, with rises 0.5-1 km apart and slopes of 1-1.5%. Vegetation
    is a poplar box (Eucalyptus populnea F. Muell.) woodland (Beeston et al. 1980)
    which occurs between the latitudes of 21 and 35° S in eastern Australia (Harrington
    et al. 1984). Vegetation at the site is described by Harrington (1979). Briefly,
    trees of E. populnea (26 ha-1) are on the slopes and depressions and of E. intertexta
    R.T. Baker (10 ha-1) are on the ridges. Tree canopies cover 13% of the ground
    surface and beneath each is a shrub thicket dominated by Eremophila mitchellii
    Benth. and Geijera parviflora Lindl. Intervening 'interthicket' areas are dominated
    by Acacia aneura F. Muell. ex Benth., Senna artemisiodes ssp. filifolia Randell,
    S. artemisiodes (Gaud. ex D. C.) Randell ssp. artemisiodes and Eremophila bowmanii
    F. Muell. var. bowmanii. The shrubs Eremophila sturtii R. Br. and Dodonaea viscosa
    (L) Jacq. ssp. spatulata (Smith) J.G. West commonly occur in both 'thickets' and
    'interthickets'. Shrub density is about 4800 ha-1. ^p Pioneer pastoralists (1850
    onwards) described these woodlands as being 'open', with a herbaceous layer dominated
    by warm-season (C4) perennial grasses (Anon 1901, Harrington et al. 1979). Fewer
    fires and persistent grazing by domestic and native herbivores have shifted the
    vegetation to shrub dominance. Annual forbs and grasses now dominate the herbaceous
    layer that produces 0 to only 150 g m-2 year-1 (Harrington and Johns 1990). The
    shift has reduced the one in 5 years chance of fire in these woodlands to one
    in 15-20 years (Walker 1981). ^p Annual rainfall and potential evaporation (US
    class A pan) average 350 mm and 2900 mm, respectively, in the area and rainfall
    is evenly distributed. ^p Within a 108-ha exclosure, fenced in 1977 to exclude
    sheep, cattle, goats and pigs but not kangaroos, there were two areas of E. intertexta
    and two of E. populnea. The areas of each species were irregular in shape but
    contiguous. Species composition of the shrub layer was similar between the areas
    (Harrington et al. 1981). Within each of the four areas, 24 trees were selected
    along transects. From each selected tree, a 15 x 21 m plot was laid out, which
    included at one end the tree with its associated 'thicket' and at the other end
    an 'interthicket' area. ^p Within each of the four areas, 24 treatments were randomly
    allocated to the plots; 8 were controls and 16 were experimental fires. The fires
    were applied (beginning October 1977) in either the spring, summer, autumn or winter,
    with one of two fuel levels (300 and 800 g m-2 of added straw) and in one of two
    consecutive years. Each control plot was established at the same time that two
    of the plots in the same area were burned. ^p The plots allocated to fire treatments
    were burnt once. Before burning, wheaten straw was spread uniformly over each plot
    to be burnt and the 3 m surrounds, to augment the low quantity of tree litter
    and standing forbs. Plots were ignited at one end with a drip-torch and the prevailing
    wind carried a head-fire through each plot. ^p At the time of burning the four
    low-fuel plots in July of the first year, shrubs in areas near to each burnt plot
    were cut down. Ten juveniles (5-75 cm high) and 10 adults (100-430 cm high) of
    each of five species (A. aneura, D. viscosa, E. mitchellii, E. sturtii and S. artemisiodes)
    were selected from each area. Shrubs were cut down by sawing through the main
    stems 2-3 cm above the soil surface. In all, 200 shrubs were cut down (5 species
    x 2 size classes x 4 areas x 5 replicates). ^p All shrubs within the fire and
    control plots, together with those selected for cutting, were labelled before
    treatments began with a numbered aluminium disc attached to a wire pin (about
    40 cm long). The pins were thrust into the ground next to bases of individual
    shrubs. The species, height (maximum foliage height above ground) and quadrat
    location was recorded for each.
  original_file: raw/trait_data.csv (extracted from the source PDF)
  notes: Candidate traits in data.csv that are not mapped (not in config/traits.yml)
    are resprouting_capacity_proportion_individuals_non_fire_disturbance (percentage
    of cut shrubs that initiated sprouts within 6 months and that were alive 12 months
    after cutting, Table 3), resprout_mortality_fraction_non_fire_disturbance (sprout
    mortality after cutting), resprouting_capacity_peak_plant_height (plant height
    at which post-fire sprouting success peaks, Fig. 1 breakpoints), resprouting_capacity_height_response
    (the authors' three patterns of change in sprouting success with plant height),
    epicormic_resprouting_plant_height (plant height, about 1 m, at which sprouting
    from epicormic buds along stems begins, Fig. 3), bark_thickness_height_slope
    (slope of basal bark thickness on plant height, Table 4), plant_height_peak_flowering
    (E. mitchellii), plant_survival_unburnt (survival in unburnt control plots, Table
    2) and population_density (Table 2, taken from Harrington 1979). ^p resprouting_capacity
    is scored against the 30% and 70% thresholds from the percentage of burnt adults
    that sprouted (Table 3) for the five species in the cutting experiment, and from
    whole-population survival after the two winter fires (Table 2) for the other
    four species. Whole-population values include seedlings, which sprout poorly, so
    they understate adult resprouting. The authors call Dodonaea viscosa a 'non-sprouter',
    but 52% of burnt adults sprouted, so it is scored partial_resprouting. resprouting_capacity_juvenile
    is scored from the juvenile percentages in Table 3. ^p Peak sprouting heights
    follow the Fig. 1 caption (S. artemisiodes 0.27 m, E. mitchellii 0.25 m); the
    Results text gives the same numbers in panel order but lists the species in a
    different order. ^p Sprouting percentages for each height class (Fig. 1), flowering
    percentages for 50-cm height classes (Fig. 2) and epicormic sprouting percentages
    for 10-cm height classes (Fig. 3) are shown only in figures and were not extracted.
identifiers: .na
locations:
  Oakvale:
    latitude (deg): -30.9167
    longitude (deg): 146.5
    description: Semi-arid poplar box (Eucalyptus populnea) woodland with shrub thickets
      beneath the tree canopies.
    locality: Pastoral property 'Oakvale', 115 km south of Bourke
    elevation (m): 250
    vegetation: Eucalyptus populnea (26 trees/ha) on slopes and depressions and E. intertexta
      (10 trees/ha) on ridges, with 13% tree canopy cover. Shrub thickets beneath the
      trees are dominated by Eremophila mitchellii and Geijera parviflora; interthicket
      areas by Acacia aneura, Senna artemisiodes and Eremophila bowmanii. Shrub density
      about 4800/ha.
    soil type: massive red earth (typic durargid), with no A2 horizon and an indurated
      layer of stone or bedrock at 60-80 cm
    landform: centre of a large pediplain; very gently undulating, with rises 0.5-1
      km apart and slopes of 1-1.5%
    precipitation, MAP (mm): 350
    fire history: chance of fire reduced from one in 5 years to one in 15-20 years
      by fewer fires and grazing-driven shrub encroachment
    land use: pastoral property; study area within a 108-ha exclosure fenced in 1977
      to exclude sheep, cattle, goats and pigs but not kangaroos
    state: NSW
contexts:
- context_property: fire intensity
  category: plot_context
  var_in: fire_intensity
  values:
  - value: low intensity (122 kW/m)
    description: low-intensity winter head fire through plots with 300 g/m2 of added
      straw, mean fire-line intensity 122 kW/m (111-139 kW/m)
  - value: low intensity (154 kW/m)
    description: low-intensity winter head fire through plots with 300 g/m2 of added
      straw, mean fire-line intensity 154 kW/m (143-171 kW/m)
  - value: low intensity (122-154 kW/m)
    description: pooled across two low-intensity winter head fires through plots with
      300 g/m2 of added straw, mean fire-line intensities 122 and 154 kW/m
- context_property: fire season
  category: temporal_context
  var_in: fire_season
  values:
  - value: winter
    description: fire occurred in winter
- context_property: disturbance treatment
  category: treatment_context
  var_in: treatment
  values:
  - value: burnt
    description: plot burnt once by an experimental head fire after wheaten straw
      was spread over it
  - value: cut
    description: shrubs cut down by sawing through the main stems 2-3 cm above the
      soil surface
  - value: unburnt control
    description: unburnt control plot
- context_property: time since treatment
  category: temporal_context
  var_in: time_after_treatment
  values:
  - value: 12 months
    description: survival assessed 12 months after fire or cutting
  - value: 1-6 months
    description: sprouting assessed monthly during the first 6 months after cutting
- context_property: sampled plant height range (cm)
  category: entity_context
  var_in: plant_height_range_cm
- context_property: microhabitat
  category: entity_context
  var_in: microhabitat
  values:
  - value: thicket
    description: species dominant in the shrub thickets beneath tree canopies
  - value: interthicket
    description: species dominant in the open areas between tree-canopy thickets
  - value: thicket and interthicket
    description: species common in both thickets and interthicket areas
traits:
- var_in: resprouting_capacity_proportion_individuals
  unit_in: '%'
  trait_name: resprouting_capacity_proportion_individuals
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Twelve months after the fires, each numbered shrub was assessed for fire
    damage and sprouting success. Sprout height above ground was measured on surviving
    shrubs. It was assumed that if a shrub had no living or recently dead sprouts
    then it had failed to survive the fire damage. ^p Sprouting success was analysed
    in several ways. First, the percentage of the population of each species present
    at the time of the low-fuel winter fires that sprouted in burned and unburned
    treatments during the next 12 months was calculated. Standard errors were calculated
    from survival data from each plot. Second, sprouting success for species within
    certain height ranges was calculated from shrubs cut or burned in July of the
    first year and standard errors were calculated from plot percentages. Third, for
    the low-fuel winter fires, individuals were placed in a height class and the sprouting
    percentage of each class was calculated. ^p Sprouting success of the smallest
    (5 cm high) and presumably youngest individuals differed amongst species.
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Twelve months after the fires, each numbered shrub was assessed for fire
    damage and sprouting success. It was assumed that if a shrub had no living or
    recently dead sprouts then it had failed to survive the fire damage. ^p 'Sprouters',
    the species relying more on sprouting than recruitment for population persistence,
    maintained maximum sprouting success with height growth and gained sprouting ability
    along stems once they reached 1 m in height. In contrast, 'non-sprouters', the
    species largely relying on recruitment from seed to maintain populations, were
    either not able to sprout after seedling establishment or steadily lost the ability
    to maintain sprouts with growth beyond 60 cm and did not develop axillary buds
    along stems at any height. ^p Records give the resprouting class matching the
    percentage of burnt adult shrubs (Table 3) or, for species not in the cutting
    experiment, of the whole burnt population (Table 2) that sprouted.
- var_in: resprouting_capacity_juvenile
  unit_in: .na
  trait_name: resprouting_capacity_juvenile
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Second, sprouting success for species within certain height ranges was
    calculated from shrubs cut or burned in July of the first year and standard errors
    were calculated from plot percentages. ^p Records give the juvenile resprouting
    class matching the percentage of burnt juvenile shrubs (5-75 cm high) that sprouted
    (Table 3).
- var_in: resprouting_capacity_non_fire_disturbance
  unit_in: .na
  trait_name: resprouting_capacity_non_fire_disturbance
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: At the time of burning the four low-fuel plots in July of the first year,
    shrubs in areas near to each burnt plot were cut down. Ten juveniles (5-75 cm
    high) and 10 adults (100-430 cm high) of each of five species (A. aneura, D. viscosa,
    E. mitchellii, E. sturtii and S. artemisiodes) were selected from each area. Shrubs
    were cut down by sawing through the main stems 2-3 cm above the soil surface.
    ^p After being cut down, sprouting of individuals was assessed 3, 4, 5, 6, 7,
    10 and 13 months later. Shrubs were deemed alive if viable sprouts were visible.
- var_in: bud_bank_location
  unit_in: .na
  trait_name: bud_bank_location
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Location of sprouts (stem, base, root) after fire damage was determined
    for all shrubs in the 64 fire plots. Shrubs with at least complete leaf scorch
    and with the majority of their small-diameter stems not consumed by the fire were
    selected for the analysis. ^p Three shrub species at the site were found to sprout
    from epicormic buds located beneath bark along stems when plants had grown beyond
    a threshold height; all other shrub species sprouting after fire damage did so
    only from the stem base.
- var_in: post_fire_recruitment
  unit_in: .na
  trait_name: post_fire_recruitment
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: In contrast, 'non-sprouters', the species largely relying on recruitment
    from seed to maintain populations, were either not able to sprout after seedling
    establishment or steadily lost the ability to maintain sprouts with growth beyond
    60 cm and did not develop axillary buds along stems at any height. ^p In contrast,
    species relying mostly on recruitment after fire for population survival, the
    'non-sprouters', are poorer at sprouting. Whilst some, for example D. viscosa
    and S. artemisiodes, quickly acquire an ability to initiate and sustain sprouts
    and juveniles, they lose this initial sprouting success with maturity. ^p Records
    are the species the author identifies as relying on recruitment from seed after
    fire.
- var_in: bark_thickness
  unit_in: mm
  trait_name: bark_thickness
  entity_type: population
  value_type: value_type
  basis_of_value: model_derived
  replicates: replicates
  methods: Twenty to 30 individuals of five species, with heights spanning the range
    for each species, were selected along a linear transect within the study site.
    The height of each shrub was measured and a small section of bark and wood was
    cut from the stem base. Wood internal to the cambium layer was carefully peeled
    away from each section and bark thickness was measured with callipers. The relationship
    between shrub height and bark thickness for each species was determined by linear
    regression. ^p Basal bark thickness for 1- and 2-m-high shrubs is derived from
    the fitted regressions. ^p Records for a plant height of 0 cm are the regression
    intercepts.
- var_in: water_potential_predawn
  unit_in: MPa
  trait_name: water_potential_predawn
  entity_type: population
  value_type: value_type
  basis_of_value: measurement
  replicates: replicates
  methods: Within an hour of dawn on the days of fire, xylem water potentials were
    determined on six species in a representative area using a pressure bomb (Scholander
    et al. 1965). Measurements were made on shoots from six randomly selected shrubs
    of major species. Terminal shoots of 7-10 cm length were cleanly cut from shrubs
    and lower leaves were trimmed so that about five leaves remained on each shoot.
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: The sprouting success of co-occurring populations of shrub species in a
    temperate woodland of semi-arid Australia was investigated and related to population
    survival strategies.
substitutions:
- trait_name: resprouting_capacity_non_fire_disturbance
  find: sprouts_after_cutting
  replace: resprouts_after_non-fire_stem_loss
- trait_name: bud_bank_location
  find: stem_base
  replace: basal_stem_buds
  match: word
- trait_name: bud_bank_location
  find: epicormic_buds_along_stems
  replace: epicormic_buds
  match: word
- trait_name: post_fire_recruitment
  find: relies_on_recruitment_from_seed
  replace: post_fire_recruitment
taxonomic_updates: .na
exclude_observations: .na
questions:
  question1: The Methods say dawn xylem water potentials were measured on six species,
    but Table 1 reports only Acacia aneura, Eremophila mitchellii and Senna artemisiodes.
    Are the values for the other three species available, and which species were
    they?
  question2: The site description lists two subspecies of Senna artemisiodes (ssp.
    filifolia and ssp. artemisiodes) in the interthicket areas, and Dodonaea viscosa
    as ssp. spatulata. Do the Senna artemisiodes values in Tables 2-4 include both
    subspecies, and are all the Dodonaea viscosa plants ssp. spatulata?
  question3: Table 3 gives a dash for burnt adult Acacia aneura. Were no adult A.
    aneura burnt in the July 1978 low-fuel plots?
  question4: Are the underlying data for Figs 1-3 (sprouting percentage per height
    class after the 1978 and 1979 fires, flowering percentage per 50-cm height class,
    and stem-sprouting percentage per 10-cm height class) available, ideally with
    the number of shrubs in each class?
