traits:
- var_in: pollination_vector_possible
  unit_in: .na
  trait_name: pollination_vector_possible
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Personal field observations and photographic records of floral visitors,
    with visitors identified by observation. A `pollination_vector_possible` record
    indicates the visitor was observed collecting nectar and/or pollen from the flower
    and was assumed to be a pollinator, but pollination was not experimentally confirmed.
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Personal field observations and photographic records of floral visitors,
    with visitors identified by observation. A `flower_visitor` record indicates the
    taxon was observed visiting the flower (e.g. taking a nectar reward) with no recorded
    contact with the stigma or anthers.
