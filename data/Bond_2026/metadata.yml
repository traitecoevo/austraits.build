dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      mutate(
        taxon_name = trimws(paste(`Plant Genus`, ifelse(is.na(`Plant Species`), "", `Plant Species`))),
        pollinator_taxon = case_when(
          !is.na(`Visitor Genus`) & !is.na(`Visitor Species`) ~ paste(`Visitor Genus`, `Visitor Species`),
          !is.na(`Visitor Genus`) ~ `Visitor Genus`,
          `Visitor Morphospecies` == "Hover fly" ~ "Syrphidae",
          TRUE ~ `Visitor Order/Family`
        ),
        `Pollinator match column` = case_when(
          `Visitor Genus` == "Apis" ~ "Visitor Genus and Visitor Species",
          `Visitor Morphospecies` == "Hover fly" ~ "Visitor Morphospecies",
          `Visitor Order/Family` == "Lepidoptera" ~ "Visitor Genus",
          TRUE ~ "Visitor Order/Family"
        ),
        `Pollinator match value` = case_when(
          `Visitor Genus` == "Apis" ~ paste(`Visitor Genus`, `Visitor Species`),
          `Visitor Morphospecies` == "Hover fly" ~ `Visitor Morphospecies`,
          `Visitor Order/Family` == "Lepidoptera" ~ `Visitor Genus`,
          TRUE ~ `Visitor Order/Family`
        ),
        photographic_record = ifelse(stringr::str_detect(Source, "photo"), "photographed", "not photographed"),
        basis_of_record = ifelse(!is.na(notes) & notes == "Garden plant", "captive_cultivated", "field")
      ) |>
    generate_observation_numbers(taxon_name, `Visitor TRAIT`, Location)
  '
  collection_date: collection_date
  taxon_name: taxon_name
  trait_name: Visitor TRAIT
  value: Pollinator match value
  location_name: Location
  description: Floral-visitor and possible pollen-vector records, predominantly butterflies,
    for plant species (native, naturalised and cultivated) across the ACT, NSW, Queensland,
    South Australia, Western Australia and Norfolk Island, from personal observations
    and photographic records by S.J. Bond.
  basis_of_record: basis_of_record
  life_stage: adult
  sampling_strategy: Opportunistic personal observations of animals visiting flowers,
    recorded between 2008 and 2026, many documented with photographs. Observations
    were made in natural vegetation, nature reserves and national parks, and in gardens
    (including the Australian National Botanic Gardens).
  original_file: Plant_Pollinator_AusTraits_2026_SBond_30Sept2026.xlsx, in raw data
    folder
  notes: The raw data records each floral visitor's identity across the columns `Visitor
    Order/Family`, `Visitor Genus`, `Visitor Species` and `Visitor Morphospecies`
    (common name). The derived columns `Pollinator match column` and `Pollinator match
    value` identify which of these raw columns supplies the most taxonomically specific
    value that resolves to a `pollination_vector_possible`/`flower_visitor` allowed
    value, and what that raw value was. For Lepidoptera, `Visitor Genus` is the match
    value, with substitutions mapping each genus to `butterfly` (including skippers)
    or `moth` (the geometrid genus Chrysolarentia), since `Visitor Order/Family` alone
    only resolves to `lepidoptera`. Records of plants noted as garden plants are assigned
    a basis_of_record of `captive_cultivated`, all others `field`.
