questions:
  question1: Replicates are set to unknown for all traits. The paper states 3-10 plants
    were grown per species (7-10 for most; E. regnans n = 6, E. stricta n = 5, E.
    dawsonii n = 4, E. grandis n = 3), but wood density and wood anatomy were measured
    on the half of individuals harvested at the end of the experiment, and 63 vulnerability
    curves were fitted across the 22 species for P50, without per-species counts.
    Can you supply the number of individuals behind each species mean?
