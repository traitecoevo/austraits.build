traits:
- var_in: P50
  unit_in: neg_MPa
  trait_name: stem_water_potential_50percent_lost_conductivity
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: 'Stem hydraulic vulnerability (drought-induced stem P50) was determined
    for each species using the optical vulnerability (OV) technique as described in
    Brodribb et al. (2017) and Gauthey et al. (2020). Measurements were conducted
    from March to May 2024 (16 species during the summer period) and in October 2024
    (six species during the winter period). Whole plants, including roots and soil,
    were carefully removed from plant bags and sealed in black garbage bags with moist
    paper towels for transport. We stored samples in a cold room overnight to equilibrate
    water potential (c. 0 MPa). Samples were then placed on laboratory benches for
    natural dehydration. For each plant, we selected a suitable branch, typically
    from the mid-canopy position; for a few smaller individuals, in which branches
    were insufficient, we used the main stem instead. We carefully removed a small
    section of bark to expose the xylem, which we then secured in a ‘Cavicam’ clamp.
    Cavicams consisted of a clamp equipped with an 8-megapixel camera, 20× lens, and
    a Raspberry Pi computer (http://www.raspberrypi.org), capturing images under c.
    200 umol m-2 s-1 LED light via refracted surface light (details: https://github.com/OpenSourceOV).
    Images were taken every 10 min until full dehydration (when embolism events ceased
    for > 12 h). ^p We recorded stem water potentials using two methods. For E. paniculata,
    Eucalyptus porosa F.Muell. ex Miq., Eucalyptus largiflorens F.Muell., and Eucalyptus
    moluccana Roxb., measurements were taken with a stem psychrometer (PSY, ICT-International,
    Australia). We selected a suitable branch or stem (typically a basal branch or
    the main stem in smaller individuals) and removed a small section of bark to expose
    the xylem. Silicon grease was applied to the surface of the psychrometer before
    securing it to the branches. To prevent leaks, the psychrometer and branches were
    wrapped together with wax tape (Parafilm M). The device was programmed to record
    water potential every 10 min, continuing until the plants had fully dehydrated.
    Since the stems or branches of many species were too small to fit into the psychrometer
    chamber, we measured plant water potential for the other 18 species with a Scholander
    pressure chamber (PMS Instruments, Albany, NY, USA). Readings were taken every
    4–6 h until the plants were fully dehydrated. ^p We analysed xylem embolism images
    using FIJI (IMAGEJ; Schindelin et al., 2012), following the guidelines provided
    on https://github.com/OpenSourceOV. We calculated pixel differences between consecutive
    images in each sequence to quantify changes in light reflectance, thereby highlighting
    embolism events. The threshold and noise tools in FIJI were used to isolate embolism
    events by thresholding the images and removing nonembolism-related changes, resulting
    in images that displayed only pixels corresponding to embolism. To calculate the
    percentage of embolism, we analysed the data using the following formula: %Embolism
    = (Aemb/Amax) × 100, where Aemb refers to the cumulative embolised xylem area
    at a specific time; Amax refers to the total embolised area recorded after full
    sample dehydration. By combining water potential measurements with percent area
    embolised, optical vulnerability curves for each species were generated (Fig.
    S3). A total of 63 curves were then fitted using the ‘FITPLC’ R package (Duursma
    & Choat, 2017), from which drought-induced P50 (the xylem water potential at which
    50% of cumulative embolism area occurred; MPa) was obtained for each sample.'
- var_in: WD
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: Half of the individuals from each group were harvested simultaneously (at
    6 months’ age for the summer group and 10 months’ age for the winter group). [...]
    Additionally, basal stem samples from the same individuals were collected to determine
    wood density. The bark was stripped away, and the exposed xylem was rehydrated
    overnight before measurements. We determined the volume of each sample using the
    water displacement method (Ilic et al., 2000), and then dried them at 70°C for
    48 h to obtain the dry mass. We calculated wood density (g cm-3) as the ratio
    of wood dry mass to wood fresh volume.
- var_in: Dh
  unit_in: um
  trait_name: stem_vessel_diameter_hydraulic
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: We also collected a twig segment from each plant, which was positioned
    c. 20 cm from the branch tip, ensuring it had intact, healthy leaves. A 1- to
    2-cm section of the twig was excised and stored in 70% ethanol for subsequent
    wood anatomical analysis. ^p Anatomical traits were examined using wood transverse
    sections of branchlets. Thin sections, ranging from 10 to 30 um in thickness,
    were prepared with a sledge microtome (Reichert, Vienna, Austria). To enhance
    contrast, we stained the sections with a mixture containing safranin and Astra
    Blue (0.35 g Safranin + 0.65 g Astra blue + 35 ml 50% Ethanol + 65 ml distilled
    water) before mounting them in Euparal. A series of 10–16 digital images were
    taken for each sample at randomly selected locations by a light microscope (Model
    BX60; Olympus, Tokyo, Japan). Images were captured at varying magnifications (4×,
    20×, and 40×) with a high-resolution digital camera (Leica DFC 500; Leica Microsystems)
    attached to the microscope. ^p We analysed anatomical traits with FIJI (IMAGEJ;
    Schindelin et al., 2012), excluding the bark from the measurements. Because VTs
    are expected to contribute little to hydraulic conductivity in Eucalyptus (Barotto
    et al., 2016), they were not included in our anatomical analyses or in the computation
    of theoretical conductivity. At 4× magnification, two to four images were captured,
    each representing either half or a quarter of the stem cross section. Within these
    images, two to four fan-shaped regions were selected for vessel property analysis
    (Fig. 1a,b). We measured vessel area (A, um2) directly via FIJI. To identify large
    vessels, an initial threshold of ≥ 100 um2 was applied for automatic detection,
    while smaller vessels were measured manually. In Eucalyptus, solitary vessels
    typically have much larger diameters than VTs, making them easier to differentiate
    based on size and position within the transverse section. Additionally, we identified
    VTs based on the presence of bordered pits connecting them to adjacent vessels
    (Fig. 1c,d). Vessel diameter (D, um) was determined using the following formula
    D = sqrt(4A/pi). We then calculated the hydraulically weighted mean vessel diameter
    (Dh, um) with the following formula (Peters et al., 2021) Dh = (sum(D^4)/N)^(1/4),
    where N represents the total number of vessels involved.
