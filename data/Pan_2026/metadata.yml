    water) before mounting them in Euparal. A series of 10–16 digital images were
    taken for each sample at randomly selected locations by a light microscope (Model
    BX60; Olympus, Tokyo, Japan). Images were captured at varying magnifications (4×,
    20×, and 40×) with a high-resolution digital camera (Leica DFC 500; Leica Microsystems)
    attached to the microscope. ^p We analysed anatomical traits with FIJI (IMAGEJ;
    Schindelin et al., 2012), excluding the bark from the measurements. Because VTs
    are expected to contribute little to hydraulic conductivity in Eucalyptus (Barotto
    et al., 2016), they were not included in our anatomical analyses or in the computation
    of theoretical conductivity. At 4× magnification, two to four images were captured,
    each representing either half or a quarter of the stem cross section. Within these
    images, two to four fan-shaped regions were selected for vessel property analysis
    (Fig. 1a,b). [...] In Eucalyptus, solitary vessels typically have much larger
    diameters than VTs, making them easier to differentiate based on size and position
    within the transverse section. Additionally, we identified VTs based on the presence
    of bordered pits connecting them to adjacent vessels (Fig. 1c,d). [...] We determined
    vessel density (VD, n mm-2) by counting the vessels within a given cross-sectional
    area.
- var_in: VLF
  unit_in: mm2/mm2
  trait_name: stem_vessel_lumen_fraction
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: We also collected a twig segment from each plant, which was positioned
    c. 20 cm from the branch tip, ensuring it had intact, healthy leaves. A 1- to
    2-cm section of the twig was excised and stored in 70% ethanol for subsequent
    wood anatomical analysis. ^p Anatomical traits were examined using wood transverse
    sections of branchlets. Thin sections, ranging from 10 to 30 um in thickness,
    were prepared with a sledge microtome (Reichert, Vienna, Austria). To enhance
    contrast, we stained the sections with a mixture containing safranin and Astra
    Blue (0.35 g Safranin + 0.65 g Astra blue + 35 ml 50% Ethanol + 65 ml distilled
    water) before mounting them in Euparal. A series of 10–16 digital images were
    taken for each sample at randomly selected locations by a light microscope (Model
    BX60; Olympus, Tokyo, Japan). Images were captured at varying magnifications (4×,
    20×, and 40×) with a high-resolution digital camera (Leica DFC 500; Leica Microsystems)
    attached to the microscope. ^p We analysed anatomical traits with FIJI (IMAGEJ;
    Schindelin et al., 2012), excluding the bark from the measurements. Because VTs
    are expected to contribute little to hydraulic conductivity in Eucalyptus (Barotto
    et al., 2016), they were not included in our anatomical analyses or in the computation
    of theoretical conductivity. At 4× magnification, two to four images were captured,
    each representing either half or a quarter of the stem cross section. Within these
    images, two to four fan-shaped regions were selected for vessel property analysis
    (Fig. 1a,b). We measured vessel area (A, um2) directly via FIJI. To identify large
    vessels, an initial threshold of ≥ 100 um2 was applied for automatic detection,
    while smaller vessels were measured manually. [...] Vessel lumen fraction (VLF)
    was determined as the proportion of the total vessel area (sum(A), um2) relative
    to the analysed cross-sectional area.
- var_in: VWT
  unit_in: um
  trait_name: stem_vessel_wall_thickness
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: We also collected a twig segment from each plant, which was positioned
    c. 20 cm from the branch tip, ensuring it had intact, healthy leaves. A 1- to
    2-cm section of the twig was excised and stored in 70% ethanol for subsequent
    wood anatomical analysis. ^p Anatomical traits were examined using wood transverse
    sections of branchlets. Thin sections, ranging from 10 to 30 um in thickness,
    were prepared with a sledge microtome (Reichert, Vienna, Austria). To enhance
    contrast, we stained the sections with a mixture containing safranin and Astra
    Blue (0.35 g Safranin + 0.65 g Astra blue + 35 ml 50% Ethanol + 65 ml distilled
    water) before mounting them in Euparal. A series of 10–16 digital images were
    taken for each sample at randomly selected locations by a light microscope (Model
    BX60; Olympus, Tokyo, Japan). Images were captured at varying magnifications (4×,
    20×, and 40×) with a high-resolution digital camera (Leica DFC 500; Leica Microsystems)
    attached to the microscope. ^p We analysed anatomical traits with FIJI (IMAGEJ;
    Schindelin et al., 2012), excluding the bark from the measurements. [...] For
    each sample, six to 10 randomly selected images were taken at 20× or 40× magnification.
    By using the straight-line tool in FIJI, we determined vessel wall thickness (VWT,
    um; Fig. 1c,d). We recorded several measurements along each vessel wall and used
    their average to characterise the overall wall thickness.
- var_in: Kth
  unit_in: kg/m/MPa/s
  trait_name: sapwood_specific_hydraulic_conductivity_theoretical
  entity_type: population
  value_type: mean
  basis_of_value: model_derived
  replicates: unknown
  methods: We also collected a twig segment from each plant, which was positioned
    c. 20 cm from the branch tip, ensuring it had intact, healthy leaves. A 1- to
    2-cm section of the twig was excised and stored in 70% ethanol for subsequent
    wood anatomical analysis. ^p Anatomical traits were examined using wood transverse
    sections of branchlets. Thin sections, ranging from 10 to 30 um in thickness,
    were prepared with a sledge microtome (Reichert, Vienna, Austria). To enhance
    contrast, we stained the sections with a mixture containing safranin and Astra
    Blue (0.35 g Safranin + 0.65 g Astra blue + 35 ml 50% Ethanol + 65 ml distilled
    water) before mounting them in Euparal. A series of 10–16 digital images were
    taken for each sample at randomly selected locations by a light microscope (Model
    BX60; Olympus, Tokyo, Japan). Images were captured at varying magnifications (4×,
    20×, and 40×) with a high-resolution digital camera (Leica DFC 500; Leica Microsystems)
    attached to the microscope. ^p We analysed anatomical traits with FIJI (IMAGEJ;
    Schindelin et al., 2012), excluding the bark from the measurements. Because VTs
    are expected to contribute little to hydraulic conductivity in Eucalyptus (Barotto
    et al., 2016), they were not included in our anatomical analyses or in the computation
    of theoretical conductivity. [...] We measured vessel area (A, um2) directly via
    FIJI. [...] Vessel diameter (D, um) was determined using the following formula
    D = sqrt(4A/pi). We then calculated the hydraulically weighted mean vessel diameter
    (Dh, um) with the following formula (Peters et al., 2021) Dh = (sum(D^4)/N)^(1/4),
    where N represents the total number of vessels involved. We determined vessel
    density (VD, n mm-2) by counting the vessels within a given cross-sectional area.
    We then estimated theoretical conductivity (Kth, kg s-1 m-1 MPa-1) using the following
    formula (Peters et al., 2021) Kth = (pi*Dh^4/(128*eta)) × VD × rho, where eta
    (MPa s) represents water viscosity, while rho (kg m-3) represents water density.
    Using the following formula, we estimated eta = 1.95 × 10^14/T^7, where T represents
    the temperature (K) of liquid water, with eta expressed in units of N s m-2 (Roderick
    & Berry, 2001). The values for rho were obtained from table 2 in Bigg (1967).
