  collection_date: 2024-01/2024-10
  taxon_name: Species
  location_name: location_name
  description: A common-environment study of 22 Eucalyptus species, chosen
    as phylogenetically independent contrasts in climate-of-origin temperature or
    precipitation, to test whether greater xylem embolism resistance comes at the
    cost of slower growth, which wood anatomical traits underlie such a trade-off,
    and how growth, embolism resistance and wood anatomy relate to climate-of-origin.
  basis_of_record: captive_cultivated
  life_stage: seedling
  sampling_strategy: 'We sought to identify a set of Eucalyptus species that represented
    diverse climates, chosen as phylogenetically independent contrasts (PICs). Each
    PIC consisted of two closely related species that differed markedly in either
    the mean annual temperatures (MAT) or mean annual precipitation (MAP) across their
    range, but never both. Starting with a Eucalyptus phylogeny encompassing 711 species
    (Thornhill et al., 2019), and a dataset expressing the average climate experienced
    across the range of each of these species (Gallagher et al., 2019), we identified
    six precipitation PICs and five temperature PICs, giving a total of 22 species
    (Supporting Information Table S1; phylogeny presented as Fig. S1). Precipitation
    contrasts represented at least a 140 mm per year or 20% increase from the drier
    to the wetter species (on average 102.4%), at the same time keeping MAT variation
    as low as practically possible (average difference across all contrasts = 0.1°C).
    Temperature contrasts represented at least a 2.5°C increase in MAT from the colder
    to the warmer species, at the same time keeping MAP variation as low as practically
    possible (average difference across all contrasts = 11.5%). Across the 22 species,
    MAT ranged from 10.5 to 20°C, MAP from 309 to 1501 mm (Table 1). ^p We sourced
    all seeds from Australian native plant suppliers (Table S2) and sowed them in
    seedling trays containing a seed-raising mix during early-spring 2023 (austral
    spring). However, germination was only successful for 16 species, which formed
    the first group. For the remaining six species that failed to germinate, seeds
    were resown in mid-summer 2024 (austral summer), forming the second group. Seedlings
    were initially grown in a small polytunnel at Western Sydney University (site
    MAP: 927 mm; site MAT: 17.3°C; 33°33′S, 150°44′E, Richmond, Australia, climate
    data from CHELSA; Karger et al., 2017). After c. 3 months of growth, they were
    relocated to a larger polytunnel at the same site and transferred into 25-l bags
    containing 20 kg of a standard, sand-rich potting mix suitable for Australian
    native plants (‘Native mix’ supplied by Turtle Nursery, Rouse Hill, Australia).
    To help account for potential microclimatic differences within the polytunnel,
    a randomised block design was implemented. Plants were assigned to spatial blocks
    with random positioning within each block, and their locations were rotated periodically
    to further minimise positional effects. We isolated the bags from the ground by
    placing them on pallets, preventing roots from spreading beyond their pots. Three
    days post transplant, all plants were provided with a slow-release, water-soluble
    fertiliser designed to supply nutrients for up to 6 months. Soil water was maintained
    at 100% field capacity throughout the experiment using drip irrigation. The two
    groups of seedlings experienced distinct seasonal growing conditions: the first
    group developed under austral summer conditions (higher temperatures and longer
    day lengths), while the second group experienced the austral winter growing season
    (lower temperatures and shorter day lengths). To account for seasonal differences,
    growing degree days were approximately standardised across groups: the summer-grown
    group was harvested after 6 months growth, and the winter-grown group was harvested
    after 10 months. At the end of their respective growth periods, we successfully
    grew 7–10 individuals per species, except for Eucalyptus regnans F.Muell. (n =
    6), Eucalyptus stricta Sieber ex Spreng. (n = 5), Eucalyptus dawsonii R.T.Baker
    (n = 4), and Eucalyptus grandis W.Hill (n = 3).'
  original_file: Archived data downloaded from Zenodo (doi.org/10.5281/zenodo.20404961)
  notes: Whole-plant leaf area, biomass and relative growth rate data exist in the data.csv file. 
