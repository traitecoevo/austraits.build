dataset:
  data_is_long_format: yes
  custom_R_code: '
    data |>
      dplyr::filter(
        trait_name %in% c(
          "bark_colour", "bark_texture", "bud_bank_location", "bud_length",
          "bud_width", "clonal_spread_mechanism", "dispersal_appendage", "dispersal_syndrome",
          "dispersers", "flower_anther_length", "flower_bract_length", "flower_colour",
          "flower_diameter", "flower_fertile_stamens_count", "flower_filament_length", "flower_length",
          "flower_nectar_production", "flower_ovary_position", "flower_perianth_merism", "flower_perianth_symmetry",
          "flower_petal_length", "flower_scent_production", "flower_sepal_length", "flower_shape",
          "flower_stamen_length", "flower_structural_sex_type", "flower_style_length", "flower_visitor",
          "flowering_cues", "flowering_time", "flowers_per_inflorescence", "fruit_colour",
          "fruit_dehiscence", "fruit_fleshiness", "fruit_height", "fruit_length",
          "fruit_surface_hairs", "fruit_type", "fruit_width", "fruiting_time",
          "germination_cues", "inflorescence_diameter", "inflorescence_length", "inflorescence_shape",
          "inflorescence_type", "leaf_apex_shape", "leaf_arrangement", "leaf_base_shape",
          "leaf_compoundness", "leaf_glaucousness", "leaf_hairs_adult_leaves", "leaf_lamina_division",
          "leaf_lamina_posture", "leaf_length", "leaf_length_to_width_ratio", "leaf_length_type",
          "leaf_margin", "leaf_margin_posture", "leaf_phenology", "leaf_phyllotaxis",
          "leaf_shape", "leaf_surface_colour", "leaf_surface_reflectivity", "leaf_type",
          "leaf_width", "leaflet_count", "leaflet_length", "leaflet_width",
          "life_history", "nitrogen_fixing", "parasitic", "pedicel_length",
          "peduncle_length", "petiole_length", "plant_canopy_form", "plant_climbing_mechanism",
          "plant_diameter_breast_height", "plant_growth_form", "plant_growth_substrate", "plant_height",
          "plant_height_climbing_plant", "plant_photosynthetic_organ", "plant_physical_defence_structures", "plant_succulence",
          "plant_tolerance_frost", "plant_tolerance_salt", "plant_width", "pollination_syndrome",
          "post_fire_recruitment", "resprouting_capacity", "resprouting_capacity_non_fire_disturbance", "seed_colour",
          "seed_height", "seed_length", "seed_shape", "seed_surface_reflectivity",
          "seed_surface_texture", "seed_width", "seedbank_location", "seedling_establishment_conditions",
          "seeds_per_fruit", "sex_type", "stem_branching_form", "stem_diameter",
          "stem_growth_habit", "stem_hairs", "stem_length", "storage_organ",
          "vegetative_reproduction_ability"
        ),
        is.na(measurement_range) | measurement_range != "extreme"
      )
    '
  collection_date: '2026'
  taxon_name: taxon_name
  trait_name: trait_name
  value: value
  description: To compile plant trait values from the taxon descriptions in the Flora
    of Australia online, the national flora of Australia published by the Australian
    Biological Resources Study; family Fabaceae.
  basis_of_record: preserved_specimen
  life_stage: adult
  sampling_strategy: 'Species, subspecies, variety and form profiles of the Flora
    of Australia online (profiles.ala.org.au/opus/foa) were downloaded, together with
    genus and family profiles. Trait values were extracted from the Description, Phenology,
    Ecology, Notes and Habitat text with a scripted parser (ABRS_AtoM_2026/raw/build_data_csv.R):
    each description is split into sentences, clauses and comma-separated segments,
    each segment is assigned to the organ it describes (habit, stem, leaf, phyllode,
    leaflet, inflorescence, flower, fruit, seed, ...), and categorical terms and measurements
    are read from the segments of the relevant organ. Categorical terms are mapped
    to AusTraits trait values, with the source terms kept verbatim in value_description;
    several values are listed in the order they appear in the text, and alternatives
    qualified by a commonness word (usually, rarely, sometimes ...) or a region are
    recorded on separate rows. A measured range is recorded as minimum and maximum
    values, a single measurement as a mean, a single count as a mode, "to X" as a
    maximum and "X or more" as a minimum; parenthetical extremes are kept on separate
    rows (measurement_range = extreme). Ecological traits (fire response, bud bank,
    clonality, dispersal, pollination, tolerances, lifespan) were scored by reading each
    Ecology, Notes and Habitat statement; hedged statements were left unscored. Categorical
    values stated as a single, unqualified value in a genus (or family) description,
    and not contradicted by any member taxon that describes the trait, are copied to
    member taxa whose own description is silent on that trait. Subspecies, varieties
    and forms whose own description is silent on a trait take the values (categorical
    and numeric) from the description of their species. Values that descriptions state
    only when atypical (terrestrial substrate, leaf as photosynthetic organ, not parasitic,
    broadleaf) are recorded on trait_scoring_method = inferred rows when nothing in
    the profile suggests otherwise. The taxa were checked against the source text in
    batches of 500 after extraction, and source typographical errors were corrected
    in the script.'
  original_file: foa_profiles.csv (Flora of Australia online profiles, downloaded
    30 September 2026)
  notes: 'The Flora of Australia extraction is split across datasets by family, to
    keep each data.csv within GitHub file-size limits: ABRS_AtoM_2026 (families A to
    M), ABRS_NtoZ_2026 (families N to Z), and ABRS_Asteraceae_2026, ABRS_Fabaceae_2026,
    ABRS_Myrtaceae_2026 and ABRS_Proteaceae_2026. One parser, raw/build_data_csv.R
    in ABRS_AtoM_2026, builds all of them; this dataset is written in long format.
    The data.csv currently holds the first 1500 of the 1790 Fabaceae taxa in name order
    (Acacia abbatiana to Hovea trisperma var. trisperma); the remaining taxa are being
    checked. Candidate traits not yet in traits.yml (unmapped; mostly organ x character
    traits such as calyx_hairs, extrafloral_nectary_position, standard_flare_colour,
    pistil_length) are listed with their coverage in raw/candidate_traits.csv, which
    the build script rewrites on every full build; custom_R_code keeps only the traits
    mapped below. Rows whose trait_name is a text field (habit_description, leaf_description,
    common_name, ...) carry the verbatim organ-level text and are unmapped. Parenthetical
    extremes (measurement_range = extreme) are in data.csv but not mapped. Source errors
    corrected in the script include Acacia translucens peduncles (cm for mm), Erythrina
    x sykesii wings and keel (mm for cm) and Acacia humifusa seeds (cm for mm).'
