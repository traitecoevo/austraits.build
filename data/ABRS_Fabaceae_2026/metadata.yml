questions:
  question1: Elizabeth Wenk is listed as the data collector (she ran the extraction);
    the Flora of Australia profile authors are recorded per taxon in the profile_author
    rows. Confirm this is the preferred attribution.
  question2: Parenthetical extremes (measurement_range = extreme) are filtered out
    in custom_R_code. Should they be mapped, e.g. as separate minimum / maximum records
    with a context?
  question3: Some population_region values are not regions but positions read from
    the text (extreme, central, central part, extreme base of stems on oldest plants
    - for bark, glands and sepals of Acacia arrecta, A. brachyphylla var. brachyphylla,
    A. coolgardiensis, A. cyclocarpa, A. havilandiorum, A. incongesta, A. obtriangularis,
    A. sulcata var. platyphylla) or habitat words (coastal, temperate). To be fixed
    in the parser with the next batch.
  question4: petiole_shape (flattened, terete; 22 rows) is not mapped because these
    cross-section shapes are not allowed values of petiole_shape (decurrent, not_decurrent,
    slender). Add the values, or a separate trait?
  question5: Papilionaceous standard, wing and keel petal sizes are on flower_petal_length
    entity_measured = standard / wing petals / keel petals rows; the standard is not
    also recorded on a main flower_petal_length row.
