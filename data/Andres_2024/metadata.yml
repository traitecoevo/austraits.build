dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: 2023-03/2023-07
  taxon_name: SPECIES
  location_name: location_name
  description: To determine whether morphological seed traits can predict how native
    Australian species perform when sown in pelletized seed enhancement technologies,
    by comparing total emergence, survival and emergence speed of pelleted and bare
    seeds across 64 species.
  basis_of_record: lab
  life_stage: adult
  sampling_strategy: The 64 species trialed (Table S1) are native to the Sydney Basin
    Bioregion of eastern New South Wales, Australia. Species were selected to maximize
    taxonomic and functional diversity whilst ensuring a range of seed sizes and morphotypes
    were represented to ensure seed trait variation. Two seed provenance locations
    were selected across four of the trialed species (referred to as provenance 1
    and 2 throughout) (Table S1). Seeds were supplied by Greening Australia (Richmond,
    NSW, Australia), the Australian Tree Seed Centre (Canberra, ACT, Australia) (CSIRO)
    and the Australian PlantBank (The Royal Botanic Gardens and Domain Trust) (Mt
    Annan, NSW, Australia). All seeds were stored at 15-20 °C and 30-50% relative
    humidity prior to planting in the experiment to reduce the risk of contamination
    and/or moisture reabsorption. ^p Seeds of dormant species were pretreated prior
    to direct planting or pelleting to cue germination according to the methods outlined
    in (Ralph 2011; Read and Bellairs 1999) (Table S1). Seeds of Fabaceous species
    were submerged in boiling water (approximately 95 °C) for one minute then cooled
    under running water. All other physically dormant species were scarified by gently
    rubbing seeds between two sheets of fine-grit sandpaper. Physiologically dormant
    and/or smoke-responsive species were soaked in a 1:10-diluted solution of liquid
    smoke (Regen2000 Smokemaster, Grayson Australia Tecnica Pty Ltd., Brighton, Australia)
    for 12 h. Wet-treated seeds were dried at ambient temperature overnight. ^p Two
    seed treatments were compared per species and provenance, (1) pellets and (2)
    bare seeds. Each experimental replicate consisted of one pellet and one bare seed
    replicate, each containing three seeds from the same species and seed lot, as
    informed by (Lieurance et al. 2024). Pellet composition was informed by a commercial
    in confidence recipe developed by the Australian revegetation company AirSeed
    Technologies Australia Pty Ltd., Sydney, Australia (AirSeed). Pellets were made
    by combining dry ingredients (soil, compost, clay, charcoal) with water into a
    dough-like mixture, which were then hand-formed into smooth 20 mm-diameter spheres,
    the same size and shape as the pellets manufactured by AirSeed. Three seeds were
    sown on the pellet periphery at three evenly spaced points (approximately 0.5
    cm from one another) to depths equaling the diameter of each seed, which were
    then covered by carefully smoothing the pellet surface. Pellets were dried at
    ambient temperature (22 °C) for 48 h prior to planting. Bare seeds were sown directly
    into the potting substrate at depths equaling the diameter of each seed at three
    evenly spaced points (approximately 0.5 cm from one another). ^p The trial was
    conducted from March (autumn) to July (winter) 2023 within an irrigated greenhouse
    exposed to ambient temperature and relative humidity, located in Dural, NSW, Australia.
    For each species and seed provenance (n = 68), two polyethylene propagation trays
    (48 cm x 30 cm x 80 cm) were filled with a 1:1:1 ratio by volume mix of coconut
    fiber (GrowRite Pty Ltd., Sydney, NSW, Australia), potting mix (Langlands landscape
    supplies Pty Ltd., Dural, NSW, Australia), and medium-grain Chillagoe perlite
    (Ausperl Pty Ltd., Padstow, NSW, Australia). Bare and pelleted seed replicates
    (n = 50 per seed treatment, per species/provenance) were sown equidistantly (approximately
    2 cm apart) in a 5 x 10 grid within each tray (Figure S1). Pellets were placed
    directly onto the substrate surface. Bare seeds, consisting of three 'grouped'
    seeds per replicate, were sown in three individual divots (approximately 2 cm
    apart) at the depth of the diameter of each seed, which were then covered by re-leveling
    the substrate surface. Trays were randomly positioned within the greenhouse and
    were re-randomized every seven days to minimize blocking effects. Trays were watered
    daily via an automated overhead mister system, adjusted for weather conditions
    and water requirements (i.e., lower water requirements in winter). From March
    to June, trays were watered three times a day for 3 min at each watering. From
    June to July (winter), trays were watered once a day for five minutes.
  original_file: Emergence_data.csv, emergence_traits.csv and seed_traits_no_se.csv
    from the authors' OSF repository (https://osf.io/5wc4q/, doi 10.17605/OSF.IO/5WC4Q);
    seed pre-treatments transcribed from Supplementary Table S1 (raw/table_S1.csv).
  notes: data.csv is written by raw/extra_R_code_Andres_2024.R. It has one seed-lot
    row per species x provenance listed in Table S1 (TREATMENT blank; seed morphology
    and seed pre-treatment), plus one row per seed lot x seed treatment (bare seed,
    pellet) with the emergence results from emergence_traits.csv. That file omits
    the 17 seed lot x treatment combinations in which no seedlings emerged. Additional traits,
    seed area (seed_area_Mean, mm2), endosperm area (endosperm_area_Mean, mm2; total storage tissue,
    including the embryo in non-endospermic seeds), seed
    circularity (seed_roundness_Mean, 0-1), seed eccentricity index (eccentricity_index_Mean,
    seed length / seed width), emergence rate index (GRI) and time spread of emergence
    (Time_spread, days). Total emergence (EMERGENCE, % of 50 three-seed replicates
    producing at least one seedling) is not mapped to seed_germination, as it is not
    a proportion of individual seeds. Seedling survival (SURVIVAL, % of emerged replicates
    still alive four weeks after emergence plateaued) and the authors' growth form
    classification (growth_form) are also in data.csv.
