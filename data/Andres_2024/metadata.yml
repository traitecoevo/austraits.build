contexts:
- context_property: seed treatment
  category: treatment_context
  var_in: TREATMENT
  values:
  - value: Bare seed
    description: three seeds sown directly into the potting substrate at a depth equal
      to the seed diameter
  - value: Pellet
    description: three seeds sown into the periphery of a 20 mm diameter pellet of
      soil, compost, clay and charcoal placed on the substrate surface
- context_property: seed provenance
  category: entity_context
  var_in: PROVENANCE
  values:
  - value: future
    description: seed lot from the provenance labelled 'future' by the authors (provenance
      1 in the manuscript)
  - value: regional
    description: seed lot from the provenance labelled 'regional' by the authors (provenance
      2 in the manuscript)
- context_property: seed pre-treatment
  category: method_context
  var_in: germination_pretreatment
  values:
  - find: Wet heat
    value: hot water
    description: seeds submerged in boiling water (approximately 95 °C) for one minute,
      then cooled under running water
  - find: Scarify
    value: scarification
    description: seeds scarified by rubbing between two sheets of fine-grit sandpaper
  - find: Smoke
    value: smoke water
    description: seeds soaked for 12 h in a 1:10 dilution of liquid smoke, then dried
      overnight
  - value: none
    description: seeds not pre-treated
traits:
- var_in: seed_length_Mean
  unit_in: mm
  trait_name: seed_length
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 50
  methods: Seed trait measurements were obtained from images taken using a precision
    cabinet X-ray (KUBTEC Scientific, Stratford, CT, USA) at 4x magnification and
    processed using ImageJ software (version 1.54g). Fifty individual seeds were measured
    per species. The variables measured were seed length (mm), seed width (mm), seed
    coat thickness (mm), endosperm area (mm2), seed area (mm2), and circularity (ratio
    from 0 to 1; 1 corresponding to a perfect circle) using the methods described
    in (Cervantes et al. 2016).
- var_in: seed_width_Mean
  unit_in: mm
  trait_name: seed_width
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 50
  methods: Seed trait measurements were obtained from images taken using a precision
    cabinet X-ray (KUBTEC Scientific, Stratford, CT, USA) at 4x magnification and
    processed using ImageJ software (version 1.54g). Fifty individual seeds were measured
    per species. The variables measured were seed length (mm), seed width (mm), seed
    coat thickness (mm), endosperm area (mm2), seed area (mm2), and circularity (ratio
    from 0 to 1; 1 corresponding to a perfect circle) using the methods described
    in (Cervantes et al. 2016).
- var_in: seed_coat_thickness_Mean
  unit_in: mm
  trait_name: seed_coat_thickness
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 50
  methods: Seed trait measurements were obtained from images taken using a precision
    cabinet X-ray (KUBTEC Scientific, Stratford, CT, USA) at 4x magnification and
    processed using ImageJ software (version 1.54g). Fifty individual seeds were measured
    per species. The variables measured were seed length (mm), seed width (mm), seed
    coat thickness (mm), endosperm area (mm2), seed area (mm2), and circularity (ratio
    from 0 to 1; 1 corresponding to a perfect circle) using the methods described
    in (Cervantes et al. 2016).
- var_in: E:S_Mean
  unit_in: mm2/mm2
  trait_name: seed_reserve_to_seed_area_ratio
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: 50
  methods: Seed trait measurements were obtained from images taken using a precision
    cabinet X-ray (KUBTEC Scientific, Stratford, CT, USA) at 4x magnification and
    processed using ImageJ software (version 1.54g). Fifty individual seeds were measured
    per species. The variables measured were seed length (mm), seed width (mm), seed
    coat thickness (mm), endosperm area (mm2), seed area (mm2), and circularity (ratio
    from 0 to 1; 1 corresponding to a perfect circle) using the methods described
    in (Cervantes et al. 2016). [...] Endosperm area to seed area ratio (E:Sarea)
    was calculated as a fraction of the estimated endosperm to seed area derived from
    our ImageJ processing methods described above. ^p The authors clarified that endosperm
    area is the total internal nutrient-storage tissue filling the seed coat cavity,
    identified by tissue density on the X-ray images; it is the endosperm in endospermic
    seeds and includes the embryo (cotyledons) in non-endospermic seeds such as Fabaceae.
- var_in: seed_pretreatment
  unit_in: .na
  trait_name: seed_germination_treatment
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  life_stage: seedling
  methods: Seeds of dormant species were pretreated prior to direct planting or pelleting
    to cue germination according to the methods outlined in (Ralph 2011; Read and
    Bellairs 1999) (Table S1). Seeds of Fabaceous species were submerged in boiling
    water (approximately 95 °C) for one minute then cooled under running water. All
    other physically dormant species were scarified by gently rubbing seeds between
    two sheets of fine-grit sandpaper. Physiologically dormant and/or smoke-responsive
    species were soaked in a 1:10-diluted solution of liquid smoke (Regen2000 Smokemaster,
    Grayson Australia Tecnica Pty Ltd., Brighton, Australia) for 12 h. ^p Species
    with no pre-treatment listed in Table S1 were sown untreated.
- var_in: Mean_time
  unit_in: d
  trait_name: seed_germination_time
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: ave_emerge
  life_stage: seedling
  methods: Seedling emergence (defined as the first seedling per replicate to successfully
    penetrate the growth substrate or pellet surface) was scored weekly for each species
    and provenance from the date of planting and continued until emergence plateaued
    to zero for all species for 4 weeks (total data collection period was 18 weeks)
    as informed by (Lieurance et al. 2024). When scoring emergence, only the first-emerged
    seedling of each grouped replicate of 3 seeds was counted. [...] The following
    emergence parameters were calculated for each seed treatment across all species/provenances
    at the close of the trial using methods from (Kader 2005), total emergence (%),
    time to emergence (minimum, mean, and maximum; days), emergence rate index (days),
    and time spread of emergence (days).
- var_in: Min_time
  unit_in: d
  trait_name: seed_germination_time
  entity_type: population
  value_type: minimum
  basis_of_value: measurement
  replicates: ave_emerge
  life_stage: seedling
  methods: Seedling emergence (defined as the first seedling per replicate to successfully
    penetrate the growth substrate or pellet surface) was scored weekly for each species
    and provenance from the date of planting and continued until emergence plateaued
    to zero for all species for 4 weeks (total data collection period was 18 weeks)
    as informed by (Lieurance et al. 2024). When scoring emergence, only the first-emerged
    seedling of each grouped replicate of 3 seeds was counted. [...] The following
    emergence parameters were calculated for each seed treatment across all species/provenances
    at the close of the trial using methods from (Kader 2005), total emergence (%),
    time to emergence (minimum, mean, and maximum; days), emergence rate index (days),
    and time spread of emergence (days).
- var_in: Max_time
  unit_in: d
  trait_name: seed_germination_time
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: ave_emerge
  life_stage: seedling
  methods: Seedling emergence (defined as the first seedling per replicate to successfully
    penetrate the growth substrate or pellet surface) was scored weekly for each species
    and provenance from the date of planting and continued until emergence plateaued
    to zero for all species for 4 weeks (total data collection period was 18 weeks)
    as informed by (Lieurance et al. 2024). When scoring emergence, only the first-emerged
    seedling of each grouped replicate of 3 seeds was counted. [...] The following
    emergence parameters were calculated for each seed treatment across all species/provenances
    at the close of the trial using methods from (Kader 2005), total emergence (%),
    time to emergence (minimum, mean, and maximum; days), emergence rate index (days),
    and time spread of emergence (days).
- var_in: Time_to_50%
  unit_in: d
  trait_name: seed_germination_time_to_50_percent
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: ave_emerge
  life_stage: seedling
  methods: Seedling emergence (defined as the first seedling per replicate to successfully
    penetrate the growth substrate or pellet surface) was scored weekly for each species
    and provenance from the date of planting and continued until emergence plateaued
    to zero for all species for 4 weeks (total data collection period was 18 weeks)
    as informed by (Lieurance et al. 2024). When scoring emergence, only the first-emerged
    seedling of each grouped replicate of 3 seeds was counted. [...] The following
    emergence parameters were calculated for each seed treatment across all species/provenances
    at the close of the trial using methods from (Kader 2005), total emergence (%),
    time to emergence (minimum, mean, and maximum; days), emergence rate index (days),
    and time spread of emergence (days). ^p Time to 50% emergence is the number of
    days until half of the replicates that eventually emerged had emerged, interpolated
    between the weekly counts.
