contexts:
- context_property: flower visitor taxon name
  category: entity_context
  var_in: visitor_taxon
- context_property: pollinator count
  category: entity_context
  var_in: n_individuals
- context_property: floral unit count
  category: entity_context
  var_in: n_open_flowers
- context_property: foraging behaviour
  category: entity_context
  var_in: behaviour
  values:
  - find: nectar
    value: nectar feeding
    description: visitor fed on nectar
  - find: pollen
    value: pollen collecting or feeding
    description: visitor collected or fed on pollen
  - find: flower_feeding
    value: florivory
    description: visitor fed on flower tissue
  - find: resting
    value: resting
    description: visitor rested on the flower
  - find: unknown
    value: unknown
    description: visitor behaviour not determined
- context_property: weather conditions
  category: method_context
  var_in: weather
traits:
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: A watch was a 10-minute continuous observation of a patch of open flowers
    of one plant species. Every insect that contacted the flowers was counted and
    identified on the wing or from photographs. Visitors were identified to the finest
    level reliable in the field. Butterflies are identified to species. Most other
    insects are identified to family, with some to genus, subfamily or species. Thrips
    and true bugs are recorded at order level. ^p These data show flower-visitor interactions.
substitutions: .na
taxonomic_updates: .na
exclude_observations:
- variable: taxon_name
  find: Alpinia purpurata
  reason: non-native, non-naturalised taxon (not in APC/APNI)
