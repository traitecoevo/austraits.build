dataset:
  data_is_long_format: no
  custom_R_code: .na
  collection_date: collection_date
  taxon_name: plant_taxon
  location_name: location_name
  individual_id: watch_id
  description: To describe which insects visit the flowers of co-occurring plant species
    in three contrasting plant communities (rainforest, savanna woodland and wet sclerophyll
    woodland) of the Cairns region during the wet season.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Timed observations of insect visitors to flowering plants at
    three sites in the Cairns region, far north Queensland. ^p Surveys ran over two
    wet-season field trips, March 2014 and February 2015. Each site was surveyed on
    four days per trip. All observations were made between 09:00 and 12:00. A watch
    was a 10-minute continuous observation of a patch of open flowers of one plant
    species. Every insect that contacted the flowers was counted and identified on
    the wing or from photographs. The number of open flowers in view and the weather
    (sunny or overcast) were recorded at the start of each watch. Visitors were identified
    to the finest level reliable in the field. Butterflies are identified to species.
    Most other insects are identified to family, with some to genus, subfamily or
    species. Thrips and true bugs are recorded at order level. Behaviour was scored
    as nectar feeding, pollen collecting or feeding, flower feeding (florivory), resting,
    or unknown.
  original_file: watches.csv, visits.csv and sites.csv, described in README.docx and
    supplied by the data contributor; in raw data folder. network_matrix.csv is a
    plant x visitor summary of visits.csv.
  notes: none
identifiers: .na
