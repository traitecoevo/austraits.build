source:
  primary:
    key: Tas_Seed_Conservation_Centre_2026
    bibtype: Online
    author: Tasmanian Seed Conservation Centre
    year: 2026
    title: Tasmanian Seed Conservation Centre dataset from Australian Virtual Seed
      Bank
    publisher: Australian Virtual Seed Bank
    url: https://seedbank.ala.org.au
contributors:
  data_collectors:
  - last_name: Gagnon
    given_name: Yann
    ORCID: .na.character
    affiliation: Royal Tasmanian Botanical Gardens
  - last_name: Wood
    given_name: James
    ORCID: .na.character
    affiliation: Tasmanian Seed Conservation Centre, Royal Tasmanian Botanical Gardens
  - last_name: Eyles
