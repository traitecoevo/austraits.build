  dataset_curators: Elizabeth Wenk
dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        location_name = ifelse(
          !is.na(`Decimal Latitude`),
          paste0("seeds_collected_at_", `Decimal Latitude`, "_lat_and_", `Decimal Longitude`, "_long"),
          NA
        ),
        basis_of_record = ifelse(
          `Plant Source` %in% c("Accession not of wild source.", "Propagule(s) from a wild source plant in cultivation."),
          "captive_cultivated",
          "field"
        ),
        seed_weight = as.numeric(`Thousand Seed Weight`) / 1000,
        seed_weight = ifelse(seed_weight > 0, seed_weight, NA),
        seed_mass_replicates = dplyr::na_if(as.character(`Quantity (count)`), "0")
      ) %>%
      filter(!is.na(`Scientific Name`))
    '
  collection_date: Collection Date
  taxon_name: Scientific Name
  location_name: location_name
  description: Seed trait data from the Tasmanian Seed Conservation Centre, including
    seed mass of collected seeds and data on germination trials.
  life_stage: adult
  sampling_strategy: The Tasmanian Seed Conservation Centre is a seed bank facility
    based at the Royal Tasmanian Botanical Gardens. It was opened in 2005 as part
    of international Millennium Seed Bank Project. The seed bank is focused on the
    native flora of Tasmania, with a particular emphasis on Tasmania's Rare and Threatened
    plants. A small number of introduced weeds and garden exotics are also held. The
    seed bank currently has one full time member of staff and a number of volunteers
    who assist in the processing and curation of the seed collections. Collecting
    priorities for the seed bank are informed and assisted by staff of the Biodiversity
    and Conservation Branch of Department of Primary Industries, Parks, Water and
    Environment. Collection verification is handled by the staff of the Tasmanian
    Herbarium.
  original_file: Data downloaded from the Australian Virtual Seed Bank
    (https://seedbank.ala.org.au) GraphQL API (https://events-databox.ala.org.au/graphql)
    on 10 Nov 2026, all records for the Tasmanian Seed Conservation Centre.
  notes: data.csv has one row per seed accession and one row per germination trial (with
    its treatment and the accession's taxon, locality and dates), distinguished by `Event
    Type`. Rows with `Data Version` = "2025 download" are values from the Feb 2025
    download that are no longer in the Australian Virtual Seed Bank.
identifiers:
- var_in: Accession Number
  identifier_type: catalogNumber
  institution_code: Tasmanian Seed Conservation Centre
locations: locations.csv
contexts:
- context_property: storage temperature (C)
  category: treatment_context
  var_in: Storage Temperature
- context_property: storage seed bank
  category: treatment_context
  var_in: Storage Seed Bank
- context_property: seed collection fill rate
  category: treatment_context
  var_in: Collection Fill Rate / X-Ray
- context_property: seed germination media/substrate
  category: treatment_context
  var_in: Treatment Media/Substrate
- context_property: seed germination day temperature
  category: treatment_context
  var_in: Treatment Day Temp
- context_property: seed germination night temperature
  category: treatment_context
  var_in: Treatment Night Temp
- context_property: seed germination light hours
  category: treatment_context
  var_in: Treatment Light Hours
- context_property: seed germination dark hours
  category: treatment_context
  var_in: Treatment Dark Hours
- context_property: seed germination pretreatment
  category: treatment_context
  var_in: Treatment Pretreatment
- context_property: AVSB data version
  category: method_context
  var_in: Data Version
traits:
- var_in: seed_weight
  unit_in: g
  trait_name: seed_dry_mass
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: seed_mass_replicates
  basis_of_record: basis_of_record
  methods: The mass of 1000 pure seeds or fruits.
- var_in: Adjusted Germination %
  unit_in: '%'
  trait_name: seed_germination
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: Number Tested
  basis_of_record: lab
  methods: The proportion of seeds germinated, expressed as a percentage of the total
    viable seeds tested.
- var_in: Viability %
  unit_in: '%'
  trait_name: seed_viability
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: Number Tested
  basis_of_record: lab
  methods: The proportion of viable seeds in a germination test, determined by the
    number of germinated seeds and those that appear viable from a post-germination
    cut test.
- var_in: Germination Treatment (mapped)
  unit_in: .na
  trait_name: seed_germination_treatment
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  basis_of_record: lab
  methods: Summary of any physical or chemical treatment(s) applied to a seed before
    it is tested. The pretreatment recorded for each germination trial is grouped into
    treatment categories.
substitutions: .na
taxonomic_updates:
- find: Apium prostratum subsp. prostratum var. filiforme
  replace: Apium prostratum subsp. prostratum
  reason: Exact match of the first three words of the taxon name to an APC-accepted
    canonical name (2026-11-11)
  taxonomic_resolution: subspecies
- find: Arthropodium cirratum
  replace: Arthropodium cirrhatum
  reason: Fuzzy match of taxon name to an APNI-listed canonical name once punctuation
    and filler words are removed (2025-02-26)
  taxonomic_resolution: species
- find: Erigeron
  replace: Erigeron sp. [Erigeron; Tas_Seed_Conservation_Centre_2026]
  reason: Exact match of the first word of the taxon name to an APC-accepted genus
    (2026-11-11)
  taxonomic_resolution: genus
