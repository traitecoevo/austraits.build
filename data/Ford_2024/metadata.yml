traits:
- var_in: leaf_mass_per_area
  unit_in: g/cm2
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: For reseeding individuals, trait measurements were made on three healthy
    individuals of each species in each plot. All traits were measured following methods
    outlined by Cornelissen et al. (2003). The healthiest fully extended leaves from
    each seedling were used to measure SLA and leaf nitrogen. Five simple leaves,
    or three compound leaves, were collected from each sample. These were kept refrigerated
    before being scanned with a flatbed scanner. For compound leaves, the rachis was
    included in measurements, and the petiole was included for simple leaves. Leaf
    area was calculated in R using the LeafArea package (Katabuchi, 2015). The leaves
    were then dried at 60°C for 72 h and weighed using an analytical balance (precision
    of 0.001 g). SLA was calculated using the formula in Table 2.
- var_in: leaf_area
  unit_in: cm2
  trait_name: leaf_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: leaf_scan_n_leaves
  methods: For reseeding individuals, trait measurements were made on three healthy
    individuals of each species in each plot. All traits were measured following methods
    outlined by Cornelissen et al. (2003). The healthiest fully extended leaves from
    each seedling were used to measure SLA and leaf nitrogen. Five simple leaves,
    or three compound leaves, were collected from each sample. These were kept refrigerated
    before being scanned with a flatbed scanner. For compound leaves, the rachis was
    included in measurements, and the petiole was included for simple leaves. Leaf
    area was calculated in R using the LeafArea package (Katabuchi, 2015). The leaves
    were then dried at 60°C for 72 h and weighed using an analytical balance (precision
    of 0.001 g). SLA was calculated using the formula in Table 2.
- var_in: leaf_dry_mass
  unit_in: g
  trait_name: leaf_dry_mass
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: leaf_scan_n_leaves
  methods: For reseeding individuals, trait measurements were made on three healthy
    individuals of each species in each plot. All traits were measured following methods
    outlined by Cornelissen et al. (2003). The healthiest fully extended leaves from
    each seedling were used to measure SLA and leaf nitrogen. Five simple leaves,
    or three compound leaves, were collected from each sample. These were kept refrigerated
    before being scanned with a flatbed scanner. For compound leaves, the rachis was
    included in measurements, and the petiole was included for simple leaves. Leaf
    area was calculated in R using the LeafArea package (Katabuchi, 2015). The leaves
    were then dried at 60°C for 72 h and weighed using an analytical balance (precision
    of 0.001 g). SLA was calculated using the formula in Table 2.
- var_in: leaf_scan_compound
  unit_in: .na
  trait_name: leaf_compoundness
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: 1
  methods: Expert observation.
- var_in: Stem_specific_density
  unit_in: g/mm3
  trait_name: wood_density
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: 'For reseeding individuals, trait measurements were made on three healthy
    individuals of each species in each plot. All traits were measured following methods
    outlined by Cornelissen et al. (2003). To measure SSD, a 10 cm section of stem
    was taken at 1/3 of total plant height. For individuals whose total height was
    <10 cm, the entire section of stem, excluding the apical tip, was taken. Stems
    were refrigerated until volume measurements could be taken. Stem volume was approximated
    as the volume of a cylinder, with six diameter measurements taken at equidistant
    intervals along each stem. The mean stem diameter for each individual was used
    to calculate fresh stem volume using the formula: volume = (0.5D)2pi x h. The
    stems were then dried at 60°C for 72 h before being weighed using an analytical
    balance (precision of 0.001 g). SSD was calculated using the formula outlined
    in Table 2.'
- var_in: resprouting_capacity
  unit_in: .na
  trait_name: resprouting_capacity
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: resprouting_replicates
  methods: Expert observation.
- var_in: bud_bank_location
  unit_in: .na
  trait_name: bud_bank_location
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: 1
  methods: Expert observation.
- var_in: storage_organ
  unit_in: .na
  trait_name: storage_organ
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  replicates: 1
  methods: Expert observation.
- var_in: leaf_N_per_dry_mass
  unit_in: '%'
  trait_name: leaf_N_per_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: n_bagged_individuals
  methods: For reseeding individuals, additional trait measurements were made on three
    healthy individuals of each species in each plot. All traits were measured following
    methods outlined by Cornelissen et al. (2003). The healthiest fully extended leaves
    from each seedling were used to measure SLA and leaf nitrogen. Five simple leaves,
    or three compound leaves, were collected from each sample. These were kept refrigerated
    before being scanned with a flatbed scanner. For compound leaves, the rachis was
    included in measurements, and the petiole was included for simple leaves. The
    leaves of conspecific reseeding individuals from the same plot were combined to
    attain enough leaf mass for nitrogen analysis. They were dried at 60°C for 72
    h, and the percentage nitrogen per mass was determined using the LECO TruMac CNS
    Analyser at Southern Cross University. This was then converted into nitrogen per
    leaf area (Narea; formula in Table 2).
