dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        reproductive_stage = case_when(
          Flowering == "y" | !is.na(Seeds_or_Buds) ~ "adult",
          sample_type == "individual" ~ "sapling"
        )
      ) %>%
      group_by(site_code, taxon_code) %>%
        mutate(reproductive_stage = if_else(sample_type == "pooled_nitrogen_sample",
          if_else(any(sample_type == "individual" & !is.na(original_code)) &
            all(reproductive_stage[sample_type == "individual" & !is.na(original_code)] == "adult"), "adult", "sapling"),
          reproductive_stage)) %>%
      ungroup() %>%
      group_by(site_code, taxon_code) %>%
        mutate(n_bagged_individuals = sum(sample_type == "individual" & !is.na(original_code))) %>%
      ungroup() %>%
      mutate(
        fire_response = case_when(
          Seed_v_sprout == "seed" ~ "fire_killed",
          Seed_v_sprout %in% c("sprout", "lignotuber") ~ "resprouts"
        ),
        bud_bank_location = if_else(Seed_v_sprout == "lignotuber", "lignotuber", NA_character_),
        storage_organ = bud_bank_location,
        leaf_dry_mass_total = Leaf_dry_mass + replace_na(Leaf_dry_mass_2, 0) + replace_na(Leaf_dry_mass_3, 0),
        leaf_mass_per_area = leaf_dry_mass_total / leaf_scan_area_tot_cm2,
        leaf_area = leaf_scan_area_tot_cm2 / leaf_scan_n_leaves,
        leaf_dry_mass = leaf_dry_mass_total / leaf_scan_n_leaves,
        sla_outlier = !is.na(leaf_mass_per_area) & (0.1 / leaf_mass_per_area < 2 | 0.1 / leaf_mass_per_area >= 31),
        leaf_mass_per_area = if_else(sla_outlier, NA_real_, leaf_mass_per_area),
        leaf_area = if_else(sla_outlier, NA_real_, leaf_area),
        leaf_dry_mass = if_else(sla_outlier, NA_real_, leaf_dry_mass),
        Stem_specific_density = if_else(Stem_specific_density * 1000 <= 0.1 | Stem_specific_density * 1000 > 1, NA_real_, Stem_specific_density)
      ) %>%
      group_by(site_code, taxon_code) %>%
        mutate(
          resprouting_capacity = if_else(row_number() == 1, paste(sort(unique(na.omit(fire_response))), collapse = " "), NA_character_),
          resprouting_capacity = na_if(resprouting_capacity, ""),
          resprouting_replicates = sum(!is.na(fire_response))
        ) %>%
      ungroup() |>
      generate_observation_numbers(species_name, site_code) |>
      mutate(observation_number = ifelse(species_name == "Pultenaea retusa" & site_code == "MER-3", observation_number, NA))
    '
  collection_date: unknown
  taxon_name: species_name
  location_name: site_code
  individual_id: .na
  description: A study that took advantage of the 2019-2020 megafires in New South
    Wales that were followed by high rainfall mass to test hypothesised relationships
    between functional traits and growth across six spatially distributed sclerophyllous
    systems throughout NSW that displayed synchronous regeneration.
  basis_of_record: field
  life_stage: reproductive_stage
  sampling_strategy: '2.1 Study site selection ^p The megafires of 2019-2020 were
    of unprecedented extent, burning 97,000 km2 of southern and eastern Australia
    (Boer et al., 2020; Ward et al., 2020) and were followed by high rainfall throughout
    February and March of 2020 (Bureau of Meteorology, 2011). The most extensively
    burned areas were eucalyptus forests and woodlands (Godfree et al., 2021), in
    which fire forms an intrinsic part of the landscape and many plants possess fire-adapted
    traits (Auld & Ooi, 2008; Clarke et al., 2015; Gill, 1975; Morgan et al., 2020).
    As a result, post-fire recovery in these vegetation communities occurred in a
    natural regeneration state. The extent of these fires, and the ensuing rain, created
    a novel situation in which recruitment occurred synchronously across vast areas,
    enabling the implementation of a large-scale field study in which individuals
    were at the same ontogenetic stage. ^p In this study, we focused on eucalypt-dominated
    sclerophyll forests with a tall, somewhat open, canopy. These systems contain
    a high diversity of small to mid-size shrubs that have fire adapted traits. Acacia
    and Banksia were consistent genera across sites. Abiotic conditions, including
    rainfall and temperature, vary across the study area (Table S1); however, these
    environmental differences are not of specific interest in this study, outside
    of indicating the robustness of the trait-height growth rate relationships across
    different environments. ^p We conducted sampling across six sites throughout New
    South Wales: The Blue Mountains National Park, Bargo State Conservation Area,
    Meroo National Park, Murramarang National Park, Eurobodalla National Park and
    Ben Boyd National Park (Figure 1). See Table S2 for species lists for each site.
    Sites were standardised by having been burned to a ''very high'' fire severity
    during the 2019-2020 megafires. This is the highest class of burn severity and
    is classified by the canopy having been entirely destroyed (Roff & Aravena, 2020),
    maximising the likelihood that germinating plants across each site would have
    had high light access during initial growth. Burn severity and vegetation type
    were determined using the NSW Government''s Google Earth Engine Burnt Area Map
    (State Government of NSW and Department of Planning, Industry and Environment,
    2020), and confirmed through communication with the NSW National Parks and Wildlife
    Service. Sampling was conducted between the 20th of April and the 28th of May,
    2021, with the Blue Mountains sampled first, followed by Bargo, Meroo, Murramarang,
    Eurobodalla and Ben Boyd. Work was conducted under scientific licences SL102365
    and SL10239, granted by the Department of Planning, Industry and Environment.
    To determine the age of regenerating vegetation, rainfall data for each site from
    January 2020 (the end of the fires) to May 2021 (the end of sampling) was compiled
    from the Bureau of Meteorology, using data from the closest weather station to
    each site (Bureau of Meteorology, 2011). Germination at each site was estimated
    to have occurred after the high rainfall in February 2020 (see Figure S1), making
    vegetation approximately 14 (Blue Mountain and Bargo sites) or 15 months old (Meroo,
    Murramarang, Eurobodalla and Ben Boyd sites) at the time of sampling. ^p 2.2 Field
    measurements ^p To capture natural local variation within each site, three plots
    were established. In each, sampling was conducted intensively along a 25 m transect,
    with additional individuals of represented species collected from within 15 m
    on either side of this transect, to ensure all available species were included.
    Each plot was separated by a minimum distance of 500 m and set at a minimum of
    50 m from roads or water sources. ^p To standardise by age, only vegetation that
    had regenerated after the 2019-2020 bushfires was included in this study. Sampling
    was restricted to native woody or herbaceous angiosperms regrowing from the ground.
    To enable growth comparisons across plants employing different regeneration strategies,
    vegetation was divided into two categories: reseeders and basal-resprouters (hereafter
    ''resprouters''). Reseeders are individuals that have grown back from seed; resprouters
    are those that have resprouted from existing below-ground biomass (Verdú, 2000).
    Resprouting individuals that remained attached to pre-existing living above-ground
    biomass were excluded. In instances where a species possessed both reseeding and
    resprouting capabilities, separate measurements were made for each regeneration
    type. ^p The heights of at least five of the healthiest individuals of each species
    were measured in each plot. Plant height was measured from the base to the tip
    of the youngest fully extended leaf, following Cornelissen et al. (2003). Record
    was made of whether an individual possessed reproductive material (flowers, fruits
    or seed pods), indicating a shift in energy investment from maximising height-growth
    to recruitment. For reseeding species, two stem diameter measurements were also
    taken: (1) diameter at base and (2) stem diameter at 20 cm from the tip of the
    youngest fully extended leaf (hereafter ''diameter at 20 cm''). For species whose
    total height was less than 20 cm, base diameter measurements were used for both.'
  original_file: original files downloaded from https://doi.org/10.5281/zenodo.13956081 and merged using data contributor scripts and Claude (Anthropic)
  notes: Stem_specific_density (stem dry weight / stem volume, g/mm3) is mapped to
    wood_density even for herbaceous taxa.
