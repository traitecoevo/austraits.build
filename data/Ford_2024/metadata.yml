questions:
  question0: Do you have lat/long for your sites? Can you give a basic vegetation description for each (e.g sclerophyll woodland or sclerophyll wet forest)
  questipon00: Do you have collection dates? Approximate is fine.
  question1: Sorry about all the Claude questions that follow - but I will check with you on each.
  question1a: Leaf nitrogen samples (Nitrogen_Analysis_data.xlsx) are coded only to
    site-plot-taxon (e.g. `BAR-1-ALLS`), without an individual suffix, and most match
    plots where three individuals were bagged; they are therefore treated as pooled
    samples and kept as separate `pooled_nitrogen_sample` rows in data.csv rather
    than assigned to individuals. Confirm leaf material was pooled across the bagged
    individuals.
  question2: What does the nitrogen `Pure/mixed` column mean? `Pure` samples still
    usually correspond to three bagged individuals, so it does not appear to distinguish
    single versus pooled individuals. Two samples (`EURO-3-WWL`, `MER-1-MASV`) are
    instead labelled `Biomass`.
  question3: At Meroo plot 1, two rows have `Field_name` `WWL` (Pultenaea linophylla)
    but bag codes `MER-1-WLW-2` and `MER-1-WLW-3` (Acacia suaveolens). The bag code
    (WLW) has been used, since the adjacent rows and `MER-1-WLW-1` are WLW. Is this
    correct?
  question4: The nitrogen sample `BM-3-BLRS` has no matching bagged individuals; the
    raw data have three unbagged "Blue Leaf Red Stem Euc" plants at Blue Mountains
    plot 3, which are presumably the same taxon. leaf_scan_results.csv also has scans
    for `BM-3-BLRS-1` to `-3`, so these plants were evidently bagged; the scans are
    not merged because no row carries those bag codes. Confirm these represent the
    same taxon.
  question5: Thirty taxon codes/field names have no match in Species_list.xlsx, including
    `PSWL`, `DBE`, `ME`, `AE`, `C` and `LCL` (the first five also have nitrogen data),
    and descriptive field names such as "Fake Secret Spike", "Spotted Gum", "Pointy
    Pink Leptospermum" and "Round Yellow Flower". Can these be identified?
  question6: For 23 bagged plants the number at the end of the bag code differs from
    the `Measured` count (e.g. `BAR-2-CL-1` has `Measured` = 7), suggesting bags were
    numbered only among sampled plants. Confirm this interpretation.
  question10: The contributor's code (Hypothesis 3- Seed v Sprout.Rmd) renames `lignotuber`
    to "Reseeders with lignotuber", i.e. these are seedlings that have a lignotuber,
    not resprouting individuals. They are currently counted as `resprouts` for resprouting_capacity
    and as lignotuber for bud_bank_location / storage_organ. Confirm how they should
    be treated.
  question11: Leaf scans (leaf_scan_results.csv) are summed per individual and matched
    by image name; for 7 images (MURR-1-AL-1, BB-2-BBA-1, BM-1-OSWL-2) the file's
    `spp`/`ind` columns were mis-parsed, so these were dropped from the contributor's
    own join but are included here. `BB-1-BBE-3` has leaf mass but no scan; BAR-1-SWNL-1,
    BAR-2-SWNL-1, BAR-3-BSNL-1, BAR-3-DP-1, BM-3-MSNL-2, MER-1-SWL-3 and MER-3-WLW-2
    have scans but no leaf mass; and one image each for EURO-3-EAML-1, EURO-3-PSWL-2,
    EURO-3-PSWL-3 and MER-3-AAML-3 has no area, so these have no leaf_mass_per_area.
