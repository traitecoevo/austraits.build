dataset:
  data_is_long_format: no
  custom_R_code: ' 
    data |> 
      mutate(
        taxon_name = paste0(Genus, " ", species, " subsp. ", subspecies), 
        flower_visitor = case_when(
          !is.na(`Species if known`) ~ `Species if known`, 
          Order == "Hymenoptera" ~ Family, 
          Family == "Syrphidae" ~ Family, 
          TRUE  ~ Order), 
        flower_visitor_identity = case_when(
         !is.na(`Species if known`) ~ `Species if known`, 
         TRUE ~ Family) 
      ) '
  collection_date: Dates
  taxon_name: taxon_name
  location_name: Location
  description: A study to investigate the reproductive ecology of the native perennial
    herb, Trachymene incisa subsp. incisa.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Study species ^p Trachymene incisa subsp. incisa (T. incisa hereafter)
    is an endemic erect perennial herb with a thick tuberous taproot (Watson 2000).
    It occurs in dry eucalypt woodland or scrub, sclerophyll forest and cleared areas
    along the coastal regions of New South Wales and Queensland (Powell 1992; Benson
    and McDougall 1993). It grows on sandy infertile soils and rock crevices, to a
    height of about 80 cm (Benson and McDougall 1993). ^p Trachymene incisa has bisexual
    flowers that are arranged in simple umbels. The umbels are arranged in a uniform
    branching pattern with the secondary umbels (second set to flower) branching off
    the flowering stalk of the terminal primary umbel (first to flower) and the tertiary
    umbels branching off the flowering stalk of the secondary umbels and so forth.
    Usually, there are up to four orders of umbels during a flowering season (Y. C.
    Davila, pers. obs.). In this study, the umbel was used as the unit for attraction
    and manipulation (i.e. for breeding system experiments). ^p Study site ^p Field
    work was carried out from February to June 1999 and from January to April 2000,
    at Agnes Banks Woodland, in western Sydney, New South Wales, Australia (33°38′S,
    150°41′E). Benson (1981) recognised five plant communities at Agnes Banks, including
    low woodlands on deep sand, with an understorey of heath and small areas of open
    scrub (Benson and Howell 1990; Benson et al. 1996). T. incisa is common on the
    nutrient-depleted sandy soils of Agnes Banks Nature Reserve (Benson and McDougall
    1993). Plants used in this study were located near the entry to the nature reserve,
    bordered by the road and walking tracks. This side of the reserve was exposed
    to a fire in October 1998 (G. M. Wardle, pers. obs.), which scorched all understorey
    vegetation. T. incisa was among the first ground-cover species to re-sprout after
    the fire and was in high numbers and flowering by January 1999. In 2000, Agnes
    Banks Woodland (which covers approximately half of the nature reserve) was listed
    as an Endangered Ecological Community, with T. incisa as an identifying species
    (NSW NPWS 2000). ^p Insect visitors ^p Diurnal insect visitors to T. incisa umbels
    were collected opportunistically throughout the 1999 flowering season. Insects
    were caught in a sweep net and placed in an ethyl-acetate kill jar (Kearns and
    Inouye 1993). Insects were identified to family level or lower where possible
    by researchers at the School of Biological Sciences, University of Sydney and
    the Australian Museum.
  original_file: Genus-DOI columns (flower-visitor records) are the file submitted
    by the data contributor; the additional Trachymene incisa reproductive-ecology
    columns were extracted from the source PDF by Claude AI, Anthropic, and are recorded
    in raw/trait_data.csv and raw/location_data.csv
  notes: Data exist for additional traits, umbels_per_plant, floral_stalks_per_plant,
    leaves_per_plant, proportion_umbels_setting_seed, pollen_grains_per_anther, pollen_ovule_ratio,
    seed_set, seedling_age_at_first_leaf
