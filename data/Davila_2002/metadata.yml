traits:
- var_in: flower_visitor
  unit_in: .na
  trait_name: flower_visitor
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Diurnal insect visitors to T. incisa umbels were collected opportunistically
    throughout the 1999 flowering season. Insects were caught in a sweep net and placed
    in an ethyl-acetate kill jar (Kearns and Inouye 1993). Insects were identified
    to family level or lower where possible by researchers at the School of Biological
    Sciences, University of Sydney and the Australian Museum.
- var_in: plant_growth_form
  unit_in: .na
  trait_name: plant_growth_form
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Growth form as described in Methods, Study species (p.620), "endemic erect
    perennial herb with a thick tuberous taproot."
- var_in: life_history
  unit_in: .na
  trait_name: life_history
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Perennial life history as stated in Methods, Study species (p.620).
- var_in: flower_structural_sex_type
  unit_in: .na
  trait_name: flower_structural_sex_type
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Floral sex as stated in Methods, Study species (p.620), "Trachymene incisa
    has bisexual flowers that are arranged in simple umbels."
- var_in: inflorescence_type
  unit_in: .na
  trait_name: inflorescence_type
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Inflorescence type as stated in Methods, Study species (p.620), flowers
    "arranged in simple umbels."
- var_in: flower_colour
  unit_in: .na
  trait_name: flower_colour
  entity_type: species
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  methods: Flower colour as stated in Results, Floral architecture and reproductive
    effort (p.622), "72.0 ± 2.0 (n = 74) white flowers per umbel."
- var_in: flower_ovules_per_functional_carpel_count ({count})
  unit_in: '{count}'
  trait_name: flower_ovules_per_functional_carpel_count
  entity_type: species
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: Ovules per flower as stated in Discussion (p.624), "2 ovules per flower."
- var_in: plant_height (maximum) (cm)
  unit_in: cm
  trait_name: plant_height
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: .na
  methods: Maximum vegetative height as stated in Methods, Study species (p.620),
    grows "to a height of about 80 cm."
- var_in: breeding_system
  unit_in: .na
  trait_name: breeding_system
  entity_type: population
  value_type: mode
  basis_of_value: expert_score
  basis_of_record: field_experiment
  replicates: .na
  methods: Determined indirectly by pollen:ovule ratio (760 ± 26.5 pollen grains per
    anther, n = 20; pollen:ovule ratio 1902:1, corresponding to a facultatively xenogamous
    breeding system under Cruden's (1977) classification) and directly via hand-pollination
    experiments comparing self-, cross-, mixed-load-, supplementary- and open-pollination
    treatments (Results, Breeding system, p.623). Discussion (p.624-625) confirms
    the species "is self-compatible" -- recorded as self-compatible, with mixed mating
    system also recorded as the closest match for the facultative xenogamy result
    (AusTraits' breeding_system vocabulary has no separate "facultative xenogamy"
    value; see substitutions).
- var_in: flowers_per_inflorescence (mean) ({count})
  unit_in: '{count}/{count}'
  trait_name: flowers_per_inflorescence
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: .na
  methods: Number of flowers per umbel, counted for 74 umbels collected across the
    1999 flowering period (pooled value), and separately for 10 umbels each from the
    primary, secondary and tertiary umbel positions (Results, Floral architecture
    and reproductive effort, p.622). No significant difference was found among umbel
    orders (F2,27 = 0.8468, P = 0.4398).
- var_in: seed_count (raw) ({count})
  unit_in: '{count}'
  trait_name: seed_count
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: Estimated total seed production per plant, calculated in the Discussion
    (p.624) from component means (40 umbels/plant x 44.9% of umbels setting seed x
    72 flowers/umbel x 2 ovules/flower x natural seed-set rate), not a value directly
    counted from harvested seed.
- var_in: seed_germination (mean) (%)
  unit_in: '%'
  trait_name: seed_germination
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: .na
  methods: Percentage germination of seeds sown on moistened filter paper in sealed
    Petri dishes for 7 weeks, separately for self-, cross- and open-hand-pollinated
    umbels (Results, Germination of self-, cross- and open-pollinated seeds, p.623;
    n = 4, 6 and 6 umbels respectively); and separately, final percentage emergence
    (visible shoot) of seeds sown in soil-filled seedling trays and censused for 74
    days, for umbels collected across 10 flowering-date cohorts in 1999 (Results,
    Germination of seeds pollinated at different times during the flowering period,
    p.623; n = 30 umbels pooled across cohorts).
- var_in: seed_dry_mass (mean) (mg)
  unit_in: mg
  trait_name: seed_dry_mass
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: .na
  methods: Mean seed mass of harvested umbels, separately for self-, cross- and open-hand-pollinated
    treatments (Results, Germination of self-, cross- and open-pollinated seeds, p.623;
    n = 4, 6 and 6 umbels respectively).
- var_in: flowering_time
  unit_in: .na
  trait_name: flowering_time
  entity_type: population
  value_type: mode
  basis_of_value: measurement
  replicates: .na
  methods: Onset, peak and cessation of population flowering as casually observed
    at Agnes Banks Nature Reserve across two consecutive seasons (Results, p.622),
    a fire-disrupted 1998-99 season (onset delayed to mid-December 1998 by an October
    1998 fire, peak March, ceasing early June 1999) and a following 1999-2000 season
    described as a return to normal timing (onset October, peak February, ceasing
    June 2000).
- var_in: fire_time_from_fire_to_flowering (mo)
  unit_in: mo
  trait_name: fire_time_from_fire_to_flowering
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: Approximate interval from the October 1998 fire at Agnes Banks Nature Reserve
    to the onset of population flowering, delayed to about mid-December 1998 (Results,
    p.622); estimated from the stated months, not an exact duration given in the source.
- var_in: fire_time_from_fire_to_peak_flowering (mo)
  unit_in: mo
  trait_name: fire_time_from_fire_to_peak_flowering
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: .na
  methods: Approximate interval from the October 1998 fire to peak population flowering
    in March 1999 (Results, p.622); estimated from the stated months, not an exact
    duration given in the source.
