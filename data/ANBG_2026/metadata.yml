dataset:
  data_is_long_format: no
  custom_R_code: '
    data %>%
      mutate(
        `Decimal Latitude` = dplyr::case_when(
          `Accession Number` %in% c("CANB 916974.2", "CANB 916974.3", "CANB 916974.4", "CANB 916974.5") ~
            -abs(as.numeric(`Decimal Latitude`)),
          `Accession Number` %in% "CANB 960384.2" ~ -35.8331,
          .default = as.numeric(`Decimal Latitude`)
        ),
        location_name = ifelse(
          !is.na(`Decimal Latitude`),
          paste0("seeds_collected_at_", `Decimal Latitude`, "_lat_and_", `Decimal Longitude`, "_long"),
          NA
        ),
        collection_date = dplyr::coalesce(
          as.character(`Collection Date`),
          stringr::str_sub(as.character(`Storage Date`), 1, 4),
          stringr::str_sub(as.character(`Date Tested`), 1, 4),
          "2026"
        ),
        measurement_remarks = ifelse(!is.na(Collector), paste0("Collector: ", Collector), NA),
        basis_of_record = ifelse(Cultivated %in% c("Z", "G", "cultivated"), "captive_cultivated", "field"),
        seed_weight = as.numeric(`Thousand Seed Weight`) / 1000,
        seed_weight = ifelse(is.na(omit_duplicate) & seed_weight > 0, seed_weight, NA),
        seed_mass_replicates = as.character(round(dplyr::coalesce(
          as.numeric(`Quantity (g)`) * 1000 / as.numeric(`Thousand Seed Weight`),
          as.numeric(`Quantity (count)`)
        ))),
        seed_mass_replicates = dplyr::na_if(seed_mass_replicates, "0"),
        germination_unadjusted = ifelse(
          is.na(`Adjusted Germination %`) & as.numeric(`Number Tested`) > 0,
          100 * as.numeric(`Number Germinated`) / as.numeric(`Number Tested`),
          NA
        )
      ) %>%
      filter(!is.na(`Scientific Name`)) %>%
      filter(!(`Scientific Name` == "Azorella polaris" & Locality %in% "CULTIVATED: Dunedin Botanic Gardens.")) %>%
      filter(!`Accession Number` %in% c("CBG 9710138.2", "CBG 9702921.2", "CANB 808433.2"))
    '
  collection_date: collection_date
  taxon_name: Scientific Name
  location_name: location_name
  description: Seed trait data from the National Seedbank, including seed mass of
    collected seeds and data on germination trials.
  life_stage: adult
  measurement_remarks: measurement_remarks
  sampling_strategy: The National Seed Bank is an integral part of the ex-situ collections
    of the Australian National Botanic Gardens in Canberra. By conducting research, the
    National Seed Bank team is extending the breadth of knowledge on how to collect, process,
    store and germinate native seeds as we increase the number of different plant species
    held in our collection. The National Seed Bank holds more than 7,700 seed accessions
    from more than 4,000 different plant taxa, 139 of which are threatened species. The
    National Seed Bank has focused seed collecting efforts on plant species endemic to
    the local alpine, subalpine and grasslands regions. Our work has been fuelled by the
    increasing threat of climate change and human impact upon the Australian alpine flora.
  original_file: Data downloaded from the Australian Virtual Seed Bank
    (https://seedbank.ala.org.au) GraphQL API (https://events-databox.ala.org.au/graphql)
    on 10 Nov 2026, all records for the National Seed Bank (data resource dr21622).
  notes: data.csv has one row per seed accession (seed mass, storage) and one row per
    germination trial (with its treatment and the accession's taxon, locality and dates),
    distinguished by `Event Type`. Seed mass is not mapped for accessions whose seed mass
    is already in ANBG_2019 (`omit_duplicate`; ANBG_2019 item_ID = NSB accession Event
    ID). Where an accession has no collection date, collection_date is the year it went
    into storage, else the year of the germination test, else 2026 (download year). Rows
    with `Data Version` = "2025 download" are values from the Feb 2025 download that are
    no longer in the Australian Virtual Seed Bank. The one Azorella polaris accession from
    a plant cultivated at Dunedin Botanic Gardens (NZ) is filtered out in custom_R_code;
    the species' Macquarie Island accessions are kept. Three accessions collected outside
    Australia are also filtered out, Cassinia leptophylla CBG 9710138.2 (Flagstaff, Dunedin,
    NZ), Olearia semidentata CBG 9702921.2 (Chatham Island, NZ) and Lecanora CANB 808433.2
    (Rarotonga, Cook Islands). The latitude of Triplarina
    nowraensis accession CANB 916974.2 (and its trial sub-lots .3 to .5) is given as
    34.89227 and is made negative in custom_R_code. The latitude of Leptospermum
    namadgiense accession CANB 960384.2 (Sentry Box Mountain, Namadgi National Park) is
    given as -38.8331 and is corrected to -35.8331 in custom_R_code.
identifiers:
- var_in: Accession Number
  identifier_type: catalogNumber
  institution_code: Australian National Botanic Gardens
locations: locations.csv
contexts:
- context_property: seed purity (%)
  category: entity_context
  var_in: Purity
- context_property: storage temperature (C)
  category: treatment_context
  var_in: Storage Temperature
- context_property: storage seed bank
  category: treatment_context
  var_in: Storage Seed Bank
- context_property: seed collection fill rate
  category: treatment_context
  var_in: Collection fill / X-ray
- context_property: seed germination media/substrate
  category: treatment_context
  var_in: Treatment Media/Substrate
- context_property: seed germination day temperature
  category: treatment_context
  var_in: Treatment Day Temp
- context_property: seed germination night temperature
  category: treatment_context
  var_in: Treatment Night Temp
- context_property: seed germination light hours
  category: treatment_context
  var_in: Treatment Light Hours
- context_property: seed germination dark hours
  category: treatment_context
  var_in: Treatment Dark Hours
- context_property: seed germination test length
  category: treatment_context
  var_in: Test Length
- context_property: AVSB data version
  category: method_context
  var_in: Data Version
traits:
- var_in: seed_weight
  unit_in: g
  trait_name: seed_dry_mass
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: seed_mass_replicates
  basis_of_record: basis_of_record
  methods: The mass of 1000 pure seeds or fruits.
- var_in: Viability %
  unit_in: '%'
  trait_name: seed_viability
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: Number Tested
  basis_of_record: lab
  methods: The proportion of viable seeds in a germination test, determined by the
    number of germinated seeds and those that appear viable from a post-germination
    cut test.
- var_in: Adjusted Germination %
  unit_in: '%'
  trait_name: seed_germination
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: Number Tested
  basis_of_record: lab
  methods: The proportion of seeds germinated, expressed as a percentage of the total
    viable seeds tested.
- var_in: germination_unadjusted
  unit_in: '%'
  trait_name: seed_germination
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: Number Tested
  basis_of_record: lab
  methods: The number of seeds germinated as a percentage of the number of seeds tested,
    for trials without an adjusted germination percentage.
- var_in: Germination Treatment (mapped)
  unit_in: .na
  trait_name: seed_germination_treatment
  entity_type: individual
  value_type: mode
  basis_of_value: expert_score
  replicates: .na
  basis_of_record: lab
  methods: Summary of any physical or chemical treatment(s) applied to a seed before
    it is tested. The pretreatment recorded for each germination trial is grouped into
    treatment categories.
substitutions: .na
