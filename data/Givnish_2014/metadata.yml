  location_name: location_name
  description: To test whether maximum tree height of Eucalyptus along a rainfall
    gradient is set by hydraulic limitation, by the allocational allometry of dry
    mass, or by both, using carbon isotope discrimination as a measure of stomatal
    limitation of photosynthesis.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Variation in stomatal limitation with increasing rainfall has
    been investigated previously along rainfall gradients from the Australian periphery
    to the dry interior in the northern, eastern, and southwestern portions of the
    continent (Stewart et al. 1995, Schulze et al. 1998, Miller et al. 2001, Schulze
    et al. 2006, Turner et al. 2008, Hutley et al. 2011). Our Victoria transect in
    southeastern Australia (Fig. 3) includes a narrow, 3° band of latitude where rainfall
    is nearly aseasonal, total rainfall and tree height decline steeply to the north,
    while pan evaporation (Ep) rises sharply and mean annual temperature and day length
    increase only modestly. Pan evaporation, the empirically determined rate of water
    loss per unit area from water in open pans, is not the same as potential evapotranspiration
    (PET), the modeled rate of water loss from short, well-watered crops, often estimated
    using the Penman-Monteith equation. PET varies from 0.35 to 0.85 Ep, depending
    on external conditions (Allen et al. 1998). Soils become more alkaline and coarse-grained
    to the north, and elevations exceed 300 m above sea level only in the Yarra Ranges
    and its foothills in the south (Victorian Resources Online 2012). ^p Nineteen
    sites were chosen for study, based on (1) dominance of the canopy by native Eucalyptus
    species; (2) location on well-drained slopes or convex landforms, to avoid trees
    tapping shallow water tables on extensive flats; (3) greater tree height than
    other nearby stands; and (4) stratification of sites across the transect based
    on annual rainfall. The tallest trees were standing dead in the Wallaby Creek
    catchment of Kinglake National Park, killed by the Black Saturday bushfires of
    February 2010, including the skeleton of what had been until recently the tallest
    living tree on the Australian mainland, Eucalyptus regnans at 92 m (Mifsud 2002).
    All other stands sampled were composed entirely of living trees. Sites were chosen
    without detailed knowledge of past fires, but criterion (3) should have resulted
    in selecting sites with fewer catastrophic fires limiting tree height than others
    nearby. In general, fire frequency might be expected to increase from temperate
    rain forests and tall sclerophyll forests at high rainfall to woodlands at intermediate
    rainfall, and then decline with further decreases in rainfall toward mallee, given
    its low coverage and low rates of fuel accumulation. Natural vegetation is essentially
    continuous in the Yarra Ranges but becomes increasingly fragmented northward,
    where most naturally regenerating stands are restricted to state and national
    forests and parks. ^p Site latitude and longitude were measured using a hand-held
    GPS (GPSMap 62s, Garmin, Olathe, Kansas, USA). We used these coordinates and altitude
    derived from a digital elevation model to predict average annual rainfall P, pan
    evaporation Ep, and the ratio P/Ep using ESOCLIM (Centre for Resource and Environmental
    Studies 2012). At each site, we estimated the heights of the tallest 3–6 individuals
    using a laser level (TruPulse 200, Laser Technology, Centennial, Colorado, USA).
    [...] Dominant Eucalyptus species were identified following Nicolle (2006).
  original_file: Appendix A Table A1 of Givnish et al. (2014), Ecological Archives
    E095-259-A1, transcribed into raw/trait_data.csv; leaf mass per area from Transects_data.csv
    in the Alam et al. (2026) Dryad data repository, doi:10.5061/dryad.zgmsbccst
  notes: data.csv is a copy of raw/trait_data.csv, transcribed from Appendix A Table
    A1 (site coordinates, dominant species, maximum tree height and wood carbon isotope
    discrimination D, with ESOCLIM P, Ep and P/Ep) plus raw/location_data.csv. Table
    A1 gives D; wood δ13C is back-calculated with the paper's Eq. 2 and a δ13C of
    air of -7.8 per mil; the original D values are kept in trait_value_raw. Leaf mass
    per area data, the site 20 wood δ13C (Table A1 repeats the site 21 D for site
    20) and sampling date are taken from Alam et al. (2026) Transects_data.csv. So is
    site 1 (Eucalyptus regnans, wood δ13C only), a site from the same study that is
    not among the 19 sites in Table A1; its coordinates and species are from Alam et
    al. (2026) Transects_data.csv and Table S1, and it has no ESOCLIM P or P/Ep. Additional
    data are avilable in figures and not transcribed, Leaf N concentration and estimated
    Amass (Fig. 7), stem diameter of the measured trees (Fig. 5), and soil texture,
    organic C, nitrate and phosphate (Appendix Figs A1-A5).
identifiers: .na
