traits:
- var_in: plant_height
  unit_in: m
  trait_name: plant_height
  entity_type: population
  value_type: maximum
  basis_of_value: measurement
  replicates: 3-6
  methods: At each site, we estimated the heights of the tallest 3–6 individuals using
    a laser level (TruPulse 200, Laser Technology, Centennial, Colorado, USA). ^p
    Maximum tree height is the mean height of the tallest 3–6 individuals of the dominant
    eucalypt at each site.
- var_in: wood_delta13C
  unit_in: '{delta}[ppth]'
  trait_name: wood_delta13C
  entity_type: population
  value_type: raw
  basis_of_value: measurement
  replicates: 3
  methods: To estimate tissue carbon isotope discrimination, we sampled stem wood
    near the base of the tree rather than leaf tissue in order to reduce the noise
    in discrimination values due to the relatively short lifetime of individual leaves
    vs. the main bole, to spatial and temporal variation in conditions facing leaves
    in different parts of the canopy, and to the pooling of photosynthate over potentially
    small parts of the canopy for the construction of individual leaves. [...] Wood
    samples excluding bark from three trees were therefore collected at each site,
    using a battery drill to collect shavings from the outer 5 cm of the trunk at
    1 m height. Shavings from the three trees were pooled and dried immediately over
    silica gel. ^p Wood shavings were dried to constant mass at 80°C and finely ground.
    Sample 13C/12C was measured using an Isochrom continuous-flow mass spectrometer
    (Micromass, Manchester, UK), following combustion in a CE Instruments elemental
    analyzer (noted before Eq. 1). We converted 13C/12C ratios to discrimination values
    by assuming that air has a 13C composition of -0.0078 = -7.8‰ relative to V-PDB
    (Farquhar et al. 1989). ^p Wood δ13C of a pooled sample from three trees, calculated
    from the reported discrimination values with the same δ13C of air.
- var_in: leaf_mass_per_area
  unit_in: g/m2
  trait_name: leaf_mass_per_area
  entity_type: population
  value_type: mean
  basis_of_value: measurement
  replicates: unknown
  methods: At sites outside the Yarra Ranges, fully exposed leaves reachable from
    the ground were collected for tissue analysis; within the Yarra Ranges, leaves
    torn from the upper canopy by a recent windstorm were gleaned. Leaf tissue was
    cut into known areas, dried over silica gel and then at 80°C, and weighed to calculate
    specific leaf area (SLA, g/cm2). ^p Leaf mass per area of the dominant eucalypt
    at each site.
