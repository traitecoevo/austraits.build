  custom_R_code: ' data |> dplyr::filter(trait %in% c("leaf_epicuticular_wax_crystal_form",
    "leaf_epicuticular_wax_density", "leaf_glaucousness", "leaf_glaucousness_juvenile_leaves"))
    |> dplyr::group_by(taxon_name, location_name, trait, context) |> dplyr::filter(source_rank
    == min(source_rank)) |> dplyr::ungroup() '
  collection_date: 1963/1966
  taxon_name: taxon_name
  trait_name: trait
  value: trait_value
  location_name: location_name
  entity_type: entity_type
  measurement_remarks: trait_value_raw
  basis_of_record: basis_of_record
  life_stage: adult
  description: To determine whether leaf epicuticular wax morphology, revealed by
    electron microscopy, and wax chemistry can aid the classification of the taxonomically
    complex genus Eucalyptus.
  sampling_strategy: Wherever possible leaf material was collected from trees growing
    in their natural habitats during the course of a series of field trips around
    Australia. When this was impossible, samples were gathered from the various Australian
    arboreta and botanic gardens. In a few cases glasshouse-grown material was used
    when species otherwise unavailable were required. These were cultivated at the
    Botany School, University of Melbourne, but single leaves of certain species were
    obtained from the collection of Professor and Mrs. D. J. Carr, these being glasshouse-grown
    at the Botany Department, Queen's University, Belfast, Northern Ireland. Herbarium
    material was found in most cases to be unsuitable; it was difficult to replicate,
    and was nearly always contaminated with fungal hyphae, dust, or other debris.
    ^p A selected leaf of a healthy shoot was removed and placed in a folder designed
    to hold the leaf firmly and prevent rubbing of the waxy surface in the middle
    region of the leaf. These packets were placed in a small polyethylene bag within
    an envelope and posted to Melbourne, where replicas were produced as soon as possible.
    Voucher herbarium specimens have been kept wherever practicable and the central
    suite of these is housed in the National Herbarium of the Royal Botanical Gardens,
    Melbourne. No voucher herbarium material is kept for seedlings, but the seed sources,
    where known, are given in each case. ^p By studying the surface of leaves ranging
    in age from the very young at the shoot apex to those 10 leaves from it, some
    idea of wax form with leaf expansion and age was obtained. In the case of tube
    waxes, wax was present in large amounts even on very young leaves (c. 3 mm long)
    close to the apex. With the techniques used, no appreciable difference could be
    noted in the wax density after the fourth leaf. In the case of species with plate
    waxes, the plates were small and undifferentiated on very young leaves. They attained
    their mature form by about the fourth leaf. On older leaves there was evidence
    of weathering of the waxy structures, and atmospheric dust was a common contaminant.
    This ranged from industrial soot to clay particles and diatom shells; the latter
    two were particularly troublesome on leaf samples taken from arid areas. For these
    reasons, the abaxial surface of the fourth leaf from the apex was studied throughout.
    Studies on the adaxial surfaces of leaves showed a significant difference in wax
    distribution only in markedly dorsiventral leaves (for example, some members of
    series Corymbosae). ^p Code to collection numbers. WA, NT, SA, Q indicate field
    collection numbers from the respective States, these collections being made between
    September and November 1964. N indicates the field collection numbers from the
    Northern Territory in April 1966. Carr is a prefix indicating a collection number
    of Mrs. S. G. M. Carr. DA is a prefix indicating a collection number of Dr. D.
    H. Ashton. Letters following the collection number indicate that it was made from
    a botanical garden or some official plantation as follows - Cb Canberra Botanic
    Garden, A.C.T.; Wt Waite Institute Arboretum, Adelaide, S.A.; Wl Wail Forestry
    Nursery, Vic.; S Adelaide Botanic Gardens, Adelaide, S.A.; Ch Charlton Community
    Forest, Charlton, Vic; M Royal Botanic Gardens, Melbourne, Vic.; Cu Cultivated
    plant, not in any official arboretum or collection; VC Forests Commission, Victoria.
    Seed glasshouse-grown at the Botany School, University of Melbourne; FTBD Forestry
    and Timber Bureau, Darwin. Seed glasshouse-grown at the Botany School, University
    of Melbourne; Sn No herbarium material obtained, source of material as indicated
    by the prefixes as above, e.g. 123Wt = collection no. 123, material collected
    at the Waite Institute, South Australia. Those with a State initial following
    the collection number represent minor field collections from that State. Voucher
    specimens are housed in the National Herbarium of the Royal Botanic Gardens, Melbourne,
    Vic.
  original_file: raw/trait_data.csv (extracted from the source PDF by Claude AI, Anthropic)
  notes: data for additional traits, leaf_wax_plate_edge, leaf_wax_plate_shape, leaf_wax_plate_orientation,
    leaf_wax_plate_size, leaf_wax_tube_complexity, leaf_wax_tube_branching, leaf_wax_tube_size,
    leaf_wax_crystal_arrangement, leaf_wax_plate_tube_proportion, stem_epicuticular_wax_crystal_form,
    leaf_wax_esters, leaf_wax_beta_diketones, leaf_wax_flavonoids, leaf_wax_hydroxyl_groups,
    leaf_wax_beta_diketone_uv_absorbance. Where the same taxon x trait is reported
    in Appendix I and in Table 2, Table 4 or the text, the Appendix I value is retained.
    Appendix I and Table 2 disagree for E. terminalis (Appendix I fan-shaped crenate-digitate
    plates, almost complete cover; Table 2 and text entire-edged plates, open to sparse
    cover) and E. polycarpa (Appendix I entire-edged plates, open cover; Table 2 crenate-digitate).
    The Appendix I values are used. Text and Table 3 also differ from Appendix I for
    E. griffithsii, E. burdettiana, E. "pterocarpa", E. pilularis, E. sieberi, E.
    moorei, E. pryoriana, E. tenuiramis and E. fibrosa subsp. nubila (see notes in
    raw/trait_data.csv). basis_of_record is derived per record in raw/extra_R_code_Hallam_1970.R
    from the Appendix I collection codes (herb_coll_nos), using the paper's code key.
    State-prefixed field numbers (WA, NT, SA, Q, N, NSW), Carr, DA and Scrymgeour
    numbers, and numbers followed by a State initial are field. Garden or plantation
    suffixes (Cb, Wt, Wl, S, Ch, M, Cu), glasshouse-grown or seed-grown material,
    VC and FTBD are captive_cultivated. Records with both are 'field captive_cultivated',
    and records with no code (text, Tables 2 and 4) default to field. Port Hedland
    (WA86, planted street trees) and the Waite Arboretum are captive_cultivated. Ch
    (Charlton Community Forest) is treated as a plantation.
