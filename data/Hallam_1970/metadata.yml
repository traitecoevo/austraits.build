contexts:
- context_property: leaf type
  category: entity_context
  var_in: context
  values:
  - find: 'leaf phase: juvenile'
    value: juvenile leaves
    description: Juvenile (heteroblastic juvenile-phase) foliage.
  - find: 'leaf phase: adult'
    value: adult leaves
    description: Adult (heteroblastic adult-phase) foliage.
  - find: 'leaf age: young (not fully expanded) leaves'
    value: young leaves
    description: Youngest, not yet fully expanded leaves.
  - find: 'leaf age: fully expanded leaves'
    value: fully expanded leaves
    description: Fully expanded leaves.
traits:
- var_in: leaf_epicuticular_wax_crystal_form
  unit_in: .na
  trait_name: leaf_epicuticular_wax_crystal_form
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Carbon replicas of the abaxial surface of the fourth leaf from the shoot
    apex were examined by transmission electron microscopy (Siemens Elmskop I, 80
    kV) and the wax scored as tubes, plates, or a mixture of tubes and plates. Juvenile
    and adult leaves are recorded separately where both were examined.
- var_in: leaf_epicuticular_wax_density
  unit_in: .na
  trait_name: leaf_epicuticular_wax_density
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: Carbon replicas of the abaxial surface of the fourth leaf from the shoot
    apex were examined by transmission electron microscopy. "The wax may be present
    as a uniform cover which can be complete, i.e. with no underlying cuticle showing,
    or an open cover where cuticle is showing between the wax plates or tubes, or
    sparse where the wax is present as solitary plates or tubes."
- var_in: leaf_glaucousness
  unit_in: .na
  trait_name: leaf_glaucousness
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: '"Eucalypts may be divided into three groups according to their glaucousness:
    (1) Those which have both glaucous juvenile and mature leaves even though the
    leaf morphology may be different ... (2) Those which have glaucous juvenile leaves
    and morphologically different non-glaucous mature leaves ... (3) Those which have
    non-glaucous leaves in both juvenile and mature stages." Values are for the species
    named as examples of each group, or described as glaucous or non-glaucous in the
    results.'
- var_in: leaf_glaucousness_juvenile_leaves
  unit_in: .na
  trait_name: leaf_glaucousness_juvenile_leaves
  value_type: value_type
  basis_of_value: expert_score
  replicates: .na
  methods: '"Eucalypts may be divided into three groups according to their glaucousness:
    (1) Those which have both glaucous juvenile and mature leaves even though the
    leaf morphology may be different ... (2) Those which have glaucous juvenile leaves
    and morphologically different non-glaucous mature leaves ... (3) Those which have
    non-glaucous leaves in both juvenile and mature stages." Values are for the species
    named as examples of each group.'
